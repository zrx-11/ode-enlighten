'radio' name='q12' value='0'> 1<\/label><label class='quiz-opt'><input type='radio' name='q12' value='1'> 2<\/label><label class='quiz-opt'><input type='radio' name='q12' value='2'> 3<\/label><label class='quiz-opt'><input type='radio' name='q12' value='3'> 4<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch07__": "<h1>测验：第 7 章：一阶线性偏微分方程<\/h1><div class='quiz-item' data-qid='q13' data-type='single'><p class='quiz-q'><b>Q1.<\/b> x u_x+y u_y=0 的通解？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q13' value='0'> F(x−y)<\/label><label class='quiz-opt'><input type='radio' name='q13' value='1'> F(y/x)<\/label><label class='quiz-opt'><input type='radio' name='q13' value='2'> F(xy)<\/label><label class='quiz-opt'><input type='radio' name='q13' value='3'> F(x+y)<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q14' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 非特征条件？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q14' value='0'> a x_τ−b y_τ≠0<\/label><label class='quiz-opt'><input type='radio' name='q14' value='1'> a y_τ−b x_τ≠0<\/label><label class='quiz-opt'><input type='radio' name='q14' value='2'> a+b≠0<\/label><label class='quiz-opt'><input type='radio' name='q14' value='3'> x_τ+y_τ≠0<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch08__": "<h1>测验：第 8 章：边值问题<\/h1><div class='quiz-item' data-qid='q15' data-type='single'><p class='quiz-q'><b>Q1.<\/b> y″+π²y=0，y(0)=y(1)=0 有非零解吗？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q15' value='0'> 有<\/label><label class='quiz-opt'><input type='radio' name='q15' value='1'> 无<\/label><label class='quiz-opt'><input type='radio' name='q15' value='2'> 唯一<\/label><label class='quiz-opt'><input type='radio' name='q15' value='3'> 不确定<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q16' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 格林函数在 x=s 处？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q16' value='0'> 连续且导数跃 1<\/label><label class='quiz-opt'><input type='radio' name='q16' value='1'> 间断<\/label><label class='quiz-opt'><input type='radio' name='q16' value='2'> 导数为 0<\/label><label class='quiz-opt'><input type='radio' name='q16' value='3'> 等于 1<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz___all__": "<h1>测验：__all<\/h1><div class='quiz-item' data-qid='q17' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 解完一阶方程最容易漏什么？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q17' value='0'> 积分常数<\/label><label class='quiz-opt'><input type='radio' name='q17' value='1'> 常数解<\/label><label class='quiz-opt'><input type='radio' name='q17' value='2'> 定义域<\/label><label class='quiz-opt'><input type='radio' name='q17' value='3'> 单位<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q18' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 这本书与教材的关系？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q18' value='0'> 替代教材<\/label><label class='quiz-opt'><input type='radio' name='q18' value='1'> 配套刷题<\/label><label class='quiz-opt'><input type='radio' name='q18' value='2'> 进阶理论<\/label><label class='quiz-opt'><input type='radio' name='q18' value='3'> 习题答案汇编<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__cards__": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "__glossary__": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='曲线族'>曲线族 — 含参数的曲线集合 <span class=glossary-ref>（第 1 章：绪论与基本概念）<\/span><\/li><li data-term='通解'>通解 — 含 n 个独立常数的解 <span class=glossary-ref>（第 1 章：绪论与基本概念）<\/span><\/li><li data-term='特解'>特解 — 由初值定出的解 <span class=glossary-ref>（第 1 章：绪论与基本概念）<\/span><\/li><li data-term='等斜线'>等斜线 — 斜率相同的点的轨迹 <span class=glossary-ref>（第 1 章：绪论与基本概念）<\/span><\/li><li data-term='分离变量'>分离变量 — 变量各自归边后积分 <span class=glossary-ref>（第 2 章：一阶方程初等解法）<\/span><\/li><li data-term='积分因子'>积分因子 — 使方程恰当的乘子 <span class=glossary-ref>（第 2 章：一阶方程初等解法）<\/span><\/li><li data-term='克莱罗方程'>克莱罗方程 — y=xp+g(p) <span class=glossary-ref>（第 2 章：一阶方程初等解法）<\/span><\/li><li data-term='拉格朗日方程'>拉格朗日方程 — y=xf(p)+g(p) <span class=glossary-ref>（第 2 章：一阶方程初等解法）<\/span><\/li><li data-term='参数表示'>参数表示 — 用 p 作参数表示解 <span class=glossary-ref>（第 2 章：一阶方程初等解法）<\/span><\/li><li data-term='李普希茨'>李普希茨 — 差被常数乘距离控制 <span class=glossary-ref>（第 3 章：存在唯一性与奇解）<\/span><\/li><li data-term='皮卡迭代'>皮卡迭代 — 逐次逼近 <span class=glossary-ref>（第 3 章：存在唯一性与奇解）<\/span><\/li><li data-term='奇解'>奇解 — 族外包络 <span class=glossary-ref>（第 3 章：存在唯一性与奇解）<\/span><\/li><li data-term='最大存在区间'>最大存在区间 — 解能延伸的最大区间 <span class=glossary-ref>（第 3 章：存在唯一性与奇解）<\/span><\/li><li data-term='特征方程'>特征方程 — 常系数方程的代数式 <span class=glossary-ref>（第 4 章：高阶线性方程）<\/span><\/li><li data-term='待定系数'>待定系数 — 按右端猜特解 <span class=glossary-ref>（第 4 章：高阶线性方程）<\/span><\/li><li data-term='共振'>共振 — 右端频率等于固有频率 <span class=glossary-ref>（第 4 章：高阶线性方程）<\/span><\/li><li data-term='朗斯基行列式'>朗斯基行列式 — 判线性相关的行列式 <span class=glossary-ref>（第 4 章：高阶线性方程）<\/span><\/li><li data-term='欧拉方程'>欧拉方程 — 可用 x=eᵗ 化简的方程 <span class=glossary-ref>（第 4 章：高阶线性方程）<\/span><\/li><li data-term='基解矩阵'>基解矩阵 — 线性无关解排成的矩阵 <span class=glossary-ref>（第 5 章：线性微分方程组）<\/span><\/li><li data-term='刘维尔公式'>刘维尔公式 — det Φ=e^(t tr A) <span class=glossary-ref>（第 5 章：线性微分方程组）<\/span><\/li><li data-term='矩阵指数'>矩阵指数 — e^(At) <span class=glossary-ref>（第 5 章：线性微分方程组）<\/span><\/li><li data-term='雅可比矩阵'>雅可比矩阵 — 右端对状态的偏导 <span class=glossary-ref>（第 6 章：非线性与稳定性）<\/span><\/li><li data-term='平衡点'>平衡点 — 右端为零的点 <span class=glossary-ref>（第 6 章：非线性与稳定性）<\/span><\/li><li data-term='渐近稳定'>渐近稳定 — 稳定且趋于平衡点 <span class=glossary-ref>（第 6 章：非线性与稳定性）<\/span><\/li><li data-term='极限环'>极限环 — 孤立闭轨 <span class=glossary-ref>（第 6 章：非线性与稳定性）<\/span><\/li><li data-term='捕获域'>捕获域 — 轨线进得去出不来的区域 <span class=glossary-ref>（第 6 章：非线性与稳定性）<\/span><\/li><li data-term='首次积分'>首次积分 — 沿轨线取常数 <span class=glossary-ref>（第 7 章：一阶线性偏微分方程）<\/span><\/li><li data-term='特征线'>特征线 — PDE 沿之降为 ODE <span class=glossary-ref>（第 7 章：一阶线性偏微分方程）<\/span><\/li><li data-term='非特征条件'>非特征条件 — 初值曲线横截特征方向 <span class=glossary-ref>（第 7 章：一阶线性偏微分方程）<\/span><\/li><li data-term='格林函数'>格林函数 — 单位点源响应 <span class=glossary-ref>（第 8 章：边值问题）<\/span><\/li><li data-term='特征函数展开'>特征函数展开 — 按特征函数分解右端 <span class=glossary-ref>（第 8 章：边值问题）<\/span><\/li><li data-term='共振（边值）'>共振（边值） — λ 等于特征值 <span class=glossary-ref>（第 8 章：边值问题）<\/span><\/li><\/ul>", "__patterns__": "<h1>模式与框架库<\/h1>\n<h2>框架：四类四动作<\/h2>\n<ul><li>\n分离变量 → 积分 + 补常数解。\n<\/li><li>\n线性 → 积分因子 e^(∫P)。\n<\/li><li>\n恰当 → 凑全微分。\n<\/li><li>\n隐式 → 参数 p 降阶。\n<\/ul>\n<h2>框架：线性方程两段式<\/h2>\n<p>齐次拿基础解系，非齐次找一个特解。特解三选一：待定系数、常数变易、观察。<\/p>\n<h2>决策规则<\/h2>\n<ul><li>\n判唯一：偏导有界即可。\n<\/li><li>\n判奇解：五步走完。\n<\/li><li>\n判稳定：五步走完。\n<\/li><li>\n判边值：先看齐次。\n<\/ul>\n<h2>反模式<\/h2>\n<ul><li>\n只验一个点就说&quot;是解&quot;。\n<\/li><li>\n忽略常数解与奇解。\n<\/li><li>\n基解矩阵只验 Φ′=AΦ 忘了 det。\n<\/li><li>\n边值问题不先判齐次直接积分。\n<\/ul>", "__cheatsheet__": "<h1>速查表<\/h1>\n<h2>一阶<\/h2>\n<table><thead><tr><th>类型<\/th><th>动作<\/th><\/tr><\/thead><tbody><tr><td>分离<\/td><td>dy/g= f dx<\/td><\/tr><tr><td>线性<\/td><td>μ=e^(∫P)<\/td><\/tr><tr><td>恰当<\/td><td>P_y=Q_x<\/td><\/tr><tr><td>隐式<\/td><td>p=y′，对 x 求导<\/td><\/tr><tr><td>克莱罗<\/td><td>y=xp+g(p)<\/td><\/tr><\/tbody><\/table>\n<h2>高阶<\/h2>\n<table><thead><tr><th>根<\/th><th>解<\/th><\/tr><\/thead><tbody><tr><td>实单<\/td><td>e^(λx)<\/td><\/tr><tr><td>复<\/td><td>e^(αx)cos βx, sin<\/td><\/tr><tr><td>k 重<\/td><td>x^j e^(λx), j&lt;k<\/td><\/tr><\/tbody><\/table>\n<table><thead><tr><th>右端<\/th><th>特解<\/th><\/tr><\/thead><tbody><tr><td>e^(αx)Pₙ<\/td><td>e^(αx)Qₙx^k<\/td><\/tr><tr><td>三角<\/td><td>复指数取实部<\/td><\/tr><\/tbody><\/table>\n<h2>方程组<\/h2>\n<table><thead><tr><th>项目<\/th><th>公式<\/th><\/tr><\/thead><tbody><tr><td>基解矩阵<\/td><td>Φ′=AΦ，det≠0<\/td><\/tr><tr><td>刘维尔<\/td><td>det Φ=e^(t tr A)<\/td><\/tr><tr><td>非齐次<\/td><td>x=Φ[C+∫Φ⁻¹b]<\/td><\/tr><\/tbody><\/table>\n<h2>稳定<\/h2>\n<table><thead><tr><th>项目<\/th><th>判据<\/th><\/tr><\/thead><tbody><tr><td>线性化<\/td><td>实部全负<\/td><\/tr><tr><td>二次型<\/td><td>AᵀP+PA=−Q，P&gt;0<\/td><\/tr><tr><td>闭轨<\/td><td>捕获域 + 无平衡点<\/td><\/tr><\/tbody><\/table>\n<h2>PDE / 边值<\/h2>\n<table><thead><tr><th>项目<\/th><th>公式<\/th><\/tr><\/thead><tbody><tr><td>齐次 PDE<\/td><td>u=F(Φ)<\/td><\/tr><tr><td>非特征<\/td><td>a y_τ−b x_τ≠0<\/td><\/tr><tr><td>格林函数<\/td><td>G(x,s)，导数跃 1<\/td><\/tr><tr><td>特征展开<\/td><td>y=Σfₙ/(λₙ−λ)·φₙ<\/td><\/tr><\/tbody><\/table>"}};
const pages = DATA.rendered;
const manifest = DATA.manifest;
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const SLUG = manifest.slug || 'book';
const store = {
  get(k){ try{ return JSON.parse(localStorage.getItem(SLUG+':'+k)||'null') }catch(e){ return null } },
  set(k,v){ try{ localStorage.setItem(SLUG+':'+k, JSON.stringify(v)) }catch(e){} }
};
let state = { visited: store.get('visited')||[], quiz: store.get('quiz')||{}, cards: store.get('cards')||{} };

/* ---------- 导航 ---------- */
function renderNav(){
  const nav = $('#nav'); nav.innerHTML='';
  const build = items => items.forEach(it=>{
    if(it.children){
      const sec=document.createElement('div'); sec.className='nav-sec'; sec.textContent=it.label; nav.appendChild(sec);
      it.children.forEach(c=>{
        const a=document.createElement('a'); a.className='nav-item'; a.href=c.href; a.textContent=c.label;
        const id=routeId(c.href);
        if(state.visited.includes(id)) a.innerHTML = esc(c.label)+' <span class="done">✓</span>';
        nav.appendChild(a);
      });
    }else{
      const a=document.createElement('a'); a.className='nav-item'; a.href=it.href; a.textContent=it.label;
      const id=routeId(it.href);
      if(state.visited.includes(id)) a.innerHTML = esc(it.label)+' <span class="done">✓</span>';
      nav.appendChild(a);
    }
  });
  build(DATA.nav);
  updateProgress();
}
function routeId(href){ return href.replace('#/',''); }

/* ---------- 路由 ---------- */
function routeIdFromHash(){
  let h = location.hash.replace(/^#\//,'');
  if(!h) return 'path';
  if(h==='path') return 'path';
  const m = h.match(/^(chapter|concept)\/(.+)$/);
  if(m) return m[1]+'/'+m[2];
  return h; // quiz/all, quiz/ch01, cards, glossary, patterns, cheatsheet
}
function showPage(rid){
  const id = rid==='path' ? '__path__' : rid.startsWith('quiz/') ? '__quiz_'+rid.split('/')[1]+'__' : rid==='cards'?'__cards__':rid==='glossary'?'__glossary__':rid==='patterns'?'__patterns__':rid==='cheatsheet'?'__cheatsheet__':rid.startsWith('chapter/')?rid.split('/')[1]:rid.startsWith('concept/')?rid.split('/')[1]:rid;
  const html = pages[id] || '<div class="empty">页面不存在</div>';
  $('#view').innerHTML = html;
  document.querySelectorAll('.nav-item').forEach(a=>a.classList.toggle('active', routeId(a.getAttribute('href'))===rid));
  if(!state.visited.includes(rid) && (rid.startsWith('chapter/')||rid.startsWith('concept/'))){
    state.visited.push(rid); store.set('visited', state.visited); renderNav();
  }
  window.scrollTo(0,0);
  if(rid==='cards') initCards();
  if(rid==='glossary') initGlossary();
  if(rid.startsWith('quiz')) initQuizzes(rid);
  if(id==='__path__') updatePath();
  renderMermaid();
}

/* ---------- 进度 ---------- */
function updateProgress(){
  const chs = (manifest.chapters||[]).length;
  const done = (manifest.chapters||[]).filter(c=>state.visited.includes('chapter/'+c.id)).length;
  const pct = chs? Math.round(done/chs*100) : 0;
  $('#progress-fill').style.width = pct+'%';
  $('#progress-label').textContent = `进度 ${pct}% · 已学 ${done}/${chs} 章`;
}
function updatePath(){
  document.querySelectorAll('.path-step').forEach(el=>{
    const step = el.id.replace('path-','');
    const s = (manifest.learningPath||[]).find(x=>x.step===step);
    if(s && (s.chapterIds||[]).every(c=>state.visited.includes('chapter/'+c))){
      el.classList.add('passed');
      const lbl = el.querySelector('.checkpoint-ok'); if(!lbl){ const sp=document.createElement('span'); sp.className='done'; sp.textContent=' ✓ 已完成'; el.appendChild(sp); }
    }
  });
}

/* ---------- 测验 ---------- */
function initQuizzes(rid){
  document.querySelectorAll('.quiz-item').forEach(item=>{
    const btn = item.querySelector('.quiz-check');
    if(!btn || item.dataset.inited){ return }
    item.dataset.inited='1';
    btn.addEventListener('click', ()=>{
      const qid = item.dataset.qid; const type = item.dataset.type;
      const q = (manifest.quizzes||[]).find(x=>x.id===qid); if(!q) return;
      let user, correct=false, fb;
      if(type==='single'){
        const sel = item.querySelector('input:checked');
        user = sel? parseInt(sel.value) : null;
        correct = user===q.answer;
        fb = correct?'✓ 正确':'✗ 错误'+(user==null?'（未作答）':'');
      } else if(type==='multi'){
        user = Array.from(item.querySelectorAll('input:checked')).map(i=>parseInt(i.value)).sort();
        const ans = Array.isArray(q.answer)? q.answer.slice().sort(): [q.answer];
        correct = user.length>0 && JSON.stringify(user)===JSON.stringify(ans);
        fb = correct?'✓ 正确':'✗ 错误';
      } else if(type==='blank'){
        const v = (item.querySelector('.quiz-blank').value||'').trim().toLowerCase();
        const a = String(q.answer).trim().toLowerCase();
        correct = v===a;
        fb = correct?'✓ 正确':'✗ 错误'+(v?'':'（未作答）');
      }
      item.querySelectorAll('input:checked').forEach(i=>{
        const val=parseInt(i.value);
        if(Array.isArray(q.answer)? q.answer.includes(val) : val===q.answer) i.parentElement.style.color='var(--ok)';
        else i.parentElement.style.color='var(--bad)';
      });
      const feed = item.querySelector('.quiz-feedback');
      feed.className = 'quiz-feedback '+(correct?'fb-ok':'fb-bad');
      feed.textContent = fb;
      let ex = item.querySelector('.quiz-explain');
      if(!ex){ ex=document.createElement('div'); ex.className='quiz-explain'; item.appendChild(ex); }
      ex.innerHTML = '解析：' + esc(q.explain||'');
      // 记录成绩（按章聚合）
      const ch = q.chapterId||'__all__';
      if(!state.quiz[ch]) state.quiz[ch]={done:0,total:0};
      state.quiz[ch].done = Math.min(state.quiz[ch].total+1, state.quiz[ch].done+1);
      state.quiz[ch].total += 1;
      store.set('quiz', state.quiz);
    });
  });
}

/* ---------- 抽认卡 ---------- */
let cardIdx = 0, cardList = [];
function initCards(){
  const cards = manifest.flashcards||[];
  cardList = cards.slice();
  cardIdx = 0;
  const sel = $('#card-filter');
  sel.innerHTML = '<option value="">全部</option>';
  [...new Set(cards.map(c=>c.chapterId).filter(Boolean))].forEach(c=>{
    const o=document.createElement('option'); o.value=c; o.textContent=manifestChTitle(c); sel.appendChild(o);
  });
  sel.onchange = ()=>{ const v=sel.value; cardList = v? cards.filter(c=>c.chapterId===v): cards.slice(); cardIdx=0; showCard(); };
  $('#flashcard').onclick = ()=>$('#flashcard').classList.toggle('flip');
  $('#card-known-btn').onclick = ()=>{ markCard(true); };
  $('#card-again-btn').onclick = ()=>{ markCard(false); };
  showCard();
}
function showCard(){
  updateCardCounts();
  if(cardIdx>=cardList.length){ $('#card-stage').innerHTML='<div class="empty">本组卡片已全部复习完 🎉</div>'; return; }
  const c = cardList[cardIdx];
  document.querySelector('.fc-front').textContent = c.front;
  document.querySelector('.fc-back').textContent = c.back;
  $('#flashcard').classList.remove('flip');
}
function markCard(known){
  const c = cardList[cardIdx]; if(!c) return;
  state.cards[c.id] = known?'known':'again';
  store.set('cards', state.cards);
  cardIdx++; showCard();
}
function updateCardCounts(){
  const known = Object.values(state.cards).filter(v=>v==='known').length;
  const again = Object.values(state.cards).filter(v=>v==='again').length;
  $('#card-known').textContent = known;
  $('#card-again').textContent = again;
  $('#card-left').textContent = Math.max(0, cardList.length-cardIdx);
}
function manifestChTitle(id){
  const c=(manifest.chapters||[]).find(x=>x.id===id); return c? c.title : id;
}

/* ---------- 术语表 ---------- */
function initGlossary(){
  const input = $('#glossary-filter');
  if(!input || input.dataset.inited) return;
  input.dataset.inited='1';
  input.oninput = ()=>{
    const v = input.value.trim().toLowerCase();
    document.querySelectorAll('#glossary-list li').forEach(li=>{
      li.style.display = (!v || li.dataset.term.includes(v)) ? '' : 'none';
    });
  };
}

/* ---------- 搜索 ---------- */
let searchIndex = null;
function buildSearchIndex(){
  if(searchIndex) return searchIndex;
  searchIndex = [];
  Object.entries(pages).forEach(([id, htmlText])=>{
    if(id.startsWith('__')) return;
    const text = htmlText.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ');
    searchIndex.push({id, text});
  });
  return searchIndex;
}
$('#q').addEventListener('input', e=>{
  const v = e.target.value.trim().toLowerCase();
  if(!v){ showPage(routeIdFromHash()); return; }
  buildSearchIndex();
  const hits = searchIndex.filter(p=>p.text.toLowerCase().includes(v)).slice(0,20);
  const label = id => id.startsWith('chapter/')? ('章节：'+manifestChTitle(id.split('/')[1])) : id.startsWith('concept/')? ('概念：'+id.split('/')[1]) : id;
  $('#view').innerHTML = '<h1>搜索结果：'+esc(v)+'</h1>' +
    (hits.length? hits.map(h=>`<div class="search-hit"><a href="#/${h.id}">${esc(label(h.id))}</a><br><span class="sub">${esc(h.text.slice(0,180))}</span></div>`).join('')
                 : '<div class="empty">未找到相关页面，试试章节名/概念名/术语。</div>');
});

/* ---------- Mermaid 懒加载（联网渲染，离线显示源码） ---------- */
function renderMermaid(){
  if(!document.querySelector('.mermaid')) return;
  const s=document.createElement('script');
  s.src='https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js';
  s.onload=()=>{ try{
    mermaid.initialize({startOnLoad:false, theme: matchMedia('(prefers-color-scheme: dark)').matches?'dark':'default'});
    document.querySelectorAll('.mermaid').forEach(el=>{
      const code=el.textContent;
      mermaid.render('mm'+Math.random().toString(36).slice(2), code)
        .then(({svg})=>{ el.innerHTML=svg; })
        .catch(()=>{ el.textContent=code; });
    });
  }catch(e){} };
  document.head.appendChild(s);
}

/* ---------- 深色模式 ---------- */
const themeBtn=$('#theme-btn');
themeBtn.onclick=()=>{
  const d = document.body.dataset.theme==='dark';
  document.body.dataset.theme = d? '' : 'dark';
  themeBtn.textContent = d? '🌙 深色' : '☀️ 浅色';
};

/* ---------- 启动 ---------- */
renderNav();
window.addEventListener('hashchange', ()=>showPage(routeIdFromHash()));
(function(){
  const sb=document.querySelector('.sidebar'); if(!sb) return;
  const btn=document.createElement('button'); btn.id='nav-toggle'; btn.textContent='目录（点开选择章节）';
  btn.onclick=()=>sb.classList.toggle('open');
  sb.insertBefore(btn, sb.querySelector('#nav'));
  window.addEventListener('hashchange',()=>{ if(window.innerWidth<=760) sb.classList.remove('open'); });
})();
showPage(routeIdFromHash());
</script>
</body>
