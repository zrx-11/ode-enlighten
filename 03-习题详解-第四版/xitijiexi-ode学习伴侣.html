<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">

<title>常微分方程（第四版）习题详解</title>
<style>
:root{

}
[data-theme="dark"]{

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;

a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
.layout{display:flex;min-height:100vh}
.sidebar{width:290px;flex:none;background:var(--panel);border-right:1px solid var(--border);

.sidebar h1{font-size:17px;margin:2px 0 2px}
.sidebar .sub{font-size:12px;color:var(--muted);margin-bottom:10px}
#q{width:100%;padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);margin-bottom:10px}
.nav-sec{font-size:12px;color:var(--muted);margin:12px 0 4px;text-transform:uppercase;letter-spacing:.4px}
.nav-item{display:block;padding:5px 10px;border-radius:6px;color:var(--text);font-size:14px}
.nav-item:hover{background:var(--accent-soft);text-decoration:none}
.nav-item.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav-item .done{float:right;color:var(--ok);font-size:12px}
#nav-toggle{display:none}
.main{flex:1;min-width:0;padding:28px 40px 80px;max-width:920px}
.page h1{font-size:26px;border-bottom:2px solid var(--border);padding-bottom:8px;margin-top:0}
.page h2{font-size:20px;margin-top:26px}
.page h3{font-size:17px;margin-top:22px}
.page table{border-collapse:collapse;width:100%;margin:12px 0;font-size:14px}
.page th,.page td{border:1px solid var(--border);padding:6px 10px;text-align:left}
.page th{background:var(--code-bg)}
.page code{background:var(--code-bg);padding:2px 5px;border-radius:4px;font-size:.9em}
.page pre{background:var(--code-bg);padding:12px;border-radius:8px;overflow-x:auto;font-size:13px}
.page pre code{background:none;padding:0}
.page blockquote{border-left:4px solid var(--accent);margin:12px 0;padding:6px 14px;background:var(--accent-soft);border-radius:0 6px 6px 0}
.page blockquote blockquote{border-color:var(--muted)}
.page img{max-width:100%}
.mermaid{background:var(--code-bg);padding:14px;border-radius:8px;overflow-x:auto;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;white-space:pre;color:var(--muted)}
.mermaid-hint{font-size:12px;color:var(--muted);margin:4px 0 14px}
svg{max-width:100%;height:auto}
.quiz-item{border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin:14px 0;background:var(--panel)}
.quiz-q{margin:0 0 8px;font-weight:500}
.quiz-opts label{display:block;padding:4px 0;cursor:pointer}
.quiz-blank{width:60%;padding:6px 10px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text)}
.quiz-check{margin-top:10px;padding:6px 16px;border:none;border-radius:6px;background:var(--accent);color:#fff;cursor:pointer}
.quiz-feedback{margin-left:12px;font-size:13px}
.fb-ok{color:var(--ok)}.fb-bad{color:var(--bad)}
.quiz-explain{margin-top:8px;font-size:13px;color:var(--muted);border-top:1px dashed var(--border);padding-top:6px}
.flashcard{perspective:1200px;margin:24px auto;max-width:520px;cursor:pointer;user-select:none}
.fc-inner{position:relative;width:100%;height:240px;transform-style:preserve-3d;transition:transform .5s}
.flashcard.flip .fc-inner{transform:rotateY(180deg)}
.fc-front,.fc-back{position:absolute;inset:0;backface-visibility:hidden;display:flex;align-items:center;justify-content:center;
  padding:22px;border-radius:14px;border:1px solid var(--border);background:var(--panel);font-size:16px;text-align:center}
.fc-back{transform:rotateY(180deg);background:var(--accent-soft);color:var(--text)}
.card-controls{display:flex;gap:14px;align-items:center;margin:12px 0;flex-wrap:wrap}
.card-actions{display:flex;gap:12px;justify-content:center}
.card-actions button{padding:8px 22px;border:none;border-radius:8px;cursor:pointer;font-size:14px}
#card-known-btn{background:var(--ok);color:#fff}
#card-again-btn{background:var(--bad);color:#fff}
.card-counts{color:var(--muted);font-size:13px}
.path-step{margin:8px 0;padding:10px 12px;border:1px solid var(--border);border-radius:8px;background:var(--panel)}
.path-step.passed{border-color:var(--ok)}
#glossary-filter{width:100%;max-width:380px;padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);margin-bottom:10px}
#glossary-list li{padding:6px 0;border-bottom:1px dashed var(--border)}
.glossary-ref{color:var(--muted);font-size:12px}
.search-hit{margin:10px 0}
.topbar{position:sticky;top:0;background:var(--bg);padding:8px 0;display:flex;justify-content:flex-end;z-index:10}
#theme-btn{border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:8px;padding:5px 12px;cursor:pointer;white-space:nowrap}
#progress-bar{height:5px;background:var(--border);border-radius:3px;margin:8px 0;overflow:hidden}
#progress-bar>div{height:100%;width:0;background:var(--accent);transition:width .3s}
.empty{color:var(--muted);padding:20px 0}
@media print{.sidebar,.topbar,.quiz-actions,.card-actions,.card-controls{display:none!important}.main{max-width:none;padding:0}}
@media (max-width:760px){.sidebar{width:100%;height:auto;position:static;padding:10px 14px}

  #nav-toggle{display:block;width:100%;padding:8px 10px;margin:4px 0;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:14px;text-align:left;cursor:pointer}
  .layout{flex-direction:column}.main{padding:16px}}
</style>
</head>

single", "question": "x u_x+y u_y=0 的通解？", "options": ["F(x−y)", "F(y/x)", "F(xy)", "F(x+y)"], "answer": 1, "explain": "特征线 y/x=const。"}, {"id": "q14", "chapterId": "ch07", "type": "single", "question": "非特征条件？", "options": ["a x_τ−b y_τ≠0", "a y_τ−b x_τ≠0", "a+b≠0", "x_τ+y_τ≠0"], "answer": 1, "explain": "横截条件。"}, {"id": "q15", "chapterId": "ch08", "type": "single", "question": "y″+π²y=0，y(0)=y(1)=0 有非零解吗？", "options": ["有", "无", "唯一", "不确定"], "answer": 0, "explain": "sin πx 是解。"}, {"id": "q16", "chapterId": "ch08", "type": "single", "question": "格林函数在 x=s 处？", "options": ["连续且导数跃 1", "间断", "导数为 0", "等于 1"], "answer": 0, "explain": "δ 源特征。"}, {"id": "q17", "chapterId": "__all", "type": "single", "question": "解完一阶方程最容易漏什么？", "options": ["积分常数", "常数解", "定义域", "单位"], "answer": 1, "explain": "分离变量时丢掉 g(y)=0。"}, {"id": "q18", "chapterId": "__all", "type": "single", "question": "这本书与教材的关系？", "options": ["替代教材", "配套刷题", "进阶理论", "习题答案汇编"], "answer": 1, "explain": "定位是刷题伴侣。"}], "flashcards": [{"id": "f01", "chapterId": "ch01", "front": "n 参数曲线族对应几阶方程？", "back": "n 阶。", "tags": ["对应"]}, {"id": "f02", "chapterId": "ch01", "front": "等斜线是什么？", "back": "斜率相同的点连成的线。", "tags": ["几何"]}, {"id": "f03", "chapterId": "ch02", "front": "三个凑微分公式？", "back": "d(xy)、d(y/x)、d(ln r)。", "tags": ["技巧"]}, {"id": "f04", "chapterId": "ch02", "front": "线性方程积分因子？", "back": "e^(∫P dx)。", "tags": ["公式"]}, {"id": "f05", "chapterId": "ch03", "front": "判唯一看什么？", "back": "∂f/∂y 是否有界。", "tags": ["判据"]}, {"id": "f06", "chapterId": "ch03", "front": "奇解五步？", "back": "通解、判别式、回代、相切、李普希茨失效。", "tags": ["流程"]}, {"id": "f07", "chapterId": "ch04", "front": "共振乘 x 几次？", "back": "重数。", "tags": ["规则"]}, {"id": "f08", "chapterId": "ch04", "front": "朗斯基为零的含义？", "back": "同解时线性相关。", "tags": ["易错"]}, {"id": "f09", "chapterId": "ch05", "front": "验基解矩阵两步？", "back": "Φ′=AΦ、det≠0。", "tags": ["流程"]}, {"id": "f10", "chapterId": "ch05", "front": "刘维尔公式？", "back": "det Φ=e^(t tr A)。", "tags": ["公式"]}, {"id": "f11", "chapterId": "ch06", "front": "二次型 V 导数？", "back": "xᵀ(AᵀP+PA)x。", "tags": ["公式"]}, {"id": "f12", "chapterId": "ch06", "front": "五步稳定分析？", "back": "平衡点、J、特征值、符号、补 V。", "tags": ["流程"]}, {"id": "f13", "chapterId": "ch07", "front": "齐次 PDE 通解？", "back": "u=F(Φ)。", "tags": ["公式"]}, {"id": "f14", "chapterId": "ch07", "front": "非特征条件？", "back": "a y_τ−b x_τ≠0。", "tags": ["判据"]}, {"id": "f15", "chapterId": "ch08", "front": "格林函数三性质？", "back": "齐次、连续、导跃 1。", "tags": ["性质"]}, {"id": "f16", "chapterId": "ch08", "front": "边值共振？", "back": "λ 等于特征值。", "tags": ["易错"]}], "companion": "xitijiexi-ode学习伴侣.html"}, "pages": {"ch01": {"html": "<h1>第 1 章 绪论与基本概念：全解与例题<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★☆☆ | <strong>预估学时<\/strong>：3 小时 | <strong>前置<\/strong>：微积分\n<\/li><li>\n<strong>对应原书<\/strong>：第一章（本章教材全解 / 典型例题解析）\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n由曲线族反求微分方程并说明阶数；\n<\/li><li>\n判断一个含参数式子是解还是通解；\n<\/li><li>\n用相图语言解释一阶方程的几何意义；\n<\/li><li>\n独立完成本章同步自测。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>本章的题目几乎都是&quot;概念辨析&quot;型：<strong>不求你算，只考你分得清&quot;解&quot;&quot;通解&quot;&quot;特解&quot;&quot;奇解&quot;<\/strong>。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>1.1 由曲线族求方程<\/h3>\n<p>n 个参数 ⇒ n 阶方程。方法：对 x 求 n 次导，联立消参数。<\/p>\n<p>例：y=C₁x+C₂x²。y′=C₁+2C₂x，y″=2C₂。消去得 x²y″−2xy′+2y=0。<\/p>\n<p><strong>检验<\/strong>：直接代入 y=C₁x+C₂x²，左边 x²·2C₂−2x(C₁+2C₂x)+2(C₁x+C₂x²)=2C₂x²−2C₁x−4C₂x²+2C₁x+2C₂x²=0。成立。<\/p>\n<h3>1.2 &quot;是不是解&quot;的检验法<\/h3>\n<p>三步：求导到所需阶、代入、看是否恒等。注意恒等是对区间上所有 x 成立，不是对某个 x。<\/p>\n<h3>1.3 通解与特解<\/h3>\n<p>通解含 n 个独立常数；特解由初值定出；奇解不在通解族内且相切。<\/p>\n<p><strong>&quot;独立&quot;的含义<\/strong>：不能相互表示。C₁+C₂ 与 C₁−C₂ 不独立。<\/p>\n<h3>1.4 几何：线素场与等斜线<\/h3>\n<p>等斜线是 f(x,y)=k 的曲线，其上所有线素斜率相同。等斜线有助于手绘积分曲线。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[曲线族 含 n 参数] --&gt; B[求导 n 次]\n    B --&gt; C[消参数]\n    C --&gt; D[n 阶方程]\n    D --&gt; E[通解]\n    E --&gt; F[初值定特解]\n    E --&gt; G[奇解 族外包络]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：这张图是&quot;正向与反向&quot;两条路的合体：从族到方程，从方程到解族。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：曲线族像&quot;一叠卡片&quot;，方程是&quot;卡片的共同规则&quot;；给你规则让你复原整叠卡片，就是求通解。<\/p>\n<p><strong>失效边界<\/strong>：包络不在卡片里，所以奇解是&quot;规则之外的解&quot;。<\/p>\n<p><strong>实例<\/strong>：y=C e^(−x)+x。求其满足的方程。 y′=x+1−y？检验：y′=1−Ce^(−x)，而 x+1−y=x+1−Ce^(−x)−x=1−Ce^(−x)。成立。故方程为 y′=x+1−y，即 y′+y=x+1。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为&quot;含常数就是通解&quot;<\/strong>——常数还要独立。\n<\/li><li>\n<strong>别以为&quot;代入一个点成立就是解&quot;<\/strong>——要恒等。\n<\/li><li>\n<strong>别以为&quot;阶数等于参数个数&quot;<\/strong>——一般如此，但退化情形例外。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\ny=C₁e^x+C₂e^(−x) 满足什么方程？\n<p>（答案：y″−y=0。解析：两个参数，二阶。）<\/p>\n<\/ol>\n<ol><li>\ny=sin(x+C) 是 y′=cos(x+C) 的通解吗？\n<p>（答案：不是，应写 y′=±√(1−y²)。解析：导数要用 y 表示。）<\/p>\n<\/ol>\n<ol><li>\n等斜线的作用？\n<p>（答案：标出斜率相同的点，便于手绘积分曲线。解析：几何辅助。）<\/p>\n<\/ol>\n<ol><li>\n判断&quot;是解&quot;的关键一步？\n<p>（答案：代入后对区间上所有 x 恒等。解析：不能只验一点。）<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\nn 参数 → n 阶方程。\n<\/li><li>\n解要恒等，不是点成立。\n<\/li><li>\n通解常数须独立。\n<\/ul>", "kind": "chapter", "title": "第 1 章：绪论与基本概念"}, "ch02": {"html": "<h1>第 2 章 一阶方程初等解法：全解与例题<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：8 小时 | <strong>前置<\/strong>：第 1 章\n<\/li><li>\n<strong>对应原书<\/strong>：第二章（本章教材全解 / 典型例题解析 / 同步自测）\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n独立完成分离变量、线性、恰当、隐式四类题；\n<\/li><li>\n在恰当方程题中熟练使用分组凑微分；\n<\/li><li>\n处理 y′=f(ax+by+c) 与齐次型；\n<\/li><li>\n用参数法解 y=xf(p)+g(p) 型。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>这一章的题量最大，但套路最少：<strong>四类方程，四种固定动作<\/strong>。练到看见形式就知道动作，就算过关。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>2.1 分离变量<\/h3>\n<p>dy/g(y)=f(x)dx，两边积分。别忘了 g(y)=0 的常数解。<\/p>\n<h3>2.2 一阶线性<\/h3>\n<p>y′+P(x)y=Q(x)，μ=e^(∫P dx)，(μy)′=μQ，y=(∫μQ dx+C)/μ。<\/p>\n<p><strong>积分技巧<\/strong>：∫P dx 不用加常数（会并入 C）；μ 取正即可。<\/p>\n<h3>2.3 恰当与分组<\/h3>\n<p>把 P dx+Q dy 拆成若干&quot;明显是全微分&quot;的组：<\/p>\n<ul><li>\nx dy+y dx=d(xy)\n<\/li><li>\n(x dy−y dx)/x²=d(y/x)\n<\/li><li>\n(x dx+y dy)/(x²+y²)=d(ln√(x²+y²))\n<\/ul>\n<p><strong>这三个公式是本章的&quot;乘法口诀&quot;<\/strong>，背下来能省一半时间。<\/p>\n<h3>2.4 隐式与参数<\/h3>\n<p>y=f(x,p)：对 x 求导，p=f_x+f_p p′，解出 p 后积分。 y=xf(p)+g(p)（拉格朗日型）：对 x 求导得线性方程，解出 x(p)，再代回。<\/p>\n<h3>2.5 典型例题<\/h3>\n<p>解 y=y′x+y′²（克莱罗型）。 令 p=y′：y=px+p²。对 x 求导：p=p+p′x+2pp′，即 p′(x+2p)=0。 分支一：p′=0 ⇒ p=C ⇒ y=Cx+C²（直线族）。 分支二：x=−2p ⇒ y=−p² ⇒ y=−x²/4（奇解）。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[一阶方程] --&gt; B[分离]\n    A --&gt; C[线性]\n    A --&gt; D[恰当]\n    A --&gt; E[隐式]\n    B --&gt; F[积分]\n    C --&gt; G[积分因子 e^intP]\n    D --&gt; H[凑微分]\n    E --&gt; I[参数 p]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：四条支路，最后都落到&quot;积分&quot;。所以本章真正的难点是积分技巧，不是方程类型识别。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：四类方程像四种锁，四种钥匙。训练的目标是&quot;看锁配钥匙&quot;的速度。<\/p>\n<p><strong>实例<\/strong>：解 (x+y)dx+(x−y)dy=0。检验 P_y=1，Q_x=1，恰当。 凑：x dx+y dx+x dy−y dy = d(x²/2)+d(xy)−d(y²/2)。 故 x²/2+xy−y²/2=C，即 x²+2xy−y²=C。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为&quot;积分因子只能靠公式&quot;<\/strong>——分组凑微分常常更快。\n<\/li><li>\n<strong>别以为&quot;克莱罗方程只有一个解&quot;<\/strong>——还有奇解。\n<\/li><li>\n<strong>别以为&quot;线性方程一定要用公式&quot;<\/strong>——有时观察出 (μy)′ 更省事。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n解 y′+2xy=x。\n<p>（答案：y=1/2+Ce^(−x²)。解析：μ=e^(x²)，(ye^(x²))′=xe^(x²)。）<\/p>\n<\/ol>\n<ol><li>\n解 y′=f(3x−y)。\n<p>（答案：令 u=3x−y，u′=3−f(u)。解析：化为分离变量。）<\/p>\n<\/ol>\n<ol><li>\n克莱罗方程 y=xp+p³ 的奇解？\n<p>（答案：x=−3p²，y=−2p³，即 y=±(2/3)(−x/3)^(3/2)。解析：消参。）<\/p>\n<\/ol>\n<ol><li>\n(x+y)dx+(x−y)dy=0 的解？\n<p>（答案：x²+2xy−y²=C。解析：恰当，凑微分。）<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n四类四动作。\n<\/li><li>\n三个凑微分公式要背。\n<\/li><li>\n隐式方程用 p 降阶。\n<\/ul>", "kind": "chapter", "title": "第 2 章：一阶方程初等解法"}, "ch03": {"html": "<h1>第 3 章 存在唯一性与奇解：全解与例题<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：7 小时 | <strong>前置<\/strong>：第 2 章\n<\/li><li>\n<strong>对应原书<\/strong>：第三章（本章教材全解 / 典型例题解析）\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n用皮卡迭代算出解的前几项并估计误差；\n<\/li><li>\n判断给定方程在给定点是否唯一；\n<\/li><li>\n求奇解并完成五步检验；\n<\/li><li>\n判断解的最大存在区间。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>本章题目的标准结构是：<strong>给方程 → 判条件 → 下结论 →（若失效）构造反例<\/strong>。四步缺一不可。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>3.1 迭代与误差<\/h3>\n<p>以 y′=y，y(0)=1 为例： φ₀=1，φ₁=1+x，φ₂=1+x+x²/2，…，φₙ=Σ[k=0→n]xᵏ/k!。 误差 |φₙ−eˣ|≤e^(|x|)·|x|ⁿ⁺¹/(n+1)!。<\/p>\n<p><strong>这个估计是本章唯一需要记的公式<\/strong>。<\/p>\n<h3>3.2 判唯一<\/h3>\n<p>先算 ∂f/∂y，看它在矩形上是否有界。有界 ⇒ 唯一；无界 ⇒ 可能非唯一，需构造。<\/p>\n<h3>3.3 奇解五步<\/h3>\n<p>求通解 → C-判别式 → 回代 → 验证相切 → 确认李普希茨失效。<\/p>\n<p><strong>例<\/strong>：y′=y^(1/3)。通解 y=±(2x/3+C)^(3/2)。y=0 也是解，且与族中曲线相切（在起点处），且 y^(1/3) 在 0 处不满足李普希茨。故 y=0 是奇解。<\/p>\n<h3>3.4 最大存在区间<\/h3>\n<p>解出显式解后，看它在哪一段上连续且满足初值。y′=y²，y(0)=1 ⇒ y=1/(1−x)，区间 (−∞,1)。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[方程] --&gt; B[算 f_y]\n    B --&gt; C{有界}\n    C --&gt;|是| D[唯一 给 h]\n    C --&gt;|否| E{比值发散}\n    E --&gt;|是| F[构造非唯一解族]\n    E --&gt;|否| G[再估计]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：右侧那条&quot;构造&quot;是本章的分水岭。会构造，才算真懂。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：李普希茨条件像&quot;路口有没有护栏&quot;。有护栏（有界）则只有一条路；无护栏则可能分叉。<\/p>\n<p><strong>实例<\/strong>：y′=√(1−y²)，y(0)=0。∂f/∂y=−y/√(1−y²)，在 |y|≤1/2 上有界（≤1/√3），故局部唯一。解 y=sin x，在 |x|&lt;π/2 内有效。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为&quot;f 连续就唯一&quot;<\/strong>——连续只给存在。\n<\/li><li>\n<strong>别以为&quot;奇解一定是不连续处&quot;<\/strong>——是李普希茨失效处，f 可以连续。\n<\/li><li>\n<strong>别以为&quot;最大区间就是 R&quot;<\/strong>——要看解式。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\ny′=y^(1/3)，y(0)=0 有多少解？\n<p>（答案：无穷多。解析：y=0 与延迟出发的立方解。）<\/p>\n<\/ol>\n<ol><li>\n皮卡误差估计式？\n<p>（答案：|φₙ−y|≤M Lⁿ hⁿ⁺¹/(n+1)!。解析：阶乘收敛。）<\/p>\n<\/ol>\n<ol><li>\ny′=y²，y(0)=1 的最大区间？\n<p>（答案：(−∞,1)。解析：1/(1−x) 在 1 爆破。）<\/p>\n<\/ol>\n<ol><li>\n奇解检验的最后一步？\n<p>（答案：确认李普希茨失效。解析：否则唯一性禁止。）<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n判唯一看偏导有界。\n<\/li><li>\n奇解五步。\n<\/li><li>\n最大区间看解式定义域。\n<\/ul>", "kind": "chapter", "title": "第 3 章：存在唯一性与奇解"}, "ch04": {"html": "<h1>第 4 章 高阶线性方程：全解与例题<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：9 小时 | <strong>前置<\/strong>：第 3 章\n<\/li><li>\n<strong>对应原书<\/strong>：第四章（本章教材全解 / 典型例题解析 / 同步自测）\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n用特征根法写出任意常系数齐次方程的基础解系；\n<\/li><li>\n用待定系数法处理指数、多项式、三角右端；\n<\/li><li>\n用常数变易处理任意右端；\n<\/li><li>\n用降阶法与欧拉变换处理变系数题；\n<\/li><li>\n用朗斯基行列式判断线性相关性。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>高阶线性题的骨架永远是&quot;基础解系 + 一个特解&quot;，剩下的都是计算细节。<strong>细节里最容易错的是共振和朗斯基的符号。<\/strong><\/p>\n<h2>零基础讲解<\/h2>\n<h3>4.1 齐次三种根<\/h3>\n<p>单实根、共轭复根、重根。写基础解系时，重根必须写足 k 个。<\/p>\n<h3>4.2 待定系数<\/h3>\n<p>右端为 e^(αx)Pₙ(x) 时，设特解 e^(αx)Qₙ(x)x^k。k=α 作为特征根的重数。<\/p>\n<p>右端为 Pₙ(x)cos βx 或 sin 时，统一用复指数：解 e^(iβx)Pₙ 的特解，取实部或虚部。<\/p>\n<h3>4.3 常数变易<\/h3>\n<p>y*=Σ yᵢ∫(Wᵢ/W)f dx，其中 Wᵢ 是把 W 的第 i 列换成 (0,…,0,1)。<\/p>\n<h3>4.4 朗斯基<\/h3>\n<p>W(y₁,…,yₙ) 非零 ⇔ 线性无关（对线性方程的解而言）。<\/p>\n<p><strong>易错点<\/strong>：W 为零只说明在该点线性相关，不代表函数整体相关（除非它们都是同一方程的解）。<\/p>\n<h3>4.5 欧拉方程<\/h3>\n<p>x²y″+axy′+by=0。令 x=eᵗ，化为常系数；或用 y=x^r 试解，得 r(r−1)+ar+b=0。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[常系数齐次] --&gt; B[特征根]\n    B --&gt; C[基础解系]\n    A --&gt; D[非齐次]\n    D --&gt; E{右端}\n    E --&gt;|指数多项式| F[待定系数 + 共振]\n    E --&gt;|任意| G[常数变易]\n    A --&gt; H[变系数]\n    H --&gt; I[降阶 / 欧拉]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：中间&quot;待定系数 + 共振&quot;是本图唯一带星号的地方，也是失分集中区。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：基础解系像&quot;一组基向量&quot;，特解像&quot;平移量&quot;。任何解 = 基的组合 + 平移。<\/p>\n<p><strong>实例<\/strong>：y″+y=x。特征根 ±i。右端 x 是 0 次多项式，0 不是根，故设 y<em>=ax+b。 代入：0+ax+b=x ⇒ a=1，b=0。y<\/em>=x。 通解 y=C₁cos x+C₂sin x+x。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为&quot;W=0 就线性相关&quot;<\/strong>——只在同解情形下成立。\n<\/li><li>\n<strong>别以为&quot;欧拉方程只能用 x=eᵗ&quot;<\/strong>——y=x^r 试解也可。\n<\/li><li>\n<strong>别以为&quot;三角右端不能待定系数&quot;<\/strong>——转复指数即可。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\ny″+y=x 的特解？\n<p>（答案：x。解析：0 不是特征根，设一次多项式。）<\/p>\n<\/ol>\n<ol><li>\n朗斯基为零说明什么？\n<p>（答案：在该点线性相关；若都是同解则是整体相关。解析：注意前提。）<\/p>\n<\/ol>\n<ol><li>\n欧拉方程 x²y″+xy′−y=0 的解？\n<p>（答案：y=C₁x+C₂/x。解析：r(r−1)+r−1=r²−1=0。）<\/p>\n<\/ol>\n<ol><li>\n常数变易中 Wᵢ 怎么构造？\n<p>（答案：把 W 第 i 列换成 (0,…,1)。解析：克拉默法则。）<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n基础解系 + 特解。\n<\/li><li>\n共振看重数。\n<\/li><li>\n朗斯基判相关要注意前提。\n<\/ul>", "kind": "chapter", "title": "第 4 章：高阶线性方程"}, "ch05": {"html": "<h1>第 5 章 线性微分方程组：全解与例题<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：8 小时 | <strong>前置<\/strong>：第 4 章\n<\/li><li>\n<strong>对应原书<\/strong>：第五章（本章教材全解 / 典型例题解析）\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n写出基解矩阵并验证；\n<\/li><li>\n用特征向量、矩阵指数、拉普拉斯三种方法求常系数解；\n<\/li><li>\n用常数变易解非齐次；\n<\/li><li>\n用刘维尔公式验算行列式。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>方程组的题，只要能算出基解矩阵，剩下的都是代入。<strong>所以练的重点是&quot;算 Φ&quot;，不是&quot;背理论&quot;<\/strong>。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>5.1 基解矩阵的验证<\/h3>\n<p>Φ′=AΦ 且 det Φ≠0。两步都要验，只验一步会扣分。<\/p>\n<h3>5.2 三种算法<\/h3>\n<p><strong>特征向量<\/strong>：A 有 n 个无关特征向量，Φ=[vᵢe^(λᵢt)]。 <strong>矩阵指数<\/strong>：对角化或若尔当。 <strong>拉普拉斯<\/strong>：Φ=L⁻¹[(sI−A)⁻¹]。<\/p>\n<p>三种方法结果应一致（相差一个常数矩阵右乘）。<\/p>\n<h3>5.3 非齐次<\/h3>\n<p>x=Φ[C+∫Φ⁻¹b ds]。若 b 为常向量且 A 可逆，特解 −A⁻¹b。<\/p>\n<h3>5.4 刘维尔验算<\/h3>\n<p>det Φ(t)=det Φ(0)·e^(t tr A)。这个式子可以快速检查 Φ 算得对不对。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[方程组] --&gt; B[求基解矩阵]\n    B --&gt; C[验 Phi&#x27;=A Phi]\n    B --&gt; D[验 det 非零]\n    C --&gt; E[非齐次 常数变易]\n    D --&gt; E<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：中间两个&quot;验&quot;是本章的得分点，很多答案错在 Φ 上而自己不知道。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：基解矩阵像&quot;三条独立的运动轨迹拼成的矩阵&quot;，每列一条。<\/p>\n<p><strong>实例<\/strong>：A=[[0,1],[−1,0]]。特征值 ±i，特征向量 (1,i)、(1,−i)。 实化解：x₁=cos t，x₂=−sin t。 Φ=[[cos t, sin t],[−sin t, cos t]]，det=1。验证 Φ′=[[−sin t, cos t],[−cos t,−sin t]]，而 AΦ=[[−sin t, cos t],[−cos t,−sin t]]。一致。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为&quot;Φ 只要满足 Φ′=AΦ 就行&quot;<\/strong>——还要 det≠0。\n<\/li><li>\n<strong>别以为&quot;三种算法结果必须完全相同&quot;<\/strong>——相差常数矩阵右乘。\n<\/li><li>\n<strong>别以为&quot;刘维尔公式只用于验算&quot;<\/strong>——它也用于证明 Φ 恒可逆。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n验证基解矩阵要做哪两步？\n<p>（答案：Φ′=AΦ 且 det Φ≠0。解析：缺一不可。）<\/p>\n<\/ol>\n<ol><li>\nA 的特征值为 ±2i，实解是什么形式？\n<p>（答案：cos 2t 与 sin 2t 的组合。解析：实部虚部。）<\/p>\n<\/ol>\n<ol><li>\n刘维尔公式？\n<p>（答案：det Φ(t)=det Φ(0)e^(t tr A)。解析：迹控制行列式。）<\/p>\n<\/ol>\n<ol><li>\n非齐次常向量特解？\n<p>（答案：−A⁻¹b。解析：常特解代入。）<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n算 Φ，验两步。\n<\/li><li>\n三种算法等价。\n<\/li><li>\n刘维尔公式验算。\n<\/ul>", "kind": "chapter", "title": "第 5 章：线性微分方程组"}, "ch06": {"html": "<h1>第 6 章 非线性方程与稳定性：全解与例题<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：8 小时 | <strong>前置<\/strong>：第 5 章\n<\/li><li>\n<strong>对应原书<\/strong>：第六章（本章教材全解 / 典型例题解析 / 同步自测）\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n完整走完稳定性分析五步；\n<\/li><li>\n构造二次型 V 并验证条件；\n<\/li><li>\n判断平面系统的奇点类型与稳定性；\n<\/li><li>\n用捕获域论证闭轨存在。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>非线性题的答案不唯一，但<strong>论证结构是唯一的<\/strong>：平衡点、线性化、谱、结论或补 V。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>6.1 五步走<\/h3>\n<ol><li>\n解 f(x)=0。\n<\/li><li>\n每个平衡点算 J。\n<\/li><li>\n算特征值。\n<\/li><li>\n判符号。\n<\/li><li>\n临界时找 V 或守恒量。\n<\/ol>\n<h3>6.2 二次型 V 的构造<\/h3>\n<p>设 V=xᵀPx，要求 P 正定。V̇=xᵀ(AᵀP+PA)x，要求负定。<\/p>\n<p><strong>实操<\/strong>：解 AᵀP+PA=−I，若解出 P 正定，则渐近稳定。<\/p>\n<h3>6.3 平面奇点<\/h3>\n<p>p=tr A，q=det A，Δ=p²−4q。查表分类（结点、鞍点、焦点、中心）。<\/p>\n<h3>6.4 闭轨存在<\/h3>\n<p>构造环形区域 D：外边界上向量场指向内，内边界上指向外，且 D 内无平衡点 ⇒ 有闭轨。<\/p>\n<p><strong>实操<\/strong>：常用&quot;圆环 + 径向场符号判断&quot;。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[系统] --&gt; B[平衡点]\n    B --&gt; C[雅可比 J]\n    C --&gt; D[特征值]\n    D --&gt; E{双曲}\n    E --&gt;|是| F[查表结论]\n    E --&gt;|否| G[解 A^T P + P A = -I]\n    G --&gt; H{P 正定}\n    H --&gt;|是| I[渐近稳定]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：右侧那条&quot;解方程判 P&quot;是可计算的路径，比&quot;猜 V&quot;可靠。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：平衡点像&quot;地形上的坑与丘&quot;。V 像&quot;海拔计&quot;，V̇&lt;0 说明水往低处流。<\/p>\n<p><strong>实例<\/strong>：ẋ=−x+2y，ẏ=−2x−y。J=[[−1,2],[−2,−1]]，特征值 −1±2i，实部负 ⇒ 稳定焦点。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为&quot;线性化失效就无解&quot;<\/strong>——要另找方法。\n<\/li><li>\n<strong>别以为&quot;V 只能猜&quot;<\/strong>——线性系统有方程可解。\n<\/li><li>\n<strong>别以为&quot;捕获域随便画&quot;<\/strong>——边界上的向量方向必须验证。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n二次型 V 的导数公式？\n<p>（答案：xᵀ(AᵀP+PA)x。解析：直接求导。）<\/p>\n<\/ol>\n<ol><li>\n特征值 −1±2i 对应什么奇点？\n<p>（答案：稳定焦点。解析：复根带负实部。）<\/p>\n<\/ol>\n<ol><li>\n捕获域需要几个条件？\n<p>（答案：外边界向内、内边界向外、内部无平衡点。解析：庞加莱-本迪克松。）<\/p>\n<\/ol>\n<ol><li>\n五步流程的第一步？\n<p>（答案：解 f(x)=0 找平衡点。解析：漏了就错。）<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n五步流程。\n<\/li><li>\n二次型 V 可解方程。\n<\/li><li>\n捕获域三条件。\n<\/ul>", "kind": "chapter", "title": "第 6 章：非线性与稳定性"}, "ch07": {"html": "<h1>第 7 章 一阶线性偏微分方程：全解与例题<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：6 小时 | <strong>前置<\/strong>：第 2 章\n<\/li><li>\n<strong>对应原书<\/strong>：第七章（本章教材全解 / 典型例题解析）\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n用首次积分写出齐次 PDE 通解；\n<\/li><li>\n用特征线法解拟线性方程；\n<\/li><li>\n验证非特征条件；\n<\/li><li>\n处理含多个自变量的情形。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>PDE 题的答案形式是&quot;隐式&quot;的：<strong>F(Φ₁,Φ₂,…)=0 或 u=G(Φ)<\/strong>。这个形式本身就说明了一条轨线/一张解曲面。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>7.1 首次积分法<\/h3>\n<p>a u_x+b u_y=0。特征方程 dy/dx=b/a，解出 Φ(x,y)=C。通解 u=F(Φ)。<\/p>\n<p><strong>多变量情形<\/strong>：a₁u_x₁+…+aₙu_xₙ=0，需要 n−1 个独立首次积分，通解 u=F(Φ₁,…,Φ_{n−1})。<\/p>\n<h3>7.2 拟线性<\/h3>\n<p>特征方程组 dx/ds=a，dy/ds=b，du/ds=c。给定初始曲线参数 τ，解出含 (s,τ) 的表达式，消去得解。<\/p>\n<p><strong>隐式写法<\/strong>：Φ₁(x,y,u)=C₁，Φ₂(x,y,u)=C₂，解由 F(Φ₁,Φ₂)=0 给出。<\/p>\n<h3>7.3 非特征条件<\/h3>\n<p>a y_τ−b x_τ≠0。不满足则初始曲线与特征线相切，解不唯一。<\/p>\n<h3>7.4 典型例题<\/h3>\n<p>u_x+u_y=1，u(x,0)=x²。 特征：dx/ds=1，dy/ds=1，du/ds=1。 x=s+x₀，y=s，u=s+u₀。初始：y=0 ⇒ s=0，u₀=τ²，x₀=τ。 由 y=s 得 s=y，τ=x−y，u=y+(x−y)²。 验证：u_x=2(x−y)，u_y=1−2(x−y)，和=1。边界 u(x,0)=x²。正确。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[PDE] --&gt; B[特征方程组]\n    B --&gt; C[首次积分]\n    C --&gt; D[通解 F of Phi]\n    B --&gt; E[柯西问题]\n    E --&gt; F[非特征条件]\n    F --&gt; G[解曲面]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：左侧&quot;通解&quot;与右侧&quot;定解&quot;共用同一套特征线，区别只在是否给初始曲线。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：首次积分像&quot;地图上的等高线编号&quot;。知道编号，就知道自己在哪条线上。<\/p>\n<p><strong>实例<\/strong>：x u_x+y u_y=2u。特征：dx/ds=x，dy/ds=y，du/ds=2u。 解：x=x₀e^s，y=y₀e^s，u=u₀e^(2s)。 首次积分：y/x=y₀/x₀，u/x²=u₀/x₀²。 故 u=x²F(y/x)。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为&quot;PDE 通解只有一个任意常数&quot;<\/strong>——是任意函数。\n<\/li><li>\n<strong>别以为&quot;非特征条件可以跳过&quot;<\/strong>——不满足时解不唯一。\n<\/li><li>\n<strong>别以为&quot;消参数一定可行&quot;<\/strong>——有时只能写隐式。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\nx u_x+y u_y=0 的通解？\n<p>（答案：u=F(y/x)。解析：特征线 y/x=const。）<\/p>\n<\/ol>\n<ol><li>\n非特征条件的式子？\n<p>（答案：a y_τ−b x_τ≠0。解析：切向不能与特征向重合。）<\/p>\n<\/ol>\n<ol><li>\n三变量齐次 PDE 需要几个首次积分？\n<p>（答案：2 个。解析：n−1=2。）<\/p>\n<\/ol>\n<ol><li>\n隐式解的一般形式？\n<p>（答案：F(Φ₁,Φ₂)=0。解析：两个首次积分确定一条特征线。）<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n齐次：u=F(Φ)。\n<\/li><li>\n拟线性：特征方程组 + 初始曲线。\n<\/li><li>\n非特征条件必须验。\n<\/ul>", "kind": "chapter", "title": "第 7 章：一阶线性偏微分方程"}, "ch08": {"html": "<h1>第 8 章 边值问题：全解与例题<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：7 小时 | <strong>前置<\/strong>：第 4、6 章\n<\/li><li>\n<strong>对应原书<\/strong>：第八章（本章教材全解 / 典型例题解析 / 同步自测）\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n判断边值问题是否有唯一解；\n<\/li><li>\n求斯特姆-刘维尔问题的特征值与特征函数；\n<\/li><li>\n用格林函数表示非齐次边值问题的解；\n<\/li><li>\n处理周期边界条件。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>边值问题的解法只有三条路：<strong>直接积分（罕用）、格林函数、特征函数展开<\/strong>。选哪条取决于&quot;齐次问题有没有非零解&quot;。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>8.1 先判可解性<\/h3>\n<p>解齐次 Ly=0 加边界条件：<\/p>\n<ul><li>\n只有零解 ⇒ 对任意 f 有唯一解。\n<\/li><li>\n有非零解 ⇒ 需 ∫f·yₙ=0（正交条件），否则无解。\n<\/ul>\n<h3>8.2 格林函数<\/h3>\n<p>对 y″=f，y(0)=y(1)=0：<\/p>\n<div class=\"eq\">G(x,s)=−s(1−x)（x>s）；−x(1−s)（x<s）<\/div>\n<p>y(x)=∫₀¹G(x,s)f(s)ds。<\/p>\n<p><strong>验证<\/strong>：G 在 x=s 处连续，导数跳跃 1（这正是 δ 源的特征）。<\/p>\n<h3>8.3 特征函数展开<\/h3>\n<p>对 y″+λy=f，y(0)=y(1)=0，特征函数 sin(nπx)。展开 f=Σfₙsin(nπx)，则<\/p>\n<div class=\"eq\">y=Σ fₙ/(n²π²−λ)·sin(nπx)<\/div>\n<p>λ 等于某个特征值时出现共振（分母为零）→ 无解或无穷多解。<\/p>\n<h3>8.4 周期边界<\/h3>\n<p>y(0)=y(1)，y′(0)=y′(1)。特征函数 cos(2nπx)、sin(2nπx)（n≥1）加常数 1。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[边值问题] --&gt; B[解齐次]\n    B --&gt; C{有非零解}\n    C --&gt;|无| D[格林函数]\n    C --&gt;|有| E[正交条件]\n    E --&gt; F[满足: 无穷多解]\n    E --&gt; G[不满足: 无解]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：分叉点就是&quot;齐次有没有非零解&quot;。这一步定错，后面全错。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：格林函数像&quot;在弦上某点按一下，整根弦的形状&quot;。任意外力是无数个按压的叠加。<\/p>\n<p><strong>实例<\/strong>：y″=1，y(0)=y(1)=0。直接积分：y=x²/2+ax+b，b=0，1/2+a=0 ⇒ a=−1/2。y=x²/2−x/2=x(x−1)/2。 用格林函数：∫G(x,s)ds。分段积分应得同一结果。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为&quot;边值问题总能解&quot;<\/strong>——共振时可能无解。\n<\/li><li>\n<strong>别以为&quot;格林函数必须显式&quot;<\/strong>——也可以用特征函数展开表示。\n<\/li><li>\n<strong>别以为&quot;周期边界与分离边界一样&quot;<\/strong>——特征值结构不同。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\ny″+π²y=0，y(0)=y(1)=0 有非零解吗？\n<p>（答案：有，y=sin πx。解析：π² 是特征值。）<\/p>\n<\/ol>\n<ol><li>\n格林函数在 x=s 处的性质？\n<p>（答案：连续，导数跳跃 1。解析：对应 δ 源。）<\/p>\n<\/ol>\n<ol><li>\n共振时边值问题会怎样？\n<p>（答案：无解或无穷多解。解析：分母为零。）<\/p>\n<\/ol>\n<ol><li>\n周期边界的特征函数？\n<p>（答案：1、cos 2nπx、sin 2nπx。解析：周期条件。）<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n先判齐次。\n<\/li><li>\n格林函数 = 点源响应。\n<\/li><li>\n特征值处共振。\n<\/ul>", "kind": "chapter", "title": "第 8 章：边值问题"}, "c01": {"html": "<h1>曲线族与微分方程<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：第 1 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>含 n 个独立参数的曲线族，对应一个 n 阶常微分方程；反过来，n 阶方程的通解含 n 个参数。<\/p>\n<h2>为什么重要<\/h2>\n<p>它把&quot;几何对象（曲线族）&quot;与&quot;分析对象（方程）&quot;对应起来，是理解通解含义的第一课。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n    A[n 参数曲线族] --&gt;|求导 n 次消参数| B[n 阶方程]\n    B --&gt;|积分 n 次| C[通解]\n    C --&gt;|定初值| D[特解]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>参数独立是关键：若两个参数可以合并成一个，实际参数个数少一个，阶数也少一阶。<\/p>\n<p>反例：y=C₁x+C₂x 实际上是 (C₁+C₂)x，只有一个参数，对应一阶方程 y′=y/x。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为&quot;表达式里出现两个字母就是两个参数&quot;。\n<\/li><li>\n别以为&quot;阶数一定等于参数个数&quot;（退化时例外）。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 1 章<\/td><td>全解<\/td><td>n 参数 ↔ n 阶<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：导数\n<\/li><li>\n后续：通解、初值问题\n<\/ul>", "kind": "concept", "title": "曲线族与微分方程"}, "c02": {"html": "<h1>朗斯基行列式<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 4、5 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>由 n 个函数及其直到 n−1 阶导数排成的行列式，用于判断线性相关性。<\/p>\n<h2>为什么重要<\/h2>\n<p>它是线性方程理论里&quot;基础解系&quot;的判据，也是常数变易公式的分母。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[n 个解] --&gt; B[排朗斯基矩阵]\n    B --&gt; C[算行列式]\n    C --&gt; D{非零}\n    D --&gt;|是| E[线性无关 基础解系]\n    D --&gt;|否| F[线性相关]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>对同一线性方程的解，W 要么处处非零，要么处处为零（刘维尔公式）。这个&quot;全有或全无&quot;性质是它好用的原因。<\/p>\n<p>对一般函数，W 在某点为 0 不代表线性相关（如 x² 与 x|x|）。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 W=0 一定线性相关（要限定为同解）。\n<\/li><li>\n别以为 W 是常数（一般随 t 变）。\n<\/li><li>\n别以为 W 与解的选择无关（换基会乘常数）。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 4 章<\/td><td>基础解系<\/td><td>W≠0 判无关<\/td><\/tr><tr><td>第 5 章<\/td><td>常数变易<\/td><td>W 作分母<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：行列式\n<\/li><li>\n后续：刘维尔公式\n<\/ul>", "kind": "concept", "title": "朗斯基行列式"}, "c03": {"html": "<h1>格林函数<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：第 8 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>线性边值问题对&quot;单位点源&quot;的响应；一般右端的解由它积分叠加得到。<\/p>\n<h2>为什么重要<\/h2>\n<p>它把&quot;解微分方程&quot;变成&quot;做积分&quot;，并且把边界条件的信息全部编码进一个函数。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[单位点源 delta at s] --&gt; B[格林函数 G x s]\n    B --&gt; C[满足齐次边界]\n    C --&gt; D[任意 f 的解 = integral G f]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>G 的性质：对 x≠s 满足齐次方程；在 x=s 处连续；一阶导数跳跃 1（对应 δ）。这三条唯一确定 G。<\/p>\n<p>对称性：自伴问题的 G(x,s)=G(s,x)。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为格林函数只对二阶有效（高阶也有，但是张量）。\n<\/li><li>\n别以为 G 满足非齐次方程（它满足的是带 δ 的方程）。\n<\/li><li>\n别以为存在性无条件（共振时不存在）。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 8 章<\/td><td>边值问题<\/td><td>积分表示<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：δ 函数、边值问题\n<\/li><li>\n后续：特征函数展开\n<\/ul>", "kind": "concept", "title": "格林函数"}, "__path__": {"html": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：概念与曲线族<\/strong><br>阅读：<a href=\"#/chapter/ch01\">第 1 章：绪论与基本概念<\/a><br>检查点：由族求方程<\/li><li class='path-step' id='path-02'><strong>步骤 02：一阶解法<\/strong><br>阅读：<a href=\"#/chapter/ch02\">第 2 章：一阶方程初等解法<\/a><br>检查点：四类四动作<\/li><li class='path-step' id='path-03'><strong>步骤 03：存在唯一与奇解<\/strong><br>阅读：<a href=\"#/chapter/ch03\">第 3 章：存在唯一性与奇解<\/a><br>检查点：五步检验<\/li><li class='path-step' id='path-04'><strong>步骤 04：高阶线性<\/strong><br>阅读：<a href=\"#/chapter/ch04\">第 4 章：高阶线性方程<\/a><br>检查点：共振规则<\/li><li class='path-step' id='path-05'><strong>步骤 05：方程组<\/strong><br>阅读：<a href=\"#/chapter/ch05\">第 5 章：线性微分方程组<\/a><br>检查点：算 Φ 并验<\/li><li class='path-step' id='path-06'><strong>步骤 06：非线性稳定<\/strong><br>阅读：<a href=\"#/chapter/ch06\">第 6 章：非线性与稳定性<\/a><br>检查点：五步流程<\/li><li class='path-step' id='path-07'><strong>步骤 07：一阶 PDE<\/strong><br>阅读：<a href=\"#/chapter/ch07\">第 7 章：一阶线性偏微分方程<\/a><br>检查点：特征线法<\/li><li class='path-step' id='path-08'><strong>步骤 08：边值<\/strong><br>阅读：<a href=\"#/chapter/ch08\">第 8 章：边值问题<\/a><br>检查点：判可解<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "kind": "path", "title": "学习路径"}, "__quiz_all__": {"html": "<p>（无综合题）<\/p>", "kind": "quiz", "title": "综合测验"}, "__quiz_ch01__": {"html": "<h1>测验：第 1 章：绪论与基本概念<\/h1><div class='quiz-item' data-qid='q01' data-type='single'><p class='quiz-q'><b>Q1.<\/b> y=C₁x+C₂x² 满足的方程阶数是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q01' value='0'> 1<\/label><label class='quiz-opt'><input type='radio' name='q01' value='1'> 2<\/label><label class='quiz-opt'><input type='radio' name='q01' value='2'> 3<\/label><label class='quiz-opt'><input type='radio' name='q01' value='3'> 不确定<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q02' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 判断「是解」的关键是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q02' value='0'> 某点成立<\/label><label class='quiz-opt'><input type='radio' name='q02' value='1'> 区间上恒等<\/label><label class='quiz-opt'><input type='radio' name='q02' value='2'> 有导数<\/label><label class='quiz-opt'><input type='radio' name='q02' value='3'> 连续<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch02__": {"html": "<h1>测验：第 2 章：一阶方程初等解法<\/h1><div class='quiz-item' data-qid='q03' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 解 y′+2xy=x 的积分因子？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q03' value='0'> e^(x²)<\/label><label class='quiz-opt'><input type='radio' name='q03' value='1'> e^(2x)<\/label><label class='quiz-opt'><input type='radio' name='q03' value='2'> x²<\/label><label class='quiz-opt'><input type='radio' name='q03' value='3'> e^(−x²)<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q04' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 克莱罗方程 y=xp+p³ 的奇解？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q04' value='0'> 直线族<\/label><label class='quiz-opt'><input type='radio' name='q04' value='1'> y=−x²/4<\/label><label class='quiz-opt'><input type='radio' name='q04' value='2'> y=−2p³ 消参<\/label><label class='quiz-opt'><input type='radio' name='q04' value='3'> 无奇解<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch03__": {"html": "<h1>测验：第 3 章：存在唯一性与奇解<\/h1><div class='quiz-item' data-qid='q05' data-type='single'><p class='quiz-q'><b>Q1.<\/b> y′=y^(1/3)，y(0)=0 的解数？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q05' value='0'> 1<\/label><label class='quiz-opt'><input type='radio' name='q05' value='1'> 2<\/label><label class='quiz-opt'><input type='radio' name='q05' value='2'> 无穷多<\/label><label class='quiz-opt'><input type='radio' name='q05' value='3'> 0<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q06' data-type='single'><p class='quiz-q'><b>Q2.<\/b> y′=y²，y(0)=1 的区间？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q06' value='0'> R<\/label><label class='quiz-opt'><input type='radio' name='q06' value='1'> (−∞,1)<\/label><label class='quiz-opt'><input type='radio' name='q06' value='2'> (0,1)<\/label><label class='quiz-opt'><input type='radio' name='q06' value='3'> (1,∞)<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch04__": {"html": "<h1>测验：第 4 章：高阶线性方程<\/h1><div class='quiz-item' data-qid='q07' data-type='single'><p class='quiz-q'><b>Q1.<\/b> y″+y=x 的特解？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q07' value='0'> x<\/label><label class='quiz-opt'><input type='radio' name='q07' value='1'> x/2<\/label><label class='quiz-opt'><input type='radio' name='q07' value='2'> cos x<\/label><label class='quiz-opt'><input type='radio' name='q07' value='3'> x²<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q08' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 欧拉方程 x²y″+xy′−y=0 的解？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q08' value='0'> C₁x+C₂/x<\/label><label class='quiz-opt'><input type='radio' name='q08' value='1'> C₁cos+C₂sin<\/label><label class='quiz-opt'><input type='radio' name='q08' value='2'> C₁e^x<\/label><label class='quiz-opt'><input type='radio' name='q08' value='3'> C₁x²<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch05__": {"html": "<h1>测验：第 5 章：线性微分方程组<\/h1><div class='quiz-item' data-qid='q09' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 基解矩阵要验几步？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q09' value='0'> 1<\/label><label class='quiz-opt'><input type='radio' name='q09' value='1'> 2<\/label><label class='quiz-opt'><input type='radio' name='q09' value='2'> 3<\/label><label class='quiz-opt'><input type='radio' name='q09' value='3'> 不必验<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q10' data-type='single'><p class='quiz-q'><b>Q2.<\/b> det Φ(t) 等于？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q10' value='0'> 1<\/label><label class='quiz-opt'><input type='radio' name='q10' value='1'> det Φ(0)e^(t tr A)<\/label><label class='quiz-opt'><input type='radio' name='q10' value='2'> e^(t)<\/label><label class='quiz-opt'><input type='radio' name='q10' value='3'> det A<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch06__": {"html": "<h1>测验：第 6 章：非线性与稳定性<\/h1><div class='quiz-item' data-qid='q11' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 特征值 −1±2i 对应？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q11' value='0'> 稳定结点<\/label><label class='quiz-opt'><input type='radio' name='q11' value='1'> 稳定焦点<\/label><label class='quiz-opt'><input type='radio' name='q11' value='2'> 不稳定焦点<\/label><label class='quiz-opt'><input type='radio' name='q11' value='3'> 中心<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q12' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 捕获域需要几个条件？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q12' value='0'> 1<\/label><label class='quiz-opt'><input type='radio' name='q12' value='1'> 2<\/label><label class='quiz-opt'><input type='radio' name='q12' value='2'> 3<\/label><label class='quiz-opt'><input type='radio' name='q12' value='3'> 4<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch07__": {"html": "<h1>测验：第 7 章：一阶线性偏微分方程<\/h1><div class='quiz-item' data-qid='q13' data-type='single'><p class='quiz-q'><b>Q1.<\/b> x u_x+y u_y=0 的通解？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q13' value='0'> F(x−y)<\/label><label class='quiz-opt'><input type='radio' name='q13' value='1'> F(y/x)<\/label><label class='quiz-opt'><input type='radio' name='q13' value='2'> F(xy)<\/label><label class='quiz-opt'><input type='radio' name='q13' value='3'> F(x+y)<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q14' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 非特征条件？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q14' value='0'> a x_τ−b y_τ≠0<\/label><label class='quiz-opt'><input type='radio' name='q14' value='1'> a y_τ−b x_τ≠0<\/label><label class='quiz-opt'><input type='radio' name='q14' value='2'> a+b≠0<\/label><label class='quiz-opt'><input type='radio' name='q14' value='3'> x_τ+y_τ≠0<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch08__": {"html": "<h1>测验：第 8 章：边值问题<\/h1><div class='quiz-item' data-qid='q15' data-type='single'><p class='quiz-q'><b>Q1.<\/b> y″+π²y=0，y(0)=y(1)=0 有非零解吗？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q15' value='0'> 有<\/label><label class='quiz-opt'><input type='radio' name='q15' value='1'> 无<\/label><label class='quiz-opt'><input type='radio' name='q15' value='2'> 唯一<\/label><label class='quiz-opt'><input type='radio' name='q15' value='3'> 不确定<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q16' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 格林函数在 x=s 处？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q16' value='0'> 连续且导数跃 1<\/label><label class='quiz-opt'><input type='radio' name='q16' value='1'> 间断<\/label><label class='quiz-opt'><input type='radio' name='q16' value='2'> 导数为 0<\/label><label class='quiz-opt'><input type='radio' name='q16' value='3'> 等于 1<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz___all__": {"html": "<h1>测验：__all<\/h1><div class='quiz-item' data-qid='q17' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 解完一阶方程最容易漏什么？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q17' value='0'> 积分常数<\/label><label class='quiz-opt'><input type='radio' name='q17' value='1'> 常数解<\/label><label class='quiz-opt'><input type='radio' name='q17' value='2'> 定义域<\/label><label class='quiz-opt'><input type='radio' name='q17' value='3'> 单位<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q18' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 这本书与教材的关系？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q18' value='0'> 替代教材<\/label><label class='quiz-opt'><input type='radio' name='q18' value='1'> 配套刷题<\/label><label class='quiz-opt'><input type='radio' name='q18' value='2'> 进阶理论<\/label><label class='quiz-opt'><input type='radio' name='q18' value='3'> 习题答案汇编<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__cards__": {"html": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "kind": "cards", "title": "抽认卡"}, "__glossary__": {"html": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='曲线族'>曲线族 — 含参数的曲线集合 <span class=glossary-ref>（第 1 章：绪论与基本概念）<\/span><\/li><li data-term='通解'>通解 — 含 n 个独立常数的解 <span class=glossary-ref>（第 1 章：绪论与基本概念）<\/span><\/li><li data-term='特解'>特解 — 由初值定出的解 <span class=glossary-ref>（第 1 章：绪论与基本概念）<\/span><\/li><li data-term='等斜线'>等斜线 — 斜率相同的点的轨迹 <span class=glossary-ref>（第 1 章：绪论与基本概念）<\/span><\/li><li data-term='分离变量'>分离变量 — 变量各自归边后积分 <span class=glossary-ref>（第 2 章：一阶方程初等解法）<\/span><\/li><li data-term='积分因子'>积分因子 — 使方程恰当的乘子 <span class=glossary-ref>（第 2 章：一阶方程初等解法）<\/span><\/li><li data-term='克莱罗方程'>克莱罗方程 — y=xp+g(p) <span class=glossary-ref>（第 2 章：一阶方程初等解法）<\/span><\/li><li data-term='拉格朗日方程'>拉格朗日方程 — y=xf(p)+g(p) <span class=glossary-ref>（第 2 章：一阶方程初等解法）<\/span><\/li><li data-term='参数表示'>参数表示 — 用 p 作参数表示解 <span class=glossary-ref>（第 2 章：一阶方程初等解法）<\/span><\/li><li data-term='李普希茨'>李普希茨 — 差被常数乘距离控制 <span class=glossary-ref>（第 3 章：存在唯一性与奇解）<\/span><\/li><li data-term='皮卡迭代'>皮卡迭代 — 逐次逼近 <span class=glossary-ref>（第 3 章：存在唯一性与奇解）<\/span><\/li><li data-term='奇解'>奇解 — 族外包络 <span class=glossary-ref>（第 3 章：存在唯一性与奇解）<\/span><\/li><li data-term='最大存在区间'>最大存在区间 — 解能延伸的最大区间 <span class=glossary-ref>（第 3 章：存在唯一性与奇解）<\/span><\/li><li data-term='特征方程'>特征方程 — 常系数方程的代数式 <span class=glossary-ref>（第 4 章：高阶线性方程）<\/span><\/li><li data-term='待定系数'>待定系数 — 按右端猜特解 <span class=glossary-ref>（第 4 章：高阶线性方程）<\/span><\/li><li data-term='共振'>共振 — 右端频率等于固有频率 <span class=glossary-ref>（第 4 章：高阶线性方程）<\/span><\/li><li data-term='朗斯基行列式'>朗斯基行列式 — 判线性相关的行列式 <span class=glossary-ref>（第 4 章：高阶线性方程）<\/span><\/li><li data-term='欧拉方程'>欧拉方程 — 可用 x=eᵗ 化简的方程 <span class=glossary-ref>（第 4 章：高阶线性方程）<\/span><\/li><li data-term='基解矩阵'>基解矩阵 — 线性无关解排成的矩阵 <span class=glossary-ref>（第 5 章：线性微分方程组）<\/span><\/li><li data-term='刘维尔公式'>刘维尔公式 — det Φ=e^(t tr A) <span class=glossary-ref>（第 5 章：线性微分方程组）<\/span><\/li><li data-term='矩阵指数'>矩阵指数 — e^(At) <span class=glossary-ref>（第 5 章：线性微分方程组）<\/span><\/li><li data-term='雅可比矩阵'>雅可比矩阵 — 右端对状态的偏导 <span class=glossary-ref>（第 6 章：非线性与稳定性）<\/span><\/li><li data-term='平衡点'>平衡点 — 右端为零的点 <span class=glossary-ref>（第 6 章：非线性与稳定性）<\/span><\/li><li data-term='渐近稳定'>渐近稳定 — 稳定且趋于平衡点 <span class=glossary-ref>（第 6 章：非线性与稳定性）<\/span><\/li><li data-term='极限环'>极限环 — 孤立闭轨 <span class=glossary-ref>（第 6 章：非线性与稳定性）<\/span><\/li><li data-term='捕获域'>捕获域 — 轨线进得去出不来的区域 <span class=glossary-ref>（第 6 章：非线性与稳定性）<\/span><\/li><li data-term='首次积分'>首次积分 — 沿轨线取常数 <span class=glossary-ref>（第 7 章：一阶线性偏微分方程）<\/span><\/li><li data-term='特征线'>特征线 — PDE 沿之降为 ODE <span class=glossary-ref>（第 7 章：一阶线性偏微分方程）<\/span><\/li><li data-term='非特征条件'>非特征条件 — 初值曲线横截特征方向 <span class=glossary-ref>（第 7 章：一阶线性偏微分方程）<\/span><\/li><li data-term='格林函数'>格林函数 — 单位点源响应 <span class=glossary-ref>（第 8 章：边值问题）<\/span><\/li><li data-term='特征函数展开'>特征函数展开 — 按特征函数分解右端 <span class=glossary-ref>（第 8 章：边值问题）<\/span><\/li><li data-term='共振（边值）'>共振（边值） — λ 等于特征值 <span class=glossary-ref>（第 8 章：边值问题）<\/span><\/li><\/ul>", "kind": "glossary", "title": "术语表"}, "__patterns__": {"html": "<h1>模式与框架库<\/h1>\n<h2>框架：四类四动作<\/h2>\n<ul><li>\n分离变量 → 积分 + 补常数解。\n<\/li><li>\n线性 → 积分因子 e^(∫P)。\n<\/li><li>\n恰当 → 凑全微分。\n<\/li><li>\n隐式 → 参数 p 降阶。\n<\/ul>\n<h2>框架：线性方程两段式<\/h2>\n<p>齐次拿基础解系，非齐次找一个特解。特解三选一：待定系数、常数变易、观察。<\/p>\n<h2>决策规则<\/h2>\n<ul><li>\n判唯一：偏导有界即可。\n<\/li><li>\n判奇解：五步走完。\n<\/li><li>\n判稳定：五步走完。\n<\/li><li>\n判边值：先看齐次。\n<\/ul>\n<h2>反模式<\/h2>\n<ul><li>\n只验一个点就说&quot;是解&quot;。\n<\/li><li>\n忽略常数解与奇解。\n<\/li><li>\n基解矩阵只验 Φ′=AΦ 忘了 det。\n<\/li><li>\n边值问题不先判齐次直接积分。\n<\/ul>", "kind": "模式库", "title": "模式库"}, "__cheatsheet__": {"html": "<h1>速查表<\/h1>\n<h2>一阶<\/h2>\n<table><thead><tr><th>类型<\/th><th>动作<\/th><\/tr><\/thead><tbody><tr><td>分离<\/td><td>dy/g= f dx<\/td><\/tr><tr><td>线性<\/td><td>μ=e^(∫P)<\/td><\/tr><tr><td>恰当<\/td><td>P_y=Q_x<\/td><\/tr><tr><td>隐式<\/td><td>p=y′，对 x 求导<\/td><\/tr><tr><td>克莱罗<\/td><td>y=xp+g(p)<\/td><\/tr><\/tbody><\/table>\n<h2>高阶<\/h2>\n<table><thead><tr><th>根<\/th><th>解<\/th><\/tr><\/thead><tbody><tr><td>实单<\/td><td>e^(λx)<\/td><\/tr><tr><td>复<\/td><td>e^(αx)cos βx, sin<\/td><\/tr><tr><td>k 重<\/td><td>x^j e^(λx), j&lt;k<\/td><\/tr><\/tbody><\/table>\n<table><thead><tr><th>右端<\/th><th>特解<\/th><\/tr><\/thead><tbody><tr><td>e^(αx)Pₙ<\/td><td>e^(αx)Qₙx^k<\/td><\/tr><tr><td>三角<\/td><td>复指数取实部<\/td><\/tr><\/tbody><\/table>\n<h2>方程组<\/h2>\n<table><thead><tr><th>项目<\/th><th>公式<\/th><\/tr><\/thead><tbody><tr><td>基解矩阵<\/td><td>Φ′=AΦ，det≠0<\/td><\/tr><tr><td>刘维尔<\/td><td>det Φ=e^(t tr A)<\/td><\/tr><tr><td>非齐次<\/td><td>x=Φ[C+∫Φ⁻¹b]<\/td><\/tr><\/tbody><\/table>\n<h2>稳定<\/h2>\n<table><thead><tr><th>项目<\/th><th>判据<\/th><\/tr><\/thead><tbody><tr><td>线性化<\/td><td>实部全负<\/td><\/tr><tr><td>二次型<\/td><td>AᵀP+PA=−Q，P&gt;0<\/td><\/tr><tr><td>闭轨<\/td><td>捕获域 + 无平衡点<\/td><\/tr><\/tbody><\/table>\n<h2>PDE / 边值<\/h2>\n<table><thead><tr><th>项目<\/th><th>公式<\/th><\/tr><\/thead><tbody><tr><td>齐次 PDE<\/td><td>u=F(Φ)<\/td><\/tr><tr><td>非特征<\/td><td>a y_τ−b x_τ≠0<\/td><\/tr><tr><td>格林函数<\/td><td>G(x,s)，导数跃 1<\/td><\/tr><tr><td>特征展开<\/td><td>y=Σfₙ/(λₙ−λ)·φₙ<\/td><\/tr><\/tbody><\/table>", "kind": "速查表", "title": "速查表"}}, "base_dir": "/home/user/Doubao/chats/38451120534976514/常微分方程点化学习系统/03-习题详解-第四版", "nav": [{"label": "学习路径", "href": "#/path"}, {"label": "章节", "children": [{"label": "第 1 章：绪论与基本概念", "href": "#/chapter/ch01"}, {"label": "第 2 章：一阶方程初等解法", "href": "#/chapter/ch02"}, {"label": "第 3 章：存在唯一性与奇解", "href": "#/chapter/ch03"}, {"label": "第 4 章：高阶线性方程", "href": "#/chapter/ch04"}, {"label": "第 5 章：线性微分方程组", "href": "#/chapter/ch05"}, {"label": "第 6 章：非线性与稳定性", "href": "#/chapter/ch06"}, {"label": "第 7 章：一阶线性偏微分方程", "href": "#/chapter/ch07"}, {"label": "第 8 章：边值问题", "href": "#/chapter/ch08"}]}, {"label": "概念", "children": [{"label": "曲线族与微分方程", "href": "#/concept/c01"}, {"label": "朗斯基行列式", "href": "#/concept/c02"}, {"label": "格林函数", "href": "#/concept/c03"}]}, {"label": "测验", "children": [{"label": "综合测验", "href": "#/quiz/all"}, {"label": "测验：第 1 章：绪论与基本概念", "href": "#/quiz/ch01"}, {"label": "测验：第 2 章：一阶方程初等解法", "href": "#/quiz/ch02"}, {"label": "测验：第 3 章：存在唯一性与奇解", "href": "#/quiz/ch03"}, {"label": "测验：第 4 章：高阶线性方程", "href": "#/quiz/ch04"}, {"label": "测验：第 5 章：线性微分方程组", "href": "#/quiz/ch05"}, {"label": "测验：第 6 章：非线性与稳定性", "href": "#/quiz/ch06"}, {"label": "测验：第 7 章：一阶线性偏微分方程", "href": "#/quiz/ch07"}, {"label": "测验：第 8 章：边值问题", "href": "#/quiz/ch08"}]}, {"label": "抽认卡", "href": "#/cards"}, {"label": "术语表", "href": "#/glossary"}, {"label": "模式库", "href": "#/patterns"}, {"label": "速查表", "href": "#/cheatsheet"}], "rendered": {"ch01": "<h1>第 1 章 绪论与基本概念：全解与例题<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★☆☆ | <strong>预估学时<\/strong>：3 小时 | <strong>前置<\/strong>：微积分\n<\/li><li>\n<strong>对应原书<\/strong>：第一章（本章教材全解 / 典型例题解析）\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n由曲线族反求微分方程并说明阶数；\n<\/li><li>\n判断一个含参数式子是解还是通解；\n<\/li><li>\n用相图语言解释一阶方程的几何意义；\n<\/li><li>\n独立完成本章同步自测。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>本章的题目几乎都是&quot;概念辨析&quot;型：<strong>不求你算，只考你分得清&quot;解&quot;&quot;通解&quot;&quot;特解&quot;&quot;奇解&quot;<\/strong>。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>1.1 由曲线族求方程<\/h3>\n<p>n 个参数 ⇒ n 阶方程。方法：对 x 求 n 次导，联立消参数。<\/p>\n<p>例：y=C₁x+C₂x²。y′=C₁+2C₂x，y″=2C₂。消去得 x²y″−2xy′+2y=0。<\/p>\n<p><strong>检验<\/strong>：直接代入 y=C₁x+C₂x²，左边 x²·2C₂−2x(C₁+2C₂x)+2(C₁x+C₂x²)=2C₂x²−2C₁x−4C₂x²+2C₁x+2C₂x²=0。成立。<\/p>\n<h3>1.2 &quot;是不是解&quot;的检验法<\/h3>\n<p>三步：求导到所需阶、代入、看是否恒等。注意恒等是对区间上所有 x 成立，不是对某个 x。<\/p>\n<h3>1.3 通解与特解<\/h3>\n<p>通解含 n 个独立常数；特解由初值定出；奇解不在通解族内且相切。<\/p>\n<p><strong>&quot;独立&quot;的含义<\/strong>：不能相互表示。C₁+C₂ 与 C₁−C₂ 不独立。<\/p>\n<h3>1.4 几何：线素场与等斜线<\/h3>\n<p>等斜线是 f(x,y)=k 的曲线，其上所有线素斜率相同。等斜线有助于手绘积分曲线。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[曲线族 含 n 参数] --&gt; B[求导 n 次]\n    B --&gt; C[消参数]\n    C --&gt; D[n 阶方程]\n    D --&gt; E[通解]\n    E --&gt; F[初值定特解]\n    E --&gt; G[奇解 族外包络]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：这张图是&quot;正向与反向&quot;两条路的合体：从族到方程，从方程到解族。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：曲线族像&quot;一叠卡片&quot;，方程是&quot;卡片的共同规则&quot;；给你规则让你复原整叠卡片，就是求通解。<\/p>\n<p><strong>失效边界<\/strong>：包络不在卡片里，所以奇解是&quot;规则之外的解&quot;。<\/p>\n<p><strong>实例<\/strong>：y=C e^(−x)+x。求其满足的方程。 y′=x+1−y？检验：y′=1−Ce^(−x)，而 x+1−y=x+1−Ce^(−x)−x=1−Ce^(−x)。成立。故方程为 y′=x+1−y，即 y′+y=x+1。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为&quot;含常数就是通解&quot;<\/strong>——常数还要独立。\n<\/li><li>\n<strong>别以为&quot;代入一个点成立就是解&quot;<\/strong>——要恒等。\n<\/li><li>\n<strong>别以为&quot;阶数等于参数个数&quot;<\/strong>——一般如此，但退化情形例外。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\ny=C₁e^x+C₂e^(−x) 满足什么方程？\n<p>（答案：y″−y=0。解析：两个参数，二阶。）<\/p>\n<\/ol>\n<ol><li>\ny=sin(x+C) 是 y′=cos(x+C) 的通解吗？\n<p>（答案：不是，应写 y′=±√(1−y²)。解析：导数要用 y 表示。）<\/p>\n<\/ol>\n<ol><li>\n等斜线的作用？\n<p>（答案：标出斜率相同的点，便于手绘积分曲线。解析：几何辅助。）<\/p>\n<\/ol>\n<ol><li>\n判断&quot;是解&quot;的关键一步？\n<p>（答案：代入后对区间上所有 x 恒等。解析：不能只验一点。）<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\nn 参数 → n 阶方程。\n<\/li><li>\n解要恒等，不是点成立。\n<\/li><li>\n通解常数须独立。\n<\/ul>", "ch02": "<h1>第 2 章 一阶方程初等解法：全解与例题<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：8 小时 | <strong>前置<\/strong>：第 1 章\n<\/li><li>\n<strong>对应原书<\/strong>：第二章（本章教材全解 / 典型例题解析 / 同步自测）\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n独立完成分离变量、线性、恰当、隐式四类题；\n<\/li><li>\n在恰当方程题中熟练使用分组凑微分；\n<\/li><li>\n处理 y′=f(ax+by+c) 与齐次型；\n<\/li><li>\n用参数法解 y=xf(p)+g(p) 型。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>这一章的题量最大，但套路最少：<strong>四类方程，四种固定动作<\/strong>。练到看见形式就知道动作，就算过关。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>2.1 分离变量<\/h3>\n<p>dy/g(y)=f(x)dx，两边积分。别忘了 g(y)=0 的常数解。<\/p>\n<h3>2.2 一阶线性<\/h3>\n<p>y′+P(x)y=Q(x)，μ=e^(∫P dx)，(μy)′=μQ，y=(∫μQ dx+C)/μ。<\/p>\n<p><strong>积分技巧<\/strong>：∫P dx 不用加常数（会并入 C）；μ 取正即可。<\/p>\n<h3>2.3 恰当与分组<\/h3>\n<p>把 P dx+Q dy 拆成若干&quot;明显是全微分&quot;的组：<\/p>\n<ul><li>\nx dy+y dx=d(xy)\n<\/li><li>\n(x dy−y dx)/x²=d(y/x)\n<\/li><li>\n(x dx+y dy)/(x²+y²)=d(ln√(x²+y²))\n<\/ul>\n<p><strong>这三个公式是本章的&quot;乘法口诀&quot;<\/strong>，背下来能省一半时间。<\/p>\n<h3>2.4 隐式与参数<\/h3>\n<p>y=f(x,p)：对 x 求导，p=f_x+f_p p′，解出 p 后积分。 y=xf(p)+g(p)（拉格朗日型）：对 x 求导得线性方程，解出 x(p)，再代回。<\/p>\n<h3>2.5 典型例题<\/h3>\n<p>解 y=y′x+y′²（克莱罗型）。 令 p=y′：y=px+p²。对 x 求导：p=p+p′x+2pp′，即 p′(x+2p)=0。 分支一：p′=0 ⇒ p=C ⇒ y=Cx+C²（直线族）。 分支二：x=−2p ⇒ y=−p² ⇒ y=−x²/4（奇解）。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[一阶方程] --&gt; B[分离]\n    A --&gt; C[线性]\n    A --&gt; D[恰当]\n    A --&gt; E[隐式]\n    B --&gt; F[积分]\n    C --&gt; G[积分因子 e^intP]\n    D --&gt; H[凑微分]\n    E --&gt; I[参数 p]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：四条支路，最后都落到&quot;积分&quot;。所以本章真正的难点是积分技巧，不是方程类型识别。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：四类方程像四种锁，四种钥匙。训练的目标是&quot;看锁配钥匙&quot;的速度。<\/p>\n<p><strong>实例<\/strong>：解 (x+y)dx+(x−y)dy=0。检验 P_y=1，Q_x=1，恰当。 凑：x dx+y dx+x dy−y dy = d(x²/2)+d(xy)−d(y²/2)。 故 x²/2+xy−y²/2=C，即 x²+2xy−y²=C。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为&quot;积分因子只能靠公式&quot;<\/strong>——分组凑微分常常更快。\n<\/li><li>\n<strong>别以为&quot;克莱罗方程只有一个解&quot;<\/strong>——还有奇解。\n<\/li><li>\n<strong>别以为&quot;线性方程一定要用公式&quot;<\/strong>——有时观察出 (μy)′ 更省事。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n解 y′+2xy=x。\n<p>（答案：y=1/2+Ce^(−x²)。解析：μ=e^(x²)，(ye^(x²))′=xe^(x²)。）<\/p>\n<\/ol>\n<ol><li>\n解 y′=f(3x−y)。\n<p>（答案：令 u=3x−y，u′=3−f(u)。解析：化为分离变量。）<\/p>\n<\/ol>\n<ol><li>\n克莱罗方程 y=xp+p³ 的奇解？\n<p>（答案：x=−3p²，y=−2p³，即 y=±(2/3)(−x/3)^(3/2)。解析：消参。）<\/p>\n<\/ol>\n<ol><li>\n(x+y)dx+(x−y)dy=0 的解？\n<p>（答案：x²+2xy−y²=C。解析：恰当，凑微分。）<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n四类四动作。\n<\/li><li>\n三个凑微分公式要背。\n<\/li><li>\n隐式方程用 p 降阶。\n<\/ul>", "ch03": "<h1>第 3 章 存在唯一性与奇解：全解与例题<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：7 小时 | <strong>前置<\/strong>：第 2 章\n<\/li><li>\n<strong>对应原书<\/strong>：第三章（本章教材全解 / 典型例题解析）\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n用皮卡迭代算出解的前几项并估计误差；\n<\/li><li>\n判断给定方程在给定点是否唯一；\n<\/li><li>\n求奇解并完成五步检验；\n<\/li><li>\n判断解的最大存在区间。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>本章题目的标准结构是：<strong>给方程 → 判条件 → 下结论 →（若失效）构造反例<\/strong>。四步缺一不可。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>3.1 迭代与误差<\/h3>\n<p>以 y′=y，y(0)=1 为例： φ₀=1，φ₁=1+x，φ₂=1+x+x²/2，…，φₙ=Σ[k=0→n]xᵏ/k!。 误差 |φₙ−eˣ|≤e^(|x|)·|x|ⁿ⁺¹/(n+1)!。<\/p>\n<p><strong>这个估计是本章唯一需要记的公式<\/strong>。<\/p>\n<h3>3.2 判唯一<\/h3>\n<p>先算 ∂f/∂y，看它在矩形上是否有界。有界 ⇒ 唯一；无界 ⇒ 可能非唯一，需构造。<\/p>\n<h3>3.3 奇解五步<\/h3>\n<p>求通解 → C-判别式 → 回代 → 验证相切 → 确认李普希茨失效。<\/p>\n<p><strong>例<\/strong>：y′=y^(1/3)。通解 y=±(2x/3+C)^(3/2)。y=0 也是解，且与族中曲线相切（在起点处），且 y^(1/3) 在 0 处不满足李普希茨。故 y=0 是奇解。<\/p>\n<h3>3.4 最大存在区间<\/h3>\n<p>解出显式解后，看它在哪一段上连续且满足初值。y′=y²，y(0)=1 ⇒ y=1/(1−x)，区间 (−∞,1)。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[方程] --&gt; B[算 f_y]\n    B --&gt; C{有界}\n    C --&gt;|是| D[唯一 给 h]\n    C --&gt;|否| E{比值发散}\n    E --&gt;|是| F[构造非唯一解族]\n    E --&gt;|否| G[再估计]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：右侧那条&quot;构造&quot;是本章的分水岭。会构造，才算真懂。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：李普希茨条件像&quot;路口有没有护栏&quot;。有护栏（有界）则只有一条路；无护栏则可能分叉。<\/p>\n<p><strong>实例<\/strong>：y′=√(1−y²)，y(0)=0。∂f/∂y=−y/√(1−y²)，在 |y|≤1/2 上有界（≤1/√3），故局部唯一。解 y=sin x，在 |x|&lt;π/2 内有效。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为&quot;f 连续就唯一&quot;<\/strong>——连续只给存在。\n<\/li><li>\n<strong>别以为&quot;奇解一定是不连续处&quot;<\/strong>——是李普希茨失效处，f 可以连续。\n<\/li><li>\n<strong>别以为&quot;最大区间就是 R&quot;<\/strong>——要看解式。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\ny′=y^(1/3)，y(0)=0 有多少解？\n<p>（答案：无穷多。解析：y=0 与延迟出发的立方解。）<\/p>\n<\/ol>\n<ol><li>\n皮卡误差估计式？\n<p>（答案：|φₙ−y|≤M Lⁿ hⁿ⁺¹/(n+1)!。解析：阶乘收敛。）<\/p>\n<\/ol>\n<ol><li>\ny′=y²，y(0)=1 的最大区间？\n<p>（答案：(−∞,1)。解析：1/(1−x) 在 1 爆破。）<\/p>\n<\/ol>\n<ol><li>\n奇解检验的最后一步？\n<p>（答案：确认李普希茨失效。解析：否则唯一性禁止。）<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n判唯一看偏导有界。\n<\/li><li>\n奇解五步。\n<\/li><li>\n最大区间看解式定义域。\n<\/ul>", "ch04": "<h1>第 4 章 高阶线性方程：全解与例题<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：9 小时 | <strong>前置<\/strong>：第 3 章\n<\/li><li>\n<strong>对应原书<\/strong>：第四章（本章教材全解 / 典型例题解析 / 同步自测）\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n用特征根法写出任意常系数齐次方程的基础解系；\n<\/li><li>\n用待定系数法处理指数、多项式、三角右端；\n<\/li><li>\n用常数变易处理任意右端；\n<\/li><li>\n用降阶法与欧拉变换处理变系数题；\n<\/li><li>\n用朗斯基行列式判断线性相关性。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>高阶线性题的骨架永远是&quot;基础解系 + 一个特解&quot;，剩下的都是计算细节。<strong>细节里最容易错的是共振和朗斯基的符号。<\/strong><\/p>\n<h2>零基础讲解<\/h2>\n<h3>4.1 齐次三种根<\/h3>\n<p>单实根、共轭复根、重根。写基础解系时，重根必须写足 k 个。<\/p>\n<h3>4.2 待定系数<\/h3>\n<p>右端为 e^(αx)Pₙ(x) 时，设特解 e^(αx)Qₙ(x)x^k。k=α 作为特征根的重数。<\/p>\n<p>右端为 Pₙ(x)cos βx 或 sin 时，统一用复指数：解 e^(iβx)Pₙ 的特解，取实部或虚部。<\/p>\n<h3>4.3 常数变易<\/h3>\n<p>y*=Σ yᵢ∫(Wᵢ/W)f dx，其中 Wᵢ 是把 W 的第 i 列换成 (0,…,0,1)。<\/p>\n<h3>4.4 朗斯基<\/h3>\n<p>W(y₁,…,yₙ) 非零 ⇔ 线性无关（对线性方程的解而言）。<\/p>\n<p><strong>易错点<\/strong>：W 为零只说明在该点线性相关，不代表函数整体相关（除非它们都是同一方程的解）。<\/p>\n<h3>4.5 欧拉方程<\/h3>\n<p>x²y″+axy′+by=0。令 x=eᵗ，化为常系数；或用 y=x^r 试解，得 r(r−1)+ar+b=0。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[常系数齐次] --&gt; B[特征根]\n    B --&gt; C[基础解系]\n    A --&gt; D[非齐次]\n    D --&gt; E{右端}\n    E --&gt;|指数多项式| F[待定系数 + 共振]\n    E --&gt;|任意| G[常数变易]\n    A --&gt; H[变系数]\n    H --&gt; I[降阶 / 欧拉]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：中间&quot;待定系数 + 共振&quot;是本图唯一带星号的地方，也是失分集中区。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：基础解系像&quot;一组基向量&quot;，特解像&quot;平移量&quot;。任何解 = 基的组合 + 平移。<\/p>\n<p><strong>实例<\/strong>：y″+y=x。特征根 ±i。右端 x 是 0 次多项式，0 不是根，故设 y<em>=ax+b。 代入：0+ax+b=x ⇒ a=1，b=0。y<\/em>=x。 通解 y=C₁cos x+C₂sin x+x。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为&quot;W=0 就线性相关&quot;<\/strong>——只在同解情形下成立。\n<\/li><li>\n<strong>别以为&quot;欧拉方程只能用 x=eᵗ&quot;<\/strong>——y=x^r 试解也可。\n<\/li><li>\n<strong>别以为&quot;三角右端不能待定系数&quot;<\/strong>——转复指数即可。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\ny″+y=x 的特解？\n<p>（答案：x。解析：0 不是特征根，设一次多项式。）<\/p>\n<\/ol>\n<ol><li>\n朗斯基为零说明什么？\n<p>（答案：在该点线性相关；若都是同解则是整体相关。解析：注意前提。）<\/p>\n<\/ol>\n<ol><li>\n欧拉方程 x²y″+xy′−y=0 的解？\n<p>（答案：y=C₁x+C₂/x。解析：r(r−1)+r−1=r²−1=0。）<\/p>\n<\/ol>\n<ol><li>\n常数变易中 Wᵢ 怎么构造？\n<p>（答案：把 W 第 i 列换成 (0,…,1)。解析：克拉默法则。）<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n基础解系 + 特解。\n<\/li><li>\n共振看重数。\n<\/li><li>\n朗斯基判相关要注意前提。\n<\/ul>", "ch05": "<h1>第 5 章 线性微分方程组：全解与例题<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：8 小时 | <strong>前置<\/strong>：第 4 章\n<\/li><li>\n<strong>对应原书<\/strong>：第五章（本章教材全解 / 典型例题解析）\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n写出基解矩阵并验证；\n<\/li><li>\n用特征向量、矩阵指数、拉普拉斯三种方法求常系数解；\n<\/li><li>\n用常数变易解非齐次；\n<\/li><li>\n用刘维尔公式验算行列式。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>方程组的题，只要能算出基解矩阵，剩下的都是代入。<strong>所以练的重点是&quot;算 Φ&quot;，不是&quot;背理论&quot;<\/strong>。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>5.1 基解矩阵的验证<\/h3>\n<p>Φ′=AΦ 且 det Φ≠0。两步都要验，只验一步会扣分。<\/p>\n<h3>5.2 三种算法<\/h3>\n<p><strong>特征向量<\/strong>：A 有 n 个无关特征向量，Φ=[vᵢe^(λᵢt)]。 <strong>矩阵指数<\/strong>：对角化或若尔当。 <strong>拉普拉斯<\/strong>：Φ=L⁻¹[(sI−A)⁻¹]。<\/p>\n<p>三种方法结果应一致（相差一个常数矩阵右乘）。<\/p>\n<h3>5.3 非齐次<\/h3>\n<p>x=Φ[C+∫Φ⁻¹b ds]。若 b 为常向量且 A 可逆，特解 −A⁻¹b。<\/p>\n<h3>5.4 刘维尔验算<\/h3>\n<p>det Φ(t)=det Φ(0)·e^(t tr A)。这个式子可以快速检查 Φ 算得对不对。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[方程组] --&gt; B[求基解矩阵]\n    B --&gt; C[验 Phi&#x27;=A Phi]\n    B --&gt; D[验 det 非零]\n    C --&gt; E[非齐次 常数变易]\n    D --&gt; E<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：中间两个&quot;验&quot;是本章的得分点，很多答案错在 Φ 上而自己不知道。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：基解矩阵像&quot;三条独立的运动轨迹拼成的矩阵&quot;，每列一条。<\/p>\n<p><strong>实例<\/strong>：A=[[0,1],[−1,0]]。特征值 ±i，特征向量 (1,i)、(1,−i)。 实化解：x₁=cos t，x₂=−sin t。 Φ=[[cos t, sin t],[−sin t, cos t]]，det=1。验证 Φ′=[[−sin t, cos t],[−cos t,−sin t]]，而 AΦ=[[−sin t, cos t],[−cos t,−sin t]]。一致。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为&quot;Φ 只要满足 Φ′=AΦ 就行&quot;<\/strong>——还要 det≠0。\n<\/li><li>\n<strong>别以为&quot;三种算法结果必须完全相同&quot;<\/strong>——相差常数矩阵右乘。\n<\/li><li>\n<strong>别以为&quot;刘维尔公式只用于验算&quot;<\/strong>——它也用于证明 Φ 恒可逆。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n验证基解矩阵要做哪两步？\n<p>（答案：Φ′=AΦ 且 det Φ≠0。解析：缺一不可。）<\/p>\n<\/ol>\n<ol><li>\nA 的特征值为 ±2i，实解是什么形式？\n<p>（答案：cos 2t 与 sin 2t 的组合。解析：实部虚部。）<\/p>\n<\/ol>\n<ol><li>\n刘维尔公式？\n<p>（答案：det Φ(t)=det Φ(0)e^(t tr A)。解析：迹控制行列式。）<\/p>\n<\/ol>\n<ol><li>\n非齐次常向量特解？\n<p>（答案：−A⁻¹b。解析：常特解代入。）<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n算 Φ，验两步。\n<\/li><li>\n三种算法等价。\n<\/li><li>\n刘维尔公式验算。\n<\/ul>", "ch06": "<h1>第 6 章 非线性方程与稳定性：全解与例题<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：8 小时 | <strong>前置<\/strong>：第 5 章\n<\/li><li>\n<strong>对应原书<\/strong>：第六章（本章教材全解 / 典型例题解析 / 同步自测）\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n完整走完稳定性分析五步；\n<\/li><li>\n构造二次型 V 并验证条件；\n<\/li><li>\n判断平面系统的奇点类型与稳定性；\n<\/li><li>\n用捕获域论证闭轨存在。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>非线性题的答案不唯一，但<strong>论证结构是唯一的<\/strong>：平衡点、线性化、谱、结论或补 V。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>6.1 五步走<\/h3>\n<ol><li>\n解 f(x)=0。\n<\/li><li>\n每个平衡点算 J。\n<\/li><li>\n算特征值。\n<\/li><li>\n判符号。\n<\/li><li>\n临界时找 V 或守恒量。\n<\/ol>\n<h3>6.2 二次型 V 的构造<\/h3>\n<p>设 V=xᵀPx，要求 P 正定。V̇=xᵀ(AᵀP+PA)x，要求负定。<\/p>\n<p><strong>实操<\/strong>：解 AᵀP+PA=−I，若解出 P 正定，则渐近稳定。<\/p>\n<h3>6.3 平面奇点<\/h3>\n<p>p=tr A，q=det A，Δ=p²−4q。查表分类（结点、鞍点、焦点、中心）。<\/p>\n<h3>6.4 闭轨存在<\/h3>\n<p>构造环形区域 D：外边界上向量场指向内，内边界上指向外，且 D 内无平衡点 ⇒ 有闭轨。<\/p>\n<p><strong>实操<\/strong>：常用&quot;圆环 + 径向场符号判断&quot;。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[系统] --&gt; B[平衡点]\n    B --&gt; C[雅可比 J]\n    C --&gt; D[特征值]\n    D --&gt; E{双曲}\n    E --&gt;|是| F[查表结论]\n    E --&gt;|否| G[解 A^T P + P A = -I]\n    G --&gt; H{P 正定}\n    H --&gt;|是| I[渐近稳定]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：右侧那条&quot;解方程判 P&quot;是可计算的路径，比&quot;猜 V&quot;可靠。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：平衡点像&quot;地形上的坑与丘&quot;。V 像&quot;海拔计&quot;，V̇&lt;0 说明水往低处流。<\/p>\n<p><strong>实例<\/strong>：ẋ=−x+2y，ẏ=−2x−y。J=[[−1,2],[−2,−1]]，特征值 −1±2i，实部负 ⇒ 稳定焦点。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为&quot;线性化失效就无解&quot;<\/strong>——要另找方法。\n<\/li><li>\n<strong>别以为&quot;V 只能猜&quot;<\/strong>——线性系统有方程可解。\n<\/li><li>\n<strong>别以为&quot;捕获域随便画&quot;<\/strong>——边界上的向量方向必须验证。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n二次型 V 的导数公式？\n<p>（答案：xᵀ(AᵀP+PA)x。解析：直接求导。）<\/p>\n<\/ol>\n<ol><li>\n特征值 −1±2i 对应什么奇点？\n<p>（答案：稳定焦点。解析：复根带负实部。）<\/p>\n<\/ol>\n<ol><li>\n捕获域需要几个条件？\n<p>（答案：外边界向内、内边界向外、内部无平衡点。解析：庞加莱-本迪克松。）<\/p>\n<\/ol>\n<ol><li>\n五步流程的第一步？\n<p>（答案：解 f(x)=0 找平衡点。解析：漏了就错。）<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n五步流程。\n<\/li><li>\n二次型 V 可解方程。\n<\/li><li>\n捕获域三条件。\n<\/ul>", "ch07": "<h1>第 7 章 一阶线性偏微分方程：全解与例题<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：6 小时 | <strong>前置<\/strong>：第 2 章\n<\/li><li>\n<strong>对应原书<\/strong>：第七章（本章教材全解 / 典型例题解析）\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n用首次积分写出齐次 PDE 通解；\n<\/li><li>\n用特征线法解拟线性方程；\n<\/li><li>\n验证非特征条件；\n<\/li><li>\n处理含多个自变量的情形。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>PDE 题的答案形式是&quot;隐式&quot;的：<strong>F(Φ₁,Φ₂,…)=0 或 u=G(Φ)<\/strong>。这个形式本身就说明了一条轨线/一张解曲面。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>7.1 首次积分法<\/h3>\n<p>a u_x+b u_y=0。特征方程 dy/dx=b/a，解出 Φ(x,y)=C。通解 u=F(Φ)。<\/p>\n<p><strong>多变量情形<\/strong>：a₁u_x₁+…+aₙu_xₙ=0，需要 n−1 个独立首次积分，通解 u=F(Φ₁,…,Φ_{n−1})。<\/p>\n<h3>7.2 拟线性<\/h3>\n<p>特征方程组 dx/ds=a，dy/ds=b，du/ds=c。给定初始曲线参数 τ，解出含 (s,τ) 的表达式，消去得解。<\/p>\n<p><strong>隐式写法<\/strong>：Φ₁(x,y,u)=C₁，Φ₂(x,y,u)=C₂，解由 F(Φ₁,Φ₂)=0 给出。<\/p>\n<h3>7.3 非特征条件<\/h3>\n<p>a y_τ−b x_τ≠0。不满足则初始曲线与特征线相切，解不唯一。<\/p>\n<h3>7.4 典型例题<\/h3>\n<p>u_x+u_y=1，u(x,0)=x²。 特征：dx/ds=1，dy/ds=1，du/ds=1。 x=s+x₀，y=s，u=s+u₀。初始：y=0 ⇒ s=0，u₀=τ²，x₀=τ。 由 y=s 得 s=y，τ=x−y，u=y+(x−y)²。 验证：u_x=2(x−y)，u_y=1−2(x−y)，和=1。边界 u(x,0)=x²。正确。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[PDE] --&gt; B[特征方程组]\n    B --&gt; C[首次积分]\n    C --&gt; D[通解 F of Phi]\n    B --&gt; E[柯西问题]\n    E --&gt; F[非特征条件]\n    F --&gt; G[解曲面]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：左侧&quot;通解&quot;与右侧&quot;定解&quot;共用同一套特征线，区别只在是否给初始曲线。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：首次积分像&quot;地图上的等高线编号&quot;。知道编号，就知道自己在哪条线上。<\/p>\n<p><strong>实例<\/strong>：x u_x+y u_y=2u。特征：dx/ds=x，dy/ds=y，du/ds=2u。 解：x=x₀e^s，y=y₀e^s，u=u₀e^(2s)。 首次积分：y/x=y₀/x₀，u/x²=u₀/x₀²。 故 u=x²F(y/x)。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为&quot;PDE 通解只有一个任意常数&quot;<\/strong>——是任意函数。\n<\/li><li>\n<strong>别以为&quot;非特征条件可以跳过&quot;<\/strong>——不满足时解不唯一。\n<\/li><li>\n<strong>别以为&quot;消参数一定可行&quot;<\/strong>——有时只能写隐式。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\nx u_x+y u_y=0 的通解？\n<p>（答案：u=F(y/x)。解析：特征线 y/x=const。）<\/p>\n<\/ol>\n<ol><li>\n非特征条件的式子？\n<p>（答案：a y_τ−b x_τ≠0。解析：切向不能与特征向重合。）<\/p>\n<\/ol>\n<ol><li>\n三变量齐次 PDE 需要几个首次积分？\n<p>（答案：2 个。解析：n−1=2。）<\/p>\n<\/ol>\n<ol><li>\n隐式解的一般形式？\n<p>（答案：F(Φ₁,Φ₂)=0。解析：两个首次积分确定一条特征线。）<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n齐次：u=F(Φ)。\n<\/li><li>\n拟线性：特征方程组 + 初始曲线。\n<\/li><li>\n非特征条件必须验。\n<\/ul>", "ch08": "<h1>第 8 章 边值问题：全解与例题<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：7 小时 | <strong>前置<\/strong>：第 4、6 章\n<\/li><li>\n<strong>对应原书<\/strong>：第八章（本章教材全解 / 典型例题解析 / 同步自测）\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n判断边值问题是否有唯一解；\n<\/li><li>\n求斯特姆-刘维尔问题的特征值与特征函数；\n<\/li><li>\n用格林函数表示非齐次边值问题的解；\n<\/li><li>\n处理周期边界条件。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>边值问题的解法只有三条路：<strong>直接积分（罕用）、格林函数、特征函数展开<\/strong>。选哪条取决于&quot;齐次问题有没有非零解&quot;。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>8.1 先判可解性<\/h3>\n<p>解齐次 Ly=0 加边界条件：<\/p>\n<ul><li>\n只有零解 ⇒ 对任意 f 有唯一解。\n<\/li><li>\n有非零解 ⇒ 需 ∫f·yₙ=0（正交条件），否则无解。\n<\/ul>\n<h3>8.2 格林函数<\/h3>\n<p>对 y″=f，y(0)=y(1)=0：<\/p>\n<div class=\"eq\">G(x,s)=−s(1−x)（x>s）；−x(1−s)（x<s）<\/div>\n<p>y(x)=∫₀¹G(x,s)f(s)ds。<\/p>\n<p><strong>验证<\/strong>：G 在 x=s 处连续，导数跳跃 1（这正是 δ 源的特征）。<\/p>\n<h3>8.3 特征函数展开<\/h3>\n<p>对 y″+λy=f，y(0)=y(1)=0，特征函数 sin(nπx)。展开 f=Σfₙsin(nπx)，则<\/p>\n<div class=\"eq\">y=Σ fₙ/(n²π²−λ)·sin(nπx)<\/div>\n<p>λ 等于某个特征值时出现共振（分母为零）→ 无解或无穷多解。<\/p>\n<h3>8.4 周期边界<\/h3>\n<p>y(0)=y(1)，y′(0)=y′(1)。特征函数 cos(2nπx)、sin(2nπx)（n≥1）加常数 1。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[边值问题] --&gt; B[解齐次]\n    B --&gt; C{有非零解}\n    C --&gt;|无| D[格林函数]\n    C --&gt;|有| E[正交条件]\n    E --&gt; F[满足: 无穷多解]\n    E --&gt; G[不满足: 无解]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：分叉点就是&quot;齐次有没有非零解&quot;。这一步定错，后面全错。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：格林函数像&quot;在弦上某点按一下，整根弦的形状&quot;。任意外力是无数个按压的叠加。<\/p>\n<p><strong>实例<\/strong>：y″=1，y(0)=y(1)=0。直接积分：y=x²/2+ax+b，b=0，1/2+a=0 ⇒ a=−1/2。y=x²/2−x/2=x(x−1)/2。 用格林函数：∫G(x,s)ds。分段积分应得同一结果。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为&quot;边值问题总能解&quot;<\/strong>——共振时可能无解。\n<\/li><li>\n<strong>别以为&quot;格林函数必须显式&quot;<\/strong>——也可以用特征函数展开表示。\n<\/li><li>\n<strong>别以为&quot;周期边界与分离边界一样&quot;<\/strong>——特征值结构不同。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\ny″+π²y=0，y(0)=y(1)=0 有非零解吗？\n<p>（答案：有，y=sin πx。解析：π² 是特征值。）<\/p>\n<\/ol>\n<ol><li>\n格林函数在 x=s 处的性质？\n<p>（答案：连续，导数跳跃 1。解析：对应 δ 源。）<\/p>\n<\/ol>\n<ol><li>\n共振时边值问题会怎样？\n<p>（答案：无解或无穷多解。解析：分母为零。）<\/p>\n<\/ol>\n<ol><li>\n周期边界的特征函数？\n<p>（答案：1、cos 2nπx、sin 2nπx。解析：周期条件。）<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n先判齐次。\n<\/li><li>\n格林函数 = 点源响应。\n<\/li><li>\n特征值处共振。\n<\/ul>", "c01": "<h1>曲线族与微分方程<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：第 1 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>含 n 个独立参数的曲线族，对应一个 n 阶常微分方程；反过来，n 阶方程的通解含 n 个参数。<\/p>\n<h2>为什么重要<\/h2>\n<p>它把&quot;几何对象（曲线族）&quot;与&quot;分析对象（方程）&quot;对应起来，是理解通解含义的第一课。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n    A[n 参数曲线族] --&gt;|求导 n 次消参数| B[n 阶方程]\n    B --&gt;|积分 n 次| C[通解]\n    C --&gt;|定初值| D[特解]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>参数独立是关键：若两个参数可以合并成一个，实际参数个数少一个，阶数也少一阶。<\/p>\n<p>反例：y=C₁x+C₂x 实际上是 (C₁+C₂)x，只有一个参数，对应一阶方程 y′=y/x。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为&quot;表达式里出现两个字母就是两个参数&quot;。\n<\/li><li>\n别以为&quot;阶数一定等于参数个数&quot;（退化时例外）。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 1 章<\/td><td>全解<\/td><td>n 参数 ↔ n 阶<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：导数\n<\/li><li>\n后续：通解、初值问题\n<\/ul>", "c02": "<h1>朗斯基行列式<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 4、5 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>由 n 个函数及其直到 n−1 阶导数排成的行列式，用于判断线性相关性。<\/p>\n<h2>为什么重要<\/h2>\n<p>它是线性方程理论里&quot;基础解系&quot;的判据，也是常数变易公式的分母。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[n 个解] --&gt; B[排朗斯基矩阵]\n    B --&gt; C[算行列式]\n    C --&gt; D{非零}\n    D --&gt;|是| E[线性无关 基础解系]\n    D --&gt;|否| F[线性相关]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>对同一线性方程的解，W 要么处处非零，要么处处为零（刘维尔公式）。这个&quot;全有或全无&quot;性质是它好用的原因。<\/p>\n<p>对一般函数，W 在某点为 0 不代表线性相关（如 x² 与 x|x|）。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 W=0 一定线性相关（要限定为同解）。\n<\/li><li>\n别以为 W 是常数（一般随 t 变）。\n<\/li><li>\n别以为 W 与解的选择无关（换基会乘常数）。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 4 章<\/td><td>基础解系<\/td><td>W≠0 判无关<\/td><\/tr><tr><td>第 5 章<\/td><td>常数变易<\/td><td>W 作分母<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：行列式\n<\/li><li>\n后续：刘维尔公式\n<\/ul>", "c03": "<h1>格林函数<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：第 8 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>线性边值问题对&quot;单位点源&quot;的响应；一般右端的解由它积分叠加得到。<\/p>\n<h2>为什么重要<\/h2>\n<p>它把&quot;解微分方程&quot;变成&quot;做积分&quot;，并且把边界条件的信息全部编码进一个函数。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[单位点源 delta at s] --&gt; B[格林函数 G x s]\n    B --&gt; C[满足齐次边界]\n    C --&gt; D[任意 f 的解 = integral G f]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>G 的性质：对 x≠s 满足齐次方程；在 x=s 处连续；一阶导数跳跃 1（对应 δ）。这三条唯一确定 G。<\/p>\n<p>对称性：自伴问题的 G(x,s)=G(s,x)。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为格林函数只对二阶有效（高阶也有，但是张量）。\n<\/li><li>\n别以为 G 满足非齐次方程（它满足的是带 δ 的方程）。\n<\/li><li>\n别以为存在性无条件（共振时不存在）。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 8 章<\/td><td>边值问题<\/td><td>积分表示<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：δ 函数、边值问题\n<\/li><li>\n后续：特征函数展开\n<\/ul>", "__path__": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：概念与曲线族<\/strong><br>阅读：<a href=\"#/chapter/ch01\">第 1 章：绪论与基本概念<\/a><br>检查点：由族求方程<\/li><li class='path-step' id='path-02'><strong>步骤 02：一阶解法<\/strong><br>阅读：<a href=\"#/chapter/ch02\">第 2 章：一阶方程初等解法<\/a><br>检查点：四类四动作<\/li><li class='path-step' id='path-03'><strong>步骤 03：存在唯一与奇解<\/strong><br>阅读：<a href=\"#/chapter/ch03\">第 3 章：存在唯一性与奇解<\/a><br>检查点：五步检验<\/li><li class='path-step' id='path-04'><strong>步骤 04：高阶线性<\/strong><br>阅读：<a href=\"#/chapter/ch04\">第 4 章：高阶线性方程<\/a><br>检查点：共振规则<\/li><li class='path-step' id='path-05'><strong>步骤 05：方程组<\/strong><br>阅读：<a href=\"#/chapter/ch05\">第 5 章：线性微分方程组<\/a><br>检查点：算 Φ 并验<\/li><li class='path-step' id='path-06'><strong>步骤 06：非线性稳定<\/strong><br>阅读：<a href=\"#/chapter/ch06\">第 6 章：非线性与稳定性<\/a><br>检查点：五步流程<\/li><li class='path-step' id='path-07'><strong>步骤 07：一阶 PDE<\/strong><br>阅读：<a href=\"#/chapter/ch07\">第 7 章：一阶线性偏微分方程<\/a><br>检查点：特征线法<\/li><li class='path-step' id='path-08'><strong>步骤 08：边值<\/strong><br>阅读：<a href=\"#/chapter/ch08\">第 8 章：边值问题<\/a><br>检查点：判可解<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "__quiz_all__": "<p>（无综合题）<\/p>", "__quiz_ch01__": "<h1>测验：第 1 章：绪论与基本概念<\/h1><div class='quiz-item' data-qid='q01' data-type='single'><p class='quiz-q'><b>Q1.<\/b> y=C₁x+C₂x² 满足的方程阶数是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q01' value='0'> 1<\/label><label class='quiz-opt'><input type='radio' name='q01' value='1'> 2<\/label><label class='quiz-opt'><input type='radio' name='q01' value='2'> 3<\/label><label class='quiz-opt'><input type='radio' name='q01' value='3'> 不确定<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q02' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 判断「是解」的关键是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q02' value='0'> 某点成立<\/label><label class='quiz-opt'><input type='radio' name='q02' value='1'> 区间上恒等<\/label><label class='quiz-opt'><input type='radio' name='q02' value='2'> 有导数<\/
