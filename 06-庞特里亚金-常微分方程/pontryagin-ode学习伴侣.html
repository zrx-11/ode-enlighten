2 是二重根，通解中会出现？", "options": ["只有 e^(−2t)", "e^(−2t) 与 t e^(−2t)", "cos 2t", "e^(2t)"], "answer": 1, "explain": "重根给 t 的幂。"}, {"id": "q04", "chapterId": "ch02", "type": "single", "question": "二阶方程 λ²+aλ+b 稳定的条件？", "options": ["a>0", "b>0", "a>0 且 b>0", "a<0"], "answer": 2, "explain": "赫尔维茨判据。"}, {"id": "q05", "chapterId": "ch02", "type": "single", "question": "三阶稳定的附加不等式是？", "options": ["ab>c", "ab<c", "a>c", "b>c"], "answer": 0, "explain": "只靠系数全正不够。"}, {"id": "q06", "chapterId": "ch02", "type": "single", "question": "复振幅法的核心方程？", "options": ["(A−iωI)u=−b", "(A+iωI)u=b", "Au=0", "(A−ωI)u=b"], "answer": 0, "explain": "设 x=u e^(iωt) 代入。"}, {"id": "q07", "chapterId": "ch03", "type": "single", "question": "变系数系统为什么没有「特征值」可用？", "options": ["A 不可逆", "A(t) 随 t 变", "没有基解矩阵", "解不存在"], "answer": 1, "explain": "只有常矩阵才有固定谱。"}, {"id": "q08", "chapterId": "ch03", "type": "single", "question": "周期系数判稳用什么？", "options": ["平均矩阵", "单值矩阵的乘子", "特征多项式", "李雅普诺夫函数"], "answer": 1, "explain": "Φ(t+T)=Φ(t)M。"}, {"id": "q09", "chapterId": "ch04", "type": "single", "question": "最大区间的三种出口不含？", "options": ["到边界", "有限时间爆破", "延伸到无穷", "跳到另一支"], "answer": 3, "explain": "连续性保证不会跳支。"}, {"id": "q10", "chapterId": "ch04", "type": "single", "question": "ẋ=x²，x(0)=1 的最大区间是？", "options": ["R", "(0,1)", "(−∞,1)", "(1,+∞)"], "answer": 2, "explain": "解 1/(1−t) 在 t=1 爆破。"}, {"id": "q11", "chapterId": "ch05", "type": "single", "question": "第二方法判稳定（非渐近）的条件？", "options": ["V 正定, V̇ 负半定", "V 正定, V̇ 负定", "V 负定", "V̇>0"], "answer": 0, "explain": "负半定只给稳定。"}, {"id": "q12", "chapterId": "ch05", "type": "single", "question": "电子管振荡器的数学机制是？", "options": ["平衡点失稳 + 稳定极限环", "平衡点稳定", "无平衡点", "线性共振"], "answer": 0, "explain": "轨线被极限环捕获。"}, {"id": "q13", "chapterId": "ch05", "type": "single", "question": "极限环稳定性的判据？", "options": ["庞加莱映射导数绝对值<1", "特征值实部<0", "V̇<0", "李雅普诺夫指数>0"], "answer": 0, "explain": "绕一圈的放大率。"}, {"id": "q14", "chapterId": "ch06", "type": "single", "question": "矩阵可对角化的最小多项式条件？", "options": ["无重根", "次数等于阶数", "等于特征多项式", "常数项为 1"], "answer": 0, "explain": "无重根 ⇔ 几何重数等于代数重数。"}, {"id": "q15", "chapterId": "ch06", "type": "single", "question": "A=[[0,1],[0,0]] 的 e^(At)？", "options": ["I", "[[1,t],[0,1]]", "[[e^t,0],[0,1]]", "[[0,1],[0,0]]"], "answer": 1, "explain": "幂零部分，指数展开两项。"}, {"id": "q16", "chapterId": "__all", "type": "single", "question": "本书把电路与振荡器放进教材的主要理由是？", "options": ["增加趣味", "说明稳定性决定工程可用性", "减少证明", "替代理论"], "answer": 1, "explain": "作者在前言明确说明。"}, {"id": "q17", "chapterId": "__all", "type": "single", "question": "常系数与变系数理论的关键分界是？", "options": ["是否有基解矩阵", "是否有固定特征值", "是否可积", "是否线性"], "answer": 1, "explain": "变系数没有固定谱，判稳要靠乘子或 V。"}], "flashcards": [{"id": "f01", "chapterId": "ch01", "front": "标准方程组的定义？", "back": "ẋ=f(t,x)，一阶向量方程。", "tags": ["定义"]}, {"id": "f02", "chapterId": "ch02", "front": "重根为什么产生 t 的幂？", "back": "若尔当块/共振。", "tags": ["理解"]}, {"id": "f03", "chapterId": "ch02", "front": "赫尔维茨三阶条件？", "back": "a>0, c>0, ab>c。", "tags": ["公式"]}, {"id": "f04", "chapterId": "ch02", "front": "复振幅法怎么用？", "back": "设 u e^(iωt)，解 (A−iωI)u=−b。", "tags": ["方法"]}, {"id": "f05", "chapterId": "ch02", "front": "RLC 与弹簧系统为何同构？", "back": "同一个二阶线性方程。", "tags": ["应用"]}, {"id": "f06", "chapterId": "ch03", "front": "周期系数判稳看什么？", "back": "单值矩阵的乘子模。", "tags": ["判据"]}, {"id": "f07", "chapterId": "ch03", "front": "降阶法的前提？", "back": "已知一个非零特解。", "tags": ["方法"]}, {"id": "f08", "chapterId": "ch04", "front": "最大区间三种出口？", "back": "到边界、爆破、到无穷。", "tags": ["结论"]}, {"id": "f09", "chapterId": "ch04", "front": "首次积分有几个独立？", "back": "n−1。", "tags": ["结论"]}, {"id": "f10", "chapterId": "ch05", "front": "极限环存在判据？", "back": "平面 + 捕获域 + 无平衡点。", "tags": ["定理"]}, {"id": "f11", "chapterId": "ch05", "front": "振荡器的机制？", "back": "平衡点失稳，轨线入极限环。", "tags": ["应用"]}, {"id": "f12", "chapterId": "ch05", "front": "周期解稳定性判据？", "back": "庞加莱映射导数 <1。", "tags": ["判据"]}, {"id": "f13", "chapterId": "ch06", "front": "最小多项式的作用？", "back": "判可对角化。", "tags": ["工具"]}, {"id": "f14", "chapterId": "ch06", "front": "若尔当块大小由什么决定？", "back": "广义特征向量链长。", "tags": ["工具"]}, {"id": "f15", "chapterId": "ch06", "front": "e^(At) 一定可逆吗？", "back": "是，det=e^(tr A t)。", "tags": ["性质"]}], "companion": "pontryagin-ode学习伴侣.html"}, "pages": {"ch01": {"html": "<h1>第 1 章：引论<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：5 小时 | <strong>前置<\/strong>：微积分、复数初步\n<\/li><li>\n<strong>对应原书<\/strong>：第一章（§1–§6）\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n用&quot;标准方程组&quot;统一描述 n 阶方程与方程组；\n<\/li><li>\n说明为什么庞特里亚金把存在唯一性&quot;先叙述、后证明&quot;；\n<\/li><li>\n处理复值方程与实值方程的互化；\n<\/li><li>\n说出线性方程在这本书里为何被提前到第二章。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>第一章只做一件事：<strong>把研究对象统一成&quot;标准方程组&quot;<\/strong>。此后所有定理都只针对这一个对象陈述，包括复值情形。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>1.1 标准方程组<\/h3>\n<div class=\"eq\">dx_i/dt = f_i(t, x₁, …, xₙ)，i=1,…,n<\/div>\n<p>写成向量形式 ẋ=f(t,x)。n 阶方程通过令 x₁=y, x₂=y′,… 化为标准形。这一步是&quot;标准化&quot;，不是&quot;简化&quot;——它让所有定理只需证一次。<\/p>\n<h3>1.2 先叙述、后证明<\/h3>\n<p>庞特里亚金在第一章陈述存在唯一性定理，却把证明推到第四章。这个编排不是偷懒，而是教学策略：<strong>先用定理把几何图像建立起来，再回头补证明<\/strong>。你会在第二章反复使用定理来讨论线性方程，等用熟了，证明才有意义。<\/p>\n<h3>1.3 复值方程<\/h3>\n<p>若 f 取复值，可写成实部虚部两个实方程：<\/p>\n<div class=\"eq\">ż = f(t,z) ⇔ ẋ=Re f，ẏ=Im f（z=x+iy）<\/div>\n<p>反过来，两个实方程常可合并成一个复方程，这在平面线性系统里特别有用（复特征值对应旋转）。<\/p>\n<h3>1.4 线性方程预览<\/h3>\n<p>本章最后一节给出线性方程的基本事实：解集是线性空间、齐次解可叠加。这些在第二章会被反复使用。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[n 阶方程] --&gt; B[令 x1=y x2=y&#x27; ...]\n    B --&gt; C[标准方程组]\n    C --&gt; D[存在唯一性定理]\n    D --&gt; E[第二章 线性方程]\n    C --&gt; F[复值情形 拆实虚部]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：这张图的中心是&quot;标准方程组&quot;。左边是入口，右边是全书的走向。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：标准方程组像&quot;统一货币&quot;。不同国家的方程（高阶、方程组、复值）先换成同一种货币，才能用同一套定理结算。<\/p>\n<p><strong>失效边界<\/strong>：隐式方程 F(t,x,ẋ)=0 未必能解出 ẋ，此时无法标准化，需要隐函数定理的条件。<\/p>\n<p><strong>实例<\/strong>：y″+ω²y=0。令 x₁=y，x₂=y′，得 ẋ₁=x₂，ẋ₂=−ω²x₁。这是一个标准方程组，其解是 (cos ωt, −ω sin ωt) 的线性组合。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为&quot;标准化只是换记号&quot;<\/strong>——实际上它改变了定理的适用范围（从 n 阶到一阶向量）。\n<\/li><li>\n<strong>别以为&quot;复方程是另一套理论&quot;<\/strong>——实际上它等价于两个实方程。\n<\/li><li>\n<strong>别以为&quot;存在唯一性可以先用后证&quot;<\/strong>——实际上教材这么做是有意的教学顺序，自学时要知道证明在后面。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n三阶方程 y‴=f(t,y,y′,y″) 的标准形是什么？\n<p>（答案：ẋ₁=x₂，ẋ₂=x₃，ẋ₃=f(t,x₁,x₂,x₃)。解析：逐级引入低阶导数。）<\/p>\n<\/ol>\n<ol><li>\n复方程 ż=iz 对应的实方程组？\n<p>（答案：ẋ=−y，ẏ=x。解析：iz=i(x+iy)=−y+ix。）<\/p>\n<\/ol>\n<ol><li>\n为什么第一章先叙述定理后证明？\n<p>（答案：先用几何图像建立直觉，证明放在第四章。解析：教学顺序的安排。）<\/p>\n<\/ol>\n<ol><li>\n隐式方程何时不能标准化？\n<p>（答案：无法解出最高阶导数时。解析：需要隐函数定理的非退化条件。）<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n一切化为标准方程组 ẋ=f(t,x)。\n<\/li><li>\n复方程 = 两个实方程。\n<\/li><li>\n定理先叙述，证明在第四章。\n<\/ul>", "kind": "chapter", "title": "第 1 章：引论"}, "ch02": {"html": "<h1>第 2 章：常系数线性方程<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：12 小时 | <strong>前置<\/strong>：第 1 章、线性代数\n<\/li><li>\n<strong>对应原书<\/strong>：第二章（§7–§16）\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n按单根、重根两种情形写出常系数齐次方程的通解；\n<\/li><li>\n用赫尔维茨判据（稳定多项式）判断所有根是否具有负实部；\n<\/li><li>\n用消去法把方程组化为一元高阶方程；\n<\/li><li>\n用复数振幅法求正弦激励下的稳态解；\n<\/li><li>\n建立 RLC 电路与线性系统的对应；\n<\/li><li>\n在相平面上画出常系数线性系统的轨线。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>庞特里亚金这一章的重心不在&quot;怎么解&quot;，而在&quot;解的形状意味着什么&quot;：<strong>特征根决定振动还是发散，稳定多项式决定系统会不会炸，相平面决定轨线怎么排。<\/strong><\/p>\n<h2>零基础讲解<\/h2>\n<h3>2.1 单根与重根<\/h3>\n<p>特征方程 λⁿ+a₁λⁿ⁻¹+…+aₙ=0。<\/p>\n<p><strong>单根<\/strong>：每个 λᵢ 贡献 e^(λᵢt)。实根给指数，复根成对给 e^(αt)cos βt、e^(αt)sin βt。<\/p>\n<p><strong>重根<\/strong>：k 重根 λ 贡献 e^(λt)、t e^(λt)、…、t^(k−1)e^(λt)。这是&quot;共振&quot;的代数来源：重根意味着方程对激励的响应里出现时间幂。<\/p>\n<h3>2.2 稳定多项式<\/h3>\n<p>一个实系数多项式若所有根的实部为负，称<strong>稳定多项式<\/strong>（赫尔维茨意义下）。<\/p>\n<p><strong>赫尔维茨判据<\/strong>：把系数排成赫尔维茨矩阵，所有顺序主子式为正 ⇔ 稳定。<\/p>\n<p>对二阶 λ²+aλ+b：稳定 ⇔ a&gt;0 且 b&gt;0。对三阶 λ³+aλ²+bλ+c：稳定 ⇔ a&gt;0、c&gt;0、ab&gt;c。<\/p>\n<p><strong>为什么工程上关心这个<\/strong>：不必解方程，只看系数符号与一个不等式，就能判断系统是否稳定。这是控制理论的入门工具。<\/p>\n<h3>2.3 非齐次与消去法<\/h3>\n<p>非齐次用待定系数（右端为多项式、指数、正弦的组合）或常数变易。<\/p>\n<p><strong>消去法<\/strong>：把方程组逐个求导、消元，化为一元高阶方程。代价是引入&quot;多余解&quot;（消去过程中产生的假根），必须回代检验。<\/p>\n<h3>2.4 复数振幅法<\/h3>\n<p>对 ẋ=Ax+b e^(iωt)，设特解 x=u e^(iωt)，代入得<\/p>\n<div class=\"eq\">(A−iωI)u = −b ⇒ u=−(A−iωI)⁻¹b<\/div>\n<p>取实部即得实激励下的稳态解。这个方法把&quot;三角函数的相位计算&quot;变成了&quot;复数矩阵求逆&quot;。<\/p>\n<h3>2.5 电路与调速器<\/h3>\n<p>RLC 串联电路：L q̈+R q̇+q/C=E(t)，与弹簧-质量-阻尼系统完全同构。庞特里亚金用这个例子说明&quot;不同物理系统可以有同一个方程&quot;。<\/p>\n<p>离心调速器（§27 提前出现）则是&quot;稳定性决定机器能不能用&quot;的经典案例。<\/p>\n<h3>2.6 相平面<\/h3>\n<p>对二阶常系数系统，用 p=tr A、q=det A 分类：结点、鞍点、焦点、中心。这一节是第三章定性理论的预热。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[常系数方程] --&gt; B[特征方程]\n    B --&gt; C{根的类型}\n    C --&gt;|单实根| D[指数解]\n    C --&gt;|共轭复根| E[振荡解]\n    C --&gt;|重根| F[t 的幂 × 指数]\n    A --&gt; G[稳定多项式]\n    G --&gt; H[赫尔维茨判据]\n    A --&gt; I[非齐次]\n    I --&gt; J[复振幅法]\n    I --&gt; K[消去法]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：左边三支是&quot;解的形状&quot;，右边两支是&quot;不解方程也能得到的结论&quot;。工程上常用右边。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：特征根像&quot;系统的性格&quot;——负实根是&quot;冷静收敛&quot;，正实根是&quot;越吵越凶&quot;，纯虚根是&quot;永远摇摆&quot;。重根则是&quot;性格里带惯性&quot;，会多出一段越走越远的过程。<\/p>\n<p><strong>失效边界<\/strong>：这套分类只对常系数线性系统成立；变系数、非线性都要另想办法。<\/p>\n<p><strong>实例<\/strong>：L q̈+R q̇+q/C=E₀cos ωt。设复数激励 E₀e^(iωt)，解 u=E₀/(−Lω²+iRω+1/C)。取模得振幅，取辐角得相位差。当 ω=1/√(LC) 时振幅最大——这就是谐振。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为&quot;特征根都是负实部就一定稳定&quot;<\/strong>——对线性系统成立，对非线性只是局部结论。\n<\/li><li>\n<strong>别以为&quot;重根一定意味着不稳定&quot;<\/strong>——负实部重根仍稳定，只是有 t 的幂。\n<\/li><li>\n<strong>别以为&quot;消去法没有代价&quot;<\/strong>——会引入假解，必须回代。\n<\/li><li>\n<strong>别以为&quot;复振幅法只对电路有效&quot;<\/strong>——对任何线性系统都有效。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\nλ=−1 是三重根，齐次解里出现哪些项？\n<p>（答案：e^(−t)、t e^(−t)、t² e^(−t)。解析：重根给 t 的幂。）<\/p>\n<\/ol>\n<ol><li>\n二阶方程 λ²+aλ+b 稳定的条件？\n<p>（答案：a&gt;0 且 b&gt;0。解析：赫尔维茨判据的最简形式。）<\/p>\n<\/ol>\n<ol><li>\n消去法为什么要回代？\n<p>（答案：消元过程可能引入不满足原方程的解。解析：求导会丢失信息。）<\/p>\n<\/ol>\n<ol><li>\n复振幅法的核心一步？\n<p>（答案：设 x=u e^(iωt)，解 (A−iωI)u=−b。解析：把微分方程化为代数方程。）<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n单根写指数，重根加 t 的幂，复根写振荡。\n<\/li><li>\n稳定多项式看赫尔维茨判据。\n<\/li><li>\n相平面用 p、q 分类。\n<\/ul>", "kind": "chapter", "title": "第 2 章：常系数线性方程"}, "ch03": {"html": "<h1>第 3 章：变系数线性方程<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：9 小时 | <strong>前置<\/strong>：第 2 章\n<\/li><li>\n<strong>对应原书<\/strong>：第三章（§17–§19）\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n写出标准线性方程组的一般理论（基解矩阵、常数变易）；\n<\/li><li>\n把 n 阶变系数方程纳入方程组框架；\n<\/li><li>\n处理周期系数系统，写出单值矩阵与稳定性判据；\n<\/li><li>\n说明&quot;变系数时没有特征值可用&quot;这一根本困难。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>变系数系统失去了&quot;特征值&quot;这个工具，只剩下两条路：<strong>基解矩阵<\/strong>（一般理论）与<strong>单值矩阵<\/strong>（周期情形）。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>3.1 标准线性方程组<\/h3>\n<div class=\"eq\">ẋ = A(t)x + b(t)<\/div>\n<p>A(t) 连续。解集 m 维，基解矩阵 Φ(t) 满足 Φ̇=AΦ，det Φ≠0（刘维尔公式）。<\/p>\n<p>非齐次：<\/p>\n<div class=\"eq\">x = Φ(t)[C + ∫Φ⁻¹(s)b(s)ds]<\/div>\n<h3>3.2 n 阶变系数方程<\/h3>\n<p>y⁽ⁿ⁾+a₁(t)y⁽ⁿ⁻¹⁾+…+aₙ(t)y=b(t) 化为方程组。降阶法：已知一个特解 y₁，令 y=u y₁ 可降一阶（刘维尔-达朗贝尔降阶）。<\/p>\n<h3>3.3 周期系数<\/h3>\n<p>A(t+T)=A(t)。此时 Φ(t+T)=Φ(t)M，M 是单值矩阵。判稳看 M 的特征值（乘子）模。<\/p>\n<p><strong>为什么这很重要<\/strong>：变系数系统没有固定特征值，&quot;稳定性&quot;必须另找判据。周期情形下，单值矩阵提供了这个判据。<\/p>\n<h3>3.4 与常系数的对照<\/h3>\n<table><thead><tr><th>项目<\/th><th>常系数<\/th><th>变系数<\/th><\/tr><\/thead><tbody><tr><td>基解矩阵<\/td><td>e^(At)<\/td><td>一般无显式<\/td><\/tr><tr><td>判稳工具<\/td><td>特征值<\/td><td>无（周期时有乘子）<\/td><\/tr><tr><td>解的构造<\/td><td>待定系数<\/td><td>常数变易<\/td><\/tr><\/tbody><\/table>\n<p>这张表是本章的&quot;痛点地图&quot;：中间那一行说明了为什么变系数理论比常系数难得多。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[变系数线性组] --&gt; B[基解矩阵]\n    B --&gt; C[常数变易]\n    A --&gt; D[周期系数]\n    D --&gt; E[单值矩阵 M]\n    E --&gt; F[乘子判稳]\n    A --&gt; G[高阶方程]\n    G --&gt; H[降阶法]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：左支是一般理论（存在但不显式），右支是周期情形（可算），下方是降阶技巧。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：常系数系统像&quot;匀速行驶的车&quot;，特征值就是速度；变系数系统像&quot;油门一直在变的 车&quot;，没有恒定速度，&quot;稳不稳&quot;要靠别的方式判。<\/p>\n<p><strong>失效边界<\/strong>：非周期变系数系统，乘子也无定义，稳定性只能靠李雅普诺夫函数或数值方法。<\/p>\n<p><strong>实例<\/strong>：A(t)=[[0,1],[−1,0]] 是常系数（也周期），M=Φ(2π)=I，乘子为 1，属临界。若改为 A(t)=[[0,1],[−1−ε cos t,0]]，参数 ε 跨过临界值时出现参数共振，乘子穿出单位圆。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为&quot;变系数也能算特征值&quot;<\/strong>——实际上 A(t) 随 t 变，特征值没有固定含义。\n<\/li><li>\n<strong>别以为&quot;周期系统的稳定性靠平均矩阵&quot;<\/strong>——平均化只在特定条件下有效。\n<\/li><li>\n<strong>别以为&quot;刘维尔公式只给行列式&quot;<\/strong>——它同时保证基解矩阵始终非奇异。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n刘维尔公式在变系数情形的形式？\n<p>（答案：det Φ(t)=det Φ(t₀)exp(∫tr A ds)。解析：与常系数相同形式。）<\/p>\n<\/ol>\n<ol><li>\n周期系数系统的判稳工具？\n<p>（答案：单值矩阵的乘子。解析：Φ(t+T)=Φ(t)M。）<\/p>\n<\/ol>\n<ol><li>\n降阶法需要什么前提？\n<p>（答案：已知一个非零特解。解析：y=u y₁ 代入后可降一阶。）<\/p>\n<\/ol>\n<ol><li>\n变系数系统为什么难？\n<p>（答案：没有固定特征值可算。解析：A(t) 随 t 变。）<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n基解矩阵 + 常数变易是一般理论。\n<\/li><li>\n周期情形用单值矩阵。\n<\/li><li>\n变系数没有特征值可用。\n<\/ul>", "kind": "chapter", "title": "第 3 章：变系数线性方程"}, "ch04": {"html": "<h1>第 4 章：存在性定理<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：9 小时 | <strong>前置<\/strong>：第 1、3 章\n<\/li><li>\n<strong>对应原书<\/strong>：第四章（§20–§25）\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n完整证明一个方程与方程组的存在唯一性定理；\n<\/li><li>\n证明解对初值的连续性与可微性（局部定理）；\n<\/li><li>\n说明首次积分与轨线维数的关系；\n<\/li><li>\n描述轨线在最大时间区间上的行为（三种出口）；\n<\/li><li>\n区分局部定理与整体定理的假设差别。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>这一章把第一章&quot;先叙述&quot;的定理全部补上证明，并且多做一件事：<strong>把局部结论推到最大区间上<\/strong>。庞特里亚金的写法特别强调&quot;轨线跑到哪里去了&quot;。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>4.1 一个方程的证明<\/h3>\n<p>先对 n=1 证，再推广到方程组。步骤与皮卡一致：积分方程 → 迭代 → 估计 → 收敛 + 唯一。<\/p>\n<p><strong>为什么先证一个方程<\/strong>：记号简单，几何直观，且推广到方程组只是把绝对值换成范数。<\/p>\n<h3>4.2 局部连续性与可微性<\/h3>\n<p>解对初值连续依赖：两解作差 + 格朗沃尔。 解对初值可微：变分方程 Φ′=f_xΦ，Φ(t₀)=I。<\/p>\n<p><strong>局部定理的条件<\/strong>：f 在某个邻域内连续（及对 x 连续可微）。结论只在这个邻域对应的区间上成立。<\/p>\n<h3>4.3 首次积分<\/h3>\n<p>F 沿轨线为常数 ⇔ X·∇F=0。n 维系统独立首次积分有 n−1 个。<\/p>\n<h3>4.4 最大时间区间上的行为<\/h3>\n<p>轨线只有三种结局：<\/p>\n<ol><li>\n跑到定义域边界；\n<\/li><li>\n在有限时间内爆破（|x|→∞）；\n<\/li><li>\n定义到 ±∞。\n<\/ol>\n<p><strong>这条结论的用处<\/strong>：判断&quot;解能不能一直活下去&quot;，是稳定性讨论的前置问题。<\/p>\n<h3>4.5 整体定理<\/h3>\n<p>若 f 在整个区域内连续（且对 x 连续可微），且解在某个紧集内不逸出，则可微性在最大区间上整体成立。<\/p>\n<p><strong>局部 vs 整体的差别<\/strong>：局部定理只保证&quot;在某段区间上&quot;，整体定理要额外假设&quot;解不逸出紧集&quot;。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[局部定理] --&gt; B[区间 t0±h]\n    B --&gt; C[延拓]\n    C --&gt; D[最大区间]\n    D --&gt; E{三种出口}\n    E --&gt; F[到边界]\n    E --&gt; G[有限时间爆破]\n    E --&gt; H[延伸到无穷]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：这张图的核心是&quot;出口&quot;——很多证明题问&quot;解能否延伸到无穷&quot;，答案就在这三个分支里。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：最大区间像&quot;一条路的全程&quot;。局部定理只保证&quot;能走 h 米&quot;，整体定理告诉你能不能走完，出口分析告诉你路在哪里断。<\/p>\n<p><strong>失效边界<\/strong>：如果 f 在区域内不连续，出口分析失效，可能出现&quot;解在有限时间跳到另一支&quot;的怪现象。<\/p>\n<p><strong>实例<\/strong>：ẋ=x²，x(0)=1。解 x=1/(1−t)，在 t=1 爆破，最大区间是 (−∞,1)。这是第二种出口。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为&quot;局部解能一直延拓&quot;<\/strong>——实际上可能爆破。\n<\/li><li>\n<strong>别以为&quot;爆破就是解不存在&quot;<\/strong>——实际上解在爆破前存在，只是区间有限。\n<\/li><li>\n<strong>别以为&quot;整体定理与局部定理只差区间&quot;<\/strong>——整体定理要多假设不逸出。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n最大区间的三种出口？\n<p>（答案：到边界、有限时间爆破、延伸到无穷。解析：见 §24。）<\/p>\n<\/ol>\n<ol><li>\nẋ=x²，x(0)=1 的最大区间？\n<p>（答案：(−∞,1)。解析：解为 1/(1−t)，t=1 爆破。）<\/p>\n<\/ol>\n<ol><li>\n整体可微定理比局部定理多什么假设？\n<p>（答案：解不逸出紧集（或 f 在整体区域满足条件）。解析：否则无法控制。）<\/p>\n<\/ol>\n<ol><li>\n首次积分与轨线维数的关系？\n<p>（答案：n−1 个独立首次积分把轨线定成一维。解析：维数计数。）<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n证明四步 + 格朗沃尔。\n<\/li><li>\n首次积分有 n−1 个。\n<\/li><li>\n最大区间三种出口。\n<\/ul>", "kind": "chapter", "title": "第 4 章：存在性定理"}, "ch05": {"html": "<h1>第 5 章：稳定性<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：10 小时 | <strong>前置<\/strong>：第 2、4 章\n<\/li><li>\n<strong>对应原书<\/strong>：第五章（§26–§31）\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n陈述并证明李雅普诺夫稳定性定理与渐近稳定性定理；\n<\/li><li>\n用离心调速器说明&quot;稳定性是工程可用性的前提&quot;；\n<\/li><li>\n说明极限环的存在与稳定性判据；\n<\/li><li>\n用电子管振荡器解释&quot;自激振荡&quot;的数学机制；\n<\/li><li>\n分析二阶自治系统平衡位置的类型；\n<\/li><li>\n讨论周期解的稳定性。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>庞特里亚金把稳定性写成&quot;工程问题的数学化&quot;：<strong>调速器会飞车、电子管会起振，都是因为平衡点或周期轨的稳定性发生了变化<\/strong>。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>5.1 李雅普诺夫定理<\/h3>\n<p><strong>稳定性<\/strong>：∀ε&gt;0，∃δ&gt;0，初值在 δ 内则轨线永远在 ε 内。 <strong>渐近稳定<\/strong>：稳定且 t→∞ 时趋于平衡点。<\/p>\n<p><strong>定理（第一方法）<\/strong>：A=f′(0)，特征值实部全负 ⇒ 渐近稳定。 <strong>定理（第二方法）<\/strong>：V 正定、V̇ 负半定 ⇒ 稳定；V̇ 负定 ⇒ 渐近稳定。<\/p>\n<h3>5.2 离心调速器<\/h3>\n<p>瓦特调速器的方程是一个二阶非线性系统。平衡点对应&quot;转速稳定&quot;。若平衡点不稳定，转速会持续上升或振荡——机器就废了。<\/p>\n<p>庞特里亚金用这个例子说明：<strong>稳定性不是数学游戏，是&quot;这台机器能不能用&quot;<\/strong>。<\/p>\n<h3>5.3 极限环<\/h3>\n<p>极限环是孤立的闭轨。存在判据在平面用庞加莱-本迪克松；稳定性用庞加莱映射的导数。<\/p>\n<p><strong>极限环的工程意义<\/strong>：它对应&quot;自激振荡&quot;——系统不需要外部周期激励，自己就会周期运动。<\/p>\n<h3>5.4 电子管振荡器<\/h3>\n<p>电子管电路的非线性特性使平衡点失稳，轨线被吸引到一个极限环上，于是产生稳定振幅的振荡。这就是&quot;振荡器&quot;的数学解释。<\/p>\n<h3>5.5 二阶自治系统与周期解稳定性<\/h3>\n<p>二阶自治系统的平衡位置用 p、q 分类。周期解的稳定性用&quot;绕一圈的放大率&quot;判断：放大率小于 1 则稳定。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[平衡点] --&gt; B[线性化]\n    B --&gt; C{双曲}\n    C --&gt;|是| D[特征值判稳]\n    C --&gt;|否| E[V 函数]\n    A --&gt; F[周期轨]\n    F --&gt; G[庞加莱映射]\n    G --&gt; H[放大率判稳]\n    D --&gt; I[工程: 调速器]\n    H --&gt; J[工程: 振荡器]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：左边是&quot;点&quot;的稳定性，右边是&quot;圈&quot;的稳定性；两侧各挂一个工程实例，这是本书的特色。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：极限环像&quot;跑道&quot;。不管运动员从哪里出发，最后都会跑上同一条跑道，以固定节奏绕圈——这就是振荡器的稳定振荡。<\/p>\n<p><strong>失效边界<\/strong>：三维以上没有庞加莱-本迪克松，闭轨存在性无简单判据。<\/p>\n<p><strong>实例<\/strong>：范德波尔方程 x″+ε(x²−1)x′+x=0（ε&gt;0）。原点不稳定（线性化特征值实部为正），但存在唯一稳定极限环，所有非零轨线都趋近它。这就是电子管振荡器的模型。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为&quot;稳定就是不动&quot;<\/strong>——实际上稳定是&quot;不跑远&quot;，可以振荡。\n<\/li><li>\n<strong>别以为&quot;极限环一定稳定&quot;<\/strong>——实际上有稳定环也有不稳定环。\n<\/li><li>\n<strong>别以为&quot;线性化判稳对所有系统有效&quot;<\/strong>——实际上非双曲时失效。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n第二方法判渐近稳定的条件？\n<p>（答案：V 正定且 V̇ 负定。解析：负半定只能给稳定。）<\/p>\n<\/ol>\n<ol><li>\n极限环的工程意义？\n<p>（答案：自激振荡，无需外部周期激励。解析：轨线被吸引到闭轨。）<\/p>\n<\/ol>\n<ol><li>\n周期解稳定性的判据？\n<p>（答案：庞加莱映射导数的绝对值小于 1。解析：绕一圈的放大率小于 1。）<\/p>\n<\/ol>\n<ol><li>\n调速器不稳定的后果？\n<p>（答案：转速失控或持续振荡。解析：平衡点失稳。）<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n线性化判稳 + V 函数补刀。\n<\/li><li>\n极限环 = 自激振荡。\n<\/li><li>\n周期解稳定性看庞加莱映射。\n<\/ul>", "kind": "chapter", "title": "第 5 章：稳定性"}, "ch06": {"html": "<h1>第 6 章：线性代数<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：4 小时 | <strong>前置<\/strong>：线性代数\n<\/li><li>\n<strong>对应原书<\/strong>：第六章（§32–§34）\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n求矩阵的最小零化多项式并说明它与若尔当形的关系；\n<\/li><li>\n用多项式定义矩阵函数，从而计算 e^(At)；\n<\/li><li>\n写出若尔当标准形并说明它如何决定解的结构。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>这一章是&quot;工具箱&quot;：<strong>矩阵函数、最小多项式、若尔当形<\/strong>三件工具，专门用来算 e^(At) 和处理重特征值。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>6.1 最小零化多项式<\/h3>\n<p>使 p(A)=0 的次数最低的首一多项式。它整除特征多项式，且它的根正是 A 的特征值（重数可能更小）。<\/p>\n<p><strong>用途<\/strong>：判断 A 能否对角化——最小多项式无重根 ⇔ 可对角化。<\/p>\n<h3>6.2 矩阵函数<\/h3>\n<p>对多项式 p，p(A) 有定义。对一般函数 f，用插值多项式定义：<\/p>\n<div class=\"eq\">f(A) = p(A)，其中 p 是在 A 的谱上插值 f 的多项式<\/div>\n<p>于是 e^(At) 可以通过&quot;在特征值处插值 e^(λt)&quot;来算。重特征值时要插值到导数阶。<\/p>\n<h3>6.3 若尔当标准形<\/h3>\n<p>A = P J P⁻¹，J 由若尔当块组成。块的大小由广义特征向量链的长度决定。<\/p>\n<p><strong>与解的关系<\/strong>：J 的块给 e^(λt)、t e^(λt)、…，这正是重根解里出现 t 的幂的代数原因。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[矩阵 A] --&gt; B[特征多项式]\n    B --&gt; C[最小多项式]\n    C --&gt; D{是否有重根}\n    D --&gt;|无| E[可对角化]\n    D --&gt;|有| F[若尔当形]\n    F --&gt; G[J = P^-1 A P]\n    G --&gt; H[e^(Jt) 分块计算]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：从最小多项式出发分两路，一路直接对角化，一路落到若尔当形。无论哪路，终点都是算 e^(At)。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：最小多项式像&quot;矩阵的身份证号&quot;——它比特征多项式更短，但足以唯一确定矩阵的谱结构。<\/p>\n<p><strong>失效边界<\/strong>：若尔当形在数值计算中不稳定（特征值接近时块结构难判定），实际计算常用其他方法。<\/p>\n<p><strong>实例<\/strong>：A=[[0,1],[0,0]]。特征多项式 λ²，最小多项式也是 λ²（因为 A≠0）。故不可对角化，e^(At)=I+At=[[1,t],[0,1]]。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为&quot;最小多项式等于特征多项式&quot;<\/strong>——实际上它可能更低次（如单位矩阵）。\n<\/li><li>\n<strong>别以为&quot;特征值重就一定不可对角化&quot;<\/strong>——实际上要看几何重数。\n<\/li><li>\n<strong>别以为&quot;若尔当形唯一&quot;<\/strong>——实际上块的排列顺序可不同（相差相似变换）。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n矩阵可对角化的充要条件（用最小多项式表述）？\n<p>（答案：最小多项式无重根。解析：等价于几何重数等于代数重数。）<\/p>\n<\/ol>\n<ol><li>\nA=[[0,1],[0,0]] 的 e^(At)？\n<p>（答案：[[1,t],[0,1]]。解析：幂零部分，指数展开只有两项。）<\/p>\n<\/ol>\n<ol><li>\n若尔当块的大小由什么决定？\n<p>（答案：广义特征向量链的长度。解析：链越长块越大。）<\/p>\n<\/ol>\n<ol><li>\n矩阵函数如何定义？\n<p>（答案：用谱上插值多项式。解析：重特征值需插值到导数阶。）<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n最小多项式判可对角化。\n<\/li><li>\n矩阵函数靠插值。\n<\/li><li>\n若尔当块解释 t 的幂。\n<\/ul>", "kind": "chapter", "title": "第 6 章：线性代数"}, "c01": {"html": "<h1>稳定多项式（赫尔维茨判据）<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 2 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>所有根的实部都为负的实系数多项式；判据是赫尔维茨矩阵的顺序主子式全为正。<\/p>\n<h2>为什么重要<\/h2>\n<p>它让&quot;系统是否稳定&quot;变成&quot;看系数&quot;，不必解方程。这是控制理论的第一课。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[特征多项式] --&gt; B[排赫尔维茨矩阵]\n    B --&gt; C[算顺序主子式]\n    C --&gt; D{全为正}\n    D --&gt;|是| E[稳定]\n    D --&gt;|否| F[不稳定或临界]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>二阶：λ²+aλ+b，稳定 ⇔ a&gt;0、b&gt;0。 三阶：λ³+aλ²+bλ+c，稳定 ⇔ a&gt;0、c&gt;0、ab&gt;c。 三阶那个不等式最关键：a、b、c 都正还不够，还要 ab&gt;c，否则有一对共轭复根跑到右半平面。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为&quot;系数全正就稳定&quot;（三阶反例）。\n<\/li><li>\n别以为判据对非线性系统有效（只对线性）。\n<\/li><li>\n别以为&quot;临界&quot;等于&quot;稳定&quot;。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 2 章<\/td><td>§9 稳定多项式<\/td><td>赫尔维茨判据<\/td><\/tr><tr><td>第 5 章<\/td><td>稳定性<\/td><td>线性化后用它<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：特征方程\n<\/li><li>\n后续：劳斯判据、李雅普诺夫\n<\/ul>", "kind": "concept", "title": "稳定多项式（赫尔维茨判据）"}, "c02": {"html": "<h1>极限环与自激振荡<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：第 5 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>孤立的闭轨；附近轨线螺旋趋近（稳定）或远离（不稳定）。工程上对应无需外部激励的持续振荡。<\/p>\n<h2>为什么重要<\/h2>\n<p>它解释了振荡器为什么能&quot;自己振起来&quot;，也解释了为什么某些系统会&quot;突然开始抖&quot;。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n    A[平衡点失稳] --&gt; B[轨线外扩]\n    B --&gt; C[被闭轨捕获]\n    C --&gt; D[稳定极限环]\n    D --&gt; E[固定振幅振荡]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>范德波尔方程是标准例子：小振幅时阻尼为负（能量注入），大振幅时阻尼为正（能量耗散），两者平衡处形成稳定极限环。<\/p>\n<p>存在性用庞加莱-本迪克松（平面），稳定性用庞加莱映射的导数。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为极限环 = 任意闭轨（中心型闭轨成族，不孤立）。\n<\/li><li>\n别以为存在极限环就一定稳定。\n<\/li><li>\n别以为三维系统也能用同一判据。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 5 章<\/td><td>§28 极限环<\/td><td>存在与稳定判据<\/td><\/tr><tr><td>第 5 章<\/td><td>§29 电子管振荡器<\/td><td>工程实例<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：闭轨、庞加莱映射\n<\/li><li>\n后续：分支、混沌\n<\/ul>", "kind": "concept", "title": "极限环与自激振荡"}, "c03": {"html": "<h1>矩阵指数<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 6 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>e^(At)=Σ(At)ᵏ/k!，是常系数线性系统 ẋ=Ax 的标准基解矩阵。<\/p>\n<h2>为什么重要<\/h2>\n<p>它是常系数系统的&quot;万能钥匙&quot;：解、稳定性、周期解都从它读出来。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[A] --&gt; B{能否对角化}\n    B --&gt;|能| C[P e^(Dt) P^-1]\n    B --&gt;|不能| D[P e^(Jt) P^-1]\n    D --&gt; E[分块: e^(λt)(I+Nt+...)]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>对角情形直接逐元素取指数；若尔当情形要处理幂零部分 N，展开只有有限项。数值上常用 scaling and squaring。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为可逐元素取指数（只对对角阵）。\n<\/li><li>\n别以为 e^(A+B)=e^A e^B（A、B 不交换时不对）。\n<\/li><li>\n别以为 e^(At) 一定可逆（它总是可逆，det=e^(tr A t)）。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 2 章<\/td><td>常系数解<\/td><td>基解矩阵<\/td><\/tr><tr><td>第 6 章<\/td><td>§33 矩阵函数<\/td><td>插值定义<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：矩阵乘法、幂零\n<\/li><li>\n后续：弗洛凯理论\n<\/ul>", "kind": "concept", "title": "矩阵指数"}, "__path__": {"html": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：标准化<\/strong><br>阅读：<a href=\"#/chapter/ch01\">第 1 章：引论<\/a><br>检查点：能把三阶方程化为方程组<\/li><li class='path-step' id='path-02'><strong>步骤 02：常系数：根与解<\/strong><br>阅读：<a href=\"#/chapter/ch02\">第 2 章：常系数线性方程<\/a><br>检查点：写出重根解<\/li><li class='path-step' id='path-03'><strong>步骤 03：常系数：稳定多项式与工程<\/strong><br>阅读：<a href=\"#/chapter/ch02\">第 2 章：常系数线性方程<\/a><br>检查点：赫尔维茨判二阶<\/li><li class='path-step' id='path-04'><strong>步骤 04：变系数与周期系数<\/strong><br>阅读：<a href=\"#/chapter/ch03\">第 3 章：变系数线性方程<\/a><br>检查点：写出单值矩阵<\/li><li class='path-step' id='path-05'><strong>步骤 05：存在性定理<\/strong><br>阅读：<a href=\"#/chapter/ch04\">第 4 章：存在性定理<\/a><br>检查点：说出三种出口<\/li><li class='path-step' id='path-06'><strong>步骤 06：稳定性与极限环<\/strong><br>阅读：<a href=\"#/chapter/ch05\">第 5 章：稳定性<\/a><br>检查点：解释振荡器<\/li><li class='path-step' id='path-07'><strong>步骤 07：线性代数工具<\/strong><br>阅读：<a href=\"#/chapter/ch06\">第 6 章：线性代数<\/a><br>检查点：算 e^(At)<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "kind": "path", "title": "学习路径"}, "__quiz_all__": {"html": "<p>（无综合题）<\/p>", "kind": "quiz", "title": "综合测验"}, "__quiz_ch01__": {"html": "<h1>测验：第 1 章：引论<\/h1><div class='quiz-item' data-qid='q01' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 三阶方程化为标准方程组需要几个分量？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q01' value='0'> 1<\/label><label class='quiz-opt'><input type='radio' name='q01' value='1'> 2<\/label><label class='quiz-opt'><input type='radio' name='q01' value='2'> 3<\/label><label class='quiz-opt'><input type='radio' name='q01' value='3'> 4<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q02' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 复方程 ż=iz 对应的实系统是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q02' value='0'> ẋ=−y, ẏ=x<\/label><label class='quiz-opt'><input type='radio' name='q02' value='1'> ẋ=y, ẏ=x<\/label><label class='quiz-opt'><input type='radio' name='q02' value='2'> ẋ=x, ẏ=−y<\/label><label class='quiz-opt'><input type='radio' name='q02' value='3'> ẋ=−x, ẏ=−y<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch02__": {"html": "<h1>测验：第 2 章：常系数线性方程<\/h1><div class='quiz-item' data-qid='q03' data-type='single'><p class='quiz-q'><b>Q1.<\/b> λ=−2 是二重根，通解中会出现？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q03' value='0'> 只有 e^(−2t)<\/label><label class='quiz-opt'><input type='radio' name='q03' value='1'> e^(−2t) 与 t e^(−2t)<\/label><label class='quiz-opt'><input type='radio' name='q03' value='2'> cos 2t<\/label><label class='quiz-opt'><input type='radio' name='q03' value='3'> e^(2t)<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q04' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 二阶方程 λ²+aλ+b 稳定的条件？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q04' value='0'> a&gt;0<\/label><label class='quiz-opt'><input type='radio' name='q04' value='1'> b&gt;0<\/label><label class='quiz-opt'><input type='radio' name='q04' value='2'> a&gt;0 且 b&gt;0<\/label><label class='quiz-opt'><input type='radio' name='q04' value='3'> a&lt;0<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q05' data-type='single'><p class='quiz-q'><b>Q3.<\/b> 三阶稳定的附加不等式是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q05' value='0'> ab&gt;c<\/label><label class='quiz-opt'><input type='radio' name='q05' value='1'> ab&lt;c<\/label><label class='quiz-opt'><input type='radio' name='q05' value='2'> a&gt;c<\/label><label class='quiz-opt'><input type='radio' name='q05' value='3'> b&gt;c<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q06' data-type='single'><p class='quiz-q'><b>Q4.<\/b> 复振幅法的核心方程？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q06' value='0'> (A−iωI)u=−b<\/label><label class='quiz-opt'><input type='radio' name='q06' value='1'> (A+iωI)u=b<\/label><label class='quiz-opt'><input type='radio' name='q06' value='2'> Au=0<\/label><label class='quiz-opt'><input type='radio' name='q06' value='3'> (A−ωI)u=b<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch03__": {"html": "<h1>测验：第 3 章：变系数线性方程<\/h1><div class='quiz-item' data-qid='q07' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 变系数系统为什么没有「特征值」可用？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q07' value='0'> A 不可逆<\/label><label class='quiz-opt'><input type='radio' name='q07' value='1'> A(t) 随 t 变<\/label><label class='quiz-opt'><input type='radio' name='q07' value='2'> 没有基解矩阵<\/label><label class='quiz-opt'><input type='radio' name='q07' value='3'> 解不存在<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q08' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 周期系数判稳用什么？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q08' value='0'> 平均矩阵<\/label><label class='quiz-opt'><input type='radio' name='q08' value='1'> 单值矩阵的乘子<\/label><label class='quiz-opt'><input type='radio' name='q08' value='2'> 特征多项式<\/label><label class='quiz-opt'><input type='radio' name='q08' value='3'> 李雅普诺夫函数<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch04__": {"html": "<h1>测验：第 4 章：存在性定理<\/h1><div class='quiz-item' data-qid='q09' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 最大区间的三种出口不含？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q09' value='0'> 到边界<\/label><label class='quiz-opt'><input type='radio' name='q09' value='1'> 有限时间爆破<\/label><label class='quiz-opt'><input type='radio' name='q09' value='2'> 延伸到无穷<\/label><label class='quiz-opt'><input type='radio' name='q09' value='3'> 跳到另一支<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q10' data-type='single'><p class='quiz-q'><b>Q2.<\/b> ẋ=x²，x(0)=1 的最大区间是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q10' value='0'> R<\/label><label class='quiz-opt'><input type='radio' name='q10' value='1'> (0,1)<\/label><label class='quiz-opt'><input type='radio' name='q10' value='2'> (−∞,1)<\/label><label class='quiz-opt'><input type='radio' name='q10' value='3'> (1,+∞)<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch05__": {"html": "<h1>测验：第 5 章：稳定性<\/h1><div class='quiz-item' data-qid='q11' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 第二方法判稳定（非渐近）的条件？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q11' value='0'> V 正定, V̇ 负半定<\/label><label class='quiz-opt'><input type='radio' name='q11' value='1'> V 正定, V̇ 负定<\/label><label class='quiz-opt'><input type='radio' name='q11' value='2'> V 负定<\/label><label class='quiz-opt'><input type='radio' name='q11' value='3'> V̇&gt;0<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q12' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 电子管振荡器的数学机制是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q12' value='0'> 平衡点失稳 + 稳定极限环<\/label><label class='quiz-opt'><input type='radio' name='q12' value='1'> 平衡点稳定<\/label><label class='quiz-opt'><input type='radio' name='q12' value='2'> 无平衡点<\/label><label class='quiz-opt'><input type='radio' name='q12' value='3'> 线性共振<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q13' data-type='single'><p class='quiz-q'><b>Q3.<\/b> 极限环稳定性的判据？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q13' value='0'> 庞加莱映射导数绝对值&lt;1<\/label><label class='quiz-opt'><input type='radio' name='q13' value='1'> 特征值实部&lt;0<\/label><label class='quiz-opt'><input type='radio' name='q13' value='2'> V̇&lt;0<\/label><label class='quiz-opt'><input type='radio' name='q13' value='3'> 李雅普诺夫指数&gt;0<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch06__": {"html": "<h1>测验：第 6 章：线性代数<\/h1><div class='quiz-item' data-qid='q14' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 矩阵可对角化的最小多项式条件？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q14' value='0'> 无重根<\/label><label class='quiz-opt'><input type='radio' name='q14' value='1'> 次数等于阶数<\/label><label class='quiz-opt'><input type='radio' name='q14' value='2'> 等于特征多项式<\/label><label class='quiz-opt'><input type='radio' name='q14' value='3'> 常数项为 1<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q15' data-type='single'><p class='quiz-q'><b>Q2.<\/b> A=[[0,1],[0,0]] 的 e^(At)？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q15' value='0'> I<\/label><label class='quiz-opt'><input type='radio' name='q15' value='1'> [[1,t],[0,1]]<\/label><label class='quiz-opt'><input type='radio' name='q15' value='2'> [[e^t,0],[0,1]]<\/label><label class='quiz-opt'><input type='radio' name='q15' value='3'> [[0,1],[0,0]]<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz___all__": {"html": "<h1>测验：__all<\/h1><div class='quiz-item' data-qid='q16' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 本书把电路与振荡器放进教材的主要理由是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q16' value='0'> 增加趣味<\/label><label class='quiz-opt'><input type='radio' name='q16' value='1'> 说明稳定性决定工程可用性<\/label><label class='quiz-opt'><input type='radio' name='q16' value='2'> 减少证明<\/label><label class='quiz-opt'><input type='radio' name='q16' value='3'> 替代理论<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q17' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 常系数与变系数理论的关键分界是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q17' value='0'> 是否有基解矩阵<\/label><label class='quiz-opt'><input type='radio' name='q17' value='1'> 是否有固定特征值<\/label><label class='quiz-opt'><input type='radio' name='q17' value='2'> 是否可积<\/label><label class='quiz-opt'><input type='radio' name='q17' value='3'> 是否线性<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__cards__": {"html": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "kind": "cards", "title": "抽认卡"}, "__glossary__": {"html": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='标准方程组'>标准方程组 — ẋ=f(t,x) 形式的一阶方程组 <span class=glossary-ref>（第 1 章：引论）<\/span><\/li><li data-term='复值方程'>复值方程 — 未知函数取复值的方程 <span class=glossary-ref>（第 1 章：引论）<\/span><\/li><li data-term='特征方程'>特征方程 — 由常系数方程得到的代数方程 <span class=glossary-ref>（第 2 章：常系数线性方程）<\/span><\/li><li data-term='单根'>单根 — 特征方程的一重根 <span class=glossary-ref>（第 2 章：常系数线性方程）<\/span><\/li><li data-term='重根'>重根 — 特征方程的多重根 <span class=glossary-ref>（第 2 章：常系数线性方程）<\/span><\/li><li data-term='稳定多项式'>稳定多项式 — 所有根实部为负的多项式 <span class=glossary-ref>（第 2 章：常系数线性方程）<\/span><\/li><li data-term='赫尔维茨判据'>赫尔维茨判据 — 用顺序主子式判稳 <span class=glossary-ref>（第 2 章：常系数线性方程）<\/span><\/li><li data-term='消去法'>消去法 — 方程组消元化高阶方程 <span class=glossary-ref>（第 2 章：常系数线性方程）<\/span><\/li><li data-term='复振幅法'>复振幅法 — 用 e^(iωt) 求稳态解 <span class=glossary-ref>（第 2 章：常系数线性方程）<\/span><\/li><li data-term='rlc 电路'>RLC 电路 — 电感电阻电容串联回路 <span class=glossary-ref>（第 2 章：常系数线性方程）<\/span><\/li><li data-term='相平面'>相平面 — 二阶系统的状态平面 <span class=glossary-ref>（第 2 章：常系数线性方程）<\/span><\/li><li data-term='基解矩阵'>基解矩阵 — 线性无关解组成的矩阵 <span class=glossary-ref>（第 3 章：变系数线性方程）<\/span><\/li><li data-term='单值矩阵'>单值矩阵 — 周期系统走一圈的演化 <span class=glossary-ref>（第 3 章：变系数线性方程）<\/span><\/li><li data-term='乘子'>乘子 — 单值矩阵的特征值 <span class=glossary-ref>（第 3 章：变系数线性方程）<\/span><\/li><li data-term='降阶法'>降阶法 — 已知特解后降低方程阶数 <span class=glossary-ref>（第 3 章：变系数线性方程）<\/span><\/li><li data-term='迭代'>迭代 — 皮卡逐次逼近 <span class=glossary-ref>（第 4 章：存在性定理）<\/span><\/li><li data-term='首次积分'>首次积分 — 沿轨线取常数的函数 <span class=glossary-ref>（第 4 章：存在性定理）<\/span><\/li><li data-term='最大时间区间'>最大时间区间 — 解能延伸到的最大区间 <span class=glossary-ref>（第 4 章：存在性定理）<\/span><\/li><li data-term='爆破'>爆破 — 解在有限时间趋于无穷 <span class=glossary-ref>（第 4 章：存在性定理）<\/span><\/li><li data-term='李雅普诺夫稳定'>李雅普诺夫稳定 — 初值近则轨线不跑远 <span class=glossary-ref>（第 5 章：稳定性）<\/span><\/li><li data-term='渐近稳定'>渐近稳定 — 稳定且趋于平衡点 <span class=glossary-ref>（第 5 章：稳定性）<\/span><\/li><li data-term='离心调速器'>离心调速器 — 瓦特式转速调节装置 <span class=glossary-ref>（第 5 章：稳定性）<\/span><\/li><li data-term='极限环'>极限环 — 孤立的闭轨 <span class=glossary-ref>（第 5 章：稳定性）<\/span><\/li><li data-term='电子管振荡器'>电子管振荡器 — 自激振荡电路 <span class=glossary-ref>（第 5 章：稳定性）<\/span><\/li><li data-term='庞加莱映射'>庞加莱映射 — 绕一圈的首次回归映射 <span class=glossary-ref>（第 5 章：稳定性）<\/span><\/li><li data-term='最小零化多项式'>最小零化多项式 — 使 p(A)=0 的最低次首一多项式 <span class=glossary-ref>（第 6 章：线性代数）<\/span><\/li><li data-term='矩阵函数'>矩阵函数 — 用谱插值定义的 f(A) <span class=glossary-ref>（第 6 章：线性代数）<\/span><\/li><li data-term='若尔当形'>若尔当形 — 矩阵的标准分块形式 <span class=glossary-ref>（第 6 章：线性代数）<\/span><\/li><li data-term='广义特征向量'>广义特征向量 — 若尔当链上的向量 <span class=glossary-ref>（第 6 章：线性代数）<\/span><\/li><\/ul>", "kind": "glossary", "title": "术语表"}, "__patterns__": {"html": "<h1>模式与框架库<\/h1>\n<h2>框架：从方程到工程结论<\/h2>\n<ol><li>\n写出物理方程（电路、机械）。\n<\/li><li>\n化为标准方程组。\n<\/li><li>\n算特征根或稳定多项式。\n<\/li><li>\n翻译回物理：稳定、振荡、谐振、自激。\n<\/ol>\n<p>这条链条是本书的组织逻辑。看每一节时，先问&quot;它在链条的哪一环&quot;。<\/p>\n<h2>框架：解的形状由特征根决定<\/h2>\n<ul><li>\n负实根：衰减。\n<\/li><li>\n正实根：发散。\n<\/li><li>\n纯虚根：等幅振荡。\n<\/li><li>\n复根带负实部：衰减振荡。\n<\/li><li>\n重根：多出 t 的幂。\n<\/ul>\n<h2>决策规则<\/h2>\n<ul><li>\n判稳定：先看系数符号，再算赫尔维茨不等式。\n<\/li><li>\n求稳态：用复振幅法，不硬算三角恒等式。\n<\/li><li>\n方程组要化高阶：用消去法，但记得回代。\n<\/li><li>\n变系数判稳：若不是周期，别找特征值，直接找 V。\n<\/ul>\n<h2>反模式<\/h2>\n<ul><li>\n<strong>以为系数全正就稳定<\/strong>。三阶还要 ab&gt;c。\n<\/li><li>\n<strong>对变系数系统套常系数公式<\/strong>。没有固定特征值。\n<\/li><li>\n<strong>把消去法的结果直接当答案<\/strong>。可能引入假解。\n<\/li><li>\n<strong>把极限环当中心<\/strong>。中心闭轨成族，极限环孤立。\n<\/ul>", "kind": "模式库", "title": "模式库"}, "__cheatsheet__": {"html": "<h1>速查表<\/h1>\n<h2>常系数齐次<\/h2>\n<table><thead><tr><th>根<\/th><th>贡献的解<\/th><\/tr><\/thead><tbody><tr><td>实单根 λ<\/td><td>e^(λt)<\/td><\/tr><tr><td>共轭复根 α±iβ<\/td><td>e^(αt)cos βt, e^(αt)sin βt<\/td><\/tr><tr><td>k 重根 λ<\/td><td>e^(λt), t e^(λt), …, t^(k−1)e^(λt)<\/td><\/tr><\/tbody><\/table>\n<h2>赫尔维茨判据<\/h2>\n<table><thead><tr><th>阶<\/th><th>条件<\/th><\/tr><\/thead><tbody><tr><td>2<\/td><td>a&gt;0, b&gt;0<\/td><\/tr><tr><td>3<\/td><td>a&gt;0, c&gt;0, ab&gt;c<\/td><\/tr><tr><td>4<\/td><td>全部顺序主子式 &gt;0<\/td><\/tr><\/tbody><\/table>\n<h2>非齐次<\/h2>\n<table><thead><tr><th>右端<\/th><th>特解形式<\/th><\/tr><\/thead><tbody><tr><td>Pₙ(t)<\/td><td>Qₙ(t)（若 0 是根则乘 t^k）<\/td><\/tr><tr><td>e^(αt)Pₙ(t)<\/td><td>e^(αt)Qₙ(t)（若 α 是根则乘 t^k）<\/td><\/tr><tr><td>正弦/余弦<\/td><td>复振幅法：(A−iωI)u=−b<\/td><\/tr><\/tbody><\/table>\n<h2>变系数<\/h2>\n<table><thead><tr><th>场景<\/th><th>结论<\/th><\/tr><\/thead><tbody><tr><td>基解矩阵<\/td><td>Φ̇=AΦ，det≠0<\/td><\/tr><tr><td>非齐次<\/td><td>x=Φ[C+∫Φ⁻¹b]<\/td><\/tr><tr><td>刘维尔<\/td><td>det Φ=exp(∫tr A)<\/td><\/tr><tr><td>周期系统<\/td><td>Φ(t+T)=Φ(t)M<\/td><\/tr><\/tbody><\/table>\n<h2>存在性<\/h2>\n<table><thead><tr><th>结论<\/th><th>内容<\/th><\/tr><\/thead><tbody><tr><td>最大区间出口<\/td><td>到边界 / 爆破 / 到无穷<\/td><\/tr><tr><td>首次积分数<\/td><td>n−1<\/td><\/tr><tr><td>局部 vs 整体<\/td><td>整体要多假设不逸出<\/td><\/tr><\/tbody><\/table>\n<h2>稳定性<\/h2>\n<table><thead><tr><th>概念<\/th><th>判据<\/th><\/tr><\/thead><tbody><tr><td>线性化<\/td><td>实部全负渐近稳定<\/td><\/tr><tr><td>第二方法<\/td><td>V 正定、V̇ 负定<\/td><\/tr><tr><td>极限环存在<\/td><td>平面 + 捕获域 + 无平衡点<\/td><\/tr><tr><td>极限环稳定<\/td><td>庞加莱映射导数 &lt;1<\/td><\/tr><\/tbody><\/table>\n<h2>线性代数<\/h2>\n<table><thead><tr><th>工具<\/th><th>用途<\/th><\/tr><\/thead><tbody><tr><td>最小多项式<\/td><td>判可对角化<\/td><\/tr><tr><td>矩阵函数<\/td><td>算 e^(At)<\/td><\/tr><tr><td>若尔当形<\/td><td>解释 t 的幂<\/td><\/tr><\/tbody><\/table>", "kind": "速查表", "title": "速查表"}}, "base_dir": "/home/user/Doubao/chats/38451120534976514/常微分方程点化学习系统/06-庞特里亚金-常微分方程", "nav": [{"label": "学习路径", "href": "#/path"}, {"label": "章节", "children": [{"label": "第 1 章：引论", "href": "#/chapter/ch01"}, {"label": "第 2 章：常系数线性方程", "href": "#/chapter/ch02"}, {"label": "第 3 章：变系数线性方程", "href": "#/chapter/ch03"}, {"label": "第 4 章：存在性定理", "href": "#/chapter/ch04"}, {"label": "第 5 章：稳定性", "href": "#/chapter/ch05"}, {"label": "第 6 章：线性代数", "href": "#/chapter/ch06"}]}, {"label": "概念", "children": [{"label": "稳定多项式（赫尔维茨判据）", "href": "#/concept/c01"}, {"label": "极限环与自激振荡", "href": "#/concept/c02"}, {"label": "矩阵指数", "href": "#/concept/c03"}]}, {"label": "测验", "children": [{"label": "综合测验", "href": "#/quiz/all"}, {"label": "测验：第 1 章：引论", "href": "#/quiz/ch01"}, {"label": "测验：第 2 章：常系数线性方程", "href": "#/quiz/ch02"}, {"label": "测验：第 3 章：变系数线性方程", "href": "#/quiz/ch03"}, {"label": "测验：第 4 章：存在性定理", "href": "#/quiz/ch04"}, {"label": "测验：第 5 章：稳定性", "href": "#/quiz/ch05"}, {"label": "测验：第 6 章：线性代数", "href": "#/quiz/ch06"}]}, {"label": "抽认卡", "href": "#/cards"}, {"label": "术语表", "href": "#/glossary"}, {"label": "模式库", "href": "#/patterns"}, {"label": "速查表", "href": "#/cheatsheet"}], "rendered": {"ch01": "<h1>第 1 章：引论<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：5 小时 | <strong>前置<\/strong>：微积分、复数初步\n<\/li><li>\n<strong>对应原书<\/strong>：第一章（§1–§6）\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n用&quot;标准方程组&quot;统一描述 n 阶方程与方程组；\n<\/li><li>\n说明为什么庞特里亚金把存在唯一性&quot;先叙述、后证明&quot;；\n<\/li><li>\n处理复值方程与实值方程的互化；\n<\/li><li>\n说出线性方程在这本书里为何被提前到第二章。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>第一章只做一件事：<strong>把研究对象统一成&quot;标准方程组&quot;<\/strong>。此后所有定理都只针对这一个对象陈述，包括复值情形。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>1.1 标准方程组<\/h3>\n<div class=\"eq\">dx_i/dt = f_i(t, x₁, …, xₙ)，i=1,…,n<\/div>\n<p>写成向量形式 ẋ=f(t,x)。n 阶方程通过令 x₁=y, x₂=y′,… 化为标准形。这一步是&quot;标准化&quot;，不是&quot;简化&quot;——它让所有定理只需证一次。<\/p>\n<h3>1.2 先叙述、后证明<\/h3>\n<p>庞特里亚金在第一章陈述存在唯一性定理，却把证明推到第四章。这个编排不是偷懒，而是教学策略：<strong>先用定理把几何图像建立起来，再回头补证明<\/strong>。你会在第二章反复使用定理来讨论线性方程，等用熟了，证明才有意义。<\/p>\n<h3>1.3 复值方程<\/h3>\n<p>若 f 取复值，可写成实部虚部两个实方程：<\/p>\n<div class=\"eq\">ż = f(t,z) ⇔ ẋ=Re f，ẏ=Im f（z=x+iy）<\/div>\n<p>反过来，两个实方程常可合并成一个复方程，这在平面线性系统里特别有用（复特征值对应旋转）。<\/p>\n<h3>1.4 线性方程预览<\/h3>\n<p>本章最后一节给出线性方程的基本事实：解集是线性空间、齐次解可叠加。这些在第二章会被反复使用。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[n 阶方程] --&gt; B[令 x1=y x2=y&#x27; ...]\n    B --&gt; C[标准方程组]\n    C --&gt; D[存在唯一性定理]\n    D --&gt; E[第二章 线性方程]\n    C --&gt; F[复值情形 拆实虚部]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：这张图的中心是&quot;标准方程组&quot;。左边是入口，右边是全书的走向。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：标准方程组像&quot;统一货币&quot;。不同国家的方程（高阶、方程组、复值）先换成同一种货币，才能用同一套定理结算。<\/p>\n<p><strong>失效边界<\/strong>：隐式方程 F(t,x,ẋ)=0 未必能解出 ẋ，此时无法标准化，需要隐函数定理的条件。<\/p>\n<p><strong>实例<\/strong>：y″+ω²y=0。令 x₁=y，x₂=y′，得 ẋ₁=x₂，ẋ₂=−ω²x₁。这是一个标准方程组，其解是 (cos ωt, −ω sin ωt) 的线性组合。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为&quot;标准化只是换记号&quot;<\/strong>——实际上它改变了定理的适用范围（从 n 阶到一阶向量）。\n<\/li><li>\n<strong>别以为&quot;复方程是另一套理论&quot;<\/strong>——实际上它等价于两个实方程。\n<\/li><li>\n<strong>别以为&quot;存在唯一性可以先用后证&quot;<\/strong>——实际上教材这么做是有意的教学顺序，自学时要知道证明在后面。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n三阶方程 y‴=f(t,y,y′,y″) 的标准形是什么？\n<p>（答案：ẋ₁=x₂，ẋ₂=x₃，ẋ₃=f(t,x₁,x₂,x₃)。解析：逐级引入低阶导数。）<\/p>\n<\/ol>\n<ol><li>\n复方程 ż=iz 对应的实方程组？\n<p>（答案：ẋ=−y，ẏ=x。解析：iz=i(x+iy)=−y+ix。）<\/p>\n<\/ol>\n<ol><li>\n为什么第一章先叙述定理后证明？\n<p>（答案：先用几何图像建立直觉，证明放在第四章。解析：教学顺序的安排。）<\/p>\n<\/ol>\n<ol><li>\n隐式方程何时不能标准化？\n<p>（答案：无法解出最高阶导数时。解析：需要隐函数定理的非退化条件。）<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n一切化为标准方程组 ẋ=f(t,x)。\n<\/li><li>\n复方程 = 两个实方程。\n<\/li><li>\n定理先叙述，证明在第四章。\n<\/ul>", "ch02": "<h1>第 2 章：常系数线性方程<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：12 小时 | <strong>前置<\/strong>：第 1 章、线性代数\n<\/li><li>\n<strong>对应原书<\/strong>：第二章（§7–§16）\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n按单根、重根两种情形写出常系数齐次方程的通解；\n<\/li><li>\n用赫尔维茨判据（稳定多项式）判断所有根是否具有负实部；\n<\/li><li>\n用消去法把方程组化为一元高阶方程；\n<\/li><li>\n用复数振幅法求正弦激励下的稳态解；\n<\/li><li>\n建立 RLC 电路与线性系统的对应；\n<\/li><li>\n在相平面上画出常系数线性系统的轨线。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>庞特里亚金这一章的重心不在&quot;怎么解&quot;，而在&quot;解的形状意味着什么&quot;：<strong>特征根决定振动还是发散，稳定多项式决定系统会不会炸，相平面决定轨线怎么排。<\/strong><\/p>\n<h2>零基础讲解<\/h2>\n<h3>2.1 单根与重根<\/h3>\n<p>特征方程 λⁿ+a₁λⁿ⁻¹+…+aₙ=0。<\/p>\n<p><strong>单根<\/strong>：每个 λᵢ 贡献 e^(λᵢt)。实根给指数，复根成对给 e^(αt)cos βt、e^(αt)sin βt。<\/p>\n<p><strong>重根<\/strong>：k 重根 λ 贡献 e^(λt)、t e^(λt)、…、t^(k−1)e^(λt)。这是&quot;共振&quot;的代数来源：重根意味着方程对激励的响应里出现时间幂。<\/p>\n<h3>2.2 稳定多项式<\/h3>\n<p>一个实系数多项式若所有根的实部为负，称<strong>稳定多项式<\/strong>（赫尔维茨意义下）。<\/p>\n<p><strong>赫尔维茨判据<\/strong>：把系数排成赫尔维茨矩阵，所有顺序主子式为正 ⇔ 稳定。<\/p>\n<p>对二阶 λ²+aλ+b：稳定 ⇔ a&gt;0 且 b&gt;0。对三阶 λ³+aλ²+bλ+c：稳定 ⇔ a&gt;0、c&gt;0、ab&gt;c。<\/p>\n<p><strong>为什么工程上关心这个<\/strong>：不必解方程，只看系数符号与一个不等式，就能判断系统是否稳定。这是控制理论的入门工具。<\/p>\n<h3>2.3 非齐次与消去法<\/h3>\n<p>非齐次用待定系数（右端为多项式、指数、正弦的组合）或常数变易。<\/p>\n<p><strong>消去法<\/strong>：把方程组逐个求导、消元，化为一元高阶方程。代价是引入&quot;多余解&quot;（消去过程中产生的假根），必须回代检验。<\/p>\n<h3>2.4 复数振幅法<\/h3>\n<p>对 ẋ=Ax+b e^(iωt)，设特解 x=u e^(iωt)，代入得<\/p>\n<div class=\"eq\">(A−iωI)u = −b ⇒ u=−(A−iωI)⁻¹b<\/div>\n<p>取实部即得实激励下的稳态解。这个方法把&quot;三角函数的相位计算&quot;变成了&quot;复数矩阵求逆&quot;。<\/p>\n<h3>2.5 电路与调速器<\/h3>\n<p>RLC 串联电路：L q̈+R q̇+q/C=E(t)，与弹簧-质量-阻尼系统完全同构。庞特里亚金用这个例子说明&quot;不同物理系统可以有同一个方程&quot;。<\/p>\n<p>离心调速器（§27 提前出现）则是&quot;稳定性决定机器能不能用&quot;的经典案例。<\/p>\n<h3>2.6 相平面<\/h3>\n<p>对二阶常系数系统，用 p=tr A、q=det A 分类：结点、鞍点、焦点、中心。这一节是第三章定性理论的预热。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[常系数方程] --&gt; B[特征方程]\n    B --&gt; C{根的类型}\n    C --&gt;|单实根| D[指数解]\n    C --&gt;|共轭复根| E[振荡解]\n    C --&gt;|重根| F[t 的幂 × 指数]\n    A --&gt; G[稳定多项式]\n    G --&gt; H[赫尔维茨判据]\n    A --&gt; I[非齐次]\n    I --&gt; J[复振幅法]\n    I --&gt; K[消去法]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：左边三支是&quot;解的形状&quot;，右边两支是&quot;不解方程也能得到的结论&quot;。工程上常用右边。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：特征根像&quot;系统的性格&quot;——负实根是&quot;冷静收敛&quot;，正实根是&quot;越吵越凶&quot;，纯虚根是&quot;永远摇摆&quot;。重根则是&quot;性格里带惯性&quot;，会多出一段越走越远的过程。<\/p>\n<p><strong>失效边界<\/strong>：这套分类只对常系数线性系统成立；变系数、非线性都要另想办法。<\/p>\n<p><strong>实例<\/strong>：L q̈+R q̇+q/C=E₀cos ωt。设复数激励 E₀e^(iωt)，解 u=E₀/(−Lω²+iRω+1/C)。取模得振幅，取辐角得相位差。当 ω=1/√(LC) 时振幅最大——这就是谐振。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为&quot;特征根都是负实部就一定稳定&quot;<\/strong>——对线性系统成立，对非线性只是局部结论。\n<\/li><li>\n<strong>别以为&quot;重根一定意味着不稳定&quot;<\/strong>——负实部重根仍稳定，只是有 t 的幂。\n<\/li><li>\n<strong>别以为&quot;消去法没有代价&quot;<\/strong>——会引入假解，必须回代。\n<\/li><li>\n<strong>别以为&quot;复振幅法只对电路有效&quot;<\/strong>——对任何线性系统都有效。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\nλ=−1 是三重根，齐次解里出现哪些项？\n<p>（答案：e^(−t)、t e^(−t)、t² e^(−t)。解析：重根给 t 的幂。）<\/p>\n<\/ol>\n<ol><li>\n二阶方程 λ²+aλ+b 稳定的条件？\n<p>（答案：a&gt;0 且 b&gt;0。解析：赫尔维茨判据的最简形式。）<\/p>\n<\/ol>\n<ol><li>\n消去法为什么要回代？\n<p>（答案：消元过程可能引入不满足原方程的解。解析：求导会丢失信息。）<\/p>\n<\/ol>\n<ol><li>\n复振幅法的核心一步？\n<p>（答案：设 x=u e^(iωt)，解 (A−iωI)u=−b。解析：把微分方程化为代数方程。）<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n单根写指数，重根加 t 的幂，复根写振荡。\n<\/li><li>\n稳定多项式看赫尔维茨判据。\n<\/li><li>\n相平面用 p、q 分类。\n<\/ul>", "ch03": "<h1>第 3 章：变系数线性方程<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：9 小时 | <strong>前置<\/strong>：第 2 章\n<\/li><li>\n<strong>对应原书<\/strong>：第三章（§17–§19）\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n写出标准线性方程组的一般理论（基解矩阵、常数变易）；\n<\/li><li>\n把 n 阶变系数方程纳入方程组框架；\n<\/li><li>\n处理周期系数系统，写出单值矩阵与稳定性判据；\n<\/li><li>\n说明&quot;变系数时没有特征值可用&quot;这一根本困难。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>变系数系统失去了&quot;特征值&quot;这个工具，只剩下两条路：<strong>基解矩阵<\/strong>（一般理论）与<strong>单值矩阵<\/strong>（周期情形）。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>3.1 标准线性方程组<\/h3>\n<div class=\"eq\">ẋ = A(t)x + b(t)<\/div>\n<p>A(t) 连续。解集 m 维，基解矩阵 Φ(t) 满足 Φ̇=AΦ，det Φ≠0（刘维尔公式）。<\/p>\n<p>非齐次：<\/p>\n<div class=\"eq\">x = Φ(t)[C + ∫Φ⁻¹(s)b(s)ds]<\/div>\n<h3>3.2 n 阶变系数方程<\/h3>\n<p>y⁽ⁿ⁾+a₁(t)y⁽ⁿ⁻¹⁾+…+aₙ(t)y=b(t) 化为方程组。降阶法：已知一个特解 y₁，令 y=u y₁ 可降一阶（刘维尔-达朗贝尔降阶）。<\/p>\n<h3>3.3 周期系数<\/h3>\n<p>A(t+T)=A(t)。此时 Φ(t+T)=Φ(t)M，M 是单值矩阵。判稳看 M 的特征值（乘子）模。<\/p>\n<p><strong>为什么这很重要<\/strong>：变系数系统没有固定特征值，&quot;稳定性&quot;必须另找判据。周期情形下，单值矩阵提供了这个判据。<\/p>\n<h3>3.4 与常系数的对照<\/h3>\n<table><thead><tr><th>项目<\/th><th>常系数<\/th><th>变系数<\/th><\/tr><\/thead><tbody><tr><td>基解矩阵<\/td><td>e^(At)<\/td><td>一般无显式<\/td><\/tr><tr><td>判稳工具<\/td><td>特征值<\/td><td>无（周期时有乘子）<\/td><\/tr><tr><td>解的构造<\/td><td>待定系数<\/td><td>常数变易<\/td><\/tr><\/tbody><\/table>\n<p>这张表是本章的&quot;痛点地图&quot;：中间那一行说明了为什么变系数理论比常系数难得多。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[变系数线性组] --&gt; B[基解矩阵]\n    B --&gt; C[常数变易]\n    A --&gt; D[周期系数]\n    D --&gt; E[单值矩阵 M]\n    E --&gt; F[乘子判稳]\n    A --&gt; G[高阶方程]\n    G --&gt; H[降阶法]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：左支是一般理论（存在但不显式），右支是周期情形（可算），下方是降阶技巧。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：常系数系统像&quot;匀速行驶的车&quot;，特征值就是速度；变系数系统像&quot;油门一直在变的 车&quot;，没有恒定速度，&quot;稳不稳&quot;要靠别的方式判。<\/p>\n<p><strong>失效边界<\/strong>：非周期变系数系统，乘子也无定义，稳定性只能靠李雅普诺夫函数或数值方法。<\/p>\n<p><strong>实例<\/strong>：A(t)=[[0,1],[−1,0]] 是常系数（也周期），M=Φ(2π)=I，乘子为 1，属临界。若改为 A(t)=[[0,1],[−1−ε cos t,0]]，参数 ε 跨过临界值时出现参数共振，乘子穿出单位圆。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为&quot;变系数也能算特征值&quot;<\/strong>——实际上 A(t) 随 t 变，特征值没有固定含义。\n<\/li><li>\n<strong>别以为&quot;周期系统的稳定性靠平均矩阵&quot;<\/strong>——平均化只在特定条件下有效。\n<\/li><li>\n<strong>别以为&quot;刘维尔公式只给行列式&quot;<\/strong>——它同时保证基解矩阵始终非奇异。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n刘维尔公式在变系数情形的形式？\n<p>（答案：det Φ(t)=det Φ(t₀)exp(∫tr A ds)。解析：与常系数相同形式。）<\/p>\n<\/ol>\n<ol><li>\n周期系数系统的判稳工具？\n<p>（答案：单值矩阵的乘子。解析：Φ(t+T)=Φ(t)M。）<\/p>\n<\/ol>\n<ol><li>\n降阶法需要什么前提？\n<p>（答案：已知一个非零特解。解析：y=u y₁ 代入后可降一阶。）<\/p>\n<\/ol>\n<ol><li>\n变系数系统为什么难？\n<p>（答案：没有固定特征值可算。解析：A(t) 随 t 变。）<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n基解矩阵 + 常数变易是一般理论。\n<\/li><li>\n周期情形用单值矩阵。\n<\/li><li>\n变系数没有特征值可用。\n<\/ul>", "ch04": "<h1>第 4 章：存在性定理<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：9 小时 | <strong>前置<\/strong>：第 1、3 章\n<\/li><li>\n<strong>对应原书<\/strong>：第四章（§20–§25）\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n完整证明一个方程与方程组的存在唯一性定理；\n<\/li><li>\n证明解对初值的连续性与可微性（局部定理）；\n<\/li><li>\n说明首次积分与轨线维数的关系；\n<\/li><li>\n描述轨线在最大时间区间上的行为（三种出口）；\n<\/li><li>\n区分局部定理与整体定理的假设差别。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>这一章把第一章&quot;先叙述&quot;的定理全部补上证明，并且多做一件事：<strong>把局部结论推到最大区间上<\/strong>。庞特里亚金的写法特别强调&quot;轨线跑到哪里去了&quot;。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>4.1 一个方程的证明<\/h3>\n<p>先对 n=1 证，再推广到方程组。步骤与皮卡一致：积分方程 → 迭代 → 估计 → 收敛 + 唯一。<\/p>\n<p><strong>为什么先证一个方程<\/strong>：记号简单，几何直观，且推广到方程组只是把绝对值换成范数。<\/p>\n<h3>4.2 局部连续性与可微性<\/h3>\n<p>解对初值连续依赖：两解作差 + 格朗沃尔。 解对初值可微：变分方程 Φ′=f_xΦ，Φ(t₀)=I。<\/p>\n<p><strong>局部定理的条件<\/strong>：f 在某个邻域内连续（及对 x 连续可微）。结论只在这个邻域对应的区间上成立。<\/p>\n<h3>4.3 首次积分<\/h3>\n<p>F 沿轨线为常数 ⇔ X·∇F=0。n 维系统独立首次积分有 n−1 个。<\/p>\n<h3>4.4 最大时间区间上的行为<\/h3>\n<p>轨线只有三种结局：<\/p>\n<ol><li>\n跑到定义域边界；\n<\/li><li>\n在有限时间内爆破（|x|→∞）；\n<\/li><li>\n定义到 ±∞。\n<\/ol>\n<p><strong>这条结论的用处<\/strong>：判断&quot;解能不能一直活下去&quot;，是稳定性讨论的前置问题。<\/p>\n<h3>4.5 整体定理<\/h3>\n<p>若 f 在整个区域内连续（且对 x 连续可微），且解在某个紧集内不逸出，则可微性在最大区间上整体成立。<\/p>\n<p><strong>局部 vs 整体的差别<\/strong>：局部定理只保证&quot;在某段区间上&quot;，整体定理要额外假设&quot;解不逸出紧集&quot;。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[局部定理] --&gt; B[区间 t0±h]\n    B --&gt; C[延拓]\n    C --&gt; D[最大区间]\n    D --&gt; E{三种出口}\n    E --&gt; F[到边界]\n    E --&gt; G[有限时间爆破]\n    E --&gt; H[延伸到无穷]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：这张图的核心是&quot;出口&quot;——很多证明题问&quot;解能否延伸到无穷&quot;，答案就在这三个分支里。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：最大区间像&quot;一条路的全程&quot;。局部定理只保证&quot;能走 h 米&quot;，整体定理告诉你能不能走完，出口分析告诉你路在哪里断。<\/p>\n<p><strong>失效边界<\/strong>：如果 f 在区域内不连续，出口分析失效，可能出现&quot;解在有限时间跳到另一支&quot;的怪现象。<\/p>\n<p><strong>实例<\/strong>：ẋ=x²，x(0)=1。解 x=1/(1−t)，在 t=1 爆破，最大区间是 (−∞,1)。这是第二种出口。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为&quot;局部解能一直延拓&quot;<\/strong>——实际上可能爆破。\n<\/li><li>\n<strong>别以为&quot;爆破就是解不存在&quot;<\/strong>——实际上解在爆破前存在，只是区间有限。\n<\/li><li>\n<strong>别以为&quot;整体定理与局部定理只差区间&quot;<\/strong>——整体定理要多假设不逸出。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n最大区间的三种出口？\n<p>（答案：到边界、有限时间爆破、延伸到无穷。解析：见 §24。）<\/p>\n<\/ol>\n<ol><li>\nẋ=x²，x(0)=1 的最大区间？\n<p>（答案：(−∞,1)。解析：解为 1/(1−t)，t=1 爆破。）<\/p>\n<\/ol>\n<ol><li>\n整体可微定理比局部定理多什么假设？\n<p>（答案：解不逸出紧集（或 f 在整体区域满足条件）。解析：否则无法控制。）<\/p>\n<\/ol>\n<ol><li>\n首次积分与轨线维数的关系？\n<p>（答案：n−1 个独立首次积分把轨线定成一维。解析：维数计数。）<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n证明四步 + 格朗沃尔。\n<\/li><li>\n首次积分有 n−1 个。\n<\/li><li>\n最大区间三种出口。\n<\/ul>", "ch05": "<h1>第 5 章：稳定性<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：10 小时 | <strong>前置<\/strong>：第 2、4 章\n<\/li><li>\n<strong>对应原书<\/strong>：第五章（§26–§31）\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n陈述并证明李雅普诺夫稳定性定理与渐近稳定性定理；\n<\/li><li>\n用离心调速器说明&quot;稳定性是工程可用性的前提&quot;；\n<\/li><li>\n说明极限环的存在与稳定性判据；\n<\/li><li>\n用电子管振荡器解释&quot;自激振荡&quot;的数学机制；\n<\/li><li>\n分析二阶自治系统平衡位置的类型；\n<\/li><li>\n讨论周期解的稳定性。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>庞特里亚金把稳定性写成&quot;工程问题的数学化&quot;：<strong>调速器会飞车、电子管会起振，都是因为平衡点或周期轨的稳定性发生了变化<\/strong>。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>5.1 李雅普诺夫定理<\/h3>\n<p><strong>稳定性<\/strong>：∀ε&gt;0，∃δ&gt;0，初值在 δ 内则轨线永远在 ε 内。 <strong>渐近稳定<\/strong>：稳定且 t→∞ 时趋于平衡点。<\/p>\n<p><strong>定理（第一方法）<\/strong>：A=f′(0)，特征值实部全负 ⇒ 渐近稳定。 <strong>定理（第二方法）<\/strong>：V 正定、V̇ 负半定 ⇒ 稳定；V̇ 负定 ⇒ 渐近稳定。<\/p>\n<h3>5.2 离心调速器<\/h3>\n<p>瓦特调速器的方程是一个二阶非线性系统。平衡点对应&quot;转速稳定&quot;。若平衡点不稳定，转速会持续上升或振荡——机器就废了。<\/p>\n<p>庞特里亚金用这个例子说明：<strong>稳定性不是数学游戏，是&quot;这台机器能不能用&quot;<\/strong>。<\/p>\n<h3>5.3 极限环<\/h3>\n<p>极限环是孤立的闭轨。存在判据在平面用庞加莱-本迪克松；稳定性用庞加莱映射的导数。<\/p>\n<p><strong>极限环的工程意义<\/strong>：它对应&quot;自激振荡&quot;——系统不需要外部周期激励，自己就会周期运动。<\/p>\n<h3>5.4 电子管振荡器<\/h3>\n<p>电子管电路的非线性特性使平衡点失稳，轨线被吸引到一个极限环上，于是产生稳定振幅的振荡。这就是&quot;振荡器&quot;的数学解释。<\/p>\n<h3>5.5 二阶自治系统与周期解稳定性<\/h3>\n<p>二阶自治系统的平衡位置用 p、q 分类。周期解的稳定性用&quot;绕一圈的放大率&quot;判断：放大率小于 1 则稳定。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[平衡点] --&gt; B[线性化]\n    B --&gt; C{双曲}\n    C --&gt;|是| D[特征值判稳]\n    C --&gt;|否| E[V 函数]\n    A --&gt; F[周期轨]\n    F --&gt; G[庞加莱映射]\n    G --&gt; H[放大率判稳]\n    D --&gt; I[工程: 调速器]\n    H --&gt; J[工程: 振荡器]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：左边是&quot;点&quot;的稳定性，右边是&quot;圈&quot;的稳定性；两侧各挂一个工程实例，这是本书的特色。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：极限环像&quot;跑道&quot;。不管运动员从哪里出发，最后都会跑上同一条跑道，以固定节奏绕圈——这就是振荡器的稳定振荡。<\/p>\n<p><strong>失效边界<\/strong>：三维以上没有庞加莱-本迪克松，闭轨存在性无简单判据。<\/p>\n<p><strong>实例<\/strong>：范德波尔方程 x″+ε(x²−1)x′+x=0（ε&gt;0）。原点不稳定（线性化特征值实部为正），但存在唯一稳定极限环，所有非零轨线都趋近它。这就是电子管振荡器的模型。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为&quot;稳定就是不动&quot;<\/strong>——实际上稳定是&quot;不跑远&quot;，可以振荡。\n<\/li><li>\n<strong>别以为&quot;极限环一定稳定&quot;<\/strong>——实际上有稳定环也有不稳定环。\n<\/li><li>\n<strong>别以为&quot;线性化判稳对所有系统有效&quot;<\/strong>——实际上非双曲时失效。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n第二方法判渐近稳定的条件？\n<p>（答案：V 正定且 V̇ 负定。解析：负半定只能给稳定。）<\/p>\n<\/ol>\n<ol><li>\n极限环的工程意义？\n<p>（答案：自激振荡，无需外部周期激励。解析：轨线被吸引到闭轨。）<\/p>\n<\/ol>\n<ol><li>\n周期解稳定性的判据？\n<p>（答案：庞加莱映射导数的绝对值小于 1。解析：绕一圈的放大率小于 1。）<\/p>\n<\/ol>\n<ol><li>\n调速器不稳定的后果？\n<p>（答案：转速失控或持续振荡。解析：平衡点失稳。）<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n线性化判稳 + V 函数补刀。\n<\/li><li>\n极限环 = 自激振荡。\n<\/li><li>\n周期解稳定性看庞加莱映射。\n<\/ul>", "ch06": "<h1>第 6 章：线性代数<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：4 小时 | <strong>前置<\/strong>：线性代数\n<\/li><li>\n<strong>对应原书<\/strong>：第六章（§32–§34）\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n求矩阵的最小零化多项式并说明它与若尔当形的关系；\n<\/li><li>\n用多项式定义矩阵函数，从而计算 e^(At)；\n<\/li><li>\n写出若尔当标准形并说明它如何决定解的结构。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>这一章是&quot;工具箱&quot;：<strong>矩阵函数、最小多项式、若尔当形<\/strong>三件工具，专门用来算 e^(At) 和处理重特征值。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>6.1 最小零化多项式<\/h3>\n<p>使 p(A)=0 的次数最低的首一多项式。它整除特征多项式，且它的根正是 A 的特征值（重数可能更小）。<\/p>\n<p><strong>用途<\/strong>：判断 A 能否对角化——最小多项式无重根 ⇔ 可对角化。<\/p>\n<h3>6.2 矩阵函数<\/h3>\n<p>对多项式 p，p(A) 有定义。对一般函数 f，用插值多项式定义：<\/p>\n<div class=\"eq\">f(A) = p(A)，其中 p 是在 A 的谱上插值 f 的多项式<\/div>\n<p>于是 e^(At) 可以通过&quot;在特征值处插值 e^(λt)&quot;来算。重特征值时要插值到导数阶。<\/p>\n<h3>6.3 若尔当标准形<\/h3>\n<p>A = P J P⁻¹，J 由若尔当块组成。块的大小由广义特征向量链的长度决定。<\/p>\n<p><strong>与解的关系<\/strong>：J 的块给 e^(λt)、t e^(λt)、…，这正是重根解里出现 t 的幂的代数原因。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[矩阵 A] --&gt; B[特征多项式]\n    B --&gt; C[最小多项式]\n    C --&gt; D{是否有重根}\n    D --&gt;|无| E[可对角化]\n    D --&gt;|有| F[若尔当形]\n    F --&gt; G[J = P^-1 A P]\n    G --&gt; H[e^(Jt) 分块计算]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：从最小多项式出发分两路，一路直接对角化，一路落到若尔当形。无论哪路，终点都是算 e^(At)。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：最小多项式像&quot;矩阵的身份证号&quot;——它比特征多项式更短，但足以唯一确定矩阵的谱结构。<\/p>\n<p><strong>失效边界<\/strong>：若尔当形在数值计算中不稳定（特征值接近时块结构难判定），实际计算常用其他方法。<\/p>\n<p><strong>实例<\/strong>：A=[[0,1],[0,0]]。特征多项式 λ²，最小多项式也是 λ²（因为 A≠0）。故不可对角化，e^(At)=I+At=[[1,t],[0,1]]。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为&quot;最小多项式等于特征多项式&quot;<\/strong>——实际上它可能更低次（如单位矩阵）。\n<\/li><li>\n<strong>别以为&quot;特征值重就一定不可对角化&quot;<\/strong>——实际上要看几何重数。\n<\/li><li>\n<strong>别以为&quot;若尔当形唯一&quot;<\/strong>——实际上块的排列顺序可不同（相差相似变换）。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n矩阵可对角化的充要条件（用最小多项式表述）？\n<p>（答案：最小多项式无重根。解析：等价于几何重数等于代数重数。）<\/p>\n<\/ol>\n<ol><li>\nA=[[0,1],[0,0]] 的 e^(At)？\n<p>（答案：[[1,t],[0,1]]。解析：幂零部分，指数展开只有两项。）<\/p>\n<\/ol>\n<ol><li>\n若尔当块的大小由什么决定？\n<p>（答案：广义特征向量链的长度。解析：链越长块越大。）<\/p>\n<\/ol>\n<ol><li>\n矩阵函数如何定义？\n<p>（答案：用谱上插值多项式。解析：重特征值需插值到导数阶。）<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n最小多项式判可对角化。\n<\/li><li>\n矩阵函数靠插值。\n<\/li><li>\n若尔当块解释 t 的幂。\n<\/ul>", "c01": "<h1>稳定多项式（赫尔维茨判据）<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 2 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>所有根的实部都为负的实系数多项式；判据是赫尔维茨矩阵的顺序主子式全为正。<\/p>\n<h2>为什么重要<\/h2>\n<p>它让&quot;系统是否稳定&quot;变成&quot;看系数&quot;，不必解方程。这是控制理论的第一课。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[特征多项式] --&gt; B[排赫尔维茨矩阵]\n    B --&gt; C[算顺序主子式]\n    C --&gt; D{全为正}\n    D --&gt;|是| E[稳定]\n    D --&gt;|否| F[不稳定或临界]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>二阶：λ²+aλ+b，稳定 ⇔ a&gt;0、b&gt;0。 三阶：λ³+aλ²+bλ+c，稳定 ⇔ a&gt;0、c&gt;0、ab&gt;c。 三阶那个不等式最关键：a、b、c 都正还不够，还要 ab&gt;c，否则有一对共轭复根跑到右半平面。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为&quot;系数全正就稳定&quot;（三阶反例）。\n<\/li><li>\n别以为判据对非线性系统有效（只对线性）。\n<\/li><li>\n别以为&quot;临界&quot;等于&quot;稳定&quot;。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 2 章<\/td><td>§9 稳定多项式<\/td><td>赫尔维茨判据<\/td><\/tr><tr><td>第 5 章<\/td><td>稳定性<\/td><td>线性化后用它<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：特征方程\n<\/li><li>\n后续：劳斯判据、李雅普诺夫\n<\/ul>", "c02": "<h1>极限环与自激振荡<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：第 5 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>孤立的闭轨；附近轨线螺旋趋近（稳定）或远离（不稳定）。工程上对应无需外部激励的持续振荡。<\/p>\n<h2>为什么重要<\/h2>\n<p>它解释了振荡器为什么能&quot;自己振起来&quot;，也解释了为什么某些系统会&quot;突然开始抖&quot;。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n    A[平衡点失稳] --&gt; B[轨线外扩]\n    B --&gt; C[被闭轨捕获]\n    C --&gt; D[稳定极限环]\n    D --&gt; E[固定振幅振荡]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>范德波尔方程是标准例子：小振幅时阻尼为负（能量注入），大振幅时阻尼为正（能量耗散），两者平衡处形成稳定极限环。<\/p>\n<p>存在性用庞加莱-本迪克松（平面），稳定性用庞加莱映射的导数。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为极限环 = 任意闭轨（中心型闭轨成族，不孤立）。\n<\/li><li>\n别以为存在极限环就一定稳定。\n<\/li><li>\n别以为三维系统也能用同一判据。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 5 章<\/td><td>§28 极限环<\/td><td>存在与稳定判据<\/td><\/tr><tr><td>第 5 章<\/td><td>§29 电子管振荡器<\/td><td>工程实例<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：闭轨、庞加莱映射\n<\/li><li>\n后续：分支、混沌\n<\/ul>", "c03": "<h1>矩阵指数<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 6 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>e^(At)=Σ(At)ᵏ/k!，是常系数线性系统 ẋ=Ax 的标准基解矩阵。<\/p>\n<h2>为什么重要<\/h2>\n<p>它是常系数系统的&quot;万能钥匙&quot;：解、稳定性、周期解都从它读出来。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[A] --&gt; B{能否对角化}\n    B --&gt;|能| C[P e^(Dt) P^-1]\n    B --&gt;|不能| D[P e^(Jt) P^-1]\n    D --&gt; E[分块: e^(λt)(I+Nt+...)]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>对角情形直接逐元素取指数；若尔当情形要处理幂零部分 N，展开只有有限项。数值上常用 scaling and squaring。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为可逐元素取指数（只对对角阵）。\n<\/li><li>\n别以为 e^(A+B)=e^A e^B（A、B 不交换时不对）。\n<\/li><li>\n别以为 e^(At) 一定可逆（它总是可逆，det=e^(tr A t)）。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 2 章<\/td><td>常系数解<\/td><td>基解矩阵<\/td><\/tr><tr><td>第 6 章<\/td><td>§33 矩阵函数<\/td><td>插值定义<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：矩阵乘法、幂零\n<\/li><li>\n后续：弗洛凯理论\n<\/ul>", "__path__": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：标准化<\/strong><br>阅读：<a href=\"#/chapter/ch01\">第 1 章：引论<\/a><br>检查点：能把三阶方程化为方程组<\/li><li class='path-step' id='path-02'><strong>步骤 02：常系数：根与解<\/strong><br>阅读：<a href=\"#/chapter/ch02\">第 2 章：常系数线性方程<\/a><br>检查点：写出重根解<\/li><li class='path-step' id='path-03'><strong>步骤 03：常系数：稳定多项式与工程<\/strong><br>阅读：<a href=\"#/chapter/ch02\">第 2 章：常系数线性方程<\/a><br>检查点：赫尔维茨判二阶<\/li><li class='path-step' id='path-04'><strong>步骤 04：变系数与周期系数<\/strong><br>阅读：<a href=\"#/chapter/ch03\">第 3 章：变系数线性方程<\/a><br>检查点：写出单值矩阵<\/li><li class='path-step' id='path-05'><strong>步骤 05：存在性定理<\/strong><br>阅读：<a href=\"#/chapter/ch04\">第 4 章：存在性定理<\/a><br>检查点：说出三种出口<\/li><li class='path-step' id='path-06'><strong>步骤 06：稳定性与极限环<\/strong><br>阅读：<a href=\"#/chapter/ch05\">第 5 章：稳定性<\/a><br>检查点：解释振荡器<\/li><li class='path-step' id='path-07'><strong>步骤 07：线性代数工具<\/strong><br>阅读：<a href=\"#/chapter/ch06\">第 6 章：线性代数<\/a><br>检查点：算 e^(At)<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "__quiz_all__": "<p>（无综合题）<\/p>", "__quiz_ch01__": "<h1>测验：第 1 章：引论<\/h1><div class='quiz-item' data-qid='q01' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 三阶方程化为标准方程组需要几个分量？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q01' value='0'> 1<\/label><label class='quiz-opt'><input type='radio' name='q01' value='1'> 2<\/label><label class='quiz-opt'><input type='radio' name='q01' value='2'> 3<\/label><label class='quiz-opt'><input type='radio' name='q01' value='3'> 4<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q02' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 复方程 ż=iz 对应的实系统是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q02' value='0'> ẋ=−y, ẏ=x<\/label><label class='quiz-opt'><input type='radio' name='q02' value='1'> ẋ=y, ẏ=x<\/label><label class='quiz-opt'><input type='radio' name='q02' value='2'> ẋ=x, ẏ=−y<\/label><label class='quiz-opt'><input type='radio' name='q02' value='3'> ẋ=−x, ẏ=−y<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch02__": "<h1>测验：第 2 章：常系数线性方程<\/h1><div class='quiz-item' data-qid='q03' data-type='single'><p class='quiz-q'><b>Q1.<\/b> λ=−2 是二重根，通解中会出现？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q03' value='0'> 只有 e^(−2t)<\/label><label class='quiz-opt'><input type='radio' name='q03' value='1'> e^(−2t) 与 t e^(−2t)<\/label><label class='quiz-opt'><input type='radio' name='q03' value='2'> cos 2t<\/label><label class='quiz-opt'><input type='radio' name='q03' value='3'> e^(2t)<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q04' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 二阶方程 λ²+aλ+b 稳定的条件？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q04' value='0'> a&gt;0<\/label><label class='quiz-opt'><input type='radio' name='q04' value='1'> b&gt;0<\/label><label class='quiz-opt'><input type='radio' name='q04' value='2'> a&gt;0 且 b&gt;0<\/label><label class='quiz-opt'><input type='radio' name='q04' value='3'> a&lt;0<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q05' data-type='single'><p class='quiz-q'><b>Q3.<\/b> 三阶稳定的附加不等式是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q05' value='0'> ab&gt;c<\/label><label class='quiz-opt'><input type='radio' name='q05' value='1'> ab&lt;c<\/label><label class='quiz-opt'><input type='radio' name='q05' value='2'> a&gt;c<\/label><label class='quiz-opt'><input type='radio' name='q05' value='3'> b&gt;c<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q06' data-type='single'><p class='quiz-q'><b>Q4.<\/b> 复振幅法的核心方程？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q06' value='0'> (A−iωI)u=−b<\/label><label class='quiz-opt'><input type='radio' name='q06' value='1'> (A+iωI)u=b<\/label><label class='quiz-opt'><input type='radio' name='q06' value='2'> Au=0<\/label><label class='quiz-opt'><input type='radio' name='q06' value='3'> (A−ωI)u=b<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch03__": "<h1>测验：第 3 章：变系数线性方程<\/h1><div class='quiz-item' data-qid='q07' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 变系数系统为什么没有「特征值」可用？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q07' value='0'> A 不可逆<\/label><label class='quiz-opt'><input type='radio' name='q07' value='1'> A(t) 随 t 变<\/label><label class='quiz-opt'><input type='radio' name='q07' value='2'> 没有基解矩阵<\/label><label class='quiz-opt'><input type='radio' name='q07' value='3'> 解不存在<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q08' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 周期系数判稳用什么？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q08' value='0'> 平均矩阵<\/label><label class='quiz-opt'><input type='radio' name='q08' value='1'> 单值矩阵的乘子<\/label><label class='quiz-opt'><input type='radio' name='q08' value='2'> 特征多项式<\/label><label class='quiz-opt'><input type='radio' name='q08' value='3'> 李雅普诺夫函数<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch04__": "<h1>测验：第 4 章：存在性定理<\/h1><div class='quiz-item' data-qid='q09' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 最大区间的三种出口不含？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q09' value='0'> 到边界<\/label><label class='quiz-opt'><input type='radio' name='q09' value='1'> 有限时间爆破<\/label><label class='quiz-opt'><input type='radio' name='q09' value='2'> 延伸到无穷<\/label><label class='quiz-opt'><input type='radio' name='q09' value='3'> 跳到另一支<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q10' data-type='single'><p class='quiz-q'><b>Q2.<\/b> ẋ=x²，x(0)=1 的最大区间是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q10' value='0'> R<\/label><label class='quiz-opt'><input type='radio' name='q10' value='1'> (0,1)<\/label><label class='quiz-opt'><input type='radio' name='q10' value='2'> (−∞,1)<\/label><label class='quiz-opt'><input type='radio' name='q10' value='3'> (1,+∞)<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch05__": "<h1>测验：第 5 章：稳定性<\/h1><div class='quiz-item' data-qid='q11' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 第二方法判稳定（非渐近）的条件？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q11' value='0'> V 正定, V̇ 负半定<\/label><label class='quiz-opt'><input type='radio' name='q11' value='1'> V 正定, V̇ 负定<\/label><label class='quiz-opt'><input type='radio' name='q11' value='2'> V 负定<\/label><label class='quiz-opt'><input type='radio' name='q11' value='3'> V̇&gt;0<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q12' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 电子管振荡器的数学机制是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q12' value='0'> 平衡点失稳 + 稳定极限环<\/label><label class='quiz-opt'><input type='radio' name='q12' value='1'> 平衡点稳定<\/label><label class='quiz-opt'><input type='radio' name='q12' value='2'> 无平衡点<\/label><label class='quiz-opt'><input type='radio' name='q12' value='3'> 线性共振<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q13' data-type='single'><p class='quiz-q'><b>Q3.<\/b> 极限环稳定性的判据？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q13' value='0'> 庞加莱映射导数绝对值&lt;1<\/label><label class='quiz-opt'><input type='radio' name='q13' value='1'> 特征值实部&lt;0<\/label><label class='quiz-opt'><input type='radio' name='q13' value='2'> V̇&lt;0<\/label><label class='quiz-opt'><input type='radio' name='q13' value='3'> 李雅普诺夫指数&gt;0<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch06__": "<h1>测验：第 6 章：线性代数<\/h1><div class='quiz-item' data-qid='q14' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 矩阵可对角化的最小多项式条件？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q14' value='0'> 无重根<\/label><label class='quiz-opt'><input type='radio' name='q14' value='1'> 次数等于阶数<\/label><label class='quiz-opt'><input type='radio' name='q14' value='2'> 等于特征多项式<\/label><label class='quiz-opt'><input type='radio' name='q14' value='3'> 常数项为 1<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q15' data-type='single'><p class='quiz-q'><b>Q2.<\/b> A=[[0,1],[0,0]] 的 e^(At)？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q15' value='0'> I<\/label><label class='quiz-opt'><input type='radio' name='q15' value='1'> [[1,t],[0,1]]<\/label><label class='quiz-opt'><input type='radio' name='q15' value='2'> [[e^t,0],[0,1]]<\/label><label class='quiz-opt'><input type='radio' name='q15' value='3'> [[0,1],[0,0]]<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz___all__": "<h1>测验：__all<\/h1><div class='quiz-item' data-qid='q16' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 本书把电路与振荡器放进教材的主要理由是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q16' value='0'> 增加趣味<\/label><label class='quiz-opt'><input type='radio' name='q16' value='1'> 说明稳定性决定工程可用性<\/label><label class='quiz-opt'><input type='radio' name='q16' value='2'> 减少证明<\/label><label class='quiz-opt'><input type='radio' name='q16' value='3'> 替代理论<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q17' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 常系数与变系数理论的关键分界是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q17' value='0'> 是否有基解矩阵<\/label><label class='quiz-opt'><input type='radio' name='q17' value='1'> 是否有固定特征值<\/label><label class='quiz-opt'><input type='radio' name='q17' value='2'> 是否可积<\/label><label class='quiz-opt'><input type='radio' name='q17' value='3'> 是否线性<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__cards__": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "__glossary__": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='标准方程组'>标准方程组 — ẋ=f(t,x) 形式的一阶方程组 <span class=glossary-ref>（第 1 章：引论）<\/span><\/li><li data-term='复值方程'>复值方程 — 未知函数取复值的方程 <span class=glossary-ref>（第 1 章：引论）<\/span><\/li><li data-term='特征方程'>特征方程 — 由常系数方程得到的代数方程 <span class=glossary-ref>（第 2 章：常系数线性方程）<\/span><\/li><li data-term='单根'>单根 — 特征方程的一重根 <span class=glossary-ref>（第 2 章：常系数线性方程）<\/span><\/li><li data-term='重根'>重根 — 特征方程的多重根 <span class=glossary-ref>（第 2 章：常系数线性方程）<\/span><\/li><li data-term='稳定多项式'>稳定多项式 — 所有根实部为负的多项式 <span class=glossary-ref>（第 2 章：常系数线性方程）<\/span><\/li><li data-term='赫尔维茨判据'>赫尔维茨判据 — 用顺序主子式判稳 <span class=glossary-ref>（第 2 章：常系数线性方程）<\/span><\/li><li data-term='消去法'>消去法 — 方程组消元化高阶方程 <span class=glossary-ref>（第 2 章：常系数线性方程）<\/span><\/li><li data-term='复振幅法'>复振幅法 — 用 e^(iωt) 求稳态解 <span class=glossary-ref>（第 2 章：常系数线性方程）<\/span><\/li><li data-term='rlc 电路'>RLC 电路 — 电感电阻电容串联回路 <span class=glossary-ref>（第 2 章：常系数线性方程）<\/span><\/li><li data-term='相平面'>相平面 — 二阶系统的状态平面 <span class=glossary-ref>（第 2 章：常系数线性方程）<\/span><\/li><li data-term='基解矩阵'>基解矩阵 — 线性无关解组成的矩阵 <span class=glossary-ref>（第 3 章：变系数线性方程）<\/span><\/li><li data-term='单值矩阵'>单值矩阵 — 周期系统走一圈的演化 <span class=glossary-ref>（第 3 章：变系数线性方程）<\/span><\/li><li data-term='乘子'>乘子 — 单值矩阵的特征值 <span class=glossary-ref>（第 3 章：变系数线性方程）<\/span><\/li><li data-term='降阶法'>降阶法 — 已知特解后降低方程阶数 <span class=glossary-ref>（第 3 章：变系数线性方程）<\/span><\/li><li data-term='迭代'>迭代 — 皮卡逐次逼近 <span class=glossary-ref>（第 4 章：存在性定理）<\/span><\/li><li data-term='首次积分'>首次积分 — 沿轨线取常数的函数 <span class=glossary-ref>（第 4 章：存在性定理）<\/span><\/li><li data-term='最大时间区间'>最大时间区间 — 解能延伸到的最大区间 <span class=glossary-ref>（第 4 章：存在性定理）<\/span><\/li><li data-term='爆破'>爆破 — 解在有限时间趋于无穷 <span class=glossary-ref>（第 4 章：存在性定理）<\/span><\/li><li data-term='李雅普诺夫稳定'>李雅普诺夫稳定 — 初值近则轨线不跑远 <span class=glossary-ref>（第 5 章：稳定性）<\/span><\/li><li data-term='渐近稳定'>渐近稳定 — 稳定且趋于平衡点 <span class=glossary-ref>（第 5 章：稳定性）<\/span><\/li><li data-term='离心调速器'>离心调速器 — 瓦特式转速调节装置 <span class=glossary-ref>（第 5 章：稳定性）<\/span><\/li><li data-term='极限环'>极限环 — 孤立的闭轨 <span class=glossary-ref>（第 5 章：稳定性）<\/span><\/li><li data-term='电子管振荡器'>电子管振荡器 — 自激振荡电路 <span class=glossary-ref>（第 5 章：稳定性）<\/span><\/li><li data-term='庞加莱映射'>庞加莱映射 — 绕一圈的首次回归映射 <span class=glossary-ref>（第 5 章：稳定性）<\/span><\/li><li data-term='最小零化多项式'>最小零化多项式 — 使 p(A)=0 的最低次首一多项式 <span class=glossary-ref>（第 6 章：线性代数）<\/span><\/li><li data-term='矩阵函数'>矩阵函数 — 用谱插值定义的 f(A) <span class=glossary-ref>（第 6 章：线性代数）<\/span><\/li><li data-term='若尔当形'>若尔当形 — 矩阵的标准分块形式 <span class=glossary-ref>（第 6 章：线性代数）<\/span><\/li><li data-term='广义特征向量'>广义特征向量 — 若尔当链上的向量 <span class=glossary-ref>（第 6 章：线性代数）<\/span><\/li><\/ul>", "__patterns__": "<h1>模式与框架库<\/h1>\n<h2>框架：从方程到工程结论<\/h2>\n<ol><li>\n写出物理方程（电路、机械）。\n<\/li><li>\n化为标准方程组。\n<\/li><li>\n算特征根或稳定多项式。\n<\/li><li>\n翻译回物理：稳定、振荡、谐振、自激。\n<\/ol>\n<p>这条链条是本书的组织逻辑。看每一节时，先问&quot;它在链条的哪一环&quot;。<\/p>\n<h2>框架：解的形状由特征根决定<\/h2>\n<ul><li>\n负实根：衰减。\n<\/li><li>\n正实根：发散。\n<\/li><li>\n纯虚根：等幅振荡。\n<\/li><li>\n复根带负实部：衰减振荡。\n<\/li><li>\n重根：多出 t 的幂。\n<\/ul>\n<h2>决策规则<\/h2>\n<ul><li>\n判稳定：先看系数符号，再算赫尔维茨不等式。\n<\/li><li>\n求稳态：用复振幅法，不硬算三角恒等式。\n<\/li><li>\n方程组要化高阶：用消去法，但记得回代。\n<\/li><li>\n变系数判稳：若不是周期，别找特征值，直接找 V。\n<\/ul>\n<h2>反模式<\/h2>\n<ul><li>\n<strong>以为系数全正就稳定<\/strong>。三阶还要 ab&gt;c。\n<\/li><li>\n<strong>对变系数系统套常系数公式<\/strong>。没有固定特征值。\n<\/li><li>\n<strong>把消去法的结果直接当答案<\/strong>。可能引入假解。\n<\/li><li>\n<strong>把极限环当中心<\/strong>。中心闭轨成族，极限环孤立。\n<\/ul>", "__cheatsheet__": "<h1>速查表<\/h1>\n<h2>常系数齐次<\/h2>\n<table><thead><tr><th>根<\/th><th>贡献的解<\/th><\/tr><\/thead><tbody><tr><td>实单根 λ<\/td><td>e^(λt)<\/td><\/tr><tr><td>共轭复根 α±iβ<\/td><td>e^(αt)cos βt, e^(αt)sin βt<\/td><\/tr><tr><td>k 重根 λ<\/td><td>e^(λt), t e^(λt), …, t^(k−1)e^(λt)<\/td><\/tr><\/tbody><\/table>\n<h2>赫尔维茨判据<\/h2>\n<table><thead><tr><th>阶<\/th><th>条件<\/th><\/tr><\/thead><tbody><tr><td>2<\/td><td>a&gt;0, b&gt;0<\/td><\/tr><tr><td>3<\/td><td>a&gt;0, c&gt;0, ab&gt;c<\/td><\/tr><tr><td>4<\/td><td>全部顺序主子式 &gt;0<\/td><\/tr><\/tbody><\/table>\n<h2>非齐次<\/h2>\n<table><thead><tr><th>右端<\/th><th>特解形式<\/th><\/tr><\/thead><tbody><tr><td>Pₙ(t)<\/td><td>Qₙ(t)（若 0 是根则乘 t^k）<\/td><\/tr><tr><td>e^(αt)Pₙ(t)<\/td><td>e^(αt)Qₙ(t)（若 α 是根则乘 t^k）<\/td><\/tr><tr><td>正弦/余弦<\/td><td>复振幅法：(A−iωI)u=−b<\/td><\/tr><\/tbody><\/table>\n<h2>变系数<\/h2>\n<table><thead><tr><th>场景<\/th><th>结论<\/th><\/tr><\/thead><tbody><tr><td>基解矩阵<\/td><td>Φ̇=AΦ，det≠0<\/td><\/tr><tr><td>非齐次<\/td><td>x=Φ[C+∫Φ⁻¹b]<\/td><\/tr><tr><td>刘维尔<\/td><td>det Φ=exp(∫tr A)<\/td><\/tr><tr><td>周期系统<\/td><td>Φ(t+T)=Φ(t)M<\/td><\/tr><\/tbody><\/table>\n<h2>存在性<\/h2>\n<table><thead><tr><th>结论<\/th><th>内容<\/th><\/tr><\/thead><tbody><tr><td>最大区间出口<\/td><td>到边界 / 爆破 / 到无穷<\/td><\/tr><tr><td>首次积分数<\/td><td>n−1<\/td><\/tr><tr><td>局部 vs 整体<\/td><td>整体要多假设不逸出<\/td><\/tr><\/tbody><\/table>\n<h2>稳
