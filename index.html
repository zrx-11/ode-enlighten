label class='quiz-opt'><input type='radio' name='ch04-q07' value='1'> x/2<\/label><label class='quiz-opt'><input type='radio' name='ch04-q07' value='2'> cos x<\/label><label class='quiz-opt'><input type='radio' name='ch04-q07' value='3'> x²<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch04-q08' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 欧拉方程 x²y″+xy′−y=0 的解？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch04-q08' value='0'> C₁x+C₂/x<\/label><label class='quiz-opt'><input type='radio' name='ch04-q08' value='1'> C₁cos+C₂sin<\/label><label class='quiz-opt'><input type='radio' name='ch04-q08' value='2'> C₁e^x<\/label><label class='quiz-opt'><input type='radio' name='ch04-q08' value='3'> C₁x²<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch05__": "<h1>测验：第 5 章：线性微分方程组<\/h1><div class='quiz-item' data-qid='ch05-q09' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 基解矩阵要验几步？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch05-q09' value='0'> 1<\/label><label class='quiz-opt'><input type='radio' name='ch05-q09' value='1'> 2<\/label><label class='quiz-opt'><input type='radio' name='ch05-q09' value='2'> 3<\/label><label class='quiz-opt'><input type='radio' name='ch05-q09' value='3'> 不必验<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch05-q10' data-type='single'><p class='quiz-q'><b>Q2.<\/b> det Φ(t) 等于？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch05-q10' value='0'> 1<\/label><label class='quiz-opt'><input type='radio' name='ch05-q10' value='1'> det Φ(0)e^(t tr A)<\/label><label class='quiz-opt'><input type='radio' name='ch05-q10' value='2'> e^(t)<\/label><label class='quiz-opt'><input type='radio' name='ch05-q10' value='3'> det A<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch06__": "<h1>测验：第 6 章：非线性与稳定性<\/h1><div class='quiz-item' data-qid='ch06-q11' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 特征值 −1±2i 对应？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch06-q11' value='0'> 稳定结点<\/label><label class='quiz-opt'><input type='radio' name='ch06-q11' value='1'> 稳定焦点<\/label><label class='quiz-opt'><input type='radio' name='ch06-q11' value='2'> 不稳定焦点<\/label><label class='quiz-opt'><input type='radio' name='ch06-q11' value='3'> 中心<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch06-q12' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 捕获域需要几个条件？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch06-q12' value='0'> 1<\/label><label class='quiz-opt'><input type='radio' name='ch06-q12' value='1'> 2<\/label><label class='quiz-opt'><input type='radio' name='ch06-q12' value='2'> 3<\/label><label class='quiz-opt'><input type='radio' name='ch06-q12' value='3'> 4<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch07__": "<h1>测验：第 7 章：一阶线性偏微分方程<\/h1><div class='quiz-item' data-qid='ch07-q13' data-type='single'><p class='quiz-q'><b>Q1.<\/b> x u_x+y u_y=0 的通解？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch07-q13' value='0'> F(x−y)<\/label><label class='quiz-opt'><input type='radio' name='ch07-q13' value='1'> F(y/x)<\/label><label class='quiz-opt'><input type='radio' name='ch07-q13' value='2'> F(xy)<\/label><label class='quiz-opt'><input type='radio' name='ch07-q13' value='3'> F(x+y)<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch07-q14' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 非特征条件？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch07-q14' value='0'> a x_τ−b y_τ≠0<\/label><label class='quiz-opt'><input type='radio' name='ch07-q14' value='1'> a y_τ−b x_τ≠0<\/label><label class='quiz-opt'><input type='radio' name='ch07-q14' value='2'> a+b≠0<\/label><label class='quiz-opt'><input type='radio' name='ch07-q14' value='3'> x_τ+y_τ≠0<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch08__": "<h1>测验：第 8 章：边值问题<\/h1><div class='quiz-item' data-qid='ch08-q15' data-type='single'><p class='quiz-q'><b>Q1.<\/b> y″+π²y=0，y(0)=y(1)=0 有非零解吗？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch08-q15' value='0'> 有<\/label><label class='quiz-opt'><input type='radio' name='ch08-q15' value='1'> 无<\/label><label class='quiz-opt'><input type='radio' name='ch08-q15' value='2'> 唯一<\/label><label class='quiz-opt'><input type='radio' name='ch08-q15' value='3'> 不确定<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch08-q16' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 格林函数在 x=s 处？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch08-q16' value='0'> 连续且导数跃 1<\/label><label class='quiz-opt'><input type='radio' name='ch08-q16' value='1'> 间断<\/label><label class='quiz-opt'><input type='radio' name='ch08-q16' value='2'> 导数为 0<\/label><label class='quiz-opt'><input type='radio' name='ch08-q16' value='3'> 等于 _": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='曲线族'>曲线族 — 含参数的曲线集合 <span class=glossary-ref>（第 1 章：绪论与基本概念）<\/span><\/li><li data-term='通解'>通解 — 含 n 个独立常数的解 <span class=glossary-ref>（第 1 章：绪论与基本概念）<\/span><\/li><li data-term='特解'>特解 — 由初值定出的解 <span class=glossary-ref>（第 1 章：绪论与基本概念）<\/span><\/li><li data-term='等斜线'>等斜线 — 斜率相同的点的轨迹 <span class=glossary-ref>（第 1 章：绪论与基本概念）<\/span><\/li><li data-term='分离变量'>分离变量 — 变量各自归边后积分 <span class=glossary-ref>（第 2 章：一阶方程初等解法）<\/span><\/li><li data-term='积分因子'>积分因子 — 使方程恰当的乘子 <span class=glossary-ref>（第 2 章：一阶方程初等解法）<\/span><\/li><li data-term='克莱罗方程'>克莱罗方程 — y=xp+g(p) <span class=glossary-ref>（第 2 章：一阶方程初等解法）<\/span><\/li><li data-term='拉格朗日方程'>拉格朗日方程 — y=xf(p)+g(p) <span class=glossary-ref>（第 2 章：一阶方程初等解法）<\/span><\/li><li data-term='参数表示'>参数表示 — 用 p 作参数表示解 <span class=glossary-ref>（第 2 章：一阶方程初等解法）<\/span><\/li><li data-term='李普希茨'>李普希茨 — 差被常数乘距离控制 <span class=glossary-ref>（第 3 章：存在唯一性与奇解）<\/span><\/li><li data-term='皮卡迭代'>皮卡迭代 — 逐次逼近 <span class=glossary-ref>（第 3 章：存在唯一性与奇解）<\/span><\/li><li data-term='奇解'>奇解 — 族外包络 <span class=glossary-ref>（第 3 章：存在唯一性与奇解）<\/span><\/li><li data-term='最大存在区间'>最大存在区间 — 解能延伸的最大区间 <span class=glossary-ref>（第 3 章：存在唯一性与奇解）<\/span><\/li><li data-term='特征方程'>特征方程 — 常系数方程的代数式 <span class=glossary-ref>（第 4 章：高阶线性方程）<\/span><\/li><li data-term='待定系数'>待定系数 — 按右端猜特解 <span class=glossary-ref>（第 4 章：高阶线性方程）<\/span><\/li><li data-term='共振'>共振 — 右端频率等于固有频率 <span class=glossary-ref>（第 4 章：高阶线性方程）<\/span><\/li><li data-term='朗斯基行列式'>朗斯基行列式 — 判线性相关的行列式 <span class=glossary-ref>（第 4 章：高阶线性方程）<\/span><\/li><li data-term='欧拉方程'>欧拉方程 — 可用 x=eᵗ 化简的方程 <span class=glossary-ref>（第 4 章：高阶线性方程）<\/span><\/li><li data-term='基解矩阵'>基解矩阵 — 线性无关解排成的矩阵 <span class=glossary-ref>（第 5 章：线性微分方程组）<\/span><\/li><li data-term='刘维尔公式'>刘维尔公式 — det Φ=e^(t tr A) <span class=glossary-ref>（第 5 章：线性微分方程组）<\/span><\/li><li data-term='矩阵指数'>矩阵指数 — e^(At) <span class=glossary-ref>（第 5 章：线性微分方程组）<\/span><\/li><li data-term='雅可比矩阵'>雅可比矩阵 — 右端对状态的偏导 <span class=glossary-ref>（第 6 章：非线性与稳定性）<\/span><\/li><li data-term='平衡点'>平衡点 — 右端为零的点 <span class=glossary-ref>（第 6 章：非线性与稳定性）<\/span><\/li><li data-term='渐近稳定'>渐近稳定 — 稳定且趋于平衡点 <span class=glossary-ref>（第 6 章：非线性与稳定性）<\/span><\/li><li data-term='极限环'>极限环 — 孤立闭轨 <span class=glossary-ref>（第 6 章：非线性与稳定性）<\/span><\/li><li data-term='捕获域'>捕获域 — 轨线进得去出不来的区域 <span class=glossary-ref>（第 6 章：非线性与稳定性）<\/span><\/li><li data-term='首次积分'>首次积分 — 沿轨线取常数 <span class=glossary-ref>（第 7 章：一阶线性偏微分方程）<\/span><\/li><li data-term='特征线'>特征线 — PDE 沿之降为 ODE <span class=glossary-ref>（第 7 章：一阶线性偏微分方程）<\/span><\/li><li data-term='非特征条件'>非特征条件 — 初值曲线横截特征方向 <span class=glossary-ref>（第 7 章：一阶线性偏微分方程）<\/span><\/li><li data-term='格林函数'>格林函数 — 单位点源响应 <span class=glossary-ref>（第 8 章：边值问题）<\/span><\/li><li data-term='特征函数展开'>特征函数展开 — 按特征函数分解右端 <span class=glossary-ref>（第 8 章：边值问题）<\/span><\/li><li data-term='共振（边值）'>共振（边值） — λ 等于特征值 <span class=glossary-ref>（第 8 章：边值问题）<\/span><\/li><\/ul>", "__patterns__": "<h1>模式与框架库<\/h1>\n<h2>框架：四类四动作<\/h2>\n<ul><li>\n分离变量 → 积分 + 补常数解。\n<\/li><li>\n线性 → 积分因子 e^(∫P)。\n<\/li><li>\n恰当 → 凑全微分。\n<\/li><li>\n隐式 → 参数 p 降阶。\n<\/ul>\n<h2>框架：线性方程两段式<\/h2>\n<p>齐次拿基础解系，非齐次找一个特解。特解三选一：待定系数、常数变易、观察。<\/p>\n<h2>决策规则<\/h2>\n<ul><li>\n判唯一：偏导有界即可。\n<\/li><li>\n判奇解：五步走完。\n<\/li><li>\n判稳定：五步走完。\n<\/li><li>\n判边值：先看齐次。\n<\/ul>\n<h2>反模式<\/h2>\n<ul><li>\n只验一个点就说&quot;是解&quot;。\n<\/li><li>\n忽略常数解与奇解。\n<\/li><li>\n基解矩阵只验 Φ′=AΦ 忘了 det。\n<\/li><li>\n边值问题不先判齐次直接积分。\n<\/ul>", "__cheatsheet__": "<h1>速查表<\/h1>\n<h2>一阶<\/h2>\n<table><thead><tr><th>类型<\/th><th>动作<\/th><\/tr><\/thead><tbody><tr><td>分离<\/td><td>dy/g= f dx<\/td><\/tr><tr><td>线性<\/td><td>μ=e^(∫P)<\/td><\/tr><tr><td>恰当<\/td><td>P_y=Q_x<\/td><\/tr><tr><td>隐式<\/td><td>p=y′，对 x 求导<\/td><\/tr><tr><td>克莱罗<\/td><td>y=xp+g(p)<\/td><\/tr><\/tbody><\/table>\n<h2>高阶<\/h2>\n<table><thead><tr><th>根<\/th><th>解<\/th><\/tr><\/thead><tbody><tr><td>实单<\/td><td>e^(λx)<\/td><\/tr><tr><td>复<\/td><td>e^(αx)cos βx, sin<\/td><\/tr><tr><td>k 重<\/td><td>x^j e^(λx), j&lt;k<\/td><\/tr><\/tbody><\/table>\n<table><thead><tr><th>右端<\/th><th>特解<\/th><\/tr><\/thead><tbody><tr><td>e^(αx)Pₙ<\/td><td>e^(αx)Qₙx^k<\/td><\/tr><tr><td>三角<\/td><td>复指数取实部<\/td><\/tr><\/tbody><\/table>\n<h2>方程组<\/h2>\n<table><thead><tr><th>项目<\/th><th>公式<\/th><\/tr><\/thead><tbody><tr><td>基解矩阵<\/td><td>Φ′=AΦ，det≠0<\/td><\/tr><tr><td>刘维尔<\/td><td>det Φ=e^(t tr A)<\/td><\/tr><tr><td>非齐次<\/td><td>x=Φ[C+∫Φ⁻¹b]<\/td><\/tr><\/tbody><\/table>\n<h2>稳定<\/h2>\n<table><thead><tr><th>项目<\/th><th>判据<\/th><\/tr><\/thead><tbody><tr><td>线性化<\/td><td>实部全负<\/td><\/tr><tr><td>二次型<\/td><td>AᵀP+PA=−Q，P&gt;0<\/td><\/tr><tr><td>闭轨<\/td><td>捕获域 + 无平衡点<\/td><\/tr><\/tbody><\/table>\n<h2>PDE / 边值<\/h2>\n<table><thead><tr><th>项目<\/th><th>公式<\/th><\/tr><\/thead><tbody><tr><td>齐次 PDE<\/td><td>u=F(Φ)<\/td><\/tr><tr><td>非特征<\/td><td>a y_τ−b x_τ≠0<\/td><\/tr><tr><td>格林函数<\/td><td>G(x,s)，导数跃 1<\/td><\/tr><tr><td>特征展开<\/td><td>y=Σfₙ/(λₙ−λ)·φₙ<\/td><\/tr><\/tbody><\/table>"}, "nav": [{"label": "学习路径", "href": "#/path"}, {"label": "章节", "children": [{"label": "第 1 章：绪论与基本概念", "href": "#/chapter/ch01"}, {"label": "第 2 章：一阶方程初等解法", "href": "#/chapter/ch02"}, {"label": "第 3 章：存在唯一性与奇解", "href": "#/chapter/ch03"}, {"label": "第 4 章：高阶线性方程", "href": "#/chapter/ch04"}, {"label": "第 5 章：线性微分方程组", "href": "#/chapter/ch05"}, {"label": "第 6 章：非线性与稳定性", "href": "#/chapter/ch06"}, {"label": "第 7 章：一阶线性偏微分方程", "href": "#/chapter/ch07"}, {"label": "第 8 章：边值问题", "href": "#/chapter/ch08"}]}, {"label": "概念", "children": [{"label": "曲线族与微分方程", "href": "#/concept/c01"}, {"label": "朗斯基行列式", "href": "#/concept/c02"}, {"label": "格林函数", "href": "#/concept/c03"}]}, {"label": "测验", "children": [{"label": "综合测验", "href": "#/quiz/all"}, {"label": "测验：第 1 章：绪论与基本概念", "href": "#/quiz/ch01"}, {"label": "测验：第 2 章：一阶方程初等解法", "href": "#/quiz/ch02"}, {"label": "测验：第 3 章：存在唯一性与奇解", "href": "#/quiz/ch03"}, {"label": "测验：第 4 章：高阶线性方程", "href": "#/quiz/ch04 , "轨线一定闭合", "积分曲线一定不闭合"], "answer": 1, "explain": "轨线只记录经过的点。"}, {"id": "ch09-q18", "chapterId": "ch09", "type": "single", "question": "极限环与中心型闭轨的关键差别是？", "options": ["极限环是孤立的", "极限环不稳定", "中心闭轨不存在", "两者相同"], "answer": 0, "explain": "极限环孤立，中心闭轨连续成族。"}, {"id": "q19", "chapterId": "__all", "type": "single", "question": "为什么周期系数系统不能直接对 A(t) 求特征值？", "options": ["A(t) 不可逆", "A(t) 随 t 变化，没有固定谱", "特征值必为复数", "需要对称矩阵"], "answer": 1, "explain": "只有常矩阵才有固定特征值，周期系数要用单值矩阵。"}, {"id": "q20", "chapterId": "__all", "type": "single", "question": "解析解方法与定性理论的分工是？", "options": ["前者给局部精确解，后者给全局结构", "两者等价", "前者更精确所以总能替代后者", "后者只对线性系统有效"], "answer": 0, "explain": "解析解局部有效，定性理论处理大范围行为。"}], "flashcards": [{"id": "f01", "chapterId": "ch01", "front": "通解为什么可能漏解？", "back": "分离变量时除掉的因子对应的常数解不在族内。", "tags": ["易错"]}, {"id": "f02", "chapterId": "ch01", "front": "线素场的奇异点是什么？", "back": "方向无定义的点，常是积分曲线族的中心或汇聚点。", "tags": ["几何"]}, {"id": "f03", "chapterId": "ch01", "front": "由曲线族求方程的方法？", "back": "求导 n 次后消去 n 个常数。", "tags": ["方法"]}, {"id": "f04", "chapterId": "ch02", "front": "初等解法的主线是什么？", "back": "找积分因子把方程凑成全微分 du=0。", "tags": ["主线"]}, {"id": "f05", "chapterId": "ch02", "front": "克莱罗方程的奇解来自哪里？", "back": "包络，由 x+g′(p)=0 给出。", "tags": ["奇解"]}, {"id": "f06", "chapterId": "ch02", "front": "Riccati 方程已知特解后的换元？", "back": "y=y₁+1/u，化为 u 的线性方程。", "tags": ["技巧"]}, {"id": "f07", "chapterId": "ch03", "front": "Picard 与 Peano 的条件差别？", "back": "前者要李普希茨，后者只要连续。", "tags": ["定理"]}, {"id": "f08", "chapterId": "ch03", "front": "Peano 定理证明用哪条定理？", "back": "Ascoli-Arzelà 紧性定理。", "tags": ["证明"]}, {"id": "f09", "chapterId": "ch03", "front": "饱和解的终止条件？", "back": "抵达定义域边界或有限时间爆破。", "tags": ["延拓"]}, {"id": "f10", "chapterId": "ch04", "front": "变分方程的初值？", "back": "单位矩阵 I。", "tags": ["公式"]}, {"id": "f11", "chapterId": "ch04", "front": "连续依赖估计式？", "back": "|Δy|≤|Δy₀|e^(L|x−x₀|)。", "tags": ["公式"]}, {"id": "f12", "chapterId": "ch04", "front": "灵敏度方程比变分方程多哪项？", "back": "f_μ。", "tags": ["理解"]}, {"id": "f13", "chapterId": "ch05", "front": "单值矩阵定义？", "back": "M=Φ(T)。", "tags": ["定义"]}, {"id": "f14", "chapterId": "ch05", "front": "乘子模为 1 能判稳吗？", "back": "不能，属临界情形。", "tags": ["易错"]}, {"id": "f15", "chapterId": "ch05", "front": "基解矩阵不唯一的理由？", "back": "右乘任意非奇异常矩阵仍是基解矩阵。", "tags": ["理解"]}, {"id": "f16", "chapterId": "ch06", "front": "柯西定理结论？", "back": "右端解析则解解析。", "tags": ["定理"]}, {"id": "f17", "chapterId": "ch06", "front": "收敛半径怎么估？", "back": "不小于到最近奇点的距离。", "tags": ["方法"]}, {"id": "f18", "chapterId": "ch06", "front": "指标方程两根差整数时会怎样？", "back": "第二个解可能带对数项。", "tags": ["例外"]}, {"id": "f19", "chapterId": "ch07", "front": "S-L 问题自伴性来自哪里？", "back": "分部积分后边界项由边界条件消去。", "tags": ["证明"]}, {"id": "f20", "chapterId": "ch07", "front": "展开系数公式？", "back": "cₙ=∫ρfyₙ/∫ρyₙ²。", "tags": ["公式"]}, {"id": "f21", "chapterId": "ch07", "front": "周期边值为何出现二重特征值？", "back": "sin nx 与 cos nx 同时满足周期条件。", "tags": ["理解"]}, {"id": "f22", "chapterId": "ch08", "front": "首次积分的条件式？", "back": "X·∇F=0。", "tags": ["定义"]}, {"id": "f23", "chapterId": "ch08", "front": "齐次 PDE 通解形式？", "back": "u=F(Φ)，Φ 是首次积分。", "tags": ["公式"]}, {"id": "f24", "chapterId": "ch08", "front": "柯西问题的横截条件？", "back": "a·dy₀/dτ−b·dx₀/dτ≠0。", "tags": ["判据"]}, {"id": "f25", "chapterId": "ch09", "front": "双曲平衡点定义？", "back": "特征值实部全不为零。", "tags": ["定义"]}, {"id": "f26", "chapterId": "ch09", "front": "极限环存在判据？", "back": "平面、有界区域、无平衡点。", "tags": ["定理"]}, {"id": "f27", "chapterId": "ch09", "front": "环面上轨线何时不闭合？", "back": "两频率不可公度时稠密不闭合。", "tags": ["现象"]}], "companion": "liubin-ode学习伴侣.html"}, "rendered": {"ch01": "<h1>第 1 章：微分方程的基本概念<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★☆☆ | <strong>预估学时<\/strong>：2 小时 | <strong>前置<\/strong>：微积分\n<\/li><li>\n<strong>对应原书<\/strong>：第一章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n说清&quot;常&quot;与&quot;偏&quot;的分界在哪；\n<\/li><li>\n判断阶数与线性性，并说明为什么 y′=y(y−1) 不是线性方程；\n<\/li><li>\n解释通解为什么不等于&quot;全部解&quot;，并给出一个具体反例；\n<\/li><li>\n由一族含 n 个任意常数的曲线反求它所满足的微分方程。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>常微分方程研究的是&quot;一元函数的局部变化规律&quot;，通解是局部规律的积分产物，它天生可能漏掉某些解。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>1.1 &quot;常&quot;字的含义<\/h3>\n<p>未知函数是一元函数，方程里只出现常导数；未知函数是多元函数、出现偏导数，就是偏微分方程。平面 Laplace 方程 u_xx+u_yy=0 有两个自变量，所以它不是常微分方程。<\/p>\n<p>教材在这里特意点出：<strong>定义里的&quot;阶&quot;指的是实际出现的最高阶导数<\/strong>，而不是方程里写了几个导数符号。y′=y 是一阶，y″+y′=y 是二阶。<\/p>\n<h3>1.2 解、通解与&quot;漏解&quot;<\/h3>\n<p>定义很直白：代入后成为恒等式的函数就是解。麻烦在通解。<\/p>\n<p>教材的注 1.3 举了一个必须记住的例子：方程<\/p>\n<div class=\"eq\">dy/dx = y²<\/div>\n<p>的通解是 y=−1/(x−c)（x&gt;c 那一支），但 y≡0 也是解，且不属于这个函数族。原因很简单：分离变量时把 y² 除下去了，y=0 被排除在讨论之外。<\/p>\n<p>所以&quot;n 阶方程的通解含 n 个任意常数&quot;这句话只描述解族的规模，不承诺覆盖所有解。这是后续&quot;奇解&quot;概念的伏笔。<\/p>\n<h3>1.3 由曲线族反求方程<\/h3>\n<p>给一族曲线 y=φ(x; c₁,…,cₙ)，要求消去常数得到微分方程。做法是：连续求导 n 次，得到 n+1 个方程（含原式），从中消去 c₁,…,cₙ。<\/p>\n<p>例：y=c₁x+c₂x²。求导得 y′=c₁+2c₂x，再求导得 y″=2c₂。由第二式 c₂=y″/2，代回第一式得 c₁=y′−xy″。再代入原式：<\/p>\n<div class=\"eq\">y = (y′−x·y″)x + (y″/2)x² = xy′ − x²y″/2<\/div>\n<p>整理得 x²y″−2xy′+2y=0。这正是欧拉方程的一个特例。<\/p>\n<h3>1.4 几何意义：线素场<\/h3>\n<p>对 y′=f(x,y)，在每点画一段斜率为 f(x,y) 的短线，得到<strong>线素场<\/strong>。使 f 无定义或为不定式的点叫<strong>奇异点<\/strong>，它们往往是积分曲线族的中心或汇集点。<\/p>\n<p>例：y′=y/x。等斜线 f(x,y)=k 是直线 y=kx，而这条直线本身的斜率也是 k，所以它与线素场完全吻合，积分曲线就是从原点出发的射线族。原点就是奇异点。<\/p>\n<blockquote>类比：线素场像一张&quot;风向图&quot;，积分曲线是一片叶子的漂移轨迹。<\/blockquote>\n<blockquote>失效边界：奇异点处风向没有定义，叶子在那儿可以停住不动（常数解经过奇异点时行为要单独分析）。<\/blockquote>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n    A[曲线族 含 n 个常数] --&gt; B[连续求导 n 次]\n    B --&gt; C[消去常数]\n    C --&gt; D[n 阶微分方程]\n    D --&gt; E[通解 可能漏解]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：箭头方向说明&quot;曲线族 → 方程&quot;是求导消参，&quot;方程 → 曲线族&quot;是积分。后者会丢信息（丢的就是那些被除掉的因子对应的解）。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：求导是&quot;降信息&quot;的操作，积分是&quot;补信息&quot;的操作，但补回来的信息里，常数是猜的。所以从方程回到解，必然会丢掉那些&quot;不含任意常数&quot;的孤立解。<\/p>\n<p><strong>实例<\/strong>：验证 y=±√(c−x²)（|x|&lt;√c）是 y′=−x/y 的解。求导：y′=−x/y 直接成立（对 y 求导得 −x/y）。但把 c=0 代入得 y=0，而 y=0 不满足原方程（分母为零），说明这个&quot;解&quot;是在开区间上成立的。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为&quot;通解就是所有解&quot;<\/strong>——实际上 y′=y² 的 y≡0 不在通解族里。\n<\/li><li>\n<strong>别以为&quot;方程里出现几个导数符号就是几阶&quot;<\/strong>——实际上看最高阶。\n<\/li><li>\n<strong>别以为&quot;曲线族反求方程唯一&quot;<\/strong>——实际上消参方式不同可能得到等价但形式不同的方程。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n判断 y″+sin y=0 的阶数与线性性。\n<p>（答案：二阶，非线性。解析：sin y 关于 y 不是一次式。）<\/p>\n<\/ol>\n<ol><li>\n求曲线族 y=c₁eˣ+c₂e^(2x) 满足的微分方程。\n<p>（答案：y″−3y′+2y=0。解析：特征根 1、2 对应特征方程 (r−1)(r−2)=0，展开即得。）<\/p>\n<\/ol>\n<ol><li>\n为什么 y≡0 是 y′=y² 的解却不在通解族里？\n<p>（答案：分离变量时除以 y² 把它排除了。解析：这是&quot;除零丢解&quot;的典型例子。）<\/p>\n<\/ol>\n<ol><li>\n线素场的奇异点有什么特点？\n<p>（答案：f 在该点无定义或为不定式，方向不确定。解析：常是积分曲线族的中心或汇聚点。）<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n&quot;常&quot;指一元函数；阶看最高阶导数。\n<\/li><li>\n通解含 n 个常数，但不保证覆盖全部解。\n<\/li><li>\n曲线族求方程 = 求导 n 次再消参。\n<\/ul>", "ch02": "<h1>第 2 章：初等积分法——以积分因子为主线<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：12 小时 | <strong>前置<\/strong>：第 1 章、偏导数、全微分\n<\/li><li>\n<strong>对应原书<\/strong>：第二章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n用&quot;凑全微分&quot;的眼光统一看待分离变量、齐次型、线性方程；\n<\/li><li>\n求出两类积分因子，并说明为什么只考虑单变量情形；\n<\/li><li>\n解隐式方程，并识别拉格朗日型与克莱罗型；\n<\/li><li>\n解 Riccati 方程（已知一个特解时）；\n<\/li><li>\n建立 Volterra 捕食模型与二体问题的方程，并做定性说明；\n<\/li><li>\n用降阶法处理二阶自治方程。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>柳彬这一章的组织方式和多数教材不同：<strong>所有初等解法都归到&quot;找一个积分因子使方程变成全微分&quot;这一条主线上<\/strong>。分离变量只是积分因子恰好只依赖一个变量的特例。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>2.1 恰当方程与积分因子主线<\/h3>\n<p>方程写成<\/p>\n<div class=\"eq\">P(x,y)dx + Q(x,y)dy = 0<\/div>\n<p>若存在 μ 使 μP dx+μQ dy=du，则解为 u=C。判定与求 μ 的办法与王高雄教材一致，但这里的讲法更强调&quot;统一&quot;：<\/p>\n<ul><li>\n分离变量 y′=f(x)g(y)。写成 dy−f(x)g(y)dx=0，取 μ=1/g(y)，立刻变成 du=0。<strong>所以分离变量是积分因子的特例<\/strong>。\n<\/li><li>\n齐次型 y′=φ(y/x)。写成 dy−φ(y/x)dx=0，取 μ=1/(y−xφ(y/x)) 之类的因子，可凑成 d(ln x) 形式。\n<\/li><li>\n一阶线性 y′+P y=Q。写成 (Py−Q)dx+dy=0，积分因子 e^(∫P dx)，恰好就是公式里那个指数。\n<\/ul>\n<p>这条主线的好处是：你不需要记四条互不相干的套路，只需要记&quot;怎么凑全微分&quot;。<\/p>\n<h3>2.2 一阶线性方程<\/h3>\n<p>标准推导：先解齐次，再常数变易。柳彬在这里补了一句值得记住的话：<strong>线性方程的解对右端是线性的<\/strong>——若 Q₁ 对应解 y₁，Q₂ 对应解 y₂，则 Q₁+Q₂ 对应 y₁+y₂。这叫叠加原理，是后面所有线性理论的种子。<\/p>\n<h3>2.3 隐式方程<\/h3>\n<p>三类：y=f(x,p)、x=f(y,p)、F(x,y,p)=0。前两类用 p 参数化后求导降阶；第三类一般只能局部解出。<\/p>\n<p><strong>拉格朗日型<\/strong> y=x·f(p)+g(p)：求导后得到关于 p 的线性方程，可用常数变易。 <strong>克莱罗型<\/strong> y=xp+g(p)：求导得 (x+g′(p))dp/dx=0，给出直线族与包络（奇解）。<\/p>\n<h3>2.4 Riccati 方程<\/h3>\n<div class=\"eq\">y′ = P(x)y² + Q(x)y + R(x)<\/div>\n<p>一般不可积。但<strong>已知一个特解 y₁<\/strong> 时，令 y=y₁+1/u，代入可化为关于 u 的线性方程：<\/p>\n<div class=\"eq\">u′ = −(2P y₁ + Q)u − P<\/div>\n<p>这一步换元是整章最漂亮的技巧：非线性方程在已知一个解之后，可以被&quot;线性化&quot;。<\/p>\n<h3>2.5 Volterra 捕食模型<\/h3>\n<div class=\"eq\">dx/dt = x(a − b y)，dy/dt = y(−c + d x)<\/div>\n<p>这是 Lotka-Volterra 方程。它有一个首次积分<\/p>\n<div class=\"eq\">H(x,y) = d x − c ln x + b y − a ln y<\/div>\n<p>沿轨线 H 为常数，所以轨线是闭曲线（在第一象限内）。这说明捕食系统的种群数量会周期振荡，不会灭绝也不会无限增长——这是生态学里最重要的定性结论之一。<\/p>\n<h3>2.6 二体问题<\/h3>\n<p>两个质点在万有引力下运动。约化到质心系后，相对运动满足<\/p>\n<div class=\"eq\">d²r/dt² = −G(m₁+m₂) r/|r|³<\/div>\n<p>在平面内取极坐标，得到轨道方程，解是圆锥曲线（椭圆、抛物线、双曲线），由能量与角动量决定。这是&quot;解出来&quot;的典范，也是后来定性理论（开普勒问题）的起点。<\/p>\n<h3>2.7 二阶自治方程的降阶<\/h3>\n<p>方程 y″=f(y,y′) 不显含 x。令 p=y′，则 y″=p·dp/dy，方程降为一阶：<\/p>\n<div class=\"eq\">p·dp/dy = f(y,p)<\/div>\n<p>这一步对所有&quot;不显含自变量&quot;的二阶方程都适用，是机械系统分析的标准第一步。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[一阶方程] --&gt; B[写成 P dx + Q dy = 0]\n    B --&gt; C[找积分因子 mu]\n    C --&gt; D[凑成全微分 du]\n    D --&gt; E[u = C]\n    C --&gt; F[mu 只含 x]\n    C --&gt; G[mu 只含 y]\n    C --&gt; H[mu 依赖 x 与 y 的组合]\n    A --&gt; I[隐式方程]\n    I --&gt; J[参数化 p]\n    J --&gt; K[拉格朗日型 线性方程]\n    J --&gt; L[克莱罗型 直线族加包络]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：这张图的重点是最上面的&quot;写成对称形式&quot;。同一个方程写成 dy/dx=… 和写成 P dx+Q dy=0，后一种更容易看出全微分结构。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：积分因子像&quot;给方程配一副合适的眼镜&quot;。同一个方程，肉眼看不出它是全微分；戴上 μ 这副眼镜，du=0 的结构立刻显形。<\/p>\n<p><strong>失效边界<\/strong>：μ 可能依赖 x 与 y 的复杂组合，这时&quot;猜&quot;不出来。教材只保证两类单变量情形可算。<\/p>\n<p><strong>实例<\/strong>：解 Riccati 方程 y′=y²−1/x²。观察到一个特解 y₁=1/x。令 y=1/x+1/u： y′=−1/x²−u′/u²，右端 =(1/x+1/u)²−1/x²=2/(xu)+1/u²。 于是 −1/x²−u′/u²=2/(xu)+1/u²，整理得 u′=−(2/x)u−1。解这个线性方程得 u=x⁻²(C−x³/3)。回代即得通解。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为 Riccati 方程总能解<\/strong>——实际上必须先猜到一个特解，否则没有初等解法。\n<\/li><li>\n<strong>别以为 Volterra 模型的闭轨就是极限环<\/strong>——实际上闭轨是一族连续分布的（中心型），极限环是孤立的。\n<\/li><li>\n<strong>别以为降阶只对二阶有效<\/strong>——实际上任何不显含 x 的方程都可降一阶。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n把 y′=f(x)g(y) 写成对称形式，并指出它的一个积分因子。\n<p>（答案：dy−f(x)g(y)dx=0，取 μ=1/g(y)。解析：乘后得 dy/g(y)−f(x)dx=0，左边是全微分。）<\/p>\n<\/ol>\n<ol><li>\n克莱罗方程 y=xp+p² 的奇解是什么？\n<p>（答案：y=−x²/4。解析：x+2p=0 得 p=−x/2，代回 y=x(−x/2)+x²/4=−x²/4。）<\/p>\n<\/ol>\n<ol><li>\nRiccati 方程已知特解 y₁ 后，换元 y=y₁+1/u 把方程化成了什么类型？\n<p>（答案：关于 u 的一阶线性方程。解析：这是 Riccati 可积的关键。）<\/p>\n<\/ol>\n<ol><li>\n为什么 Volterra 模型的轨线是闭曲线而不是趋向平衡点？\n<p>（答案：存在首次积分 H，轨线被限制在 H 的等值线上，而等值线是闭合曲线。解析：H 在平衡点处取极小值，等值线围绕它闭合。）<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n一切初等解法 = 找积分因子凑全微分。\n<\/li><li>\n克莱罗的包络是奇解；拉格朗日型可线性化。\n<\/li><li>\nRiccati：有一个特解就能线性化。\n<\/li><li>\n不显含 x 的二阶方程，令 p=y′ 降阶。\n<\/ul>", "ch03": "<h1>第 3 章：解的存在和唯一性<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：10 小时 | <strong>前置<\/strong>：第 2 章、一致收敛、紧性\n<\/li><li>\n<strong>对应原书<\/strong>：第三章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n写出 Picard 定理的完整条件，并用迭代证明存在性；\n<\/li><li>\n说明 Peano 定理只要求连续，为什么唯一性会失效；\n<\/li><li>\n用 Ascoli-Arzelà 定理的框架解释 Peano 定理的证明思路；\n<\/li><li>\n说清解的延伸与&quot;饱和解&quot;的关系；\n<\/li><li>\n用 p-判别式找奇解并回代检验。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>连续只保证&quot;至少有一条解&quot;，李普希茨才保证&quot;只有一条&quot;。两者的差距，就是整个存在性理论的分水岭。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>3.1 准备知识：为什么需要一致收敛<\/h3>\n<p>皮卡迭代产生一列函数 φₙ。要说明它收敛到一个解，必须说明：<\/p>\n<ol><li>\n这列函数逐点收敛；\n<\/li><li>\n收敛是<strong>一致<\/strong>的，否则极限函数未必连续；\n<\/li><li>\n极限函数满足积分方程（这需要 f 的一致连续性把极限与积分交换）。\n<\/ol>\n<p>这三件事分别对应：柯西准则、一致收敛的连续性定理、控制收敛。<\/p>\n<h3>3.2 Picard 定理<\/h3>\n<p>条件：f 在矩形 R：|x−x₀|≤a，|y−y₀|≤b 上连续，且关于 y 满足李普希茨条件（常数 L）。 结论：在 |x−x₀|≤h（h=min(a,b/M)，M=max|f|）上存在唯一解。<\/p>\n<p>证明骨架与王高雄教材相同：积分方程 → 迭代 → 阶乘级数控制 → 一致收敛 → 格朗沃尔证唯一。<\/p>\n<p>柳彬在这里强调了一个细节：<strong>李普希茨条件可以是局部的<\/strong>，只要在 R 上成立即可；而且 L 可以依赖 R 的选择，换一个更小的矩形，L 可能更小。<\/p>\n<h3>3.3 Peano 定理<\/h3>\n<p>条件：f 在 R 上<strong>连续<\/strong>（不要求李普希茨）。 结论：解存在（至少一个），但不保证唯一。<\/p>\n<p>证明思路与皮卡完全不同：构造欧拉折线序列，用 Ascoli-Arzelà 定理抽出<strong>一致收敛的子列<\/strong>。因为折线族是等度连续且一致有界的，紧性保证有收敛子列，极限满足积分方程。<\/p>\n<p>反例必须记住：<\/p>\n<div class=\"eq\">y′ = √|y|，y(0)=0<\/div>\n<p>解有无穷多个：y≡0；以及对任意 c≥0，<\/p>\n<div class=\"eq\">y = 0 （x≤c）；y = (x−c)²/4 （x>c）<\/div>\n<p>验证：在 x&gt;c 段，y′=(x−c)/2，√|y|=(x−c)/2，相等；在接点处左右导数都为 0，光滑。<\/p>\n<blockquote>类比：李普希茨条件是&quot;漏斗不能太陡&quot;。漏斗陡到垂直时，一滴水可以从多个方向流入同一点——路径不唯一。<\/blockquote>\n<blockquote>失效边界：即使不满足李普希茨，解仍可能存在（Peano 保证），只是不唯一。<\/blockquote>\n<h3>3.4 解的延伸<\/h3>\n<p>局部解只在 |x−x₀|≤h 上有定义。延伸是说：把解一段一段接下去。若解在右端点 x₁ 处仍有定义且 (x₁,y(x₁)) 在 f 的定义域内部，就可以继续。一直延伸到不能延伸为止，得到<strong>饱和解<\/strong>。<\/p>\n<p>终止的两种方式：碰到定义域边界，或者在有限时间内爆破（如 y′=y²）。<\/p>\n<h3>3.5 奇解<\/h3>\n<p>奇解是通解族的包络。求法：从 F(x,y,p)=0 与 F_p=0 消去 p 得 p-判别式曲线，再把候选曲线代回原方程检验。<\/p>\n<p>关键点：<strong>p-判别式可能包含&quot;不是解&quot;的曲线<\/strong>（例如 y′=y 的 p-判别式给出整个平面），必须回代。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[初值问题] --&gt; B{f 是否李普希茨}\n    B --&gt;|是| C[Picard 迭代]\n    C --&gt; D[存在且唯一]\n    B --&gt;|否 仅连续| E[欧拉折线]\n    E --&gt; F[Ascoli-Arzela 紧性]\n    F --&gt; G[存在 可能不唯一]\n    D --&gt; H[局部解]\n    G --&gt; H\n    H --&gt; I[延伸至饱和解]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：两条证明路线用的是完全不同的工具——左边是&quot;构造 + 压缩&quot;，右边是&quot;紧性 + 抽子列&quot;。这是分析里两种典型的存在性证明范式。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：Picard 是&quot;按图纸一层层盖楼&quot;，每层都由上一层决定；Peano 是&quot;把一堆可能的草稿放在桌上，紧性保证总有一张能收敛成正式图纸&quot;。<\/p>\n<p><strong>失效边界<\/strong>：紧性只能给出子列收敛，不能告诉你哪一张是&quot;对的那张&quot;；唯一性需要额外条件。<\/p>\n<p><strong>实例<\/strong>：y′=√|y| 的非唯一性验算。取 c=1：x≤1 时 y=0；x&gt;1 时 y=(x−1)²/4。在 x=1 处，左导数 0，右导数 (1−1)/2=0，导数存在且为 0。而 √|y(1)|=0，方程成立。所以这确实是一个解，与 y≡0 不同。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为&quot;连续就能保证唯一&quot;<\/strong>——实际上连续只保证存在。\n<\/li><li>\n<strong>别以为&quot;Peano 定理弱所以没用&quot;<\/strong>——实际上它在需要最少假设的场合（如只知连续的控制系统）是唯一可用的存在性工具。\n<\/li><li>\n<strong>别以为&quot;解一定能延伸到无穷&quot;<\/strong>——实际上有限时间爆破很常见。\n<\/li><li>\n<strong>别以为 p-判别式给出的就一定是奇解<\/strong>——实际上必须回代检验。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\nPicard 定理中 h 为什么取 min(a,b/M)？\n<p>（答案：a 保证 x 不超出矩形，b/M 保证迭代值不超出矩形的 y 范围。解析：两者取小才同时满足。）<\/p>\n<\/ol>\n<ol><li>\nPeano 定理证明中，哪条定理提供收敛子列？\n<p>（答案：Ascoli-Arzelà 定理。解析：欧拉折线族等度连续且一致有界，故有紧性。）<\/p>\n<\/ol>\n<ol><li>\ny′=√|y|，y(0)=0 为什么有无穷多解？\n<p>（答案：f 在 y=0 处不满足李普希茨，可构造任意&quot;延迟出发&quot;的解族。解析：见正文 c≥0 的构造。）<\/p>\n<\/ol>\n<ol><li>\n饱和解的两个终止条件？\n<p>（答案：抵达定义域边界，或解在有限时间内爆破。解析：此时无法继续延伸。）<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n连续 ⇒ 存在（Peano）；连续 + 李普希茨 ⇒ 唯一（Picard）。\n<\/li><li>\n两种证明范式：迭代构造 vs 紧性抽子列。\n<\/li><li>\n奇解要回代检验，p-判别式只是候选。\n<\/ul>", "ch04": "<h1>第 4 章：解对初值和参数的依赖性<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：8 小时 | <strong>前置<\/strong>：第 3 章、格朗沃尔引理、多元微积分\n<\/li><li>\n<strong>对应原书<\/strong>：第四章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n说明为什么要把 m 维线性空间中的方程作为一般框架；\n<\/li><li>\n用格朗沃尔引理证明解对初值的连续依赖，并写出放大因子的来源；\n<\/li><li>\n写出变分方程，解释它为什么是&quot;线性化&quot;的原型；\n<\/li><li>\n说明解对参数的连续可微性与&quot;灵敏度&quot;的关系；\n<\/li><li>\n用这些结论解释数值计算中初值误差为什么会被指数放大。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>存在唯一性只保证&quot;给定初值有一条解&quot;。本章补上下半句：<strong>初值动一点，解也动一点，而且动多少是可以估出来的<\/strong>。这个估计的指数因子，就是稳定性理论的全部起点。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>4.1 为什么要用 m 维框架<\/h3>\n<p>高阶方程化为一阶方程组后，未知量是一个 m 维向量。把&quot;m 维线性空间中的微分方程&quot;作为统一对象，好处是所有定理只需证一次：<\/p>\n<div class=\"eq\">dy/dx = f(x, y)，y∈R^m<\/div>\n<p>一切估计都用向量范数书写，标量情形就是 m=1 的特例。<\/p>\n<h3>4.2 连续依赖<\/h3>\n<p><strong>定理<\/strong>：设 f 在区域 D 上连续且关于 y 满足李普希茨（常数 L），解 y(x; x₀, y₀) 在公共存在区间上满足<\/p>\n<div class=\"eq\">|y(x; x₀, y₀) − y(x; x₀, y₁)| ≤ |y₀ − y₁|·e^(L|x−x₀|)<\/div>\n<p>证明路线：两个解作差，差值满足<\/p>\n<div class=\"eq\">|Δy(x)| ≤ |Δy₀| + L·∫|Δy(t)|dt<\/div>\n<p>直接套格朗沃尔引理，A=|Δy₀|，B=L。<\/p>\n<p><strong>这个式子的含义<\/strong>：初值误差被指数放大，放大速率是李普希茨常数。数值积分里为什么长时间模拟会失真？就是因为这个 e^(Lt)。<\/p>\n<h3>4.3 连续可微与变分方程<\/h3>\n<p>解的偏导数 ∂y/∂y₀ 存在，记作 Φ(x)。它满足<\/p>\n<div class=\"eq\">dΦ/dx = f_y(x, y(x))·Φ，Φ(x₀) = I<\/div>\n<p>这叫<strong>变分方程<\/strong>。它是把原系统在参考轨线附近线性化的结果：Φ 就是线性化系统的基解矩阵。<\/p>\n<p>这个结论是整个&quot;线性化判稳&quot;的理论依据：稳定性分析里算的雅可比矩阵，正是 f_y 在平衡点处的取值。<\/p>\n<h3>4.4 对参数的依赖<\/h3>\n<p>若右端含参数 μ：dy/dx=f(x,y,μ)，则解对 μ 也可微，且 ∂y/∂μ 满足<\/p>\n<div class=\"eq\">d/dx(∂y/∂μ) = f_y·(∂y/∂μ) + f_μ<\/div>\n<p>多出来的 f_μ 正是&quot;参数直接改变方程&quot;的那部分贡献。工程上这叫灵敏度方程。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[解 y 关于初值] --&gt; B[作差]\n    B --&gt; C[积分不等式]\n    C --&gt; D[格朗沃尔]\n    D --&gt; E[指数放大估计]\n    A --&gt; F[求偏导]\n    F --&gt; G[变分方程]\n    G --&gt; H[线性化系统]\n    H --&gt; I[稳定性判据]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：左边是&quot;误差能有多大&quot;，右边是&quot;误差怎么长&quot;。两者其实是同一个线性化系统的两个侧面。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：解对初值的依赖像&quot;两条相邻的河流&quot;。起点差一米，短期内还在一起流，时间够长就可能一条进了湖、一条冲下山。<\/p>\n<p><strong>失效边界<\/strong>：这个估计是上界，不是真实误差。实际放大可能远小于 e^(Lt)，也可能因为非线性效应而更快（超出李普希茨适用范围）。<\/p>\n<p><strong>实例<\/strong>：y′=y，y(0)=y₀。解 y=y₀eˣ，∂y/∂y₀=eˣ，恰是变分方程 Φ′=Φ，Φ(0)=1 的解。这里 L=1，估计式给出 |Δy|≤|Δy₀|e^(|x|)，与实际完全吻合——因为系统本身就是线性的，估计是紧的。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为&quot;连续依赖就是说解差不多&quot;<\/strong>——实际上有定量估计，而且可能指数放大。\n<\/li><li>\n<strong>别以为变分方程是另一套理论<\/strong>——实际上它就是原系统沿参考解的线性化。\n<\/li><li>\n<strong>别以为&quot;参数不影响解的结构&quot;<\/strong>——实际上参数变化可能导致分支（解的数量或稳定性突变）。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n连续依赖估计中的指数因子由什么决定？\n<p>（答案：李普希茨常数 L 与区间长度 |x−x₀|。解析：|Δy|≤|Δy₀|e^(L|x−x₀|)。）<\/p>\n<\/ol>\n<ol><li>\n变分方程的初值为什么是 I？\n<p>（答案：因为 ∂y/∂y₀ 在 x=x₀ 处，y 就是 y₀，对 y₀ 求导得单位矩阵。解析：这是恒等映射的导数。）<\/p>\n<\/ol>\n<ol><li>\n参数灵敏度方程比变分方程多出哪一项？\n<p>（答案：f_μ，即右端对参数的偏导。解析：参数直接进入方程，产生了额外源项。）<\/p>\n<\/ol>\n<ol><li>\n为什么数值长期积分会失真？\n<p>（答案：初值与舍入误差被 e^(Lt) 放大。解析：见连续依赖估计。）<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n连续依赖 = 差值积分不等式 + 格朗沃尔。\n<\/li><li>\n变分方程 Φ′=f_yΦ，Φ(x₀)=I。\n<\/li><li>\n灵敏度方程多一项 f_μ。\n<\/ul>", "ch05": "<h1>第 5 章：线性微分方程组<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：10 小时 | <strong>前置<\/strong>：第 4 章、矩阵、若尔当标准形\n<\/li><li>\n<strong>对应原书<\/strong>：第五章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n写出齐次与非齐次线性方程组的一般理论，包括基解矩阵与常数变易；\n<\/li><li>\n对常系数系统，按&quot;单特征值&quot;和&quot;重特征值&quot;两种情况写出基解矩阵；\n<\/li><li>\n把高阶线性方程纳入方程组框架，说明两者的等价；\n<\/li><li>\n说出周期系数系统（弗洛凯理论）的乘法表示与稳定性判据。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>线性方程组的一切结论都建立在&quot;解集是有限维线性空间&quot;这一条上；常系数时它退化成&quot;算矩阵指数&quot;，周期系数时退化成&quot;算单值矩阵的特征值&quot;。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>5.1 一般理论<\/h3>\n<div class=\"eq\">dy/dx = A(x)y + f(x)<\/div>\n<p>齐次解集是 m 维线性空间；基解矩阵 Φ 满足 Φ′=AΦ，det Φ≠0；非齐次解由常数变易给出：<\/p>\n<div class=\"eq\">y = Φ(x)[C + ∫Φ⁻¹(s)f(s)ds]<\/div>\n<p>刘维尔公式：det Φ(x)=det Φ(x₀)·exp(∫tr A dt)。这条式子说明基解矩阵的行列式永远不为零（只要初值不为零），所以&quot;基&quot;的性质是全局保持的。<\/p>\n<h3>5.2 常系数：单特征值<\/h3>\n<p>A 有 m 个互不相同的特征值 λ₁,…,λₘ，对应特征向量 v₁,…,vₘ。基解矩阵直接写出：<\/p>\n<div class=\"eq\">Φ(x) = [v₁e^(λ₁x), …, vₘe^(λₘx)]<\/div>\n<p>这就是&quot;单特征值情形最好算&quot;的原因：不需要求若尔当形，也不需要处理 t 的幂。<\/p>\n<h3>5.3 常系数：重特征值<\/h3>\n<p>若 λ 是 k 重特征值，但几何重数不足，则需要广义特征向量链 v₁,…,v_k，满足 (A−λI)v_j=v_{j−1}。对应的解是<\/p>\n<div class=\"eq\">e^(λx)[v₁ + v₂x + … + v_k x^(k−1)/(k−1)!]<\/div>\n<p>这与矩阵指数里的若尔当块写法完全一致：多出来的 t 的幂，来自广义特征向量链的长度。<\/p>\n<h3>5.4 高阶线性方程<\/h3>\n<p>y⁽ⁿ⁾+a₁y⁽ⁿ⁻¹⁾+…+aₙy=f 通过令 y₁=y, y₂=y′,… 化为一阶方程组。反过来，方程组的每个分量都满足一个 n 阶方程（消元法的结果）。两种框架的信息量相同。<\/p>\n<h3>5.5 周期系数：弗洛凯理论<\/h3>\n<p>若 A(x+T)=A(x)，则基解矩阵满足<\/p>\n<div class=\"eq\">Φ(x+T) = Φ(x)·M<\/div>\n<p>M=Φ(T) 叫<strong>单值矩阵<\/strong>（monodromy matrix）。它的特征值叫<strong>弗洛凯乘子<\/strong>。判据：<\/p>\n<ul><li>\n所有乘子的模 &lt; 1 ⇒ 零解渐近稳定；\n<\/li><li>\n有乘子的模 &gt; 1 ⇒ 不稳定；\n<\/li><li>\n模等于 1 ⇒ 临界，需进一步分析。\n<\/ul>\n<p>这条结论的意义：周期系数系统不能用&quot;特征值实部&quot;判断，因为没有常特征值；必须用&quot;绕一圈之后的放大倍数&quot;。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[线性方程组] --&gt; B[齐次]\n    B --&gt; C[基解矩阵 Phi]\n    C --&gt; D[常数变易解非齐次]\n    A --&gt; E[常系数]\n    E --&gt; F[单特征值 直接写]\n    E --&gt; G[重特征值 广义特征向量]\n    E --&gt; H[矩阵指数]\n    A --&gt; I[周期系数]\n    I --&gt; J[单值矩阵]\n    J --&gt; K[弗洛凯乘子判稳]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：右下角那一支是本章区别于普通教材的地方。周期系数系统没有&quot;特征值&quot;可用，只能靠&quot;绕一圈的放大倍数&quot;。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：单值矩阵像&quot;跑完一圈的账本&quot;。每一步的盈亏可能很复杂，但一年下来账户变了多少倍，就是那一两个乘子说了算。<\/p>\n<p><strong>失效边界<\/strong>：乘子模等于 1 时账本可能&quot;总体不增不减&quot;，但内部有共振，单看乘子判断不了。<\/p>\n<p><strong>实例<\/strong>：马蒂厄方程 y″+(δ+ε cos 2x)y=0 是周期系数方程，它的稳定性区域图（ tongues）正是弗洛凯理论的应用。参数落在稳定舌内，解有界；落在舌外，解指数增长。<\/p>\n<p><strong>实例 2<\/strong>：A=[[0,1],[−1,0]]（常系数），Φ(x)=[[cos x, sin x],[−sin x, cos x]]，det Φ=1，乘子为 e^(±ix)，模为 1，属于临界情形——对应中心。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为&quot;周期系数也能算特征值&quot;<\/strong>——实际上 A(x) 随 x 变，没有固定特征值，必须用单值矩阵。\n<\/li><li>\n<strong>别以为&quot;重特征值一定需要若尔当块&quot;<\/strong>——实际上几何重数够时可以对角化。\n<\/li><li>\n<strong>别以为&quot;基解矩阵唯一&quot;<\/strong>——实际上任意右乘一个非奇异常矩阵仍是基解矩阵。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n刘维尔公式在方程组情形是什么？\n<p>（答案：det Φ(x)=det Φ(x₀)exp(∫tr A dt)。解析：迹接替了标量方程里的 a₁。）<\/p>\n<\/ol>\n<ol><li>\n单值矩阵的定义？\n<p>（答案：M=Φ(T)，其中 Φ 是基解矩阵，T 是周期。解析：它把&quot;走一个周期&quot;的演化压成一个矩阵。）<\/p>\n<\/ol>\n<ol><li>\n弗洛凯乘子模为 1 时能下结论吗？\n<p>（答案：不能，属于临界情形，需要进一步分析。解析：模为 1 对应不增不减，可能有共振或多项式增长。）<\/p>\n<\/ol>\n<ol><li>\n重特征值的解里为什么会出现 x 的幂？\n<p>（答案：广义特征向量链导致，与若尔当块同理。解析：见 e^(λx)[v₁+v₂x+…] 的形式。）<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n齐次 m 维、非齐次 = 特解 + 齐次。\n<\/li><li>\n常系数：单根直接写，重根用广义特征向量。\n<\/li><li>\n周期系数：算单值矩阵，看乘子模。\n<\/ul>", "ch06": "<h1>第 6 章：解析解与幂级数解法<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：7 小时 | <strong>前置<\/strong>：第 3、5 章、复变函数初步、幂级数\n<\/li><li>\n<strong>对应原书<\/strong>：第六章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n陈述柯西定理：右端解析 ⇒ 解解析，并说明收敛半径怎么估；\n<\/li><li>\n在常点附近用幂级数求方程的解，写出系数递推关系；\n<\/li><li>\n区分常点、正则奇点、非正则奇点；\n<\/li><li>\n用弗罗贝尼乌斯方法处理正则奇点；\n<\/li><li>\n说明解析解与数值解、定性分析三者的适用边界。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>幂级数解法是&quot;在解不出来的时候，把解写成一串系数&quot;。柯西定理保证这串系数确实收敛到一个真解，收敛半径由右端函数的奇点位置决定。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>6.1 柯西定理<\/h3>\n<p><strong>定理<\/strong>：若 f(x,y) 在点 (x₀,y₀) 的邻域内解析（对 x、y 都能展成收敛的幂级数），则初值问题的解 y(x) 在 x₀ 的某邻域内也解析。<\/p>\n<p>证明思路是&quot;优级数法&quot;：把 f 的幂级数系数用一个大常数 M 压住，构造一个比它增长更快的&quot;优函数&quot;，证明形式幂级数的系数被优级数控制，从而收敛。<\/p>\n<p><strong>收敛半径的实用估计<\/strong>：解的收敛半径不小于&quot;从 x₀ 到 f 的最近奇点&quot;的距离。例如<\/p>\n<div class=\"eq\">y′ = y/(1−x²)<\/div>\n<p>右端在 x=±1 奇，从 0 出发的收敛半径不超过 1。<\/p>\n<h3>6.2 常点处的幂级数解法<\/h3>\n<p>设 y=Σaₖ(x−x₀)ᵏ，代入方程，比较各次幂的系数，得到递推关系。以勒让德方程为例：<\/p>\n<div class=\"eq\">(1−x²)y″ − 2xy′ + n(n+1)y = 0，x₀=0<\/div>\n<p>代入后 xᵏ 的系数满足<\/p>\n<div class=\"eq\">(k+2)(k+1)a_{k+2} = (k−n)(k+n+1)a_k<\/div>\n<p>这个递推把偶数项和奇数项分开，得到两个独立解。当 n 为整数时，其中一个解退化成多项式——这就是勒让德多项式。<\/p>\n<h3>6.3 奇点分类<\/h3>\n<p>把方程写成标准形<\/p>\n<div class=\"eq\">y″ + p(x)y′ + q(x)y = 0<\/div>\n<ul><li>\n<strong>常点<\/strong>：p、q 在 x₀ 解析。\n<\/li><li>\n<strong>正则奇点<\/strong>：p 至多一阶极点，q 至多二阶极点，即 (x−x₀)p 与 (x−x₀)²q 解析。\n<\/li><li>\n<strong>非正则奇点<\/strong>：极点阶数更高。\n<\/ul>\n<p><strong>弗罗贝尼乌斯方法<\/strong>：在正则奇点处设<\/p>\n<div class=\"eq\">y = (x−x₀)^r·Σaₖ(x−x₀)ᵏ，a₀≠0<\/div>\n<p>代入得指标方程（关于 r 的二次方程）。两个根之差不为整数时，给出两个独立的级数解；差为整数时，第二个解可能带对数项。<\/p>\n<h3>6.4 三种方法的边界<\/h3>\n<table><thead><tr><th>方法<\/th><th>适用<\/th><th>给什么<\/th><th>不给什么<\/th><\/tr><\/thead><tbody><tr><td>初等积分<\/td><td>少数可积类型<\/td><td>显式解<\/td><td>大多数方程不行<\/td><\/tr><tr><td>幂级数<\/td><td>常点/正则奇点附近<\/td><td>局部解析解<\/td><td>全局行为、大范围结构<\/td><\/tr><tr><td>定性分析<\/td><td>一般非线性系统<\/td><td>稳定性、相图<\/td><td>具体解的数值<\/td><\/tr><\/tbody><\/table>\n<p>这张表是整门课的&quot;方法论地图&quot;：没有一种方法能包打天下。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[方程] --&gt; B{右端是否解析}\n    B --&gt;|是| C[柯西定理 解解析]\n    C --&gt; D[常点 幂级数]\n    C --&gt; E[正则奇点 弗罗贝尼乌斯]\n    B --&gt;|否| F[定性或数值]\n    E --&gt; G[指标方程]\n    G --&gt; H{两根差是否为整数}\n    H --&gt;|否| I[两个独立级数解]\n    H --&gt;|是| J[第二个解可能带对数]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：判定顺序是&quot;解析性 → 点类型 → 方法&quot;。指标方程的根之差是正则奇点情形最关键的分叉点。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：幂级数解法像&quot;用一列越来越细的积木拼出函数&quot;。递推关系告诉你下一块积木多长；柯西定理保证这堆积木不会拼到一半就塌。<\/p>\n<p><strong>失效边界<\/strong>：在奇点附近（尤其非正则奇点），积木尺寸可能指数增长，级数根本不收敛。<\/p>\n<p><strong>实例<\/strong>：解 y″−xy=0（艾里方程）在 x=0 附近。 设 y=Σaₖxᵏ，代入得 Σk(k−1)aₖx^(k−2) = Σaₖx^(k+1)。 移项比较系数：a₂=0，(k+2)(k+1)a_{k+2}=a_{k−1}。 于是 a₃=a₀/6，a₄=a₁/12，a₅=0，a₆=a₃/30=a₀/180…两组解分别由 a₀、a₁ 生成。这个级数在全平面收敛（因为右端 x·y 是整函数）。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为&quot;幂级数解法能给出全局解&quot;<\/strong>——实际上只在收敛半径内有效。\n<\/li><li>\n<strong>别以为&quot;奇点一定不能解&quot;<\/strong>——实际上正则奇点可以用弗罗贝尼乌斯方法。\n<\/li><li>\n<strong>别以为&quot;两个根之差为整数就无解&quot;<\/strong>——实际上第二个解可能是带对数的形式，仍存在。\n<\/li><li>\n<strong>别以为&quot;解析解总比数值解好&quot;<\/strong>——实际上大范围行为、混沌现象，解析解给不出。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n柯西定理的条件是什么？\n<p>（答案：f 在初值点邻域内解析。解析：只要求解析，不要求李普希茨的显式常数。）<\/p>\n<\/ol>\n<ol><li>\n方程 (1−x²)y″−2xy′+6y=0 在 x=0 处的收敛半径至少是多少？\n<p>（答案：1。解析：右端系数的最近奇点在 x=±1，距离为 1。）<\/p>\n<\/ol>\n<ol><li>\n正则奇点的判定条件？\n<p>（答案：(x−x₀)p 与 (x−x₀)²q 都在 x₀ 解析。解析：即 p 至多一阶极点，q 至多二阶极点。）<\/p>\n<\/ol>\n<ol><li>\n指标方程两根之差为整数时会发生什么？\n<p>（答案：第二个线性无关解可能含对数项。解析：这是弗罗贝尼乌斯方法的经典例外。）<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n右端解析 ⇒ 解解析（柯西定理）。\n<\/li><li>\n收敛半径 ≥ 到最近奇点的距离。\n<\/li><li>\n常点幂级数、正则奇点弗罗贝尼乌斯。\n<\/ul>", "ch07": "<h1>第 7 章：边值问题<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：9 小时 | <strong>前置<\/strong>：第 5 章、变分法初步、泛函分析入门\n<\/li><li>\n<strong>对应原书<\/strong>：第七章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n写出斯特姆-刘维尔问题的标准形式与边界条件；\n<\/li><li>\n用斯特姆比较定理判断两个方程解的零点个数关系；\n<\/li><li>\n证明不同特征值的特征函数带权正交；\n<\/li><li>\n说明周期边值问题与普通边值问题的差别；\n<\/li><li>\n把特征值问题理解为&quot;线性算子的谱&quot;。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>边值问题的核心不是&quot;解出来&quot;，而是&quot;算谱&quot;：<strong>特征值是可数无穷的，特征函数构成正交基<\/strong>。这套结论是傅里叶级数、量子力学、振动模态的共同底座。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>7.1 斯特姆-刘维尔形式<\/h3>\n<div class=\"eq\">(p(x)y′)′ + [λρ(x) − q(x)]y = 0，a ≤ x ≤ b<\/div>\n<p>其中 p&gt;0，ρ&gt;0。边界条件通常是分离型：<\/p>\n<div class=\"eq\">α₁y(a)+α₂y′(a)=0，β₁y(b)+β₂y′(b)=0<\/div>\n<p>这一形式的关键是<strong>自伴<\/strong>：把算子 L[y]=(py′)′−qy 拿来做分部积分，边界项会消失（因为边界条件），于是<\/p>\n<div class=\"eq\">⟨L[y], z⟩ = ⟨y, L[z]⟩<\/div>\n<p>自伴性是后面所有结论的源头。<\/p>\n<h3>7.2 斯特姆比较定理<\/h3>\n<p><strong>定理（比较定理）<\/strong>：设 (p₁y′)′+q₁y=0 与 (p₂y′)′+q₂y=0，若在区间上 q₂≥q₁ 且 p₂≤p₁，则第一个方程的任一非零解在 (a,b) 内的零点个数不多于第二个方程。<\/p>\n<p>白话：<strong>势能越大（q 越大）、扩散越弱（p 越小），解震荡得越快，零点越多<\/strong>。<\/p>\n<p>这条定理的用处是定性判断：不必解出方程，就能知道解转了几圈。它也是特征值单调性的来源——q 增大，第 n 个特征值随之增大。<\/p>\n<h3>7.3 正交性<\/h3>\n<p>设 yₘ、yₙ 对应不同特征值 λₘ≠λₙ，则<\/p>\n<div class=\"eq\">∫[a→b] ρ(x)·yₘ(x)·yₙ(x) dx = 0<\/div>\n<p>证明只有三步：两个方程分别乘以对方的解、相减、在 [a,b] 上积分，边界项由边界条件消掉，剩下 (λₘ−λₙ)∫ρyₘyₙ=0。<\/p>\n<p><strong>为什么这条重要<\/strong>：它让&quot;展开系数&quot;可以像向量投影一样算出来：<\/p>\n<div class=\"eq\">cₙ = ∫ρ·f·yₙ dx / ∫ρ·yₙ² dx<\/div>\n<h3>7.4 周期边值问题<\/h3>\n<p>条件改成 y(a)=y(b)，y′(a)=y′(b)。此时边界项在分部积分中同样消失，自伴性保留，但特征值结构不同：可能出现二重特征值（对应 sin 与 cos 同时是特征函数），也可能出现负特征值。<\/p>\n<p>周期边值问题比分离边界更&quot;富&quot;，因为它允许解绕一圈后回到原样——这正是傅里叶级数里 cos nx、sin nx 成对出现的原因。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[斯特姆-刘维尔形式] --&gt; B[自伴性]\n    B --&gt; C[特征值实数]\n    B --&gt; D[特征函数正交]\n    D --&gt; E[可按特征函数展开]\n    A --&gt; F[比较定理]\n    F --&gt; G[零点个数比较]\n    G --&gt; H[特征值单调性]\n    A --&gt; I[周期边值]\n    I --&gt; J[二重特征值 傅里叶级数]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：从&quot;自伴&quot;出发分三支：实特征值、正交性、可展开。右边两支是定性结论（比较定理、周期情形），它们不需要解出方程。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：特征函数像琴弦的各个驻波模式。基频是第一个特征值，泛音是后面的。不同模式在同一点上的位移乘积积分为零，这就是正交性的物理版本。<\/p>\n<p><strong>失效边界<\/strong>：如果边界条件不是自伴型（比如混合了非线性边界），正交性可能失效。<\/p>\n<p><strong>实例<\/strong>：y″+λy=0，y(0)=y(π)=0。特征值 λₙ=n²，特征函数 yₙ=sin nx。验证正交性：<\/p>\n<p>∫₀^π sin mx sin nx dx = 0（m≠n）。这是三角函数的正交性，也是傅里叶正弦级数的基础。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为&quot;边值问题总有特征值&quot;<\/strong>——实际上需要正则性条件（p、q、ρ 连续且 p、ρ 为正）。\n<\/li><li>\n<strong>别以为&quot;正交性靠巧合&quot;<\/strong>——实际上是自伴性 + 边界条件的必然结果。\n<\/li><li>\n<strong>别以为&quot;周期边值就是分离边值的特例&quot;<\/strong>——实际上谱结构不同，可能出现重特征值。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n斯特姆-刘维尔算子为什么是自伴的？\n<p>（答案：分部积分后边界项由边界条件消去。解析：⟨Ly,z⟩−⟨y,Lz⟩ 只剩边界项。）<\/p>\n<\/ol>\n<ol><li>\n比较定理中 q₂≥q₁ 说明什么？\n<p>（答案：第二个方程的解零点更多，震荡更快。解析：势能越大，解转得越快。）<\/p>\n<\/ol>\n<ol><li>\n展开系数公式里的权函数 ρ 起什么作用？\n<p>（答案：定义带权内积，使特征函数在该内积下正交。解析：cₙ=∫ρfyₙ/∫ρyₙ²。）<\/p>\n<\/ol>\n<ol><li>\n周期边值问题为什么会出现二重特征值？\n<p>（答案：sin nx 与 cos nx 同时满足周期条件，对应同一特征值。解析：这就是傅里叶级数成对出现的原因。）<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\nS-L 形式的关键是自伴。\n<\/li><li>\n自伴 ⇒ 实特征值 + 正交 + 可展开。\n<\/li><li>\n比较定理：q 大、p 小 ⇒ 零点多。\n<\/ul>", "ch08": "<h1>第 8 章：一阶偏微分方程<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：6 小时 | <strong>前置<\/strong>：第 2、3 章、隐函数定理\n<\/li><li>\n<strong>对应原书<\/strong>：第八章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n给出首次积分的定义与三条基本性质；\n<\/li><li>\n说明首次积分存在性与向量场线性无关性的关系；\n<\/li><li>\n用特征线法解一阶齐次与拟线性偏微分方程；\n<\/li><li>\n从几何角度解释解的构成：特征线织成解曲面；\n<\/li><li>\n判断柯西问题的局部可解性。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>一阶偏微分方程的解法，本质是&quot;沿特征线把偏导变成常导&quot;。首次积分是这条路线上的通用货币。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>8.1 首次积分的定义与性质<\/h3>\n<p>对自治方程组 dx/dt=X(x)，函数 F(x) 若沿每条轨线为常数，即<\/p>\n<div class=\"eq\">X·∇F = 0<\/div>\n<p>则称 F 是首次积分。<\/p>\n<p>三条性质：<\/p>\n<ol><li>\n<strong>沿轨线为常数<\/strong>，因此每个首次积分把相空间切成若干不变面；\n<\/li><li>\n<strong>首次积分的任意函数仍是首次积分<\/strong>（因为复合后方向导数仍为零）；\n<\/li><li>\n<strong>首次积分在区域内连续可微且梯度不为零时，其等值面是 (n−1) 维的<\/strong>。\n<\/ol>\n<h3>8.2 存在性<\/h3>\n<p>n 维自治系统在一点附近有 n−1 个独立首次积分，条件是向量场在该点不为零（局部存在）。证明用局部坐标变换把向量场拉直成&quot;第一个分量恒为 1&quot;，其余分量视为参数，于是问题化为解 n−1 个常微分方程。<\/p>\n<p>如果向量场在某点为零（平衡点），首次积分的个数和结构都会退化——这正是定性理论要单独处理平衡点的原因。<\/p>\n<h3>8.3 一阶齐次线性偏微分方程<\/h3>\n<div class=\"eq\">a(x,y)u_x + b(x,y)u_y = 0<\/div>\n<p>特征方程 dy/dx=b/a，其首次积分 Φ(x,y)=C。通解 u=F(Φ)。<\/p>\n<p><strong>几何解释<\/strong>：u 在每条特征线上是常数，所以 u 只依赖&quot;哪条特征线&quot;，即只依赖 Φ。F 就是这个&quot;依赖关系&quot;。<\/p>\n<h3>8.4 一阶拟线性偏微分方程<\/h3>\n<div class=\"eq\">a(x,y,u)u_x + b(x,y,u)u_y = c(x,y,u)<\/div>\n<p>特征方程组<\/p>\n<div class=\"eq\">dx/ds=a，dy/ds=b，du/ds=c<\/div>\n<p>给定初始曲线 Γ，过 Γ 上每点作特征线，这些线扫出一张曲面即解。可解的条件是 Γ 横截特征方向：<\/p>\n<div class=\"eq\">a·dy₀/dτ − b·dx₀/dτ ≠ 0<\/div>\n<h3>8.5 几何图景<\/h3>\n<p>把 (x,y,u) 看成三维空间，PDE 规定了&quot;曲面上的方向场&quot;：曲面 u=u(x,y) 在每点的切平面必须包含方向 (a,b,c)。特征线就是这些方向场的积分曲线；解曲面由特征线织成。<\/p>\n<p>这个图景把 PDE 变成了&quot;找一张由给定方向场织成的曲面&quot;，与常微分方程的&quot;找一条由方向场织成的曲线&quot;完全平行。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[一阶 PDE] --&gt; B[写出特征方程组]\n    B --&gt; C[求首次积分]\n    C --&gt; D{齐次还是拟线性}\n    D --&gt;|齐次| E[通解 u = F of Phi]\n    D --&gt;|拟线性| F[过初始曲线作特征线]\n    F --&gt; G[织成解曲面]\n    G --&gt; H{初始曲线是否横截}\n    H --&gt;|不横截| I[局部无解或不唯一]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：整章只有一条主线——把 PDE 变成特征方程组。齐次情形是它的退化（c=0，u 沿特征线不变）。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：特征线是&quot;经线&quot;，初始曲线是&quot;起针行&quot;。PDE 只说&quot;沿经线怎么走&quot;，你把经线一根根织出来，布就成了。如果起针行恰好在经线方向上，就织不起来。<\/p>\n<p><strong>失效边界<\/strong>：这个类比假设特征线互不相交。若特征线在有限处相交，解曲面会出现折痕（激波），此时需要弱解理论。<\/p>\n<p><strong>实例<\/strong>：解 u_x + u_y = u，u(x,0)=x。 特征方程：dx/ds=1，dy/ds=1，du/ds=u。 解得 x=s+x₀，y=s，u=u₀e^s。 初值 u₀=τ=x₀，y₀=0。 消去 s、τ：s=y，x₀=x−y，u=(x−y)e^y。 验证：u_x=e^y，u_y=−e^y+(x−y)e^y，和为 (x−y)e^y=u。边界 y=0 时 u=x。成立。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为首次积分就是&quot;解&quot;<\/strong>——实际上它是沿轨线取常数的函数，本身不满足原方程。\n<\/li><li>\n<strong>别以为 n 维系统总有 n 个首次积分<\/strong>——实际上独立的有 n−1 个。\n<\/li><li>\n<strong>别以为&quot;初始曲线任意给都行&quot;<\/strong>——实际上必须横截特征方向。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n首次积分的方向导数条件是什么？\n<p>（答案：X·∇F=0。解析：这就是&quot;沿轨线为常数&quot;的微分形式。）<\/p>\n<\/ol>\n<ol><li>\n为什么 n 维自治系统只有 n−1 个独立首次积分？\n<p>（答案：轨线是一维的，所以每点的余维是 n−1。解析：n−1 个不变面相交成一条曲线。）<\/p>\n<\/ol>\n<ol><li>\n齐次 PDE 通解中的 F 为什么可以是任意函数？\n<p>（答案：每条特征线上 u 为常数，不同特征线上的常数可以不同，这个&quot;不同&quot;就是一个任意函数。解析：依赖的是特征线的标号 Φ。）<\/p>\n<\/ol>\n<ol><li>\n柯西问题失效的几何原因？\n<p>（答案：初始曲线与特征方向相切，导致无法确定 u 的法向导数。解析：非特征条件不满足。）<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n首次积分：X·∇F=0，n 维有 n−1 个。\n<\/li><li>\n齐次 PDE 通解 = F(Φ)。\n<\/li><li>\n拟线性：过初始曲线作特征线织曲面，需横截条件。\n<\/ul>", "ch09": "<h1>第 9 章：定性理论简介<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：8 小时 | <strong>前置<\/strong>：第 4、5、7 章、线性代数\n<\/li><li>\n<strong>对应原书<\/strong>：第九章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n区分动力系统、相空间、轨线三个概念；\n<\/li><li>\n用线性近似判断李雅普诺夫稳定性，并说明双曲条件；\n<\/li><li>\n用李雅普诺夫第二方法判稳；\n<\/li><li>\n按迹与行列式分类平面初等奇点；\n<\/li><li>\n说明极限环的存在判据与环面上的特殊现象。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>定性理论换了一个问题：不问&quot;解是什么&quot;，只问&quot;轨线在相空间里怎么排布&quot;。答案是拓扑的，不是数值的。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>9.1 动力系统与相空间<\/h3>\n<p>把 dx/dt=f(x) 的解看成&quot;点在空间里随时间移动的轨迹&quot;，则：<\/p>\n<ul><li>\n<strong>相空间<\/strong>：状态 x 所在的空间；\n<\/li><li>\n<strong>轨线<\/strong>：解在相空间中的像（不含时间信息）；\n<\/li><li>\n<strong>动力系统<\/strong>：由 f 决定的整个演化规则。\n<\/ul>\n<p>轨线与积分曲线的区别在于：轨线丢掉了&quot;什么时候到哪&quot;，只留下&quot;经过哪些点&quot;。对自治系统，轨线可以相交于平衡点，但不会自交。<\/p>\n<h3>9.2 李雅普诺夫稳定性<\/h3>\n<p>定义与前面教材一致：稳定（不跑远）、渐近稳定（回到平衡点）、不稳定。<\/p>\n<p><strong>按线性近似判断<\/strong>：设 A=f′(0)，若 A 的特征值实部全负，渐近稳定；有正实部，不稳定；实部有零，线性近似失效。<\/p>\n<h3>9.3 第二方法<\/h3>\n<p>找 V 正定、沿轨线导数负定。V 不必是能量，可以是任何满足条件的函数。构造没有通用算法，常用套路是二次型、能量、平方和。<\/p>\n<h3>9.4 平面初等奇点<\/h3>\n<p>对线性系统，用 p=tr A，q=det A，Δ=p²−4q 分类：结点、鞍点、焦点、中心（详见速查表）。<\/p>\n<p>对非线性系统，若平衡点是双曲的（特征值实部不为零），则其局部相图与线性化系统拓扑等价（哈特曼-格罗布曼）。这是&quot;看线性化就够了&quot;的理论保证。<\/p>\n<h3>9.5 极限环<\/h3>\n<p>极限环是孤立的闭轨。它与中心型闭轨的区别是：<\/p>\n<ul><li>\n中心：闭轨连续分布成一族，附近轨线绕着走，不靠近也不远离；\n<\/li><li>\n极限环：附近轨线螺旋趋近或远离它。\n<\/ul>\n<p>判据：庞加莱-本迪克松定理（平面、有界、无平衡点 ⇒ 存在闭轨）。稳定性判据用庞加莱映射的导数（一维时就是&quot;绕一圈的放大率&quot;）。<\/p>\n<h3>9.6 环面上的方程<\/h3>\n<p>在环面 T² 上，轨线可能永远不闭合（如果两个频率不可公度），也可能闭合（可公度）。这给出了&quot;准周期运动&quot;的几何图像，也是 KAM 理论的入口。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[非线性系统] --&gt; B[平衡点]\n    B --&gt; C[线性化 A]\n    C --&gt; D{是否双曲}\n    D --&gt;|是| E[线性化判稳]\n    D --&gt;|否| F[第二方法 V]\n    B --&gt; G[平面情形]\n    G --&gt; H[迹与行列式分类]\n    H --&gt; I[结点 鞍点 焦点 中心]\n    G --&gt; J[极限环]\n    J --&gt; K[庞加莱映射]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：图中最下面一条支线是本章的高潮：从&quot;局部判稳&quot;走到&quot;全局闭轨存在&quot;，工具从代数变成拓扑。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：相空间像一张地形图，轨线像水流路径。平衡点是湖底或山顶，极限环是一条环形的&quot;跑道&quot;，附近的水流都被吸上去绕着跑。<\/p>\n<p><strong>失效边界<\/strong>：三维以上没有庞加莱-本迪克松，轨线可能被吸引到奇怪吸引子上，既不是平衡点也不是闭轨。<\/p>\n<p><strong>实例<\/strong>：范德波尔振子 x″+ε(x²−1)x′+x=0。化为系统后，ε&gt;0 时存在唯一稳定极限环，所有非零初值的轨线都螺旋趋近它。这正是电子管振荡器的数学模型。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为&quot;轨线就是积分曲线&quot;<\/strong>——实际上轨线丢了时间信息。\n<\/li><li>\n<strong>别以为&quot;闭轨就是极限环&quot;<\/strong>——实际上中心型闭轨成族分布，极限环是孤立的。\n<\/li><li>\n<strong>别以为&quot;线性化总能判稳&quot;<\/strong>——实际上非双曲时失效。\n<\/li><li>\n<strong>别以为&quot;平面定理能推广到高维&quot;<\/strong>——实际上三维开始出现奇怪吸引子。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n轨线与积分曲线的区别？\n<p>（答案：轨线不含时间信息，只记录经过的点。解析：对自治系统，轨线是相空间中的曲线。）<\/p>\n<\/ol>\n<ol><li>\n双曲平衡点的定义？\n<p>（答案：雅可比矩阵的特征值实部都不为零。解析：此时线性化与非线性拓扑等价。）<\/p>\n<\/ol>\n<ol><li>\n极限环与中心型闭轨的区别？\n<p>（答案：极限环孤立，附近轨线螺旋趋近或远离；中心型闭轨成族，附近轨线绕行不趋近。解析：这决定了稳定性判据不同。）<\/p>\n<\/ol>\n<ol><li>\n环面上什么时候轨线不闭合？\n<p>（答案：两个频率不可公度时。解析：轨线在环面上稠密，永不回到起点。）<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n相空间 + 轨线 + 演化规则 = 动力系统。\n<\/li><li>\n双曲 ⇒ 线性化可判；非双曲 ⇒ 找 V。\n<\/li><li>\n极限环孤立，中心闭轨成族。\n<\/ul>", "c01": "<h1>首次积分<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 2、8 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>沿方程组的每条轨线都取常数的函数，等价于方向导数为零。<\/p>\n<h2>为什么重要<\/h2>\n<p>它是连接常微分方程与偏微分方程的那道桥：每一个首次积分都对应一个一阶偏微分方程的解。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n    A[首次积分 F] --&gt; B[等值面不变]\n    B --&gt; C[n 维系统有 n-1 个]\n    C --&gt; D[轨线是等值面的交]\n    A --&gt; E[一阶 PDE 的通解]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>以 Volterra 系统为例，H=d x − c ln x + b y − a ln y 沿轨线不变，所以轨线全部落在 H 的等值线上。又因为 H 在平衡点取极小，等值线是闭合的，于是种群数量周期性振荡。<\/p>\n<p>首次积分不唯一：任意函数作用在它上面仍是首次积分。要找&quot;独立&quot;的一组，需要梯度线性无关。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为首次积分是解——它只是沿解不变的函数。\n<\/li><li>\n别以为一定能找到 n 个——独立的最多 n−1 个。\n<\/li><li>\n别以为存在性无条件——向量场在平衡点处退化。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 2 章<\/td><td>Volterra 模型<\/td><td>存在闭轨<\/td><\/tr><tr><td>第 8 章<\/td><td>一阶 PDE<\/td><td>通解由首次积分生成<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：方向导数、向量场\n<\/li><li>\n后续：哈密顿系统、可积性\n<\/ul>", "c02": "<h1>Peano 存在定理<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 3 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>只要右端连续，初值问题就至少有一个解；唯一性不在保证范围内。<\/p>\n<h2>为什么重要<\/h2>\n<p>它标出了&quot;存在&quot;与&quot;唯一&quot;之间的真实分界：连续性是最低要求，李普希茨是额外成本。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[欧拉折线族] --&gt; B[等度连续 一致有界]\n    B --&gt; C[Ascoli-Arzela]\n    C --&gt; D[抽出收敛子列]\n    D --&gt; E[极限满足积分方程]\n    E --&gt; F[解存在]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>证明不用迭代，用紧性。取步长 hₙ→0 的欧拉折线 yₙ，它们一致有界（被 M·h 控制）且等度连续（斜率被 M 控制）。Ascoli-Arzelà 给出一个一致收敛的子列，极限连续，再用 f 的一致连续性把积分与极限交换，得到它满足积分方程。<\/p>\n<p>经典反例 y′=√|y|，y(0)=0 有无穷多解，说明&quot;连续&quot;确实不够。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 Peano 定理没用——它是假设最少的工具，在只知连续时不可替代。\n<\/li><li>\n别以为&quot;存在多个解&quot;意味着&quot;解不光滑&quot;——它们都可以很光滑。\n<\/li><li>\n别以为 Ascoli 定理只在这里用——紧性方法是整个分析的存在性范式。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 3 章<\/td><td>存在性<\/td><td>连续即可<\/td><\/tr><tr><td>第 3 章<\/td><td>反例<\/td><td>唯一性失效<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：等度连续、紧性\n<\/li><li>\n后续：奇解、非唯一性现象\n<\/ul>", "c03": "<h1>变分方程<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：第 4 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>描述解对初值的偏导数如何演化的线性方程：Φ′=f_y(x,y(x))Φ，Φ(x₀)=I。<\/p>\n<h2>为什么重要<\/h2>\n<p>它是&quot;线性化判稳&quot;的严格出处。所有工程上的灵敏度分析、稳定性线性化，都是它的应用。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n    A[原系统] --&gt; B[沿参考解取雅可比]\n    B --&gt; C[变分方程]\n    C --&gt; D[基解矩阵 Phi]\n    D --&gt; E[初值误差的放大率]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>推导思路：把解写成 y(x;y₀)，对 y₀ 求偏导，交换求导次序（需要连续可微性定理保证），得到 Φ 的方程。<\/p>\n<p>关键理解：Φ 不是&quot;另一个解&quot;，而是&quot;解的导数&quot;。它的初值是单位矩阵，因为恒等映射的导数是 I。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为变分方程是近似——它是精确的线性方程，只是描述的是导数而非解本身。\n<\/li><li>\n别以为Φ 一定有界——特征值实部为正时会指数增长。\n<\/li><li>\n别以为可以随便交换求导顺序——需要 f 对 y 连续可微。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 4 章<\/td><td>连续可微性<\/td><td>Φ′=f_yΦ<\/td><\/tr><tr><td>第 9 章<\/td><td>稳定性<\/td><td>线性化的理论依据<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：雅可比矩阵、连续可微\n<\/li><li>\n后续：李雅普诺夫稳定性、灵敏度分析\n<\/ul>", "c04": "<h1>弗洛凯理论<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：第 5 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>周期系数系统的稳定性由&quot;绕一个周期后的演化矩阵&quot;（单值矩阵）的特征值决定。<\/p>\n<h2>为什么重要<\/h2>\n<p>常系数系统能算特征值，周期系数不能——没有固定矩阵。弗洛凯理论用&quot;绕一圈的放大倍数&quot;替代了特征值。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[周期系数 A of x] --&gt; B[基解矩阵 Phi]\n    B --&gt; C[单值矩阵 M = Phi of T]\n    C --&gt; D[弗洛凯乘子]\n    D --&gt; E{模是否小于 1}\n    E --&gt;|全小于| F[渐近稳定]\n    E --&gt;|有大于| G[不稳定]\n    E --&gt;|等于| H[临界 需细查]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>由 Φ(x+T)=Φ(x)M 可知，走一个周期相当于右乘 M。所以 x(nT)=Mⁿx(0)，稳定性完全由 M 的谱决定。<\/p>\n<p>M 与基解矩阵的选取无关（相似变换不改变特征值）。乘子本身不是特征值，特征值（弗洛凯指数）是它们的对数除以 T。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为可以直接对 A(x) 算特征值——它随 x 变。\n<\/li><li>\n别以为乘子模为 1 就稳定——可能多项式增长（若尔当块）。\n<\/li><li>\n别以为 M 唯一——相似意义下唯一。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 5 章<\/td><td>周期系数方程组<\/td><td>Φ(x+T)=Φ(x)M<\/td><\/tr><tr><td>第 5 章<\/td><td>判稳<\/td><td>看乘子模<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：基解矩阵\n<\/li><li>\n后续：马蒂厄方程、参数共振\n<\/ul>", "__path__": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：基本概念<\/strong><br>阅读：<a href=\"#/book/liubin-ode/chapter/ch01\">第 1 章：基本概念<\/a><br>检查点：能由曲线族反求方程<\/li><li class='path-step' id='path-02'><strong>步骤 02：初等积分法<\/strong><br>阅读：<a href=\"#/book/liubin-ode/chapter/ch02\">第 2 章：初等积分法<\/a><br>检查点：用积分因子主线重解四类方程<\/li><li class='path-step' id='path-03'><strong>步骤 03：存在唯一性<\/strong><br>阅读：<a href=\"#/book/liubin-ode/chapter/ch03\">第 3 章：存在和唯一性<\/a><br>检查点：说清 Picard 与 Peano 差别<\/li><li class='path-step' id='path-04'><strong>步骤 04：对初值依赖<\/strong><br>阅读：<a href=\"#/book/liubin-ode/chapter/ch04\">第 4 章：解对初值和参数的依赖性<\/a><br>检查点：写出变分方程<\/li><li class='path-step' id='path-05'><strong>步骤 05：线性方程组<\/strong><br>阅读：<a href=\"#/book/liubin-ode/chapter/ch05\">第 5 章：线性微分方程组<\/a><br>检查点：用乘子判稳<\/li><li class='path-step' id='path-06'><strong>步骤 06：解析解<\/strong><br>阅读：<a href=\"#/book/liubin-ode/chapter/ch06\">第 6 章：解析解<\/a><br>检查点：幂级数解艾里方程<\/li><li class='path-step' id='path-07'><strong>步骤 07：边值问题<\/strong><br>阅读：<a href=\"#/book/liubin-ode/chapter/ch07\">第 7 章：边值问题<\/a><br>检查点：证正交性<\/li><li class='path-step' id='path-08'><strong>步骤 08：一阶 PDE<\/strong><br>阅读：<a href=\"#/book/liubin-ode/chapter/ch08\">第 8 章：一阶偏微分方程<\/a><br>检查点：特征线法一个例题<\/li><li class='path-step' id='path-09'><strong>步骤 09：定性理论<\/strong><br>阅读：<a href=\"#/book/liubin-ode/chapter/ch09\">第 9 章：定性理论简介<\/a><br>检查点：判极限环<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "__quiz_all__": "<h1>全部测验<\/h1><p>全书各章测验汇总：逐题作答，提交后即时反馈并显示解析。<\/p><h2>测验：第 1 章：基本概念<\/h2><div class='quiz-item' data-qid='ch01-q01' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 微分方程 y′=y(y−1) 的线性性是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch01-q01' value='0'> 线性<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='1'> 非线性<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='2'> 半线性<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='3'> 无法判断<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch01-q02' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 曲线族 y=c₁x+c₂x² 满足的方程是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch01-q02' value='0'> x²y″−2xy′+2y=0<\/label><label class='quiz-opt'><input type='radi h05-q09' value='0'> Φ(0)<\/label><label class='quiz-opt'><input type='radio' name='ch05-q09' value='1'> Φ(T)<\/label><label class='quiz-opt'><input type='radio' name='ch05-q09' value='2'> A(T)<\/label><label class='quiz-opt'><input type='radio' name='ch05-q09' value='3'> det Φ(T)<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch05-q10' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 重特征值情形解中出现 x 的幂，原因是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch05-q10' value='0'> 积分常数<\/label><label class='quiz-opt'><input type='radio' name='ch05-q10' value='1'> 广义特征向量链<\/label><label class='quiz-opt'><input type='radio' name='ch05-q10' value='2'> 数值误差<\/label><label class='quiz-opt'><input type='radio' name='ch05-q10' value='3'> 特征值非实数<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch06__": "<h1>测验：第 6 章：解析解<\/h1><div class='quiz-item' data-qid='ch06-q11' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 柯西定理的条件是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch06-q11' value='0'> f 连续<\/label><label class='quiz-opt'><input type='radio' name='ch06-q11' value='1'> f 满足李普希茨<\/label><label class='quiz-opt'><input type='radio' name='ch06-q11' value='2'> f 解析<\/label><label class='quiz-opt'><input type='radio' name='ch06-q11' value='3'> f 有界<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch06-q12' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 正则奇点的条件是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch06-q12' value='0'> p、q 都解析<\/label><label class='quiz-opt'><input type='radio' name='ch06-q12' value='1'> p 至多一阶极点且 q 至多二阶极点<\/label><label class='quiz-opt'><input type='radio' name='ch06-q12' value='2'> p 任意<\/label><label class='quiz-opt'><input type='radio' name='ch06-q12' value='3'> q 至多一阶极点<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch07__": "<h1>测验：第 7 章：边值问题<\/h1><div class='quiz-item' data-qid='ch07-q13' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 斯特姆-刘维尔特征函数正交的权是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch07-q13' value='0'> p(x)<\/label><label class='quiz-opt'><input type='radio' name='ch07-q13' value='1'> ρ(x)<\/label><label class='quiz-opt'><input type='radio' name='ch07-q13' value='2'> q(x)<\/label><label class='quiz-opt'><input type='radio' name='ch07-q13' value='3'> 1<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch07-q14' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 比较定理中 q₂≥q₁ 意味着第二个方程？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch07-q14' value='0'> 零点更少<\/label><label class='quiz-opt'><input type='radio' name='ch07-q14' value='1'> 零点更多<\/label><label class='quiz-opt'><input type='radio' name='ch07-q14' value='2'> 零点一样<\/label><label class='quiz-opt'><input type='radio' name='ch07-q14' value='3'> 无解<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch08__": "<h1>测验：第 8 章：一阶偏微分方程<\/h1><div class='quiz-item' data-qid='ch08-q15' data-type='single'><p class='quiz-q'><b>Q1.<\/b> n 维自治系统独立首次积分有几个？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch08-q15' value='0'> n<\/label><label class='quiz-opt'><input type='radio' name='ch08-q15' value='1'> n−1<\/label><label class='quiz-opt'><input type='radio' name='ch08-q15' value='2'> 1<\/label><label class='quiz-opt'><input type='radio' name='ch08-q15' value='3'> n+1<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch08-q16' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 拟线性 PDE 柯西问题可解的条件是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch08-q16' value='0'> 初始曲线是直线<\/label><label class='quiz-opt'><input type='radio' name='ch08-q16' value='1'> 初始曲线横截特征方向<\/label><label class='quiz-opt'><input type='radio' name='ch08-q16' value='2'> 系数为常数<\/label><label class='quiz-opt'><input type='radio' name='ch08-q16' value='3'> u 有界<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch09__": "<h1>测验：第 9 章：定性理论简介<\/h1><div class='quiz-item' data-qid='ch09-q17' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 轨线与积分曲线的差别是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch09-q17' value='0'> 轨线含时间<\/label><label class='quiz-opt'><input type='radio' name='ch09-q17' value='1'> 轨线不含时间<\/label><label class='quiz-opt'><input type='radio' name='ch09-q17' value='2'> 轨线一定闭合<\/label><label class='quiz-opt'><input type='radio' name='ch09-q17' value='3'> 积分曲线一定不闭合<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch09-q18' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 极限环与中心型闭轨的关键差别是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch09-q18' value='0'> 极限环是孤立的<\/label><label class='quiz-opt'><input type='radio' name='ch09-q18' value='1'> 极限环不稳定<\/label><label class='quiz-opt'><input type='radio' name='ch09-q18' value='2'> 中心闭轨不存在<\/label><label class='quiz-opt'><input type='radio' name='ch09-q18' value='3'> 两者相同<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz___all__": "<h1>测验：__all<\/h1><div class='quiz-item' data-qid='q19' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 为什么周期系数系统不能直接对 A(t) 求特征值？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q19' value='0'> A(t) 不可逆<\/label><label class='quiz-opt'><input type='radio' name='q19' value='1'> A(t) 随 t 变化，没有固定谱<\/label><label class='quiz-opt'><input type='radio' name='q19' value='2'> 特征值必为复数<\/label><label class='quiz-opt'><input type='radio' name='q19' value='3'> 需要对称矩阵<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q20' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 解析解方法与定性理论的分工是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q20' value='0'> 前者给局部精确解，后者给全局结构<\/label><label class='quiz-opt'><input type='radio' name='q20' value='1'> 两者等价<\/label><label class='quiz-opt'><input type='radio' name='q20' value='2'> 前者更精确所以总能替代后者<\/label><label class='quiz-opt'><input type='radio' name='q20' value='3'> 后者只对线性系统有效<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__cards__": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "__glossary__": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='常微分方程'>常微分方程 — 一元未知函数及其导数构成的方程 <span class=glossary-ref>（第 1 章：基本概念）<\/span><\/li><li data-term='线素场'>线素场 — 平面上每点标出斜率的短线集合 <span class=glossary-ref>（第 1 章：基本概念）<\/span><\/li><li data-term='奇异点'>奇异点 — 线素场无定义的点 <span class=glossary-ref>（第 1 章：基本概念）<\/span><\/li><li data-term='积分因子'>积分因子 — 使 P dx+Q dy 成为全微分的乘子 <span class=glossary-ref>（第 2 章：初等积分法）<\/span><\/li><li data-term='恰当方程'>恰当方程 — 左端恰为全微分的方程 <span class=glossary-ref>（第 2 章：初等积分法）<\/span><\/li><li data-term='克莱罗方程'>克莱罗方程 — y=xp+g(p) 型方程 <span class=glossary-ref>（第 2 章：初等积分法）<\/span><\/li><li data-term='拉格朗日方程'>拉格朗日方程 — y=xf(p)+g(p) 型方程 <span class=glossary-ref>（第 2 章：初等积分法）<\/span><\/li><li data-term='riccati 方程'>Riccati 方程 — y′=P y²+Q y+R <span class=glossary-ref>（第 2 章：初等积分法）<\/span><\/li><li data-term='volterra 模型'>Volterra 模型 — 捕食者-食饵方程 <span class=glossary-ref>（第 2 章：初等积分法）<\/span><\/li><li data-term='奇解'>奇解 — 通解族的包络 <span class=glossary-ref>（第 3 章：存在和唯一性）<\/span><\/li><li data-term='picard 定理'>Picard 定理 — 连续加李普希茨 ⇒ 唯一解 <span class=glossary-ref>（第 3 章：存在和唯一性）<\/span><\/li><li data-term='peano 定理'>Peano 定理 — 连续 ⇒ 至少一个解 <span class=glossary-ref>（第 3 章：存在和唯一性）<\/span><\/li><li data-term='欧拉折线'>欧拉折线 — 用折线逼近积分曲线 <span class=glossary-ref>（第 3 章：存在和唯一性）<\/span><\/li><li data-term='等度连续'>等度连续 — 一族函数斜率一致有界 <span class=glossary-ref>（第 3 章：存在和唯一性）<\/span><\/li><li data-term='饱和解'>饱和解 — 不能再延伸的解 <span class=glossary-ref>（第 3 章：存在和唯一性）<\/span><\/li><li data-term='变分方程'>变分方程 — Φ′=f_yΦ <span class=glossary-ref>（第 4 章：解对初值和参数的依赖性）<\/span><\/li><li data-term='灵敏度方程'>灵敏度方程 — 含参数时的变分方程 <span class=glossary-ref>（第 4 章：解对初值和参数的依赖性）<\/span><\/li><li data-term='基解矩阵'>基解矩阵 — 以线性无关解为列的矩阵 <span class=glossary-ref>（第 5 章：线性微分方程组）<\/span><\/li><li data-term='单值矩阵'>单值矩阵 — Φ(T)，走一个周期的演化 <span class=glossary-ref>（第 5 章：线性微分方程组）<\/span><\/li><li data-term='弗洛凯乘子'>弗洛凯乘子 — 单值矩阵的特征值 <span class=glossary-ref>（第 5 章：线性微分方程组）<\/span><\/li><li data-term='常点'>常点 — 系数解析的点 <span class=glossary-ref>（第 6 章：解析解）<\/span><\/li><li data-term='正则奇点'>正则奇点 — 系数极点阶数受限的点 <span class=glossary-ref>（第 6 章：解析解）<\/span><\/li><li data-term='指标方程'>指标方程 — 决定弗罗贝尼乌斯级数指数的方程 <span class=glossary-ref>（第 6 章：解析解）<\/span><\/li><li data-term='斯特姆比较定理'>斯特姆比较定理 — 势大扩散弱则零点多的比较结论 <span class=glossary-ref>（第 7 章：边值问题）<\/span><\/li><li data-term='斯特姆-刘维尔问题'>斯特姆-刘维尔问题 — 自伴形式的特征值问题 <span class=glossary-ref>（第 7 章：边值问题）<\/span><\/li><li data-term='单值矩阵判稳'>单值矩阵判稳 — 看乘子模是否小于 1 <span class=glossary-ref>（第 7 章：边值问题）<\/span><\/li><li data-term='首次积分'>首次积分 — 沿轨线取常数的函数 <span class=glossary-ref>（第 8 章：一阶偏微分方程）<\/span><\/li><li data-term='特征线'>特征线 — PDE 沿之降为 ODE 的曲线 <span class=glossary-ref>（第 8 章：一阶偏微分方程）<\/span><\/li><li data-term='拟线性方程'>拟线性方程 — 系数依赖 u 的一阶 PDE <span class=glossary-ref>（第 8 章：一阶偏微分方程）<\/span><\/li><li data-term='轨线'>轨线 — 相空间中不含时间信息的曲线 <span class=glossary-ref>（第 9 章：定性理论简介）<\/span><\/li><li data-term='双曲平衡点'>双曲平衡点 — 特征值实部全不为零的平衡点 <span class=glossary-ref>（第 9 章：定性理论简介）<\/span><\/li><li data-term='极限环'>极限环 — 孤立的闭轨 <span class=glossary-ref>（第 9 章：定性理论简介）<\/span><\/li><li data-term='庞加莱映射'>庞加莱映射 — 绕一圈的首次回归映射 <span class=glossary-ref>（第 9 章：定性理论简介）<\/span><\/li><\/ul>", "__patterns__": "<h1>模式与框架库<\/h1>\n<h2>框架：把一切初等解法归约为积分因子<\/h2>\n<ol><li>\n先把方程写成 P dx+Q dy=0 的对称形式。\n<\/li><li>\n判 M_y=N_x：恰当则直接求 u。\n<\/li><li>\n不恰当时，看 (M_y−N_x)/N 是否只含 x，或 (N_x−M_y)/M 是否只含 y。\n<\/li><li>\n分离变量、线性方程都是&quot;μ 恰好只依赖一个变量&quot;的特例。\n<\/ol>\n<h2>框架：存在性证明的两种范式<\/h2>\n<ul><li>\n<strong>构造型<\/strong>（Picard）：迭代 → 阶乘级数控制 → 一致收敛。需要李普希茨。\n<\/li><li>\n<strong>紧性型<\/strong>（Peano）：欧拉折线 → 等度连续 → Ascoli-Arzelà → 抽子列。只需连续。\n<\/ul>\n<p>判题时先问&quot;要不要唯一&quot;：要唯一就必须验证李普希茨。<\/p>\n<h2>决策规则<\/h2>\n<ul><li>\n周期系数系统：不要算特征值，算单值矩阵。\n<\/li><li>\n解析系数：先判点是常点、正则奇点还是非正则奇点，再选幂级数或弗罗贝尼乌斯。\n<\/li><li>\n边值问题：先看齐次问题是否有非零解，再谈唯一性。\n<\/ul>\n<h2>反模式<\/h2>\n<ul><li>\n<strong>把 Peano 定理当成&quot;存在且唯一&quot;<\/strong>。它只保证存在。\n<\/li><li>\n<strong>对周期系数系统直接求 A 的特征值<\/strong>。A 随 t 变，这个特征值没有意义。\n<\/li><li>\n<strong>在正则奇点处直接写普通幂级数<\/strong>。指数 r 可能不是整数，必须先解指标方程。\n<\/li><li>\n<strong>把斯特姆比较定理当成等式<\/strong>。它只给零点个数的比较，不给具体位置。\n<\/ul>", "__cheatsheet__": "<h1>速查表<\/h1>\n<h2>初等解法（以积分因子为主线）<\/h2>\n<table><thead><tr><th>方程<\/th><th>对称形式<\/th><th>积分因子<\/th><\/tr><\/thead><tbody><tr><td>y′=f(x)g(y)<\/td><td>dy−f(x)g(y)dx=0<\/td><td>1/g(y)<\/td><\/tr><tr><td>y′=φ(y/x)<\/td><td>dy−φ(y/x)dx=0<\/td><td>1/(y−xφ) 类<\/td><\/tr><tr><td>y′+P(x)y=Q(x)<\/td><td>(Py−Q)dx+dy=0<\/td><td>e^(∫P dx)<\/td><\/tr><tr><td>恰当方程<\/td><td>P dx+Q dy=0<\/td><td>1<\/td><\/tr><tr><td>Riccati（已知 y₁）<\/td><td>—<\/td><td>换元 y=y₁+1/u<\/td><\/tr><\/tbody><\/table>\n<h2>存在性<\/h2>\n<table><thead><tr><th>定理<\/th><th>条件<\/th><th>结论<\/th><\/tr><\/thead><tbody><tr><td>Picard<\/td><td>连续 + 李普希茨<\/td><td>存在且唯一<\/td><\/tr><tr><td>Peano<\/td><td>连续<\/td><td>存在<\/td><\/tr><tr><td>延拓<\/td><td>局部解<\/td><td>饱和解<\/td><\/tr><tr><td>连续依赖<\/td><td>李普希茨<\/td><td>误差 ≤ 初值差 e^(L<\/td><td>x−x₀<\/td><td>)<\/td><\/tr><tr><td>变分方程<\/td><td>f 对 y 可微<\/td><td>Φ′=f_yΦ，Φ(x₀)=I<\/td><\/tr><\/tbody><\/table>\n<h2>线性方程组<\/h2>\n<table><thead><tr><th>场景<\/th><th>结论<\/th><\/tr><\/thead><tbody><tr><td>基解矩阵<\/td><td>Φ′=AΦ，det Φ≠0<\/td><\/tr><tr><td>单特征值<\/td><td>Φ=[vᵢe^(λᵢx)]<\/td><\/tr><tr><td>重特征值<\/td><td>e^(λx)[v₁+v₂x+…+v_kx^(k−1)/(k−1)!]<\/td><\/tr><tr><td>周期系数<\/td><td>Φ(x+T)=Φ(x)M<\/td><\/tr><tr><td>判稳<\/td><td>M 的乘子模 &lt;1 稳定，&gt;1 不稳定，=1 临界<\/td><\/tr><\/tbody><\/table>\n<h2>解析解<\/h2>\n<table><thead><tr><th>点类型<\/th><th>方法<\/th><th>解的形式<\/th><\/tr><\/thead><tbody><tr><td>常点<\/td><td>幂级数<\/td><td>Σaₖ(x−x₀)ᵏ<\/td><\/tr><tr><td>正则奇点<\/td><td>弗罗贝尼乌斯<\/td><td>(x−x₀)^r Σaₖ(x−x₀)ᵏ<\/td><\/tr><tr><td>非正则奇点<\/td><td>一般无级数解<\/td><td>—<\/td><\/tr><\/tbody><\/table>\n<h2>边值问题<\/h2>\n<table><thead><tr><th>结论<\/th><th>内容<\/th><\/tr><\/thead><tbody><tr><td>自伴性<\/td><td>⟨Ly,z⟩=⟨y,Lz⟩<\/td><\/tr><tr><td>
