tions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch03-q09' data-type='single'><p class='quiz-q'><b>Q3.<\/b> 方程 y′=3y^(2/3)，y(0)=0 的解的特点是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch03-q09' value='0'> 唯一<\/label><label class='quiz-opt'><input type='radio' name='ch03-q09' value='1'> 不存在<\/label><label class='quiz-opt'><input type='radio' name='ch03-q09' value='2'> 不唯一<\/label><label class='quiz-opt'><input type='radio' name='ch03-q09' value='3'> 只在正半轴存在<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p><h2>测验：第 4 章：高阶线性微分方程<\/h2><div class='quiz-item' data-qid='ch04-q10' data-type='single'><p class='quiz-q'><b>Q1.<\/b> y″−3y′+2y=0 的基本解组是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch04-q10' value='0'> eˣ, e^(2x)<\/label><label class='quiz-opt'><input type='radio' name='ch04-q10' value='1'> e^(−x), e^(−2x)<\/label><label class='quiz-opt'><input type='radio' name='ch04-q10' value='2'> 1, x<\/label><label class='quiz-opt'><input type='radio' name='ch04-q10' value='3'> cos x, sin x<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch04-q11' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 朗斯基行列式的刘维尔公式说明？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch04-q11' value='0'> W 可能时零时非零<\/label><label class='quiz-opt'><input type='radio' name='ch04-q11' value='1'> W 要么恒零要么恒不为零<\/label><label class='quiz-opt'><input type='radio' name='ch04-q11' value='2'> W 恒为正<\/label><label class='quiz-opt'><input type='radio' name='ch04-q11' value='3'> W 与 a₁ 无关<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'>< /div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch06__": "<h1>测验：第 6 章：非线性与稳定性<\/h1><div class='quiz-item' data-qid='ch06-q16' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 系统 tr A=−2，det A=2，Δ&lt;0 时奇点类型是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch06-q16' value='0'> 稳定结点<\/label><label class='quiz-opt'><input type='radio' name='ch06-q16' value='1'> 稳定焦点<\/label><label class='quiz-opt'><input type='radio' name='ch06-q16' value='2'> 鞍点<\/label><label class='quiz-opt'><input type='radio' name='ch06-q16' value='3'> 中心<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch06-q17' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 李雅普诺夫第二方法中 V 需满足？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch06-q17' value='0'> V 正定且沿轨线导数负定<\/label><label class='quiz-opt'><input type='radio' name='ch06-q17' value='1'> V 负定且导数正定<\/label><label class='quiz-opt'><input type='radio' name='ch06-q17' value='2'> V 任意<\/label><label class='quiz-opt'><input type='radio' name='ch06-q17' value='3'> V 必须是二次型<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch06-q18' data-type='single'><p class='quiz-q'><b>Q3.<\/b> 庞加莱-本迪克松定理适用于？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch06-q18' value='0'> 任意维系统<\/label><label class='quiz-opt'><input type='radio' name='ch06-q18' value='1'> 仅平面系统<\/label><label class='quiz-opt'><input type='radio' name='ch06-q18' value='2'> 仅线性系统<\/label><label class='quiz-opt'><input type='radio' name='ch06-q18' value='3'> 仅哈密顿系统<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch07__": "<h1>测验：第 7 章：一阶线性偏微分方程<\/h1><div class='quiz-item' data-qid='ch07-q19' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 齐次线性 PDE a u_x+b u_y=0 的通解是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch07-q19' value='0'> u=F(Φ)，Φ 为首次积分<\/label><label class='quiz-opt'><input type='radio' name='ch07-q19' value='1'> u=Φ(x,y)<\/label><label class='quiz-opt'><input type='radio' name='ch07-q19' value='2'> u=ax+by<\/label><label class='quiz-opt'><input type='radio' name='ch07-q19' value='3'> u=常数<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch07-q20' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 柯西问题失效的几何条件是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch07-q20' value='0'> 初始曲线与特征线相切<\/label><label class='quiz-opt'><input type='radio' name='ch07-q20' value='1'> 初始曲线是直线<\/label><label class='quiz-opt'><input type='radio' name='ch07-q20' value='2'> 初始值不连续<\/label><label class='quiz-opt'><input type='radio' name='ch07-q20' value='3'> 方程非线性<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch07-q21' data-type='single'><p class='quiz-q'><b>Q3.<\/b> n 维一阶方程组有几个独立首次积分？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch07-q21' value='0'> n 个<\/label><label class='quiz-opt'><input type='radio' name='ch07-q21' value='1'> n−1 个<\/label><label class='quiz-opt'><input type='radio' name='ch07-q21' value='2'> 1 个<\/label><label class='quiz-opt'><input type='radio' name='ch07-q21' value='3'> 无穷多个<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch08__": "<h1>测验：第 8 章：边值问题<\/h1><div class='quiz-item' data-qid='ch08-q22' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 边值问题 y″+π²y=0，y(0)=y(1)=0 的解？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch08-q22' value='0'> 唯一零解<\/label><label class='quiz-opt'><input type='radio' name='ch08-q22' value='1'> 不唯一<\/label><label class='quiz-opt'><input type='radio' name='ch08-q22' value='2'> 无解<\/label><label class='quiz-opt'><input type='radio' name='ch08-q22' value='3'> 唯一非零解<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch08-q23' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 格林函数在 x=ξ 处的导数跳跃量是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch08-q23' value='0'> 0<\/label><label class='quiz-opt'><input type='radio' name='ch08-q23' value='1'> 1<\/label><label class='quiz-opt'><input type='radio' name='ch08-q23' value='2'> −1/p(ξ)<\/label><label class='quiz-opt'><input type='radio' name='ch08-q23' value='3'> p(ξ)<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch08-q24' data-type='single'><p class='quiz-q'><b>Q3.<\/b> 斯特姆-刘维尔问题的特征值？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch08-q24' value='0'> 可能为复数<\/label><label class='quiz-opt'><input type='radio' name='ch08-q24' value='1'> 全为实数<\/label><label class='quiz-opt'><input type='radio' name='ch08-q24' value='2'> 只有有限个<\/label><label class='quiz-opt'><input type='radio' name='ch08-q24' value='3'> 全为正<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz___all__": "<h1>测验：__all<\/h1><div class='quiz-item' data-qid='q25' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 同一个方程 y′=f(x,y)，若 f 连续但不在任何矩形上满足李普希茨，能保证的是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q25' value='0'> 存在且唯一<\/label><label class='quiz-opt'><input type='radio' name='q25' value='1'> 存在但不一定唯一<\/label><label class='quiz-opt'><input type='radio' name='q25' value='2'> 唯一但不一定存在<\/label><label class='quiz-opt'><input type='radio' name='q25' value='3'> 既不保证存在也不保证唯一<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q26' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 线性方程与非线性方程在“解集结构”上的根本差别是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q26' value='0'> 线性方程解集是线性空间<\/label><label class='quiz-opt'><input type='radio' name='q26' value='1'> 线性方程解一定唯一<\/label><label class='quiz-opt'><input type='radio' name='q26' value='2'> 非线性方程解集是线性空间<\/label><label class='quiz-opt'><input type='radio' name='q26' value='3'> 没有差别<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q27' data-type='single'><p class='quiz-q'><b>Q3.<\/b> 边值问题与初值问题最关键的区别是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q27' value='0'> 边值问题条件给在两端，可能无解或不唯一<\/label><label class='quiz-opt'><input type='radio' name='q27' value='1'> 边值问题不需要方程<\/label><label class='quiz-opt'><input type='radio' name='q27' value='2'> 边值问题一定唯一可解<\/label><label class='quiz-opt'><input type='radio' name='q27' value='3'> 初值问题不需要连续性<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q28' data-type='single'><p class='quiz-q'><b>Q4.<\/b> “混沌”在数学上的准确含义是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q28' value='0'> 随机过程<\/label><label class='quiz-opt'><input type='radio' name='q28' value='1'> 确定性系统对初值敏感且有界非周期<\/label><label class='quiz-opt'><input type='radio' name='q28' value='2'> 方程无解<\/label><label class='quiz-opt'><input type='radio' name='q28' value='3'> 数值方法失败<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__cards__": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "__glossary__": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='常微分方程'>常微分方程 — 只含一个自变量、未知函数及其导数的方程 <span class=glossary-ref>（第 1 章：绪论）<\/span><\/li><li data-term='阶'>阶 — 方程中出现过的最高阶导数的阶数 <span class=glossary-ref>（第 1 章：绪论）<\/span><\/li><li data-term='线性方程'>线性方程 — 关于未知函数及其各阶导数都是一次的方程 <span class=glossary-ref>（第 1 章：绪论）<\/span><\/li><li data-term='通解'>通解 — 含 n 个独立任意常数的解族 <span class=glossary-ref>（第 1 章：绪论）<\/span><\/li><li data-term='特解'>特解 — 满足给定初值条件的解 <span class=glossary-ref>（第 1 章：绪论）<\/span><\/li><li data-term='隐式解'>隐式解 — 由 Φ(x,y)=0 确定的解，也叫积分 <span class=glossary-ref>（第 1 章：绪论）<\/span><\/li><li data-term='初值问题'>初值问题 — 方程连同一点处的一组初值条件 <span class=glossary-ref>（第 1 章：绪论）<\/span><\/li><li data-term='积分曲线'>积分曲线 — 解在平面上的图形 <span class=glossary-ref>（第 1 章：绪论）<\/span><\/li><li data-term='方向场'>方向场 — 平面上每点标出斜率的线素集合 <span class=glossary-ref>（第 1 章：绪论）<\/span><\/li><li data-term='等斜线'>等斜线 — 方向场中斜率相同的点的连线 <span class=glossary-ref>（第 1 章：绪论）<\/span><\/li><li data-term='相平面'>相平面 — 以状态变量为坐标的平面，轨线在其上 <span class=glossary-ref>（第 1 章：绪论）<\/span><\/li><li data-term='变量分离'>变量分离 — 把方程改写成 f(y)dy=g(x)dx 的方法 <span class=glossary-ref>（第 2 章：一阶方程的初等解法）<\/span><\/li><li data-term='齐次型方程'>齐次型方程 — 右端只依赖 y/x 的方程 <span class=glossary-ref>（第 2 章：一阶方程的初等解法）<\/span><\/li><li data-term='常数变易法'>常数变易法 — 把齐次解的常数换成函数求非齐次解 <span class=glossary-ref>（第 2 章：一阶方程的初等解法）<\/span><\/li><li data-term='恰当方程'>恰当方程 — 左端恰为某个函数全微分的方程 <span class=glossary-ref>（第 2 章：一阶方程的初等解法）<\/span><\/li><li data-term='积分因子'>积分因子 — 乘上去使方程变恰当的因子 μ <span class=glossary-ref>（第 2 章：一阶方程的初等解法）<\/span><\/li><li data-term='奇解'>奇解 — 不属于通解族、但与族中曲线相切的解 <span class=glossary-ref>（第 2 章：一阶方程的初等解法）<\/span><\/li><li data-term='包络'>包络 — 与一族曲线相切的曲线 <span class=glossary-ref>（第 2 章：一阶方程的初等解法）<\/span><\/li><li data-term='李普希茨条件'>李普希茨条件 — 关于 y 的变化率被常数 L 卡住 <span class=glossary-ref>（第 3 章：解的存在唯一性）<\/span><\/li><li data-term='皮卡迭代'>皮卡迭代 — 用积分方程反复代换逼近解 <span class=glossary-ref>（第 3 章：解的存在唯一性）<\/span><\/li><li data-term='格朗沃尔引理'>格朗沃尔引理 — 积分不等式推出差为零的工具 <span class=glossary-ref>（第 3 章：解的存在唯一性）<\/span><\/li><li data-term='饱和解'>饱和解 — 不能再延拓的解 <span class=glossary-ref>（第 3 章：解的存在唯一性）<\/span><\/li><li data-term='朗斯基行列式'>朗斯基行列式 — n 个解及其导数排成的行列式 <span class=glossary-ref>（第 4 章：高阶线性微分方程）<\/span><\/li><li data-term='基本解组'>基本解组 — n 个线性无关的齐次解 <span class=glossary-ref>（第 4 章：高阶线性微分方程）<\/span><\/li><li data-term='特征方程'>特征方程 — 常系数方程代入 e^(rx) 得到的多项式方程 <span class=glossary-ref>（第 4 章：高阶线性微分方程）<\/span><\/li><li data-term='基解矩阵'>基解矩阵 — 以 n 个线性无关解为列的矩阵 Φ <span class=glossary-ref>（第 5 章：线性微分方程组）<\/span><\/li><li data-term='矩阵指数'>矩阵指数 — e^(At)=ΣAᵏtᵏ/k! <span class=glossary-ref>（第 5 章：线性微分方程组）<\/span><\/li><li data-term='预解矩阵'>预解矩阵 — (sI−A)⁻¹，其逆变换为 e^(At) <span class=glossary-ref>（第 5 章：线性微分方程组）<\/span><\/li><li data-term='平衡点'>平衡点 — 使 f(x)=0 的点 <span class=glossary-ref>（第 6 章：非线性与稳定性）<\/span><\/li><li data-term='渐近稳定'>渐近稳定 — 稳定且轨线趋于平衡点 <span class=glossary-ref>（第 6 章：非线性与稳定性）<\/span><\/li><li data-term='李雅普诺夫函数'>李雅普诺夫函数 — 沿轨线单调下降的正定函数 V <span class=glossary-ref>（第 6 章：非线性与稳定性）<\/span><\/li><li data-term='极限环'>极限环 — 孤立的闭轨 <span class=glossary-ref>（第 6 章：非线性与稳定性）<\/span><\/li><li data-term='哈密顿方程'>哈密顿方程 — dp/dt=−H_q，dq/dt=H_p 形式的系统 <span class=glossary-ref>（第 6 章：非线性与稳定性）<\/span><\/li><li data-term='首次积分'>首次积分 — 沿轨线取常数的函数 <span class=glossary-ref>（第 6 章：非线性与稳定性）<\/span><\/li><li data-term='特征线'>特征线 — 偏微分方程沿之降为常微分方程的曲线 <span class=glossary-ref>（第 7 章：一阶线性偏微分方程）<\/span><\/li><li data-term='柯西问题'>柯西问题 — 偏微分方程加初始曲线的问题 <span class=glossary-ref>（第 7 章：一阶线性偏微分方程）<\/span><\/li><li data-term='格林函数'>格林函数 — 点源在边界条件下产生的响应 <span class=glossary-ref>（第 8 章：边值问题）<\/span><\/li><li data-term='斯特姆-刘维尔问题'>斯特姆-刘维尔问题 — 自伴形式的特征值问题 <span class=glossary-ref>（第 8 章：边值问题）<\/span><\/li><li data-term='弗雷德霍姆二择一'>弗雷德霍姆二择一 — 齐次问题只有零解则非齐次唯一可解 <span class=glossary-ref>（第 8 章：边值问题）<\/span><\/li><\/ul>", "__patterns__": "<h1>模式与框架库<\/h1>\n<h2>框架：一阶方程解法判定链<\/h2>\n<p>拿到一个一阶方程，按顺序问四个问题，能停就停：<\/p>\n<ol><li>\n能不能写成 dy/dx=f(x)g(y)？→ 分离变量。\n<\/li><li>\n右端是不是 φ(y/x)？或者分式线性型能否平移？→ 换元。\n<\/li><li>\n是不是 y′+P(x)y=Q(x)？→ 常数变易公式。\n<\/li><li>\nM dx+N dy 是否满足 M_y=N_x？→ 恰当；否则算两个商式找积分因子。\n<\/ol>\n<p>停不下来的，说明它可能是隐式方程，转参数化路线。<\/p>\n<h2>框架：理论证明的三段式<\/h2>\n<p>凡&quot;存在唯一&quot;类定理，一律按这个骨架写：<\/p>\n<ol><li>\n化成积分方程（把微分变成积分，降低光滑性要求）；\n<\/li><li>\n构造逼近序列并证明一致收敛（存在）；\n<\/li><li>\n假设两个解，用格朗沃尔压成零（唯一）。\n<\/ol>\n<h2>决策规则<\/h2>\n<ul><li>\n线性方程：先判齐次还是非齐次。齐次找基本解组，非齐次先求一个特解。\n<\/li><li>\n常系数：先写特征方程。根重复就乘 x，根是复的就转三角，右端撞根就乘 xᵏ。\n<\/li><li>\n非线性：先算雅可比。双曲就用线性化；非双曲就找 V；平面还想看全局就找不变区域。\n<\/ul>\n<h2>反模式<\/h2>\n<ul><li>\n<strong>不检查除零因子<\/strong>。分离变量时除以 g(y)，忘了 g(y)=0 的常数解，直接丢解。\n<\/li><li>\n<strong>把 W=0 当成线性相关的万能判据<\/strong>。这只对线性齐次方程成立。\n<\/li><li>\n<strong>特征根重复还硬设 Ae^(λx)<\/strong>。代进去恒为零，解不出系数，然后怀疑自己算错。\n<\/li><li>\n<strong>边值问题直接套初值问题的存在唯一性<\/strong>。两者完全不同，边值问题可能无解。\n<\/li><li>\n<strong>用线性化处理临界情形<\/strong>。实部为零时线性化给不出结论，必须换方法。\n<\/ul>", "__cheatsheet__": "<h1>速查表<\/h1>\n<h2>一阶方程<\/h2>\n<table><thead><tr><th>类型<\/th><th>标准形<\/th><th>解法<\/th><th>通解<\/th><\/tr><\/thead><tbody><tr><td>变量分离<\/td><td>y′=f(x)g(y)<\/td><td>分离积分<\/td><td>∫dy/g(y)=∫f(x)dx+C<\/td><\/tr><tr><td>齐次型<\/td><td>y′=φ(y/x)<\/td><td>令 u=y/x<\/td><td>x du/dx=φ(u)−u<\/td><\/tr><tr><td>一阶线性<\/td><td>y′+P(x)y=Q(x)<\/td><td>常数变易<\/td><td>y=e^(−∫P)[∫Qe^(∫P)+C]<\/td><\/tr><tr><td>伯努利<\/td><td>y′+P y=Q yⁿ<\/td><td>令 z=y^(1−n)<\/td><td>化为一阶线性<\/td><\/tr><tr><td>恰当<\/td><td>M dx+N dy=0，M_y=N_x<\/td><td>求 u<\/td><td>u(x,y)=C<\/td><\/tr><tr><td>积分因子 x<\/td><td>(M_y−N_x)/N 只含 x<\/td><td>μ=e^(∫…)<\/td><td>乘后变恰当<\/td><\/tr><tr><td>积分因子 y<\/td><td>(N_x−M_y)/M 只含 y<\/td><td>μ=e^(∫…)<\/td><td>同上<\/td><\/tr><tr><td>隐式<\/td><td>y=f(x,p)<\/td><td>p=y′ 求导<\/td><td>参数式<\/td><\/tr><tr><td>克莱罗<\/td><td>y=xp+g(p)<\/td><td>求导<\/td><td>直线族 + 包络奇解<\/td><\/tr><\/tbody><\/table>\n<h2>线性方程<\/h2>\n<table><thead><tr><th>场景<\/th><th>结论<\/th><\/tr><\/thead><tbody><tr><td>n 阶齐次解空间<\/td><td>n 维<\/td><\/tr><tr><td>非齐次通解<\/td><td>特解 + 齐次通解<\/td><\/tr><tr><td>朗斯基<\/td><td>W(x)=W(x₀)exp(−∫a₁)<\/td><\/tr><tr><td>常数变易<\/td><td>Σcᵢ′yᵢ⁽ᵏ⁾=0，最后一式为 f<\/td><\/tr><tr><td>特征根单实<\/td><td>e^(rx)<\/td><\/tr><tr><td>特征根 k 重<\/td><td>e^(rx), xe^(rx), …, x^(k−1)e^(rx)<\/td><\/tr><tr><td>复根 α±iβ<\/td><td>e^(αx)cos βx, e^(αx)sin βx<\/td><\/tr><tr><td>右端 P_m e^(λx)<\/td><td>特解 xᵏQ_m e^(λx)<\/td><\/tr><tr><td>右端 e^(αx)(P cos+Q sin)<\/td><td>xᵏe^(αx)(R cos+S sin)<\/td><\/tr><\/tbody><\/table>\n<h2>方程组<\/h2>\n<table><thead><tr><th>场景<\/th><th>结论<\/th><\/tr><\/thead><tbody><tr><td>基解矩阵<\/td><td>Φ′=AΦ，det Φ≠0<\/td><\/tr><tr><td>非齐次<\/td><td>x=Φ[C+∫Φ⁻¹f]<\/td><\/tr><tr><td>det Φ<\/td><td>det Φ(t₀)exp(∫tr A)<\/td><\/tr><tr><td>e^(At)<\/td><td>ΣAᵏtᵏ/k!，满足 Φ(0)=I<\/td><\/tr><tr><td>对角化<\/td><td>P diag(e^(λᵢt)) P⁻¹<\/td><\/tr><tr><td>若尔当块<\/td><td>e^(λt)(I+Nt+…+N^(k−1)t^(k−1)/(k−1)!)<\/td><\/tr><tr><td>拉普拉斯<\/td><td>X=(sI−A)⁻¹(x₀+F)<\/td><\/tr><\/tbody><\/table>\n<h2>稳定性与相图<\/h2>\n<table><thead><tr><th>条件<\/th><th>类型<\/th><\/tr><\/thead><tbody><tr><td>tr&lt;0，det&gt;0，Δ&gt;0<\/td><td>稳定结点<\/td><\/tr><tr><td>tr&gt;0，det&gt;0，Δ&gt;0<\/td><td>不稳定结点<\/td><\/tr><tr><td>det&lt;0<\/td><td>鞍点<\/td><\/tr><tr><td>tr&lt;0，det&gt;0，Δ&lt;0<\/td><td>稳定焦点<\/td><\/tr><tr><td>tr&gt;0，det&gt;0，Δ&lt;0<\/td><td>不稳定焦点<\/td><\/tr><tr><td>tr=0，det&gt;0<\/td><td>中心<\/td><\/tr><tr><td>特征值实部全负<\/td><td>渐近稳定<\/td><\/tr><tr><td>有正实部<\/td><td>不稳定<\/td><\/tr><tr><td>实部为零<\/td><td>线性化失效<\/td><\/tr><\/tbody><\/table>\n<h2>数值方法<\/h2>\n<ul><li>\n欧拉：yₙ₊₁=yₙ+h f，整体 O(h)\n<\/li><li>\nRK4：k₁..k₄，yₙ₊₁=yₙ+h(k₁+2k₂+2k₃+k₄)/6，整体 O(h⁴)\n<\/ul>"}, "nav": [{"label": "学习路径", "href": "#/path"}, {"label": "章节", "children": [{"label": "第 1 章：绪论", "href": "#/chapter/ch01"}, {"label": "第 2 章：一阶方程的初等解法", "href": "#/chapter/ch02"}, {"label": "第 3 章：解的存在唯一性", "href": "#/chapter/ch03"}, {"label": "第 4 章：高阶线性微分方程", "href": "#/chapter/ch04"}, {"label": "第 5 章：线性微分方程组", "href": "#/chapter/ch05"}, {"label": "第 6 章：非线性与稳定性", "href": "#/chapter/ch06"}, {"label": "第 7 章：一阶线性偏微分方程", "href": "#/chapter/ch07"}, {"label": "第 8 章：边值问题", "href": "#/chapter/ch08"}]}, {"label": "概念", "children": [{"label": "通解与初值问题", "href": "#/concept/c01"}, {"label": "积分因子", "href": "#/concept/c02"}, {"label": "皮卡迭代与格朗沃尔引理", "href": "#/concept/c03"}, {"label": "朗斯基行列式", "href": "#/concept/c04"}, {"label": "基解矩阵与矩阵指数", "href": "#/concept/c05"}, {"label": "李雅普诺夫稳定性", "href": "#/concept/c06"}]}, {"label": "测验", "children": [{"label": "综合测验", "href": "#/quiz/all"}, {"label": "测验：第 1 章：绪论", "href": "#/quiz/ch01"}, {"label": "测验：第 2 章：一阶方程的初等解法", "href": "#/quiz/ch02"}, {"label": "测验：第 3 章：解的存在唯一性", "href": "#/quiz/ch03"}, {"label": "测验：第 4 章：高阶线性微分方程", "href": "#/quiz/ch04"}, {"label": "测验：第 5 章：线性微分方程组", "href": "#/quiz/ch05"}, {"label": "测验：第 6 章：非线性与稳定性", "href": "#/quiz/ch06"}, {"label": "测验：第 7 章：一阶线性偏微分方程", "href": "#/quiz/ch07"}, {"label": "测验：第 8 章：边值问题", "href": "#/quiz/ch08"}]}, {"label": "抽认卡", "href": "#/cards"}, {"label": "术语表", "href": "#/glossary"}, {"label": "模式库", "href": "#/patterns"}, {"label": "速查表", "href": "#/cheatsheet"}], "quizCoverag 8", "chapterId": "ch04", "front": "矩阵指数三条算法？", "back": "特征向量、若尔当、拉普拉斯。", "tags": ["方法"]}, {"id": "f09", "chapterId": "ch04", "front": "非齐次常向量特解？", "back": "−A⁻¹b。", "tags": ["公式"]}, {"id": "f10", "chapterId": "ch05", "front": "稳定性五步？", "back": "平衡点、J、特征值、判符号、临界补 V。", "tags": ["流程"]}, {"id": "f11", "chapterId": "ch05", "front": "李雅普诺夫方程？", "back": "AᵀP+PA=−Q。", "tags": ["公式"]}, {"id": "f12", "chapterId": "ch06", "front": "齐次 PDE 通解？", "back": "u=F(Φ)。", "tags": ["公式"]}, {"id": "f13", "chapterId": "ch06", "front": "边值可解判据？", "back": "弗雷德霍姆二择一。", "tags": ["定理"]}, {"id": "f14", "chapterId": "ch07", "front": "证明四模板？", "back": "存在唯一、稳定、解性质、边值。", "tags": ["方法"]}, {"id": "f15", "chapterId": "ch08", "front": "软件的作用？", "back": "验证与画图，不替代证明。", "tags": ["理解"]}], "companion": "zhusiming-guide学习伴侣.html"}, "rendered": {"ch01": "<h1>第 1 章 一阶方程：要点与解题指导<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：6 小时 | <strong>前置<\/strong>：第 1 章教材内容\n<\/li><li>\n<strong>对应原书<\/strong>：第一章（内容提要 / 学习辅导）\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n在一分钟内判断一道一阶方程该走哪条解法路线；\n<\/li><li>\n熟练使用&quot;凑全微分&quot;处理非标准形式的恰当方程；\n<\/li><li>\n避开分离变量丢解、积分因子漏乘两个高频错误；\n<\/li><li>\n把应用题的建模步骤固定成四步。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>朱思铭这一章的价值不在知识点，而在<strong>判断顺序<\/strong>：先看是否可分离，再看是否恰当，最后才是换元。顺序错了，题就解不出来。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>1.1 判断顺序（这是本章最该背的东西）<\/h3>\n<ol><li>\n能不能写成 y′=f(x)g(y)？能，分离变量。\n<\/li><li>\n写成 P dx+Q dy=0 后 P_y=Q_x？能，恰当。\n<\/li><li>\n不恰当，但 (P_y−Q_x)/Q 只含 x 或 (N_x−M_y)/M 只含 y？能，求积分因子。\n<\/li><li>\n形如 φ(y/x)、f(ax+by+c)？换元。\n<\/li><li>\n形如 y′+P(x)y=Q(x)yⁿ？伯努利，令 z=y^(1−n)。\n<\/ol>\n<p><strong>为什么顺序重要<\/strong>：同一个方程可能有多种处理方式，但只有一条能算到底。比如 (x+y)dx+x dy=0 既是恰当方程，也可当线性方程处理，前者更快。<\/p>\n<h3>1.2 两个高频错误<\/h3>\n<p><strong>丢解<\/strong>：分离变量时除以 g(y)，若 g(y₀)=0，则 y≡y₀ 也是解，必须单独写。<\/p>\n<p><strong>漏乘<\/strong>：找到 μ 后要把整条方程乘 μ，包括右端；常见错误是只乘了 P dx 忘了 Q dy。<\/p>\n<h3>1.3 建模四步<\/h3>\n<ol><li>\n设未知函数（明确它代表什么）。\n<\/li><li>\n写出变化率与现存量、流入流出量的关系。\n<\/li><li>\n定初值（注意单位）。\n<\/li><li>\n解完回代检验量纲与极限行为（t→∞ 是否符合物理直觉）。\n<\/ol>\n<p><strong>第 4 步是朱思铭反复强调的<\/strong>：很多学生解完就走，答案量纲不对也发现不了。<\/p>\n<h3>1.4 典型例题（Malthus 与 Logistic 对比）<\/h3>\n<p>Malthus：N′=rN，解 N=N₀e^(rt)，指数增长，无上界。 Logistic：N′=rN(1−N/K)，解 N=K/(1+(K/N₀−1)e^(−rt))，趋于 K。<\/p>\n<p><strong>比较的意义<\/strong>：同一个建模思路，加一个&quot;拥挤项&quot;就改变了长期行为。这是数学生物学的入门对比。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[一阶方程] --&gt; B{可分离}\n    B --&gt;|是| C[分离变量]\n    B --&gt;|否| D{P_y=Q_x}\n    D --&gt;|是| E[恰当]\n    D --&gt;|否| F{商只含单元}\n    F --&gt;|是| G[积分因子]\n    F --&gt;|否| H[换元/伯努利]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：按箭头顺序走，不要跳步。每一步都是&quot;能算到底&quot;的判据，不是&quot;看起来像&quot;。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：解题像选交通工具——先看有没有直达车（分离变量），没有再考虑换乘（换元）。绕远路也能到，但考试时间不够。<\/p>\n<p><strong>实例<\/strong>：解 y′=y/x + x。这是线性方程 y′−(1/x)y=x。 P=−1/x，∫P dx=−ln|x|，μ=1/|x|。取 μ=1/x（x&gt;0）： (xy)′=x·x=x²，xy=x³/3+C，y=x²/3+C/x。 检验：y′=2x/3−C/x²，而 y/x+x=x/3+C/x²+x。两者相等？2x/3−C/x² 与 x/3+C/x²+x 不等。 重算：(1/x)y′−y/x²=1，即 (y/x)′=1，y/x=x+C，y=x²+Cx。 检验：y′=2x+C，y/x+x=x+C+x=2x+C。正确。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为&quot;看起来像线性就一定线性&quot;<\/strong>——要先化成标准形 y′+P(x)y=Q(x)。\n<\/li><li>\n<strong>别以为&quot;积分因子只乘一边&quot;<\/strong>——整条方程都要乘。\n<\/li><li>\n<strong>别以为&quot;分离变量除掉的因子无所谓&quot;<\/strong>——漏解是考试扣分点。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\ny′=y/x+x 的正确解法？\n<p>（答案：化为 (y/x)′=1，得 y=x²+Cx。解析：看出左边是全微分。）<\/p>\n<\/ol>\n<ol><li>\n伯努利方程 y′+Py=Qyⁿ 的换元？\n<p>（答案：z=y^(1−n)。解析：化为线性方程。）<\/p>\n<\/ol>\n<ol><li>\n分离变量时 g(y₀)=0 意味着什么？\n<p>（答案：y≡y₀ 也是解，必须单独列出。解析：除法丢解。）<\/p>\n<\/ol>\n<ol><li>\n应用题解完为什么回代检验？\n<p>（答案：检查量纲与长期行为是否符合物理。解析：建模可能出错。）<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n判断顺序：分离 → 恰当 → 因子 → 换元。\n<\/li><li>\n两个坑：丢解、漏乘。\n<\/li><li>\n建模四步，最后一步是回代检验。\n<\/ul>", "ch02": "<h1>第 2 章 存在唯一性与奇解：解题指导<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：6 小时 | <strong>前置<\/strong>：第 1 章、教材第三章\n<\/li><li>\n<strong>对应原书<\/strong>：第二章（学习辅导 / 补充提高）\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n在具体方程上正确验证李普希茨条件，并给出一个可用的 L；\n<\/li><li>\n判断某点是否唯一，并构造非唯一解族；\n<\/li><li>\n用皮卡迭代写出前三项近似；\n<\/li><li>\n说明奇解与唯一性失效的对应关系。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>辅导书这一章的训练目标很明确：<strong>把&quot;验证条件&quot;练成肌肉记忆<\/strong>。考试里出现的不是抽象定理，而是&quot;这个方程在 (0,0) 处唯一吗&quot;。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>2.1 验证李普希茨的三种手法<\/h3>\n<ol><li>\n<strong>偏导有界<\/strong>：|∂f/∂y|≤L 在矩形上，直接取 L 为上界。这是最常用的。\n<\/li><li>\n<strong>中值定理<\/strong>：|f(x,y₁)−f(x,y₂)|=|f_y(x,ξ)||y₁−y₂|。\n<\/li><li>\n<strong>直接估计<\/strong>：如 f=y² 在 |y|≤b 上，|y₁²−y₂²|≤2b|y₁−y₂|，L=2b。\n<\/ol>\n<p><strong>注意第三种<\/strong>：李普希茨是局部的，只在给定矩形内成立，不要写成全局。<\/p>\n<h3>2.2 判断非唯一<\/h3>\n<p>典型手法：找 f 使 |f(x,y₁)−f(x,y₂)| 与 |y₁−y₂| 的比值在 y→y₀ 时无界。例如 f=√|y| 在 y=0 附近：<\/p>\n<div class=\"eq\">|√y₁−√y₂| = |y₁−y₂|/(√y₁+√y₂) → 发散<\/div>\n<p>于是可以用&quot;延迟出发&quot;构造无穷多解：y≡0 与 y=(x−c)²/4（x≥c）。<\/p>\n<h3>2.3 皮卡迭代的实操<\/h3>\n<p>以 y′=x+y，y(0)=0 为例： φ₀=0 φ₁=x²/2 φ₂=x²/2+x³/6 φ₃=x²/2+x³/6+x⁴/24 规律已现：φₙ=Σ[k=2→n+1] xᵏ/k!，极限 eˣ−1−x。<\/p>\n<p><strong>考试常见要求<\/strong>：写出前两项并估计误差。误差估计用 |φₙ−φ|≤M Lⁿ hⁿ⁺¹/(n+1)!。<\/p>\n<h3>2.4 奇解的检验流程<\/h3>\n<ol><li>\n求通解。\n<\/li><li>\n求 C-判别式。\n<\/li><li>\n回代验证是否为解。\n<\/li><li>\n验证是否与族中曲线相切。\n<\/li><li>\n确认该点李普希茨失效。\n<\/ol>\n<p>五步走完才敢下结论。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[给定 f] --&gt; B{偏导是否有界}\n    B --&gt;|是| C[李普希茨成立 唯一]\n    B --&gt;|否| D{比值是否发散}\n    D --&gt;|是| E[可能非唯一]\n    E --&gt; F[构造延迟解族]\n    D --&gt;|否| G[换方法估计]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：这张图是&quot;判唯一&quot;的判断树。注意最后一步不是&quot;一定非唯一&quot;，而是&quot;可能&quot;，还要实际构造。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：李普希茨条件像&quot;坡度限制&quot;。山坡再陡，只要坡度有上限，你走的路就是唯一的；如果某处坡度无限陡，就可能有多条路。<\/p>\n<p><strong>实例<\/strong>：f(x,y)=y^(2/3)，y(0)=0。|y^(2/3)| 在 0 附近比值发散（因为指数 &lt;1），故非唯一。解族：y=0 与 y=((x−c)/3)³（x≥c）。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为&quot;连续就唯一&quot;<\/strong>——实际上连续只保证存在。\n<\/li><li>\n<strong>别以为&quot;李普希茨必须全局&quot;<\/strong>——实际上局部够用。\n<\/li><li>\n<strong>别以为&quot;判别式算出曲线就是奇解&quot;<\/strong>——必须回代。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\nf(x,y)=y² 在 |y|≤3 上的李普希茨常数可取多少？\n<p>（答案：6。解析：|y₁²−y₂²|≤2·3|y₁−y₂|。）<\/p>\n<\/ol>\n<ol><li>\ny′=y^(2/3)，y(0)=0 唯一吗？\n<p>（答案：不唯一。解析：指数小于 1，李普希茨失效。）<\/p>\n<\/ol>\n<ol><li>\n皮卡迭代第二项怎么算？\n<p>（答案：φ₂=y₀+∫f(t,φ₁)dt。解析：逐次代入。）<\/p>\n<\/ol>\n<ol><li>\n奇解检验的最后一步是什么？\n<p>（答案：确认该点李普希茨失效。解析：否则唯一性禁止奇解。）<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n李普希茨三手法：偏导、中值、直接估。\n<\/li><li>\n非唯一靠&quot;比值发散 + 构造&quot;。\n<\/li><li>\n奇解五步检验。\n<\/ul>", "ch03": "<h1>第 3 章 高阶线性方程：解法体系<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：8 小时 | <strong>前置<\/strong>：第 2 章、教材第四章\n<\/li><li>\n<strong>对应原书<\/strong>：第三章（学习辅导 / 例题选讲）\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n按&quot;齐次 → 非齐次&quot;的顺序组织任何一道线性方程题；\n<\/li><li>\n用特征根法、待定系数法、常数变易法三条路径解常系数方程；\n<\/li><li>\n用降阶法处理已知特解的情形；\n<\/li><li>\n判断共振时特解该乘几次 t。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>高阶线性方程的解题流程是固定的：<strong>先解齐次拿基础解系，再找非齐次的一个特解<\/strong>。所有技巧都服务于这两步。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>3.1 齐次：特征根<\/h3>\n<p>特征方程 → 根 → 基础解系。三种情形（单实根、共轭复根、重根）已在教材讲过，这里只强调<strong>重根的写法<\/strong>：<\/p>\n<p>λ 是 k 重根 ⇒ e^(λx), xe^(λx), …, x^(k−1)e^(λx)。<\/p>\n<h3>3.2 非齐次：待定系数<\/h3>\n<p>右端 f(x) 为 e^(αx)Pₙ(x) 型，设特解 y*=e^(αx)Qₙ(x)x^k，其中 k 是 α 作为特征根的重数（不是根则 k=0）。<\/p>\n<p><strong>共振规则<\/strong>：α 是几重根，就乘几次 x。这一步错，整题错。<\/p>\n<p>右端含 sin/cos 时，把它看成 e^(iωx) 的实部或虚部，转成复指数处理。<\/p>\n<h3>3.3 常数变易<\/h3>\n<p>右端不是上述类型时用：<\/p>\n<div class=\"eq\">y* = Σ yᵢ(x)∫[Wᵢ/W]f dx<\/div>\n<p>W 是朗斯基行列式，Wᵢ 是把第 i 列换成 (0,…,0,1) 的行列式。<\/p>\n<h3>3.4 降阶<\/h3>\n<p>已知一个特解 y₁，令 y=u y₁：<\/p>\n<div class=\"eq\">u″ + (2y₁′/y₁ + p)u′ = f/y₁<\/div>\n<p>这是关于 u′ 的一阶线性方程。<\/p>\n<h3>3.5 欧拉方程<\/h3>\n<p>xⁿy⁽ⁿ⁾+… 型，令 x=eᵗ 化为常系数。注意 t=ln x 只在 x&gt;0 时用。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[线性方程] --&gt; B[齐次 特征根]\n    B --&gt; C[基础解系]\n    A --&gt; D[非齐次]\n    D --&gt; E{右端类型}\n    E --&gt;|指数多项式| F[待定系数 注意共振]\n    E --&gt;|其他| G[常数变易]\n    A --&gt; H[已知特解]\n    H --&gt; I[降阶]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：左边是主干，右边两个分支是&quot;非齐次怎么找特解&quot;。共振规则藏在 F 那一格里。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：齐次解像&quot;自由振动&quot;，非齐次特解像&quot;被迫振动&quot;。当外力频率与固有频率相同（共振），振幅会随时间增长——这就是为什么要乘 x。<\/p>\n<p><strong>实例<\/strong>：y″−3y′+2y=eˣ。 特征根 1、2。α=1 是一重根，故设 y<em>=Axeˣ。 代入：y<\/em>′=Aeˣ(x+1)，y<em>″=Aeˣ(x+2)。 (x+2)−3(x+1)+2x = −1，故 A=−1，y<\/em>=−xeˣ。 通解 y=C₁eˣ+C₂e^(2x)−xeˣ。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为&quot;共振就是乘一次 x&quot;<\/strong>——实际上要看重数。\n<\/li><li>\n<strong>别以为&quot;待定系数对任何右端都行&quot;<\/strong>——只对指数多项式型有效。\n<\/li><li>\n<strong>别以为&quot;降阶不用已知特解&quot;<\/strong>——它是降阶的前提。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n右端 e^(2x)，2 是二重特征根，特解该乘几次 x？\n<p>（答案：两次。解析：k 等于重数。）<\/p>\n<\/ol>\n<ol><li>\n已知 y₁=x 是某方程的特解，如何降阶？\n<p>（答案：令 y=ux，化为 u′ 的一阶方程。解析：刘维尔-达朗贝尔降阶。）<\/p>\n<\/ol>\n<ol><li>\n欧拉方程的标准换元？\n<p>（答案：x=eᵗ。解析：化为常系数。）<\/p>\n<\/ol>\n<ol><li>\n常数变易公式里的 W 是什么？\n<p>（答案：朗斯基行列式。解析：基础解系的行列式。）<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n先齐次后非齐次。\n<\/li><li>\n共振乘 x 的次数 = 重数。\n<\/li><li>\n降阶、欧拉都是化归手段。\n<\/ul>", "ch04": "<h1>第 4 章 线性微分方程组：解法体系<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：8 小时 | <strong>前置<\/strong>：第 3 章\n<\/li><li>\n<strong>对应原书<\/strong>：第四章（学习辅导 / 例题选讲）\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n写出基解矩阵并验证它是解；\n<\/li><li>\n用三种方法求常系数方程组的解（特征向量法、矩阵指数、拉普拉斯变换）；\n<\/li><li>\n处理重特征值与复特征值两种麻烦情形；\n<\/li><li>\n用常数变易解非齐次方程组。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>方程组的解题核心是&quot;求基解矩阵&quot;。常系数时它就是 e^(At)，三种算法任选；变系数时只能靠具体构造。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>4.1 特征向量法<\/h3>\n<p>A 有 n 个线性无关特征向量 ⇒ Φ=[v₁e^(λ₁t),…]。这是最省事的情形。<\/p>\n<h3>4.2 复特征值<\/h3>\n<p>λ=α+iβ，特征向量 v=p+iq。实化解：<\/p>\n<div class=\"eq\">e^(αt)(p cos βt − q sin βt)，e^(αt)(p sin βt + q cos βt)<\/div>\n<p><strong>常见错误<\/strong>：直接把复解当答案，忘记取实部。<\/p>\n<h3>4.3 重特征值<\/h3>\n<p>若几何重数不足，需要广义特征向量。以二重根 λ 为例，若只有一个特征向量 v，则找 w 满足 (A−λI)w=v，解为<\/p>\n<div class=\"eq\">e^(λt)(v + wt)<\/div>\n<h3>4.4 矩阵指数与拉普拉斯<\/h3>\n<p>e^(At) 可用对角化或若尔当形算；也可用拉普拉斯变换：<\/p>\n<div class=\"eq\">e^(At) = L⁻¹[(sI−A)⁻¹]<\/div>\n<p>这条在考试里很好用，因为求逆矩阵是机械操作。<\/p>\n<h3>4.5 非齐次<\/h3>\n<p>x=Φ(t)[C+∫Φ⁻¹(s)b(s)ds]。若 b 是常向量且 A 可逆，特解就是 −A⁻¹b。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[方程组] --&gt; B{常系数}\n    B --&gt;|是| C[特征向量法]\n    B --&gt;|是| D[矩阵指数]\n    B --&gt;|是| E[拉普拉斯]\n    B --&gt;|否| F[构造基解矩阵]\n    C --&gt; G[非齐次 常数变易]\n    D --&gt; G\n    E --&gt; G<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：三条常系数路线等价，选最顺手的；变系数只能老老实实构造。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：基解矩阵像&quot;三根独立弹簧的振动&quot;——每个特征方向各振各的，合成任意初值。<\/p>\n<p><strong>实例<\/strong>：A=[[1,1],[4,1]]。特征值 3、−1，特征向量 (1,2)、(−1,2)。 Φ=[[e^(3t),−e^(−t)],[2e^(3t),2e^(−t)]]。 验证 det Φ=2e^(2t)+2e^(2t)=4e^(2t)≠0，且 tr A=2，刘维尔给 e^(2t)，相差常数 4，一致。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为&quot;复特征值直接写复解就行&quot;<\/strong>——实问题必须取实部。\n<\/li><li>\n<strong>别以为&quot;重根只有一个解&quot;<\/strong>——还有广义特征向量给的第二个。\n<\/li><li>\n<strong>别以为&quot;拉普拉斯只对初值问题有效&quot;<\/strong>——也可处理非齐次，但要注意初值项。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n复特征值 α±iβ 的实化解有几个？\n<p>（答案：两个。解析：实部虚部各一个。）<\/p>\n<\/ol>\n<ol><li>\n二重根 λ，只有一个特征向量时第二个解是什么？\n<p>（答案：e^(λt)(v+wt)，w 为广义特征向量。解析：(A−λI)w=v。）<\/p>\n<\/ol>\n<ol><li>\ne^(At) 的拉普拉斯表示？\n<p>（答案：L⁻¹[(sI−A)⁻¹]。解析：矩阵版本的变换。）<\/p>\n<\/ol>\n<ol><li>\n非齐次常向量 b 的特解？\n<p>（答案：−A⁻¹b（A 可逆时）。解析：设常特解代入。）<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n基解矩阵是核心。\n<\/li><li>\n复根取实部，重根找广义向量。\n<\/li><li>\n三条常系数路线等价。\n<\/ul>", "ch05": "<h1>第 5 章 非线性方程与稳定性：解题指导<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：7 小时 | <strong>前置<\/strong>：第 4 章\n<\/li><li>\n<strong>对应原书<\/strong>：第五章（学习辅导 / 补充提高）\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n按固定流程做稳定性分析（找平衡点 → 线性化 → 判谱 → 必要时找 V）；\n<\/li><li>\n用 V 函数完成一道完整的稳定性证明；\n<\/li><li>\n判断极限环是否存在（平面情形）；\n<\/li><li>\n说明&quot;线性化失效&quot;时该怎么继续。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>稳定性题的流程是标准化的：<strong>平衡点 → 雅可比 → 特征值 → 分类 → 结论<\/strong>。非双曲时才需要额外的 V 函数，而 V 的构造有套路可循。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>5.1 标准流程<\/h3>\n<ol><li>\n解 f(x)=0 找平衡点。\n<\/li><li>\n在每个平衡点算雅可比 J。\n<\/li><li>\n算 J 的特征值。\n<\/li><li>\n实部全负 → 渐近稳定；有正 → 不稳定；有零 → 临界。\n<\/li><li>\n临界时构造 V 或找守恒量。\n<\/ol>\n<p><strong>第 5 步是分水岭<\/strong>：前面的步骤纯代数，第 5 步靠经验。<\/p>\n<h3>5.2 V 函数的构造套路<\/h3>\n<ul><li>\n<strong>二次型<\/strong>：V=ax²+bxy+cy²，用待定系数让 V̇ 负定。\n<\/li><li>\n<strong>能量型<\/strong>：机械系统取动能+势能。\n<\/li><li>\n<strong>平方和<\/strong>：V=Σ(xᵢ−xᵢ*)²，适合对称系统。\n<\/ul>\n<p>以线性系统 ẋ=Ax 为例，取 V=xᵀPx，则 V̇=xᵀ(AᵀP+PA)x。要求负定 ⇔ 解李雅普诺夫方程 AᵀP+PA=−Q（Q 正定）。这是一套可计算的流程，不是碰运气。<\/p>\n<h3>5.3 极限环<\/h3>\n<p>平面系统：构造环形捕获域（外圈向内、内圈向外），域内无平衡点 ⇒ 存在闭轨。<\/p>\n<p>稳定性的判据用庞加莱映射导数，或直接用&quot;轨线是趋近还是远离&quot;的几何判断。<\/p>\n<h3>5.4 常见考试题型<\/h3>\n<ul><li>\n给一个含参数系统，问参数取何值时稳定。答：算特征值，让实部为负，解不等式。\n<\/li><li>\n给一个 V，问能否判稳。答：验证正定性与 V̇ 的符号。\n<\/li><li>\n判断某系统有无闭轨。答：捕获域。\n<\/ul>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[f x = 0] --&gt; B[平衡点]\n    B --&gt; C[雅可比 J]\n    C --&gt; D[特征值]\n    D --&gt; E{实部}\n    E --&gt;|全负| F[渐近稳定]\n    E --&gt;|有正| G[不稳定]\n    E --&gt;|有零| H[临界]\n    H --&gt; I[构造 V 或守恒量]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：前四步是机械的，第五步才开始动脑。考试失分多在第 1 步（漏平衡点）。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：找平衡点像找&quot;地势平坦处&quot;；线性化像&quot;在平坦处测坡度&quot;；V 函数像&quot;找一个高度计&quot;。<\/p>\n<p><strong>实例<\/strong>：ẋ=−x+x³。平衡点 0、±1。 J=−1+3x²。在 0 处 J=−1（稳定）；在 ±1 处 J=2（不稳定）。 结论：0 渐近稳定，±1 不稳定。这是一维的双稳态结构。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为&quot;平衡点只有一个&quot;<\/strong>——实际上可能多个，必须全找。\n<\/li><li>\n<strong>别以为&quot;V 只能靠猜&quot;<\/strong>——线性系统有李雅普诺夫方程可解。\n<\/li><li>\n<strong>别以为&quot;临界就等于不稳定&quot;<\/strong>——可能是稳定非渐近。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\nẋ=−x+x³ 的平衡点与稳定性？\n<p>（答案：0 稳定，±1 不稳定。解析：J=−1+3x²。）<\/p>\n<\/ol>\n<ol><li>\n线性系统 V=xᵀPx 的导数是什么？\n<p>（答案：xᵀ(AᵀP+PA)x。解析：直接求导。）<\/p>\n<\/ol>\n<ol><li>\n李雅普诺夫方程的形式？\n<p>（答案：AᵀP+PA=−Q。解析：Q 正定则 P 正定，可判稳。）<\/p>\n<\/ol>\n<ol><li>\n极限环存在需要什么区域？\n<p>（答案：环形捕获域，且内部无平衡点。解析：庞加莱-本迪克松。）<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n五步流程，第一步别漏。\n<\/li><li>\nV 有套路：二次型、能量、平方和。\n<\/li><li>\n临界不等于不稳定。\n<\/ul>", "ch06": "<h1>第 6 章 一阶偏微分方程与边值问题：解题指导<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：6 小时 | <strong>前置<\/strong>：第 2、4 章\n<\/li><li>\n<strong>对应原书<\/strong>：第六章、第七章（学习辅导）\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n用首次积分写出齐次 PDE 的通解；\n<\/li><li>\n用特征线法解拟线性方程并验证非特征条件；\n<\/li><li>\n判断边值问题是否有唯一解；\n<\/li><li>\n用格林函数表示非齐次边值问题的解。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>这两类问题共享一个思路：<strong>先找&quot;结构&quot;（首次积分/齐次解），再用结构表示一般解<\/strong>。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>6.1 齐次 PDE<\/h3>\n<p>a u_x+b u_y=0。特征线 dy/dx=b/a，首次积分 Φ。通解 u=F(Φ)。<\/p>\n<p><strong>验证方法<\/strong>：把 u=F(Φ) 代回，用链式法则 u_x=F′Φ_x，u_y=F′Φ_y，于是 aF′Φ_x+bF′Φ_y=F′(aΦ_x+bΦ_y)=0（因为 Φ 是首次积分）。<\/p>\n<h3>6.2 拟线性与柯西问题<\/h3>\n<p>特征方程组 dx/ds=a，dy/ds=b，du/ds=c。以初始曲线参数 τ 为另一参数，解出 (x(s,τ), y(s,τ), u(s,τ))，消去 s、τ 得隐式解。<\/p>\n<p>非特征条件 a y_τ−b x_τ≠0 必须验证，否则解不唯一。<\/p>\n<h3>6.3 边值问题<\/h3>\n<p>先解齐次 Ly=0：<\/p>\n<ul><li>\n只有零解 ⇒ 非齐次对任意 f 唯一可解（用格林函数表示）。\n<\/li><li>\n有非零解 ⇒ 非齐次需满足正交条件，否则无解。\n<\/ul>\n<h3>6.4 格林函数<\/h3>\n<p>对 y″=f，y(0)=y(1)=0，格林函数<\/p>\n<div class=\"eq\">G(x,s)=−s(1−x)（x>s），−x(1−s)（x<s）<\/div>\n<p>解 y=∫G(x,s)f(s)ds。格林函数的物理意义是&quot;单位点源引起的响应&quot;。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[PDE] --&gt; B[特征线]\n    B --&gt; C[首次积分]\n    C --&gt; D[通解 F of Phi]\n    A --&gt; E[柯西问题]\n    E --&gt; F{非特征条件}\n    F --&gt;|满足| G[唯一解]\n    F --&gt;|不满足| H[不唯一或无解]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：左侧是&quot;通解&quot;，右侧是&quot;定解&quot;。两者之间靠参 数化连接。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：格林函数像&quot;在一个点上敲一下，整根弦怎么响应&quot;。任意外力等于无数个点源叠加，所以解就是积分。<\/p>\n<p><strong>实例<\/strong>：u_x+u_y=u，u(x,0)=x。 特征方程：dx/ds=1，dy/ds=1，du/ds=u。 解：x=s+x₀，y=s，u=u₀e^s。初始 y=0 ⇒ s=0，x₀=τ，u₀=τ。 由 y=s 得 s=y，x₀=x−y。故 u=(x−y)e^y。 验证：u_x=e^y，u_y=−e^y+(x−y)e^y，和=(x−y)e^y=u。边界 u(x,0)=x。正确。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为&quot;通解就是所有解&quot;<\/strong>——可能还有奇解。\n<\/li><li>\n<strong>别以为&quot;柯西问题随便给初值都能解&quot;<\/strong>——非特征条件是硬要求。\n<\/li><li>\n<strong>别以为&quot;边值问题一定有解&quot;<\/strong>——见齐次有非零解的情形。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\nu_x+2u_y=0 的通解？\n<p>（答案：u=F(x−y/2)。解析：特征线 x−y/2=const。）<\/p>\n<\/ol>\n<ol><li>\n格林函数的作用？\n<p>（答案：表示单位点源的响应，叠加得一般解。解析：线性叠加原理。）<\/p>\n<\/ol>\n<ol><li>\n非特征条件的式子？\n<p>（答案：a y_τ−b x_τ≠0。解析：初始曲线不能与特征线相切。）<\/p>\n<\/ol>\n<ol><li>\n边值问题何时无解？\n<p>（答案：齐次有非零解且非齐次右端不满足正交条件。解析：弗雷德霍姆二择一。）<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n齐次 PDE：u=F(Φ)。\n<\/li><li>\n拟线性：特征线织曲面 + 非特征条件。\n<\/li><li>\n边值：先齐次，再二择一。\n<\/ul>", "ch07": "<h1>第 7 章 期中期末与考研试题选讲<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：8 小时 | <strong>前置<\/strong>：第 1–6 章\n<\/li><li>\n<strong>对应原书<\/strong>：第九章（期中、期末与考研试题）\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n按题型（计算、证明、应用）分配考场时间；\n<\/li><li>\n识别考研真题中&quot;换了个包装&quot;的经典模型；\n<\/li><li>\n用标准套路完成证明题（存在唯一、稳定性、边值）；\n<\/li><li>\n避开&quot;算对一半、写错结论&quot;的高频失分点。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>考试不考&quot;你学过多少&quot;，考&quot;你能在多短时间内认出这是哪类题&quot;。<strong>认题比算题更值钱<\/strong>。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>7.1 题型分布（据历年试题归纳）<\/h3>\n<table><thead><tr><th>题型<\/th><th>占比<\/th><th>常考内容<\/th><\/tr><\/thead><tbody><tr><td>计算<\/td><td>50%<\/td><td>一阶方程、常系数线性、方程组<\/td><\/tr><tr><td>证明<\/td><td>30%<\/td><td>存在唯一、稳定性、解的性质<\/td><\/tr><tr><td>应用<\/td><td>20%<\/td><td>建模、几何解释、参数讨论<\/td><\/tr><\/tbody><\/table>\n<h3>7.2 计算题的&quot;三分钟识别法&quot;<\/h3>\n<ol><li>\n看阶数：一阶走第一章路线；二阶看是否常系数。\n<\/li><li>\n看右端：是不是 e^(αx)Pₙ 型？是则待定系数。\n<\/li><li>\n看是否有参数：有参数多半要讨论取值范围（稳定域）。\n<\/ol>\n<h3>7.3 证明题的四个模板<\/h3>\n<ul><li>\n<strong>存在唯一<\/strong>：验证李普希茨 → 引用定理 → 写出 h。\n<\/li><li>\n<strong>稳定性<\/strong>：算雅可比 → 特征值 → 结论；非双曲补 V。\n<\/li><li>\n<strong>解的性质<\/strong>：作差 → 格朗沃尔 → 得界。\n<\/li><li>\n<strong>边值可解性<\/strong>：齐次 → 二择一。\n<\/ul>\n<h3>7.4 高频失分点<\/h3>\n<ol><li>\n通解漏掉奇解或常数解。\n<\/li><li>\n待定系数忘了共振的 x 因子。\n<\/li><li>\n稳定性题只算了一个平衡点。\n<\/li><li>\n证明题引用了定理却没验证条件。\n<\/li><li>\n应用题解完不检验量纲。\n<\/ol>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[拿到题] --&gt; B{计算还是证明}\n    B --&gt;|计算| C[三分钟识别]\n    C --&gt; D[套标准流程]\n    B --&gt;|证明| E[选模板]\n    E --&gt; F[验证条件]\n    F --&gt; G[写结论]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：分叉点在&quot;计算/证明&quot;。证明题的失分几乎都在&quot;验证条件&quot;这一步。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：考场像&quot;急诊分诊&quot;。先判断这是哪一科（题型），再叫对应科室（模板），不要一上来就埋头算。<\/p>\n<p><strong>实例<\/strong>（考研改编）：设 f 连续且满足 |f(x,y)|≤M，证明 y′=f(x,y)，y(0)=0 的解在 |x|≤b/M 上存在。 答：这题不需要李普希茨（因为只证存在）。用皮亚诺定理：f 连续，矩形内 |f|≤M，故 h=min(a,b/M)。结论成立。<\/p>\n<p><strong>注意<\/strong>：如果题目问&quot;唯一&quot;，就必须补验李普希茨。这是最常见的&quot;条件没验全&quot;。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为&quot;证明题可以只写结论&quot;<\/strong>——必须写出条件验证。\n<\/li><li>\n<strong>别以为&quot;计算题越快越好&quot;<\/strong>——漏解比慢更亏。\n<\/li><li>\n<strong>别以为&quot;应用题不用检验&quot;<\/strong>——量纲和极限行为是送分点。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n证明&quot;存在唯一&quot;必须验证什么？\n<p>（答案：李普希茨条件，并给出 h。解析：缺条件不能引用定理。）<\/p>\n<\/ol>\n<ol><li>\n待定系数法最容易错在哪？\n<p>（答案：共振时忘记乘 x^k。解析：k 为重数。）<\/p>\n<\/ol>\n<ol><li>\n稳定性题漏平衡点会怎样？\n<p>（答案：结论不完整。解析：每个平衡点都要分析。）<\/p>\n<\/ol>\n<ol><li>\n应用题最后一步做什么？\n<p>（答案：回代检验量纲与长期行为。解析：建模可能出错。）<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n先认题，再算题。\n<\/li><li>\n证明四模板。\n<\/li><li>\n五个高频失分点。\n<\/ul>", "ch08": "<h1>第 8 章 数学软件与数值实验<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：4 小时 | <strong>前置<\/strong>：第 1–7 章\n<\/li><li>\n<strong>对应原书<\/strong>：第十章（数学软件）\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n用 SymPy/Mathematica 符号求解一阶与线性方程；\n<\/li><li>\n用 MATLAB/SCILAB 做数值积分并画相图；\n<\/li><li>\n说明符号解与数值解各自的边界；\n<\/li><li>\n用软件验证手算结果（这是最实用的用法）。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>软件不是用来&quot;代替手算&quot;的，而是用来<strong>验证手算和画图<\/strong>的。符号解告诉你公式对不对，数值解告诉你轨线长什么样。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>8.1 符号求解<\/h3>\n<p>SymPy：<\/p>\n<pre class=\"lang-python\"><code>from sympy import Function, dsolve, Eq, symbols\nx = symbols(&#x27;x&#x27;); y = Function(&#x27;y&#x27;)\ndsolve(Eq(y(x).diff(x), x + y(x)), y(x))<\/code><\/pre>\n<p>输出含 eˣ 与积分项，可与手算对照。<\/p>\n<p>Mathematica：DSolve[{y&#x27;[x]==x+y[x], y[0]==0}, y[x], x]。 Maple：dsolve({diff(y(x),x)=x+y(x), y(0)=0})。<\/p>\n<h3>8.2 数值求解<\/h3>\n<p>MATLAB：ode45(@(t,y) t+y, [0 5], 0)。 SCILAB：ode(0, t, y0, f)。<\/p>\n<p><strong>注意<\/strong>：数值解只给一个初值对应的一条轨线，不能代替相图分析。<\/p>\n<h3>8.3 画相图<\/h3>\n<p>用 quiver（MATLAB）或 matplotlib 的 streamplot 画向量场。这是理解定性理论最直观的方式。<\/p>\n<h3>8.4 验证流程<\/h3>\n<ol><li>\n手算得解。\n<\/li><li>\n软件符号求解，比对形式。\n<\/li><li>\n数值积分，比对数值。\n<\/li><li>\n画图，检查定性行为（是否闭合、是否收敛）。\n<\/ol>\n<p>四步走完，答案基本可靠。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n    A[手算] --&gt; B[符号求解比对]\n    B --&gt; C[数值积分比对]\n    C --&gt; D[画图检验定性]\n    D --&gt; E[结论]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：这是一条&quot;四重校验&quot;链。任何一环不符，就回头查手算。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：软件像&quot;计算器 + 望远镜&quot;。计算器验算，望远镜看全局形状。两者都不能代替你理解题目。<\/p>\n<p><strong>失效边界<\/strong>：符号求解在无初等解时会返回隐式或未求值形式；数值求解在刚性方程上会失真。<\/p>\n<p><strong>实例<\/strong>：y′=y²，y(0)=1 的手算解是 1/(1−t)，在 t=1 爆破。数值积分到 t=1 附近会出现溢出——这正好验证了&quot;最大区间有限&quot;的结论。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为&quot;软件给的解一定对&quot;<\/strong>——符号解可能漏分支。\n<\/li><li>\n<strong>别以为&quot;数值解能看出稳定性&quot;<\/strong>——单条轨线看不出全局。\n<\/li><li>\n<strong>别以为&quot;软件能替代证明&quot;<\/strong>——它只给计算结果。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\nSymPy 求解析解的函数？\n<p>（答案：dsolve。解析：符号求解入口。）<\/p>\n<\/ol>\n<ol><li>\n数值解能代替相图吗？\n<p>（答案：不能。解析：只给单条轨线。）<\/p>\n<\/ol>\n<ol><li>\n刚性方程数值积分为何失真？\n<p>（答案：显式方法需要极小步长，否则不稳定。解析：刚性导致稳定域限制。）<\/p>\n<\/ol>\n<ol><li>\n软件验证的四步？\n<p>（答案：手算、符号、数值、画图。解析：四重校验。）<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n符号解验公式，数值解验数值，画图验定性。\n<\/li><li>\n软件不能替代证明。\n<\/li><li>\n四重校验流程。\n<\/ul>", "c01": "<h1>积分因子的判别与求法<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 1 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>使 P dx+Q dy 变成全微分的乘子 μ；只有 μ 依赖单个变量时才有通用公式。<\/p>\n<h2>为什么重要<\/h2>\n<p>它是&quot;不恰当方程&quot;唯一的通用补救手段，也是判断顺序里最关键的一格。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[P dx+Q dy=0] --&gt; B{（P_y-Q_x）/Q 只含 x}\n    B --&gt;|是| C[mu = exp of integral]\n    B --&gt;|否| D{（Q_x-P_y）/P 只含 y}\n    D --&gt;|是| E[mu = exp of integral]\n    D --&gt;|否| F[试特殊组合 或放弃]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>μ 的方程本身是一阶 PDE，一般难解；两个商式判据是它退化成 ODE 的条件。<\/p>\n<p>求 μ 后必须整条方程乘上，包括右端。常见错误是只乘一边。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为任何方程都有单变量积分因子。\n<\/li><li>\n别以为求出 μ 就完事（还要积分求 u）。\n<\/li><li>\n别以为 μ 唯一（可乘任意常数，也可能有多种）。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 1 章<\/td><td>解题指导<\/td><td>判断顺序第三格<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：恰当方程\n<\/li><li>\n后续：首次积分\n<\/ul>", "c02": "<h1>共振与特解形式<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 3 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>当非齐次项的指数 α 恰好是特征根时，特解要额外乘 x^k（k 为重数）。<\/p>\n<h2>为什么重要<\/h2>\n<p>这是待定系数法唯一容易错的地方，也是&quot;物理共振&quot;的数学根源。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[右端 e^ax P_n] --&gt; B{alpha 是否特征根}\n    B --&gt;|否| C[k=0]\n    B --&gt;|是 m 重| D[k=m]\n    C --&gt; E[特解 e^ax Q_n]\n    D --&gt; E<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>道理在于：不乘 x 时，代入后低阶项相消，方程退化，解不出系数。乘 x^k 恰好补回丢失的阶。<\/p>\n<p>物理上，共振时外力与自由振动同频，能量持续注入，振幅线性（或多项式）增长。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为共振只乘一次 x。\n<\/li><li>\n别以为右端是 sin 就不用管共振（要转成复指数看）。\n<\/li><li>\n别以为 k 与方程阶数有关。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 3 章<\/td><td>待定系数<\/td><td>k = 重数<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：特征根\n<\/li><li>\n后续：受迫振动、参数共振\n<\/ul>", "c03": "<h1>李雅普诺夫方程<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：第 5 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>AᵀP+PA=−Q，给定正定 Q 解出 P；P 正定则系统 ẋ=Ax 渐近稳定。<\/p>\n<h2>为什么重要<\/h2>\n<p>它把&quot;构造 V 函数&quot;这件凭经验的事，变成了可计算的线性方程组。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n    A[给定 Q 正定] --&gt; B[解 A^T P + P A = -Q]\n    B --&gt; C{P 是否正定}\n    C --&gt;|是| D[渐近稳定]\n    C --&gt;|否| E[不稳定]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>这是二次型 V=xᵀPx 的直接推论：V̇=xᵀ(AᵀP+PA)x=−xᵀQx&lt;0。<\/p>\n<p>定理（李雅普诺夫）：A 的所有特征值实部为负 ⇔ 对任意正定 Q，方程有唯一正定解 P。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 P 可以随便取（必须解方程）。\n<\/li><li>\n别以为只对一维有效。\n<\/li><li>\n别以为 Q 必须为单位阵（任意正定都行）。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 5 章<\/td><td>V 的构造<\/td><td>可计算流程<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：二次型、正定性\n<\/li><li>\n后续：LQR、Lyapunov 稳定性理论\n<\/ul>", "__path__": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：一阶方程解题<\/strong><br>阅读：<a href=\"#/book/zhusiming-guide/chapter/ch01\">第 1 章：一阶方程解题指导<\/a><br>检查点：一分钟定路线<\/li><li class='path-step' id='path-02'><strong>步骤 02：存在唯一性<\/strong><br>阅读：<a href=\"#/book/zhusiming-guide/chapter/ch02\">第 2 章：存在唯一性与奇解<\/a><br>检查点：验证李普希茨<\/li><li class='path-step' id='path-03'><strong>步骤 03：高阶线性<\/strong><br>阅读：<a href=\"#/book/zhusiming-guide/chapter/ch03\">第 3 章：高阶线性方程<\/a><br>检查点：共振规则<\/li><li class='path-step' id='path-04'><strong>步骤 04：方程组<\/strong><br>阅读：<a href=\"#/book/zhusiming-guide/chapter/ch04\">第 4 章：线性微分方程组<\/a><br>检查点：算基解矩阵<\/li><li class='path-step' id='path-05'><strong>步骤 05：稳定性<\/strong><br>阅读：<a href=\"#/book/zhusiming-guide/chapter/ch05\">第 5 章：非线性与稳定性<\/a><br>检查点：五步流程<\/li><li class='path-step' id='path-06'><strong>步骤 06：PDE 与边值<\/strong><br>阅读：<a href=\"#/book/zhusiming-guide/chapter/ch06\">第 6 章：PDE 与边值问题<\/a><br>检查点：特征线法<\/li><li class='path-step' id='path-07'><strong>步骤 07：试题选讲<\/strong><br>阅读：<a href=\"#/book/zhusiming-guide/chapter/ch07\">第 7 章：期中期末与考研试题<\/a><br>检查点：认题<\/li><li class='path-step' id='path-08'><strong>步骤 08：数学软件<\/strong><br>阅读：<a href=\"#/book/zhusiming-guide/chapter/ch08\">第 8 章：数学软件<\/a><br>检查点：四重校验<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "__quiz_all__": "<h1>全部测验<\/h1><p>全书各章测验汇总：逐题作答，提交后即时反馈并显示解析。<\/p><h2>测验：第 1 章：一阶方程解题指导<\/h2><div class='quiz-item' data-qid='ch01-q01' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 判断一阶方程解法路线的第一格是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch01-q01' value='0'> 恰当<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='1'> 可分离<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='2'> 换元<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='3'> 隐式<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch01-q02' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 分离变量时 g(y₀)=0 意味着？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch01-q02' value='0'> 无解<\/label><label class='quiz-opt'><input type='radio' name='ch01-q02' value='1'> y≡y₀ 也是解<\/label><label class='quiz-opt'><input type='radio' name='ch01-q02' value='2'> 方程退化<\/label><label class='quiz-opt'><input type='radio' name='ch01-q02' value='3'> 需积分因子<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch01-q03' data-type='single'><p class='quiz-q'><b>Q3.<\/b> 找 μ 后最容易犯的错？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch01-q03' value='0'> 忘记积分<\/label><label class='quiz-opt'><input type='radio' name='ch01-q03' value='1'> 只乘一边<\/label><label class='quiz-opt'><input type='radio' name='ch01-q03' value='2'> 符号错<\/label><label class='quiz-opt'><input type='radio' name='ch01-q03' value='3'> 常数错<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检 ssary-ref>（第 1 章：一阶方程解题指导）<\/span><\/li><li data-term='建模四步'>建模四步 — 设未知量、写关系、定初值、检验 <span class=glossary-ref>（第 1 章：一阶方程解题指导）<\/span><\/li><li data-term='李普希茨条件'>李普希茨条件 — 差被常数乘距离控制 <span class=glossary-ref>（第 2 章：存在唯一性与奇解）<\/span><\/li><li data-term='皮卡迭代'>皮卡迭代 — 逐次逼近解 <span class=glossary-ref>（第 2 章：存在唯一性与奇解）<\/span><\/li><li data-term='奇解'>奇解 — 与通解族相切的额外解 <span class=glossary-ref>（第 2 章：存在唯一性与奇解）<\/span><\/li><li data-term='延迟解'>延迟解 — 在某个时刻才离开平衡的解 <span class=glossary-ref>（第 2 章：存在唯一性与奇解）<\/span><\/li><li data-term='特征方程'>特征方程 — 常系数方程的代数方程 <span class=glossary-ref>（第 3 章：高阶线性方程）<\/span><\/li><li data-term='待定系数法'>待定系数法 — 按右端形式猜特解 <span class=glossary-ref>（第 3 章：高阶线性方程）<\/span><\/li><li data-term='共振'>共振 — 右端频率等于固有频率 <span class=glossary-ref>（第 3 章：高阶线性方程）<\/span><\/li><li data-term='常数变易'>常数变易 — 用基础解系构造特解 <span class=glossary-ref>（第 3 章：高阶线性方程）<\/span><\/li><li data-term='朗斯基行列式'>朗斯基行列式 — 基础解系的行列式 <span class=glossary-ref>（第 3 章：高阶线性方程）<\/span><\/li><li data-term='欧拉方程'>欧拉方程 — 变系数但可化为常系数 <span class=glossary-ref>（第 3 章：高阶线性方程）<\/span><\/li><li data-term='基解矩阵'>基解矩阵 — 线性无关解组成的矩阵 <span class=glossary-ref>（第 4 章：线性微分方程组）<\/span><\/li><li data-term='广义特征向量'>广义特征向量 — 若尔当链上的向量 <span class=glossary-ref>（第 4 章：线性微分方程组）<\/span><\/li><li data-term='矩阵指数'>矩阵指数 — e^(At) <span class=glossary-ref>（第 4 章：线性微分方程组）<\/span><\/li><li data-term='拉普拉斯变换'>拉普拉斯变换 — 把微分方程变代数式 <span class=glossary-ref>（第 4 章：线性微分方程组）<\/span><\/li><li data-term='雅可比矩阵'>雅可比矩阵 — 右端对状态的偏导矩阵 <span class=glossary-ref>（第 5 章：非线性与稳定性）<\/span><\/li><li data-term='李雅普诺夫函数'>李雅普诺夫函数 — 判稳用的正定函数 <span class=glossary-ref>（第 5 章：非线性与稳定性）<\/span><\/li><li data-term='李雅普诺夫方程'>李雅普诺夫方程 — AᵀP+PA=−Q <span class=glossary-ref>（第 5 章：非线性与稳定性）<\/span><\/li><li data-term='极限环'>极限环 — 孤立的闭轨 <span class=glossary-ref>（第 5 章：非线性与稳定性）<\/span><\/li><li data-term='首次积分'>首次积分 — 沿轨线取常数 <span class=glossary-ref>（第 6 章：PDE 与边值问题）<\/span><\/li><li data-term='特征线'>特征线 — PDE 沿之降为 ODE 的曲线 <span class=glossary-ref>（第 6 章：PDE 与边值问题）<\/span><\/li><li data-term='非特征条件'>非特征条件 — 初值曲线横截特征方向 <span class=glossary-ref>（第 6 章：PDE 与边值问题）<\/span><\/li><li data-term='格林函数'>格林函数 — 单位点源的响应 <span class=glossary-ref>（第 6 章：PDE 与边值问题）<\/span><\/li><li data-term='二择一'>二择一 — 齐次零解 ⇔ 非齐次唯一可解 <span class=glossary-ref>（第 6 章：PDE 与边值问题）<\/span><\/li><li data-term='三分钟识别法'>三分钟识别法 — 按阶数/右端/参数快速判题型 <span class=glossary-ref>（第 7 章：期中期末与考研试题）<\/span><\/li><li data-term='四重校验'>四重校验 — 手算、符号、数值、画图 <span class=glossary-ref>（第 8 章：数学软件）<\/span><\/li><li data-term='刚性方程'>刚性方程 — 快慢尺度差极大的方程 <span class=glossary-ref>（第 8 章：数学软件）<\/span><\/li><\/ul>", "__patterns__": "<h1>模式与框架库<\/h1>\n<h2>框架：判断顺序（本章最值钱的东西）<\/h2>\n<ol><li>\n可分离？\n<\/li><li>\n恰当（P_y=Q_x）？\n<\/li><li>\n单变量积分因子？\n<\/li><li>\n换元（齐次、平移、伯努利）？\n<\/li><li>\n隐式/参数法？\n<\/ol>\n<p>走完再动手，别边算边试。<\/p>\n<h2>框架：线性方程两段式<\/h2>\n<ul><li>\n齐次：特征根 → 基础解系。\n<\/li><li>\n非齐次：识别右端 → 待定系数（注意共振）或常数变易。\n<\/ul>\n<h2>决策规则<\/h2>\n<ul><li>\n只证存在：用皮亚诺，不必验李普希茨。\n<\/li><li>\n要证唯一：必须验李普希茨并给 h。\n<\/li><li>\n判稳：先线性化，非双曲再解李雅普诺夫方程。\n<\/li><li>\n边值：先解齐次，用二择一。\n<\/ul>\n<h2>反模式<\/h2>\n<ul><li>\n通解写完就交（漏奇解、漏常数解）。\n<\/li><li>\n共振忘了乘 x^k。\n<\/li><li>\n稳定性只分析一个平衡点。\n<\/li><li>\n引用定理不验条件。\n<\/ul>", "__cheatsheet__": "<h1>速查表<\/h1>\n<h2>一阶<\/h2>\n<table><thead><tr><th>类型<\/th><th>处理<\/th><\/tr><\/thead><tbody><tr><td>可分离<\/td><td>分离后积分，注意 g(y₀)=0<\/td><\/tr><tr><td>恰当<\/td><td>P_y=Q_x，求 u<\/td><\/tr><tr><td>线性 y′+Py=Q<\/td><td>μ=e^(∫P)<\/td><\/tr><tr><td>伯努利<\/td><td>z=y^(1−n)<\/td><\/tr><tr><td>齐次 y′=φ(y/x)<\/td><td>u=y/x<\/td><\/tr><tr><td>平移 y′=f(ax+by+c)<\/td><td>u=ax+by+c<\/td><\/tr><\/tbody><\/table>\n<h2>存在唯一<\/h2>\n<table><thead><tr><th>要证<\/th><th>用什么<\/th><\/tr><\/thead><tbody><tr><td>存在<\/td><td>皮亚诺（连续）<\/td><\/tr><tr><td>唯一<\/td><td>皮卡（连续 + 李普希茨）<\/td><\/tr><tr><td>h<\/td><td>min(a, b/M)<\/td><\/tr><\/tbody><\/table>\n<h2>高阶线性<\/h2>\n<table><thead><tr><th>右端<\/th><th>特解<\/th><\/tr><\/thead><tbody><tr><td>Pₙ(x)<\/td><td>Qₙ(x)x^k（0 是 k 重根）<\/td><\/tr><tr><td>e^(αx)Pₙ<\/td><td>e^(αx)Qₙ x^k（α 是 k 重根）<\/td><\/tr><tr><td>正弦余弦<\/td><td>转复指数处理<\/td><\/tr><\/tbody><\/table>\n<h2>方程组<\/h2>\n<table><thead><tr><th>情形<\/th><th>方法<\/th><\/tr><\/thead><tbody><tr><td>单特征值<\/td><td>[vᵢe^(λᵢt)]<\/td><\/tr><tr><td>复特征值<\/td><td>实部虚部<\/td><\/tr><tr><td>重特征值<\/td><td>广义特征向量<\/td><\/tr><tr><td>非齐次<\/td><td>常数变易<\/td><\/tr><\/tbody><\/table>\n<h2>稳定性<\/h2>\n<table><thead><tr><th>步骤<\/th><th>内容<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>解 f=0<\/td><\/tr><tr><td>2<\/td><td>算 J<\/td><\/tr><tr><td>3<\/td><td>算特征值<\/td><\/tr><tr><td>4<\/td><td>判符号<\/td><\/tr><tr><td>5<\/td><td>临界时解 AᵀP+PA=−Q<\/td><\/tr><\/tbody><\/table>\n<h2>PDE / 边值<\/h2>\n<table><thead><tr><th>类型<\/th><th>结论<\/th><\/tr><\/thead><tbody><tr><td>a u_x+b u_y=0<\/td><td>u=F(Φ)<\/td><\/tr><tr><td>拟线性<\/td><td>特征方程组<\/td><\/tr><tr><td>非特征条件<\/td><td>a y_τ−b x_τ≠0<\/td><\/tr><tr><td>边值<\/td><td>二择一 + 格林函数<\/td><\/tr><\/tbody><\/table>"}, "nav": [{"label": "学习路径", "href": "#/path"}, {"label": "章节", "children": [{"label": "第 1 章：一阶方程解题指导", "href": "#/chapter/ch01"}, {"label": "第 2 章：存在唯一性与奇解", "href": "#/chapter/ch02"}, {"label": "第 3 章：高阶线性方程", "href": "#/chapter/ch03"}, {"label": "第 4 章：线性微分方程组", "href": "#/chapter/ch04"}, {"label": "第 5 章：非线性与稳定性", "href": "#/chapter/ch05"}, {"label": "第 6 章：PDE 与边值问题", "href": "#/chapter/ch06"}, {"label": "第 7 章：期中期末与考研试题", "href": "#/chapter/ch07"}, {"label": "第 8 章：数学软件", "href": "#/chapter/ch08"}]}, {"label": "概念", "children": [{"label": "积分因子", "href": "#/concept/c01"}, {"label": "共振与特解形式", "href": "#/concept/c02"}, {"label": "李雅普诺夫方程", "href": "#/concept/c03"}]}, {"label": "测验", "children": [{"label": "综合测验", "href": "#/quiz/all"}, {"label": "测验：第 1 章：一阶方程解题指导", "href": "#/quiz/ch01"}, {"label": "测验：第 2 章：存在唯一性与奇解", "href": "#/quiz/ch02"}, {"label": "测验：第 3 章：高阶线性方程", "href": "#/quiz/ch03"}, {"label": "测验：第 4 章：线性微分方程组", "href": "#/quiz/ch04"}, {"label": "测验：第 5 章：非线性与稳定性", "href": "#/quiz/ch05"}, {"label": "测验：第 6 章：PDE 与边值问题", "href": "#/quiz/ch06"}, {"label": "测验：第 7 章：期中期末与考研试题", "href": "#/quiz/ch ", "tags": ["流程"]}, {"id": "f07", "chapterId": "ch04", "front": "共振乘 x 几次？", "back": "重数。", "tags": ["规则"]}, {"id": "f08", "chapterId": "ch04", "front": "朗斯基为零的含义？", "back": "同解时线性相关。", "tags": ["易错"]}, {"id": "f09", "chapterId": "ch05", "front": "验基解矩阵两步？", "back": "Φ′=AΦ、det≠0。", "tags": ["流程"]}, {"id": "f10", "chapterId": "ch05", "front": "刘维尔公式？", "back": "det Φ=e^(t tr A)。", "tags": ["公式"]}, {"id": "f11", "chapterId": "ch06", "front": "二次型 V 导数？", "back": "xᵀ(AᵀP+PA)x。", "tags": ["公式"]}, {"id": "f12", "chapterId": "ch06", "front": "五步稳定分析？", "back": "平衡点、J、特征值、符号、补 V。", "tags": ["流程"]}, {"id": "f13", "chapterId": "ch07", "front": "齐次 PDE 通解？", "back": "u=F(Φ)。", "tags": ["公式"]}, {"id": "f14", "chapterId": "ch07", "front": "非特征条件？", "back": "a y_τ−b x_τ≠0。", "tags": ["判据"]}, {"id": "f15", "chapterId": "ch08", "front": "格林函数三性质？", "back": "齐次、连续、导跃 1。", "tags": ["性质"]}, {"id": "f16", "chapterId": "ch08", "front": "边值共振？", "back": "λ 等于特征值。", "tags": ["易错"]}], "companion": "xitijiexi-ode学习伴侣.html"}, "rendered": {"ch01": "<h1>第 1 章 绪论与基本概念：全解与例题<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★☆☆ | <strong>预估学时<\/strong>：3 小时 | <strong>前置<\/strong>：微积分\n<\/li><li>\n<strong>对应原书<\/strong>：第一章（本章教材全解 / 典型例题解析）\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n由曲线族反求微分方程并说明阶数；\n<\/li><li>\n判断一个含参数式子是解还是通解；\n<\/li><li>\n用相图语言解释一阶方程的几何意义；\n<\/li><li>\n独立完成本章同步自测。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>本章的题目几乎都是&quot;概念辨析&quot;型：<strong>不求你算，只考你分得清&quot;解&quot;&quot;通解&quot;&quot;特解&quot;&quot;奇解&quot;<\/strong>。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>1.1 由曲线族求方程<\/h3>\n<p>n 个参数 ⇒ n 阶方程。方法：对 x 求 n 次导，联立消参数。<\/p>\n<p>例：y=C₁x+C₂x²。y′=C₁+2C₂x，y″=2C₂。消去得 x²y″−2xy′+2y=0。<\/p>\n<p><strong>检验<\/strong>：直接代入 y=C₁x+C₂x²，左边 x²·2C₂−2x(C₁+2C₂x)+2(C₁x+C₂x²)=2C₂x²−2C₁x−4C₂x²+2C₁x+2C₂x²=0。成立。<\/p>\n<h3>1.2 &quot;是不是解&quot;的检验法<\/h3>\n<p>三步：求导到所需阶、代入、看是否恒等。注意恒等是对区间上所有 x 成立，不是对某个 x。<\/p>\n<h3>1.3 通解与特解<\/h3>\n<p>通解含 n 个独立常数；特解由初值定出；奇解不在通解族内且相切。<\/p>\n<p><strong>&quot;独立&quot;的含义<\/strong>：不能相互表示。C₁+C₂ 与 C₁−C₂ 不独立。<\/p>\n<h3>1.4 几何：线素场与等斜线<\/h3>\n<p>等斜线是 f(x,y)=k 的曲线，其上所有线素斜率相同。等斜线有助于手绘积分曲线。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[曲线族 含 n 参数] --&gt; B[求导 n 次]\n    B --&gt; C[消参数]\n    C --&gt; D[n 阶方程]\n    D --&gt; E[通解]\n    E --&gt; F[初值定特解]\n    E --&gt; G[奇解 族外包络]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：这张图是&quot;正向与反向&quot;两条路的合体：从族到方程，从方程到解族。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：曲线族像&quot;一叠卡片&quot;，方程是&quot;卡片的共同规则&quot;；给你规则让你复原整叠卡片，就是求通解。<\/p>\n<p><strong>失效边界<\/strong>：包络不在卡片里，所以奇解是&quot;规则之外的解&quot;。<\/p>\n<p><strong>实例<\/strong>：y=C e^(−x)+x。求其满足的方程。 y′=x+1−y？检验：y′=1−Ce^(−x)，而 x+1−y=x+1−Ce^(−x)−x=1−Ce^(−x)。成立。故方程为 y′=x+1−y，即 y′+y=x+1。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为&quot;含常数就是通解&quot;<\/strong>——常数还要独立。\n<\/li><li>\n<strong>别以为&quot;代入一个点成立就是解&quot;<\/strong>——要恒等。\n<\/li><li>\n<strong>别以为&quot;阶数等于参数个数&quot;<\/strong>——一般如此，但退化情形例外。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\ny=C₁e^x+C₂e^(−x) 满足什么方程？\n<p>（答案：y″−y=0。解析：两个参数，二阶。）<\/p>\n<\/ol>\n<ol><li>\ny=sin(x+C) 是 y′=cos(x+C) 的通解吗？\n<p>（答案：不是，应写 y′=±√(1−y²)。解析：导数要用 y 表示。）<\/p>\n<\/ol>\n<ol><li>\n等斜线的作用？\n<p>（答案：标出斜率相同的点，便于手绘积分曲线。解析：几何辅助。）<\/p>\n<\/ol>\n<ol><li>\n判断&quot;是解&quot;的关键一步？\n<p>（答案：代入后对区间上所有 x 恒等。解析：不能只验一点。）<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\nn 参数 → n 阶方程。\n<\/li><li>\n解要恒等，不是点成立。\n<\/li><li>\n通解常数须独立。\n<\/ul>", "ch02": "<h1>第 2 章 一阶方程初等解法：全解与例题<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：8 小时 | <strong>前置<\/strong>：第 1 章\n<\/li><li>\n<strong>对应原书<\/strong>：第二章（本章教材全解 / 典型例题解析 / 同步自测）\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n独立完成分离变量、线性、恰当、隐式四类题；\n<\/li><li>\n在恰当方程题中熟练使用分组凑微分；\n<\/li><li>\n处理 y′=f(ax+by+c) 与齐次型；\n<\/li><li>\n用参数法解 y=xf(p)+g(p) 型。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>这一章的题量最大，但套路最少：<strong>四类方程，四种固定动作<\/strong>。练到看见形式就知道动作，就算过关。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>2.1 分离变量<\/h3>\n<p>dy/g(y)=f(x)dx，两边积分。别忘了 g(y)=0 的常数解。<\/p>\n<h3>2.2 一阶线性<\/h3>\n<p>y′+P(x)y=Q(x)，μ=e^(∫P dx)，(μy)′=μQ，y=(∫μQ dx+C)/μ。<\/p>\n<p><strong>积分技巧<\/strong>：∫P dx 不用加常数（会并入 C）；μ 取正即可。<\/p>\n<h3>2.3 恰当与分组<\/h3>\n<p>把 P dx+Q dy 拆成若干&quot;明显是全微分&quot;的组：<\/p>\n<ul><li>\nx dy+y dx=d(xy)\n<\/li><li>\n(x dy−y dx)/x²=d(y/x)\n<\/li><li>\n(x dx+y dy)/(x²+y²)=d(ln√(x²+y²))\n<\/ul>\n<p><strong>这三个公式是本章的&quot;乘法口诀&quot;<\/strong>，背下来能省一半时间。<\/p>\n<h3>2.4 隐式与参数<\/h3>\n<p>y=f(x,p)：对 x 求导，p=f_x+f_p p′，解出 p 后积分。 y=xf(p)+g(p)（拉格朗日型）：对 x 求导得线性方程，解出 x(p)，再代回。<\/p>\n<h3>2.5 典型例题<\/h3>\n<p>解 y=y′x+y′²（克莱罗型）。 令 p=y′：y=px+p²。对 x 求导：p=p+p′x+2pp′，即 p′(x+2p)=0。 分支一：p′=0 ⇒ p=C ⇒ y=Cx+C²（直线族）。 分支二：x=−2p ⇒ y=−p² ⇒ y=−x²/4（奇解）。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[一阶方程] --&gt; B[分离]\n    A --&gt; C[线性]\n    A --&gt; D[恰当]\n    A --&gt; E[隐式]\n    B --&gt; F[积分]\n    C --&gt; G[积分因子 e^intP]\n    D --&gt; H[凑微分]\n    E --&gt; I[参数 p]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：四条支路，最后都落到&quot;积分&quot;。所以本章真正的难点是积分技巧，不是方程类型识别。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：四类方程像四种锁，四种钥匙。训练的目标是&quot;看锁配钥匙&quot;的速度。<\/p>\n<p><strong>实例<\/strong>：解 (x+y)dx+(x−y)dy=0。检验 P_y=1，Q_x=1，恰当。 凑：x dx+y dx+x dy−y dy = d(x²/2)+d(xy)−d(y²/2)。 故 x²/2+xy−y²/2=C，即 x²+2xy−y²=C。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为&quot;积分因子只能靠公式&quot;<\/strong>——分组凑微分常常更快。\n<\/li><li>\n<strong>别以为&quot;克莱罗方程只有一个解&quot;<\/strong>——还有奇解。\n<\/li><li>\n<strong>别以为&quot;线性方程一定要用公式&quot;<\/strong>——有时观察出 (μy)′ 更省事。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n解 y′+2xy=x。\n<p>（答案：y=1/2+Ce^(−x²)。解析：μ=e^(x²)，(ye^(x²))′=xe^(x²)。）<\/p>\n<\/ol>\n<ol><li>\n解 y′=f(3x−y)。\n<p>（答案：令 u=3x−y，u′=3−f(u)。解析：化为分离变量。）<\/p>\n<\/ol>\n<ol><li>\n克莱罗方程 y=xp+p³ 的奇解？\n<p>（答案：x=−3p²，y=−2p³，即 y=±(2/3)(−x/3)^(3/2)。解析：消参。）<\/p>\n<\/ol>\n<ol><li>\n(x+y)dx+(x−y)dy=0 的解？\n<p>（答案：x²+2xy−y²=C。解析：恰当，凑微分。）<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n四类四动作。\n<\/li><li>\n三个凑微分公式要背。\n<\/li><li>\n隐式方程用 p 降阶。\n<\/ul>", "ch03": "<h1>第 3 章 存在唯一性与奇解：全解与例题<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：7 小时 | <strong>前置<\/strong>：第 2 章\n<\/li><li>\n<strong>对应原书<\/strong>：第三章（本章教材全解 / 典型例题解析）\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n用皮卡迭代算出解的前几项并估计误差；\n<\/li><li>\n判断给定方程在给定点是否唯一；\n<\/li><li>\n求奇解并完成五步检验；\n<\/li><li>\n判断解的最大存在区间。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>本章题目的标准结构是：<strong>给方程 → 判条件 → 下结论 →（若失效）构造反例<\/strong>。四步缺一不可。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>3.1 迭代与误差<\/h3>\n<p>以 y′=y，y(0)=1 为例： φ₀=1，φ₁=1+x，φ₂=1+x+x²/2，…，φₙ=Σ[k=0→n]xᵏ/k!。 误差 |φₙ−eˣ|≤e^(|x|)·|x|ⁿ⁺¹/(n+1)!。<\/p>\n<p><strong>这个估计是本章唯一需要记的公式<\/strong>。<\/p>\n<h3>3.2 判唯一<\/h3>\n<p>先算 ∂f/∂y，看它在矩形上是否有界。有界 ⇒ 唯一；无界 ⇒ 可能非唯一，需构造。<\/p>\n<h3>3.3 奇解五步<\/h3>\n<p>求通解 → C-判别式 → 回代 → 验证相切 → 确认李普希茨失效。<\/p>\n<p><strong>例<\/strong>：y′=y^(1/3)。通解 y=±(2x/3+C)^(3/2)。y=0 也是解，且与族中曲线相切（在起点处），且 y^(1/3) 在 0 处不满足李普希茨。故 y=0 是奇解。<\/p>\n<h3>3.4 最大存在区间<\/h3>\n<p>解出显式解后，看它在哪一段上连续且满足初值。y′=y²，y(0)=1 ⇒ y=1/(1−x)，区间 (−∞,1)。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[方程] --&gt; B[算 f_y]\n    B --&gt; C{有界}\n    C --&gt;|是| D[唯一 给 h]\n    C --&gt;|否| E{比值发散}\n    E --&gt;|是| F[构造非唯一解族]\n    E --&gt;|否| G[再估计]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：右侧那条&quot;构造&quot;是本章的分水岭。会构造，才算真懂。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：李普希茨条件像&quot;路口有没有护栏&quot;。有护栏（有界）则只有一条路；无护栏则可能分叉。<\/p>\n<p><strong>实例<\/strong>：y′=√(1−y²)，y(0)=0。∂f/∂y=−y/√(1−y²)，在 |y|≤1/2 上有界（≤1/√3），故局部唯一。解 y=sin x，在 |x|&lt;π/2 内有效。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为&quot;f 连续就唯一&quot;<\/strong>——连续只给存在。\n<\/li><li>\n<strong>别以为&quot;奇解一定是不连续处&quot;<\/strong>——是李普希茨失效处，f 可以连续。\n<\/li><li>\n<strong>别以为&quot;最大区间就是 R&quot;<\/strong>——要看解式。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\ny′=y^(1/3)，y(0)=0 有多少解？\n<p>（答案：无穷多。解析：y=0 与延迟出发的立方解。）<\/p>\n<\/ol>\n<ol><li>\n皮卡误差估计式？\n<p>（答案：|φₙ−y|≤M Lⁿ hⁿ⁺¹/(n+1)!。解析：阶乘收敛。）<\/p>\n<\/ol>\n<ol><li>\ny′=y²，y(0)=1 的最大区间？\n<p>（答案：(−∞,1)。解析：1/(1−x) 在 1 爆破。）<\/p>\n<\/ol>\n<ol><li>\n奇解检验的最后一步？\n<p>（答案：确认李普希茨失效。解析：否则唯一性禁止。）<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n判唯一看偏导有界。\n<\/li><li>\n奇解五步。\n<\/li><li>\n最大区间看解式定义域。\n<\/ul>", "ch04": "<h1>第 4 章 高阶线性方程：全解与例题<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：9 小时 | <strong>前置<\/strong>：第 3 章\n<\/li><li>\n<strong>对应原书<\/strong>：第四章（本章教材全解 / 典型例题解析 / 同步自测）\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n用特征根法写出任意常系数齐次方程的基础解系；\n<\/li><li>\n用待定系数法处理指数、多项式、三角右端；\n<\/li><li>\n用常数变易处理任意右端；\n<\/li><li>\n用降阶法与欧拉变换处理变系数题；\n<\/li><li>\n用朗斯基行列式判断线性相关性。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>高阶线性题的骨架永远是&quot;基础解系 + 一个特解&quot;，剩下的都是计算细节。<strong>细节里最容易错的是共振和朗斯基的符号。<\/strong><\/p>\n<h2>零基础讲解<\/h2>\n<h3>4.1 齐次三种根<\/h3>\n<p>单实根、共轭复根、重根。写基础解系时，重根必须写足 k 个。<\/p>\n<h3>4.2 待定系数<\/h3>\n<p>右端为 e^(αx)Pₙ(x) 时，设特解 e^(αx)Qₙ(x)x^k。k=α 作为特征根的重数。<\/p>\n<p>右端为 Pₙ(x)cos βx 或 sin 时，统一用复指数：解 e^(iβx)Pₙ 的特解，取实部或虚部。<\/p>\n<h3>4.3 常数变易<\/h3>\n<p>y*=Σ yᵢ∫(Wᵢ/W)f dx，其中 Wᵢ 是把 W 的第 i 列换成 (0,…,0,1)。<\/p>\n<h3>4.4 朗斯基<\/h3>\n<p>W(y₁,…,yₙ) 非零 ⇔ 线性无关（对线性方程的解而言）。<\/p>\n<p><strong>易错点<\/strong>：W 为零只说明在该点线性相关，不代表函数整体相关（除非它们都是同一方程的解）。<\/p>\n<h3>4.5 欧拉方程<\/h3>\n<p>x²y″+axy′+by=0。令 x=eᵗ，化为常系数；或用 y=x^r 试解，得 r(r−1)+ar+b=0。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[常系数齐次] --&gt; B[特征根]\n    B --&gt; C[基础解系]\n    A --&gt; D[非齐次]\n    D --&gt; E{右端}\n    E --&gt;|指数多项式| F[待定系数 + 共振]\n    E --&gt;|任意| G[常数变易]\n    A --&gt; H[变系数]\n    H --&gt; I[降阶 / 欧拉]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：中间&quot;待定系数 + 共振&quot;是本图唯一带星号的地方，也是失分集中区。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：基础解系像&quot;一组基向量&quot;，特解像&quot;平移量&quot;。任何解 = 基的组合 + 平移。<\/p>\n<p><strong>实例<\/strong>：y″+y=x。特征根 ±i。右端 x 是 0 次多项式，0 不是根，故设 y<em>=ax+b。 代入：0+ax+b=x ⇒ a=1，b=0。y<\/em>=x。 通解 y=C₁cos x+C₂sin x+x。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为&quot;W=0 就线性相关&quot;<\/strong>——只在同解情形下成立。\n<\/li><li>\n<strong>别以为&quot;欧拉方程只能用 x=eᵗ&quot;<\/strong>——y=x^r 试解也可。\n<\/li><li>\n<strong>别以为&quot;三角右端不能待定系数&quot;<\/strong>——转复指数即可。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\ny″+y=x 的特解？\n<p>（答案：x。解析：0 不是特征根，设一次多项式。）<\/p>\n<\/ol>\n<ol><li>\n朗斯基为零说明什么？\n<p>（答案：在该点线性相关；若都是同解则是整体相关。解析：注意前提。）<\/p>\n<\/ol>\n<ol><li>\n欧拉方程 x²y″+xy′−y=0 的解？\n<p>（答案：y=C₁x+C₂/x。解析：r(r−1)+r−1=r²−1=0。）<\/p>\n<\/ol>\n<ol><li>\n常数变易中 Wᵢ 怎么构造？\n<p>（答案：把 W 第 i 列换成 (0,…,1)。解析：克拉默法则。）<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n基础解系 + 特解。\n<\/li><li>\n共振看重数。\n<\/li><li>\n朗斯基判相关要注意前提。\n<\/ul>", "ch05": "<h1>第 5 章 线性微分方程组：全解与例题<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：8 小时 | <strong>前置<\/strong>：第 4 章\n<\/li><li>\n<strong>对应原书<\/strong>：第五章（本章教材全解 / 典型例题解析）\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n写出基解矩阵并验证；\n<\/li><li>\n用特征向量、矩阵指数、拉普拉斯三种方法求常系数解；\n<\/li><li>\n用常数变易解非齐次；\n<\/li><li>\n用刘维尔公式验算行列式。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>方程组的题，只要能算出基解矩阵，剩下的都是代入。<strong>所以练的重点是&quot;算 Φ&quot;，不是&quot;背理论&quot;<\/strong>。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>5.1 基解矩阵的验证<\/h3>\n<p>Φ′=AΦ 且 det Φ≠0。两步都要验，只验一步会扣分。<\/p>\n<h3>5.2 三种算法<\/h3>\n<p><strong>特征向量<\/strong>：A 有 n 个无关特征向量，Φ=[vᵢe^(λᵢt)]。 <strong>矩阵指数<\/strong>：对角化或若尔当。 <strong>拉普拉斯<\/strong>：Φ=L⁻¹[(sI−A)⁻¹]。<\/p>\n<p>三种方法结果应一致（相差一个常数矩阵右乘）。<\/p>\n<h3>5.3 非齐次<\/h3>\n<p>x=Φ[C+∫Φ⁻¹b ds]。若 b 为常向量且 A 可逆，特解 −A⁻¹b。<\/p>\n<h3>5.4 刘维尔验算<\/h3>\n<p>det Φ(t)=det Φ(0)·e^(t tr A)。这个式子可以快速检查 Φ 算得对不对。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[方程组] --&gt; B[求基解矩阵]\n    B --&gt; C[验 Phi&#x27;=A Phi]\n    B --&gt; D[验 det 非零]\n    C --&gt; E[非齐次 常数变易]\n    D --&gt; E<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：中间两个&quot;验&quot;是本章的得分点，很多答案错在 Φ 上而自己不知道。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：基解矩阵像&quot;三条独立的运动轨迹拼成的矩阵&quot;，每列一条。<\/p>\n<p><strong>实例<\/strong>：A=[[0,1],[−1,0]]。特征值 ±i，特征向量 (1,i)、(1,−i)。 实化解：x₁=cos t，x₂=−sin t。 Φ=[[cos t, sin t],[−sin t, cos t]]，det=1。验证 Φ′=[[−sin t, cos t],[−cos t,−sin t]]，而 AΦ=[[−sin t, cos t],[−cos t,−sin t]]。一致。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为&quot;Φ 只要满足 Φ′=AΦ 就行&quot;<\/strong>——还要 det≠0。\n<\/li><li>\n<strong>别以为&quot;三种算法结果必须完全相同&quot;<\/strong>——相差常数矩阵右乘。\n<\/li><li>\n<strong>别以为&quot;刘维尔公式只用于验算&quot;<\/strong>——它也用于证明 Φ 恒可逆。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n验证基解矩阵要做哪两步？\n<p>（答案：Φ′=AΦ 且 det Φ≠0。解析：缺一不可。）<\/p>\n<\/ol>\n<ol><li>\nA 的特征值为 ±2i，实解是什么形式？\n<p>（答案：cos 2t 与 sin 2t 的组合。解析：实部虚部。）<\/p>\n<\/ol>\n<ol><li>\n刘维尔公式？\n<p>（答案：det Φ(t)=det Φ(0)e^(t tr A)。解析：迹控制行列式。）<\/p>\n<\/ol>\n<ol><li>\n非齐次常向量特解？\n<p>（答案：−A⁻¹b。解析：常特解代入。）<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n算 Φ，验两步。\n<\/li><li>\n三种算法等价。\n<\/li><li>\n刘维尔公式验算。\n<\/ul>", "ch06": "<h1>第 6 章 非线性方程与稳定性：全解与例题<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：8 小时 | <strong>前置<\/strong>：第 5 章\n<\/li><li>\n<strong>对应原书<\/strong>：第六章（本章教材全解 / 典型例题解析 / 同步自测）\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n完整走完稳定性分析五步；\n<\/li><li>\n构造二次型 V 并验证条件；\n<\/li><li>\n判断平面系统的奇点类型与稳定性；\n<\/li><li>\n用捕获域论证闭轨存在。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>非线性题的答案不唯一，但<strong>论证结构是唯一的<\/strong>：平衡点、线性化、谱、结论或补 V。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>6.1 五步走<\/h3>\n<ol><li>\n解 f(x)=0。\n<\/li><li>\n每个平衡点算 J。\n<\/li><li>\n算特征值。\n<\/li><li>\n判符号。\n<\/li><li>\n临界时找 V 或守恒量。\n<\/ol>\n<h3>6.2 二次型 V 的构造<\/h3>\n<p>设 V=xᵀPx，要求 P 正定。V̇=xᵀ(AᵀP+PA)x，要求负定。<\/p>\n<p><strong>实操<\/strong>：解 AᵀP+PA=−I，若解出 P 正定，则渐近稳定。<\/p>\n<h3>6.3 平面奇点<\/h3>\n<p>p=tr A，q=det A，Δ=p²−4q。查表分类（结点、鞍点、焦点、中心）。<\/p>\n<h3>6.4 闭轨存在<\/h3>\n<p>构造环形区域 D：外边界上向量场指向内，内边界上指向外，且 D 内无平衡点 ⇒ 有闭轨。<\/p>\n<p><strong>实操<\/strong>：常用&quot;圆环 + 径向场符号判断&quot;。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[系统] --&gt; B[平衡点]\n    B --&gt; C[雅可比 J]\n    C --&gt; D[特征值]\n    D --&gt; E{双曲}\n    E --&gt;|是| F[查表结论]\n    E --&gt;|否| G[解 A^T P + P A = -I]\n    G --&gt; H{P 正定}\n    H --&gt;|是| I[渐近稳定]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：右侧那条&quot;解方程判 P&quot;是可计算的路径，比&quot;猜 V&quot;可靠。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：平衡点像&quot;地形上的坑与丘&quot;。V 像&quot;海拔计&quot;，V̇&lt;0 说明水往低处流。<\/p>\n<p><strong>实例<\/strong>：ẋ=−x+2y，ẏ=−2x−y。J=[[−1,2],[−2,−1]]，特征值 −1±2i，实部负 ⇒ 稳定焦点。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为&quot;线性化失效就无解&quot;<\/strong>——要另找方法。\n<\/li><li>\n<strong>别以为&quot;V 只能猜&quot;<\/strong>——线性系统有方程可解。\n<\/li><li>\n<strong>别以为&quot;捕获域随便画&quot;<\/strong>——边界上的向量方向必须验证。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n二次型 V 的导数公式？\n<p>（答案：xᵀ(AᵀP+PA)x。解析：直接求导。）<\/p>\n<\/ol>\n<ol><li>\n特征值 −1±2i 对应什么奇点？\n<p>（答案：稳定焦点。解析：复根带负实部。）<\/p>\n<\/ol>\n<ol><li>\n捕获域需要几个条件？\n<p>（答案：外边界向内、内边界向外、内部无平衡点。解析：庞加莱-本迪克松。）<\/p>\n<\/ol>\n<ol><li>\n五步流程的第一步？\n<p>（答案：解 f(x)=0 找平衡点。解析：漏了就错。）<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n五步流程。\n<\/li><li>\n二次型 V 可解方程。\n<\/li><li>\n捕获域三条件。\n<\/ul>", "ch07": "<h1>第 7 章 一阶线性偏微分方程：全解与例题<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：6 小时 | <strong>前置<\/strong>：第 2 章\n<\/li><li>\n<strong>对应原书<\/strong>：第七章（本章教材全解 / 典型例题解析）\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n用首次积分写出齐次 PDE 通解；\n<\/li><li>\n用特征线法解拟线性方程；\n<\/li><li>\n验证非特征条件；\n<\/li><li>\n处理含多个自变量的情形。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>PDE 题的答案形式是&quot;隐式&quot;的：<strong>F(Φ₁,Φ₂,…)=0 或 u=G(Φ)<\/strong>。这个形式本身就说明了一条轨线/一张解曲面。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>7.1 首次积分法<\/h3>\n<p>a u_x+b u_y=0。特征方程 dy/dx=b/a，解出 Φ(x,y)=C。通解 u=F(Φ)。<\/p>\n<p><strong>多变量情形<\/strong>：a₁u_x₁+…+aₙu_xₙ=0，需要 n−1 个独立首次积分，通解 u=F(Φ₁,…,Φ_{n−1})。<\/p>\n<h3>7.2 拟线性<\/h3>\n<p>特征方程组 dx/ds=a，dy/ds=b，du/ds=c。给定初始曲线参数 τ，解出含 (s,τ) 的表达式，消去得解。<\/p>\n<p><strong>隐式写法<\/strong>：Φ₁(x,y,u)=C₁，Φ₂(x,y,u)=C₂，解由 F(Φ₁,Φ₂)=0 给出。<\/p>\n<h3>7.3 非特征条件<\/h3>\n<p>a y_τ−b x_τ≠0。不满足则初始曲线与特征线相切，解不唯一。<\/p>\n<h3>7.4 典型例题<\/h3>\n<p>u_x+u_y=1，u(x,0)=x²。 特征：dx/ds=1，dy/ds=1，du/ds=1。 x=s+x₀，y=s，u=s+u₀。初始：y=0 ⇒ s=0，u₀=τ²，x₀=τ。 由 y=s 得 s=y，τ=x−y，u=y+(x−y)²。 验证：u_x=2(x−y)，u_y=1−2(x−y)，和=1。边界 u(x,0)=x²。正确。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[PDE] --&gt; B[特征方程组]\n    B --&gt; C[首次积分]\n    C --&gt; D[通解 F of Phi]\n    B --&gt; E[柯西问题]\n    E --&gt; F[非特征条件]\n    F --&gt; G[解曲面]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：左侧&quot;通解&quot;与右侧&quot;定解&quot;共用同一套特征线，区别只在是否给初始曲线。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：首次积分像&quot;地图上的等高线编号&quot;。知道编号，就知道自己在哪条线上。<\/p>\n<p><strong>实例<\/strong>：x u_x+y u_y=2u。特征：dx/ds=x，dy/ds=y，du/ds=2u。 解：x=x₀e^s，y=y₀e^s，u=u₀e^(2s)。 首次积分：y/x=y₀/x₀，u/x²=u₀/x₀²。 故 u=x²F(y/x)。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为&quot;PDE 通解只有一个任意常数&quot;<\/strong>——是任意函数。\n<\/li><li>\n<strong>别以为&quot;非特征条件可以跳过&quot;<\/strong>——不满足时解不唯一。\n<\/li><li>\n<strong>别以为&quot;消参数一定可行&quot;<\/strong>——有时只能写隐式。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\nx u_x+y u_y=0 的通解？\n<p>（答案：u=F(y/x)。解析：特征线 y/x=const。）<\/p>\n<\/ol>\n<ol><li>\n非特征条件的式子？\n<p>（答案：a y_τ−b x_τ≠0。解析：切向不能与特征向重合。）<\/p>\n<\/ol>\n<ol><li>\n三变量齐次 PDE 需要几个首次积分？\n<p>（答案：2 个。解析：n−1=2。）<\/p>\n<\/ol>\n<ol><li>\n隐式解的一般形式？\n<p>（答案：F(Φ₁,Φ₂)=0。解析：两个首次积分确定一条特征线。）<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n齐次：u=F(Φ)。\n<\/li><li>\n拟线性：特征方程组 + 初始曲线。\n<\/li><li>\n非特征条件必须验。\n<\/ul>", "ch08": "<h1>第 8 章 边值问题：全解与例题<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：7 小时 | <strong>前置<\/strong>：第 4、6 章\n<\/li><li>\n<strong>对应原书<\/strong>：第八章（本章教材全解 / 典型例题解析 / 同步自测）\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n判断边值问题是否有唯一解；\n<\/li><li>\n求斯特姆-刘维尔问题的特征值与特征函数；\n<\/li><li>\n用格林函数表示非齐次边值问题的解；\n<\/li><li>\n处理周期边界条件。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>边值问题的解法只有三条路：<strong>直接积分（罕用）、格林函数、特征函数展开<\/strong>。选哪条取决于&quot;齐次问题有没有非零解&quot;。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>8.1 先判可解性<\/h3>\n<p>解齐次 Ly=0 加边界条件：<\/p>\n<ul><li>\n只有零解 ⇒ 对任意 f 有唯一解。\n<\/li><li>\n有非零解 ⇒ 需 ∫f·yₙ=0（正交条件），否则无解。\n<\/ul>\n<h3>8.2 格林函数<\/h3>\n<p>对 y″=f，y(0)=y(1)=0：<\/p>\n<div class=\"eq\">G(x,s)=−s(1−x)（x>s）；−x(1−s)（x<s）<\/div>\n<p>y(x)=∫₀¹G(x,s)f(s)ds。<\/p>\n<p><strong>验证<\/strong>：G 在 x=s 处连续，导数跳跃 1（这正是 δ 源的特征）。<\/p>\n<h3>8.3 特征函数展开<\/h3>\n<p>对 y″+λy=f，y(0)=y(1)=0，特征函数 sin(nπx)。展开 f=Σfₙsin(nπx)，则<\/p>\n<div class=\"eq\">y=Σ fₙ/(n²π²−λ)·sin(nπx)<\/div>\n<p>λ 等于某个特征值时出现共振（分母为零）→ 无解或无穷多解。<\/p>\n<h3>8.4 周期边界<\/h3>\n<p>y(0)=y(1)，y′(0)=y′(1)。特征函数 cos(2nπx)、sin(2nπx)（n≥1）加常数 1。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[边值问题] --&gt; B[解齐次]\n    B --&gt; C{有非零解}\n    C --&gt;|无| D[格林函数]\n    C --&gt;|有| E[正交条件]\n    E --&gt; F[满足: 无穷多解]\n    E --&gt; G[不满足: 无解]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：分叉点就是&quot;齐次有没有非零解&quot;。这一步定错，后面全错。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：格林函数像&quot;在弦上某点按一下，整根弦的形状&quot;。任意外力是无数个按压的叠加。<\/p>\n<p><strong>实例<\/strong>：y″=1，y(0)=y(1)=0。直接积分：y=x²/2+ax+b，b=0，1/2+a=0 ⇒ a=−1/2。y=x²/2−x/2=x(x−1)/2。 用格林函数：∫G(x,s)ds。分段积分应得同一结果。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为&quot;边值问题总能解&quot;<\/strong>——共振时可能无解。\n<\/li><li>\n<strong>别以为&quot;格林函数必须显式&quot;<\/strong>——也可以用特征函数展开表示。\n<\/li><li>\n<strong>别以为&quot;周期边界与分离边界一样&quot;<\/strong>——特征值结构不同。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\ny″+π²y=0，y(0)=y(1)=0 有非零解吗？\n<p>（答案：有，y=sin πx。解析：π² 是特征值。）<\/p>\n<\/ol>\n<ol><li>\n格林函数在 x=s 处的性质？\n<p>（答案：连续，导数跳跃 1。解析：对应 δ 源。）<\/p>\n<\/ol>\n<ol><li>\n共振时边值问题会怎样？\n<p>（答案：无解或无穷多解。解析：分母为零。）<\/p>\n<\/ol>\n<ol><li>\n周期边界的特征函数？\n<p>（答案：1、cos 2nπx、sin 2nπx。解析：周期条件。）<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n先判齐次。\n<\/li><li>\n格林函数 = 点源响应。\n<\/li><li>\n特征值处共振。\n<\/ul>", "c01": "<h1>曲线族与微分方程<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：第 1 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>含 n 个独立参数的曲线族，对应一个 n 阶常微分方程；反过来，n 阶方程的通解含 n 个参数。<\/p>\n<h2>为什么重要<\/h2>\n<p>它把&quot;几何对象（曲线族）&quot;与&quot;分析对象（方程）&quot;对应起来，是理解通解含义的第一课。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n    A[n 参数曲线族] --&gt;|求导 n 次消参数| B[n 阶方程]\n    B --&gt;|积分 n 次| C[通解]\n    C --&gt;|定初值| D[特解]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>参数独立是关键：若两个参数可以合并成一个，实际参数个数少一个，阶数也少一阶。<\/p>\n<p>反例：y=C₁x+C₂x 实际上是 (C₁+C₂)x，只有一个参数，对应一阶方程 y′=y/x。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为&quot;表达式里出现两个字母就是两个参数&quot;。\n<\/li><li>\n别以为&quot;阶数一定等于参数个数&quot;（退化时例外）。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 1 章<\/td><td>全解<\/td><td>n 参数 ↔ n 阶<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：导数\n<\/li><li>\n后续：通解、初值问题\n<\/ul>", "c02": "<h1>朗斯基行列式<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 4、5 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>由 n 个函数及其直到 n−1 阶导数排成的行列式，用于判断线性相关性。<\/p>\n<h2>为什么重要<\/h2>\n<p>它是线性方程理论里&quot;基础解系&quot;的判据，也是常数变易公式的分母。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[n 个解] --&gt; B[排朗斯基矩阵]\n    B --&gt; C[算行列式]\n    C --&gt; D{非零}\n    D --&gt;|是| E[线性无关 基础解系]\n    D --&gt;|否| F[线性相关]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>对同一线性方程的解，W 要么处处非零，要么处处为零（刘维尔公式）。这个&quot;全有或全无&quot;性质是它好用的原因。<\/p>\n<p>对一般函数，W 在某点为 0 不代表线性相关（如 x² 与 x|x|）。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 W=0 一定线性相关（要限定为同解）。\n<\/li><li>\n别以为 W 是常数（一般随 t 变）。\n<\/li><li>\n别以为 W 与解的选择无关（换基会乘常数）。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 4 章<\/td><td>基础解系<\/td><td>W≠0 判无关<\/td><\/tr><tr><td>第 5 章<\/td><td>常数变易<\/td><td>W 作分母<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：行列式\n<\/li><li>\n后续：刘维尔公式\n<\/ul>", "c03": "<h1>格林函数<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：第 8 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>线性边值问题对&quot;单位点源&quot;的响应；一般右端的解由它积分叠加得到。<\/p>\n<h2>为什么重要<\/h2>\n<p>它把&quot;解微分方程&quot;变成&quot;做积分&quot;，并且把边界条件的信息全部编码进一个函数。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[单位点源 delta at s] --&gt; B[格林函数 G x s]\n    B --&gt; C[满足齐次边界]\n    C --&gt; D[任意 f 的解 = integral G f]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>G 的性质：对 x≠s 满足齐次方程；在 x=s 处连续；一阶导数跳跃 1（对应 δ）。这三条唯一确定 G。<\/p>\n<p>对称性：自伴问题的 G(x,s)=G(s,x)。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为格林函数只对二阶有效（高阶也有，但是张量）。\n<\/li><li>\n别以为 G 满足非齐次方程（它满足的是带 δ 的方程）。\n<\/li><li>\n别以为存在性无条件（共振时不存在）。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 8 章<\/td><td>边值问题<\/td><td>积分表示<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：δ 函数、边值问题\n<\/li><li>\n后续：特征函数展开\n<\/ul>", "__path__": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：概念与曲线族<\/strong><br>阅读：<a href=\"#/book/xitijiexi-ode/chapter/ch01\">第 1 章：绪论与基本概念<\/a><br>检查点：由族求方程<\/li><li class='path-step' id='path-02'><strong>步骤 02：一阶解法<\/strong><br>阅读：<a href=\"#/book/xitijiexi-ode/chapter/ch02\">第 2 章：一阶方程初等解法<\/a><br>检查点：四类四动作<\/li><li class='path-step' id='path-03'><strong>步骤 03：存在唯一与奇解<\/strong><br>阅读：<a href=\"#/book/xitijiexi-ode/chapter/ch03\">第 3 章：存在唯一性与奇解<\/a><br>检查点：五步检验<\/li><li class='path-step' id='path-04'><strong>步骤 04：高阶线性<\/strong><br>阅读：<a href=\"#/book/xitijiexi-ode/chapter/ch04\">第 4 章：高阶线性方程<\/a><br>检查点：共振规则<\/li><li class='path-step' id='path-05'><strong>步骤 05：方程组<\/strong><br>阅读：<a href=\"#/book/xitijiexi-ode/chapter/ch05\">第 5 章：线性微分方程组<\/a><br>检查点：算 Φ 并验<\/li><li class='path-step' id='path-06'><strong>步骤 06：非线性稳定<\/strong><br>阅读：<a href=\"#/book/xitijiexi-ode/chapter/ch06\">第 6 章：非线性与稳定性<\/a><br>检查点：五步流程<\/li><li class='path-step' id='path-07'><strong>步骤 07：一阶 PDE<\/strong><br>阅读：<a href=\"#/book/xitijiexi-ode/chapter/ch07\">第 7 章：一阶线性偏微分方程<\/a><br>检查点：特征线法<\/li><li class='path-step' id='path-08'><strong>步骤 08：边值<\/strong><br>阅读：<a href=\"#/book/xitijiexi-ode/chapter/ch08\">第 8 章：边值问题<\/a><br>检查点：判可解<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "__quiz_all__": "<h1>全部测验<\/h1><p>全书各章测验汇总：逐题作答，提交后即时反馈并显示解析。<\/p><h2>测验：第 1 章：绪论与基本概念<\/h2><div class='quiz-item' data-qid='ch01-q01' data-type='single'><p class='quiz-q'><b>Q1.<\/b> y=C₁x+C₂x² 满足的方程阶数是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch01-q01' value='0'> 1<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='1'> 2<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='2'> 3<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='3'> 不确定<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch01-q02' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 判断「是解」的关键是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch01-q02' value='0'> 某点成立<\/label><label class='quiz-opt'><input type='radio' name='ch01-q02' value='1'> 区间上恒等<\/label><label class='quiz-opt'><input type='radio' name='ch01-q02' value='2'> 有导数<\/label><label class='quiz-opt'><input type='radio' name='ch01-q02' value='3'> 连续<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p><h2>测验：第 2 章：一阶方程初等解法<\/h2><div class='quiz-item' data-qid='ch02-q03' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 解 y′+2xy=x 的积分因子？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch02-q03' value='0'> e^(x²)<\/label><label class='quiz-opt'><input type='radio' name='ch02-q03' value='1'> e^(2x)<\/label><label class='quiz-opt'><input type='radio' name='ch02-q03' value='2'> x²<\/label><label class='quiz-opt'><input type='radio' name='ch02-q03' value='3'> e^(−x²)<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch02-q04' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 克莱罗方程 y=xp+p³ 的奇解？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch02-q04' value='0'> 直线族<\/label><label class='quiz-opt'><input type='radio' name='ch02-q04' value='1'> y=−x²/4<\/label><label class='quiz-opt'><input type='radio' name='ch02-q04' value='2'> y=−2p³ 消
