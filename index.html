type='radio' name='ch05-q12' value='3'> 线性共振<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch05-q13' data-type='single'><p class='quiz-q'><b>Q3.<\/b> 极限环稳定性的判据？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch05-q13' value='0'> 庞加莱映射导数绝对值&lt;1<\/label><label class='quiz-opt'><input type='radio' name='ch05-q13' value='1'> 特征值实部&lt;0<\/label><label class='quiz-opt'><input type='radio' name='ch05-q13' value='2'> V̇&lt;0<\/label><label class='quiz-opt'><input type='radio' name='ch05-q13' value='3'> 李雅普诺夫指数&gt;0<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch06__": "<h1>测验：第 6 章：线性代数<\/h1><div class='quiz-item' data-qid='ch06-q14' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 矩阵可对角化的最小多项式条件？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch06-q14' value='0'> 无重根<\/label><label class='quiz-opt'><input type='radio' name='ch06-q14' value='1'> 次数等于阶数<\/label><label class='quiz-opt'><input type='radio' name='ch06-q14' value='2'> 等于特征多项式<\/label><label class='quiz-opt'><input type='radio' name='ch06-q14' value='3'> 常数项为 1<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch06-q15' data-type='single'><p class='quiz-q'><b>Q2.<\/b> A=[[0,1],[0,0]] 的 e^(At)？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch06-q15' value='0'> I<\/label><label class='quiz-opt'><input type='radio' name='ch06-q15' value='1'> [[1,t],[0,1]]<\/label><label class='quiz-opt'><input type='radio' name='ch06-q15' value='2'> [[e^t,0],[0,1]]<\/label><label class='quiz-opt'><input type='radio' name='ch06-q15' value='3'> [[0,1],[0,0]]<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz___all__": "<h1>测验：__all<\/h1><div class='quiz-item' data-qid='q16' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 本书把电路与振荡器放进教材的主要理由是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q16' value='0'> 增加趣味<\/label><label class='quiz-opt'><input type='radio' name='q16' value='1'> 说明稳定性决定工程可用性<\/label><label class='quiz-opt'><input type='radio' name='q16' value='2'> 减少证明<\/label><label class='quiz-opt'><input type='radio' name='q16' value='3'> 替代理论<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q17' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 常系数与变系数理论的关键分界是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q17' value='0'> 是否有基解矩阵<\/label><label class='quiz-opt'><input type='radio' name='q17' value='1'> 是否有固定特征值<\/label><label class='quiz-opt'><input type='radio' name='q17' value='2'> 是否可积<\/label><label class='quiz-opt'><input type='radio' name='q17' value='3'> 是否线性<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__cards__": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "__glossary__": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='标准方程组'>标准方程组 — ẋ=f(t,x) 形式的一阶方程组 <span class=glossary-ref>（第 1 章：引论）<\/span><\/li><li data-term='复值方程'>复值方程 — 未知函数取复值的方程 <span class=glossary-ref>（第 1 章：引论）<\/span><\/li><li data-term='特征方程'>特征方程 — 由常系数方程得到的代数方程 <span class=glossary-ref>（第 2 章：常系数线性方程）<\/span><\/li><li data-term='单根'>单根 — 特征方程的一重根 <span class=glossary-ref>（第 2 章：常系数线性方程）<\/span><\/li><li data-term='重根'>重根 — 特征方程的多重根 <span class=glossary-ref>（第 2 章：常系数线性方程）<\/span><\/li><li data-term='稳定多项式'>稳定多项式 — 所有根实部为负的多项式 <span class=glossary-ref>（第 2 章：常系数线性方程）<\/span><\/li><li data-term='赫尔维茨判据'>赫尔维茨判据 — 用顺序主子式判稳 <span class=glossary-ref>（第 2 章：常系数线性方程）<\/span><\/li><li data-term='消去法'>消去法 — 方程组消元化高阶方程 <span class=glossary-ref>（第 2 章：常系数线性方程）<\/span><\/li><li data-term='复振幅法'>复振幅法 — 用 e^(iωt) 求稳态解 <span class=glossary-ref>（第 2 章：常系数线性方程）<\/span><\/li><li data-term='rlc 电路'>RLC 电路 — 电感电阻电容串联回路 <span class=glossary-ref>（第 2 章：常系数线性方程）<\/span><\/li><li data-term='相平面'>相平面 — 二阶系统的状态平面 <span class=glossary-ref>（第 2 章：常系数线性方程）<\/span><\/li><li data-term='基解矩阵'>基解矩阵 — 线性无关解组成的矩阵 <span class=glossary-ref>（第 3 章：变系数线性方程）<\/span><\/li><li data-term='单值矩阵'>单值矩阵 — 周期系统走一圈的演化 <span class=glossary-ref>（第 3 章：变系数线性方程）<\/span><\/li><li data-term='乘子'>乘子 — 单值矩阵的特征值 <span class=glossary-ref>（第 3 章：变系数线性方程）<\/span><\/li><li data-term='降阶法'>降阶法 — 已知特解后降低方程阶数 <span class=glossary-ref>（第 3 章：变系数线性方程）<\/span><\/li><li data-term='迭代'>迭代 — 皮卡逐次逼近 <span class=glossary-ref>（第 4 章：存在性定理）<\/span><\/li><li data-term='首次积分'>首次积分 — 沿轨线取常数的函数 <span class=glossary-ref>（第 4 章：存在性定理）<\/span><\/li><li data-term='最大时间区间'>最大时间区间 — 解能延伸到的最大区间 <span class=glossary-ref>（第 4 章：存在性定理）<\/span><\/li><li data-term='爆破'>爆破 — 解在有限时间趋于无穷 <span class=glossary-ref>（第 4 章：存在性定理）<\/span><\/li><li data-term='李雅普诺夫稳定'>李雅普诺夫稳定 — 初值近则轨线不跑远 <span class=glossary-ref>（第 5 章：稳定性）<\/span><\/li><li data-term='渐近稳定'>渐近稳定 — 稳定且趋于平衡点 <span class=glossary-ref>（第 5 章：稳定性）<\/span><\/li><li data-term='离心调速器'>离心调速器 — 瓦特式转速调节装置 <span class=glossary-ref>（第 5 章：稳定性）<\/span><\/li><li data-term='极限环'>极限环 — 孤立的闭轨 <span class=glossary-ref>（第 5 章：稳定性）<\/span><\/li><li data-term='电子管振荡器'>电子管振荡器 — 自激振荡电路 <span class=glossary-ref>（第 5 章：稳定性）<\/span><\/li><li data-term='庞加莱映射'>庞加莱映射 — 绕一圈的首次回归映射 <span class=glossary-ref>（第 5 章：稳定性）<\/span><\/li><li data-term='最小零化多项式'>最小零化多项式 — 使 p(A)=0 的最低次首一多项式 <span class=glossary-ref>（第 6 章：线性代数）<\/span><\/li><li data-term='矩阵函数'>矩阵函数 — 用谱插值定义的 f(A) <span class=glossary-ref>（第 6 章：线性代数）<\/span><\/li><li data-term='若尔当形'>若尔当形 — 矩阵的标准分块形式 <span class=glossary-ref>（第 6 章：线性代数）<\/span><\/li><li data-term='广义特征向量'>广义特征向量 — 若尔当链上的向量 <span class=glossary-ref>（第 6 章：线性代数）<\/span><\/li><\/ul>", "__patterns__": "<h1>模式与框架库<\/h1>\n<h2>框架：从方程到工程结论<\/h2>\n<ol><li>\n写出物理方程（电路、机械）。\n<\/li><li>\n化为标准方程组。\n<\/li><li>\n算特征根或稳定多项式。\n<\/li><li>\n翻译回物理：稳定、振荡、谐振、自激。\n<\/ol>\n<p>这条链条是本书的组织逻辑。看每一节时，先问&quot;它在链条的哪一环&quot;。<\/p>\n<h2>框架：解的形状由特征根决定<\/h2>\n<ul><li>\n负实根：衰减。\n<\/li><li>\n正实根：发散。\n<\/li><li>\n纯虚根：等幅振荡。\n<\/li><li>\n复根带负实部：衰减振荡。\n<\/li><li>\n重根：多出 t 的幂。\n<\/ul>\n<h2>决策规则<\/h2>\n<ul><li>\n判稳定：先看系数符号，再算赫尔维茨不等式。\n<\/li><li>\n求稳态：用复振幅法，不硬算三角恒等式。\n<\/li><li>\n方程组要化高阶：用消去法，但记得回代。\n<\/li><li>\n变系数判稳：若不是周期，别找特征值，直接找 V。\n<\/ul>\n<h2>反模式<\/h2>\n<ul><li>\n<strong>以为系数全正就稳定<\/strong>。三阶还要 ab&gt;c。\n<\/li><li>\n<strong>对变系数系统套常系数公式<\/strong>。没有固定特征值。\n<\/li><li>\n<strong>把消去法的结果直接当答案<\/strong>。可能引入假解。\n<\/li><li>\n<strong>把极限环当中心<\/strong>。中心闭轨成族，极限环孤立。\n<\/ul>", "__cheatsheet__": "<h1>速查表<\/h1>\n<h2>常系数齐次<\/h2>\n<table><thead><tr><th>根<\/th><th>贡献的解<\/th><\/tr><\/thead><tbody><tr><td>实单根 λ<\/td><td>e^(λt)<\/td><\/tr><tr><td>共轭复根 α±iβ<\/td><td>e^(αt)cos βt, e^(αt)sin βt<\/td><\/tr><tr><td>k 重根 λ<\/td><td>e^(λt), t e^(λt), …, t^(k−1)e^(λt)<\/td><\/tr><\/tbody><\/table>\n<h2>赫尔维茨判据<\/h2>\n<table><thead><tr><th>阶<\/th><th>条件<\/th><\/tr><\/thead><tbody><tr><td>2<\/td><td>a&gt;0, b&gt;0<\/td><\/tr><tr><td>3<\/td><td>a&gt;0, c&gt;0, ab&gt;c<\/td><\/tr><tr><td>4<\/td><td>全部顺序主子式 &gt;0<\/td><\/tr><\/tbody><\/table>\n<h2>非齐次<\/h2>\n<table><thead><tr><th>右端<\/th><th>特解形式<\/th><\/tr><\/thead><tbody><tr><td>Pₙ(t)<\/td><td>Qₙ(t)（若 0 是根则乘 t^k）<\/td><\/tr><tr><td>e^(αt)Pₙ(t)<\/td><td>e^(αt)Qₙ(t)（若 α 是根则乘 t^k）<\/td><\/tr><tr><td>正弦/余弦<\/td><td>复振幅法：(A−iωI)u=−b<\/td><\/tr><\/tbody><\/table>\n<h2>变系数<\/h2>\n<table><thead><tr><th>场景<\/th><th>结论<\/th><\/tr><\/thead><tbody><tr><td>基解矩阵<\/td><td>Φ̇=AΦ，det≠0<\/td><\/tr><tr><td>非齐次<\/td><td>x=Φ[C+∫Φ⁻¹b]<\/td><\/tr><tr><td>刘维尔<\/td><td>det Φ=exp(∫tr A)<\/td><\/tr><tr><td>周期系统<\/td><td>Φ(t+T)=Φ(t)M<\/td><\/tr><\/tbody><\/table>\n<h2>存在性<\/h2>\n<table><thead><tr><th>结论<\/th><th>内容<\/th><\/tr><\/thead><tbody><tr><td>最大区间出口<\/td><td>到边界 / 爆破 / 到无穷<\/td><\/tr><tr><td>首次积分数<\/td><td>n−1<\/td><\/tr><tr><td>局部 vs 整体<\/td><td>整体要多假设不逸出<\/td><\/tr><\/tbody><\/table>\n<h2>稳定性<\/h2>\n<table><thead><tr><th>概念<\/th><th>判据<\/th><\/tr><\/thead><tbody><tr><td>线性化<\/td><td>实部全负渐近稳定<\/td><\/tr><tr><td>第二方法<\/td><td>V 正定、V̇ 负定<\/td><\/tr><tr><td>极限环存在<\/td><td>平面 + 捕获域 + 无平衡点<\/td><\/tr><tr><td>极限环稳定<\/td><td>庞加莱映射导数 &lt;1<\/td><\/tr><\/tbody><\/table>\n<h2>线性代数<\/h2>\n<table><thead><tr><th>工具<\/th><th>用途<\/th><\/tr><\/thead><tbody><tr><td>最小多项式<\/td><td>判可对角化<\/td><\/tr><tr><td>矩阵函数<\/td><td>算 e^(At)<\/td><\/tr><tr><td>若尔当形<\/td><td>解释 t 的幂<\/td><\/tr><\/tbody><\/table>"}, "nav": [{"label": "学习路径", "href": "#/path"}, {"label": "章节", "children": [{"label": "第 1 章：引论", "href": "#/chapter/ch01"}, {"label": "第 2 章：常系数线性方程", "href": "#/chapter/ch02"}, {"label": "第 3 章：变系数线性方程", "href": "#/chapter/ch03"}, {"label": "第 4 章：存在性定理", "href": "#/chapter/ch04"}, {"label": "第 5 章：稳定性", "href": "#/chapter/ch05"}, {"label": "第 6 章：线性代数", "href": "#/chapter/ch06"}]}, {"label": "概念", "children": [{"label": "稳定多项式（赫尔维茨判据）", "href": "#/concept/c01"}, {"label": "极限环与自激振荡", "href": "#/concept/c02"}, {"label": "矩阵指数", "href": "#/concept/c03"}]}, {"label": "测验", "children": [{"label": " uestion": "纯虚特征值对应？", "options": ["结点", "鞍点", "焦点", "中心"], "answer": 3, "explain": "闭合圆轨线。"}, {"id": "ch04-q08", "chapterId": "ch04", "type": "single", "question": "线性化能判稳的条件？", "options": ["实部全负", "双曲", "迹为零", "行列式为正"], "answer": 1, "explain": "非双曲即临界。"}, {"id": "ch04-q09", "chapterId": "ch04", "type": "single", "question": "零实部加若尔当块会怎样？", "options": ["指数衰减", "有界振荡", "多项式增长", "趋于零"], "answer": 2, "explain": "t^k 因子。"}, {"id": "ch04-q10", "chapterId": "ch04", "type": "single", "question": "临界情形为何不能靠线性化？", "options": ["计算太复杂", "非线性扰动可改变类型", "方程无解", "参数不确定"], "answer": 1, "explain": "中心可被扰动成焦点。"}, {"id": "ch05-q11", "chapterId": "ch05", "type": "single", "question": "单值矩阵的定义？", "options": ["Φ(0)", "Φ(T)", "A(T)", "det Φ(T)"], "answer": 1, "explain": "走一个周期的演化。"}, {"id": "ch05-q12", "chapterId": "ch05", "type": "single", "question": "参数共振的数学表现？", "options": ["乘子模越过 1", "特征值为零", "迹为零", "行列式为负"], "answer": 0, "explain": "振幅指数增长。"}, {"id": "ch06-q13", "chapterId": "ch06", "type": "single", "question": "压缩映射原理要求？", "options": ["完备 + q<1", "连续 + 有界", "线性 + 可逆", "紧 + 自伴"], "answer": 0, "explain": "缺一不可。"}, {"id": "ch06-q14", "chapterId": "ch06", "type": "single", "question": "取 h<1/L 的目的？", "options": ["保证 f 有界", "使积分算子成为压缩", "保证解唯一", "简化记号"], "answer": 1, "explain": "压缩因子 Lh<1。"}, {"id": "ch07-q15", "chapterId": "ch07", "type": "single", "question": "向量场在流形上的严格定义？", "options": ["切丛的截面", "光滑函数", "坐标映射", "微分形式"], "answer": 0, "explain": "v(x)∈T_xM。"}, {"id": "ch07-q16", "chapterId": "ch07", "type": "single", "question": "鞍点的指数？", "options": ["+1", "0", "−1", "−2"], "answer": 2, "explain": "方向净转角为负。"}, {"id": "ch07-q17", "chapterId": "ch07", "type": "single", "question": "球面上向量场总指数？", "options": ["0", "1", "2", "取决于场"], "answer": 2, "explain": "毛球定理。"}, {"id": "q18", "chapterId": "__all", "type": "single", "question": "阿诺尔德把相空间选择放在首位的理由是？", "options": ["便于计算", "相空间由物理约束决定，选错会误判轨线", "节省篇幅", "历史传统"], "answer": 1, "explain": "单摆柱面是典型例子。"}, {"id": "q19", "chapterId": "__all", "type": "single", "question": "代数分类与拓扑分类的差别在于？", "options": ["前者更精确", "后者更粗但更本质", "两者等价", "后者只在平面有效"], "answer": 1, "explain": "结点与焦点可同胚。"}], "flashcards": [{"id": "f01", "chapterId": "ch01", "front": "相流的群性质？", "back": "φ⁰=id，φ^(s+t)=φˢ∘φᵗ。", "tags": ["定义"]}, {"id": "f02", "chapterId": "ch01", "front": "相速度场怎么来？", "back": "流的 t=0 处时间导数。", "tags": ["定义"]}, {"id": "f03", "chapterId": "ch02", "front": "流箱做了什么？", "back": "把常点处向量场拉直成 ∂/∂x₁。", "tags": ["方法"]}, {"id": "f04", "chapterId": "ch02", "front": "非自治如何变自治？", "back": "加时间坐标，维数 +1。", "tags": ["方法"]}, {"id": "f05", "chapterId": "ch02", "front": "保守系统相曲线？", "back": "等能线。", "tags": ["结论"]}, {"id": "f06", "chapterId": "ch03", "front": "e^(At) 的行列式？", "back": "e^(t tr A)。", "tags": ["公式"]}, {"id": "f07", "chapterId": "ch03", "front": "中心与焦点的区别？", "back": "闭合 vs 螺旋。", "tags": ["分类"]}, {"id": "f08", "chapterId": "ch04", "front": "双曲的定义？", "back": "特征值实部全不为零。", "tags": ["定义"]}, {"id": "f09", "chapterId": "ch04", "front": "临界情形怎么办？", "back": "找守恒量或李雅普诺夫函数。", "tags": ["方法"]}, {"id": "f10", "chapterId": "ch05", "front": "乘子与指数关系？", "back": "ρ=e^(μT)。", "tags": ["公式"]}, {"id": "f11", "chapterId": "ch05", "front": "参数共振的舌区？", "back": "频率成 2:1 附近有带宽。", "tags": ["现象"]}, {"id": "f12", "chapterId": "ch06", "front": "压缩映射结论？", "back": "唯一不动点 + 迭代收敛。", "tags": ["定理"]}, {"id": "f13", "chapterId": "ch06", "front": "为什么需要完备性？", "back": "柯西列要收敛到空间内的点。", "tags": ["理解"]}, {"id": "f14", "chapterId": "ch07", "front": "切丛定义？", "back": "TM=∪T_xM。", "tags": ["定义"]}, {"id": "f15", "chapterId": "ch07", "front": "指数可加性的用途？", "back": "由边界绕数算内部奇点总指数。", "tags": ["应用"]}], "companion": "arnold-ode学习伴侣.html"}, "rendered": {"ch01": "<h1>第 1 章：相空间与相流<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：5 小时 | <strong>前置<\/strong>：微积分、微分流形初步\n<\/li><li>\n<strong>对应原书<\/strong>：第一章（§1–§6）\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n用&quot;确定、有限维、可微&quot;三个词刻画一个动力系统；\n<\/li><li>\n说清相流、相速度场、积分曲线三个对象的关系；\n<\/li><li>\n说明单摆的相空间为什么取柱面而不是平面；\n<\/li><li>\n解释&quot;相流是单参数微分同胚群&quot;这句话。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>阿诺尔德不从&quot;方程&quot;出发，而从&quot;过程&quot;出发：<strong>一个有确定未来的过程，其状态空间上自动长出一个流<\/strong>。方程只是这个流的无穷小描述。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>1.1 三个限定词<\/h3>\n<ul><li>\n<strong>确定<\/strong>：现在决定未来（也决定过去）。\n<\/li><li>\n<strong>有限维<\/strong>：状态由有限个参数描述。流体、弦振动不行。\n<\/li><li>\n<strong>可微<\/strong>：状态随时间的变化是光滑的。\n<\/ul>\n<p>这三条合起来，就是常微分方程的研究对象。热传导是&quot;半确定&quot;（只决定未来不决定过去），量子力学不确定——这些都在本课程之外。<\/p>\n<h3>1.2 相空间与相流<\/h3>\n<p><strong>相空间 M<\/strong>：所有可能状态的集合。 <strong>相流<\/strong>：映射 φᵗ:M→M，把&quot;状态&quot;送到&quot;t 时间后的状态&quot;。它满足群性质：<\/p>\n<div class=\"eq\">φ⁰=id，φ^(s+t)=φˢ∘φᵗ<\/div>\n<p><strong>相速度场<\/strong>：v(x)=d/dt φᵗ(x)|ₜ₌₀。这是 M 上的向量场。<\/p>\n<p><strong>积分曲线<\/strong>：扩张相空间 R×M 中的曲线 t↦(t, φᵗ(x))。它总是横截时间轴——<strong>在扩张相空间里，积分曲线永不相交<\/strong>。<\/p>\n<h3>1.3 单摆为什么在柱面上<\/h3>\n<p>单摆状态是（角度，角速度）。角度加 2π 是同一个物理状态，所以状态空间是柱面 S¹×R，不是平面。<\/p>\n<p><strong>这个细节是阿诺尔德的标志<\/strong>：他反复强调&quot;相空间的选择由物理决定，不是由方程决定&quot;。选错空间，会把闭合轨线误判成不闭合。<\/p>\n<h3>1.4 微分同胚<\/h3>\n<p>相流 φᵗ 对每个固定的 t 是微分同胚（可微、可逆、逆也可微）。这是&quot;确定性&quot;的几何表述：过程可逆，不会丢信息。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n    A[相空间 M] --&gt; B[相流 phi^t]\n    B --&gt; C[相速度场 v]\n    B --&gt; D[积分曲线 R x M]\n    C --&gt; E[向量场理论]\n    D --&gt; F[解的存在唯一性]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：上面是&quot;流的观点&quot;，下面是&quot;方程的观点&quot;。两者等价，但前者先给出几何图像。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：相流像&quot;河流的流线&quot;。每个水滴（状态）沿流线走，流线不相交——这正是确定性的几何含义。<\/p>\n<p><strong>失效边界<\/strong>：在平衡点处流线退化成一个点，方向无意义。<\/p>\n<p><strong>实例<\/strong>：谐振子 ẋ=y，ẏ=−x。相流是旋转：φᵗ(x,y)=(x cos t+y sin t, −x sin t+y cos t)。相速度场 v=(y,−x)，轨线是圆。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为&quot;相空间就是 Rⁿ&quot;<\/strong>——实际上由物理约束决定（角度 mod 2π、能量面等）。\n<\/li><li>\n<strong>别以为&quot;积分曲线与轨线是同一个&quot;<\/strong>——实际上前者在 R×M，后者在 M。\n<\/li><li>\n<strong>别以为&quot;相流可逆是废话&quot;<\/strong>——实际上它排除了耗散型&quot;多对一&quot;的过程。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n动力系统的三个限定词？\n<p>（答案：确定、有限维、可微。解析：见 §1.1。）<\/p>\n<\/ol>\n<ol><li>\n单摆的相空间为什么是柱面？\n<p>（答案：角度 mod 2π 是同一状态。解析：柱面把两端粘合。）<\/p>\n<\/ol>\n<ol><li>\n相流满足什么群性质？\n<p>（答案：φ⁰=id，φ^(s+t)=φˢ∘φᵗ。解析：单参数群。）<\/p>\n<\/ol>\n<ol><li>\n扩张相空间中积分曲线会相交吗？\n<p>（答案：不会。解析：每条曲线在 t 方向的斜率为 1。）<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n确定 + 有限维 + 可微 = 常微分方程的对象。\n<\/li><li>\n相流是单参数微分同胚群。\n<\/li><li>\n相速度场 = 流的无穷小生成元。\n<\/ul>", "ch02": "<h1>第 2 章：常点附近的向量场与首次积分<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：8 小时 | <strong>前置<\/strong>：第 1 章\n<\/li><li>\n<strong>对应原书<\/strong>：第二章前半（§7–§12）\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n用&quot;流箱&quot;（flow box）定理把常点附近的向量场拉直；\n<\/li><li>\n说明非自治系统如何通过加一个时间坐标化为自治；\n<\/li><li>\n在高阶方程中读出相曲线的几何意义；\n<\/li><li>\n用方向导数定义首次积分；\n<\/li><li>\n分析一个自由度的保守系统（能量面与相曲线）。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>常点附近，向量场可以<strong>局部拉直成平行场<\/strong>。这一步看似技术，实则是全部定性理论的起点：拉直之后，轨线就是直线，首次积分就是&quot;横坐标&quot;。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>2.1 流箱定理<\/h3>\n<p>设 v(x₀)≠0。则存在坐标变换把 v 变成 ∂/∂x₁（即所有轨线平行于第一坐标轴）。<\/p>\n<p><strong>证明思路<\/strong>：取过 x₀ 且横截 v 的超平面，沿 v 的轨线用它做&quot;标号&quot;，再取沿轨线的时间做第一个坐标。<\/p>\n<p><strong>用途<\/strong>：任何局部问题都可以在这个坐标里算。这就是&quot;局部定性理论&quot;的全部秘密。<\/p>\n<h3>2.2 非自治化自治<\/h3>\n<p>ẋ=f(t,x) 可以通过令 x₀=t，ẋ₀=1 变成自治系统（维数 +1）。于是&quot;非自治&quot;不是新理论，只是&quot;自治系统的一个特殊切片&quot;。<\/p>\n<p>阿诺尔德特别指出这一点，因为它把全书的理论统一了：<strong>只需要研究自治系统<\/strong>。<\/p>\n<h3>2.3 高阶方程的相曲线<\/h3>\n<p>y⁽ⁿ⁾=f(...) 化为方程组后，轨线在 Rⁿ 中。对二阶方程，相平面上的轨线就是&quot;位移-速度&quot;曲线，它丢掉了时间信息。<\/p>\n<h3>2.4 首次积分<\/h3>\n<p><strong>方向导数<\/strong>：沿 v 的导数 L_v F=∇F·v。 <strong>首次积分<\/strong>：L_v F=0 且 ∇F≠0。<\/p>\n<p>在流箱坐标里，F 就是&quot;横截面的标号&quot;，所以首次积分 = &quot;你在哪条轨线上&quot;。<\/p>\n<h3>2.5 保守系统<\/h3>\n<p>一个自由度的保守系统：H(p,q)=p²/2+V(q)。相曲线就是等能线 H=const。<strong>这个结论不需要解方程<\/strong>，直接由首次积分得到。<\/p>\n<p><strong>为什么重要<\/strong>：它是&quot;定性方法优于定量方法&quot;的典型例子——等能线的形状决定运动是振动、逃逸还是分界。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[向量场 v] --&gt; B{v 在 x0 是否为零}\n    B --&gt;|否| C[流箱: 拉直]\n    C --&gt; D[轨线平行]\n    C --&gt; E[首次积分 = 横坐标]\n    B --&gt;|是| F[奇点: 需单独分析]\n    D --&gt; G[保守系统 等能线]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：这张图是&quot;局部 vs 奇点&quot;的分水岭。右边那一支是第三章以后的内容。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：流箱像&quot;把弯曲的河道改造成笔直的水渠&quot;。改造只在局部有效，但足够你算清楚这一段的水流。<\/p>\n<p><strong>失效边界<\/strong>：流箱只在常点附近存在；奇点附近向量场为零，拉直失败。<\/p>\n<p><strong>实例<\/strong>：谐振子 H=p²/2+q²/2，等能线是圆。能量 E 决定半径 √(2E)，所以&quot;能量守恒&quot;直接给出&quot;轨线是圆&quot;。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为&quot;流箱只是换坐标&quot;<\/strong>——实际上它把&quot;解方程&quot;变成了&quot;读坐标&quot;。\n<\/li><li>\n<strong>别以为&quot;非自治需要新理论&quot;<\/strong>——实际上加一维就化为自治。\n<\/li><li>\n<strong>别以为&quot;首次积分一定存在&quot;<\/strong>——实际上奇点附近可能退化。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n流箱定理的条件？\n<p>（答案：v(x₀)≠0。解析：常点处才能拉直。）<\/p>\n<\/ol>\n<ol><li>\n非自治系统如何化为自治？\n<p>（答案：令 x₀=t，ẋ₀=1，维数加一。解析：时间变成坐标。）<\/p>\n<\/ol>\n<ol><li>\n保守系统的相曲线是什么？\n<p>（答案：等能线 H=const。解析：H 是首次积分。）<\/p>\n<\/ol>\n<ol><li>\n首次积分的定义式？\n<p>（答案：∇F·v=0 且 ∇F≠0。解析：沿 v 方向导数为零。）<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n常点 ⇒ 流箱 ⇒ 轨线平行。\n<\/li><li>\n非自治 = 自治 + 一维时间。\n<\/li><li>\n保守系统：等能线即相曲线。\n<\/ul>", "ch03": "<h1>第 3 章：线性系统与算子指数<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：10 小时 | <strong>前置<\/strong>：第 2 章、线性代数\n<\/li><li>\n<strong>对应原书<\/strong>：第二章中段（§13–§22）\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n用算子指数 e^(At) 表示线性系统的相流；\n<\/li><li>\n说明指数的三条性质（群性质、可逆性、行列式）；\n<\/li><li>\n处理互不相同的实特征值、复特征值与重特征值三种情形；\n<\/li><li>\n按特征值分类线性系统的奇点，并区分&quot;代数分类&quot;与&quot;拓扑分类&quot;。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>线性系统的相流就是一个线性算子：<strong>φᵗ=e^(At)<\/strong>。所有关于线性系统的几何结论，都是这个算子的谱性质。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>3.1 算子指数<\/h3>\n<div class=\"eq\">e^(At) = I + At + (At)²/2! + …<\/div>\n<p>性质：<\/p>\n<ol><li>\n<strong>群性质<\/strong>：e^(A(s+t))=e^(As)e^(At)。\n<\/li><li>\n<strong>可逆<\/strong>：逆是 e^(−At)。\n<\/li><li>\n<strong>行列式<\/strong>：det e^(At)=e^(t·tr A)。\n<\/ol>\n<p>第三条是刘维尔公式的算子版本：相流的&quot;体积伸缩率&quot;由迹决定。迹为零 ⇒ 保面积（哈密顿系统的特征）。<\/p>\n<h3>3.2 三种特征值情形<\/h3>\n<ul><li>\n<strong>互不相同的实特征值<\/strong>：e^(At) 在特征向量基下是对角的，轨线沿特征方向进出。\n<\/li><li>\n<strong>复特征值<\/strong>：实化后得到旋转 + 伸缩，轨线是螺旋。\n<\/li><li>\n<strong>重特征值<\/strong>：若尔当块给出&quot;旋转 + 平移&quot;的复合，轨线可能贴着特征方向走。\n<\/ul>\n<h3>3.3 奇点的代数分类<\/h3>\n<p>按特征值：结点（实、同号）、鞍点（实、异号）、焦点（复、有实部）、中心（纯虚）。<\/p>\n<h3>3.4 奇点的拓扑分类<\/h3>\n<p>阿诺尔德在这里做了一件其它教材常忽略的事：<strong>代数分类不等于拓扑分类<\/strong>。例如&quot;稳定结点&quot;在拓扑上都是一样的（都是把邻域压向一点），但&quot;焦点&quot;与&quot;结点&quot;在拓扑上不同（一个绕、一个不绕）。<\/p>\n<p>更精细的是：<strong>结点与焦点在拓扑上可以互相转化<\/strong>（通过同宿轨的分界），所以拓扑分类比代数分类粗，但更本质。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[线性系统] --&gt; B[e^（At）]\n    B --&gt; C[谱]\n    C --&gt; D[实互异: 结点/鞍点]\n    C --&gt; E[复: 焦点/中心]\n    C --&gt; F[重根: 若尔当]\n    D --&gt; G[拓扑分类]\n    E --&gt; G\n    F --&gt; G\n    G --&gt; H[结点与焦点可同胚]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：上面是&quot;代数&quot;，下面是&quot;拓扑&quot;。阿诺尔德的意思是：判稳用代数，谈&quot;相图长什么样&quot;要用拓扑。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：e^(At) 像&quot;一台机器&quot;，输入初始状态，输出 t 时刻状态。特征值决定这台机器是&quot;压扁&quot;、&quot;拉伸&quot;还是&quot;旋转&quot;。<\/p>\n<p><strong>失效边界<\/strong>：非线性系统的相流不是算子指数，只能局部近似。<\/p>\n<p><strong>实例<\/strong>：A=[[0,−1],[1,0]]。e^(At)=[[cos t,−sin t],[sin t,cos t]]，det=1（保面积），轨线是圆。对应中心。<\/p>\n<p><strong>实例 2<\/strong>：A=[[−1,1],[0,−1]]。e^(At)=e^(−t)[[1,t],[0,1]]。轨线螺旋趋近原点，但因为有 t 因子，趋近方向贴着一条直线——这是&quot;退化结点&quot;。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为&quot;代数分类就是全部&quot;<\/strong>——实际上拓扑分类更粗但更本质。\n<\/li><li>\n<strong>别以为&quot;det e^(At) 恒为 1&quot;<\/strong>——实际上等于 e^(t tr A)。\n<\/li><li>\n<strong>别以为&quot;重根一定是结点&quot;<\/strong>——实际上可能是退化结点或焦点型。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\ndet e^(At) 等于什么？\n<p>（答案：e^(t tr A)。解析：刘维尔公式的算子版。）<\/p>\n<\/ol>\n<ol><li>\n迹为零意味着什么几何性质？\n<p>（答案：相流保面积。解析：det=1。）<\/p>\n<\/ol>\n<ol><li>\n结点与焦点在拓扑上是否相同？\n<p>（答案：不同（一个不绕、一个绕），但可通过同宿分界互相转化。解析：见 §22。）<\/p>\n<\/ol>\n<ol><li>\n复特征值对应的轨线形状？\n<p>（答案：螺旋。解析：旋转加伸缩。）<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n线性相流 = e^(At)。\n<\/li><li>\ndet=e^(t tr A)，迹零保面积。\n<\/li><li>\n代数分类与拓扑分类是两回事。\n<\/ul>", "ch04": "<h1>第 4 章：平衡位置的稳定性<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：9 小时 | <strong>前置<\/strong>：第 3 章\n<\/li><li>\n<strong>对应原书<\/strong>：第二章中后段（§23–§27）\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n按特征值分类平衡位置的稳定性（含纯虚、重根两种临界情形）；\n<\/li><li>\n说明&quot;线性化判稳&quot;的边界：为什么纯虚情形不能下结论；\n<\/li><li>\n用稳定多项式判据（赫尔维茨）快速判断；\n<\/li><li>\n分析非自治线性方程的稳定性。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>稳定性在阿诺尔德笔下是一个&quot;谱问题&quot;：<strong>看特征值落在左半平面、右半平面，还是虚轴上<\/strong>。前两者干脆利落，第三者才是全部困难的来源。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>4.1 三种情形<\/h3>\n<ul><li>\n<strong>全部实部为负<\/strong>：渐近稳定（线性化即可）。而且这个结论对非线性系统也成立（双曲情形）。\n<\/li><li>\n<strong>有实部为正<\/strong>：不稳定（同样对非线性成立）。\n<\/li><li>\n<strong>全部实部 ≤0 且有实部为零<\/strong>：<strong>临界<\/strong>，线性化失效。\n<\/ul>\n<h3>4.2 纯虚情形<\/h3>\n<p>特征值 ±iω。线性系统是中心（稳定但不渐近）。但非线性扰动可能把它变成稳定焦点、不稳定焦点，或者仍是中心。<\/p>\n<p><strong>这是全书最重要的警告<\/strong>：临界情形下，&quot;线性化&quot;给不出任何结论，必须用李雅普诺夫函数或保守量。<\/p>\n<p>例：ẍ+x+εx³=0。ε&gt;0 时轨线是闭合的（保守量存在）；ẍ+x+εẋ=0 时是稳定焦点。两者线性化都是中心。<\/p>\n<h3>4.3 重特征值<\/h3>\n<p>若尔当块带来 t 的幂。实部为负时仍渐近稳定（t^k e^(−λt)→0），但趋近速度不是纯指数。实部为零且有若尔当块时，轨线多项式增长——不稳定。<\/p>\n<h3>4.4 稳定多项式<\/h3>\n<p>实系数多项式的所有根实部为负 ⇔ 赫尔维茨矩阵顺序主子式全正。这是&quot;不解方程判稳&quot;的代数工具（庞特里亚金那本讲得更细）。<\/p>\n<h3>4.5 非自治线性<\/h3>\n<p>ẋ=A(t)x。稳定性的判据不再由&quot;特征值&quot;给出（A(t) 没有固定谱）。特殊情形（A 为常数、A 周期）可以算；一般情形只能用李雅普诺夫函数或基本解矩阵的增长估计。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[平衡点] --&gt; B[线性化谱]\n    B --&gt; C{实部}\n    C --&gt;|全负| D[渐近稳定]\n    C --&gt;|有正| E[不稳定]\n    C --&gt;|有零其余负| F[临界]\n    F --&gt; G[线性化失效]\n    G --&gt; H[纯虚: 中心或焦点]\n    G --&gt; I[重根零实部: 多项式增长]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：这张图的重点是底部两支。考试里&quot;线性化失效&quot;几乎总是意味着&quot;要用别的方法&quot;。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：临界情形像&quot;天平恰好水平&quot;。理论上不动，但一根羽毛就能决定它往哪边倒——线性化看不出羽毛的方向。<\/p>\n<p><strong>失效边界<\/strong>：如果系统的临界情形由守恒量保护（如哈密顿系统），那么它稳定；若被耗散项破坏，就失稳。<\/p>\n<p><strong>实例<\/strong>：线性中心 ẋ=y，ẏ=−x，轨线是圆，稳定。加扰动 ẏ=−x−εy（ε&gt;0）变成稳定焦点，轨线螺旋趋近原点；ε&lt;0 则不稳定焦点。三者线性化主部相同。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为&quot;实部非正就稳定&quot;<\/strong>——实际上零实部加若尔当块会多项式增长。\n<\/li><li>\n<strong>别以为&quot;中心一定稳定&quot;<\/strong>——实际上非线性扰动可能让它失稳。\n<\/li><li>\n<strong>别以为&quot;赫尔维茨判据只对二阶有用&quot;<\/strong>——实际上任意阶都能排矩阵。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n线性化能判稳的条件？\n<p>（答案：特征值实部都不为零（双曲）。解析：否则临界。）<\/p>\n<\/ol>\n<ol><li>\n纯虚情形为何不能下结论？\n<p>（答案：非线性扰动可能改变稳定性类型。解析：中心、焦点都可能。）<\/p>\n<\/ol>\n<ol><li>\n零实部加若尔当块会怎样？\n<p>（答案：轨线多项式增长，不稳定。解析：t^k 因子。）<\/p>\n<\/ol>\n<ol><li>\n赫尔维茨判据的结论形式？\n<p>（答案：顺序主子式全正 ⇔ 所有根实部为负。解析：等价于稳定多项式。）<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n双曲：看实部符号。\n<\/li><li>\n临界：线性化失效，另找方法。\n<\/li><li>\n稳定多项式：看赫尔维茨矩阵。\n<\/ul>", "ch05": "<h1>第 5 章：周期系数系统与常数变易<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：6 小时 | <strong>前置<\/strong>：第 3、4 章\n<\/li><li>\n<strong>对应原书<\/strong>：第二章（§28–§29）\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n证明弗洛凯定理：Φ(t+T)=Φ(t)M；\n<\/li><li>\n用乘子判断周期系数系统的稳定性；\n<\/li><li>\n解释参数共振的几何机制；\n<\/li><li>\n写出常数变易公式并说明它在非线性摄动中的用法。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>周期系数系统的相流&quot;每绕一圈就是一个固定的线性变换&quot;。<strong>稳定性 = 这个变换的谱是否落在单位圆内<\/strong>。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>5.1 弗洛凯定理<\/h3>\n<p>A(t+T)=A(t)。由 Φ̇=AΦ 与周期性，可得 Φ(t+T) 也是基解矩阵，故存在常数矩阵 M 使<\/p>\n<div class=\"eq\">Φ(t+T) = Φ(t)M<\/div>\n<p>M=Φ(T) 是单值矩阵。它的特征值 ρ 叫乘子。写成 ρ=e^(μT)，μ 叫弗洛凯指数。<\/p>\n<h3>5.2 稳定性判据<\/h3>\n<ul><li>\n所有 |ρ|&lt;1：渐近稳定；\n<\/li><li>\n有 |ρ|&gt;1：不稳定；\n<\/li><li>\n|ρ|=1：临界。\n<\/ul>\n<p>乘子与基解矩阵的选取无关（相似变换不改变特征值），所以这个判据是良定义的。<\/p>\n<h3>5.3 参数共振<\/h3>\n<p>对 ẍ+(δ+ε cos t)x=0（马蒂厄方程），当激励频率与固有频率成 2:1 时，即使 ε 很小，乘子也会穿出单位圆，振幅指数增长。<\/p>\n<p><strong>几何图像<\/strong>：每次绕圈，系统都在&quot;恰当的相位&quot;被推一把，能量累积。这与&quot;共振&quot;的物理直觉一致，但数学上表现为乘子的模越过 1。<\/p>\n<h3>5.4 常数变易<\/h3>\n<p>对 ẋ=A(t)x+b(t)，设 x=Φ(t)c(t)，代入得 Φċ=b，即<\/p>\n<div class=\"eq\">x = Φ(t)[c₀ + ∫Φ⁻¹(s)b(s)ds]<\/div>\n<p>在非线性摄动里，把 b 换成&quot;非线性余项&quot;，就得到非线性问题的积分方程形式——这是后续证明的常用手段。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[周期系数 A（t）] --&gt; B[基解矩阵]\n    B --&gt; C[单值矩阵 M=Phi（T）]\n    C --&gt; D[乘子]\n    D --&gt; E{模}\n    E --&gt;|全小于1| F[渐近稳定]\n    E --&gt;|有大于1| G[不稳定]\n    E --&gt;|等于1| H[临界]\n    C --&gt; I[参数共振]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：从 A(t) 到乘子只有一条路：走一个周期。所有稳定性结论都从乘子出来。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：单值矩阵像&quot;荡秋千时每推一次的效果&quot;。推的力度相同，但相位对不对决定秋千越荡越高还是慢慢停下。<\/p>\n<p><strong>失效边界<\/strong>：如果 A(t) 不是周期的，M 无定义，这套判据失效。<\/p>\n<p><strong>实例<\/strong>：A(t)=[[0,1],[−1−ε cos t,0]]，ε=0 时 M=Φ(2π)=I，乘子为 1（临界）。ε 稍大于 0 时，某一乘子模 &gt;1，出现参数共振。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为&quot;周期系数可以逐点算特征值&quot;<\/strong>——实际上要算绕一圈的乘积。\n<\/li><li>\n<strong>别以为&quot;乘子模为 1 就一定稳定&quot;<\/strong>——实际上可能多项式增长。\n<\/li><li>\n<strong>别以为&quot;参数共振只在精确频率发生&quot;<\/strong>——实际上在一个频率带内都会发生（舌区）。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n单值矩阵的定义？\n<p>（答案：M=Φ(T)。解析：走一个周期的演化。）<\/p>\n<\/ol>\n<ol><li>\n乘子与弗洛凯指数的关系？\n<p>（答案：ρ=e^(μT)。解析：取对数。）<\/p>\n<\/ol>\n<ol><li>\n参数共振的判据？\n<p>（答案：乘子模越过 1。解析：振幅指数增长。）<\/p>\n<\/ol>\n<ol><li>\n常数变易公式？\n<p>（答案：x=Φ[c₀+∫Φ⁻¹b]。解析：把非齐次项翻译成坐标变化率。）<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\nΦ(t+T)=Φ(t)M。\n<\/li><li>\n判稳看乘子模。\n<\/li><li>\n参数共振 = 乘子出单位圆。\n<\/ul>", "ch06": "<h1>第 6 章：存在、唯一与可微性定理<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：8 小时 | <strong>前置<\/strong>：第 2、5 章\n<\/li><li>\n<strong>对应原书<\/strong>：第二章（§30–§32）\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n陈述并证明压缩映射原理（巴拿赫不动点定理）；\n<\/li><li>\n用它证明存在唯一性定理，并说清&quot;为什么这是最干净的一条路&quot;；\n<\/li><li>\n证明解对初值的可微性（可微性定理）；\n<\/li><li>\n说明阿诺尔德为何把压缩映射放在证明之前。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>阿诺尔德的证明路线与皮卡不同：<strong>先用压缩映射原理证抽象的不动点存在唯一，再把积分方程塞进这个框架<\/strong>。这样&quot;存在唯一&quot;变成一个纯度量空间的事实。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>6.1 压缩映射原理<\/h3>\n<p>设 X 是完备度量空间，T:X→X 满足 d(Tx,Ty)≤q d(x,y)（q&lt;1）。则 T 有唯一不动点，且迭代 xₙ₊₁=Txₙ 收敛到它。<\/p>\n<p><strong>证明两行<\/strong>：迭代列是柯西列（因为 d(xₙ₊₁,xₙ)≤qⁿd(x₁,x₀) 可和），完备性给极限，压缩性给唯一。<\/p>\n<h3>6.2 用到积分方程<\/h3>\n<p>把初值问题写成<\/p>\n<div class=\"eq\">y = y₀ + ∫f(t,y)dt =: T(y)<\/div>\n<p>在连续函数空间（上确界范数，完备）上，若 f 满足李普希茨，则 T 是压缩（压缩因子 Lh&lt;1，取 h&lt;1/L）。于是存在唯一。<\/p>\n<p><strong>为什么这条路线干净<\/strong>：它不需要逐项估计 φₙ 的收敛速度，也不需要证明&quot;极限满足积分方程&quot;——不动点定理已经包办。<\/p>\n<h3>6.3 可微性定理<\/h3>\n<p>解对初值可微，且 ∂y/∂y₀ 满足变分方程。证明思路：把&quot;对初值求导&quot;看成&quot;在参数化的问题族上做差商&quot;，再用压缩映射的一致收敛性取极限。<\/p>\n<h3>6.4 与皮卡路线的关系<\/h3>\n<p>皮卡迭代就是压缩映射迭代的特例（T 是积分算子）。阿诺尔德只是把&quot;为什么收敛&quot;这件事抽象出来，讲得更清楚。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[完备度量空间] --&gt; B[压缩映射 T]\n    B --&gt; C[唯一不动点]\n    C --&gt; D[迭代收敛]\n    A --&gt; E[连续函数空间]\n    E --&gt; F[积分算子]\n    F --&gt; G[李普希茨 ⇒ 压缩]\n    G --&gt; H[存在唯一]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：上半是抽象定理，下半是具体应用。两者之间靠&quot;李普希茨 ⇒ 压缩因子 Lh&lt;1&quot;连接。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：压缩映射像&quot;不断对折一张纸&quot;。每折一次距离减半，最终所有点聚到同一个位置——那就是不动点。<\/p>\n<p><strong>失效边界<\/strong>：如果 T 只是&quot;非扩张&quot;（q=1），不动点可能不存在（如平移映射 x↦x+1）。<\/p>\n<p><strong>实例<\/strong>：解 y′=y，y(0)=1。T(y)=1+∫₀ˣy dt。取 h&lt;1，压缩因子 h&lt;1。迭代从 y₀≡1 开始，得到部分和 1+x+x²/2+…，收敛到 eˣ。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为&quot;压缩映射只能证存在&quot;<\/strong>——实际上它同时给唯一性和迭代算法。\n<\/li><li>\n<strong>别以为&quot;q&lt;1 是技术条件&quot;<\/strong>——实际上 q=1 时结论不成立。\n<\/li><li>\n<strong>别以为&quot;完备性可以省略&quot;<\/strong>——实际上柯西列未必收敛。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n压缩映射原理的三个条件？\n<p>（答案：完备度量空间、压缩（q&lt;1）、自映射。解析：缺一不可。）<\/p>\n<\/ol>\n<ol><li>\n为什么取 h&lt;1/L？\n<p>（答案：使积分算子的压缩因子 Lh&lt;1。解析：压缩映射要求严格小于 1。）<\/p>\n<\/ol>\n<ol><li>\n阿诺尔德路线与皮卡路线的差别？\n<p>（答案：前者先证抽象不动点定理再套用，后者直接迭代估计。解析：本质相同。）<\/p>\n<\/ol>\n<ol><li>\n可微性定理的结论？\n<p>（答案：∂y/∂y₀ 存在且满足变分方程。解析：Φ′=f_yΦ，Φ(x₀)=I。）<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n压缩映射：完备 + q&lt;1 ⇒ 唯一不动点。\n<\/li><li>\n积分算子 + 李普希茨 ⇒ 压缩。\n<\/li><li>\n可微性 = 差商 + 一致收敛。\n<\/ul>", "ch07": "<h1>第 7 章：流形、切丛与奇点指数<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：7 小时 | <strong>前置<\/strong>：第 1、3 章、拓扑初步\n<\/li><li>\n<strong>对应原书<\/strong>：第二章末段（§33–§36）\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n说明为什么相空间必须是微分流形（单摆的柱面、刚体的 SO(3)）；\n<\/li><li>\n用切丛语言重述&quot;向量场&quot;；\n<\/li><li>\n由向量场构造相流（局部单参数群）；\n<\/li><li>\n定义向量场奇点的指数并计算简单情形。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>这一章把前面所有内容&quot;搬&quot;到流形上：<strong>向量场不再是 Rⁿ 上的箭头，而是切丛的一个截面；奇点指数则是一个拓扑不变量<\/strong>。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>7.1 为什么需要流形<\/h3>\n<p>单摆的相空间是柱面（角度 mod 2π）；刚体姿态空间是 SO(3)；能量面常常是球面或环面。<\/p>\n<p>在这些空间里，&quot;坐标&quot;只能局部取，但&quot;向量场&quot;&quot;轨线&quot;仍然有意义。这就是流形的用处：<strong>它允许你在没有全局坐标的地方做微分<\/strong>。<\/p>\n<h3>7.2 切丛与向量场<\/h3>\n<p>切空间 T_xM 是 x 处所有切向量。切丛 TM=∪T_xM。向量场是映射 v:M→TM，且 v(x)∈T_xM（称为截面）。<\/p>\n<p><strong>为什么这个说法重要<\/strong>：它保证&quot;向量场与空间是同一个对象的两面&quot;，不会出现&quot;箭头指向空间外&quot;的错误。<\/p>\n<h3>7.3 由向量场构造相流<\/h3>\n<p>解的存在唯一性定理在流形上仍成立（局部）。把所有局部流拼起来，得到整体流（在紧流形上总能拼完）。<\/p>\n<h3>7.4 奇点指数<\/h3>\n<p>对平面向量场，孤立奇点 x₀ 的指数：取包围 x₀ 的小圆圈，沿圈走一圈，向量场方向转过的总圈数。<\/p>\n<p><strong>性质<\/strong>：<\/p>\n<ul><li>\n结点、焦点、中心：指数 +1；\n<\/li><li>\n鞍点：指数 −1；\n<\/li><li>\n指数是可加的（区域内有多个奇点时，总指数等于边界曲线的绕数）。\n<\/ul>\n<p><strong>用途<\/strong>：由指数可以判断&quot;奇点的总数与类型&quot;，不必逐个分析。例如球面上的向量场总指数为 2（毛球定理）。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[流形 M] --&gt; B[切丛 TM]\n    B --&gt; C[向量场 = 截面]\n    C --&gt; D[局部相流]\n    D --&gt; E[整体相流]\n    C --&gt; F[奇点]\n    F --&gt; G[指数]\n    G --&gt; H[拓扑不变量]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：左边是&quot;几何对象&quot;，右边是&quot;拓扑结论&quot;。指数之所以重要，是因为它不随连续变形改变。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：奇点指数像&quot;梳头时 unavoidable 的旋&quot;。你没法把球面上的毛全部梳平——总得有几个旋，旋的&quot;类型&quot;就是指数。<\/p>\n<p><strong>失效边界<\/strong>：指数只对孤立奇点定义；奇点连成一条线时，指数无定义。<\/p>\n<p><strong>实例<\/strong>：平面向量场 v=(x,y)（结点），绕单位圆一圈，方向从 (1,0) 转到 (0,1) 再转回，共转 1 圈，指数 +1。 v=(x,−y)（鞍点），绕圈时方向变化的净绕数为 −1，指数 −1。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为&quot;流形只是高维曲面&quot;<\/strong>——实际上关键在于&quot;局部有坐标、整体未必有&quot;。\n<\/li><li>\n<strong>别以为&quot;指数是连续量&quot;<\/strong>——实际上它是整数，做连续变形不变。\n<\/li><li>\n<strong>别以为&quot;指数能决定稳定性&quot;<\/strong>——实际上指数 +1 的奇点可能是稳定也可能不稳定。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n单摆的相空间是什么流形？\n<p>（答案：柱面 S¹×R。解析：角度 mod 2π。）<\/p>\n<\/ol>\n<ol><li>\n向量场在流形上的严格定义？\n<p>（答案：TM 的截面，v(x)∈T_xM。解析：保证向量在切空间内。）<\/p>\n<\/ol>\n<ol><li>\n鞍点的指数？\n<p>（答案：−1。解析：绕圈方向净转数为负。）<\/p>\n<\/ol>\n<ol><li>\n球面上向量场总指数为什么是 2？\n<p>（答案：欧拉示性数决定（毛球定理）。解析：拓扑不变量。）<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n相空间是流形，向量场是切丛截面。\n<\/li><li>\n指数：结点/焦点/中心 +1，鞍点 −1。\n<\/li><li>\n指数是拓扑不变量。\n<\/ul>", "c01": "<h1>相流与流箱<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 1、2 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>相流是状态空间上的单参数变换群 φᵗ；流箱是常点附近把它拉直成平行移动的局部坐标。<\/p>\n<h2>为什么重要<\/h2>\n<p>它把&quot;解方程&quot;变成&quot;读坐标&quot;，是全部局部定性理论的技术核心。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n    A[向量场 v] --&gt; B[相流 phi^t]\n    B --&gt; C[常点: 流箱]\n    C --&gt; D[轨线平行]\n    A --&gt; E[奇点: 拉直失败]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>流箱的做法：取横截超平面做标号，沿轨线的时间做第一坐标。在这个坐标里，向量场就是 ∂/∂x₁，轨线是平行直线，首次积分就是横坐标。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为流箱是全局的（只在常点邻域）。\n<\/li><li>\n别以为拉直改变了动力学（只是换坐标）。\n<\/li><li>\n别以为奇点也能拉直（v=0 处无方向）。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 1 章<\/td><td>相流定义<\/td><td>单参数群<\/td><\/tr><tr><td>第 2 章<\/td><td>常点<\/td><td>流箱定理<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：向量场\n<\/li><li>\n后续：首次积分、局部标准形\n<\/ul>", "c02": "<h1>首次积分与保守系统<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 2 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>沿轨线取常数的光滑函数；保守系统的能量就是最典型的首次积分。<\/p>\n<h2>为什么重要<\/h2>\n<p>它让你不接方程就能画出相图：等能线的形状决定运动类型。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[哈密顿量 H] --&gt; B[首次积分]\n    B --&gt; C[等能线 = 相曲线]\n    C --&gt; D{等能线形状}\n    D --&gt;|闭合| E[振动]\n    D --&gt;|开口| F[逃逸]\n    D --&gt;|分界| G[同宿/异宿]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>对 H=p²/2+V(q)，相曲线就是 H 的等值线。势阱内的闭合等能线对应周期振动；能量超过势垒则开口，对应逃逸。<\/p>\n<p>分界线（连接鞍点的轨线）把两类运动分开，它的周期趋于无穷。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为首次积分一定是能量（也可以是角动量等）。\n<\/li><li>\n别以为找到首次积分就等于解出方程（它只给轨线的几何）。\n<\/li><li>\n别以为耗散系统也有首次积分（一般没有）。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 2 章<\/td><td>§11 方向导数<\/td><td>首次积分定义<\/td><\/tr><tr><td>第 2 章<\/td><td>§12 保守系统<\/td><td>等能线<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：方向导数\n<\/li><li>\n后续：哈密顿系统、可积性\n<\/ul>", "c03": "<h1>向量场奇点的指数<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：第 7 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>沿包围孤立奇点的小圈走一圈，向量场方向转过的净圈数（整数）。<\/p>\n<h2>为什么重要<\/h2>\n<p>它是拓扑不变量：连续变形不改变它，因此可以用来&quot;数&quot;奇点，而不必逐个分析。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[孤立奇点] --&gt; B[取小圆圈]\n    B --&gt; C[沿圈看方向转角]\n    C --&gt; D[净圈数 = 指数]\n    D --&gt; E[结点/焦点/中心: +1]\n    D --&gt; F[鞍点: -1]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>指数的可加性：区域内多个奇点的指数之和等于边界曲线的绕数。由此可证球面上向量场总指数为 2（毛球定理）。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为指数决定稳定性（+1 可能稳也可能不稳）。\n<\/li><li>\n别以为指数对非孤立奇点有定义。\n<\/li><li>\n别以为指数是连续量（它是整数）。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 7 章<\/td><td>§36 奇点指数<\/td><td>拓扑不变量<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：绕数、同伦\n<\/li><li>\n后续：庞加莱-霍普夫定理\n<\/ul>", "__path__": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：相空间与相流<\/strong><br>阅读：<a href=\"#/book/arnold-ode/chapter/ch01\">第 1 章：相空间与相流<\/a><br>检查点：说清单摆为何在柱面<\/li><li class='path-step' id='path-02'><strong>步骤 02：常点与首次积分<\/strong><br>阅读：<a href=\"#/book/arnold-ode/chapter/ch02\">第 2 章：常点附近的向量场与首次积分<\/a><br>检查点：用流箱解释局部结构<\/li><li class='path-step' id='path-03'><strong>步骤 03：线性系统与算子指数<\/strong><br>阅读：<a href=\"#/book/arnold-ode/chapter/ch03\">第 3 章：线性系统与算子指数<\/a><br>检查点：分类一个 2×2 系统<\/li><li class='path-step' id='path-04'><strong>步骤 04：稳定性<\/strong><br>阅读：<a href=\"#/book/arnold-ode/chapter/ch04\">第 4 章：平衡位置的稳定性<\/a><br>检查点：说出临界情形的困难<\/li><li class='path-step' id='path-05'><strong>步骤 05：周期系数<\/strong><br>阅读：<a href=\"#/book/arnold-ode/chapter/ch05\">第 5 章：周期系数系统与常数变易<\/a><br>检查点：用乘子判稳<\/li><li class='path-step' id='path-06'><strong>步骤 06：存在唯一性<\/strong><br>阅读：<a href=\"#/book/arnold-ode/chapter/ch06\">第 6 章：存在、唯一与可微性定理<\/a><br>检查点：用压缩映射证明<\/li><li class='path-step' id='path-07'><strong>步骤 07：流形与奇点指数<\/strong><br>阅读：<a href=\"#/book/arnold-ode/chapter/ch07\">第 7 章：流形、切丛与奇点指数<\/a><br>检查点：算鞍点指数<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "__quiz_all__": "<h1>全部测验<\/h1><p>全书各章测验汇总：逐题作答，提交后即时反馈并显示解析。<\/p><h2>测验：第 1 章：相空间与相流<\/h2><div class='quiz-item' data-qid='ch01-q01' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 动力系统的三个限定词是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch01-q01' value='0'> 连续、有界、可微<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='1'> 确定、有限维、可微<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='2'> 线性、自治、光滑<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='3'> 存在、唯一、稳定<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch01-q02' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 单摆的相空间是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch01-q02' value='0'> 平面<\/label><label class='quiz-opt'><input type='radio' name='ch01-q02' value='1'> 柱面<\/label><label class='quiz-opt'><input type='radio' name='ch01-q02' value='2'> 球面<\/label><label class='quiz-opt'><input type='radio' name='ch01-q02' value='3'> 环面<\/label><\/div><div class='quiz-a 'quiz-opt'><input type='radio' name='ch05-q11' value='0'> Φ(0)<\/label><label class='quiz-opt'><input type='radio' name='ch05-q11' value='1'> Φ(T)<\/label><label class='quiz-opt'><input type='radio' name='ch05-q11' value='2'> A(T)<\/label><label class='quiz-opt'><input type='radio' name='ch05-q11' value='3'> det Φ(T)<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch05-q12' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 参数共振的数学表现？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch05-q12' value='0'> 乘子模越过 1<\/label><label class='quiz-opt'><input type='radio' name='ch05-q12' value='1'> 特征值为零<\/label><label class='quiz-opt'><input type='radio' name='ch05-q12' value='2'> 迹为零<\/label><label class='quiz-opt'><input type='radio' name='ch05-q12' value='3'> 行列式为负<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch06__": "<h1>测验：第 6 章：存在、唯一与可微性定理<\/h1><div class='quiz-item' data-qid='ch06-q13' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 压缩映射原理要求？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch06-q13' value='0'> 完备 + q&lt;1<\/label><label class='quiz-opt'><input type='radio' name='ch06-q13' value='1'> 连续 + 有界<\/label><label class='quiz-opt'><input type='radio' name='ch06-q13' value='2'> 线性 + 可逆<\/label><label class='quiz-opt'><input type='radio' name='ch06-q13' value='3'> 紧 + 自伴<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch06-q14' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 取 h&lt;1/L 的目的？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch06-q14' value='0'> 保证 f 有界<\/label><label class='quiz-opt'><input type='radio' name='ch06-q14' value='1'> 使积分算子成为压缩<\/label><label class='quiz-opt'><input type='radio' name='ch06-q14' value='2'> 保证解唯一<\/label><label class='quiz-opt'><input type='radio' name='ch06-q14' value='3'> 简化记号<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch07__": "<h1>测验：第 7 章：流形、切丛与奇点指数<\/h1><div class='quiz-item' data-qid='ch07-q15' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 向量场在流形上的严格定义？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch07-q15' value='0'> 切丛的截面<\/label><label class='quiz-opt'><input type='radio' name='ch07-q15' value='1'> 光滑函数<\/label><label class='quiz-opt'><input type='radio' name='ch07-q15' value='2'> 坐标映射<\/label><label class='quiz-opt'><input type='radio' name='ch07-q15' value='3'> 微分形式<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch07-q16' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 鞍点的指数？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch07-q16' value='0'> +1<\/label><label class='quiz-opt'><input type='radio' name='ch07-q16' value='1'> 0<\/label><label class='quiz-opt'><input type='radio' name='ch07-q16' value='2'> −1<\/label><label class='quiz-opt'><input type='radio' name='ch07-q16' value='3'> −2<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch07-q17' data-type='single'><p class='quiz-q'><b>Q3.<\/b> 球面上向量场总指数？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch07-q17' value='0'> 0<\/label><label class='quiz-opt'><input type='radio' name='ch07-q17' value='1'> 1<\/label><label class='quiz-opt'><input type='radio' name='ch07-q17' value='2'> 2<\/label><label class='quiz-opt'><input type='radio' name='ch07-q17' value='3'> 取决于场<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz___all__": "<h1>测验：__all<\/h1><div class='quiz-item' data-qid='q18' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 阿诺尔德把相空间选择放在首位的理由是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q18' value='0'> 便于计算<\/label><label class='quiz-opt'><input type='radio' name='q18' value='1'> 相空间由物理约束决定，选错会误判轨线<\/label><label class='quiz-opt'><input type='radio' name='q18' value='2'> 节省篇幅<\/label><label class='quiz-opt'><input type='radio' name='q18' value='3'> 历史传统<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q19' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 代数分类与拓扑分类的差别在于？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q19' value='0'> 前者更精确<\/label><label class='quiz-opt'><input type='radio' name='q19' value='1'> 后者更粗但更本质<\/label><label class='quiz-opt'><input type='radio' name='q19' value='2'> 两者等价<\/label><label class='quiz-opt'><input type='radio' name='q19' value='3'> 后者只在平面有效<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__cards__": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "__glossary__": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='确定过程'>确定过程 — 现在决定过去与未来 <span class=glossary-ref>（第 1 章：相空间与相流）<\/span><\/li><li data-term='相空间'>相空间 — 所有可能状态的集合 <span class=glossary-ref>（第 1 章：相空间与相流）<\/span><\/li><li data-term='相流'>相流 — 状态随时间的单参数变换群 <span class=glossary-ref>（第 1 章：相空间与相流）<\/span><\/li><li data-term='相速度场'>相速度场 — 流的无穷小生成元（向量场） <span class=glossary-ref>（第 1 章：相空间与相流）<\/span><\/li><li data-term='扩张相空间'>扩张相空间 — R×M，含时间的空间 <span class=glossary-ref>（第 1 章：相空间与相流）<\/span><\/li><li data-term='积分曲线'>积分曲线 — 扩张相空间中的解曲线 <span class=glossary-ref>（第 1 章：相空间与相流）<\/span><\/li><li data-term='微分同胚'>微分同胚 — 可微且逆也可微的双射 <span class=glossary-ref>（第 1 章：相空间与相流）<\/span><\/li><li data-term='平衡位置'>平衡位置 — 向量场为零的点 <span class=glossary-ref>（第 1 章：相空间与相流）<\/span><\/li><li data-term='流箱'>流箱 — 把常点附近拉直的坐标 <span class=glossary-ref>（第 2 章：常点附近的向量场与首次积分）<\/span><\/li><li data-term='非自治方程'>非自治方程 — 右端显含时间的方程 <span class=glossary-ref>（第 2 章：常点附近的向量场与首次积分）<\/span><\/li><li data-term='相曲线'>相曲线 — 相空间中的轨线 <span class=glossary-ref>（第 2 章：常点附近的向量场与首次积分）<\/span><\/li><li data-term='方向导数'>方向导数 — 沿向量场的变化率 <span class=glossary-ref>（第 2 章：常点附近的向量场与首次积分）<\/span><\/li><li data-term='首次积分'>首次积分 — 沿轨线取常数的函数 <span class=glossary-ref>（第 2 章：常点附近的向量场与首次积分）<\/span><\/li><li data-term='保守系统'>保守系统 — 存在能量守恒的系统 <span class=glossary-ref>（第 2 章：常点附近的向量场与首次积分）<\/span><\/li><li data-term='等能线'>等能线 — 能量相同的点的集合 <span class=glossary-ref>（第 2 章：常点附近的向量场与首次积分）<\/span><\/li><li data-term='算子指数'>算子指数 — 由级数定义的 e^(At) <span class=glossary-ref>（第 3 章：线性系统与算子指数）<\/span><\/li><li data-term='可对角化'>可对角化 — 有足够多线性无关特征向量 <span class=glossary-ref>（第 3 章：线性系统与算子指数）<\/span><\/li><li data-term='若尔当标准形'>若尔当标准形 — 矩阵的标准分块形式 <span class=glossary-ref>（第 3 章：线性系统与算子指数）<\/span><\/li><li data-term='结点'>结点 — 两特征方向都指向/背离的奇点 <span class=glossary-ref>（第 3 章：线性系统与算子指数）<\/span><\/li><li data-term='鞍点'>鞍点 — 一进一出的奇点 <span class=glossary-ref>（第 3 章：线性系统与算子指数）<\/span><\/li><li data-term='焦点'>焦点 — 螺旋进出的奇点 <span class=glossary-ref>（第 3 章：线性系统与算子指数）<\/span><\/li><li data-term='中心'>中心 — 闭合轨线围成的奇点 <span class=glossary-ref>（第 3 章：线性系统与算子指数）<\/span><\/li><li data-term='拓扑分类'>拓扑分类 — 按相图同胚型分类 <span class=glossary-ref>（第 3 章：线性系统与算子指数）<\/span><\/li><li data-term='稳定多项式'>稳定多项式 — 所有根实部为负的多项式 <span class=glossary-ref>（第 4 章：平衡位置的稳定性）<\/span><\/li><li data-term='临界情形'>临界情形 — 特征值有零实部 <span class=glossary-ref>（第 4 章：平衡位置的稳定性）<\/span><\/li><li data-term='双曲平衡点'>双曲平衡点 — 特征值实部全不为零 <span class=glossary-ref>（第 4 章：平衡位置的稳定性）<\/span><\/li><li data-term='单值矩阵'>单值矩阵 — 周期系统走一圈的演化 <span class=glossary-ref>（第 5 章：周期系数系统与常数变易）<\/span><\/li><li data-term='乘子'>乘子 — 单值矩阵的特征值 <span class=glossary-ref>（第 5 章：周期系数系统与常数变易）<\/span><\/li><li data-term='弗洛凯指数'>弗洛凯指数 — 乘子的对数除以周期 <span class=glossary-ref>（第 5 章：周期系数系统与常数变易）<\/span><\/li><li data-term='参数共振'>参数共振 — 周期激励导致指数增长 <span class=glossary-ref>（第 5 章：周期系数系统与常数变易）<\/span><\/li><li data-term='常数变易'>常数变易 — 用基解矩阵构造非齐次解 <span class=glossary-ref>（第 5 章：周期系数系统与常数变易）<\/span><\/li><li data-term='压缩映射'>压缩映射 — 距离严格缩短的映射 <span class=glossary-ref>（第 6 章：存在、唯一与可微性定理）<\/span><\/li><li data-term='完备度量空间'>完备度量空间 — 柯西列都收敛的空间 <span class=glossary-ref>（第 6 章：存在、唯一与可微性定理）<\/span><\/li><li data-term='不动点'>不动点 — T(x)=x 的点 <span class=glossary-ref>（第 6 章：存在、唯一与可微性定理）<\/span><\/li><li data-term='变分方程'>变分方程 — Φ′=f_yΦ <span class=glossary-ref>（第 6 章：存在、唯一与可微性定理）<\/span><\/li><li data-term='微分流形'>微分流形 — 局部像 Rⁿ 的空间 <span class=glossary-ref>（第 7 章：流形、切丛与奇点指数）<\/span><\/li><li data-term='切空间'>切空间 — 一点处所有切向量 <span class=glossary-ref>（第 7 章：流形、切丛与奇点指数）<\/span><\/li><li data-term='切丛'>切丛 — 所有切空间的并 <span class=glossary-ref>（第 7 章：流形、切丛与奇点指数）<\/span><\/li><li data-term='截面'>截面 — 每点取一个切向量的映射 <span class=glossary-ref>（第 7 章：流形、切丛与奇点指数）<\/span><\/li><li data-term='奇点指数'>奇点指数 — 绕奇点一圈的方向净转角 <span class=glossary-ref>（第 7 章：流形、切丛与奇点指数）<\/span><\/li><\/ul>", "__patterns__": "<h1>模式与框架库<\/h1>\n<h2>框架：几何优先<\/h2>\n<p>遇到任何方程，先问三个几何问题：<\/p>\n<ol><li>\n相空间是什么（Rⁿ？柱面？球面？）？\n<\/li><li>\n向量场在哪里为零（奇点）？\n<\/li><li>\n除奇点外，轨线怎么排（流箱、首次积分、等能线）？\n<\/ol>\n<p>这套提问顺序是阿诺尔德全书的骨架。<\/p>\n<h2>框架：局部—奇点二分<\/h2>\n<ul><li>\n常点：流箱拉直，问题化为&quot;读坐标&quot;。\n<\/li><li>\n奇点：线性化 → 谱 → 若临界则另找方法。\n<\/ul>\n<p>一切局部定性结论都落在这两支之一。<\/p>\n<h2>决策规则<\/h2>\n<ul><li>\n判稳：先看是否双曲。双曲看谱，非双曲找守恒量或 V。\n<\/li><li>\n周期系数：算单值矩阵，不算逐点特征值。\n<\/li><li>\n相空间选择：由物理约束定，不由方程定。\n<\/li><li>\n谈&quot;相图类型&quot;：用拓扑分类，不用代数分类。\n<\/ul>\n<h2>反模式<\/h2>\n<ul><li>\n<strong>把相空间默认成 Rⁿ<\/strong>。单摆会因此误判闭合性。\n<\/li><li>\n<strong>对临界情形用线性化下结论<\/strong>。中心可能被扰动成焦点。\n<\/li><li>\n<strong>把&quot;结点&quot;和&quot;焦点&quot;当同一类<\/strong>。拓扑上它们不同。\n<\/li><li>\n<strong>以为指数能判稳定<\/strong>。指数只给拓扑信息。\n<\/ul>", "__cheatsheet__": "<h1>速查表<\/h1>\n<h2>基本对象<\/h2>\n<table><thead><tr><th>对象<\/th><th>定义<\/th><\/tr><\/thead><tbody><tr><td>相流<\/td><td>φᵗ:M→M，φ^(s+t)=φˢ∘φᵗ<\/td><\/tr><tr><td>相速度场<\/td><td>v(x)=d/dt φᵗ(x) at t=0<\/td><\/tr><tr><td>积分曲线<\/td><td>t↦(t,φᵗ(x)) ⊂ R×M<\/td><\/tr><tr><td>首次积分<\/td><td>∇F·v=0<\/td><\/tr><\/tbody><\/table>\n<h2>线性系统<\/h2>\n<table><thead><tr><th>情形<\/th><th>相图<\/th><\/tr><\/thead><tbody><tr><td>实特征值同号<\/td><td>结点<\/td><\/tr><tr><td>实特征值异号<\/td><td>鞍点<\/td><\/tr><tr><td>复特征值有实部<\/td><td>焦点<\/td><\/tr><tr><td>纯虚<\/td><td>中心<\/td><\/tr><tr><td>重根带若尔当块<\/td><td>退化结点<\/td><\/tr><\/tbody><\/table>\n<table><thead><tr><th>性质<\/th><th>公式<\/th><\/tr><\/thead><tbody><tr><td>算子指数<\/td><td>e^(At)=Σ(At)ᵏ/k!<\/td><\/tr><tr><td>行列式<\/td><td>det e^(At)=e^(t tr A)<\/td><\/tr><tr><td>逆<\/td><td>(e^(At))⁻¹=e^(−At)<\/td><\/tr><\/tbody><\/table>\n<h2>稳定性<\/h2>\n<table><thead><tr><th>谱<\/th><th>结论<\/th><\/tr><\/thead><tbody><tr><td>实部全负<\/td><td>渐近稳定<\/td><\/tr><tr><td>有正实部<\/td><td>不稳定<\/td><\/tr><tr><td>有零实部<\/td><td>临界，线性化失效<\/td><\/tr><\/tbody><\/table>\n<h2>周期系数<\/h2>\n<table><thead><tr><th>结论<\/th><th>内容<\/th><\/tr><\/thead><tbody><tr><td>弗洛凯<\/td><td>Φ(t+T)=Φ(t)M<\/td><\/tr><tr><td>乘子<\/td><td>M 的特征值<\/td><\/t const CROSS = {"doc1": "<h1>跨书总览：常微分方程学习路线<\/h1>\n<h2>推荐学习顺序<\/h2>\n<table><thead><tr><th>顺序<\/th><th>书<\/th><th>为什么在这个位置<\/th><th>能力里程碑<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>王高雄《常微分方程》第四版（01）<\/td><td>国内最通用的本科教材，主线清楚：解法—存在唯一—线性—稳定性—PDE—边值<\/td><td>能独立做出课后基础题，说清八章各解决什么问题<\/td><\/tr><tr><td>2<\/td><td>朱思铭《学习辅导与习题解答》（02）<\/td><td>与 01 逐章对应，把定理翻译成考场动作<\/td><td>看到题目三分钟内能定解法路线<\/td><\/tr><tr><td>3<\/td><td>《第四版习题详解》（03）<\/td><td>与 01、02 同一体系，题量最大，用来巩固<\/td><td>每章能独立完成 80% 习题<\/td><\/tr><tr><td>4<\/td><td>柳彬《常微分方程》（04）<\/td><td>同一层次但更重理论边界：积分因子主线、Peano 定理、变分方程、Sturm 比较<\/td><td>能说清每个定理的条件为什么不能删<\/td><\/tr><tr><td>5<\/td><td>丁同仁、李承治《常微分方程教程》（05）<\/td><td>理论最完整的中文教材：奇解单列、解析理论、定性理论、首次积分<\/td><td>能独立完成证明题，包括皮卡与皮亚诺两套<\/td><\/tr><tr><td>6<\/td><td>庞特里亚金《常微分方程》（06）<\/td><td>工程视角：稳定多项式、复振幅法、电路、调速器、振荡器<\/td><td>能把数学结论翻译成工程判断（会不会振、会不会炸）<\/td><\/tr><tr><td>7<\/td><td>阿诺尔德《常微分方程》（07）<\/td><td>几何视角：相流、向量场、流形、奇点指数<\/td><td>能用相空间语言描述问题，理解&quot;为什么这样选相空间&quot;<\/td><\/tr><\/tbody><\/table>\n<h2>各书定位（一句话）<\/h2>\n<ul><li>\n《01 王高雄》：标准教科书，先把&quot;会算&quot;打牢。\n<\/li><li>\n《02 朱思铭》：解题手册，把知识变成动作。\n<\/li><li>\n《03 习题详解》：题海，练熟练度。\n<\/li><li>\n《04 柳彬》：理论边界的第一次提醒——条件为什么必须。\n<\/li><li>\n《05 丁同仁》：理论完整版，证明链齐全。\n<\/li><li>\n《06 庞特里亚金》：数学落到工程，稳定性有了物理意义。\n<\/li><li>\n《07 阿诺尔德》：几何重构，把方程变成流。\n<\/ul>\n<h2>学习节奏建议<\/h2>\n<ul><li>\n第 1–3 周：01 的前四章 + 02 对应章节，配合 03 刷题。目标是&quot;会算&quot;。\n<\/li><li>\n第 4–5 周：01 的后四章，同时读 04 的对应章节，比较两书对同一概念的处理。\n<\/li><li>\n第 6–8 周：05 的第 3、5、6、8、9 章，补全证明链。这周开始以证明为主，计算题为辅。\n<\/li><li>\n第 9–10 周：06 的第 2、5 章，把稳定性接到工程实例上。\n<\/li><li>\n第 11–12 周：07 的第 1、3、7 章，重建几何直觉。\n<\/li><li>\n每周留半天做交叉复习：用《跨书概念映射表》对照同一概念在各书的讲法。\n<\/ul>\n<h2>总入口<\/h2>\n<p>打开 <code>index.html<\/code> 总学习手册，按顺序推进；每本书的进度独立保存。<\/p>", "doc2": "<h1>跨书概念映射表<\/h1>\n<p>对照各书真实章节整理。空格表示该书未单列此概念（可能散落在其它章节）。<\/p>\n<table><thead><tr><th>概念<\/th><th>01 王高雄<\/th><th>02 朱思铭<\/th><th>03 习题详解<\/th><th>04 柳彬<\/th><th>05 丁同仁<\/th><th>06 庞特里亚金<\/th><th>07 阿诺尔德<\/th><th>口径差异<\/th><\/tr><\/thead><tbody><tr><td>积分因子<\/td><td>第 2 章<\/  第 1/3 章\n<\/li><li>\n任务：以范德波尔方程建模一个电子管振荡器，说明平衡点为什么失稳、极限环为什么稳定、振幅由什么决定。\n<\/li><li>\n评分要点：\n<ol>\n<li>\n线性化给出原点不稳定；\n<\/li><li>\n大振幅处能量耗散，轨线被拉回；\n<\/li><li>\n极限环唯一且稳定；\n<\/li><li>\n能画出相图并标出方向。\n<\/ol>\n<\/ul>\n<h3>题 4：边值问题的可解性<\/h3>\n<ul><li>\n涉及：04 第 7 章、05 第 9 章、03 第 8 章\n<\/li><li>\n任务：对 y″+λy=f，y(0)=y(1)=0，讨论 λ 取何值时无解、唯一解、无穷多解，并用格林函数或特征函数展开写出解。\n<\/li><li>\n评分要点：\n<ol>\n<li>\nλ&lt;0 与 λ&gt;0 非特征值：唯一解；\n<\/li><li>\nλ=n²π²：需 ∫f sin(nπx)=0，否则无解；\n<\/li><li>\n写出展开式系数；\n<\/li><li>\n指出格林函数在共振时不存在。\n<\/ol>\n<\/ul>\n<h3>题 5：一阶 PDE 的两种视角<\/h3>\n<ul><li>\n涉及：01 第 7 章、05 第 10/11 章、07 第 2 章\n<\/li><li>\n任务：解 u_x+u_y=u，u(x,0)=x。分别用首次积分法、特征线法、几何（流箱）三种说法解释解 (x−y)e^y 的来源。\n<\/li><li>\n评分要点：\n<ol>\n<li>\n特征方程组；\n<\/li><li>\n首次积分与任意函数；\n<\/li><li>\n非特征条件验证；\n<\/li><li>\n回代检验。\n<\/ol>\n<\/ul>\n<h2>进阶路线<\/h2>\n<ol><li>\n<strong>偏理论<\/strong>：05 全书 → 阿诺尔德第 7 章 → 常微分方程与动力系统（Hartman、Coddington-Levinson）→ 分支理论与 KAM。\n<\/li><li>\n<strong>偏工程<\/strong>：06 第 2、5 章 → 稳定多项式与劳斯-赫尔维茨 → 控制理论基础（状态空间、李雅普诺夫稳定性、LQR）。\n<\/li><li>\n<strong>偏计算<\/strong>：03 第 8 章 → 数值方法（Runge-Kutta、刚性方程、辛几何算法）→ 用 Python/MATLAB 做相图与分岔图。\n<\/li><li>\n<strong>偏几何<\/strong>：07 全书 → 微分流形与向量场 → 辛几何与哈密顿力学。\n<\/ol>"};
const CROSS_META = [{"key": "doc1", "label": "跨书总览：常微分方程学习路线", "file": "README.md"}, {"key": "doc2", "label": "跨书概念映射表", "file": "跨书概念映射表.md"}, {"key": "doc3", "label": "综合检验建议", "file": "综合检验建议.md"}];
const TABS = [{"key": "cross", "label": "跨书总览"}, {"key": "wanggaoxiong-ode", "label": "常微分方程（王高雄第四版）"}, {"key": "zhusiming-guide", "label": "常微分方程学习辅导与习题解答（朱思铭）"}, {"key": "xitijiexi-ode", "label": "常微分方程（第四版）习题详解"}, {"key": "liubin-ode", "label": "常微分方程（柳彬北大社）"}, {"key": "dingtongren-ode", "label": "常微分方程教程（丁同仁李承治）"}, {"key": "pontryagin-ode", "label": "常微分方程（庞特里亚金）"}, {"key": "arnold-ode", "label": "常微分方程（阿诺尔德）"}];
const FIRST_DOC = "doc1";
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

let cur = {book:'cross', doc:FIRST_DOC, page:'cross'};
const store = {
  get(k){ try{ return JSON.parse(localStorage.getItem(k)||'null') }catch(e){ return null } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)) }catch(e){} }
};
function stKey(book,k){ return 'hb:'+book+':'+k; }
function getState(book){
  return { visited: store.get(stKey(book,'visited'))||[], quiz: store.get(stKey(book,'quiz'))||{}, cards: store.get(stKey(book,'cards'))||{} };
}

/* ---------- 路由 ---------- */
function parseHash(){
  let h = location.hash.replace(/^#\//,'');
  if(!h) return {book:'cross', doc:FIRST_DOC, page:'cross'};
  const p = h.split('/');
  if(p[0]==='cross') return {book:'cross', doc:p[1]||FIRST_DOC, page:'cross'};
  if(p[0]==='book'){
    const key=p[1], page=p.slice(2).join('/')||'path';
    return {book:key, page:page, doc:null};
  }
  return {book:'cross', doc:FIRST_DOC, page:'cross'};
}
function pageIdOf(page){
  if(page==='path') return '__path__';
  if(page==='cards') return '__cards__';
  if(page==='glossary') return '__glossary__';
  if(page==='patterns') return '__patterns__';
  if(page==='cheatsheet') return '__cheatsheet__';
  if(page.startsWith('quiz/')) return '__quiz_'+(page.split('/')[1]||'all')+'__';
  if(page.startsWith('chapter/')) return page.slice(8);
  if(page.startsWith('concept/')) return page.slice(8);
  return page;
}

/* ---------- 顶栏 ---------- */
function renderTabs(){
  const el = $('#tabs'); el.innerHTML='';
  TABS.forEach(t=>{
    const b=document.createElement('button');
    b.className='tab'+(cur.book===t.key?' active':'');
    b.textContent=t.label;
    b.onclick=()=>{ location.hash = t.key==='cross' ? '#/cross/'+FIRST_DOC : '#/book/'+t.key+'/path'; };
    el.appendChild(b);
  });
}

/* ---------- 侧栏 ---------- */
function renderNav(){
  const nav=$('#nav'); nav.innerHTML='';
  const add=(label,href,cls)=>{
    const a=document.createElement('a'); a.className='nav-item'+(cls?' '+cls:''); a.href=href; a.textContent=label;
    nav.appendChild(a); return a;
  };
  const sec=t=>{ const d=document.createElement('div'); d.className='nav-sec'; d.textContent=t; nav.appendChild(d); };

  if(cur.book==='cross'){
    sec(CROSS_META.length>1 ? '跨书总览' : '总览');
    CROSS_META.forEach(c=> add(c.label, '#/cross/'+c.key, cur.doc===c.key?'active':''));
    sec('书籍入口');
    META.forEach(m=> add(m.title, '#/book/'+m.key+'/path'));
    updateProgress(0, CROSS_META.length>1 ? '跨书总览' : '总览');
    return;
  }
  const B=BOOKS[cur.book];
  const S=getState(cur.book);
  const man=B.manifest;
  add('学习路径','#/book/'+cur.book+'/path', cur.page==='path'?'active':'');
  sec('章节');
  (man.chapters||[]).forEach(c=>{
    const id=c.id;
    const a=add(c.title, '#/book/'+cur.book+'/chapter/'+id, cur.page==='chapter/'+id?'active':'');
    if(S.visited.includes(cur.book+'/chapter/'+id)){
      const s=document.createElement('span'); s.className='done'; s.textContent='✓'; a.appendChild(s);
    }
  });
  if((man.concepts||[]).length){
    sec('概念');
    man.concepts.forEach(c=>{
      const a=add(c.title, '#/book/'+cur.book+'/concept/'+c.id, cur.page==='concept/'+c.id?'active':'');
      if(S.visited.includes(cur.book+'/concept/'+c.id)){
        const s=document.createElement('span'); s.className='done'; s.textContent='✓'; a.appendChild(s);
      }
    });
  }
  sec('测验');
  add('全部测验','#/book/'+cur.book+'/quiz/all', cur.page==='quiz/all'?'active':'');
  (man.chapters||[]).forEach(c=>{
    if(!((B.quizCoverage||{})[c.id])) return;
    add('测验：'+c.title, '#/book/'+cur.book+'/quiz/'+c.id, cur.page==='quiz/'+c.id?'active':'');
  });
  sec('复习工具');
  add('抽认卡','#/book/'+cur.book+'/cards', cur.page==='cards'?'active':'');
  add('术语表','#/book/'+cur.book+'/glossary', cur.page==='glossary'?'active':'');
  if(B.rendered['__patterns__']) add('模式库','#/book/'+cur.book+'/patterns', cur.page==='patterns'?'active':'');
  if(B.rendered['__cheatsheet__']) add('速查表','#/book/'+cur.book+'/cheatsheet', cur.page==='cheatsheet'?'active':'');
  sec('其他');
  const m=META.find(x=>x.key===cur.book);
  if(m) add('单独打开学习伴侣 ↗', encodeURI(m.companion));

  updateProgressBook(cur.book);
}

/* ---------- 进度 ---------- */
function updateProgress(pct,label){
  $('#progress-fill').style.width=pct+'%';
  $('#progress-label').textContent=label;
}
function updateProgressBook(book){
  const B=BOOKS[book], S=getState(book);
  const chs=(B.manifest.chapters||[]).length;
  const done=(B.manifest.chapters||[]).filter(c=>S.visited.includes(book+'/chapter/'+c.id)).length;
  const pct=chs?Math.round(done/chs*100):0;
  $('#progress-fill').style.width=pct+'%';
  $('#progress-label').textContent=`《${(META.find(x=>x.key===book)||{}).title||book}》 进度 ${pct}% · 已学 ${done}/${chs} 章`;
}

function renderBook(){
  const B=BOOKS[cur.book];
  if(!B){ $('#view').innerHTML='<div class="empty">书目不存在</div>'; return; }
  const pid=pageIdOf(cur.page);
  let html=B.rendered[pid];
  if(!html){ html='<div class="empty">页面不存在</div>'; }
  const S=getState(cur.book);
  if((cur.page.startsWith('chapter/')||cur.page.startsWith('concept/')) && !S.visited.includes(cur.book+'/'+cur.page)){
    S.visited.push(cur.book+'/'+cur.page);
    store.set(stKey(cur.book,'visited'), S.visited);
  }
  $('#view').innerHTML=html;
  if(cur.page==='cards') initCards();
  if(cur.page==='glossary') initGlossary();
  if(cur.page.startsWith('quiz/')) initQuizzes();
  if(pid==='__path__') updatePath();
  renderMermaid();
}

/* ---------- 测验 ---------- */
function initQuizzes(){
  const B=BOOKS[cur.book];
  document.querySelectorAll('.quiz-item').forEach(item=>{
    const btn=item.querySelector('.quiz-check');
    if(!btn||item.dataset.inited) return;
    item.dataset.inited='1';
    btn.addEventListener('click',()=>{
      const qid=item.dataset.qid, type=item.dataset.type;
      const q=(B.manifest.quizzes||[]).find(x=>x.id===qid); if(!q) return;
      let user=null, correct=false, fb='';
      if(type==='single'){
        const sel=item.querySelector('input:checked');
        user=sel?parseInt(sel.value):null;
        correct=(user===q.answer);
        fb=correct?'✓ 正确':'✗ 错误'+(user==null?'（未作答）':'');
      }else if(type==='multi'){
        user=Array.from(item.querySelectorAll('input:checked')).map(i=>parseInt(i.value)).sort();
        const ans=Array.isArray(q.answer)?q.answer.slice().sort():[q.answer];
        correct=user.length>0 && JSON.stringify(user)===JSON.stringify(ans);
        fb=correct?'✓ 正确':'✗ 错误';
      }else if(type==='blank'){
        const v=(item.querySelector('.quiz-blank').value||'').trim().toLowerCase();
        correct=(v===String(q.answer).trim().toLowerCase());
        fb=correct?'✓ 正确':'✗ 错误'+(v?'':'（未作答）');
      }
      item.querySelectorAll('input:checked').forEach(i=>{
        const val=parseInt(i.value);
        if(Array.isArray(q.answer)?q.answer.includes(val):val===q.answer) i.parentElement.style.color='var(--ok)';
        else i.parentElement.style.color='var(--bad)';
      });
      const feed=item.querySelector('.quiz-feedback');
      feed.className='quiz-feedback '+(correct?'fb-ok':'fb-bad');
      feed.textContent=fb;
      let ex=item.querySelector('.quiz-explain');
      if(!ex){ ex=document.createElement('div'); ex.className='quiz-explain'; item.appendChild(ex); }
      ex.innerHTML='解析：'+esc(q.explain||'');
      const S=getState(cur.book);
      const ch=q.chapterId||'__all__';
      if(!S.quiz[ch]) S.quiz[ch]={n:0};
      S.quiz[ch].n+=1;
      store.set(stKey(cur.book,'quiz'), S.quiz);
    });
  });
}
function updatePath(){
  const B=BOOKS[cur.book], S=getState(cur.book);
  document.querySelectorAll('.path-step').forEach(el=>{
    const step=el.id.replace('path-','');
    const s=(B.manifest.learningPath||[]).find(x=>String(x.step)===step);
    if(s && (s.chapterIds||[]).every(c=>S.visited.includes(cur.book+'/chapter/'+c))){
      el.classList.add('passed');
      if(!el.querySelector('.ck')){ const sp=document.createElement('span'); sp.className='ck done'; sp.textContent=' ✓ 已完成'; el.appendChild(sp); }
    }
  });
}

/* ---------- 抽认卡 ---------- */
let cardIdx=0, cardList=[];
function initCards(){
  const B=BOOKS[cur.book];
  const cards=B.manifest.flashcards||[];
  cardList=cards.slice(); cardIdx=0;
  if(!$('#card-done')){
    const d=document.createElement('div'); d.id='card-done'; d.className='empty';
    d.style.display='none'; d.textContent='本组卡片已全部复习完 🎉';
    const st=$('#card-stage'); if(st) st.appendChild(d);
  }
  const sel=$('#card-filter'); if(!sel) return;
  sel.innerHTML='<option value="">全部</option>';
  [...new Set(cards.map(c=>c.chapterId).filter(Boolean))].forEach(c=>{
    const o=document.createElement('option'); o.value=c;
    const ch=(B.manifest.chapters||[]).find(x=>x.id===c);
    o.textContent=ch?ch.title:c; sel.appendChild(o);
  });
  sel.onchange=()=>{ const v=sel.value; cardList=v?cards.filter(c=>c.chapterId===v):cards.slice(); cardIdx=0; showCard(); };
  $('#flashcard').onclick=()=>$('#flashcard').classList.toggle('flip');
  $('#card-known-btn').onclick=()=>markCard(true);
  $('#card-again-btn').onclick=()=>markCard(false);
  showCard();
}
function showCard(){
  const S=getState(cur.book);
  updateCardCounts();
  const done=$('#card-done'), fc=$('#flashcard');
  if(cardIdx>=cardList.length){
    if(done) done.style.display=''; if(fc) fc.style.display='none'; return;
  }
  if(done) done.style.display='none'; if(fc) fc.style.display='';
  const c=cardList[cardIdx];
  document.querySelector('.fc-front').textContent=c.front;
  document.querySelector('.fc-back').textContent=c.back;
  $('#flashcard').classList.remove('flip');
}
function markCard(known){
  const S=getState(cur.book);
  const c=cardList[cardIdx]; if(!c) return;
  S.cards[c.id]=known?'known':'again';
  store.set(stKey(cur.book,'cards'), S.cards);
  cardIdx++; showCard();
}
function updateCardCounts(){
  const S=getState(cur.book);
  const known=Object.values(S.cards).filter(v=>v==='known').length;
  const again=Object.values(S.cards).filter(v=>v==='again').length;
  const k=$('#card-known'), a=$('#card-again'), l=$('#card-left');
  if(k) k.textContent=known; if(a) a.textContent=again; if(l) l.textContent=Math.max(0,cardList.length-cardIdx);
}

/* ---------- 术语表 ---------- */
function initGlossary(){
  const input=$('#glossary-filter');
  if(!input||input.dataset.inited) return;
  input.dataset.inited='1';
  input.oninput=()=>{
    const v=input.value.trim().toLowerCase();
    document.querySelectorAll('#glossary-list li').forEach(li=>{
      li.style.display=(!v||li.dataset.term.includes(v))?'':'none';
    });
  };
}

/* ---------- 全局搜索 ---------- */
let searchIdx=null;
function buildSearch(){
  if(searchIdx) return searchIdx;
  searchIdx=[];
  META.forEach(m=>{
    const B=BOOKS[m.key];
    Object.entries(B.rendered).forEach(([pid,html])=>{
      if(pid.startsWith('__')) return;
      const text=html.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ');
      searchIdx.push({book:m.key, page:pdfToPage(pid, B), text, label:m.title});
    });
  });
  Object.entries(CROSS).forEach(([k,html])=>{
    const meta=CROSS_META.find(x=>x.key===k)||{};
    searchIdx.push({book:'cross', page:'cross/'+k, text:html.replace(/<[^>]+>/g,' ').replace(/\s+/g,' '), label:(meta.label||'总览')});
  });
  return searchIdx;
}
function pdfToPage(pid, B){
  if(pid.startsWith('__quiz_')) return 'quiz/'+pid.replace('__quiz_','').replace('__','');
  if(pid==='__path__') return 'path';
  if(pid==='__cards__') return 'cards';
  if(pid==='__glossary__') return 'glossary';
  if(pid==='__patterns__') return 'patterns';
  if(pid==='__cheatsheet__') return 'cheatsheet';
  const ch=(B.manifest.chapters||[]).find(c=>c.id===pid);
  if(ch) return 'chapter/'+pid;
  return 'concept/'+pid;
}
$('#q').addEventListener('input', e=>{
  const v=e.target.value.trim().toLowerCase();
  if(!v){ route(); return; }
  const hits=buildSearch().filter(p=>p.text.toLowerCase().includes(v)).slice(0,40);
  $('#view').innerHTML='<h1>搜索结果：'+esc(v)+'</h1>'+
    (hits.length? hits.map(h=>{
      const href=h.book==='cross'?('#/cross/'+(h.page.split('/')[1]||FIRST_DOC)):('#/book/'+h.book+'/'+h.page);
      return `<div class="search-hit"><a href="${href}">${esc(h.label)}</a><br><span style="color:var(--muted);font-size:13px">${esc(h.text.slice(0,200))}</span></div>`;
    }).join('') : '<div class="empty">未找到相关内容，试试章节名 / 概念名 / 术语。</div>');
});

/* ---------- Mermaid ---------- */
let mermaidState='idle';
function renderMermaid(){
  const els=Array.from(document.querySelectorAll('.mermaid')).filter(el=>!el.dataset.rendered);
  if(!els.length) return;
  const run=()=>{ try{
    mermaid.initialize({startOnLoad:false, theme:document.body.dataset.theme==='dark'?'dark':'default'});
    els.forEach((el,idx)=>{ try{
      const out=mermaid.render('mm'+Date.now()+idx, el.textContent);
      if(out && typeof out.then==='function'){
        out.then(r=>{ el.innerHTML=r.svg; el.dataset.rendered='1'; }).catch(()=>{ el.dataset.rendered='0'; });
      } else { el.innerHTML=out; el.dataset.rendered='1'; }
    } catch(e){ el.dataset.rendered='0'; } });
  }catch(e){} };
  if(window.mermaid){ run(); return; }
  if(mermaidState==='loading') return;
  mermaidState='loading';
  const s=document.createElement('script');
  s.src='https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js';
  s.onload=()=>{ mermaidState='loaded'; run(); };
  s.onerror=()=>{ mermaidState='failed'; };
  document.head.appendChild(s);
}

/* ---------- 主题 ---------- */
const themeBtn=$('#theme-btn');
themeBtn.onclick=()=>{
  const d=document.body.dataset.theme==='dark';
  document.body.dataset.theme=d?'':'dark';
  themeBtn.textContent=d?'🌙 深色':'☀️ 浅色';
};

/* ---------- 启动 ---------- */
function route(){
  cur=parseHash();
  renderTabs();
  renderNav();
  if(cur.book==='cross') renderCross(); else renderBook();
  window.scrollTo(0,0);
}
window.addEventListener('hashchange', route);
(function(){
  const sb=document.querySelector('.sidebar'); if(!sb) return;
  const btn=document.createElement('button'); btn.id='nav-toggle'; btn.textContent='目录（点开选择章节）';
  btn.onclick=()=>sb.classList.toggle('open');
  sb.insertBefore(btn, sb.querySelector('#nav'));
  window.addEventListener('hashchange',()=>{ if(window.innerWidth<=820) sb.classList.remove('open'); });
})();
route();
</script>
