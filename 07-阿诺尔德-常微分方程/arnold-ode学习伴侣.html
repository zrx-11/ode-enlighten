io' name='q13' value='3'> 紧 + 自伴<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q14' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 取 h&lt;1/L 的目的？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q14' value='0'> 保证 f 有界<\/label><label class='quiz-opt'><input type='radio' name='q14' value='1'> 使积分算子成为压缩<\/label><label class='quiz-opt'><input type='radio' name='q14' value='2'> 保证解唯一<\/label><label class='quiz-opt'><input type='radio' name='q14' value='3'> 简化记号<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch07__": "<h1>测验：第 7 章：流形、切丛与奇点指数<\/h1><div class='quiz-item' data-qid='q15' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 向量场在流形上的严格定义？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q15' value='0'> 切丛的截面<\/label><label class='quiz-opt'><input type='radio' name='q15' value='1'> 光滑函数<\/label><label class='quiz-opt'><input type='radio' name='q15' value='2'> 坐标映射<\/label><label class='quiz-opt'><input type='radio' name='q15' value='3'> 微分形式<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q16' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 鞍点的指数？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q16' value='0'> +1<\/label><label class='quiz-opt'><input type='radio' name='q16' value='1'> 0<\/label><label class='quiz-opt'><input type='radio' name='q16' value='2'> −1<\/label><label class='quiz-opt'><input type='radio' name='q16' value='3'> −2<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q17' data-type='single'><p class='quiz-q'><b>Q3.<\/b> 球面上向量场总指数？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q17' value='0'> 0<\/label><label class='quiz-opt'><input type='radio' name='q17' value='1'> 1<\/label><label class='quiz-opt'><input type='radio' name='q17' value='2'> 2<\/label><label class='quiz-opt'><input type='radio' name='q17' value='3'> 取决于场<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz___all__": "<h1>测验：__all<\/h1><div class='quiz-item' data-qid='q18' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 阿诺尔德把相空间选择放在首位的理由是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q18' value='0'> 便于计算<\/label><label class='quiz-opt'><input type='radio' name='q18' value='1'> 相空间由物理约束决定，选错会误判轨线<\/label><label class='quiz-opt'><input type='radio' name='q18' value='2'> 节省篇幅<\/label><label class='quiz-opt'><input type='radio' name='q18' value='3'> 历史传统<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q19' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 代数分类与拓扑分类的差别在于？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q19' value='0'> 前者更精确<\/label><label class='quiz-opt'><input type='radio' name='q19' value='1'> 后者更粗但更本质<\/label><label class='quiz-opt'><input type='radio' name='q19' value='2'> 两者等价<\/label><label class='quiz-opt'><input type='radio' name='q19' value='3'> 后者只在平面有效<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__cards__": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "__glossary__": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='确定过程'>确定过程 — 现在决定过去与未来 <span class=glossary-ref>（第 1 章：相空间与相流）<\/span><\/li><li data-term='相空间'>相空间 — 所有可能状态的集合 <span class=glossary-ref>（第 1 章：相空间与相流）<\/span><\/li><li data-term='相流'>相流 — 状态随时间的单参数变换群 <span class=glossary-ref>（第 1 章：相空间与相流）<\/span><\/li><li data-term='相速度场'>相速度场 — 流的无穷小生成元（向量场） <span class=glossary-ref>（第 1 章：相空间与相流）<\/span><\/li><li data-term='扩张相空间'>扩张相空间 — R×M，含时间的空间 <span class=glossary-ref>（第 1 章：相空间与相流）<\/span><\/li><li data-term='积分曲线'>积分曲线 — 扩张相空间中的解曲线 <span class=glossary-ref>（第 1 章：相空间与相流）<\/span><\/li><li data-term='微分同胚'>微分同胚 — 可微且逆也可微的双射 <span class=glossary-ref>（第 1 章：相空间与相流）<\/span><\/li><li data-term='平衡位置'>平衡位置 — 向量场为零的点 <span class=glossary-ref>（第 1 章：相空间与相流）<\/span><\/li><li data-term='流箱'>流箱 — 把常点附近拉直的坐标 <span class=glossary-ref>（第 2 章：常点附近的向量场与首次积分）<\/span><\/li><li data-term='非自治方程'>非自治方程 — 右端显含时间的方程 <span class=glossary-ref>（第 2 章：常点附近的向量场与首次积分）<\/span><\/li><li data-term='相曲线'>相曲线 — 相空间中的轨线 <span class=glossary-ref>（第 2 章：常点附近的向量场与首次积分）<\/span><\/li><li data-term='方向导数'>方向导数 — 沿向量场的变化率 <span class=glossary-ref>（第 2 章：常点附近的向量场与首次积分）<\/span><\/li><li data-term='首次积分'>首次积分 — 沿轨线取常数的函数 <span class=glossary-ref>（第 2 章：常点附近的向量场与首次积分）<\/span><\/li><li data-term='保守系统'>保守系统 — 存在能量守恒的系统 <span class=glossary-ref>（第 2 章：常点附近的向量场与首次积分）<\/span><\/li><li data-term='等能线'>等能线 — 能量相同的点的集合 <span class=glossary-ref>（第 2 章：常点附近的向量场与首次积分）<\/span><\/li><li data-term='算子指数'>算子指数 — 由级数定义的 e^(At) <span class=glossary-ref>（第 3 章：线性系统与算子指数）<\/span><\/li><li data-term='可对角化'>可对角化 — 有足够多线性无关特征向量 <span class=glossary-ref>（第 3 章：线性系统与算子指数）<\/span><\/li><li data-term='若尔当标准形'>若尔当标准形 — 矩阵的标准分块形式 <span class=glossary-ref>（第 3 章：线性系统与算子指数）<\/span><\/li><li data-term='结点'>结点 — 两特征方向都指向/背离的奇点 <span class=glossary-ref>（第 3 章：线性系统与算子指数）<\/span><\/li><li data-term='鞍点'>鞍点 — 一进一出的奇点 <span class=glossary-ref>（第 3 章：线性系统与算子指数）<\/span><\/li><li data-term='焦点'>焦点 — 螺旋进出的奇点 <span class=glossary-ref>（第 3 章：线性系统与算子指数）<\/span><\/li><li data-term='中心'>中心 — 闭合轨线围成的奇点 <span class=glossary-ref>（第 3 章：线性系统与算子指数）<\/span><\/li><li data-term='拓扑分类'>拓扑分类 — 按相图同胚型分类 <span class=glossary-ref>（第 3 章：线性系统与算子指数）<\/span><\/li><li data-term='稳定多项式'>稳定多项式 — 所有根实部为负的多项式 <span class=glossary-ref>（第 4 章：平衡位置的稳定性）<\/span><\/li><li data-term='临界情形'>临界情形 — 特征值有零实部 <span class=glossary-ref>（第 4 章：平衡位置的稳定性）<\/span><\/li><li data-term='双曲平衡点'>双曲平衡点 — 特征值实部全不为零 <span class=glossary-ref>（第 4 章：平衡位置的稳定性）<\/span><\/li><li data-term='单值矩阵'>单值矩阵 — 周期系统走一圈的演化 <span class=glossary-ref>（第 5 章：周期系数系统与常数变易）<\/span><\/li><li data-term='乘子'>乘子 — 单值矩阵的特征值 <span class=glossary-ref>（第 5 章：周期系数系统与常数变易）<\/span><\/li><li data-term='弗洛凯指数'>弗洛凯指数 — 乘子的对数除以周期 <span class=glossary-ref>（第 5 章：周期系数系统与常数变易）<\/span><\/li><li data-term='参数共振'>参数共振 — 周期激励导致指数增长 <span class=glossary-ref>（第 5 章：周期系数系统与常数变易）<\/span><\/li><li data-term='常数变易'>常数变易 — 用基解矩阵构造非齐次解 <span class=glossary-ref>（第 5 章：周期系数系统与常数变易）<\/span><\/li><li data-term='压缩映射'>压缩映射 — 距离严格缩短的映射 <span class=glossary-ref>（第 6 章：存在、唯一与可微性定理）<\/span><\/li><li data-term='完备度量空间'>完备度量空间 — 柯西列都收敛的空间 <span class=glossary-ref>（第 6 章：存在、唯一与可微性定理）<\/span><\/li><li data-term='不动点'>不动点 — T(x)=x 的点 <span class=glossary-ref>（第 6 章：存在、唯一与可微性定理）<\/span><\/li><li data-term='变分方程'>变分方程 — Φ′=f_yΦ <span class=glossary-ref>（第 6 章：存在、唯一与可微性定理）<\/span><\/li><li data-term='微分流形'>微分流形 — 局部像 Rⁿ 的空间 <span class=glossary-ref>（第 7 章：流形、切丛与奇点指数）<\/span><\/li><li data-term='切空间'>切空间 — 一点处所有切向量 <span class=glossary-ref>（第 7 章：流形、切丛与奇点指数）<\/span><\/li><li data-term='切丛'>切丛 — 所有切空间的并 <span class=glossary-ref>（第 7 章：流形、切丛与奇点指数）<\/span><\/li><li data-term='截面'>截面 — 每点取一个切向量的映射 <span class=glossary-ref>（第 7 章：流形、切丛与奇点指数）<\/span><\/li><li data-term='奇点指数'>奇点指数 — 绕奇点一圈的方向净转角 <span class=glossary-ref>（第 7 章：流形、切丛与奇点指数）<\/span><\/li><\/ul>", "__patterns__": "<h1>模式与框架库<\/h1>\n<h2>框架：几何优先<\/h2>\n<p>遇到任何方程，先问三个几何问题：<\/p>\n<ol><li>\n相空间是什么（Rⁿ？柱面？球面？）？\n<\/li><li>\n向量场在哪里为零（奇点）？\n<\/li><li>\n除奇点外，轨线怎么排（流箱、首次积分、等能线）？\n<\/ol>\n<p>这套提问顺序是阿诺尔德全书的骨架。<\/p>\n<h2>框架：局部—奇点二分<\/h2>\n<ul><li>\n常点：流箱拉直，问题化为&quot;读坐标&quot;。\n<\/li><li>\n奇点：线性化 → 谱 → 若临界则另找方法。\n<\/ul>\n<p>一切局部定性结论都落在这两支之一。<\/p>\n<h2>决策规则<\/h2>\n<ul><li>\n判稳：先看是否双曲。双曲看谱，非双曲找守恒量或 V。\n<\/li><li>\n周期系数：算单值矩阵，不算逐点特征值。\n<\/li><li>\n相空间选择：由物理约束定，不由方程定。\n<\/li><li>\n谈&quot;相图类型&quot;：用拓扑分类，不用代数分类。\n<\/ul>\n<h2>反模式<\/h2>\n<ul><li>\n<strong>把相空间默认成 Rⁿ<\/strong>。单摆会因此误判闭合性。\n<\/li><li>\n<strong>对临界情形用线性化下结论<\/strong>。中心可能被扰动成焦点。\n<\/li><li>\n<strong>把&quot;结点&quot;和&quot;焦点&quot;当同一类<\/strong>。拓扑上它们不同。\n<\/li><li>\n<strong>以为指数能判稳定<\/strong>。指数只给拓扑信息。\n<\/ul>", "__cheatsheet__": "<h1>速查表<\/h1>\n<h2>基本对象<\/h2>\n<table><thead><tr><th>对象<\/th><th>定义<\/th><\/tr><\/thead><tbody><tr><td>相流<\/td><td>φᵗ:M→M，φ^(s+t)=φˢ∘φᵗ<\/td><\/tr><tr><td>相速度场<\/td><td>v(x)=d/dt φᵗ(x) at t=0<\/td><\/tr><tr><td>积分曲线<\/td><td>t↦(t,φᵗ(x)) ⊂ R×M<\/td><\/tr><tr><td>首次积分<\/td><td>∇F·v=0<\/td><\/tr><\/tbody><\/table>\n<h2>线性系统<\/h2>\n<table><thead><tr><th>情形<\/th><th>相图<\/th><\/tr><\/thead><tbody><tr><td>实特征值同号<\/td><td>结点<\/td><\/tr><tr><td>实特征值异号<\/td><td>鞍点<\/td><\/tr><tr><td>复特征值有实部<\/td><td>焦点<\/td><\/tr><tr><td>纯虚<\/td><td>中心<\/td><\/tr><tr><td>重根带若尔当块<\/td><td>退化结点<\/td><\/tr><\/tbody><\/table>\n<table><thead><tr><th>性质<\/th><th>公式<\/th><\/tr><\/thead><tbody><tr><td>算子指数<\/td><td>e^(At)=Σ(At)ᵏ/k!<\/td><\/tr><tr><td>行列式<\/td><td>det e^(At)=e^(t tr A)<\/td><\/tr><tr><td>逆<\/td><td>(e^(At))⁻¹=e^(−At)<\/td><\/tr><\/tbody><\/table>\n<h2>稳定性<\/h2>\n<table><thead><tr><th>谱<\/th><th>结论<\/th><\/tr><\/thead><tbody><tr><td>实部全负<\/td><td>渐近稳定<\/td><\/tr><tr><td>有正实部<\/td><td>不稳定<\/td><\/tr><tr><td>有零实部<\/td><td>临界，线性化失效<\/td><\/tr><\/tbody><\/table>\n<h2>周期系数<\/h2>\n<table><thead><tr><th>结论<\/th><th>内容<\/th><\/tr><\/thead><tbody><tr><td>弗洛凯<\/td><td>Φ(t+T)=Φ(t)M<\/td><\/tr><tr><td>乘子<\/td><td>M 的特征值<\/td><\/tr><tr><td>判稳<\/td><td>全模&lt;1 稳定<\/td><\/tr><\/tbody><\/table>\n<h2>压缩映射<\/h2>\n<table><thead><tr><th>条件<\/th><th>结论<\/th><\/tr><\/thead><tbody><tr><td>完备 + q&lt;1<\/td><td>唯一不动点<\/td><\/tr><tr><td>迭代<\/td><td>xₙ₊₁=Txₙ 收敛<\/td><\/tr><\/tbody><\/table>\n<h2>奇点指数<\/h2>\n<table><thead><tr><th>奇点<\/th><th>指数<\/th><\/tr><\/thead><tbody><tr><td>结点<\/td><td>+1<\/td><\/tr><tr><td>焦点<\/td><td>+1<\/td><\/tr><tr><td>中心<\/td><td>+1<\/td><\/tr><tr><td>鞍点<\/td><td>−1<\/td><\/tr><tr><td>球面总指数<\/td><td>2<\/td><\/tr><\/tbody><\/table>"}};
const pages = DATA.rendered;
const manifest = DATA.manifest;
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const SLUG = manifest.slug || 'book';
const store = {
  get(k){ try{ return JSON.parse(localStorage.getItem(SLUG+':'+k)||'null') }catch(e){ return null } },
  set(k,v){ try{ localStorage.setItem(SLUG+':'+k, JSON.stringify(v)) }catch(e){} }
};
let state = { visited: store.get('visited')||[], quiz: store.get('quiz')||{}, cards: store.get('cards')||{} };

/* ---------- 导航 ---------- */
function renderNav(){
  const nav = $('#nav'); nav.innerHTML='';
  const build = items => items.forEach(it=>{
    if(it.children){
      const sec=document.createElement('div'); sec.className='nav-sec'; sec.textContent=it.label; nav.appendChild(sec);
      it.children.forEach(c=>{
        const a=document.createElement('a'); a.className='nav-item'; a.href=c.href; a.textContent=c.label;
        const id=routeId(c.href);
        if(state.visited.includes(id)) a.innerHTML = esc(c.label)+' <span class="done">✓</span>';
        nav.appendChild(a);
      });
    }else{
      const a=document.createElement('a'); a.className='nav-item'; a.href=it.href; a.textContent=it.label;
      const id=routeId(it.href);
      if(state.visited.includes(id)) a.innerHTML = esc(it.label)+' <span class="done">✓</span>';
      nav.appendChild(a);
    }
  });
  build(DATA.nav);
  updateProgress();
}
function routeId(href){ return href.replace('#/',''); }

/* ---------- 路由 ---------- */
function routeIdFromHash(){
  let h = location.hash.replace(/^#\//,'');
  if(!h) return 'path';
  if(h==='path') return 'path';
  const m = h.match(/^(chapter|concept)\/(.+)$/);
  if(m) return m[1]+'/'+m[2];
  return h; // quiz/all, quiz/ch01, cards, glossary, patterns, cheatsheet
}
function showPage(rid){
  const id = rid==='path' ? '__path__' : rid.startsWith('quiz/') ? '__quiz_'+rid.split('/')[1]+'__' : rid==='cards'?'__cards__':rid==='glossary'?'__glossary__':rid==='patterns'?'__patterns__':rid==='cheatsheet'?'__cheatsheet__':rid.startsWith('chapter/')?rid.split('/')[1]:rid.startsWith('concept/')?rid.split('/')[1]:rid;
  const html = pages[id] || '<div class="empty">页面不存在</div>';
  $('#view').innerHTML = html;
  document.querySelectorAll('.nav-item').forEach(a=>a.classList.toggle('active', routeId(a.getAttribute('href'))===rid));
  if(!state.visited.includes(rid) && (rid.startsWith('chapter/')||rid.startsWith('concept/'))){
    state.visited.push(rid); store.set('visited', state.visited); renderNav();
  }
  window.scrollTo(0,0);
  if(rid==='cards') initCards();
  if(rid==='glossary') initGlossary();
  if(rid.startsWith('quiz')) initQuizzes(rid);
  if(id==='__path__') updatePath();
  renderMermaid();
}

/* ---------- 进度 ---------- */
function updateProgress(){
  const chs = (manifest.chapters||[]).length;
  const done = (manifest.chapters||[]).filter(c=>state.visited.includes('chapter/'+c.id)).length;
  const pct = chs? Math.round(done/chs*100) : 0;
  $('#progress-fill').style.width = pct+'%';
  $('#progress-label').textContent = `进度 ${pct}% · 已学 ${done}/${chs} 章`;
}
function updatePath(){
  document.querySelectorAll('.path-step').forEach(el=>{
    const step = el.id.replace('path-','');
    const s = (manifest.learningPath||[]).find(x=>x.step===step);
    if(s && (s.chapterIds||[]).every(c=>state.visited.includes('chapter/'+c))){
      el.classList.add('passed');
      const lbl = el.querySelector('.checkpoint-ok'); if(!lbl){ const sp=document.createElement('span'); sp.className='done'; sp.textContent=' ✓ 已完成'; el.appendChild(sp); }
    }
  });
}

/* ---------- 测验 ---------- */
function initQuizzes(rid){
  document.querySelectorAll('.quiz-item').forEach(item=>{
    const btn = item.querySelector('.quiz-check');
    if(!btn || item.dataset.inited){ return }
    item.dataset.inited='1';
    btn.addEventListener('click', ()=>{
      const qid = item.dataset.qid; const type = item.dataset.type;
      const q = (manifest.quizzes||[]).find(x=>x.id===qid); if(!q) return;
      let user, correct=false, fb;
      if(type==='single'){
        const sel = item.querySelector('input:checked');
        user = sel? parseInt(sel.value) : null;
        correct = user===q.answer;
        fb = correct?'✓ 正确':'✗ 错误'+(user==null?'（未作答）':'');
      } else if(type==='multi'){
        user = Array.from(item.querySelectorAll('input:checked')).map(i=>parseInt(i.value)).sort();
        const ans = Array.isArray(q.answer)? q.answer.slice().sort(): [q.answer];
        correct = user.length>0 && JSON.stringify(user)===JSON.stringify(ans);
        fb = correct?'✓ 正确':'✗ 错误';
      } else if(type==='blank'){
        const v = (item.querySelector('.quiz-blank').value||'').trim().toLowerCase();
        const a = String(q.answer).trim().toLowerCase();
        correct = v===a;
        fb = correct?'✓ 正确':'✗ 错误'+(v?'':'（未作答）');
      }
      item.querySelectorAll('input:checked').forEach(i=>{
        const val=parseInt(i.value);
        if(Array.isArray(q.answer)? q.answer.includes(val) : val===q.answer) i.parentElement.style.color='var(--ok)';
        else i.parentElement.style.color='var(--bad)';
      });
      const feed = item.querySelector('.quiz-feedback');
      feed.className = 'quiz-feedback '+(correct?'fb-ok':'fb-bad');
      feed.textContent = fb;
      let ex = item.querySelector('.quiz-explain');
      if(!ex){ ex=document.createElement('div'); ex.className='quiz-explain'; item.appendChild(ex); }
      ex.innerHTML = '解析：' + esc(q.explain||'');
      // 记录成绩（按章聚合）
      const ch = q.chapterId||'__all__';
      if(!state.quiz[ch]) state.quiz[ch]={done:0,total:0};
      state.quiz[ch].done = Math.min(state.quiz[ch].total+1, state.quiz[ch].done+1);
      state.quiz[ch].total += 1;
      store.set('quiz', state.quiz);
    });
  });
}

/* ---------- 抽认卡 ---------- */
let cardIdx = 0, cardList = [];
function initCards(){
  const cards = manifest.flashcards||[];
  cardList = cards.slice();
  cardIdx = 0;
  const sel = $('#card-filter');
  sel.innerHTML = '<option value="">全部</option>';
  [...new Set(cards.map(c=>c.chapterId).filter(Boolean))].forEach(c=>{
    const o=document.createElement('option'); o.value=c; o.textContent=manifestChTitle(c); sel.appendChild(o);
  });
  sel.onchange = ()=>{ const v=sel.value; cardList = v? cards.filter(c=>c.chapterId===v): cards.slice(); cardIdx=0; showCard(); };
  $('#flashcard').onclick = ()=>$('#flashcard').classList.toggle('flip');
  $('#card-known-btn').onclick = ()=>{ markCard(true); };
  $('#card-again-btn').onclick = ()=>{ markCard(false); };
  showCard();
}
function showCard(){
  updateCardCounts();
  if(cardIdx>=cardList.length){ $('#card-stage').innerHTML='<div class="empty">本组卡片已全部复习完 🎉</div>'; return; }
  const c = cardList[cardIdx];
  document.querySelector('.fc-front').textContent = c.front;
  document.querySelector('.fc-back').textContent = c.back;
  $('#flashcard').classList.remove('flip');
}
function markCard(known){
  const c = cardList[cardIdx]; if(!c) return;
  state.cards[c.id] = known?'known':'again';
  store.set('cards', state.cards);
  cardIdx++; showCard();
}
function updateCardCounts(){
  const known = Object.values(state.cards).filter(v=>v==='known').length;
  const again = Object.values(state.cards).filter(v=>v==='again').length;
  $('#card-known').textContent = known;
  $('#card-again').textContent = again;
  $('#card-left').textContent = Math.max(0, cardList.length-cardIdx);
}
function manifestChTitle(id){
  const c=(manifest.chapters||[]).find(x=>x.id===id); return c? c.title : id;
}

/* ---------- 术语表 ---------- */
function initGlossary(){
  const input = $('#glossary-filter');
  if(!input || input.dataset.inited) return;
  input.dataset.inited='1';
  input.oninput = ()=>{
    const v = input.value.trim().toLowerCase();
    document.querySelectorAll('#glossary-list li').forEach(li=>{
      li.style.display = (!v || li.dataset.term.includes(v)) ? '' : 'none';
    });
  };
}

/* ---------- 搜索 ---------- */
let searchIndex = null;
function buildSearchIndex(){
  if(searchIndex) return searchIndex;
  searchIndex = [];
  Object.entries(pages).forEach(([id, htmlText])=>{
    if(id.startsWith('__')) return;
    const text = htmlText.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ');
    searchIndex.push({id, text});
  });
  return searchIndex;
}
$('#q').addEventListener('input', e=>{
  const v = e.target.value.trim().toLowerCase();
  if(!v){ showPage(routeIdFromHash()); return; }
  buildSearchIndex();
  const hits = searchIndex.filter(p=>p.text.toLowerCase().includes(v)).slice(0,20);
  const label = id => id.startsWith('chapter/')? ('章节：'+manifestChTitle(id.split('/')[1])) : id.startsWith('concept/')? ('概念：'+id.split('/')[1]) : id;
  $('#view').innerHTML = '<h1>搜索结果：'+esc(v)+'</h1>' +
    (hits.length? hits.map(h=>`<div class="search-hit"><a href="#/${h.id}">${esc(label(h.id))}</a><br><span class="sub">${esc(h.text.slice(0,180))}</span></div>`).join('')
                 : '<div class="empty">未找到相关页面，试试章节名/概念名/术语。</div>');
});

/* ---------- Mermaid 懒加载（联网渲染，离线显示源码） ---------- */
function renderMermaid(){
  if(!document.querySelector('.mermaid')) return;
  const s=document.createElement('script');
  s.src='https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js';
  s.onload=()=>{ try{
    mermaid.initialize({startOnLoad:false, theme: matchMedia('(prefers-color-scheme: dark)').matches?'dark':'default'});
    document.querySelectorAll('.mermaid').forEach(el=>{
      const code=el.textContent;
      mermaid.render('mm'+Math.random().toString(36).slice(2), code)
        .then(({svg})=>{ el.innerHTML=svg; })
        .catch(()=>{ el.textContent=code; });
    });
  }catch(e){} };
  document.head.appendChild(s);
}

/* ---------- 深色模式 ---------- */
const themeBtn=$('#theme-btn');
themeBtn.onclick=()=>{
  const d = document.body.dataset.theme==='dark';
  document.body.dataset.theme = d? '' : 'dark';
  themeBtn.textContent = d? '🌙 深色' : '☀️ 浅色';
};

/* ---------- 启动 ---------- */
renderNav();
window.addEventListener('hashchange', ()=>showPage(routeIdFromHash()));
(function(){
  const sb=document.querySelector('.sidebar'); if(!sb) return;
  const btn=document.createElement('button'); btn.id='nav-toggle'; btn.textContent='目录（点开选择章节）';
  btn.onclick=()=>sb.classList.toggle('open');
  sb.insertBefore(btn, sb.querySelector('#nav'));
  window.addEventListener('hashchange',()=>{ if(window.innerWidth<=760) sb.classList.remove('open'); });
})();
showPage(routeIdFromHash());
</script>
