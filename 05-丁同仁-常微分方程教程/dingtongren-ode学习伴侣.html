<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>常微分方程教程（丁同仁·李承治）</title>
<style>
:root{
  --bg:#f7f7f8; --panel:#ffffff; --text:#1f2328; --muted:#6b7280;
  --accent:#2563eb; --accent-soft:#dbeafe; --border:#e5e7eb;
  --ok:#16a34a; --bad:#dc2626; --code-bg:#f3f4f6;
}
[data-theme="dark"]{
  --bg:#111318; --panel:#1a1d24; --text:#e5e7eb; --muted:#9ca3af;
  --accent:#60a5fa; --accent-soft:#1e3a5f; --border:#2d333d;
  --ok:#4ade80; --bad:#f87171; --code-bg:#20242c;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text);line-height:1.7;font-size:15px}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
.layout{display:flex;min-height:100vh}
.sidebar{width:290px;flex:none;background:var(--panel);border-right:1px solid var(--border);
  padding:14px;position:sticky;top:0;height:100vh;overflow-y:auto}
.sidebar h1{font-size:17px;margin:2px 0 2px}
.sidebar .sub{font-size:12px;color:var(--muted);margin-bottom:10px}
#q{width:100%;padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);margin-bottom:10px}
.nav-sec{font-size:12px;color:var(--muted);margin:12px 0 4px;text-transform:uppercase;letter-spacing:.4px}
.nav-item{display:block;padding:5px 10px;border-radius:6px;color:var(--text);font-size:14px}
.nav-item:hover{background:var(--accent-soft);text-decoration:none}
.nav-item.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav-item .done{float:right;color:var(--ok);font-size:12px}
#nav-toggle{display:none}
.main{flex:1;min-width:0;padding:28px 40px 80px;max-width:920px}
.page h1{font-size:26px;border-bottom:2px solid var(--border);padding-bottom:8px;margin-top:0}
.page h2{font-size:20px;margin-top:26px}
.page h3{font-size:17px;margin-top:22px}
.page table{border-collapse:collapse;width:100%;margin:12px 0;font-size:14px}
.page th,.page td{border:1px solid var(--border);padding:6px 10px;text-align:left}
.page th{background:var(--code-bg)}
.page code{background:var(--code-bg);padding:2px 5px;border-radius:4px;font-size:.9em}
.page pre{background:var(--code-bg);padding:12px;border-radius:8px;overflow-x:auto;font-size:13px}
.page pre code{background:none;padding:0}
.page blockquote{border-left:4px solid var(--accent);margin:12px 0;padding:6px 14px;background:var(--accent-soft);border-radius:0 6px 6px 0}
.page blockquote blockquote{border-color:var(--muted)}
.page img{max-width:100%}
.mermaid{background:var(--code-bg);padding:14px;border-radius:8px;overflow-x:auto;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;white-space:pre;color:var(--muted)}
.mermaid-hint{font-size:12px;color:var(--muted);margin:4px 0 14px}
svg{max-width:100%;height:auto}
.quiz-item{border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin:14px 0;background:var(--panel)}
.quiz-q{margin:0 0 8px;font-weight:500}
.quiz-opts label{display:block;padding:4px 0;cursor:pointer}
.quiz-blank{width:60%;padding:6px 10px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text)}
.quiz-check{margin-top:10px;padding:6px 16px;border:none;border-radius:6px;background:var(--accent);color:#fff;cursor:pointer}
.quiz-feedback{margin-left:12px;font-size:13px}
.fb-ok{color:var(--ok)}.fb-bad{color:var(--bad)}
.quiz-explain{margin-top:8px;font-size:13px;color:var(--muted);border-top:1px dashed var(--border);padding-top:6px}
.flashcard{perspective:1200px;margin:24px auto;max-width:520px;cursor:pointer;user-select:none}
.fc-inner{position:relative;width:100%;height:240px;transform-style:preserve-3d;transition:transform .5s}
.flashcard.flip .fc-inner{transform:rotateY(180deg)}
.fc-front,.fc-back{position:absolute;inset:0;backface-visibility:hidden;display:flex;align-items:center;justify-content:center;
  padding:22px;border-radius:14px;border:1px solid var(--border);background:var(--panel);font-size:16px;text-align:center}
.fc-back{transform:rotateY(180deg);background:var(--accent-soft);color:var(--text)}
.card-controls{display:flex;gap:14px;align-items:center;margin:12px 0;flex-wrap:wrap}
.card-actions{display:flex;gap:12px;justify-content:center}
.card-actions button{padding:8px 22px;border:none;border-radius:8px;cursor:pointer;font-size:14px}
#card-known-btn{background:var(--ok);color:#fff}
#card-again-btn{background:var(--bad);color:#fff}
.card-counts{color:var(--muted);font-size:13px}
.path-step{margin:8px 0;padding:10px 12px;border:1px solid var(--border);border-radius:8px;background:var(--panel)}
.path-step.passed{border-color:var(--ok)}
#glossary-filter{width:100%;max-width:380px;padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);margin-bottom:10px}
#glossary-list li{padding:6px 0;border-bottom:1px dashed var(--border)}
.glossary-ref{color:var(--muted);font-size:12px}
.search-hit{margin:10px 0}
.topbar{position:sticky;top:0;background:var(--bg);padding:8px 0;display:flex;justify-content:flex-end;z-index:10}
#theme-btn{border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:8px;padding:5px 12px;cursor:pointer;white-space:nowrap}
#progress-bar{height:5px;background:var(--border);border-radius:3px;margin:8px 0;overflow:hidden}
#progress-bar>div{height:100%;width:0;background:var(--accent);transition:width .3s}
.empty{color:var(--muted);padding:20px 0}
@media print{.sidebar,.topbar,.quiz-actions,.card-actions,.card-controls{display:none!important}.main{max-width:none;padding:0}}
@media (max-width:760px){.sidebar{width:100%;height:auto;position:static;padding:10px 14px}
  #nav{display:none}.sidebar.open #nav{display:block}
  #nav-toggle{display:block;width:100%;padding:8px 10px;margin:4px 0;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:14px;text-align:left;cursor:pointer}
  .layout{flex-direction:column}.main{padding:16px}}
</style>
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <h1>常微分方程教程（丁同仁·李承治）</h1>
    <div class="sub">理论完整版：从皮卡到定性理论</div>
    <div id="progress-bar"><div id="progress-fill"></div></div>
    <div class="sub" id="progress-label">进度 0%</div>
    <input id="q" type="search" placeholder="搜索章节 / 概念 / 术语 / 全文…">
    <nav id="nav"></nav>
  </aside>
  <main class="main">
    <div class="topbar"><button id="theme-btn">🌙 深色</button></div>
    <div id="view" class="page"></div>
  </main>
</div>

tions": ["保证迭代不跑出矩形", "保证唯一", "保证收敛速度", "无关紧要"], "answer": 0, "explain": "使 |φₙ−y₀|≤Mh≤b。"}, {"id": "q06", "chapterId": "ch03", "type": "single", "question": "皮亚诺定理比皮卡定理弱在哪？", "options": ["不保证存在", "不保证唯一", "不保证连续", "不保证可微"], "answer": 1, "explain": "只要求连续，因此只保证存在。"}, {"id": "q07", "chapterId": "ch04", "type": "single", "question": "奇解的必要条件之一是？", "options": ["与通解族相切", "是常数解", "是多项式", "定义在全实轴"], "answer": 0, "explain": "三个条件：是解、相切、不在族内。"}, {"id": "q08", "chapterId": "ch04", "type": "single", "question": "奇解处李普希茨条件必然？", "options": ["成立", "失效", "无关", "需验证"], "answer": 1, "explain": "否则唯一性禁止两条曲线相切而过。"}, {"id": "q09", "chapterId": "ch05", "type": "single", "question": "连续依赖估计中的放大因子？", "options": ["e^(L|x−x₀|)", "L", "M", "1"], "answer": 0, "explain": "格朗沃尔引理给出。"}, {"id": "q10", "chapterId": "ch05", "type": "single", "question": "解对参数可微时，方程比变分方程多哪项？", "options": ["f_x", "f_μ", "f_y", "常数项"], "answer": 1, "explain": "参数直接进入方程产生源项。"}, {"id": "q11", "chapterId": "ch06", "type": "single", "question": "齐次线性方程组解空间维数是？", "options": ["1", "m", "n", "无穷"], "answer": 1, "explain": "等于未知量个数。"}, {"id": "q12", "chapterId": "ch06", "type": "single", "question": "常数变易公式中 Φ⁻¹ 的作用？", "options": ["求逆矩阵", "把非齐次项翻译成基坐标", "归一化", "判可逆"], "answer": 1, "explain": "相当于坐标变换。"}, {"id": "q13", "chapterId": "ch07", "type": "single", "question": "柯西定理要求右端？", "options": ["连续", "李普希茨", "解析", "有界"], "answer": 2, "explain": "解析性给出解析解。"}, {"id": "q14", "chapterId": "ch07", "type": "single", "question": "正则奇点的指标方程形式？", "options": ["r²+p₀r+q₀=0", "r(r−1)+p₀r+q₀=0", "r+p₀=0", "r²=q₀"], "answer": 1, "explain": "由最低次幂系数为零得到。"}, {"id": "q15", "chapterId": "ch08", "type": "single", "question": "p=0、q>0 的线性平面系统是？", "options": ["鞍点", "结点", "中心", "焦点"], "answer": 2, "explain": "特征值纯虚。"}, {"id": "q16", "chapterId": "ch08", "type": "single", "question": "第二方法判渐近稳定的条件？", "options": ["V 正定，V̇ 负半定", "V 正定，V̇ 负定", "V 负定", "V̇=0"], "answer": 1, "explain": "负半定只能给稳定。"}, {"id": "q17", "chapterId": "ch09", "type": "single", "question": "y″+y=0，y(0)=0，y(π)=1 的解？", "options": ["唯一", "两个", "无解", "无穷多"], "answer": 2, "explain": "A sin π=0≠1，矛盾。"}, {"id": "q18", "chapterId": "ch09", "type": "single", "question": "弗雷德霍姆二择一的内容？", "options": ["齐次零解 ⇔ 非齐次唯一可解", "齐次有解 ⇔ 非齐次有解", "总是有解", "总是无解"], "answer": 0, "explain": "线性算子可逆性的等价表述。"}, {"id": "q19", "chapterId": "ch10", "type": "single", "question": "F=x²+y² 是 x′=−y、y′=x 的首次积分吗？", "options": ["是", "否", "只在一处", "无法判断"], "answer": 0, "explain": "∇F·X=−2xy+2xy=0。"}, {"id": "q20", "chapterId": "ch10", "type": "single", "question": "n 维系统独立首次积分最多几个？", "options": ["n", "n−1", "n+1", "无穷"], "answer": 1, "explain": "维数计数。"}, {"id": "q21", "chapterId": "ch11", "type": "single", "question": "齐次 PDE 通解形式？", "options": ["u=F(Φ)", "u=Φ", "u=常数", "u=x+y"], "answer": 0, "explain": "Φ 为首次积分。"}, {"id": "q22", "chapterId": "ch11", "type": "single", "question": "非特征条件的作用？", "options": ["保证解唯一确定", "保证解存在", "保证解光滑", "保证解有界"], "answer": 0, "explain": "切向不能与特征向重合。"}, {"id": "q23", "chapterId": "__all", "type": "single", "question": "这本书把奇解单列一章的理由是？", "options": ["奇解是独立技巧", "奇解是唯一性失效的几何体现", "奇解常见", "奇解可求"], "answer": 1, "explain": "放在存在唯一性之后才讲得通。"}, {"id": "q24", "chapterId": "__all", "type": "single", "question": "皮卡与皮亚诺两条证明路线的根本差别是？", "options": ["构造 vs 紧性", "实数 vs 复数", "线性 vs 非线性", "局部 vs 整体"], "answer": 0, "explain": "迭代构造 vs Ascoli 紧性。"}], "flashcards": [{"id": "f01", "chapterId": "ch01", "front": "解为何必须在区间上定义？", "back": "因为解要在区间上恒等成立，端点处可能无定义。", "tags": ["定义"]}, {"id": "f02", "chapterId": "ch01", "front": "通解为什么含 n 个常数？", "back": "n 阶方程要积 n 次分。", "tags": ["理解"]}, {"id": "f03", "chapterId": "ch02", "front": "恰当方程判据？", "back": "P_y=Q_x。", "tags": ["判据"]}, {"id": "f04", "chapterId": "ch02", "front": "μ 只依赖 x 的判据？", "back": "(P_y−Q_x)/Q 只含 x。", "tags": ["公式"]}, {"id": "f05", "chapterId": "ch03", "front": "皮卡四步？", "back": "积分方程、迭代、阶乘估计、收敛加格朗沃尔。", "tags": ["证明"]}, {"id": "f06", "chapterId": "ch03", "front": "皮亚诺用哪条紧性定理？", "back": "Ascoli-Arzelà。", "tags": ["证明"]}, {"id": "f07", "chapterId": "ch04", "front": "奇解三条件？", "back": "是解、相切、不在族内。", "tags": ["定义"]}, {"id": "f08", "chapterId": "ch04", "front": "判别式之后必须做什么？", "back": "回代检验是否为解。", "tags": ["易错"]}, {"id": "f09", "chapterId": "ch05", "front": "变分方程初值？", "back": "I。", "tags": ["公式"]}, {"id": "f10", "chapterId": "ch05", "front": "证明可微性为何要先做差商估计？", "back": "不能直接交换求导与积分。", "tags": ["方法"]}, {"id": "f11", "chapterId": "ch06", "front": "齐次方程组解空间维数？", "back": "m。", "tags": ["定理"]}, {"id": "f12", "chapterId": "ch06", "front": "常数变易公式？", "back": "y=Φ[C+∫Φ⁻¹f]。", "tags": ["公式"]}, {"id": "f13", "chapterId": "ch07", "front": "柯西定理结论？", "back": "解析右端 ⇒ 解析解。", "tags": ["定理"]}, {"id": "f14", "chapterId": "ch07", "front": "指标方程两根差整数时会怎样？", "back": "第二个解可能带对数。", "tags": ["例外"]}, {"id": "f15", "chapterId": "ch08", "front": "双曲平衡点定义？", "back": "特征值实部全不为零。", "tags": ["定义"]}, {"id": "f16", "chapterId": "ch08", "front": "庞加莱-本迪克松三条件？", "back": "平面、捕获域、无平衡点。", "tags": ["定理"]}, {"id": "f17", "chapterId": "ch09", "front": "二择一内容？", "back": "齐次零解 ⇔ 非齐次唯一可解。", "tags": ["定理"]}, {"id": "f18", "chapterId": "ch09", "front": "S-L 特征函数正交的权？", "back": "ρ(x)。", "tags": ["公式"]}, {"id": "f19", "chapterId": "ch10", "front": "首次积分条件式？", "back": "X·∇F=0。", "tags": ["定义"]}, {"id": "f20", "chapterId": "ch10", "front": "Volterra 为何有闭轨？", "back": "首次积分等值线闭合。", "tags": ["应用"]}, {"id": "f21", "chapterId": "ch11", "front": "齐次 PDE 通解？", "back": "u=F(Φ)。", "tags": ["公式"]}, {"id": "f22", "chapterId": "ch11", "front": "非特征条件？", "back": "a dy₀/dτ−b dx₀/dτ≠0。", "tags": ["判据"]}], "companion": "dingtongren-ode学习伴侣.html"}, "pages": {"ch01": {"html": "<h1>第 1 章：基本概念<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★☆☆ | <strong>预估学时<\/strong>：2 小时 | <strong>前置<\/strong>：微积分\n<\/li><li>\n<strong>对应原书<\/strong>：第一章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n用&quot;联系自变量、未知函数及导数&quot;的定义识别方程，并排除 y(x)=y(y(x)) 这类伪方程；\n<\/li><li>\n说清解的定义里&quot;在区间上恒等成立&quot;为什么必须强调区间；\n<\/li><li>\n理解 n 阶方程通解含 n 个常数的&quot;积分来源&quot;解释；\n<\/li><li>\n用自由落体的例子说明为什么&quot;没有定解条件的方程有无穷多解&quot;。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>丁同仁这一章刻意写得极简：只给定义和几何解释，把建模例子推后。<strong>它想让你先分清&quot;方程&quot;和&quot;解的区间&quot;这两个对象，再谈求解。<\/strong><\/p>\n<h2>零基础讲解<\/h2>\n<h3>1.1 定义里的两个坑<\/h3>\n<p>定义：F(x, y, y′, …, y⁽ⁿ⁾)=0 叫常微分方程，最高阶导数的阶叫阶。<\/p>\n<p>坑一：y(x)=y(y(x)) 不是常微分方程。因为右边是 y 在另一点的值，不是导数。教材专门点出这一点，是因为&quot;函数方程&quot;和&quot;微分方程&quot;容易混。<\/p>\n<p>坑二：解必须在<strong>区间<\/strong>上定义。y=1/x 是 y′=−y² 在 (0,+∞) 上的解，在 (−∞,0) 上也是，但不能说它在 R 上是解（0 点没定义）。<\/p>\n<h3>1.2 解与通解<\/h3>\n<p><strong>解<\/strong>：φ 在区间 I 上有直到 n 阶导数，代入后对一切 x∈I 成为恒等式。<\/p>\n<p><strong>通解<\/strong>：含 n 个独立常数的解族。教材在这里给了一个&quot;积分来源&quot;的解释：n 阶方程要积 n 次分，每次产生一个常数，所以通解该有 n 个常数。这是启发式，严格证明推迟到第十章。<\/p>\n<p>这个解释很重要，因为它说明了为什么&quot;通解&quot;这个概念天生带有&quot;不严格&quot;的色彩——它是从积分操作推出来的，而不是从解集结构证明出来的。<\/p>\n<h3>1.3 自由落体：为什么必须给初值<\/h3>\n<p>方程 y″=−g。积分两次：<\/p>\n<div class=\"eq\">y′ = −g t + C₁，y = −g t²/2 + C₁ t + C₂<\/div>\n<p>两个常数，对应&quot;从多高开始&quot;和&quot;初速度多少&quot;。不给定这两个数，方程描述的是&quot;所有自由落体运动&quot;的集合，不是一个具体运动。给定 y(0)=y₀、y′(0)=v₀，才有唯一解。<\/p>\n<blockquote>类比：方程是&quot;运动规律&quot;，初值是&quot;这次运动的档案&quot;。规律对所有下落都成立，档案只对这一次成立。<\/blockquote>\n<h3>1.4 几何解释：积分曲线<\/h3>\n<p>一阶方程 y′=f(x,y) 的每个解在平面上是一条曲线（积分曲线）。曲线在点 (x₀,y₀) 的斜率必须等于 f(x₀,y₀)——这是解的几何刻画。<\/p>\n<p>教材由此引出线素场、等斜线、奇异点，与其它教材一致，但更强调&quot;奇异点处方程不再定义方向，必须单独分析&quot;。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n    A[方程 F=0] --&gt; B[解族]\n    B --&gt; C[含 n 个常数]\n    C --&gt; D[初值条件]\n    D --&gt; E[唯一解]\n    B --&gt; F[奇异点处需单独分析]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：左上到右下是&quot;从方程到具体解&quot;的路径；右侧分支提醒你，奇异点不在这个流程的覆盖范围内。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：n 阶方程像一个 n 次积分任务，每积一次留下一个&quot;待定系数&quot;，初值就是把这些系数逐个钉死的钉子。<\/p>\n<p><strong>失效边界<\/strong>：如果方程不可积（大多数非线性方程都不可积），&quot;n 次积分&quot;的图景就不成立，但&quot;通解含 n 个常数&quot;的结论仍由存在唯一性定理保证。<\/p>\n<p><strong>实例<\/strong>：验证 y=Ce^(−2x)+x/2−1/4 是 y′+2y=x 的通解。 y′=−2Ce^(−2x)+1/2，y′+2y=(−2Ce^(−2x)+1/2)+2(Ce^(−2x)+x/2−1/4)=1/2+x−1/2=x。成立。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为&quot;解可以定义在整个实轴上&quot;<\/strong>——实际上要在使表达式有意义的区间上讨论。\n<\/li><li>\n<strong>别以为&quot;方程里导数符号出现几次就是几阶&quot;<\/strong>——实际上看最高阶。\n<\/li><li>\n<strong>别以为&quot;通解包含所有解&quot;<\/strong>——实际上可能漏掉奇解（教材在第四章专门处理）。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\ny(x)=y(x+1) 是常微分方程吗？\n<p>（答案：不是。解析：方程里没有导数，这是函数方程。）<\/p>\n<\/ol>\n<ol><li>\ny=1/x 是 y′=−y² 的解，它的最大存在区间是什么？\n<p>（答案：(0,+∞) 或 (−∞,0)，取决于初值所在的一侧。解析：x=0 处无定义。）<\/p>\n<\/ol>\n<ol><li>\n自由落体方程 y″=−g 的通解为什么有两个常数？\n<p>（答案：需要积分两次，每次产生一个常数。解析：对应初始位置与初始速度。）<\/p>\n<\/ol>\n<ol><li>\n积分曲线上某点的斜率由什么决定？\n<p>（答案：由 f(x,y) 在该点的值决定。解析：这就是方程 y′=f(x,y) 的几何含义。）<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n&quot;常&quot;指一元；阶看最高阶导数。\n<\/li><li>\n解必须在区间上恒等成立。\n<\/li><li>\n通解的 n 个常数来自 n 次积分。\n<\/ul>", "kind": "chapter", "title": "第 1 章：基本概念"}, "ch02": {"html": "<h1>第 2 章：初等积分法<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：10 小时 | <strong>前置<\/strong>：第 1 章、全微分\n<\/li><li>\n<strong>对应原书<\/strong>：第二章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n以&quot;恰当方程 + 积分因子&quot;为主线重述全部初等解法；\n<\/li><li>\n会用四种方式求 u：凑微分、折线积分、分组、公式；\n<\/li><li>\n说明常数变易法为什么被推迟到线性方程组一章；\n<\/li><li>\n处理形如 y′=f(ax+by+c) 的平移型方程。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>丁同仁和李承治在这一章做了一个教学上的选择：<strong>把恰当方程作为主线，其余方法都作为它的推论<\/strong>。这不是数学上的必要，而是认知上的减负——你只需要记住一件事：凑全微分。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>2.1 恰当方程<\/h3>\n<div class=\"eq\">P(x,y)dx + Q(x,y)dy = 0，P_y = Q_x<\/div>\n<p>则存在 u 使 du=P dx+Q dy，解为 u=C。<\/p>\n<p><strong>求 u 的三条路<\/strong>：<\/p>\n<ol><li>\n<strong>凑微分<\/strong>：把 P dx+Q dy 拆成几组明显的全微分，例如 x dy+y dx=d(xy)。\n<\/li><li>\n<strong>折线积分<\/strong>：u=∫[x₀→x]P(t,y₀)dt+∫[y₀→y]Q(x,s)ds。\n<\/li><li>\n<strong>先对一个变量积分再定函数<\/strong>：u=∫P dx+φ(y)，代入 u_y=Q 定出 φ′(y)。\n<\/ol>\n<h3>2.2 积分因子<\/h3>\n<p>不恰当时找 μ。教材强调：μ 的方程<\/p>\n<div class=\"eq\">μ(P_y−Q_x) + P μ_y − Q μ_x = 0<\/div>\n<p>本身是一个一阶偏微分方程，一般难解。所以只处理 μ=μ(x) 与 μ=μ(y) 两种退化情形，判据就是两个商式。<\/p>\n<p><strong>一个容易忽略的点<\/strong>：若 μ 只依赖 x+y 或 xy，也可能可求。教材在习题里放了这类，但正文不展开。<\/p>\n<h3>2.3 一阶线性方程与常数变易<\/h3>\n<p>标准形 y′+P(x)y=Q(x)。教材在这里只给公式，把&quot;常数变易&quot;的系统讨论推迟到第六章（线性方程组）。这个安排有道理：常数变易的本质是&quot;在解空间里换坐标&quot;，用向量语言讲更清楚。<\/p>\n<h3>2.4 平移型与齐次型<\/h3>\n<p><strong>平移型<\/strong> y′=f(ax+by+c)。令 u=ax+by+c，则 u′=a+b f(u)，变成变量分离。<\/p>\n<p><strong>齐次型<\/strong> y′=φ(y/x)。令 u=y/x，得 x u′=φ(u)−u。<\/p>\n<p>这两类合起来覆盖了绝大多数&quot;看起来不像分离变量&quot;的一阶方程。<\/p>\n<h3>2.5 隐式方程<\/h3>\n<p>y=f(x,p) 与 x=f(y,p) 用参数 p 降阶；F(x,y,p)=0 一般只能局部解出。教材在这里的处理与其它教材一致，但更强调&quot;参数化是一种坐标变换，不是新方法&quot;。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[P dx + Q dy = 0] --&gt; B{P_y = Q_x}\n    B --&gt;|是| C[求 u]\n    C --&gt; D[u = C]\n    B --&gt;|否| E[找 mu]\n    E --&gt; F[mu 只含 x]\n    E --&gt; G[mu 只含 y]\n    F --&gt; C\n    G --&gt; C\n    A --&gt; H[特殊类型]\n    H --&gt; I[平移型 令 u=ax+by+c]\n    H --&gt; J[齐次型 令 u=y/x]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：图中所有箭头最终都指向&quot;求 u&quot;。这是本章唯一的终点。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：恰当方程像&quot;已经写好的收据&quot;——左边就是某笔账的总额变化；积分因子是&quot;把零散的账目重新归并成一张收据&quot;的操作。<\/p>\n<p><strong>失效边界<\/strong>：如果 μ 必须依赖 x 与 y 的复杂组合，归并就无法显式完成，方程也就&quot;不可积&quot;。<\/p>\n<p><strong>实例<\/strong>：解 (3x²+6xy²)dx+(6x²y+4y³)dy=0。 P_y=12xy，Q_x=12xy，恰当。凑微分：3x²dx+4y³dy+6xy²dx+6x²y dy = d(x³)+d(y⁴)+d(3x²y²)。 于是 u=x³+y⁴+3x²y²，解为 x³+3x²y²+y⁴=C。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为&quot;恰当方程一定是全微分形式一眼可见&quot;<\/strong>——实际上很多要分组凑。\n<\/li><li>\n<strong>别以为&quot;积分因子只依赖一个变量才可求&quot;<\/strong>——实际上特殊组合也可能，但教材不展开。\n<\/li><li>\n<strong>别以为&quot;常数变易是初等技巧&quot;<\/strong>——实际上它是线性代数观点，安排在方程组一章更合适。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n验证 (2x+y)dx+(x+2y)dy=0 恰当并求解。\n<p>（答案：P_y=1=Q_x；u=x²+xy+y²；解 x²+xy+y²=C。解析：直接凑 d(x²)+d(xy)+d(y²)。）<\/p>\n<\/ol>\n<ol><li>\n求 y′=f(2x+3y+1) 的换元。\n<p>（答案：令 u=2x+3y+1，则 u′=2+3f(u)。解析：化为变量分离。）<\/p>\n<\/ol>\n<ol><li>\n为什么 μ 的方程是一阶偏微分方程？\n<p>（答案：因为 μ 依赖 x、y 两个变量，方程含 μ_x 与 μ_y。解析：一般难解，故只做退化情形。）<\/p>\n<\/ol>\n<ol><li>\n折线积分法求 u 的公式？\n<p>（答案：u=∫P(t,y₀)dt+∫Q(x,s)ds。解析：沿水平再沿竖直线段积分，路径无关性由恰当性保证。）<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n主线：凑全微分。\n<\/li><li>\n恰当判据 P_y=Q_x；不恰当找 μ。\n<\/li><li>\n平移型、齐次型都靠换元化为分离变量。\n<\/ul>", "kind": "chapter", "title": "第 2 章：初等积分法"}, "ch03": {"html": "<h1>第 3 章：存在和唯一性定理<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：10 小时 | <strong>前置<\/strong>：第 2 章、一致收敛\n<\/li><li>\n<strong>对应原书<\/strong>：第三章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n完整叙述并证明皮卡定理，包括 h 的取法与迭代估计；\n<\/li><li>\n证明皮亚诺定理（连续即可存在），并说明它比皮卡弱在哪；\n<\/li><li>\n说清&quot;局部存在&quot;与&quot;整体存在&quot;的差别；\n<\/li><li>\n用格朗沃尔引理处理一切&quot;差被积分控制&quot;的情形。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>丁同仁把存在性放在第三章、把&quot;对初值的依赖&quot;放到第五章，中间隔着奇解一章。这个顺序的意思是：<strong>先保证有解，再看解怎么变，最后处理唯一性失效留下的尾巴。<\/strong><\/p>\n<h2>零基础讲解<\/h2>\n<h3>3.1 皮卡定理<\/h3>\n<p>设 f(x,y) 在 R：|x−x₀|≤a，|y−y₀|≤b 连续，关于 y 满足李普希茨（常数 L）。则存在唯一解，定义在 |x−x₀|≤h，h=min(a, b/M)，M=max|f|。<\/p>\n<p><strong>证明的四步<\/strong>：<\/p>\n<ol><li>\n化积分方程 y=y₀+∫f(t,y)dt。\n<\/li><li>\n定义迭代 φₙ₊₁=y₀+∫f(t,φₙ)dt，并证明每个 φₙ 落在 R 内。\n<\/li><li>\n估计相邻差 |φₙ₊₁−φₙ|≤M Lⁿ|x−x₀|ⁿ⁺¹/(n+1)!，得一致收敛。\n<\/li><li>\n极限 φ 连续且满足积分方程（存在）；两个解作差用格朗沃尔（唯一）。\n<\/ol>\n<p><strong>注意第 2 步常被跳过<\/strong>。如果没有它，第 3 步的 f(t,φₙ) 可能根本没有定义。<\/p>\n<h3>3.2 皮亚诺定理<\/h3>\n<p>只要求 f 连续。证明用欧拉折线 + Ascoli-Arzelà：折线族等度连续、一致有界，故有收敛子列，极限满足积分方程。<\/p>\n<p><strong>为什么这里不能照搬皮卡？<\/strong> 因为没有李普希茨，&quot;相邻差&quot;估计失效，迭代序列可能不收敛。<\/p>\n<h3>3.3 局部与整体<\/h3>\n<p>皮卡给的是局部解（|x−x₀|≤h）。整体存在需要延拓：只要解还在定义域内部，就继续接下去。<\/p>\n<p>教材在这里给出延拓的判据：解在端点处若仍留在定义域内部，就能延伸；否则终止（到达边界或爆破）。<\/p>\n<h3>3.4 格朗沃尔引理的地位<\/h3>\n<p>它在本章只出现一次（唯一性），但会在第五章（连续依赖）、第六章（稳定性估计）反复出现。建议现在就把它当成一个独立工具记住：<\/p>\n<div class=\"eq\">D(x) ≤ A + ∫B D ⇒ D(x) ≤ A e^(B|x−x₀|)<\/div>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[初值问题] --&gt; B[积分方程]\n    B --&gt; C[皮卡迭代]\n    C --&gt; D[一致收敛]\n    D --&gt; E[存在]\n    E --&gt; F[格朗沃尔]\n    F --&gt; G[唯一]\n    E --&gt; H[局部解]\n    H --&gt; I[延拓 整体解]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：注意&quot;局部解&quot;与&quot;整体解&quot;之间还有一步延拓，很多证明题漏掉这一步就开始讨论全局性质。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：皮卡迭代像&quot;反复修草稿&quot;：每一稿都比上一稿更接近真解，且误差按阶乘速度缩小。<\/p>\n<p><strong>失效边界<\/strong>：如果 f 在 y 方向变化太剧烈（不满足李普希茨），第 n 稿可能越来越乱，不收敛。<\/p>\n<p><strong>实例<\/strong>：y′=x+y，y(0)=0。迭代： φ₀=0，φ₁=x²/2，φ₂=x²/2+x³/6，φ₃=x²/2+x³/6+x⁴/24。 极限是 eˣ−1−x。验证：y′=eˣ−1，而 x+y=x+eˣ−1−x=eˣ−1，成立。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为&quot;李普希茨条件必须显式给出&quot;<\/strong>——实际上只要 ∂f/∂y 在矩形上有界，就能取 L 为其上界。\n<\/li><li>\n<strong>别以为&quot;皮亚诺定理更强&quot;<\/strong>——实际上它更弱：只保证存在。\n<\/li><li>\n<strong>别以为&quot;局部解就是全部&quot;<\/strong>——实际上还要延拓。\n<\/li><li>\n<strong>别以为&quot;格朗沃尔只能用在唯一性&quot;<\/strong>——实际上它是所有误差估计的通用工具。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n为什么迭代前必须证明 φₙ 落在 R 内？\n<p>（答案：否则 f(t,φₙ(t)) 可能无定义，迭代无法继续。解析：R 是 f 的定义域。）<\/p>\n<\/ol>\n<ol><li>\n皮亚诺定理的证明用了哪条紧性定理？\n<p>（答案：Ascoli-Arzelà。解析：等度连续 + 一致有界 ⇒ 有收敛子列。）<\/p>\n<\/ol>\n<ol><li>\nh=min(a,b/M) 中 b/M 的作用？\n<p>（答案：保证 |φₙ(x)−y₀|≤M|x−x₀|≤Mh≤b，不跑出矩形。解析：这是第 2 步的核心估计。）<\/p>\n<\/ol>\n<ol><li>\n延拓终止的两种情形？\n<p>（答案：抵达定义域边界，或解在有限时间爆破。解析：如 y′=y² 的解在 1 处爆破。）<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n皮卡：连续 + 李普希茨 ⇒ 唯一；皮亚诺：连续 ⇒ 存在。\n<\/li><li>\n四步证明：积分方程、迭代、估计、收敛 + 格朗沃尔。\n<\/li><li>\n局部 → 延拓 → 整体。\n<\/ul>", "kind": "chapter", "title": "第 3 章：存在和唯一性定理"}, "ch04": {"html": "<h1>第 4 章：一阶隐式方程与奇解<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：7 小时 | <strong>前置<\/strong>：第 2、3 章\n<\/li><li>\n<strong>对应原书<\/strong>：第四章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n解 p-可解型与 x-可解型隐式方程，写出参数形式的通解；\n<\/li><li>\n区分&quot;奇解&quot;与&quot;通解中的某个特解&quot;；\n<\/li><li>\n用 p-判别式与 C-判别式求包络，并回代检验；\n<\/li><li>\n说明奇解存在与唯一性失效的关系。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>奇解不是&quot;算出来的一个解&quot;，而是&quot;唯一性失效处露出来的另一族解&quot;。第四章放在存在唯一性之后，正是因为它必须用第三章的定理来解释。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>4.1 隐式方程的四类<\/h3>\n<p><strong>第一类<\/strong> y=f(x,p)：对 x 求导得 p=f_x+f_p·dp/dx，解出 p 后再积分。 <strong>第二类<\/strong> x=f(y,p)：把 dx/dy=1/p，得 1/p=f_y+f_p·dp/dy。 <strong>第三类<\/strong> F(x,y,p)=0：若能解出 y 或 x，归入前两类；否则用参数化。 <strong>第四类<\/strong> 克莱罗与拉格朗日型：有专门的技巧。<\/p>\n<h3>4.2 奇解的定义<\/h3>\n<p><strong>奇解<\/strong>：本身是解，且在其上每一点都与通解族中某条曲线相切，但不属于通解族。<\/p>\n<p>三个条件缺一不可：是解、相切、不在族内。只说&quot;不在族内&quot;不够——y≡0 对 y′=y² 也不在族内，但它不是奇解（它不与任何解曲线相切）。<\/p>\n<h3>4.3 判别式<\/h3>\n<p><strong>p-判别式<\/strong>：从 F(x,y,p)=0 与 F_p(x,y,p)=0 消去 p。 <strong>C-判别式<\/strong>：从通解 Φ(x,y,C)=0 与 Φ_C=0 消去 C。<\/p>\n<p>两者都只是<strong>候选<\/strong>。p-判别式可能包含&quot;根本不是解&quot;的曲线（例如 F=(y′−y)(y′−1)=0 的判别式可能给出奇怪的东西），必须回代检验。<\/p>\n<h3>4.4 奇解与唯一性的关系<\/h3>\n<p>奇解上的每一点，初值问题的解都不唯一：一条是经过该点的通解曲线，另一条是奇解本身。这正是第三章李普希茨条件失效的几何表现。<\/p>\n<p><strong>定理<\/strong>（简述）：若 f 在奇解附近满足李普希茨，则不会有奇解穿过。所以奇解一定出现在&quot;李普希茨失效&quot;的地方。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[隐式方程 F=0] --&gt; B{能否解出 y 或 x}\n    B --&gt;|能| C[参数化 p 求导]\n    B --&gt;|不能| D[直接参数表示]\n    C --&gt; E[通解]\n    E --&gt; F[C-判别式]\n    F --&gt; G[包络候选]\n    G --&gt; H[回代检验]\n    H --&gt;|是解| I[奇解]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：右侧那条&quot;判别式 → 检验&quot;的链条是最容易省略的一步。省略了就会把&quot;假奇解&quot;写进答案。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：通解族像一摞同心圆，奇解像它们的外公切线。每条圆都与公切线相切，但公切线本身不是任何一条圆。<\/p>\n<p><strong>失效边界<\/strong>：如果曲线族彼此相交（不是&quot;族&quot;而是&quot;网&quot;），包络的概念就不适用。<\/p>\n<p><strong>实例<\/strong>：y=xp+p²。求导得 (x+2p)dp/dx=0。 分支一：p=C，y=Cx+C²（直线族）。 分支二：x=−2p，代回 y=−2p²+p²=−p²，即 y=−x²/4。 检验：y′=−x/2，而 xp+p²=x(−x/2)+x²/4=−x²/4=y，成立。且直线 y=Cx+C² 在 x=−2C 处与抛物线相切。所以 y=−x²/4 是奇解。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为&quot;p-判别式给出的曲线一定是奇解&quot;<\/strong>——实际上必须回代。\n<\/li><li>\n<strong>别以为&quot;奇解就是不在通解里的解&quot;<\/strong>——实际上还要相切条件。\n<\/li><li>\n<strong>别以为&quot;奇解只出现在克莱罗方程&quot;<\/strong>——实际上任何唯一性失效处都可能出现。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n奇解的三个条件？\n<p>（答案：是解、与族中曲线相切、不属于族。解析：缺一不可。）<\/p>\n<\/ol>\n<ol><li>\n为什么奇解必然对应李普希茨失效？\n<p>（答案：若李普希茨成立，解唯一，不可能有两条曲线经过同一点相切。解析：这是第三章定理的直接推论。）<\/p>\n<\/ol>\n<ol><li>\n解 y=xp+p³ 的奇解。\n<p>（答案：x+3p²=0 ⇒ p=±√(−x/3)，y=−2p³，消参得 y=±(2/3)√(−x/3)³。解析：注意定义域 x≤0。）<\/p>\n<\/ol>\n<ol><li>\nC-判别式与 p-判别式的区别？\n<p>（答案：前者从通解消 C，后者从方程消 p。解析：前者给包络候选，后者给&quot;奇异曲线&quot;候选。）<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n隐式方程靠参数 p 降阶。\n<\/li><li>\n奇解 = 解 + 相切 + 不在族内。\n<\/li><li>\n判别式只给候选，必须回代。\n<\/ul>", "kind": "chapter", "title": "第 4 章：一阶隐式方程与奇解"}, "ch05": {"html": "<h1>第 5 章：解对初值和参数的连续可微性<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：8 小时 | <strong>前置<\/strong>：第 3 章、矩阵、多元微积分\n<\/li><li>\n<strong>对应原书<\/strong>：第五章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n在 m 维框架下写出解对初值的连续依赖估计；\n<\/li><li>\n证明解对初值连续可微，并写出变分方程；\n<\/li><li>\n说明解对参数的连续可微性；\n<\/li><li>\n解释&quot;整体定理&quot;与&quot;局部定理&quot;在证明上的差别。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>存在唯一性告诉你&quot;有一条解&quot;，本章告诉你&quot;这条解是初值和参数的光滑函数&quot;。<strong>光滑性是后续一切线性化、稳定性、灵敏度分析的前提。<\/strong><\/p>\n<h2>零基础讲解<\/h2>\n<h3>5.1 m 维框架<\/h3>\n<p>把高阶方程化为一阶方程组后，状态是 Rᵐ 中的向量：<\/p>\n<div class=\"eq\">dy/dx = f(x, y)，y∈Rᵐ<\/div>\n<p>所有估计都用向量范数写。这一步的意义不是&quot;更抽象&quot;，而是&quot;只证一次&quot;。<\/p>\n<h3>5.2 连续依赖<\/h3>\n<div class=\"eq\">|y(x;x₀,y₀) − y(x;x₀,y₁)| ≤ |y₀−y₁|·e^(L|x−x₀|)<\/div>\n<p>证明就是两解作差 + 格朗沃尔。教材在这里补了一个细节：若 f 只在局部满足李普希茨，估计只在公共存在区间上成立，不能无限外推。<\/p>\n<h3>5.3 连续可微<\/h3>\n<p>∂y/∂y₀ 存在且连续，满足变分方程<\/p>\n<div class=\"eq\">Φ′ = f_y(x,y(x))·Φ，Φ(x₀)=I<\/div>\n<p><strong>证明的关键<\/strong>：不能直接对积分方程求导（f 未必对 y 可微到可以交换次序），要先做差商估计，证明差商一致有界且等度连续，再取极限。<\/p>\n<p>教材把这一步写得很细，因为它正是&quot;局部定理&quot;和&quot;整体定理&quot;的技术分界：局部只需李普希茨，整体可微需要 f 对 y 连续可微。<\/p>\n<h3>5.4 对参数的可微<\/h3>\n<p>含参数 μ 时，∂y/∂μ 满足<\/p>\n<div class=\"eq\">d/dx(∂y/∂μ) = f_y·(∂y/∂μ) + f_μ<\/div>\n<p>与变分方程相比多一个源项 f_μ。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[解 y 关于初值] --&gt; B[差商估计]\n    B --&gt; C[等度连续]\n    C --&gt; D[取极限得偏导]\n    D --&gt; E[变分方程]\n    E --&gt; F[线性化系统]\n    A --&gt; G[关于参数]\n    G --&gt; H[多源项 f_mu]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：上方那条链是&quot;先估计差商，再取极限&quot;，不能跳过；下方是参数情形，结构相同但多一项。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：解对初值的依赖像&quot;调收音机旋钮&quot;：旋一点点，声音变一点点，而且变化是连续的。变分方程描述的就是&quot;旋钮转一格的音量变化率&quot;。<\/p>\n<p><strong>失效边界<\/strong>：如果系统有分支点（比如参数跨过临界值），这个光滑依赖可能在某点失效——解的数量会突变。<\/p>\n<p><strong>实例<\/strong>：y′=μ y，y(0)=1。解 y=e^(μx)。∂y/∂μ=x e^(μx)，∂y/∂y₀=e^(μx)。 验证灵敏度方程：d/dx(x e^(μx))=e^(μx)+μx e^(μx)=μ(x e^(μx))+1·e^(μx)，其中 f_μ=y=e^(μx)。成立。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为&quot;连续依赖是废话&quot;<\/strong>——实际上它给了指数放大的定量界，是数值稳定性的理论依据。\n<\/li><li>\n<strong>别以为&quot;偏导存在是显然的&quot;<\/strong>——实际上需要 f 对 y 连续可微，仅李普希茨不够。\n<\/li><li>\n<strong>别以为&quot;整体定理与局部定理只差区间长度&quot;<\/strong>——实际上整体定理要额外假设解在紧集上存在。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n连续依赖估计的放大因子？\n<p>（答案：e^(L|x−x₀|)。解析：格朗沃尔引理给出。）<\/p>\n<\/ol>\n<ol><li>\n变分方程的初值为什么是 I？\n<p>（答案：∂y/∂y₀ 在 x₀ 处为恒等映射的导数。解析：y(x₀)=y₀。）<\/p>\n<\/ol>\n<ol><li>\n参数情形比初值情形多哪一项？\n<p>（答案：f_μ。解析：参数直接进入方程产生源项。）<\/p>\n<\/ol>\n<ol><li>\n为什么证明可微性要先做差商估计？\n<p>（答案：不能直接交换求导与积分次序，需先证差商一致收敛。解析：这是分析里的标准手法。）<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n连续依赖 = 格朗沃尔 + 指数界。\n<\/li><li>\n可微性 = 差商估计 + 变分方程。\n<\/li><li>\n参数情形多 f_μ。\n<\/ul>", "kind": "chapter", "title": "第 5 章：解对初值和参数的连续可微性"}, "ch06": {"html": "<h1>第 6 章：线性微分方程组与高阶线性方程<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：10 小时 | <strong>前置<\/strong>：第 5 章、线性代数\n<\/li><li>\n<strong>对应原书<\/strong>：第六章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n写出齐次线性方程组解空间的维数定理；\n<\/li><li>\n用基解矩阵与常数变易解非齐次方程组；\n<\/li><li>\n把常系数情形化为矩阵指数，并处理重特征值；\n<\/li><li>\n说明高阶线性方程是方程组的特例，反之亦然。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>线性理论的全部内容可以概括为：<strong>解空间是有限维线性空间，非齐次 = 特解 + 齐次<\/strong>。其余都是算法。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>6.1 齐次方程组<\/h3>\n<div class=\"eq\">dy/dx = A(x)y<\/div>\n<p>解集是 m 维线性空间。基解矩阵 Φ 满足 Φ′=AΦ，det Φ≠0。<\/p>\n<p><strong>维数定理的证明<\/strong>：映射 y₀ ↦ y(x;x₀,y₀) 是从 Rᵐ 到解空间的线性同构（线性来自方程对 y 的线性性，双射来自存在唯一性）。所以维数等于 m。<\/p>\n<h3>6.2 非齐次与常数变易<\/h3>\n<div class=\"eq\">y = Φ(x)[C + ∫Φ⁻¹(s)f(s)ds]<\/div>\n<p><strong>这个公式的推导本身就是&quot;换坐标&quot;<\/strong>：在 Φ 这组基下，非齐次项 f 被 Φ⁻¹ 翻译成&quot;坐标的变化率&quot;，再积分。<\/p>\n<h3>6.3 常系数与矩阵指数<\/h3>\n<p>A 为常数时，e^(At) 是标准基解矩阵。计算三条路：对角化、若尔当块、待定系数（拉普拉斯变换作为第四条）。<\/p>\n<p>重特征值出现 t 的幂，原因是广义特征向量链，与若尔当块同构。<\/p>\n<h3>6.4 高阶方程的互化<\/h3>\n<p>n 阶方程 → 一阶方程组（令 y₁=y,…,yₙ=y⁽ⁿ⁻¹⁾）。 一阶方程组 → n 阶方程（消元，取某个分量的最高阶导数方程）。<\/p>\n<p>两种写法信息量相同，但方程组写法更适合用矩阵工具，高阶写法更适合用特征多项式。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[线性方程组] --&gt; B[齐次]\n    B --&gt; C[解空间 m 维]\n    C --&gt; D[基解矩阵]\n    D --&gt; E[非齐次 常数变易]\n    A --&gt; F[常系数]\n    F --&gt; G[矩阵指数]\n    G --&gt; H[对角化]\n    G --&gt; I[若尔当块]\n    G --&gt; J[拉普拉斯]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：中间&quot;解空间 m 维&quot;是全部结论的根。下面所有算法都只是在具体计算这个空间的基。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：基解矩阵像一组&quot;坐标轴&quot;。解向量在这组轴下的坐标是常数 C；非齐次项相当于不断推动坐标轴，让坐标随时间变。<\/p>\n<p><strong>失效边界<\/strong>：非线性系统没有这种&quot;固定坐标轴&quot;的结构，所以常数变易只对线性方程有效。<\/p>\n<p><strong>实例<\/strong>：A=[[1,2],[0,3]]，e^(At)=[[e^t, e^(3t)−e^t],[0, e^(3t)]]。 验证：对 (1,2) 元素求导得 3e^(3t)−e^t，而 A e^(At) 的第一行第二列 = 1·(e^(3t)−e^t)+2·e^(3t)=3e^(3t)−e^t，一致。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为&quot;基解矩阵必须由特征向量组成&quot;<\/strong>——实际上任何线性无关解都行。\n<\/li><li>\n<strong>别以为&quot;矩阵指数可以对每个元素取指数&quot;<\/strong>——实际上只有对角矩阵才行。\n<\/li><li>\n<strong>别以为&quot;高阶方程与方程组不能互化&quot;<\/strong>——实际上两者可以互相转化。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n齐次线性方程组解空间的维数？\n<p>（答案：m，即未知量的个数。解析：由初值到解的线性同构。）<\/p>\n<\/ol>\n<ol><li>\n常数变易公式中 Φ⁻¹ 的作用？\n<p>（答案：把非齐次项翻译成基坐标下的分量。解析：相当于坐标变换。）<\/p>\n<\/ol>\n<ol><li>\nA=[[2,0],[0,2]] 的 e^(At)？\n<p>（答案：e^(2t)I。解析：对角矩阵，逐元素取指数成立。）<\/p>\n<\/ol>\n<ol><li>\n为什么重特征值会出现 t 的幂？\n<p>（答案：广义特征向量链，与若尔当块相关。解析：见 e^(λt)(I+Nt+…) 形式。）<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n齐次解空间 m 维，非齐次 = 特解 + 齐次。\n<\/li><li>\n常数变易 = 换坐标。\n<\/li><li>\n常系数看矩阵指数，重根看若尔当块。\n<\/ul>", "kind": "chapter", "title": "第 6 章：线性微分方程组与高阶线性方程"}, "ch07": {"html": "<h1>第 7 章：解析理论<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：6 小时 | <strong>前置<\/strong>：第 3、5、6 章、复变函数\n<\/li><li>\n<strong>对应原书<\/strong>：第七章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n陈述柯西定理并说明&quot;解析&quot;与&quot;连续可微&quot;的等级差别；\n<\/li><li>\n用幂级数求常点附近的解，写出系数递推；\n<\/li><li>\n判断正则奇点并用弗罗贝尼乌斯方法；\n<\/li><li>\n说明为什么解析理论对复数域比实数域更自然。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>解析理论的核心不是&quot;级数解法&quot;，而是&quot;解析函数类对微分方程运算封闭&quot;。这个封闭性让解可以一直被解析延拓下去。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>7.1 柯西定理<\/h3>\n<p>若 f(x,y) 在 (x₀,y₀) 邻域内解析，则解在 x₀ 邻域内解析。<\/p>\n<p>证明用优级数：把 f 的系数用一个正项级数压住，证明解的系数被它控制。<\/p>\n<p><strong>与皮卡定理的区别<\/strong>：皮卡只要连续 + 李普希茨，给 C⁰ 解；柯西要解析，给 C^ω 解。等级不同，结论不同。<\/p>\n<h3>7.2 常点与幂级数<\/h3>\n<p>把 y=Σaₖ(x−x₀)ᵏ 代入，比较同次幂。n 阶线性方程给出 k 阶递推（k 从 0 到 ∞），初值决定 a₀,…,a_{n−1}。<\/p>\n<p><strong>收敛半径<\/strong>：不小于初值点到最近奇点的距离。这条估计在工程上非常有用——它告诉你&quot;级数解能用多远&quot;。<\/p>\n<h3>7.3 正则奇点与弗罗贝尼乌斯<\/h3>\n<p>方程 y″+p y′+q y=0，若 (x−x₀)p、(x−x₀)²q 解析，则 x₀ 是正则奇点。设<\/p>\n<div class=\"eq\">y=(x−x₀)^r Σaₖ(x−x₀)ᵏ<\/div>\n<p>代入最低次幂得指标方程 r(r−1)+p₀r+q₀=0（p₀、q₀ 是 p、q 展开的常数项）。<\/p>\n<p>两根之差非整数 ⇒ 两个独立级数解；为整数 ⇒ 第二个解可能带对数。<\/p>\n<h3>7.4 为什么用复域<\/h3>\n<p>在实轴上，解析延拓会遇到奇点而中断；在复平面上，解析函数可以由一个局部级数唯一确定到整个连通区域。这是&quot;解析&quot;比&quot;实可微&quot;强得多的地方。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[右端解析] --&gt; B[柯西定理]\n    B --&gt; C[解解析]\n    C --&gt; D[可解析延拓]\n    A --&gt; E[点的类型]\n    E --&gt; F[常点 幂级数]\n    E --&gt; G[正则奇点 弗罗贝尼乌斯]\n    G --&gt; H[指标方程]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：上支是&quot;解析性带来的全局能力&quot;，下支是&quot;局部计算的方法选择&quot;。两者都要会。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：解析性像&quot;完整的 DNA&quot;。知道一小段（局部级数），就能复原整个个体（全局函数）；只连续可微则像&quot;只知道长相&quot;，换个角度就认不出了。<\/p>\n<p><strong>失效边界<\/strong>：如果函数只在实轴上解析但在复平面有奇点（如 1/(1+x²)），解析延拓的半径会被复奇点限制。<\/p>\n<p><strong>实例<\/strong>：y″+y/x−y/x²=0 在 x=0 处。p=1/x，q=−1/x²，x p=1，x²q=−1 都解析，故为正则奇点。指标方程 r(r−1)+r−1=0 ⇒ r²−1=0 ⇒ r=±1。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为&quot;解析就是可导&quot;<\/strong>——实际上解析是可导的强得多的条件（局部可展成幂级数）。\n<\/li><li>\n<strong>别以为&quot;正则奇点一定有级数解&quot;<\/strong>——实际上指标方程两根差整数时第二个解要对数。\n<\/li><li>\n<strong>别以为&quot;收敛半径由方程阶数决定&quot;<\/strong>——实际上由奇点位置决定。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n柯西定理与皮卡定理的等级差别？\n<p>（答案：前者给解析解，后者只给连续可微解。解析：假设不同。）<\/p>\n<\/ol>\n<ol><li>\n正则奇点的指标方程怎么来？\n<p>（答案：代入最低次幂，令系数为零。解析：r(r−1)+p₀r+q₀=0。）<\/p>\n<\/ol>\n<ol><li>\n收敛半径由什么决定？\n<p>（答案：到最近奇点的距离。解析：复平面上的奇点也算。）<\/p>\n<\/ol>\n<ol><li>\n为什么解析理论在复域更自然？\n<p>（答案：解析函数由局部级数唯一确定，可延拓。解析：实轴上延拓会中断。）<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n解析右端 ⇒ 解析解。\n<\/li><li>\n常点幂级数，正则奇点弗罗贝尼乌斯。\n<\/li><li>\n收敛半径看最近奇点。\n<\/ul>", "kind": "chapter", "title": "第 7 章：解析理论"}, "ch08": {"html": "<h1>第 8 章：定性理论<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：10 小时 | <strong>前置<\/strong>：第 5、6 章、拓扑初步\n<\/li><li>\n<strong>对应原书<\/strong>：第八章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n用动力系统语言描述自治方程（相空间、轨线、不变集）；\n<\/li><li>\n证明李雅普诺夫稳定性定理与渐近稳定性定理；\n<\/li><li>\n按迹与行列式分类平面线性系统的奇点；\n<\/li><li>\n用庞加莱-本迪克松定理证明闭轨存在；\n<\/li><li>\n说明结构稳定性与分支的含义。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>定性理论放弃&quot;求出解&quot;，改问&quot;轨线的整体排布&quot;。它的两个支柱是：<strong>李雅普诺夫函数<\/strong>（判稳）与<strong>庞加莱-本迪克松定理<\/strong>（判闭轨存在）。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>8.1 动力系统的基本对象<\/h3>\n<p>自治系统 dx/dt=f(x) 定义相流。基本对象：轨线、平衡点、周期轨、不变集、极限集（ω 极限集、α 极限集）。<\/p>\n<p><strong>不变集<\/strong>：若轨线某一时刻进入就不再离开。闭轨、平衡点、环面都是不变集。<\/p>\n<h3>8.2 李雅普诺夫定理<\/h3>\n<p><strong>稳定性<\/strong>：对任意 ε，存在 δ，初值在 δ 内则轨线永远在 ε 内。 <strong>渐近稳定性<\/strong>：稳定且 t→∞ 时趋于平衡点。<\/p>\n<p><strong>第一方法（线性化）<\/strong>：A=f′(0) 的特征值实部全负 ⇒ 渐近稳定。 <strong>第二方法（V 函数）<\/strong>：V 正定、V̇ 负半定 ⇒ 稳定；V̇ 负定 ⇒ 渐近稳定。<\/p>\n<p>第二方法的威力在于：不必解方程，也不必算特征值。代价是&quot;构造 V 没有通用算法&quot;。<\/p>\n<h3>8.3 平面奇点分类<\/h3>\n<p>线性系统 dx/dt=Ax，p=tr A，q=det A，Δ=p²−4q：<\/p>\n<table><thead><tr><th>条件<\/th><th>类型<\/th><th>稳定性<\/th><\/tr><\/thead><tbody><tr><td>q&lt;0<\/td><td>鞍点<\/td><td>不稳定<\/td><\/tr><tr><td>q&gt;0, Δ&gt;0, p&lt;0<\/td><td>稳定结点<\/td><td>渐近稳定<\/td><\/tr><tr><td>q&gt;0, Δ&gt;0, p&gt;0<\/td><td>不稳定结点<\/td><td>不稳定<\/td><\/tr><tr><td>q&gt;0, Δ&lt;0, p&lt;0<\/td><td>稳定焦点<\/td><td>渐近稳定<\/td><\/tr><tr><td>q&gt;0, Δ&lt;0, p&gt;0<\/td><td>不稳定焦点<\/td><td>不稳定<\/td><\/tr><tr><td>q&gt;0, Δ&lt;0, p=0<\/td><td>中心<\/td><td>稳定非渐近<\/td><\/tr><\/tbody><\/table>\n<p><strong>非线性情形<\/strong>：双曲平衡点（p≠0）的局部相图与线性化拓扑等价（哈特曼-格罗布曼定理），所以上表可以照用。<\/p>\n<h3>8.4 闭轨与庞加莱-本迪克松<\/h3>\n<p><strong>定理<\/strong>：平面自治系统若存在有界闭区域 D，轨线进入后不离开，且 D 内无平衡点，则 D 内存在闭轨。<\/p>\n<p>用法：构造一个&quot;环状&quot;trapping region，外边界向内、内边界向外。<\/p>\n<h3>8.5 结构稳定与分支<\/h3>\n<p>结构稳定：参数微小变化不改变相图拓扑。分支：参数变化导致拓扑改变。这是&quot;定性理论&quot;走向现代动力系统的入口。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[自治系统] --&gt; B[平衡点]\n    B --&gt; C[线性化]\n    C --&gt; D{双曲}\n    D --&gt;|是| E[拓扑等价 查表]\n    D --&gt;|否| F[李雅普诺夫 V]\n    A --&gt; G[闭轨]\n    G --&gt; H[构造捕获域]\n    H --&gt; I[庞加莱-本迪克松]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：左右两支解决两个不同问题——局部稳定性与全局闭轨。考卷上的综合题常常两者都要。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：V 函数像&quot;海拔&quot;。轨线总是往低处走，就不可能翻出山谷，于是稳定；如果谷底唯一，就渐近稳定。<\/p>\n<p><strong>失效边界<\/strong>：如果 V̇ 只在部分区域负定，结论只在那个区域成立。<\/p>\n<p><strong>实例<\/strong>：Duffing 型 x″+x³=0 等价于 V=x′²/2+x⁴/4 守恒，轨线在等能线上；V 正定、V̇=0，只能得&quot;稳定&quot;，不是渐近稳定。这与中心型一致。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为&quot;线性化总能判稳&quot;<\/strong>——实际上非双曲时失效。\n<\/li><li>\n<strong>别以为&quot;V 必须是能量&quot;<\/strong>——实际上任何正定函数都行。\n<\/li><li>\n<strong>别以为&quot;庞加莱-本迪克松定理对三维也成立&quot;<\/strong>——实际上只在平面成立。\n<\/li><li>\n<strong>别以为&quot;稳定就是渐近稳定&quot;<\/strong>——实际上中心型稳定但不渐近。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\np=0、q&gt;0 的线性系统是什么奇点？\n<p>（答案：中心。解析：特征值为纯虚数。）<\/p>\n<\/ol>\n<ol><li>\n第二方法判渐近稳定的条件？\n<p>（答案：V 正定且 V̇ 负定。解析：负半定只能给稳定。）<\/p>\n<\/ol>\n<ol><li>\n庞加莱-本迪克松定理的三个条件？\n<p>（答案：平面、有界捕获域、域内无平衡点。解析：三者缺一不可。）<\/p>\n<\/ol>\n<ol><li>\n结构稳定的含义？\n<p>（答案：参数微扰不改变相图拓扑。解析：分支点处结构不稳定。）<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n平衡点：先线性化，双曲则查表。\n<\/li><li>\n非双曲：找 V。\n<\/li><li>\n闭轨：庞加莱-本迪克松。\n<\/ul>", "kind": "chapter", "title": "第 8 章：定性理论"}, "ch09": {"html": "<h1>第 9 章：边值问题<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：8 小时 | <strong>前置<\/strong>：第 6 章、泛函分析初步\n<\/li><li>\n<strong>对应原书<\/strong>：第九章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n区分初值问题与边值问题在&quot;解的存在性&quot;上的差别；\n<\/li><li>\n写出斯特姆-刘维尔问题的标准形并说明自伴性；\n<\/li><li>\n证明特征值的实数性与特征函数的正交性；\n<\/li><li>\n说明为什么边值问题的特征值是可数无穷的。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>边值问题的困难在于：<strong>同样的方程，边界条件一变，解可能从&quot;唯一&quot;变成&quot;无穷多&quot;或者&quot;没有&quot;<\/strong>。这是初值问题不会出现的情况。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>9.1 与初值问题的根本差别<\/h3>\n<p>初值问题：给 x₀ 处的 n 个条件，由存在唯一性定理保证局部唯一。 边值问题：给 a、b 两端的条件，条件数与方程阶数相同，但不保证唯一。<\/p>\n<p><strong>反例<\/strong>：y″+y=0，y(0)=0，y(π)=1 无解；y(0)=0，y(π)=0 有无穷多解（A sin x）。同一个方程，边界条件不同，结论完全不同。<\/p>\n<p>原因：边值问题本质是&quot;线性算子方程&quot;，其可解性取决于算子是否可逆，而可逆性又取决于特征值是否落在参数上。<\/p>\n<h3>9.2 斯特姆-刘维尔问题<\/h3>\n<div class=\"eq\">(p y′)′ + (λρ−q)y = 0，a<x<b<\/div>\n<p>配分离边界条件。关键性质：<\/p>\n<ol><li>\n特征值 λ 是实数，且可数，趋于 +∞；\n<\/li><li>\n不同特征值的特征函数带权 ρ 正交；\n<\/li><li>\n特征函数系在 L²_ρ 中完备，可展开任意平方可积函数。\n<\/ol>\n<p><strong>为什么可数<\/strong>：这是紧自伴算子谱的离散性，直观上&quot;区间有限 + 方程正则&quot;限制了振荡次数。<\/p>\n<h3>9.3 存在性与唯一性的判据<\/h3>\n<p>对线性边值问题 Ly=f，齐次问题只有零解 ⇔ 非齐次问题对任意 f 有唯一解（弗雷德霍姆二择一）。<\/p>\n<p>这条判据把&quot;解是否存在&quot;转化为&quot;齐次问题有没有非零解&quot;，比直接求解省力得多。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[边值问题 Ly=f] --&gt; B[齐次问题 Ly=0]\n    B --&gt; C{只有零解}\n    C --&gt;|是| D[唯一解 对任意 f]\n    C --&gt;|否| E[非零解 即特征函数]\n    E --&gt; F[非齐次需满足正交性条件]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：这张图是本章的&quot;决策树&quot;。拿到边值问题，先解齐次，再决定走哪条路。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：边值问题像&quot;两端固定的弦&quot;。你能拨出无数种驻波（特征函数），但要让弦在某个频率下按你指定的形状振动，通常做不到。<\/p>\n<p><strong>失效边界<\/strong>：如果边界条件含非线性项，弗雷德霍姆二择一不再适用。<\/p>\n<p><strong>实例<\/strong>：y″+λy=0，y′(0)=0，y′(π)=0。特征值 λ=n²，特征函数 cos nx（n=0,1,2,…）。 验证正交：∫₀^π cos mx cos nx dx=0（m≠n），n=0 时 cos 0=1 也正交。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为&quot;边值问题一定有解&quot;<\/strong>——实际上可能无解，如 y(0)=0、y(π)=1。\n<\/li><li>\n<strong>别以为&quot;特征值一定是正的&quot;<\/strong>——实际上 q 为负时可能出现负特征值。\n<\/li><li>\n<strong>别以为&quot;正交性需要特征值互异&quot;<\/strong>——实际上重特征值的特征函数可以正交化。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\ny″+y=0，y(0)=0，y(π)=1 有解吗？\n<p>（答案：无解。解析：通解 A sin x + B cos x，B=0，A sin π=0≠1。）<\/p>\n<\/ol>\n<ol><li>\n弗雷德霍姆二择一的内容？\n<p>（答案：齐次只有零解 ⇔ 非齐次对任意 f 唯一可解。解析：这是线性算子可逆性的等价表述。）<\/p>\n<\/ol>\n<ol><li>\n特征函数正交的权是什么？\n<p>（答案：ρ(x)。解析：∫ρ yₘ yₙ=0。）<\/p>\n<\/ol>\n<ol><li>\n为什么特征值可数？\n<p>（答案：紧自伴算子的谱离散。解析：区间有限 + 正则性限制振荡次数。）<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n边值问题可能无解或无穷多解。\n<\/li><li>\n先解齐次，再用二择一。\n<\/li><li>\nS-L 问题：实特征值 + 正交 + 完备。\n<\/ul>", "kind": "chapter", "title": "第 9 章：边值问题"}, "ch10": {"html": "<h1>第 10 章：首次积分<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：7 小时 | <strong>前置<\/strong>：第 6、8 章\n<\/li><li>\n<strong>对应原书<\/strong>：第十章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n给出首次积分的定义并验证一个函数是否为首次积分；\n<\/li><li>\n说清独立首次积分与轨线维数的关系；\n<\/li><li>\n用&quot;找 n−1 个首次积分&quot;的方法判断轨线形状；\n<\/li><li>\n区分局部首次积分与整体首次积分。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>首次积分是&quot;守恒量&quot;的数学名字。<strong>每多一个独立首次积分，相空间的有效维数就少一维<\/strong>；找到 n−1 个，轨线就被钉死成一维曲线。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>10.1 定义<\/h3>\n<p>F(x₁,…,xₙ) 沿系统 dx/dt=X(x) 的每条轨线取常数，等价于<\/p>\n<div class=\"eq\">X·∇F = ∂F/∂x₁·X₁ + … + ∂F/∂xₙ·Xₙ = 0<\/div>\n<h3>10.2 独立性与维数<\/h3>\n<p>若 F₁,…,Fₖ 的梯度在某区域线性无关，则它们把区域切成 n−k 维的叶层。轨线落在这些叶层的交里，所以 k=n−1 时轨线是一维。<\/p>\n<p><strong>这就是&quot;n 维系统最多 n−1 个独立首次积分&quot;的原因<\/strong>——不是定理的限制，而是维数计数。<\/p>\n<h3>10.3 局部与整体<\/h3>\n<p>局部：在非平衡点附近一定能找到 n−1 个（把向量场拉直即可）。 整体：可能存在&quot;障碍&quot;——轨线的全局行为（如回归性、稠密性）会阻止一个单值光滑的首次积分存在。<\/p>\n<p>教材在这里的讨论比一般工科教材深，值得留意：<strong>&quot;局部有&quot;不等于&quot;整体有&quot;<\/strong>。<\/p>\n<h3>10.4 用首次积分判断轨线<\/h3>\n<p>以 Volterra 模型为例，H=x−c ln x + b y − a ln y 是首次积分，H 的等值线是闭曲线，故轨线是闭的——不需要解方程就能得到&quot;周期振荡&quot;的结论。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[系统 X] --&gt; B[找 F 使 X grad F = 0]\n    B --&gt; C[一个首次积分]\n    C --&gt; D[叶层 n-1 维]\n    D --&gt; E[再找一个 交成 n-2 维]\n    E --&gt; F[共 n-1 个 轨线一维]\n    A --&gt; G[平衡点处失效]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：中间那条链是&quot;维数递减&quot;。右侧提醒：平衡点处向量场为零，拉直法失效，需单独处理。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：首次积分像&quot;能量表&quot;。系统的能量不变，所以状态只能沿着&quot;等能量面&quot;移动；再知道一个守恒量（角动量），就只剩一条线可走。<\/p>\n<p><strong>失效边界<\/strong>：耗散系统没有这样的守恒量，首次积分可能根本不存在。<\/p>\n<p><strong>实例<\/strong>：谐振子 x″+x=0。取 F=x′²/2+x²/2，验证：X=(x′,−x)，∇F=(x,x′)，点积=x′x+(−x)x′=0。所以 F 是首次积分，轨线是椭圆。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为&quot;首次积分就是解&quot;<\/strong>——实际上它是守恒量，不是轨线本身。\n<\/li><li>\n<strong>别以为&quot;n 维系统一定有 n 个首次积分&quot;<\/strong>——实际上独立的只有 n−1 个。\n<\/li><li>\n<strong>别以为&quot;局部存在就能拼成整体&quot;<\/strong>——实际上可能有全局障碍。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n验证 F=x²+y² 是否为 x′=−y、y′=x 的首次积分。\n<p>（答案：是。解析：∇F=(2x,2y)，X=(−y,x)，点积=−2xy+2xy=0。）<\/p>\n<\/ol>\n<ol><li>\n为什么独立首次积分最多 n−1 个？\n<p>（答案：每多一个，维数降一；轨线本身一维，故最多降 n−1 次。解析：维数计数。）<\/p>\n<\/ol>\n<ol><li>\n局部存在性用什么方法证明？\n<p>（答案：局部坐标把向量场拉直，化为解 n−1 个方程。解析：需向量场非零。）<\/p>\n<\/ol>\n<ol><li>\nVolterra 模型为什么有周期解？\n<p>（答案：首次积分的等值线闭合。解析：H 在平衡点取极小。）<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n首次积分 = 沿轨线不变的函数。\n<\/li><li>\n独立的有 n−1 个，维数递减。\n<\/li><li>\n局部有 ≠ 整体有。\n<\/ul>", "kind": "chapter", "title": "第 10 章：首次积分"}, "ch11": {"html": "<h1>第 11 章：一阶偏微分方程<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：6 小时 | <strong>前置<\/strong>：第 2、10 章\n<\/li><li>\n<strong>对应原书<\/strong>：第十一章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n用首次积分写出齐次线性 PDE 的通解；\n<\/li><li>\n用特征线法解拟线性方程，写出参数形式的解；\n<\/li><li>\n判断初始曲线是否满足非特征条件；\n<\/li><li>\n说明完全积分与通解的区别。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>一阶 PDE 的解法只有一个核心动作：<strong>沿特征线把偏导降为常导<\/strong>。剩下的都是这句话的技术展开。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>11.1 齐次线性 PDE<\/h3>\n<div class=\"eq\">a(x,y)u_x + b(x,y)u_y = 0<\/div>\n<p>其特征方程 dy/dx=b/a 的首次积分 Φ(x,y)=C。通解 u=F(Φ)。<\/p>\n<p><strong>为什么<\/strong>：沿特征线，u 的全导数 du/ds=a u_x+b u_y=0，所以 u 在该线上为常数；不同线可以取不同常数，这个&quot;不同&quot;就是一个任意函数。<\/p>\n<h3>11.2 拟线性<\/h3>\n<div class=\"eq\">a(x,y,u)u_x + b(x,y,u)u_y = c(x,y,u)<\/div>\n<p>特征方程组<\/p>\n<div class=\"eq\">dx/ds=a，dy/ds=b，du/ds=c<\/div>\n<p>给定初始曲线 Γ:(x₀(τ),y₀(τ),u₀(τ))，解上述方程组（以 τ 为参数），得到一族特征线，它们织成解曲面。<\/p>\n<h3>11.3 非特征条件<\/h3>\n<div class=\"eq\">a·dy₀/dτ − b·dx₀/dτ ≠ 0<\/div>\n<p>几何意义：初始曲线的切方向不能与特征方向重合。否则从初始条件无法定出 u 的法向导数，解不唯一或不存在。<\/p>\n<h3>11.4 完全积分<\/h3>\n<p>对 F(x,y,u,p,q)=0，完全积分是含两个参数的解族 u=φ(x,y;c₁,c₂)。奇解由包络给出。这个概念在哈密顿-雅可比理论里有大用，但本章只需知道它存在。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[一阶 PDE] --&gt; B[特征方程组]\n    B --&gt; C[以初始曲线为参数解出]\n    C --&gt; D[特征线族]\n    D --&gt; E[织成解曲面]\n    B --&gt; F{非特征条件}\n    F --&gt;|不满足| G[解不唯一或不存在]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：这是一条&quot;从曲线族到曲面&quot;的生产线。非特征条件是质检关卡，过不了就出不了合格品。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：特征线是经线，初始曲线是纬线。经纬一交，整张地图就确定下来；如果初始曲线本身是经线，那就定不了纬线。<\/p>\n<p><strong>失效边界<\/strong>：特征线在有限距离内相交时，解曲面出现折痕（激波），经典解失效。<\/p>\n<p><strong>实例<\/strong>：u_x+u_y=0，u(x,0)=sin x。 特征方向 (1,1)，初始曲线 (τ,0)，非特征条件 1·0−1·1=−1≠0，满足。 特征线 x−y=τ，u 沿之不变，故 u=sin(x−y)。验证：u_x=cos(x−y)，u_y=−cos(x−y)，和为 0。边界 y=0 时 sin x。成立。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为&quot;任意初始曲线都行&quot;<\/strong>——实际上必须横截特征方向。\n<\/li><li>\n<strong>别以为&quot;通解就是所有解&quot;<\/strong>——实际上可能有奇解（包络）。\n<\/li><li>\n<strong>别以为&quot;一阶 PDE 只有一个方法&quot;<\/strong>——实际上还有完全积分、拉格朗日-夏皮罗等方法，但主线仍是特征线。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n齐次 PDE 通解的形式？\n<p>（答案：u=F(Φ)，Φ 为首次积分。解析：沿特征线 u 为常数。）<\/p>\n<\/ol>\n<ol><li>\n非特征条件的式子？\n<p>（答案：a·dy₀/dτ−b·dx₀/dτ≠0。解析：切向不能与特征向重合。）<\/p>\n<\/ol>\n<ol><li>\nu_x+2u_y=0，u(x,0)=x² 的解？\n<p>（答案：u=(x−y/2)²。解析：特征线 x−y/2=τ。）<\/p>\n<\/ol>\n<ol><li>\n特征线相交会发生什么？\n<p>（答案：解曲面出现折痕，经典解失效。解析：需要弱解理论。）<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n特征线法 = 把偏导降为常导。\n<\/li><li>\n齐次通解 u=F(Φ)。\n<\/li><li>\n非特征条件必须验证。\n<\/ul>", "kind": "chapter", "title": "第 11 章：一阶偏微分方程"}, "c01": {"html": "<h1>奇解与包络<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 4 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>既是解、又与通解族中每条曲线相切、但不属于通解族的曲线。<\/p>\n<h2>为什么重要<\/h2>\n<p>它是&quot;唯一性失效&quot;的几何面孔：在奇解上，初值问题的解不唯一。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[通解族] --&gt; B[求包络]\n    B --&gt; C[C-判别式]\n    C --&gt; D[候选曲线]\n    D --&gt; E{是否本身是解}\n    E --&gt;|是| F[奇解]\n    E --&gt;|否| G[假奇解 丢弃]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>包络是&quot;贴着族中每条曲线走、但自己不是其中一条&quot;的曲线。判别式只是找包络的代数手段，找到后必须回代验证。<\/p>\n<p>在奇解的点上，李普希茨条件必然失效，否则唯一性会禁止两条曲线相切而过。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为判别式给出的都是奇解。\n<\/li><li>\n别以为不在通解族里的解都是奇解（还要相切）。\n<\/li><li>\n别以为奇解只属于隐式方程（显式方程也可能有）。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 4 章<\/td><td>隐式方程<\/td><td>p-判别式、C-判别式<\/td><\/tr><tr><td>第 3 章<\/td><td>唯一性<\/td><td>李普希茨失效<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：包络、隐函数定理\n<\/li><li>\n后续：分支理论\n<\/ul>", "kind": "concept", "title": "奇解与包络"}, "c02": {"html": "<h1>变分方程<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：第 5 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>描述 ∂y/∂y₀ 演化的线性方程：Φ′=f_y(x,y(x))Φ，Φ(x₀)=I。<\/p>\n<h2>为什么重要<\/h2>\n<p>它把&quot;解对初值的光滑依赖&quot;变成一个可计算的线性系统，是线性化判稳与灵敏度分析的共同源头。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n    A[原系统] --&gt; B[沿参考解取 f_y]\n    B --&gt; C[变分方程]\n    C --&gt; D[Phi]\n    D --&gt; E[误差放大率]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>推导要先做差商估计再取极限，不能直接交换求导与积分。得到的 Φ 是线性化系统的基解矩阵，其增长速率由 f_y 的谱决定。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为变分方程是近似——它精确描述导数。\n<\/li><li>\n别以为 Φ 一定有界——特征值实部为正时指数增长。\n<\/li><li>\n别以为可以直接对积分方程求导。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 5 章<\/td><td>连续可微性<\/td><td>Φ′=f_yΦ<\/td><\/tr><tr><td>第 8 章<\/td><td>稳定性<\/td><td>线性化依据<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：雅可比矩阵\n<\/li><li>\n后续：李雅普诺夫第一方法\n<\/ul>", "kind": "concept", "title": "变分方程"}, "c03": {"html": "<h1>弗雷德霍姆二择一<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 9 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>线性边值问题：齐次问题只有零解 ⇔ 非齐次问题对任意右端有唯一解。<\/p>\n<h2>为什么重要<\/h2>\n<p>它把&quot;解存在吗&quot;转化为&quot;齐次问题有没有非零解&quot;，后者通常好算。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[Ly=f] --&gt; B[齐次 Ly=0]\n    B --&gt; C{有非零解}\n    C --&gt;|无| D[唯一解]\n    C --&gt;|有| E[需满足正交条件]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>这是线性算子可逆性的等价表述。当齐次有非零解（即 f 落在某特征值上），非齐次问题的右端必须与该特征函数正交，否则无解。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为边值问题总有解。\n<\/li><li>\n别以为二择一适用于非线性边界条件。\n<\/li><li>\n别以为&quot;有无穷多解&quot;就意味着&quot;随便一个都行&quot;——它们差一个齐次解。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 9 章<\/td><td>边值问题<\/td><td>可解性判据<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：线性算子、特征值\n<\/li><li>\n后续：格林函数\n<\/ul>", "kind": "concept", "title": "弗雷德霍姆二择一"}, "c04": {"html": "<h1>李雅普诺夫函数<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：第 8 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>正定且沿轨线导数负定（或负半定）的标量函数，用于判稳而不必解方程。<\/p>\n<h2>为什么重要<\/h2>\n<p>它绕开了&quot;求特征值&quot;和&quot;解方程&quot;两条路，直接靠&quot;能量在减少&quot;下结论。是非线性稳定性分析的主力工具。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[V 正定] --&gt; B{V 的导数}\n    B --&gt;|负半定| C[稳定]\n    B --&gt;|负定| D[渐近稳定]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>V 的等值面像&quot;等高线&quot;，轨线只能往下走，所以出不了谷。若谷底唯一，最终停在谷底。<\/p>\n<p>构造没有通用算法。常用：二次型、物理能量、平方和（SOS）。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 V 必须是能量。\n<\/li><li>\n别以为负半定能给渐近稳定（可能停在非零集上）。\n<\/li><li>\n别以为找不到 V 就不稳定。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 8 章<\/td><td>稳定性<\/td><td>第二方法<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：正定函数\n<\/li><li>\n后续：拉萨尔不变原理\n<\/ul>", "kind": "concept", "title": "李雅普诺夫函数"}, "__path__": {"html": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：基本概念<\/strong><br>阅读：<a href=\"#/chapter/ch01\">第 1 章：基本概念<\/a><br>检查点：说清解为何在区间上<\/li><li class='path-step' id='path-02'><strong>步骤 02：初等积分<\/strong><br>阅读：<a href=\"#/chapter/ch02\">第 2 章：初等积分法<\/a><br>检查点：恰当方程主线解四类<\/li><li class='path-step' id='path-03'><strong>步骤 03：存在唯一性<\/strong><br>阅读：<a href=\"#/chapter/ch03\">第 3 章：存在和唯一性定理<\/a><br>检查点：复述皮卡四步<\/li><li class='path-step' id='path-04'><strong>步骤 04：奇解<\/strong><br>阅读：<a href=\"#/chapter/ch04\">第 4 章：一阶隐式方程与奇解<\/a><br>检查点：判别式加回代<\/li><li class='path-step' id='path-05'><strong>步骤 05：对初值依赖<\/strong><br>阅读：<a href=\"#/chapter/ch05\">第 5 章：解对初值和参数的连续可微性<\/a><br>检查点：写变分方程<\/li><li class='path-step' id='path-06'><strong>步骤 06：线性方程组<\/strong><br>阅读：<a href=\"#/chapter/ch06\">第 6 章：线性微分方程组与高阶线性方程<\/a><br>检查点：基解矩阵<\/li><li class='path-step' id='path-07'><strong>步骤 07：解析理论<\/strong><br>阅读：<a href=\"#/chapter/ch07\">第 7 章：解析理论<\/a><br>检查点：判奇点类型<\/li><li class='path-step' id='path-08'><strong>步骤 08：定性理论<\/strong><br>阅读：<a href=\"#/chapter/ch08\">第 8 章：定性理论<\/a><br>检查点：奇点分类表<\/li><li class='path-step' id='path-09'><strong>步骤 09：边值问题<\/strong><br>阅读：<a href=\"#/chapter/ch09\">第 9 章：边值问题<\/a><br>检查点：二择一判可解<\/li><li class='path-step' id='path-10'><strong>步骤 10：首次积分<\/strong><br>阅读：<a href=\"#/chapter/ch10\">第 10 章：首次积分<\/a><br>检查点：验证一个首次积分<\/li><li class='path-step' id='path-11'><strong>步骤 11：一阶 PDE<\/strong><br>阅读：<a href=\"#/chapter/ch11\">第 11 章：一阶偏微分方程<\/a><br>检查点：特征线法一例<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "kind": "path", "title": "学习路径"}, "__quiz_all__": {"html": "<p>（无综合题）<\/p>", "kind": "quiz", "title": "综合测验"}, "__quiz_ch01__": {"html": "<h1>测验：第 1 章：基本概念<\/h1><div class='quiz-item' data-qid='q01' data-type='single'><p class='quiz-q'><b>Q1.<\/b> y(x)=y(x+1) 是常微分方程吗？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q01' value='0'> 是<\/label><label class='quiz-opt'><input type='radio' name='q01' value='1'> 不是，无导数<\/label><label class='quiz-opt'><input type='radio' name='q01' value='2'> 是，一阶<\/label><label class='quiz-opt'><input type='radio' name='q01' value='3'> 无法判断<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q02' data-type='single'><p class='quiz-q'><b>Q2.<\/b> y=1/x 作为 y′=−y² 的解，其最大存在区间是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q02' value='0'> R<\/label><label class='quiz-opt'><input type='radio' name='q02' value='1'> (0,+∞) 或 (−∞,0)<\/label><label class='quiz-opt'><input type='radio' name='q02' value='2'> [1,+∞)<\/label><label class='quiz-opt'><input type='radio' name='q02' value='3'> (−1,1)<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch02__": {"html": "<h1>测验：第 2 章：初等积分法<\/h1><div class='quiz-item' data-qid='q03' data-type='single'><p class='quiz-q'><b>Q1.<\/b> (2x+y)dx+(x+2y)dy=0 是恰当方程吗？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q03' value='0'> 是<\/label><label class='quiz-opt'><input type='radio' name='q03' value='1'> 否<\/label><label class='quiz-opt'><input type='radio' name='q03' value='2'> 需积分因子<\/label><label class='quiz-opt'><input type='radio' name='q03' value='3'> 无法判断<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q04' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 积分因子 μ 的方程为什么一般难解？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q04' value='0'> 它是二阶方程<\/label><label class='quiz-opt'><input type='radio' name='q04' value='1'> 它本身是一阶偏微分方程<\/label><label class='quiz-opt'><input type='radio' name='q04' value='2'> 它无解<\/label><label class='quiz-opt'><input type='radio' name='q04' value='3'> 它需要数值方法<\/label> ngle'><p class='quiz-q'><b>Q1.<\/b> y″+y=0，y(0)=0，y(π)=1 的解？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q17' value='0'> 唯一<\/label><label class='quiz-opt'><input type='radio' name='q17' value='1'> 两个<\/label><label class='quiz-opt'><input type='radio' name='q17' value='2'> 无解<\/label><label class='quiz-opt'><input type='radio' name='q17' value='3'> 无穷多<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q18' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 弗雷德霍姆二择一的内容？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q18' value='0'> 齐次零解 ⇔ 非齐次唯一可解<\/label><label class='quiz-opt'><input type='radio' name='q18' value='1'> 齐次有解 ⇔ 非齐次有解<\/label><label class='quiz-opt'><input type='radio' name='q18' value='2'> 总是有解<\/label><label class='quiz-opt'><input type='radio' name='q18' value='3'> 总是无解<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch10__": {"html": "<h1>测验：第 10 章：首次积分<\/h1><div class='quiz-item' data-qid='q19' data-type='single'><p class='quiz-q'><b>Q1.<\/b> F=x²+y² 是 x′=−y、y′=x 的首次积分吗？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q19' value='0'> 是<\/label><label class='quiz-opt'><input type='radio' name='q19' value='1'> 否<\/label><label class='quiz-opt'><input type='radio' name='q19' value='2'> 只在一处<\/label><label class='quiz-opt'><input type='radio' name='q19' value='3'> 无法判断<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q20' data-type='single'><p class='quiz-q'><b>Q2.<\/b> n 维系统独立首次积分最多几个？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q20' value='0'> n<\/label><label class='quiz-opt'><input type='radio' name='q20' value='1'> n−1<\/label><label class='quiz-opt'><input type='radio' name='q20' value='2'> n+1<\/label><label class='quiz-opt'><input type='radio' name='q20' value='3'> 无穷<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch11__": {"html": "<h1>测验：第 11 章：一阶偏微分方程<\/h1><div class='quiz-item' data-qid='q21' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 齐次 PDE 通解形式？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q21' value='0'> u=F(Φ)<\/label><label class='quiz-opt'><input type='radio' name='q21' value='1'> u=Φ<\/label><label class='quiz-opt'><input type='radio' name='q21' value='2'> u=常数<\/label><label class='quiz-opt'><input type='radio' name='q21' value='3'> u=x+y<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q22' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 非特征条件的作用？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q22' value='0'> 保证解唯一确定<\/label><label class='quiz-opt'><input type='radio' name='q22' value='1'> 保证解存在<\/label><label class='quiz-opt'><input type='radio' name='q22' value='2'> 保证解光滑<\/label><label class='quiz-opt'><input type='radio' name='q22' value='3'> 保证解有界<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz___all__": {"html": "<h1>测验：__all<\/h1><div class='quiz-item' data-qid='q23' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 这本书把奇解单列一章的理由是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q23' value='0'> 奇解是独立技巧<\/label><label class='quiz-opt'><input type='radio' name='q23' value='1'> 奇解是唯一性失效的几何体现<\/label><label class='quiz-opt'><input type='radio' name='q23' value='2'> 奇解常见<\/label><label class='quiz-opt'><input type='radio' name='q23' value='3'> 奇解可求<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q24' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 皮卡与皮亚诺两条证明路线的根本差别是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q24' value='0'> 构造 vs 紧性<\/label><label class='quiz-opt'><input type='radio' name='q24' value='1'> 实数 vs 复数<\/label><label class='quiz-opt'><input type='radio' name='q24' value='2'> 线性 vs 非线性<\/label><label class='quiz-opt'><input type='radio' name='q24' value='3'> 局部 vs 整体<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__cards__": {"html": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "kind": "cards", "title": "抽认卡"}, "__glossary__": {"html": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='常微分方程'>常微分方程 — 一元未知函数及其导数构成的方程 <span class=glossary-ref>（第 1 章：基本概念）<\/span><\/li><li data-term='阶'>阶 — 方程中出现的最高阶导数阶数 <span class=glossary-ref>（第 1 章：基本概念）<\/span><\/li><li data-term='积分曲线'>积分曲线 — 一阶方程的解在平面上的曲线 <span class=glossary-ref>（第 1 章：基本概念）<\/span><\/li><li data-term='线素场'>线素场 — 每点标出斜率的短线集合 <span class=glossary-ref>（第 1 章：基本概念）<\/span><\/li><li data-term='等斜线'>等斜线 — 斜率相同的点连成的线 <span class=glossary-ref>（第 1 章：基本概念）<\/span><\/li><li data-term='恰当方程'>恰当方程 — 左端为全微分的方程 <span class=glossary-ref>（第 2 章：初等积分法）<\/span><\/li><li data-term='积分因子'>积分因子 — 使方程变为恰当方程的乘子 <span class=glossary-ref>（第 2 章：初等积分法）<\/span><\/li><li data-term='平移型方程'>平移型方程 — y′=f(ax+by+c) 型 <span class=glossary-ref>（第 2 章：初等积分法）<\/span><\/li><li data-term='齐次型方程'>齐次型方程 — y′=φ(y/x) 型 <span class=glossary-ref>（第 2 章：初等积分法）<\/span><\/li><li data-term='隐式方程'>隐式方程 — 未解出导数的方程 <span class=glossary-ref>（第 4 章：一阶隐式方程与奇解）<\/span><\/li><li data-term='奇解'>奇解 — 与通解族相切且不在族内的解 <span class=glossary-ref>（第 4 章：一阶隐式方程与奇解）<\/span><\/li><li data-term='包络'>包络 — 与曲线族每条都相切的曲线 <span class=glossary-ref>（第 4 章：一阶隐式方程与奇解）<\/span><\/li><li data-term='p-判别式'>p-判别式 — 消去 p 得到的候选曲线 <span class=glossary-ref>（第 4 章：一阶隐式方程与奇解）<\/span><\/li><li data-term='c-判别式'>C-判别式 — 消去 C 得到的包络候选 <span class=glossary-ref>（第 4 章：一阶隐式方程与奇解）<\/span><\/li><li data-term='皮卡定理'>皮卡定理 — 连续 + 李普希茨 ⇒ 唯一解 <span class=glossary-ref>（第 3 章：存在和唯一性定理）<\/span><\/li><li data-term='皮亚诺定理'>皮亚诺定理 — 连续 ⇒ 存在解 <span class=glossary-ref>（第 3 章：存在和唯一性定理）<\/span><\/li><li data-term='欧拉折线'>欧拉折线 — 用折线逼近积分曲线 <span class=glossary-ref>（第 3 章：存在和唯一性定理）<\/span><\/li><li data-term='格朗沃尔引理'>格朗沃尔引理 — 积分不等式的放大估计 <span class=glossary-ref>（第 3 章：存在和唯一性定理）<\/span><\/li><li data-term='饱和解'>饱和解 — 不能继续延拓的解 <span class=glossary-ref>（第 3 章：存在和唯一性定理）<\/span><\/li><li data-term='变分方程'>变分方程 — Φ′=f_yΦ <span class=glossary-ref>（第 5 章：解对初值和参数的连续可微性）<\/span><\/li><li data-term='基解矩阵'>基解矩阵 — 线性无关解组成的矩阵 <span class=glossary-ref>（第 6 章：线性微分方程组与高阶线性方程）<\/span><\/li><li data-term='常数变易'>常数变易 — 用基解矩阵构造非齐次解 <span class=glossary-ref>（第 6 章：线性微分方程组与高阶线性方程）<\/span><\/li><li data-term='矩阵指数'>矩阵指数 — e^(At)，常系数系统的基解矩阵 <span class=glossary-ref>（第 6 章：线性微分方程组与高阶线性方程）<\/span><\/li><li data-term='若尔当块'>若尔当块 — 重特征值对应的标准形块 <span class=glossary-ref>（第 6 章：线性微分方程组与高阶线性方程）<\/span><\/li><li data-term='柯西定理'>柯西定理 — 解析右端 ⇒ 解析解 <span class=glossary-ref>（第 7 章：解析理论）<\/span><\/li><li data-term='常点'>常点 — 系数解析的点 <span class=glossary-ref>（第 7 章：解析理论）<\/span><\/li><li data-term='正则奇点'>正则奇点 — 系数极点阶数受限的奇点 <span class=glossary-ref>（第 7 章：解析理论）<\/span><\/li><li data-term='指标方程'>指标方程 — 定弗罗贝尼乌斯指数的方程 <span class=glossary-ref>（第 7 章：解析理论）<\/span><\/li><li data-term='相空间'>相空间 — 状态所在的空间 <span class=glossary-ref>（第 8 章：定性理论）<\/span><\/li><li data-term='轨线'>轨线 — 相空间中不含时间的曲线 <span class=glossary-ref>（第 8 章：定性理论）<\/span><\/li><li data-term='李雅普诺夫稳定'>李雅普诺夫稳定 — 初值近则轨线不跑远 <span class=glossary-ref>（第 8 章：定性理论）<\/span><\/li><li data-term='渐近稳定'>渐近稳定 — 稳定且趋于平衡点 <span class=glossary-ref>（第 8 章：定性理论）<\/span><\/li><li data-term='双曲平衡点'>双曲平衡点 — 特征值实部均不为零 <span class=glossary-ref>（第 8 章：定性理论）<\/span><\/li><li data-term='庞加莱-本迪克松定理'>庞加莱-本迪克松定理 — 平面捕获域无平衡点则有闭轨 <span class=glossary-ref>（第 8 章：定性理论）<\/span><\/li><li data-term='结构稳定'>结构稳定 — 微扰不改变相图拓扑 <span class=glossary-ref>（第 8 章：定性理论）<\/span><\/li><li data-term='斯特姆-刘维尔问题'>斯特姆-刘维尔问题 — 自伴特征值问题 <span class=glossary-ref>（第 9 章：边值问题）<\/span><\/li><li data-term='弗雷德霍姆二择一'>弗雷德霍姆二择一 — 齐次零解 ⇔ 非齐次唯一可解 <span class=glossary-ref>（第 9 章：边值问题）<\/span><\/li><li data-term='首次积分'>首次积分 — 沿轨线取常数的函数 <span class=glossary-ref>（第 10 章：首次积分）<\/span><\/li><li data-term='特征线'>特征线 — PDE 沿之降为 ODE 的曲线 <span class=glossary-ref>（第 11 章：一阶偏微分方程）<\/span><\/li><li data-term='非特征条件'>非特征条件 — 初始曲线横截特征方向的判据 <span class=glossary-ref>（第 11 章：一阶偏微分方程）<\/span><\/li><\/ul>", "kind": "glossary", "title": "术语表"}, "__patterns__": {"html": "<h1>模式与框架库<\/h1>\n<h2>框架：证明存在性的两条路线<\/h2>\n<ul><li>\n<strong>构造型<\/strong>：积分方程 → 迭代 → 阶乘估计 → 一致收敛。需要李普希茨。\n<\/li><li>\n<strong>紧性型<\/strong>：欧拉折线 → 等度连续 → Ascoli-Arzelà → 取子列。只需连续。\n<\/ul>\n<p>做题时先问&quot;要不要唯一&quot;：要唯一必须验证李普希茨，只证存在可走紧性路线。<\/p>\n<h2>框架：从&quot;唯一性失效&quot;看奇解<\/h2>\n<ol><li>\n通解是否漏解？\n<\/li><li>\n漏掉的解是否与族相切？\n<\/li><li>\n该点李普希茨是否失效？\n<\/ol>\n<p>三条串起来，奇解就从&quot;技巧性概念&quot;变成&quot;唯一性定理的例外&quot;。<\/p>\n<h2>决策规则<\/h2>\n<ul><li>\n一阶方程：先凑全微分；不成找 μ；μ 只依赖一个变量才可算。\n<\/li><li>\n线性方程组：齐次找基解矩阵，非齐次用常数变易。\n<\/li><li>\n边值问题：先解齐次，用二择一判可解性。\n<\/li><li>\n稳定性：先线性化，非双曲再找 V。\n<\/ul>\n<h2>反模式<\/h2>\n<ul><li>\n<strong>用判别式直接下结论<\/strong>：必须回代检验。\n<\/li><li>\n<strong>把&quot;局部解&quot;当&quot;整体解&quot;<\/strong>：必须延拓。\n<\/li><li>\n<strong>对非线性系统硬套常数变易<\/strong>：只对线性有效。\n<\/li><li>\n<strong>把&quot;稳定&quot;当&quot;渐近稳定&quot;<\/strong>：中心型稳定但不渐近。\n<\/ul>", "kind": "模式库", "title": "模式库"}, "__cheatsheet__": {"html": "<h1>速查表<\/h1>\n<h2>初等解法<\/h2>\n<table><thead><tr><th>类型<\/th><th>处理<\/th><\/tr><\/thead><tbody><tr><td>恰当 P dx+Q dy=0<\/td><td>P_y=Q_x，求 u<\/td><\/tr><tr><td>不恰当<\/td><td>μ(x) 或 μ(y)<\/td><\/tr><tr><td>分离变量<\/td><td>μ=1/g(y)<\/td><\/tr><tr><td>平移型 y′=f(ax+by+c)<\/td><td>u=ax+by+c<\/td><\/tr><tr><td>齐次型 y′=φ(y/x)<\/td><td>u=y/x<\/td><\/tr><tr><td>隐式 y=f(x,p)<\/td><td>对 x 求导<\/td><\/tr><\/tbody><\/table>\n<h2>存在唯一性<\/h2>\n<table><thead><tr><th>定理<\/th><th>条件<\/th><th>结论<\/th><\/tr><\/thead><tbody><tr><td>皮卡<\/td><td>连续 + 李普希茨<\/td><td>唯一<\/td><\/tr><tr><td>皮亚诺<\/td><td>连续<\/td><td>存在<\/td><\/tr><tr><td>格朗沃尔<\/td><td>D≤A+∫BD<\/td><td>D≤A e^(B<\/td><td>x−x₀<\/td><td>)<\/td><\/tr><tr><td>变分方程<\/td><td>f 对 y 可微<\/td><td>Φ′=f_yΦ，Φ(x₀)=I<\/td><\/tr><\/tbody><\/table>\n<h2>线性<\/h2>\n<table><thead><tr><th>场景<\/th><th>结论<\/th><\/tr><\/thead><tbody><tr><td>齐次方程组<\/td><td>解空间 m 维<\/td><\/tr><tr><td>非齐次<\/td><td>y=Φ[C+∫Φ⁻¹f]<\/td><\/tr><tr><td>常系数<\/td><td>e^(At)<\/td><\/tr><tr><td>重特征值<\/td><td>e^(λt)(I+Nt+…)<\/td><\/tr><\/tbody><\/table>\n<h2>解析<\/h2>\n<table><thead><tr><th>点型<\/th><th>方法<\/th><\/tr><\/thead><tbody><tr><td>常点<\/td><td>幂级数<\/td><\/tr><tr><td>正则奇点<\/td><td>弗罗贝尼乌斯，指标方程 r(r−1)+p₀r+q₀=0<\/td><\/tr><tr><td>非正则<\/td><td>一般无级数解<\/td><\/tr><\/tbody><\/table>\n<h2>定性<\/h2>\n<table><thead><tr><th>条件<\/th><th>类型<\/th><\/tr><\/thead><tbody><tr><td>q&lt;0<\/td><td>鞍点<\/td><\/tr><tr><td>q&gt;0, Δ&gt;0, p&lt;0<\/td><td>稳定结点<\/td><\/tr><tr><td>q&gt;0, Δ&lt;0, p&lt;0<\/td><td>稳定焦点<\/td><\/tr><tr><td>q&gt;0, p=0<\/td><td>中心<\/td><\/tr><\/tbody><\/table>\n<h2>边值<\/h2>\n<table><thead><tr><th>结论<\/th><th>内容<\/th><\/tr><\/thead><tbody><tr><td>二择一<\/td><td>齐次零解 ⇔ 非齐次唯一可解<\/td><\/tr><tr><td>正交性<\/td><td>∫ρ yₘyₙ=0<\/td><\/tr><\/tbody><\/table>\n<h2>PDE<\/h2>\n<table><thead><tr><th>类型<\/th><th>通解<\/th><\/tr><\/thead><tbody><tr><td>a u_x+b u_y=0<\/td><td>u=F(Φ)<\/td><\/tr><tr><td>拟线性<\/td><td>特征方程组 + 初始曲线<\/td><\/tr><tr><td>非特征条件<\/td><td>a dy₀/dτ−b dx₀/dτ≠0<\/td><\/tr><\/tbody><\/table>", "kind": "速查表", "title": "速查表"}}, "base_dir": "/home/user/Doubao/chats/38451120534976514/常微分方程点化学习系统/05-丁同仁-常微分方程教程", "nav": [{"label": "学习路径", "href": "#/path"}, {"label": "章节", "children": [{"label": "第 1 章：基本概念", "href": "#/chapter/ch01"}, {"label": "第 2 章：初等积分法", "href": "#/chapter/ch02"}, {"label": "第 3 章：存在和唯一性定理", "href": "#/chapter/ch03"}, {"label": "第 4 章：一阶隐式方程与奇解", "href": "#/chapter/ch04"}, {"label": "第 5 章：解对初值和参数的连续可微性", "href": "#/chapter/ch05"}, {"label": "第 6 章：线性微分方程组与高阶线性方程", "href": "#/chapter/ch06"}, {"label": "第 7 章：解析理论", "href": "#/chapter/ch07"}, {"label": "第 8 章：定性理论", "href": "#/chapter/ch08"}, {"label": "第 9 章：边值问题", "href": "#/chapter/ch09"}, {"label": "第 10 章：首次积分", "href": "#/chapter/ch10"}, {"label": "第 11 章：一阶偏微分方程", "href": "#/chapter/ch11"}]}, {"label": "概念", "children": [{"label": "奇解与包络", "href": "#/concept/c01"}, {"label": "变分方程", "href": "#/concept/c02"}, {"label": "弗雷德霍姆二择一", "href": "#/concept/c03"}, {"label": "李雅普诺夫函数", "href": "#/concept/c04"}]}, {"label": "测验", "children": [{"label": "综合测验", "href": "#/quiz/all"}, {"label": "测验：第 1 章：基本概念", "href": "#/quiz/ch01"}, {"label": "测验：第 2 章：初等积分法", "href": "#/quiz/ch02"}, {"label": "测验：第 3 章：存在和唯一性定理", "href": "#/quiz/ch03"}, {"label": "测验：第 4 章：一阶隐式方程与奇解", "href": "#/quiz/ch04"}, {"label": "测验：第 5 章：解对初值和参数的连续可微性", "href": "#/quiz/ch05"}, {"label": "测验：第 6 章：线性微分方程组与高阶线性方程", "href": "#/quiz/ch06"}, {"label": "测验：第 7 章：解析理论", "href": "#/quiz/ch07"}, {"label": "测验：第 8 章：定性理论", "href": "#/quiz/ch08"}, {"label": "测验：第 9 章：边值问题", "href": "#/quiz/ch09"}, {"label": "测验：第 10 章：首次积分", "href": "#/quiz/ch10"}, {"label": "测验：第 11 章：一阶偏微分方程", "href": "#/quiz/ch11"}]}, {"label": "抽认卡", "href": "#/cards"}, {"label": "术语表", "href": "#/glossary"}, {"label": "模式库", "href": "#/patterns"}, {"label": "速查表", "href": "#/cheatsheet"}], "rendered": {"ch01": "<h1>第 1 章：基本概念<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★☆☆ | <strong>预估学时<\/strong>：2 小时 | <strong>前置<\/strong>：微积分\n<\/li><li>\n<strong>对应原书<\/strong>：第一章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n用&quot;联系自变量、未知函数及导数&quot;的定义识别方程，并排除 y(x)=y(y(x)) 这类伪方程；\n<\/li><li>\n说清解的定义里&quot;在区间上恒等成立&quot;为什么必须强调区间；\n<\/li><li>\n理解 n 阶方程通解含 n 个常数的&quot;积分来源&quot;解释；\n<\/li><li>\n用自由落体的例子说明为什么&quot;没有定解条件的方程有无穷多解&quot;。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>丁同仁这一章刻意写得极简：只给定义和几何解释，把建模例子推后。<strong>它想让你先分清&quot;方程&quot;和&quot;解的区间&quot;这两个对象，再谈求解。<\/strong><\/p>\n<h2>零基础讲解<\/h2>\n<h3>1.1 定义里的两个坑<\/h3>\n<p>定义：F(x, y, y′, …, y⁽ⁿ⁾)=0 叫常微分方程，最高阶导数的阶叫阶。<\/p>\n<p>坑一：y(x)=y(y(x)) 不是常微分方程。因为右边是 y 在另一点的值，不是导数。教材专门点出这一点，是因为&quot;函数方程&quot;和&quot;微分方程&quot;容易混。<\/p>\n<p>坑二：解必须在<strong>区间<\/strong>上定义。y=1/x 是 y′=−y² 在 (0,+∞) 上的解，在 (−∞,0) 上也是，但不能说它在 R 上是解（0 点没定义）。<\/p>\n<h3>1.2 解与通解<\/h3>\n<p><strong>解<\/strong>：φ 在区间 I 上有直到 n 阶导数，代入后对一切 x∈I 成为恒等式。<\/p>\n<p><strong>通解<\/strong>：含 n 个独立常数的解族。教材在这里给了一个&quot;积分来源&quot;的解释：n 阶方程要积 n 次分，每次产生一个常数，所以通解该有 n 个常数。这是启发式，严格证明推迟到第十章。<\/p>\n<p>这个解释很重要，因为它说明了为什么&quot;通解&quot;这个概念天生带有&quot;不严格&quot;的色彩——它是从积分操作推出来的，而不是从解集结构证明出来的。<\/p>\n<h3>1.3 自由落体：为什么必须给初值<\/h3>\n<p>方程 y″=−g。积分两次：<\/p>\n<div class=\"eq\">y′ = −g t + C₁，y = −g t²/2 + C₁ t + C₂<\/div>\n<p>两个常数，对应&quot;从多高开始&quot;和&quot;初速度多少&quot;。不给定这两个数，方程描述的是&quot;所有自由落体运动&quot;的集合，不是一个具体运动。给定 y(0)=y₀、y′(0)=v₀，才有唯一解。<\/p>\n<blockquote>类比：方程是&quot;运动规律&quot;，初值是&quot;这次运动的档案&quot;。规律对所有下落都成立，档案只对这一次成立。<\/blockquote>\n<h3>1.4 几何解释：积分曲线<\/h3>\n<p>一阶方程 y′=f(x,y) 的每个解在平面上是一条曲线（积分曲线）。曲线在点 (x₀,y₀) 的斜率必须等于 f(x₀,y₀)——这是解的几何刻画。<\/p>\n<p>教材由此引出线素场、等斜线、奇异点，与其它教材一致，但更强调&quot;奇异点处方程不再定义方向，必须单独分析&quot;。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n    A[方程 F=0] --&gt; B[解族]\n    B --&gt; C[含 n 个常数]\n    C --&gt; D[初值条件]\n    D --&gt; E[唯一解]\n    B --&gt; F[奇异点处需单独分析]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：左上到右下是&quot;从方程到具体解&quot;的路径；右侧分支提醒你，奇异点不在这个流程的覆盖范围内。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：n 阶方程像一个 n 次积分任务，每积一次留下一个&quot;待定系数&quot;，初值就是把这些系数逐个钉死的钉子。<\/p>\n<p><strong>失效边界<\/strong>：如果方程不可积（大多数非线性方程都不可积），&quot;n 次积分&quot;的图景就不成立，但&quot;通解含 n 个常数&quot;的结论仍由存在唯一性定理保证。<\/p>\n<p><strong>实例<\/strong>：验证 y=Ce^(−2x)+x/2−1/4 是 y′+2y=x 的通解。 y′=−2Ce^(−2x)+1/2，y′+2y=(−2Ce^(−2x)+1/2)+2(Ce^(−2x)+x/2−1/4)=1/2+x−1/2=x。成立。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为&quot;解可以定义在整个实轴上&quot;<\/strong>——实际上要在使表达式有意义的区间上讨论。\n<\/li><li>\n<strong>别以为&quot;方程里导数符号出现几次就是几阶&quot;<\/strong>——实际上看最高阶。\n<\/li><li>\n<strong>别以为&quot;通解包含所有解&quot;<\/strong>——实际上可能漏掉奇解（教材在第四章专门处理）。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\ny(x)=y(x+1) 是常微分方程吗？\n<p>（答案：不是。解析：方程里没有导数，这是函数方程。）<\/p>\n<\/ol>\n<ol><li>\ny=1/x 是 y′=−y² 的解，它的最大存在区间是什么？\n<p>（答案：(0,+∞) 或 (−∞,0)，取决于初值所在的一侧。解析：x=0 处无定义。）<\/p>\n<\/ol>\n<ol><li>\n自由落体方程 y″=−g 的通解为什么有两个常数？\n<p>（答案：需要积分两次，每次产生一个常数。解析：对应初始位置与初始速度。）<\/p>\n<\/ol>\n<ol><li>\n积分曲线上某点的斜率由什么决定？\n<p>（答案：由 f(x,y) 在该点的值决定。解析：这就是方程 y′=f(x,y) 的几何含义。）<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n&quot;常&quot;指一元；阶看最高阶导数。\n<\/li><li>\n解必须在区间上恒等成立。\n<\/li><li>\n通解的 n 个常数来自 n 次积分。\n<\/ul>", "ch02": "<h1>第 2 章：初等积分法<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：10 小时 | <strong>前置<\/strong>：第 1 章、全微分\n<\/li><li>\n<strong>对应原书<\/strong>：第二章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n以&quot;恰当方程 + 积分因子&quot;为主线重述全部初等解法；\n<\/li><li>\n会用四种方式求 u：凑微分、折线积分、分组、公式；\n<\/li><li>\n说明常数变易法为什么被推迟到线性方程组一章；\n<\/li><li>\n处理形如 y′=f(ax+by+c) 的平移型方程。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>丁同仁和李承治在这一章做了一个教学上的选择：<strong>把恰当方程作为主线，其余方法都作为它的推论<\/strong>。这不是数学上的必要，而是认知上的减负——你只需要记住一件事：凑全微分。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>2.1 恰当方程<\/h3>\n<div class=\"eq\">P(x,y)dx + Q(x,y)dy = 0，P_y = Q_x<\/div>\n<p>则存在 u 使 du=P dx+Q dy，解为 u=C。<\/p>\n<p><strong>求 u 的三条路<\/strong>：<\/p>\n<ol><li>\n<strong>凑微分<\/strong>：把 P dx+Q dy 拆成几组明显的全微分，例如 x dy+y dx=d(xy)。\n<\/li><li>\n<strong>折线积分<\/strong>：u=∫[x₀→x]P(t,y₀)dt+∫[y₀→y]Q(x,s)ds。\n<\/li><li>\n<strong>先对一个变量积分再定函数<\/strong>：u=∫P dx+φ(y)，代入 u_y=Q 定出 φ′(y)。\n<\/ol>\n<h3>2.2 积分因子<\/h3>\n<p>不恰当时找 μ。教材强调：μ 的方程<\/p>\n<div class=\"eq\">μ(P_y−Q_x) + P μ_y − Q μ_x = 0<\/div>\n<p>本身是一个一阶偏微分方程，一般难解。所以只处理 μ=μ(x) 与 μ=μ(y) 两种退化情形，判据就是两个商式。<\/p>\n<p><strong>一个容易忽略的点<\/strong>：若 μ 只依赖 x+y 或 xy，也可能可求。教材在习题里放了这类，但正文不展开。<\/p>\n<h3>2.3 一阶线性方程与常数变易<\/h3>\n<p>标准形 y′+P(x)y=Q(x)。教材在这里只给公式，把&quot;常数变易&quot;的系统讨论推迟到第六章（线性方程组）。这个安排有道理：常数变易的本质是&quot;在解空间里换坐标&quot;，用向量语言讲更清楚。<\/p>\n<h3>2.4 平移型与齐次型<\/h3>\n<p><strong>平移型<\/strong> y′=f(ax+by+c)。令 u=ax+by+c，则 u′=a+b f(u)，变成变量分离。<\/p>\n<p><strong>齐次型<\/strong> y′=φ(y/x)。令 u=y/x，得 x u′=φ(u)−u。<\/p>\n<p>这两类合起来覆盖了绝大多数&quot;看起来不像分离变量&quot;的一阶方程。<\/p>\n<h3>2.5 隐式方程<\/h3>\n<p>y=f(x,p) 与 x=f(y,p) 用参数 p 降阶；F(x,y,p)=0 一般只能局部解出。教材在这里的处理与其它教材一致，但更强调&quot;参数化是一种坐标变换，不是新方法&quot;。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[P dx + Q dy = 0] --&gt; B{P_y = Q_x}\n    B --&gt;|是| C[求 u]\n    C --&gt; D[u = C]\n    B --&gt;|否| E[找 mu]\n    E --&gt; F[mu 只含 x]\n    E --&gt; G[mu 只含 y]\n    F --&gt; C\n    G --&gt; C\n    A --&gt; H[特殊类型]\n    H --&gt; I[平移型 令 u=ax+by+c]\n    H --&gt; J[齐次型 令 u=y/x]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：图中所有箭头最终都指向&quot;求 u&quot;。这是本章唯一的终点。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：恰当方程像&quot;已经写好的收据&quot;——左边就是某笔账的总额变化；积分因子是&quot;把零散的账目重新归并成一张收据&quot;的操作。<\/p>\n<p><strong>失效边界<\/strong>：如果 μ 必须依赖 x 与 y 的复杂组合，归并就无法显式完成，方程也就&quot;不可积&quot;。<\/p>\n<p><strong>实例<\/strong>：解 (3x²+6xy²)dx+(6x²y+4y³)dy=0。 P_y=12xy，Q_x=12xy，恰当。凑微分：3x²dx+4y³dy+6xy²dx+6x²y dy = d(x³)+d(y⁴)+d(3x²y²)。 于是 u=x³+y⁴+3x²y²，解为 x³+3x²y²+y⁴=C。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为&quot;恰当方程一定是全微分形式一眼可见&quot;<\/strong>——实际上很多要分组凑。\n<\/li><li>\n<strong>别以为&quot;积分因子只依赖一个变量才可求&quot;<\/strong>——实际上特殊组合也可能，但教材不展开。\n<\/li><li>\n<strong>别以为&quot;常数变易是初等技巧&quot;<\/strong>——实际上它是线性代数观点，安排在方程组一章更合适。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n验证 (2x+y)dx+(x+2y)dy=0 恰当并求解。\n<p>（答案：P_y=1=Q_x；u=x²+xy+y²；解 x²+xy+y²=C。解析：直接凑 d(x²)+d(xy)+d(y²)。）<\/p>\n<\/ol>\n<ol><li>\n求 y′=f(2x+3y+1) 的换元。\n<p>（答案：令 u=2x+3y+1，则 u′=2+3f(u)。解析：化为变量分离。）<\/p>\n<\/ol>\n<ol><li>\n为什么 μ 的方程是一阶偏微分方程？\n<p>（答案：因为 μ 依赖 x、y 两个变量，方程含 μ_x 与 μ_y。解析：一般难解，故只做退化情形。）<\/p>\n<\/ol>\n<ol><li>\n折线积分法求 u 的公式？\n<p>（答案：u=∫P(t,y₀)dt+∫Q(x,s)ds。解析：沿水平再沿竖直线段积分，路径无关性由恰当性保证。）<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n主线：凑全微分。\n<\/li><li>\n恰当判据 P_y=Q_x；不恰当找 μ。\n<\/li><li>\n平移型、齐次型都靠换元化为分离变量。\n<\/ul>", "ch03": "<h1>第 3 章：存在和唯一性定理<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：10 小时 | <strong>前置<\/strong>：第 2 章、一致收敛\n<\/li><li>\n<strong>对应原书<\/strong>：第三章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n完整叙述并证明皮卡定理，包括 h 的取法与迭代估计；\n<\/li><li>\n证明皮亚诺定理（连续即可存在），并说明它比皮卡弱在哪；\n<\/li><li>\n说清&quot;局部存在&quot;与&quot;整体存在&quot;的差别；\n<\/li><li>\n用格朗沃尔引理处理一切&quot;差被积分控制&quot;的情形。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>丁同仁把存在性放在第三章、把&quot;对初值的依赖&quot;放到第五章，中间隔着奇解一章。这个顺序的意思是：<strong>先保证有解，再看解怎么变，最后处理唯一性失效留下的尾巴。<\/strong><\/p>\n<h2>零基础讲解<\/h2>\n<h3>3.1 皮卡定理<\/h3>\n<p>设 f(x,y) 在 R：|x−x₀|≤a，|y−y₀|≤b 连续，关于 y 满足李普希茨（常数 L）。则存在唯一解，定义在 |x−x₀|≤h，h=min(a, b/M)，M=max|f|。<\/p>\n<p><strong>证明的四步<\/strong>：<\/p>\n<ol><li>\n化积分方程 y=y₀+∫f(t,y)dt。\n<\/li><li>\n定义迭代 φₙ₊₁=y₀+∫f(t,φₙ)dt，并证明每个 φₙ 落在 R 内。\n<\/li><li>\n估计相邻差 |φₙ₊₁−φₙ|≤M Lⁿ|x−x₀|ⁿ⁺¹/(n+1)!，得一致收敛。\n<\/li><li>\n极限 φ 连续且满足积分方程（存在）；两个解作差用格朗沃尔（唯一）。\n<\/ol>\n<p><strong>注意第 2 步常被跳过<\/strong>。如果没有它，第 3 步的 f(t,φₙ) 可能根本没有定义。<\/p>\n<h3>3.2 皮亚诺定理<\/h3>\n<p>只要求 f 连续。证明用欧拉折线 + Ascoli-Arzelà：折线族等度连续、一致有界，故有收敛子列，极限满足积分方程。<\/p>\n<p><strong>为什么这里不能照搬皮卡？<\/strong> 因为没有李普希茨，&quot;相邻差&quot;估计失效，迭代序列可能不收敛。<\/p>\n<h3>3.3 局部与整体<\/h3>\n<p>皮卡给的是局部解（|x−x₀|≤h）。整体存在需要延拓：只要解还在定义域内部，就继续接下去。<\/p>\n<p>教材在这里给出延拓的判据：解在端点处若仍留在定义域内部，就能延伸；否则终止（到达边界或爆破）。<\/p>\n<h3>3.4 格朗沃尔引理的地位<\/h3>\n<p>它在本章只出现一次（唯一性），但会在第五章（连续依赖）、第六章（稳定性估计）反复出现。建议现在就把它当成一个独立工具记住：<\/p>\n<div class=\"eq\">D(x) ≤ A + ∫B D ⇒ D(x) ≤ A e^(B|x−x₀|)<\/div>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[初值问题] --&gt; B[积分方程]\n    B --&gt; C[皮卡迭代]\n    C --&gt; D[一致收敛]\n    D --&gt; E[存在]\n    E --&gt; F[格朗沃尔]\n    F --&gt; G[唯一]\n    E --&gt; H[局部解]\n    H --&gt; I[延拓 整体解]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：注意&quot;局部解&quot;与&quot;整体解&quot;之间还有一步延拓，很多证明题漏掉这一步就开始讨论全局性质。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：皮卡迭代像&quot;反复修草稿&quot;：每一稿都比上一稿更接近真解，且误差按阶乘速度缩小。<\/p>\n<p><strong>失效边界<\/strong>：如果 f 在 y 方向变化太剧烈（不满足李普希茨），第 n 稿可能越来越乱，不收敛。<\/p>\n<p><strong>实例<\/strong>：y′=x+y，y(0)=0。迭代： φ₀=0，φ₁=x²/2，φ₂=x²/2+x³/6，φ₃=x²/2+x³/6+x⁴/24。 极限是 eˣ−1−x。验证：y′=eˣ−1，而 x+y=x+eˣ−1−x=eˣ−1，成立。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为&quot;李普希茨条件必须显式给出&quot;<\/strong>——实际上只要 ∂f/∂y 在矩形上有界，就能取 L 为其上界。\n<\/li><li>\n<strong>别以为&quot;皮亚诺定理更强&quot;<\/strong>——实际上它更弱：只保证存在。\n<\/li><li>\n<strong>别以为&quot;局部解就是全部&quot;<\/strong>——实际上还要延拓。\n<\/li><li>\n<strong>别以为&quot;格朗沃尔只能用在唯一性&quot;<\/strong>——实际上它是所有误差估计的通用工具。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n为什么迭代前必须证明 φₙ 落在 R 内？\n<p>（答案：否则 f(t,φₙ(t)) 可能无定义，迭代无法继续。解析：R 是 f 的定义域。）<\/p>\n<\/ol>\n<ol><li>\n皮亚诺定理的证明用了哪条紧性定理？\n<p>（答案：Ascoli-Arzelà。解析：等度连续 + 一致有界 ⇒ 有收敛子列。）<\/p>\n<\/ol>\n<ol><li>\nh=min(a,b/M) 中 b/M 的作用？\n<p>（答案：保证 |φₙ(x)−y₀|≤M|x−x₀|≤Mh≤b，不跑出矩形。解析：这是第 2 步的核心估计。）<\/p>\n<\/ol>\n<ol><li>\n延拓终止的两种情形？\n<p>（答案：抵达定义域边界，或解在有限时间爆破。解析：如 y′=y² 的解在 1 处爆破。）<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n皮卡：连续 + 李普希茨 ⇒ 唯一；皮亚诺：连续 ⇒ 存在。\n<\/li><li>\n四步证明：积分方程、迭代、估计、收敛 + 格朗沃尔。\n<\/li><li>\n局部 → 延拓 → 整体。\n<\/ul>", "ch04": "<h1>第 4 章：一阶隐式方程与奇解<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：7 小时 | <strong>前置<\/strong>：第 2、3 章\n<\/li><li>\n<strong>对应原书<\/strong>：第四章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n解 p-可解型与 x-可解型隐式方程，写出参数形式的通解；\n<\/li><li>\n区分&quot;奇解&quot;与&quot;通解中的某个特解&quot;；\n<\/li><li>\n用 p-判别式与 C-判别式求包络，并回代检验；\n<\/li><li>\n说明奇解存在与唯一性失效的关系。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>奇解不是&quot;算出来的一个解&quot;，而是&quot;唯一性失效处露出来的另一族解&quot;。第四章放在存在唯一性之后，正是因为它必须用第三章的定理来解释。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>4.1 隐式方程的四类<\/h3>\n<p><strong>第一类<\/strong> y=f(x,p)：对 x 求导得 p=f_x+f_p·dp/dx，解出 p 后再积分。 <strong>第二类<\/strong> x=f(y,p)：把 dx/dy=1/p，得 1/p=f_y+f_p·dp/dy。 <strong>第三类<\/strong> F(x,y,p)=0：若能解出 y 或 x，归入前两类；否则用参数化。 <strong>第四类<\/strong> 克莱罗与拉格朗日型：有专门的技巧。<\/p>\n<h3>4.2 奇解的定义<\/h3>\n<p><strong>奇解<\/strong>：本身是解，且在其上每一点都与通解族中某条曲线相切，但不属于通解族。<\/p>\n<p>三个条件缺一不可：是解、相切、不在族内。只说&quot;不在族内&quot;不够——y≡0 对 y′=y² 也不在族内，但它不是奇解（它不与任何解曲线相切）。<\/p>\n<h3>4.3 判别式<\/h3>\n<p><strong>p-判别式<\/strong>：从 F(x,y,p)=0 与 F_p(x,y,p)=0 消去 p。 <strong>C-判别式<\/strong>：从通解 Φ(x,y,C)=0 与 Φ_C=0 消去 C。<\/p>\n<p>两者都只是<strong>候选<\/strong>。p-判别式可能包含&quot;根本不是解&quot;的曲线（例如 F=(y′−y)(y′−1)=0 的判别式可能给出奇怪的东西），必须回代检验。<\/p>\n<h3>4.4 奇解与唯一性的关系<\/h3>\n<p>奇解上的每一点，初值问题的解都不唯一：一条是经过该点的通解曲线，另一条是奇解本身。这正是第三章李普希茨条件失效的几何表现。<\/p>\n<p><strong>定理<\/strong>（简述）：若 f 在奇解附近满足李普希茨，则不会有奇解穿过。所以奇解一定出现在&quot;李普希茨失效&quot;的地方。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[隐式方程 F=0] --&gt; B{能否解出 y 或 x}\n    B --&gt;|能| C[参数化 p 求导]\n    B --&gt;|不能| D[直接参数表示]\n    C --&gt; E[通解]\n    E --&gt; F[C-判别式]\n    F --&gt; G[包络候选]\n    G --&gt; H[回代检验]\n    H --&gt;|是解| I[奇解]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：右侧那条&quot;判别式 → 检验&quot;的链条是最容易省略的一步。省略了就会把&quot;假奇解&quot;写进答案。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：通解族像一摞同心圆，奇解像它们的外公切线。每条圆都与公切线相切，但公切线本身不是任何一条圆。<\/p>\n<p><strong>失效边界<\/strong>：如果曲线族彼此相交（不是&quot;族&quot;而是&quot;网&quot;），包络的概念就不适用。<\/p>\n<p><strong>实例<\/strong>：y=xp+p²。求导得 (x+2p)dp/dx=0。 分支一：p=C，y=Cx+C²（直线族）。 分支二：x=−2p，代回 y=−2p²+p²=−p²，即 y=−x²/4。 检验：y′=−x/2，而 xp+p²=x(−x/2)+x²/4=−x
