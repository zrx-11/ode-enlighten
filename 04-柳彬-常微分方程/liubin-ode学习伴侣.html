…, vₘe^(λₘx)]<\/div>\n<p>这就是&quot;单特征值情形最好算&quot;的原因：不需要求若尔当形，也不需要处理 t 的幂。<\/p>\n<h3>5.3 常系数：重特征值<\/h3>\n<p>若 λ 是 k 重特征值，但几何重数不足，则需要广义特征向量链 v₁,…,v_k，满足 (A−λI)v_j=v_{j−1}。对应的解是<\/p>\n<div class=\"eq\">e^(λx)[v₁ + v₂x + … + v_k x^(k−1)/(k−1)!]<\/div>\n<p>这与矩阵指数里的若尔当块写法完全一致：多出来的 t 的幂，来自广义特征向量链的长度。<\/p>\n<h3>5.4 高阶线性方程<\/h3>\n<p>y⁽ⁿ⁾+a₁y⁽ⁿ⁻¹⁾+…+aₙy=f 通过令 y₁=y, y₂=y′,… 化为一阶方程组。反过来，方程组的每个分量都满足一个 n 阶方程（消元法的结果）。两种框架的信息量相同。<\/p>\n<h3>5.5 周期系数：弗洛凯理论<\/h3>\n<p>若 A(x+T)=A(x)，则基解矩阵满足<\/p>\n<div class=\"eq\">Φ(x+T) = Φ(x)·M<\/div>\n<p>M=Φ(T) 叫<strong>单值矩阵<\/strong>（monodromy matrix）。它的特征值叫<strong>弗洛凯乘子<\/strong>。判据：<\/p>\n<ul><li>\n所有乘子的模 &lt; 1 ⇒ 零解渐近稳定；\n<\/li><li>\n有乘子的模 &gt; 1 ⇒ 不稳定；\n<\/li><li>\n模等于 1 ⇒ 临界，需进一步分析。\n<\/ul>\n<p>这条结论的意义：周期系数系统不能用&quot;特征值实部&quot;判断，因为没有常特征值；必须用&quot;绕一圈之后的放大倍数&quot;。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[线性方程组] --&gt; B[齐次]\n    B --&gt; C[基解矩阵 Phi]\n    C --&gt; D[常数变易解非齐次]\n    A --&gt; E[常系数]\n    E --&gt; F[单特征值 直接写]\n    E --&gt; G[重特征值 广义特征向量]\n    E --&gt; H[矩阵指数]\n    A --&gt; I[周期系数]\n    I --&gt; J[单值矩阵]\n    J --&gt; K[弗洛凯乘子判稳]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：右下角那一支是本章区别于普通教材的地方。周期系数系统没有&quot;特征值&quot;可用，只能靠&quot;绕一圈的放大倍数&quot;。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：单值矩阵像&quot;跑完一圈的账本&quot;。每一步的盈亏可能很复杂，但一年下来账户变了多少倍，就是那一两个乘子说了算。<\/p>\n<p><strong>失效边界<\/strong>：乘子模等于 1 时账本可能&quot;总体不增不减&quot;，但内部有共振，单看乘子判断不了。<\/p>\n<p><strong>实例<\/strong>：马蒂厄方程 y″+(δ+ε cos 2x)y=0 是周期系数方程，它的稳定性区域图（ tongues）正是弗洛凯理论的应用。参数落在稳定舌内，解有界；落在舌外，解指数增长。<\/p>\n<p><strong>实例 2<\/strong>：A=[[0,1],[−1,0]]（常系数），Φ(x)=[[cos x, sin x],[−sin x, cos x]]，det Φ=1，乘子为 e^(±ix)，模为 1，属于临界情形——对应中心。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为&quot;周期系数也能算特征值&quot;<\/strong>——实际上 A(x) 随 x 变，没有固定特征值，必须用单值矩阵。\n<\/li><li>\n<strong>别以为&quot;重特征值一定需要若尔当块&quot;<\/strong>——实际上几何重数够时可以对角化。\n<\/li><li>\n<strong>别以为&quot;基解矩阵唯一&quot;<\/strong>——实际上任意右乘一个非奇异常矩阵仍是基解矩阵。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n刘维尔公式在方程组情形是什么？\n<p>（答案：det Φ(x)=det Φ(x₀)exp(∫tr A dt)。解析：迹接替了标量方程里的 a₁。）<\/p>\n<\/ol>\n<ol><li>\n单值矩阵的定义？\n<p>（答案：M=Φ(T)，其中 Φ 是基解矩阵，T 是周期。解析：它把&quot;走一个周期&quot;的演化压成一个矩阵。）<\/p>\n<\/ol>\n<ol><li>\n弗洛凯乘子模为 1 时能下结论吗？\n<p>（答案：不能，属于临界情形，需要进一步分析。解析：模为 1 对应不增不减，可能有共振或多项式增长。）<\/p>\n<\/ol>\n<ol><li>\n重特征值的解里为什么会出现 x 的幂？\n<p>（答案：广义特征向量链导致，与若尔当块同理。解析：见 e^(λx)[v₁+v₂x+…] 的形式。）<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n齐次 m 维、非齐次 = 特解 + 齐次。\n<\/li><li>\n常系数：单根直接写，重根用广义特征向量。\n<\/li><li>\n周期系数：算单值矩阵，看乘子模。\n<\/ul>", "ch06": "<h1>第 6 章：解析解与幂级数解法<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：7 小时 | <strong>前置<\/strong>：第 3、5 章、复变函数初步、幂级数\n<\/li><li>\n<strong>对应原书<\/strong>：第六章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n陈述柯西定理：右端解析 ⇒ 解解析，并说明收敛半径怎么估；\n<\/li><li>\n在常点附近用幂级数求方程的解，写出系数递推关系；\n<\/li><li>\n区分常点、正则奇点、非正则奇点；\n<\/li><li>\n用弗罗贝尼乌斯方法处理正则奇点；\n<\/li><li>\n说明解析解与数值解、定性分析三者的适用边界。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>幂级数解法是&quot;在解不出来的时候，把解写成一串系数&quot;。柯西定理保证这串系数确实收敛到一个真解，收敛半径由右端函数的奇点位置决定。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>6.1 柯西定理<\/h3>\n<p><strong>定理<\/strong>：若 f(x,y) 在点 (x₀,y₀) 的邻域内解析（对 x、y 都能展成收敛的幂级数），则初值问题的解 y(x) 在 x₀ 的某邻域内也解析。<\/p>\n<p>证明思路是&quot;优级数法&quot;：把 f 的幂级数系数用一个大常数 M 压住，构造一个比它增长更快的&quot;优函数&quot;，证明形式幂级数的系数被优级数控制，从而收敛。<\/p>\n<p><strong>收敛半径的实用估计<\/strong>：解的收敛半径不小于&quot;从 x₀ 到 f 的最近奇点&quot;的距离。例如<\/p>\n<div class=\"eq\">y′ = y/(1−x²)<\/div>\n<p>右端在 x=±1 奇，从 0 出发的收敛半径不超过 1。<\/p>\n<h3>6.2 常点处的幂级数解法<\/h3>\n<p>设 y=Σaₖ(x−x₀)ᵏ，代入方程，比较各次幂的系数，得到递推关系。以勒让德方程为例：<\/p>\n<div class=\"eq\">(1−x²)y″ − 2xy′ + n(n+1)y = 0，x₀=0<\/div>\n<p>代入后 xᵏ 的系数满足<\/p>\n<div class=\"eq\">(k+2)(k+1)a_{k+2} = (k−n)(k+n+1)a_k<\/div>\n<p>这个递推把偶数项和奇数项分开，得到两个独立解。当 n 为整数时，其中一个解退化成多项式——这就是勒让德多项式。<\/p>\n<h3>6.3 奇点分类<\/h3>\n<p>把方程写成标准形<\/p>\n<div class=\"eq\">y″ + p(x)y′ + q(x)y = 0<\/div>\n<ul><li>\n<strong>常点<\/strong>：p、q 在 x₀ 解析。\n<\/li><li>\n<strong>正则奇点<\/strong>：p 至多一阶极点，q 至多二阶极点，即 (x−x₀)p 与 (x−x₀)²q 解析。\n<\/li><li>\n<strong>非正则奇点<\/strong>：极点阶数更高。\n<\/ul>\n<p><strong>弗罗贝尼乌斯方法<\/strong>：在正则奇点处设<\/p>\n<div class=\"eq\">y = (x−x₀)^r·Σaₖ(x−x₀)ᵏ，a₀≠0<\/div>\n<p>代入得指标方程（关于 r 的二次方程）。两个根之差不为整数时，给出两个独立的级数解；差为整数时，第二个解可能带对数项。<\/p>\n<h3>6.4 三种方法的边界<\/h3>\n<table><thead><tr><th>方法<\/th><th>适用<\/th><th>给什么<\/th><th>不给什么<\/th><\/tr><\/thead><tbody><tr><td>初等积分<\/td><td>少数可积类型<\/td><td>显式解<\/td><td>大多数方程不行<\/td><\/tr><tr><td>幂级数<\/td><td>常点/正则奇点附近<\/td><td>局部解析解<\/td><td>全局行为、大范围结构<\/td><\/tr><tr><td>定性分析<\/td><td>一般非线性系统<\/td><td>稳定性、相图<\/td><td>具体解的数值<\/td><\/tr><\/tbody><\/table>\n<p>这张表是整门课的&quot;方法论地图&quot;：没有一种方法能包打天下。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[方程] --&gt; B{右端是否解析}\n    B --&gt;|是| C[柯西定理 解解析]\n    C --&gt; D[常点 幂级数]\n    C --&gt; E[正则奇点 弗罗贝尼乌斯]\n    B --&gt;|否| F[定性或数值]\n    E --&gt; G[指标方程]\n    G --&gt; H{两根差是否为整数}\n    H --&gt;|否| I[两个独立级数解]\n    H --&gt;|是| J[第二个解可能带对数]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：判定顺序是&quot;解析性 → 点类型 → 方法&quot;。指标方程的根之差是正则奇点情形最关键的分叉点。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：幂级数解法像&quot;用一列越来越细的积木拼出函数&quot;。递推关系告诉你下一块积木多长；柯西定理保证这堆积木不会拼到一半就塌。<\/p>\n<p><strong>失效边界<\/strong>：在奇点附近（尤其非正则奇点），积木尺寸可能指数增长，级数根本不收敛。<\/p>\n<p><strong>实例<\/strong>：解 y″−xy=0（艾里方程）在 x=0 附近。 设 y=Σaₖxᵏ，代入得 Σk(k−1)aₖx^(k−2) = Σaₖx^(k+1)。 移项比较系数：a₂=0，(k+2)(k+1)a_{k+2}=a_{k−1}。 于是 a₃=a₀/6，a₄=a₁/12，a₅=0，a₆=a₃/30=a₀/180…两组解分别由 a₀、a₁ 生成。这个级数在全平面收敛（因为右端 x·y 是整函数）。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为&quot;幂级数解法能给出全局解&quot;<\/strong>——实际上只在收敛半径内有效。\n<\/li><li>\n<strong>别以为&quot;奇点一定不能解&quot;<\/strong>——实际上正则奇点可以用弗罗贝尼乌斯方法。\n<\/li><li>\n<strong>别以为&quot;两个根之差为整数就无解&quot;<\/strong>——实际上第二个解可能是带对数的形式，仍存在。\n<\/li><li>\n<strong>别以为&quot;解析解总比数值解好&quot;<\/strong>——实际上大范围行为、混沌现象，解析解给不出。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n柯西定理的条件是什么？\n<p>（答案：f 在初值点邻域内解析。解析：只要求解析，不要求李普希茨的显式常数。）<\/p>\n<\/ol>\n<ol><li>\n方程 (1−x²)y″−2xy′+6y=0 在 x=0 处的收敛半径至少是多少？\n<p>（答案：1。解析：右端系数的最近奇点在 x=±1，距离为 1。）<\/p>\n<\/ol>\n<ol><li>\n正则奇点的判定条件？\n<p>（答案：(x−x₀)p 与 (x−x₀)²q 都在 x₀ 解析。解析：即 p 至多一阶极点，q 至多二阶极点。）<\/p>\n<\/ol>\n<ol><li>\n指标方程两根之差为整数时会发生什么？\n<p>（答案：第二个线性无关解可能含对数项。解析：这是弗罗贝尼乌斯方法的经典例外。）<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n右端解析 ⇒ 解解析（柯西定理）。\n<\/li><li>\n收敛半径 ≥ 到最近奇点的距离。\n<\/li><li>\n常点幂级数、正则奇点弗罗贝尼乌斯。\n<\/ul>", "ch07": "<h1>第 7 章：边值问题<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：9 小时 | <strong>前置<\/strong>：第 5 章、变分法初步、泛函分析入门\n<\/li><li>\n<strong>对应原书<\/strong>：第七章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n写出斯特姆-刘维尔问题的标准形式与边界条件；\n<\/li><li>\n用斯特姆比较定理判断两个方程解的零点个数关系；\n<\/li><li>\n证明不同特征值的特征函数带权正交；\n<\/li><li>\n说明周期边值问题与普通边值问题的差别；\n<\/li><li>\n把特征值问题理解为&quot;线性算子的谱&quot;。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>边值问题的核心不是&quot;解出来&quot;，而是&quot;算谱&quot;：<strong>特征值是可数无穷的，特征函数构成正交基<\/strong>。这套结论是傅里叶级数、量子力学、振动模态的共同底座。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>7.1 斯特姆-刘维尔形式<\/h3>\n<div class=\"eq\">(p(x)y′)′ + [λρ(x) − q(x)]y = 0，a ≤ x ≤ b<\/div>\n<p>其中 p&gt;0，ρ&gt;0。边界条件通常是分离型：<\/p>\n<div class=\"eq\">α₁y(a)+α₂y′(a)=0，β₁y(b)+β₂y′(b)=0<\/div>\n<p>这一形式的关键是<strong>自伴<\/strong>：把算子 L[y]=(py′)′−qy 拿来做分部积分，边界项会消失（因为边界条件），于是<\/p>\n<div class=\"eq\">⟨L[y], z⟩ = ⟨y, L[z]⟩<\/div>\n<p>自伴性是后面所有结论的源头。<\/p>\n<h3>7.2 斯特姆比较定理<\/h3>\n<p><strong>定理（比较定理）<\/strong>：设 (p₁y′)′+q₁y=0 与 (p₂y′)′+q₂y=0，若在区间上 q₂≥q₁ 且 p₂≤p₁，则第一个方程的任一非零解在 (a,b) 内的零点个数不多于第二个方程。<\/p>\n<p>白话：<strong>势能越大（q 越大）、扩散越弱（p 越小），解震荡得越快，零点越多<\/strong>。<\/p>\n<p>这条定理的用处是定性判断：不必解出方程，就能知道解转了几圈。它也是特征值单调性的来源——q 增大，第 n 个特征值随之增大。<\/p>\n<h3>7.3 正交性<\/h3>\n<p>设 yₘ、yₙ 对应不同特征值 λₘ≠λₙ，则<\/p>\n<div class=\"eq\">∫[a→b] ρ(x)·yₘ(x)·yₙ(x) dx = 0<\/div>\n<p>证明只有三步：两个方程分别乘以对方的解、相减、在 [a,b] 上积分，边界项由边界条件消掉，剩下 (λₘ−λₙ)∫ρyₘyₙ=0。<\/p>\n<p><strong>为什么这条重要<\/strong>：它让&quot;展开系数&quot;可以像向量投影一样算出来：<\/p>\n<div class=\"eq\">cₙ = ∫ρ·f·yₙ dx / ∫ρ·yₙ² dx<\/div>\n<h3>7.4 周期边值问题<\/h3>\n<p>条件改成 y(a)=y(b)，y′(a)=y′(b)。此时边界项在分部积分中同样消失，自伴性保留，但特征值结构不同：可能出现二重特征值（对应 sin 与 cos 同时是特征函数），也可能出现负特征值。<\/p>\n<p>周期边值问题比分离边界更&quot;富&quot;，因为它允许解绕一圈后回到原样——这正是傅里叶级数里 cos nx、sin nx 成对出现的原因。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[斯特姆-刘维尔形式] --&gt; B[自伴性]\n    B --&gt; C[特征值实数]\n    B --&gt; D[特征函数正交]\n    D --&gt; E[可按特征函数展开]\n    A --&gt; F[比较定理]\n    F --&gt; G[零点个数比较]\n    G --&gt; H[特征值单调性]\n    A --&gt; I[周期边值]\n    I --&gt; J[二重特征值 傅里叶级数]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：从&quot;自伴&quot;出发分三支：实特征值、正交性、可展开。右边两支是定性结论（比较定理、周期情形），它们不需要解出方程。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：特征函数像琴弦的各个驻波模式。基频是第一个特征值，泛音是后面的。不同模式在同一点上的位移乘积积分为零，这就是正交性的物理版本。<\/p>\n<p><strong>失效边界<\/strong>：如果边界条件不是自伴型（比如混合了非线性边界），正交性可能失效。<\/p>\n<p><strong>实例<\/strong>：y″+λy=0，y(0)=y(π)=0。特征值 λₙ=n²，特征函数 yₙ=sin nx。验证正交性：<\/p>\n<p>∫₀^π sin mx sin nx dx = 0（m≠n）。这是三角函数的正交性，也是傅里叶正弦级数的基础。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为&quot;边值问题总有特征值&quot;<\/strong>——实际上需要正则性条件（p、q、ρ 连续且 p、ρ 为正）。\n<\/li><li>\n<strong>别以为&quot;正交性靠巧合&quot;<\/strong>——实际上是自伴性 + 边界条件的必然结果。\n<\/li><li>\n<strong>别以为&quot;周期边值就是分离边值的特例&quot;<\/strong>——实际上谱结构不同，可能出现重特征值。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n斯特姆-刘维尔算子为什么是自伴的？\n<p>（答案：分部积分后边界项由边界条件消去。解析：⟨Ly,z⟩−⟨y,Lz⟩ 只剩边界项。）<\/p>\n<\/ol>\n<ol><li>\n比较定理中 q₂≥q₁ 说明什么？\n<p>（答案：第二个方程的解零点更多，震荡更快。解析：势能越大，解转得越快。）<\/p>\n<\/ol>\n<ol><li>\n展开系数公式里的权函数 ρ 起什么作用？\n<p>（答案：定义带权内积，使特征函数在该内积下正交。解析：cₙ=∫ρfyₙ/∫ρyₙ²。）<\/p>\n<\/ol>\n<ol><li>\n周期边值问题为什么会出现二重特征值？\n<p>（答案：sin nx 与 cos nx 同时满足周期条件，对应同一特征值。解析：这就是傅里叶级数成对出现的原因。）<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\nS-L 形式的关键是自伴。\n<\/li><li>\n自伴 ⇒ 实特征值 + 正交 + 可展开。\n<\/li><li>\n比较定理：q 大、p 小 ⇒ 零点多。\n<\/ul>", "ch08": "<h1>第 8 章：一阶偏微分方程<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：6 小时 | <strong>前置<\/strong>：第 2、3 章、隐函数定理\n<\/li><li>\n<strong>对应原书<\/strong>：第八章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n给出首次积分的定义与三条基本性质；\n<\/li><li>\n说明首次积分存在性与向量场线性无关性的关系；\n<\/li><li>\n用特征线法解一阶齐次与拟线性偏微分方程；\n<\/li><li>\n从几何角度解释解的构成：特征线织成解曲面；\n<\/li><li>\n判断柯西问题的局部可解性。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>一阶偏微分方程的解法，本质是&quot;沿特征线把偏导变成常导&quot;。首次积分是这条路线上的通用货币。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>8.1 首次积分的定义与性质<\/h3>\n<p>对自治方程组 dx/dt=X(x)，函数 F(x) 若沿每条轨线为常数，即<\/p>\n<div class=\"eq\">X·∇F = 0<\/div>\n<p>则称 F 是首次积分。<\/p>\n<p>三条性质：<\/p>\n<ol><li>\n<strong>沿轨线为常数<\/strong>，因此每个首次积分把相空间切成若干不变面；\n<\/li><li>\n<strong>首次积分的任意函数仍是首次积分<\/strong>（因为复合后方向导数仍为零）；\n<\/li><li>\n<strong>首次积分在区域内连续可微且梯度不为零时，其等值面是 (n−1) 维的<\/strong>。\n<\/ol>\n<h3>8.2 存在性<\/h3>\n<p>n 维自治系统在一点附近有 n−1 个独立首次积分，条件是向量场在该点不为零（局部存在）。证明用局部坐标变换把向量场拉直成&quot;第一个分量恒为 1&quot;，其余分量视为参数，于是问题化为解 n−1 个常微分方程。<\/p>\n<p>如果向量场在某点为零（平衡点），首次积分的个数和结构都会退化——这正是定性理论要单独处理平衡点的原因。<\/p>\n<h3>8.3 一阶齐次线性偏微分方程<\/h3>\n<div class=\"eq\">a(x,y)u_x + b(x,y)u_y = 0<\/div>\n<p>特征方程 dy/dx=b/a，其首次积分 Φ(x,y)=C。通解 u=F(Φ)。<\/p>\n<p><strong>几何解释<\/strong>：u 在每条特征线上是常数，所以 u 只依赖&quot;哪条特征线&quot;，即只依赖 Φ。F 就是这个&quot;依赖关系&quot;。<\/p>\n<h3>8.4 一阶拟线性偏微分方程<\/h3>\n<div class=\"eq\">a(x,y,u)u_x + b(x,y,u)u_y = c(x,y,u)<\/div>\n<p>特征方程组<\/p>\n<div class=\"eq\">dx/ds=a，dy/ds=b，du/ds=c<\/div>\n<p>给定初始曲线 Γ，过 Γ 上每点作特征线，这些线扫出一张曲面即解。可解的条件是 Γ 横截特征方向：<\/p>\n<div class=\"eq\">a·dy₀/dτ − b·dx₀/dτ ≠ 0<\/div>\n<h3>8.5 几何图景<\/h3>\n<p>把 (x,y,u) 看成三维空间，PDE 规定了&quot;曲面上的方向场&quot;：曲面 u=u(x,y) 在每点的切平面必须包含方向 (a,b,c)。特征线就是这些方向场的积分曲线；解曲面由特征线织成。<\/p>\n<p>这个图景把 PDE 变成了&quot;找一张由给定方向场织成的曲面&quot;，与常微分方程的&quot;找一条由方向场织成的曲线&quot;完全平行。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[一阶 PDE] --&gt; B[写出特征方程组]\n    B --&gt; C[求首次积分]\n    C --&gt; D{齐次还是拟线性}\n    D --&gt;|齐次| E[通解 u = F of Phi]\n    D --&gt;|拟线性| F[过初始曲线作特征线]\n    F --&gt; G[织成解曲面]\n    G --&gt; H{初始曲线是否横截}\n    H --&gt;|不横截| I[局部无解或不唯一]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：整章只有一条主线——把 PDE 变成特征方程组。齐次情形是它的退化（c=0，u 沿特征线不变）。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：特征线是&quot;经线&quot;，初始曲线是&quot;起针行&quot;。PDE 只说&quot;沿经线怎么走&quot;，你把经线一根根织出来，布就成了。如果起针行恰好在经线方向上，就织不起来。<\/p>\n<p><strong>失效边界<\/strong>：这个类比假设特征线互不相交。若特征线在有限处相交，解曲面会出现折痕（激波），此时需要弱解理论。<\/p>\n<p><strong>实例<\/strong>：解 u_x + u_y = u，u(x,0)=x。 特征方程：dx/ds=1，dy/ds=1，du/ds=u。 解得 x=s+x₀，y=s，u=u₀e^s。 初值 u₀=τ=x₀，y₀=0。 消去 s、τ：s=y，x₀=x−y，u=(x−y)e^y。 验证：u_x=e^y，u_y=−e^y+(x−y)e^y，和为 (x−y)e^y=u。边界 y=0 时 u=x。成立。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为首次积分就是&quot;解&quot;<\/strong>——实际上它是沿轨线取常数的函数，本身不满足原方程。\n<\/li><li>\n<strong>别以为 n 维系统总有 n 个首次积分<\/strong>——实际上独立的有 n−1 个。\n<\/li><li>\n<strong>别以为&quot;初始曲线任意给都行&quot;<\/strong>——实际上必须横截特征方向。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n首次积分的方向导数条件是什么？\n<p>（答案：X·∇F=0。解析：这就是&quot;沿轨线为常数&quot;的微分形式。）<\/p>\n<\/ol>\n<ol><li>\n为什么 n 维自治系统只有 n−1 个独立首次积分？\n<p>（答案：轨线是一维的，所以每点的余维是 n−1。解析：n−1 个不变面相交成一条曲线。）<\/p>\n<\/ol>\n<ol><li>\n齐次 PDE 通解中的 F 为什么可以是任意函数？\n<p>（答案：每条特征线上 u 为常数，不同特征线上的常数可以不同，这个&quot;不同&quot;就是一个任意函数。解析：依赖的是特征线的标号 Φ。）<\/p>\n<\/ol>\n<ol><li>\n柯西问题失效的几何原因？\n<p>（答案：初始曲线与特征方向相切，导致无法确定 u 的法向导数。解析：非特征条件不满足。）<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n首次积分：X·∇F=0，n 维有 n−1 个。\n<\/li><li>\n齐次 PDE 通解 = F(Φ)。\n<\/li><li>\n拟线性：过初始曲线作特征线织曲面，需横截条件。\n<\/ul>", "ch09": "<h1>第 9 章：定性理论简介<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：8 小时 | <strong>前置<\/strong>：第 4、5、7 章、线性代数\n<\/li><li>\n<strong>对应原书<\/strong>：第九章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n区分动力系统、相空间、轨线三个概念；\n<\/li><li>\n用线性近似判断李雅普诺夫稳定性，并说明双曲条件；\n<\/li><li>\n用李雅普诺夫第二方法判稳；\n<\/li><li>\n按迹与行列式分类平面初等奇点；\n<\/li><li>\n说明极限环的存在判据与环面上的特殊现象。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>定性理论换了一个问题：不问&quot;解是什么&quot;，只问&quot;轨线在相空间里怎么排布&quot;。答案是拓扑的，不是数值的。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>9.1 动力系统与相空间<\/h3>\n<p>把 dx/dt=f(x) 的解看成&quot;点在空间里随时间移动的轨迹&quot;，则：<\/p>\n<ul><li>\n<strong>相空间<\/strong>：状态 x 所在的空间；\n<\/li><li>\n<strong>轨线<\/strong>：解在相空间中的像（不含时间信息）；\n<\/li><li>\n<strong>动力系统<\/strong>：由 f 决定的整个演化规则。\n<\/ul>\n<p>轨线与积分曲线的区别在于：轨线丢掉了&quot;什么时候到哪&quot;，只留下&quot;经过哪些点&quot;。对自治系统，轨线可以相交于平衡点，但不会自交。<\/p>\n<h3>9.2 李雅普诺夫稳定性<\/h3>\n<p>定义与前面教材一致：稳定（不跑远）、渐近稳定（回到平衡点）、不稳定。<\/p>\n<p><strong>按线性近似判断<\/strong>：设 A=f′(0)，若 A 的特征值实部全负，渐近稳定；有正实部，不稳定；实部有零，线性近似失效。<\/p>\n<h3>9.3 第二方法<\/h3>\n<p>找 V 正定、沿轨线导数负定。V 不必是能量，可以是任何满足条件的函数。构造没有通用算法，常用套路是二次型、能量、平方和。<\/p>\n<h3>9.4 平面初等奇点<\/h3>\n<p>对线性系统，用 p=tr A，q=det A，Δ=p²−4q 分类：结点、鞍点、焦点、中心（详见速查表）。<\/p>\n<p>对非线性系统，若平衡点是双曲的（特征值实部不为零），则其局部相图与线性化系统拓扑等价（哈特曼-格罗布曼）。这是&quot;看线性化就够了&quot;的理论保证。<\/p>\n<h3>9.5 极限环<\/h3>\n<p>极限环是孤立的闭轨。它与中心型闭轨的区别是：<\/p>\n<ul><li>\n中心：闭轨连续分布成一族，附近轨线绕着走，不靠近也不远离；\n<\/li><li>\n极限环：附近轨线螺旋趋近或远离它。\n<\/ul>\n<p>判据：庞加莱-本迪克松定理（平面、有界、无平衡点 ⇒ 存在闭轨）。稳定性判据用庞加莱映射的导数（一维时就是&quot;绕一圈的放大率&quot;）。<\/p>\n<h3>9.6 环面上的方程<\/h3>\n<p>在环面 T² 上，轨线可能永远不闭合（如果两个频率不可公度），也可能闭合（可公度）。这给出了&quot;准周期运动&quot;的几何图像，也是 KAM 理论的入口。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[非线性系统] --&gt; B[平衡点]\n    B --&gt; C[线性化 A]\n    C --&gt; D{是否双曲}\n    D --&gt;|是| E[线性化判稳]\n    D --&gt;|否| F[第二方法 V]\n    B --&gt; G[平面情形]\n    G --&gt; H[迹与行列式分类]\n    H --&gt; I[结点 鞍点 焦点 中心]\n    G --&gt; J[极限环]\n    J --&gt; K[庞加莱映射]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：图中最下面一条支线是本章的高潮：从&quot;局部判稳&quot;走到&quot;全局闭轨存在&quot;，工具从代数变成拓扑。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：相空间像一张地形图，轨线像水流路径。平衡点是湖底或山顶，极限环是一条环形的&quot;跑道&quot;，附近的水流都被吸上去绕着跑。<\/p>\n<p><strong>失效边界<\/strong>：三维以上没有庞加莱-本迪克松，轨线可能被吸引到奇怪吸引子上，既不是平衡点也不是闭轨。<\/p>\n<p><strong>实例<\/strong>：范德波尔振子 x″+ε(x²−1)x′+x=0。化为系统后，ε&gt;0 时存在唯一稳定极限环，所有非零初值的轨线都螺旋趋近它。这正是电子管振荡器的数学模型。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为&quot;轨线就是积分曲线&quot;<\/strong>——实际上轨线丢了时间信息。\n<\/li><li>\n<strong>别以为&quot;闭轨就是极限环&quot;<\/strong>——实际上中心型闭轨成族分布，极限环是孤立的。\n<\/li><li>\n<strong>别以为&quot;线性化总能判稳&quot;<\/strong>——实际上非双曲时失效。\n<\/li><li>\n<strong>别以为&quot;平面定理能推广到高维&quot;<\/strong>——实际上三维开始出现奇怪吸引子。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n轨线与积分曲线的区别？\n<p>（答案：轨线不含时间信息，只记录经过的点。解析：对自治系统，轨线是相空间中的曲线。）<\/p>\n<\/ol>\n<ol><li>\n双曲平衡点的定义？\n<p>（答案：雅可比矩阵的特征值实部都不为零。解析：此时线性化与非线性拓扑等价。）<\/p>\n<\/ol>\n<ol><li>\n极限环与中心型闭轨的区别？\n<p>（答案：极限环孤立，附近轨线螺旋趋近或远离；中心型闭轨成族，附近轨线绕行不趋近。解析：这决定了稳定性判据不同。）<\/p>\n<\/ol>\n<ol><li>\n环面上什么时候轨线不闭合？\n<p>（答案：两个频率不可公度时。解析：轨线在环面上稠密，永不回到起点。）<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n相空间 + 轨线 + 演化规则 = 动力系统。\n<\/li><li>\n双曲 ⇒ 线性化可判；非双曲 ⇒ 找 V。\n<\/li><li>\n极限环孤立，中心闭轨成族。\n<\/ul>", "c01": "<h1>首次积分<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 2、8 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>沿方程组的每条轨线都取常数的函数，等价于方向导数为零。<\/p>\n<h2>为什么重要<\/h2>\n<p>它是连接常微分方程与偏微分方程的那道桥：每一个首次积分都对应一个一阶偏微分方程的解。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n    A[首次积分 F] --&gt; B[等值面不变]\n    B --&gt; C[n 维系统有 n-1 个]\n    C --&gt; D[轨线是等值面的交]\n    A --&gt; E[一阶 PDE 的通解]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>以 Volterra 系统为例，H=d x − c ln x + b y − a ln y 沿轨线不变，所以轨线全部落在 H 的等值线上。又因为 H 在平衡点取极小，等值线是闭合的，于是种群数量周期性振荡。<\/p>\n<p>首次积分不唯一：任意函数作用在它上面仍是首次积分。要找&quot;独立&quot;的一组，需要梯度线性无关。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为首次积分是解——它只是沿解不变的函数。\n<\/li><li>\n别以为一定能找到 n 个——独立的最多 n−1 个。\n<\/li><li>\n别以为存在性无条件——向量场在平衡点处退化。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 2 章<\/td><td>Volterra 模型<\/td><td>存在闭轨<\/td><\/tr><tr><td>第 8 章<\/td><td>一阶 PDE<\/td><td>通解由首次积分生成<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：方向导数、向量场\n<\/li><li>\n后续：哈密顿系统、可积性\n<\/ul>", "c02": "<h1>Peano 存在定理<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 3 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>只要右端连续，初值问题就至少有一个解；唯一性不在保证范围内。<\/p>\n<h2>为什么重要<\/h2>\n<p>它标出了&quot;存在&quot;与&quot;唯一&quot;之间的真实分界：连续性是最低要求，李普希茨是额外成本。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[欧拉折线族] --&gt; B[等度连续 一致有界]\n    B --&gt; C[Ascoli-Arzela]\n    C --&gt; D[抽出收敛子列]\n    D --&gt; E[极限满足积分方程]\n    E --&gt; F[解存在]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>证明不用迭代，用紧性。取步长 hₙ→0 的欧拉折线 yₙ，它们一致有界（被 M·h 控制）且等度连续（斜率被 M 控制）。Ascoli-Arzelà 给出一个一致收敛的子列，极限连续，再用 f 的一致连续性把积分与极限交换，得到它满足积分方程。<\/p>\n<p>经典反例 y′=√|y|，y(0)=0 有无穷多解，说明&quot;连续&quot;确实不够。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 Peano 定理没用——它是假设最少的工具，在只知连续时不可替代。\n<\/li><li>\n别以为&quot;存在多个解&quot;意味着&quot;解不光滑&quot;——它们都可以很光滑。\n<\/li><li>\n别以为 Ascoli 定理只在这里用——紧性方法是整个分析的存在性范式。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 3 章<\/td><td>存在性<\/td><td>连续即可<\/td><\/tr><tr><td>第 3 章<\/td><td>反例<\/td><td>唯一性失效<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：等度连续、紧性\n<\/li><li>\n后续：奇解、非唯一性现象\n<\/ul>", "c03": "<h1>变分方程<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：第 4 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>描述解对初值的偏导数如何演化的线性方程：Φ′=f_y(x,y(x))Φ，Φ(x₀)=I。<\/p>\n<h2>为什么重要<\/h2>\n<p>它是&quot;线性化判稳&quot;的严格出处。所有工程上的灵敏度分析、稳定性线性化，都是它的应用。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n    A[原系统] --&gt; B[沿参考解取雅可比]\n    B --&gt; C[变分方程]\n    C --&gt; D[基解矩阵 Phi]\n    D --&gt; E[初值误差的放大率]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>推导思路：把解写成 y(x;y₀)，对 y₀ 求偏导，交换求导次序（需要连续可微性定理保证），得到 Φ 的方程。<\/p>\n<p>关键理解：Φ 不是&quot;另一个解&quot;，而是&quot;解的导数&quot;。它的初值是单位矩阵，因为恒等映射的导数是 I。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为变分方程是近似——它是精确的线性方程，只是描述的是导数而非解本身。\n<\/li><li>\n别以为Φ 一定有界——特征值实部为正时会指数增长。\n<\/li><li>\n别以为可以随便交换求导顺序——需要 f 对 y 连续可微。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 4 章<\/td><td>连续可微性<\/td><td>Φ′=f_yΦ<\/td><\/tr><tr><td>第 9 章<\/td><td>稳定性<\/td><td>线性化的理论依据<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：雅可比矩阵、连续可微\n<\/li><li>\n后续：李雅普诺夫稳定性、灵敏度分析\n<\/ul>", "c04": "<h1>弗洛凯理论<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：第 5 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>周期系数系统的稳定性由&quot;绕一个周期后的演化矩阵&quot;（单值矩阵）的特征值决定。<\/p>\n<h2>为什么重要<\/h2>\n<p>常系数系统能算特征值，周期系数不能——没有固定矩阵。弗洛凯理论用&quot;绕一圈的放大倍数&quot;替代了特征值。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[周期系数 A of x] --&gt; B[基解矩阵 Phi]\n    B --&gt; C[单值矩阵 M = Phi of T]\n    C --&gt; D[弗洛凯乘子]\n    D --&gt; E{模是否小于 1}\n    E --&gt;|全小于| F[渐近稳定]\n    E --&gt;|有大于| G[不稳定]\n    E --&gt;|等于| H[临界 需细查]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>由 Φ(x+T)=Φ(x)M 可知，走一个周期相当于右乘 M。所以 x(nT)=Mⁿx(0)，稳定性完全由 M 的谱决定。<\/p>\n<p>M 与基解矩阵的选取无关（相似变换不改变特征值）。乘子本身不是特征值，特征值（弗洛凯指数）是它们的对数除以 T。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为可以直接对 A(x) 算特征值——它随 x 变。\n<\/li><li>\n别以为乘子模为 1 就稳定——可能多项式增长（若尔当块）。\n<\/li><li>\n别以为 M 唯一——相似意义下唯一。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 5 章<\/td><td>周期系数方程组<\/td><td>Φ(x+T)=Φ(x)M<\/td><\/tr><tr><td>第 5 章<\/td><td>判稳<\/td><td>看乘子模<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：基解矩阵\n<\/li><li>\n后续：马蒂厄方程、参数共振\n<\/ul>", "__path__": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：基本概念<\/strong><br>阅读：<a href=\"#/chapter/ch01\">第 1 章：基本概念<\/a><br>检查点：能由曲线族反求方程<\/li><li class='path-step' id='path-02'><strong>步骤 02：初等积分法<\/strong><br>阅读：<a href=\"#/chapter/ch02\">第 2 章：初等积分法<\/a><br>检查点：用积分因子主线重解四类方程<\/li><li class='path-step' id='path-03'><strong>步骤 03：存在唯一性<\/strong><br>阅读：<a href=\"#/chapter/ch03\">第 3 章：存在和唯一性<\/a><br>检查点：说清 Picard 与 Peano 差别<\/li><li class='path-step' id='path-04'><strong>步骤 04：对初值依赖<\/strong><br>阅读：<a href=\"#/chapter/ch04\">第 4 章：解对初值和参数的依赖性<\/a><br>检查点：写出变分方程<\/li><li class='path-step' id='path-05'><strong>步骤 05：线性方程组<\/strong><br>阅读：<a href=\"#/chapter/ch05\">第 5 章：线性微分方程组<\/a><br>检查点：用乘子判稳<\/li><li class='path-step' id='path-06'><strong>步骤 06：解析解<\/strong><br>阅读：<a href=\"#/chapter/ch06\">第 6 章：解析解<\/a><br>检查点：幂级数解艾里方程<\/li><li class='path-step' id='path-07'><strong>步骤 07：边值问题<\/strong><br>阅读：<a href=\"#/chapter/ch07\">第 7 章：边值问题<\/a><br>检查点：证正交性<\/li><li class='path-step' id='path-08'><strong>步骤 08：一阶 PDE<\/strong><br>阅读：<a href=\"#/chapter/ch08\">第 8 章：一阶偏微分方程<\/a><br>检查点：特征线法一个例题<\/li><li class='path-step' id='path-09'><strong>步骤 09：定性理论<\/strong><br>阅读：<a href=\"#/chapter/ch09\">第 9 章：定性理论简介<\/a><br>检查点：判极限环<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "__quiz_all__": "<p>（无综合题）<\/p>", "__quiz_ch01__": "<h1>测验：第 1 章：基本概念<\/h1><div class='quiz-item' data-qid='q01' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 微分方程 y′=y(y−1) 的线性性是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q01' value='0'> 线性<\/label><label class='quiz-opt'><input type='radio' name='q01' value='1'> 非线性<\/label><label class='quiz-opt'><input type='radio' name='q01' value='2'> 半线性<\/label><label class='quiz-opt'><input type='radio' name='q01' value='3'> 无法判断<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q02' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 曲线族 y=c₁x+c₂x² 满足的方程是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q02' value='0'> x²y″−2xy′+2y=0<\/label><label class='quiz-opt'><input type='radio' name='q02' value='1'> y″−2y′=0<\/label><label class='quiz-opt'><input type='radio' name='q02' value='2'> xy″−y′=0<\/label><label class='quiz-opt'><input type='radio' name='q02' value='3'> y″+y=0<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch02__": "<h1>测验：第 2 章：初等积分法<\/h1><div class='quiz-item' data-qid='q03' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 分离变量法是哪个特例？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q03' value='0'> 线性方程<\/label><label class='quiz-opt'><input type='radio' name='q03' value='1'> 积分因子恰只依赖 y<\/label><label class='quiz-opt'><input type='radio' name='q03' value='2'> 恰当方程恒成立<\/label><label class='quiz-opt'><input type='radio' name='q03' value='3'> 隐式方程<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q04' data-type='single'><p class='quiz-q'><b>Q2.<\/b> Riccati 方程 y′=P y²+Q y+R 可积的条件是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q04' value='0'> P 为常数<\/label><label class='quiz-opt'><input type='radio' name='q04' value='1'> 已知一个特解<\/label><label class='quiz-opt'><input type='radio' name='q04' value='2'> Q=0<\/label><label class='quiz-opt'><input type='radio' name='q04' value='3'> R 为多项式<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch03__": "<h1>测验：第 3 章：存在和唯一性<\/h1><div class='quiz-item' data-qid='q05' data-type='single'><p class='quiz-q'><b>Q1.<\/b> Peano 定理要求的条件是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q05' value='0'> 连续<\/label><label class='quiz-opt'><input type='radio' name='q05' value='1'> 连续且李普希茨<\/label><label class='quiz-opt'><input type='radio' name='q05' value='2'> 可微<\/label><label class='quiz-opt'><input type='radio' name='q05' value='3'> 解析<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q06' data-type='single'><p class='quiz-q'><b>Q2.<\/b> y′=√|y|，y(0)=0 的解的个数？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q06' value='0'> 唯一<\/label><label class='quiz-opt'><input type='radio' name='q06' value='1'> 两个<\/label><label class='quiz-opt'><input type='radio' name='q06' value='2'> 无穷多<\/label><label class='quiz-opt'><input type='radio' name='q06' value='3'> 不存在<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch04__": "<h1>测验：第 4 章：解对初值和参数的依赖性<\/h1><div class='quiz-item' data-qid='q07' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 变分方程的初值是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q07' value='0'> 零矩阵<\/label><label class='quiz-opt'><input type='radio' name='q07' value='1'> 单位矩阵<\/label><label class='quiz-opt'><input type='radio' name='q07' value='2'> 雅可比矩阵<\/label><label class='quiz-opt'><input type='radio' name='q07' value='3'> 任意<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q08' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 连续依赖估计中的放大因子是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q08' value='0'> e^(L|x−x₀|)<\/label><label class='quiz-opt'><input type='radio' name='q08' value='1'> L<\/label><label class='quiz-opt'><input type='radio' name='q08' value='2'> |x−x₀|<\/label><label class='quiz-opt'><input type='radio' name='q08' value='3'> M<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch05__": "<h1>测验：第 5 章：线性微分方程组<\/h1><div class='quiz-item' data-qid='q09' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 单值矩阵的定义是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q09' value='0'> Φ(0)<\/label><label class='quiz-opt'><input type='radio' name='q09' value='1'> Φ(T)<\/label><label class='quiz-opt'><input type='radio' name='q09' value='2'> A(T)<\/label><label class='quiz-opt'><input type='radio' name='q09' value='3'> det Φ(T)<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q10' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 重特征值情形解中出现 x 的幂，原因是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q10' value='0'> 积分常数<\/label><label class='quiz-opt'><input type='radio' name='q10' value='1'> 广义特征向量链<\/label><label class='quiz-opt'><input type='radio' name='q10' value='2'> 数值误差<\/label><label class='quiz-opt'><input type='radio' name='q10' value='3'> 特征值非实数<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch06__": "<h1>测验：第 6 章：解析解<\/h1><div class='quiz-item' data-qid='q11' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 柯西定理的条件是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q11' value='0'> f 连续<\/label><label class='quiz-opt'><input type='radio' name='q11' value='1'> f 满足李普希茨<\/label><label class='quiz-opt'><input type='radio' name='q11' value='2'> f 解析<\/label><label class='quiz-opt'><input type='radio' name='q11' value='3'> f 有界<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q12' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 正则奇点的条件是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q12' value='0'> p、q 都解析<\/label><label class='quiz-opt'><input type='radio' name='q12' value='1'> p 至多一阶极点且 q 至多二阶极点<\/label><label class='quiz-opt'><input type='radio' name='q12' value='2'> p 任意<\/label><label class='quiz-opt'><input type='radio' name='q12' value='3'> q 至多一阶极点<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch07__": "<h1>测验：第 7 章：边值问题<\/h1><div class='quiz-item' data-qid='q13' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 斯特姆-刘维尔特征函数正交的权是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q13' value='0'> p(x)<\/label><label class='quiz-opt'><input type='radio' name='q13' value='1'> ρ(x)<\/label><label class='quiz-opt'><input type='radio' name='q13' value='2'> q(x)<\/label><label class='quiz-opt'><input type='radio' name='q13' value='3'> 1<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q14' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 比较定理中 q₂≥q₁ 意味着第二个方程？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q14' value='0'> 零点更少<\/label><label class='quiz-opt'><input type='radio' name='q14' value='1'> 零点更多<\/label><label class='quiz-opt'><input type='radio' name='q14' value='2'> 零点一样<\/label><label class='quiz-opt'><input type='radio' name='q14' value='3'> 无解<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch08__": "<h1>测验：第 8 章：一阶偏微分方程<\/h1><div class='quiz-item' data-qid='q15' data-type='single'><p class='quiz-q'><b>Q1.<\/b> n 维自治系统独立首次积分有几个？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q15' value='0'> n<\/label><label class='quiz-opt'><input type='radio' name='q15' value='1'> n−1<\/label><label class='quiz-opt'><input type='radio' name='q15' value='2'> 1<\/label><label class='quiz-opt'><input type='radio' name='q15' value='3'> n+1<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q16' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 拟线性 PDE 柯西问题可解的条件是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q16' value='0'> 初始曲线是直线<\/label><label class='quiz-opt'><input type='radio' name='q16' value='1'> 初始曲线横截特征方向<\/label><label class='quiz-opt'><input type='radio' name='q16' value='2'> 系数为常数<\/label><label class='quiz-opt'><input type='radio' name='q16' value='3'> u 有界<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch09__": "<h1>测验：第 9 章：定性理论简介<\/h1><div class='quiz-item' data-qid='q17' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 轨线与积分曲线的差别是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q17' value='0'> 轨线含时间<\/label><label class='quiz-opt'><input type='radio' name='q17' value='1'> 轨线不含时间<\/label><label class='quiz-opt'><input type='radio' name='q17' value='2'> 轨线一定闭合<\/label><label class='quiz-opt'><input type='radio' name='q17' value='3'> 积分曲线一定不闭合<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q18' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 极限环与中心型闭轨的关键差别是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q18' value='0'> 极限环是孤立的<\/label><label class='quiz-opt'><input type='radio' name='q18' value='1'> 极限环不稳定<\/label><label class='quiz-opt'><input type='radio' name='q18' value='2'> 中心闭轨不存在<\/label><label class='quiz-opt'><input type='radio' name='q18' value='3'> 两者相同<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz___all__": "<h1>测验：__all<\/h1><div class='quiz-item' data-qid='q19' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 为什么周期系数系统不能直接对 A(t) 求特征值？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q19' value='0'> A(t) 不可逆<\/label><label class='quiz-opt'><input type='radio' name='q19' value='1'> A(t) 随 t 变化，没有固定谱<\/label><label class='quiz-opt'><input type='radio' name='q19' value='2'> 特征值必为复数<\/label><label class='quiz-opt'><input type='radio' name='q19' value='3'> 需要对称矩阵<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q20' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 解析解方法与定性理论的分工是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q20' value='0'> 前者给局部精确解，后者给全局结构<\/label><label class='quiz-opt'><input type='radio' name='q20' value='1'> 两者等价<\/label><label class='quiz-opt'><input type='radio' name='q20' value='2'> 前者更精确所以总能替代后者<\/label><label class='quiz-opt'><input type='radio' name='q20' value='3'> 后者只对线性系统有效<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__cards__": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "__glossary__": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='常微分方程'>常微分方程 — 一元未知函数及其导数构成的方程 <span class=glossary-ref>（第 1 章：基本概念）<\/span><\/li><li data-term='线素场'>线素场 — 平面上每点标出斜率的短线集合 <span class=glossary-ref>（第 1 章：基本概念）<\/span><\/li><li data-term='奇异点'>奇异点 — 线素场无定义的点 <span class=glossary-ref>（第 1 章：基本概念）<\/span><\/li><li data-term='积分因子'>积分因子 — 使 P dx+Q dy 成为全微分的乘子 <span class=glossary-ref>（第 2 章：初等积分法）<\/span><\/li><li data-term='恰当方程'>恰当方程 — 左端恰为全微分的方程 <span class=glossary-ref>（第 2 章：初等积分法）<\/span><\/li><li data-term='克莱罗方程'>克莱罗方程 — y=xp+g(p) 型方程 <span class=glossary-ref>（第 2 章：初等积分法）<\/span><\/li><li data-term='拉格朗日方程'>拉格朗日方程 — y=xf(p)+g(p) 型方程 <span class=glossary-ref>（第 2 章：初等积分法）<\/span><\/li><li data-term='riccati 方程'>Riccati 方程 — y′=P y²+Q y+R <span class=glossary-ref>（第 2 章：初等积分法）<\/span><\/li><li data-term='volterra 模型'>Volterra 模型 — 捕食者-食饵方程 <span class=glossary-ref>（第 2 章：初等积分法）<\/span><\/li><li data-term='奇解'>奇解 — 通解族的包络 <span class=glossary-ref>（第 3 章：存在和唯一性）<\/span><\/li><li data-term='picard 定理'>Picard 定理 — 连续加李普希茨 ⇒ 唯一解 <span class=glossary-ref>（第 3 章：存在和唯一性）<\/span><\/li><li data-term='peano 定理'>Peano 定理 — 连续 ⇒ 至少一个解 <span class=glossary-ref>（第 3 章：存在和唯一性）<\/span><\/li><li data-term='欧拉折线'>欧拉折线 — 用折线逼近积分曲线 <span class=glossary-ref>（第 3 章：存在和唯一性）<\/span><\/li><li data-term='等度连续'>等度连续 — 一族函数斜率一致有界 <span class=glossary-ref>（第 3 章：存在和唯一性）<\/span><\/li><li data-term='饱和解'>饱和解 — 不能再延伸的解 <span class=glossary-ref>（第 3 章：存在和唯一性）<\/span><\/li><li data-term='变分方程'>变分方程 — Φ′=f_yΦ <span class=glossary-ref>（第 4 章：解对初值和参数的依赖性）<\/span><\/li><li data-term='灵敏度方程'>灵敏度方程 — 含参数时的变分方程 <span class=glossary-ref>（第 4 章：解对初值和参数的依赖性）<\/span><\/li><li data-term='基解矩阵'>基解矩阵 — 以线性无关解为列的矩阵 <span class=glossary-ref>（第 5 章：线性微分方程组）<\/span><\/li><li data-term='单值矩阵'>单值矩阵 — Φ(T)，走一个周期的演化 <span class=glossary-ref>（第 5 章：线性微分方程组）<\/span><\/li><li data-term='弗洛凯乘子'>弗洛凯乘子 — 单值矩阵的特征值 <span class=glossary-ref>（第 5 章：线性微分方程组）<\/span><\/li><li data-term='常点'>常点 — 系数解析的点 <span class=glossary-ref>（第 6 章：解析解）<\/span><\/li><li data-term='正则奇点'>正则奇点 — 系数极点阶数受限的点 <span class=glossary-ref>（第 6 章：解析解）<\/span><\/li><li data-term='指标方程'>指标方程 — 决定弗罗贝尼乌斯级数指数的方程 <span class=glossary-ref>（第 6 章：解析解）<\/span><\/li><li data-term='斯特姆比较定理'>斯特姆比较定理 — 势大扩散弱则零点多的比较结论 <span class=glossary-ref>（第 7 章：边值问题）<\/span><\/li><li data-term='斯特姆-刘维尔问题'>斯特姆-刘维尔问题 — 自伴形式的特征值问题 <span class=glossary-ref>（第 7 章：边值问题）<\/span><\/li><li data-term='单值矩阵判稳'>单值矩阵判稳 — 看乘子模是否小于 1 <span class=glossary-ref>（第 7 章：边值问题）<\/span><\/li><li data-term='首次积分'>首次积分 — 沿轨线取常数的函数 <span class=glossary-ref>（第 8 章：一阶偏微分方程）<\/span><\/li><li data-term='特征线'>特征线 — PDE 沿之降为 ODE 的曲线 <span class=glossary-ref>（第 8 章：一阶偏微分方程）<\/span><\/li><li data-term='拟线性方程'>拟线性方程 — 系数依赖 u 的一阶 PDE <span class=glossary-ref>（第 8 章：一阶偏微分方程）<\/span><\/li><li data-term='轨线'>轨线 — 相空间中不含时间信息的曲线 <span class=glossary-ref>（第 9 章：定性理论简介）<\/span><\/li><li data-term='双曲平衡点'>双曲平衡点 — 特征值实部全不为零的平衡点 <span class=glossary-ref>（第 9 章：定性理论简介）<\/span><\/li><li data-term='极限环'>极限环 — 孤立的闭轨 <span class=glossary-ref>（第 9 章：定性理论简介）<\/span><\/li><li data-term='庞加莱映射'>庞加莱映射 — 绕一圈的首次回归映射 <span class=glossary-ref>（第 9 章：定性理论简介）<\/span><\/li><\/ul>", "__patterns__": "<h1>模式与框架库<\/h1>\n<h2>框架：把一切初等解法归约为积分因子<\/h2>\n<ol><li>\n先把方程写成 P dx+Q dy=0 的对称形式。\n<\/li><li>\n判 M_y=N_x：恰当则直接求 u。\n<\/li><li>\n不恰当时，看 (M_y−N_x)/N 是否只含 x，或 (N_x−M_y)/M 是否只含 y。\n<\/li><li>\n分离变量、线性方程都是&quot;μ 恰好只依赖一个变量&quot;的特例。\n<\/ol>\n<h2>框架：存在性证明的两种范式<\/h2>\n<ul><li>\n<strong>构造型<\/strong>（Picard）：迭代 → 阶乘级数控制 → 一致收敛。需要李普希茨。\n<\/li><li>\n<strong>紧性型<\/strong>（Peano）：欧拉折线 → 等度连续 → Ascoli-Arzelà → 抽子列。只需连续。\n<\/ul>\n<p>判题时先问&quot;要不要唯一&quot;：要唯一就必须验证李普希茨。<\/p>\n<h2>决策规则<\/h2>\n<ul><li>\n周期系数系统：不要算特征值，算单值矩阵。\n<\/li><li>\n解析系数：先判点是常点、正则奇点还是非正则奇点，再选幂级数或弗罗贝尼乌斯。\n<\/li><li>\n边值问题：先看齐次问题是否有非零解，再谈唯一性。\n<\/ul>\n<h2>反模式<\/h2>\n<ul><li>\n<strong>把 Peano 定理当成&quot;存在且唯一&quot;<\/strong>。它只保证存在。\n<\/li><li>\n<strong>对周期系数系统直接求 A 的特征值<\/strong>。A 随 t 变，这个特征值没有意义。\n<\/li><li>\n<strong>在正则奇点处直接写普通幂级数<\/strong>。指数 r 可能不是整数，必须先解指标方程。\n<\/li><li>\n<strong>把斯特姆比较定理当成等式<\/strong>。它只给零点个数的比较，不给具体位置。\n<\/ul>", "__cheatsheet__": "<h1>速查表<\/h1>\n<h2>初等解法（以积分因子为主线）<\/h2>\n<table><thead><tr><th>方程<\/th><th>对称形式<\/th><th>积分因子<\/th><\/tr><\/thead><tbody><tr><td>y′=f(x)g(y)<\/td><td>dy−f(x)g(y)dx=0<\/td><td>1/g(y)<\/td><\/tr><tr><td>y′=φ(y/x)<\/td><td>dy−φ(y/x)dx=0<\/td><td>1/(y−xφ) 类<\/td><\/tr><tr><td>y′+P(x)y=Q(x)<\/td><td>(Py−Q)dx+dy=0<\/td><td>e^(∫P dx)<\/td><\/tr><tr><td>恰当方程<\/td><td>P dx+Q dy=0<\/td><td>1<\/td><\/tr><tr><td>Riccati（已知 y₁）<\/td><td>—<\/td><td>换元 y=y₁+1/u<\/td><\/tr><\/tbody><\/table>\n<h2>存在性<\/h2>\n<table><thead><tr><th>定理<\/th><th>条件<\/th><th>结论<\/th><\/tr><\/thead><tbody><tr><td>Picard<\/td><td>连续 + 李普希茨<\/td><td>存在且唯一<\/td><\/tr><tr><td>Peano<\/td><td>连续<\/td><td>存在<\/td><\/tr><tr><td>延拓<\/td><td>局部解<\/td><td>饱和解<\/td><\/tr><tr><td>连续依赖<\/td><td>李普希茨<\/td><td>误差 ≤ 初值差 e^(L<\/td><td>x−x₀<\/td><td>)<\/td><\/tr><tr><td>变分方程<\/td><td>f 对 y 可微<\/td><td>Φ′=f_yΦ，Φ(x₀)=I<\/td><\/tr><\/tbody><\/table>\n<h2>线性方程组<\/h2>\n<table><thead><tr><th>场景<\/th><th>结论<\/th><\/tr><\/thead><tbody><tr><td>基解矩阵<\/td><td>Φ′=AΦ，det Φ≠0<\/td><\/tr><tr><td>单特征值<\/td><td>Φ=[vᵢe^(λᵢx)]<\/td><\/tr><tr><td>重特征值<\/td><td>e^(λx)[v₁+v₂x+…+v_kx^(k−1)/(k−1)!]<\/td><\/tr><tr><td>周期系数<\/td><td>Φ(x+T)=Φ(x)M<\/td><\/tr><tr><td>判稳<\/td><td>M 的乘子模 &lt;1 稳定，&gt;1 不稳定，=1 临界<\/td><\/tr><\/tbody><\/table>\n<h2>解析解<\/h2>\n<table><thead><tr><th>点类型<\/th><th>方法<\/th><th>解的形式<\/th><\/tr><\/thead><tbody><tr><td>常点<\/td><td>幂级数<\/td><td>Σaₖ(x−x₀)ᵏ<\/td><\/tr><tr><td>正则奇点<\/td><td>弗罗贝尼乌斯<\/td><td>(x−x₀)^r Σaₖ(x−x₀)ᵏ<\/td><\/tr><tr><td>非正则奇点<\/td><td>一般无级数解<\/td><td>—<\/td><\/tr><\/tbody><\/table>\n<h2>边值问题<\/h2>\n<table><thead><tr><th>结论<\/th><th>内容<\/th><\/tr><\/thead><tbody><tr><td>自伴性<\/td><td>⟨Ly,z⟩=⟨y,Lz⟩<\/td><\/tr><tr><td>特征值<\/td><td>实数、可数、趋于无穷<\/td><\/tr><tr><td>正交性<\/td><td>∫ρ yₘyₙ=0（m≠n）<\/td><\/tr><tr><td>展开系数<\/td><td>cₙ=∫ρfyₙ/∫ρyₙ²<\/td><\/tr><tr><td>比较定理<\/td><td>q 大、p 小 ⇒ 零点多<\/td><\/tr><\/tbody><\/table>\n<h2>定性<\/h2>\n<table><thead><tr><th>概念<\/th><th>判据<\/th><\/tr><\/thead><tbody><tr><td>双曲<\/td><td>特征值实部均不为零<\/td><\/tr><tr><td>线性化判稳<\/td><td>全负渐近稳定，有正不稳定<\/td><\/tr><tr><td>极限环存在<\/td><td>平面 + 有界 + 无平衡点<\/td><\/tr><tr><td>极限环稳定<\/td><td>庞加莱映射导数绝对值 &lt;1<\/td><\/tr><\/tbody><\/table>"}};
const pages = DATA.rendered;
const manifest = DATA.manifest;
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const SLUG = manifest.slug || 'book';
const store = {
  get(k){ try{ return JSON.parse(localStorage.getItem(SLUG+':'+k)||'null') }catch(e){ return null } },
  set(k,v){ try{ localStorage.setItem(SLUG+':'+k, JSON.stringify(v)) }catch(e){} }
};
let state = { visited: store.get('visited')||[], quiz: store.get('quiz')||{}, cards: store.get('cards')||{} };

/* ---------- 导航 ---------- */
function renderNav(){
  const nav = $('#nav'); nav.innerHTML='';
  const build = items => items.forEach(it=>{
    if(it.children){
      const sec=document.createElement('div'); sec.className='nav-sec'; sec.textContent=it.label; nav.appendChild(sec);
      it.children.forEach(c=>{
        const a=document.createElement('a'); a.className='nav-item'; a.href=c.href; a.textContent=c.label;
        const id=routeId(c.href);
        if(state.visited.includes(id)) a.innerHTML = esc(c.label)+' <span class="done">✓</span>';
        nav.appendChild(a);
      });
    }else{
      const a=document.createElement('a'); a.className='nav-item'; a.href=it.href; a.textContent=it.label;
      const id=routeId(it.href);
      if(state.visited.includes(id)) a.innerHTML = esc(it.label)+' <span class="done">✓</span>';
      nav.appendChild(a);
    }
  });
  build(DATA.nav);
  updateProgress();
}
function routeId(href){ return href.replace('#/',''); }

/* ---------- 路由 ---------- */
function routeIdFromHash(){
  let h = location.hash.replace(/^#\//,'');
  if(!h) return 'path';
  if(h==='path') return 'path';
  const m = h.match(/^(chapter|concept)\/(.+)$/);
  if(m) return m[1]+'/'+m[2];
  return h; // quiz/all, quiz/ch01, cards, glossary, patterns, cheatsheet
}
function showPage(rid){
  const id = rid==='path' ? '__path__' : rid.startsWith('quiz/') ? '__quiz_'+rid.split('/')[1]+'__' : rid==='cards'?'__cards__':rid==='glossary'?'__glossary__':rid==='patterns'?'__patterns__':rid==='cheatsheet'?'__cheatsheet__':rid.startsWith('chapter/')?rid.split('/')[1]:rid.startsWith('concept/')?rid.split('/')[1]:rid;
  const html = pages[id] || '<div class="empty">页面不存在</div>';
  $('#view').innerHTML = html;
  document.querySelectorAll('.nav-item').forEach(a=>a.classList.toggle('active', routeId(a.getAttribute('href'))===rid));
  if(!state.visited.includes(rid) && (rid.startsWith('chapter/')||rid.startsWith('concept/'))){
    state.visited.push(rid); store.set('visited', state.visited); renderNav();
  }
  window.scrollTo(0,0);
  if(rid==='cards') initCards();
  if(rid==='glossary') initGlossary();
  if(rid.startsWith('quiz')) initQuizzes(rid);
  if(id==='__path__') updatePath();
  renderMermaid();
}

/* ---------- 进度 ---------- */
function updateProgress(){
  const chs = (manifest.chapters||[]).length;
  const done = (manifest.chapters||[]).filter(c=>state.visited.includes('chapter/'+c.id)).length;
  const pct = chs? Math.round(done/chs*100) : 0;
  $('#progress-fill').style.width = pct+'%';
  $('#progress-label').textContent = `进度 ${pct}% · 已学 ${done}/${chs} 章`;
}
function updatePath(){
  document.querySelectorAll('.path-step').forEach(el=>{
    const step = el.id.replace('path-','');
    const s = (manifest.learningPath||[]).find(x=>x.step===step);
    if(s && (s.chapterIds||[]).every(c=>state.visited.includes('chapter/'+c))){
      el.classList.add('passed');
      const lbl = el.querySelector('.checkpoint-ok'); if(!lbl){ const sp=document.createElement('span'); sp.className='done'; sp.textContent=' ✓ 已完成'; el.appendChild(sp); }
    }
  });
}

/* ---------- 测验 ---------- */
function initQuizzes(rid){
  document.querySelectorAll('.quiz-item').forEach(item=>{
    const btn = item.querySelector('.quiz-check');
    if(!btn || item.dataset.inited){ return }
    item.dataset.inited='1';
    btn.addEventListener('click', ()=>{
      const qid = item.dataset.qid; const type = item.dataset.type;
      const q = (manifest.quizzes||[]).find(x=>x.id===qid); if(!q) return;
      let user, correct=false, fb;
      if(type==='single'){
        const sel = item.querySelector('input:checked');
        user = sel? parseInt(sel.value) : null;
        correct = user===q.answer;
        fb = correct?'✓ 正确':'✗ 错误'+(user==null?'（未作答）':'');
      } else if(type==='multi'){
        user = Array.from(item.querySelectorAll('input:checked')).map(i=>parseInt(i.value)).sort();
        const ans = Array.isArray(q.answer)? q.answer.slice().sort(): [q.answer];
        correct = user.length>0 && JSON.stringify(user)===JSON.stringify(ans);
        fb = correct?'✓ 正确':'✗ 错误';
      } else if(type==='blank'){
        const v = (item.querySelector('.quiz-blank').value||'').trim().toLowerCase();
        const a = String(q.answer).trim().toLowerCase();
        correct = v===a;
        fb = correct?'✓ 正确':'✗ 错误'+(v?'':'（未作答）');
      }
      item.querySelectorAll('input:checked').forEach(i=>{
        const val=parseInt(i.value);
        if(Array.isArray(q.answer)? q.answer.includes(val) : val===q.answer) i.parentElement.style.color='var(--ok)';
        else i.parentElement.style.color='var(--bad)';
      });
      const feed = item.querySelector('.quiz-feedback');
      feed.className = 'quiz-feedback '+(correct?'fb-ok':'fb-bad');
      feed.textContent = fb;
      let ex = item.querySelector('.quiz-explain');
      if(!ex){ ex=document.createElement('div'); ex.className='quiz-explain'; item.appendChild(ex); }
      ex.innerHTML = '解析：' + esc(q.explain||'');
      // 记录成绩（按章聚合）
      const ch = q.chapterId||'__all__';
      if(!state.quiz[ch]) state.quiz[ch]={done:0,total:0};
      state.quiz[ch].done = Math.min(state.quiz[ch].total+1, state.quiz[ch].done+1);
      state.quiz[ch].total += 1;
      store.set('quiz', state.quiz);
    });
  });
}

/* ---------- 抽认卡 ---------- */
let cardIdx = 0, cardList = [];
function initCards(){
  const cards = manifest.flashcards||[];
  cardList = cards.slice();
  cardIdx = 0;
  const sel = $('#card-filter');
  sel.innerHTML = '<option value="">全部</option>';
  [...new Set(cards.map(c=>c.chapterId).filter(Boolean))].forEach(c=>{
    const o=document.createElement('option'); o.value=c; o.textContent=manifestChTitle(c); sel.appendChild(o);
  });
  sel.onchange = ()=>{ const v=sel.value; cardList = v? cards.filter(c=>c.chapterId===v): cards.slice(); cardIdx=0; showCard(); };
  $('#flashcard').onclick = ()=>$('#flashcard').classList.toggle('flip');
  $('#card-known-btn').onclick = ()=>{ markCard(true); };
  $('#card-again-btn').onclick = ()=>{ markCard(false); };
  showCard();
}
function showCard(){
  updateCardCounts();
  if(cardIdx>=cardList.length){ $('#card-stage').innerHTML='<div class="empty">本组卡片已全部复习完 🎉</div>'; return; }
  const c = cardList[cardIdx];
  document.querySelector('.fc-front').textContent = c.front;
  document.querySelector('.fc-back').textContent = c.back;
  $('#flashcard').classList.remove('flip');
}
function markCard(known){
  const c = cardList[cardIdx]; if(!c) return;
  state.cards[c.id] = known?'known':'again';
  store.set('cards', state.cards);
  cardIdx++; showCard();
}
function updateCardCounts(){
  const known = Object.values(state.cards).filter(v=>v==='known').length;
  const again = Object.values(state.cards).filter(v=>v==='again').length;
  $('#card-known').textContent = known;
  $('#card-again').textContent = again;
  $('#card-left').textContent = Math.max(0, cardList.length-cardIdx);
}
function manifestChTitle(id){
  const c=(manifest.chapters||[]).find(x=>x.id===id); return c? c.title : id;
}

/* ---------- 术语表 ---------- */
function initGlossary(){
  const input = $('#glossary-filter');
  if(!input || input.dataset.inited) return;
  input.dataset.inited='1';
  input.oninput = ()=>{
    const v = input.value.trim().toLowerCase();
    document.querySelectorAll('#glossary-list li').forEach(li=>{
      li.style.display = (!v || li.dataset.term.includes(v)) ? '' : 'none';
    });
  };
}

/* ---------- 搜索 ---------- */
let searchIndex = null;
function buildSearchIndex(){
  if(searchIndex) return searchIndex;
  searchIndex = [];
  Object.entries(pages).forEach(([id, htmlText])=>{
    if(id.startsWith('__')) return;
    const text = htmlText.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ');
    searchIndex.push({id, text});
  });
  return searchIndex;
}
$('#q').addEventListener('input', e=>{
  const v = e.target.value.trim().toLowerCase();
  if(!v){ showPage(routeIdFromHash()); return; }
  buildSearchIndex();
  const hits = searchIndex.filter(p=>p.text.toLowerCase().includes(v)).slice(0,20);
  const label = id => id.startsWith('chapter/')? ('章节：'+manifestChTitle(id.split('/')[1])) : id.startsWith('concept/')? ('概念：'+id.split('/')[1]) : id;
  $('#view').innerHTML = '<h1>搜索结果：'+esc(v)+'</h1>' +
    (hits.length? hits.map(h=>`<div class="search-hit"><a href="#/${h.id}">${esc(label(h.id))}</a><br><span class="sub">${esc(h.text.slice(0,180))}</span></div>`).join('')
                 : '<div class="empty">未找到相关页面，试试章节名/概念名/术语。</div>');
});

/* ---------- Mermaid 懒加载（联网渲染，离线显示源码） ---------- */
function renderMermaid(){
  if(!document.querySelector('.mermaid')) return;
  const s=document.createElement('script');
  s.src='https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js';
  s.onload=()=>{ try{
    mermaid.initialize({startOnLoad:false, theme: matchMedia('(prefers-color-scheme: dark)').matches?'dark':'default'});
    document.querySelectorAll('.mermaid').forEach(el=>{
      const code=el.textContent;
      mermaid.render('mm'+Math.random().toString(36).slice(2), code)
        .then(({svg})=>{ el.innerHTML=svg; })
        .catch(()=>{ el.textContent=code; });
    });
  }catch(e){} };
  document.head.appendChild(s);
}

/* ---------- 深色模式 ---------- */
const themeBtn=$('#theme-btn');
themeBtn.onclick=()=>{
  const d = document.body.dataset.theme==='dark';
  document.body.dataset.theme = d? '' : 'dark';
  themeBtn.textContent = d? '🌙 深色' : '☀️ 浅色';
};

/* ---------- 启动 ---------- */
renderNav();
window.addEventListener('hashchange', ()=>showPage(routeIdFromHash()));
(function(){
  const sb=document.querySelector('.sidebar'); if(!sb) return;
  const btn=document.createElement('button'); btn.id='nav-toggle'; btn.textContent='目录（点开选择章节）';
  btn.onclick=()=>sb.classList.toggle('open');
  sb.insertBefore(btn, sb.querySelector('#nav'));
  window.addEventListener('hashchange',()=>{ if(window.innerWidth<=760) sb.classList.remove('open'); });
})();
showPage(routeIdFromHash());
</script>
