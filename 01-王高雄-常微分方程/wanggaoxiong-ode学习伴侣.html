 data-qid='q27' data-type='single'><p class='quiz-q'><b>Q3.<\/b> 边值问题与初值问题最关键的区别是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q27' value='0'> 边值问题条件给在两端，可能无解或不唯一<\/label><label class='quiz-opt'><input type='radio' name='q27' value='1'> 边值问题不需要方程<\/label><label class='quiz-opt'><input type='radio' name='q27' value='2'> 边值问题一定唯一可解<\/label><label class='quiz-opt'><input type='radio' name='q27' value='3'> 初值问题不需要连续性<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q28' data-type='single'><p class='quiz-q'><b>Q4.<\/b> “混沌”在数学上的准确含义是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q28' value='0'> 随机过程<\/label><label class='quiz-opt'><input type='radio' name='q28' value='1'> 确定性系统对初值敏感且有界非周期<\/label><label class='quiz-opt'><input type='radio' name='q28' value='2'> 方程无解<\/label><label class='quiz-opt'><input type='radio' name='q28' value='3'> 数值方法失败<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__cards__": {"html": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "kind": "cards", "title": "抽认卡"}, "__glossary__": {"html": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='常微分方程'>常微分方程 — 只含一个自变量、未知函数及其导数的方程 <span class=glossary-ref>（第 1 章：绪论）<\/span><\/li><li data-term='阶'>阶 — 方程中出现过的最高阶导数的阶数 <span class=glossary-ref>（第 1 章：绪论）<\/span><\/li><li data-term='线性方程'>线性方程 — 关于未知函数及其各阶导数都是一次的方程 <span class=glossary-ref>（第 1 章：绪论）<\/span><\/li><li data-term='通解'>通解 — 含 n 个独立任意常数的解族 <span class=glossary-ref>（第 1 章：绪论）<\/span><\/li><li data-term='特解'>特解 — 满足给定初值条件的解 <span class=glossary-ref>（第 1 章：绪论）<\/span><\/li><li data-term='隐式解'>隐式解 — 由 Φ(x,y)=0 确定的解，也叫积分 <span class=glossary-ref>（第 1 章：绪论）<\/span><\/li><li data-term='初值问题'>初值问题 — 方程连同一点处的一组初值条件 <span class=glossary-ref>（第 1 章：绪论）<\/span><\/li><li data-term='积分曲线'>积分曲线 — 解在平面上的图形 <span class=glossary-ref>（第 1 章：绪论）<\/span><\/li><li data-term='方向场'>方向场 — 平面上每点标出斜率的线素集合 <span class=glossary-ref>（第 1 章：绪论）<\/span><\/li><li data-term='等斜线'>等斜线 — 方向场中斜率相同的点的连线 <span class=glossary-ref>（第 1 章：绪论）<\/span><\/li><li data-term='相平面'>相平面 — 以状态变量为坐标的平面，轨线在其上 <span class=glossary-ref>（第 1 章：绪论）<\/span><\/li><li data-term='变量分离'>变量分离 — 把方程改写成 f(y)dy=g(x)dx 的方法 <span class=glossary-ref>（第 2 章：一阶方程的初等解法）<\/span><\/li><li data-term='齐次型方程'>齐次型方程 — 右端只依赖 y/x 的方程 <span class=glossary-ref>（第 2 章：一阶方程的初等解法）<\/span><\/li><li data-term='常数变易法'>常数变易法 — 把齐次解的常数换成函数求非齐次解 <span class=glossary-ref>（第 2 章：一阶方程的初等解法）<\/span><\/li><li data-term='恰当方程'>恰当方程 — 左端恰为某个函数全微分的方程 <span class=glossary-ref>（第 2 章：一阶方程的初等解法）<\/span><\/li><li data-term='积分因子'>积分因子 — 乘上去使方程变恰当的因子 μ <span class=glossary-ref>（第 2 章：一阶方程的初等解法）<\/span><\/li><li data-term='奇解'>奇解 — 不属于通解族、但与族中曲线相切的解 <span class=glossary-ref>（第 2 章：一阶方程的初等解法）<\/span><\/li><li data-term='包络'>包络 — 与一族曲线相切的曲线 <span class=glossary-ref>（第 2 章：一阶方程的初等解法）<\/span><\/li><li data-term='李普希茨条件'>李普希茨条件 — 关于 y 的变化率被常数 L 卡住 <span class=glossary-ref>（第 3 章：解的存在唯一性）<\/span><\/li><li data-term='皮卡迭代'>皮卡迭代 — 用积分方程反复代换逼近解 <span class=glossary-ref>（第 3 章：解的存在唯一性）<\/span><\/li><li data-term='格朗沃尔引理'>格朗沃尔引理 — 积分不等式推出差为零的工具 <span class=glossary-ref>（第 3 章：解的存在唯一性）<\/span><\/li><li data-term='饱和解'>饱和解 — 不能再延拓的解 <span class=glossary-ref>（第 3 章：解的存在唯一性）<\/span><\/li><li data-term='朗斯基行列式'>朗斯基行列式 — n 个解及其导数排成的行列式 <span class=glossary-ref>（第 4 章：高阶线性微分方程）<\/span><\/li><li data-term='基本解组'>基本解组 — n 个线性无关的齐次解 <span class=glossary-ref>（第 4 章：高阶线性微分方程）<\/span><\/li><li data-term='特征方程'>特征方程 — 常系数方程代入 e^(rx) 得到的多项式方程 <span class=glossary-ref>（第 4 章：高阶线性微分方程）<\/span><\/li><li data-term='基解矩阵'>基解矩阵 — 以 n 个线性无关解为列的矩阵 Φ <span class=glossary-ref>（第 5 章：线性微分方程组）<\/span><\/li><li data-term='矩阵指数'>矩阵指数 — e^(At)=ΣAᵏtᵏ/k! <span class=glossary-ref>（第 5 章：线性微分方程组）<\/span><\/li><li data-term='预解矩阵'>预解矩阵 — (sI−A)⁻¹，其逆变换为 e^(At) <span class=glossary-ref>（第 5 章：线性微分方程组）<\/span><\/li><li data-term='平衡点'>平衡点 — 使 f(x)=0 的点 <span class=glossary-ref>（第 6 章：非线性与稳定性）<\/span><\/li><li data-term='渐近稳定'>渐近稳定 — 稳定且轨线趋于平衡点 <span class=glossary-ref>（第 6 章：非线性与稳定性）<\/span><\/li><li data-term='李雅普诺夫函数'>李雅普诺夫函数 — 沿轨线单调下降的正定函数 V <span class=glossary-ref>（第 6 章：非线性与稳定性）<\/span><\/li><li data-term='极限环'>极限环 — 孤立的闭轨 <span class=glossary-ref>（第 6 章：非线性与稳定性）<\/span><\/li><li data-term='哈密顿方程'>哈密顿方程 — dp/dt=−H_q，dq/dt=H_p 形式的系统 <span class=glossary-ref>（第 6 章：非线性与稳定性）<\/span><\/li><li data-term='首次积分'>首次积分 — 沿轨线取常数的函数 <span class=glossary-ref>（第 6 章：非线性与稳定性）<\/span><\/li><li data-term='特征线'>特征线 — 偏微分方程沿之降为常微分方程的曲线 <span class=glossary-ref>（第 7 章：一阶线性偏微分方程）<\/span><\/li><li data-term='柯西问题'>柯西问题 — 偏微分方程加初始曲线的问题 <span class=glossary-ref>（第 7 章：一阶线性偏微分方程）<\/span><\/li><li data-term='格林函数'>格林函数 — 点源在边界条件下产生的响应 <span class=glossary-ref>（第 8 章：边值问题）<\/span><\/li><li data-term='斯特姆-刘维尔问题'>斯特姆-刘维尔问题 — 自伴形式的特征值问题 <span class=glossary-ref>（第 8 章：边值问题）<\/span><\/li><li data-term='弗雷德霍姆二择一'>弗雷德霍姆二择一 — 齐次问题只有零解则非齐次唯一可解 <span class=glossary-ref>（第 8 章：边值问题）<\/span><\/li><\/ul>", "kind": "glossary", "title": "术语表"}, "__patterns__": {"html": "<h1>模式与框架库<\/h1>\n<h2>框架：一阶方程解法判定链<\/h2>\n<p>拿到一个一阶方程，按顺序问四个问题，能停就停：<\/p>\n<ol><li>\n能不能写成 dy/dx=f(x)g(y)？→ 分离变量。\n<\/li><li>\n右端是不是 φ(y/x)？或者分式线性型能否平移？→ 换元。\n<\/li><li>\n是不是 y′+P(x)y=Q(x)？→ 常数变易公式。\n<\/li><li>\nM dx+N dy 是否满足 M_y=N_x？→ 恰当；否则算两个商式找积分因子。\n<\/ol>\n<p>停不下来的，说明它可能是隐式方程，转参数化路线。<\/p>\n<h2>框架：理论证明的三段式<\/h2>\n<p>凡&quot;存在唯一&quot;类定理，一律按这个骨架写：<\/p>\n<ol><li>\n化成积分方程（把微分变成积分，降低光滑性要求）；\n<\/li><li>\n构造逼近序列并证明一致收敛（存在）；\n<\/li><li>\n假设两个解，用格朗沃尔压成零（唯一）。\n<\/ol>\n<h2>决策规则<\/h2>\n<ul><li>\n线性方程：先判齐次还是非齐次。齐次找基本解组，非齐次先求一个特解。\n<\/li><li>\n常系数：先写特征方程。根重复就乘 x，根是复的就转三角，右端撞根就乘 xᵏ。\n<\/li><li>\n非线性：先算雅可比。双曲就用线性化；非双曲就找 V；平面还想看全局就找不变区域。\n<\/ul>\n<h2>反模式<\/h2>\n<ul><li>\n<strong>不检查除零因子<\/strong>。分离变量时除以 g(y)，忘了 g(y)=0 的常数解，直接丢解。\n<\/li><li>\n<strong>把 W=0 当成线性相关的万能判据<\/strong>。这只对线性齐次方程成立。\n<\/li><li>\n<strong>特征根重复还硬设 Ae^(λx)<\/strong>。代进去恒为零，解不出系数，然后怀疑自己算错。\n<\/li><li>\n<strong>边值问题直接套初值问题的存在唯一性<\/strong>。两者完全不同，边值问题可能无解。\n<\/li><li>\n<strong>用线性化处理临界情形<\/strong>。实部为零时线性化给不出结论，必须换方法。\n<\/ul>", "kind": "模式库", "title": "模式库"}, "__cheatsheet__": {"html": "<h1>速查表<\/h1>\n<h2>一阶方程<\/h2>\n<table><thead><tr><th>类型<\/th><th>标准形<\/th><th>解法<\/th><th>通解<\/th><\/tr><\/thead><tbody><tr><td>变量分离<\/td><td>y′=f(x)g(y)<\/td><td>分离积分<\/td><td>∫dy/g(y)=∫f(x)dx+C<\/td><\/tr><tr><td>齐次型<\/td><td>y′=φ(y/x)<\/td><td>令 u=y/x<\/td><td>x du/dx=φ(u)−u<\/td><\/tr><tr><td>一阶线性<\/td><td>y′+P(x)y=Q(x)<\/td><td>常数变易<\/td><td>y=e^(−∫P)[∫Qe^(∫P)+C]<\/td><\/tr><tr><td>伯努利<\/td><td>y′+P y=Q yⁿ<\/td><td>令 z=y^(1−n)<\/td><td>化为一阶线性<\/td><\/tr><tr><td>恰当<\/td><td>M dx+N dy=0，M_y=N_x<\/td><td>求 u<\/td><td>u(x,y)=C<\/td><\/tr><tr><td>积分因子 x<\/td><td>(M_y−N_x)/N 只含 x<\/td><td>μ=e^(∫…)<\/td><td>乘后变恰当<\/td><\/tr><tr><td>积分因子 y<\/td><td>(N_x−M_y)/M 只含 y<\/td><td>μ=e^(∫…)<\/td><td>同上<\/td><\/tr><tr><td>隐式<\/td><td>y=f(x,p)<\/td><td>p=y′ 求导<\/td><td>参数式<\/td><\/tr><tr><td>克莱罗<\/td><td>y=xp+g(p)<\/td><td>求导<\/td><td>直线族 + 包络奇解<\/td><\/tr><\/tbody><\/table>\n<h2>线性方程<\/h2>\n<table><thead><tr><th>场景<\/th><th>结论<\/th><\/tr><\/thead><tbody><tr><td>n 阶齐次解空间<\/td><td>n 维<\/td><\/tr><tr><td>非齐次通解<\/td><td>特解 + 齐次通解<\/td><\/tr><tr><td>朗斯基<\/td><td>W(x)=W(x₀)exp(−∫a₁)<\/td><\/tr><tr><td>常数变易<\/td><td>Σcᵢ′yᵢ⁽ᵏ⁾=0，最后一式为 f<\/td><\/tr><tr><td>特征根单实<\/td><td>e^(rx)<\/td><\/tr><tr><td>特征根 k 重<\/td><td>e^(rx), xe^(rx), …, x^(k−1)e^(rx)<\/td><\/tr><tr><td>复根 α±iβ<\/td><td>e^(αx)cos βx, e^(αx)sin βx<\/td><\/tr><tr><td>右端 P_m e^(λx)<\/td><td>特解 xᵏQ_m e^(λx)<\/td><\/tr><tr><td>右端 e^(αx)(P cos+Q sin)<\/td><td>xᵏe^(αx)(R cos+S sin)<\/td><\/tr><\/tbody><\/table>\n<h2>方程组<\/h2>\n<table><thead><tr><th>场景<\/th><th>结论<\/th><\/tr><\/thead><tbody><tr><td>基解矩阵<\/td><td>Φ′=AΦ，det Φ≠0<\/td><\/tr><tr><td>非齐次<\/td><td>x=Φ[C+∫Φ⁻¹f]<\/td><\/tr><tr><td>det Φ<\/td><td>det Φ(t₀)exp(∫tr A)<\/td><\/tr><tr><td>e^(At)<\/td><td>ΣAᵏtᵏ/k!，满足 Φ(0)=I<\/td><\/tr><tr><td>对角化<\/td><td>P diag(e^(λᵢt)) P⁻¹<\/td><\/tr><tr><td>若尔当块<\/td><td>e^(λt)(I+Nt+…+N^(k−1)t^(k−1)/(k−1)!)<\/td><\/tr><tr><td>拉普拉斯<\/td><td>X=(sI−A)⁻¹(x₀+F)<\/td><\/tr><\/tbody><\/table>\n<h2>稳定性与相图<\/h2>\n<table><thead><tr><th>条件<\/th><th>类型<\/th><\/tr><\/thead><tbody><tr><td>tr&lt;0，det&gt;0，Δ&gt;0<\/td><td>稳定结点<\/td><\/tr><tr><td>tr&gt;0，det&gt;0，Δ&gt;0<\/td><td>不稳定结点<\/td><\/tr><tr><td>det&lt;0<\/td><td>鞍点<\/td><\/tr><tr><td>tr&lt;0，det&gt;0，Δ&lt;0<\/td><td>稳定焦点<\/td><\/tr><tr><td>tr&gt;0，det&gt;0，Δ&lt;0<\/td><td>不稳定焦点<\/td><\/tr><tr><td>tr=0，det&gt;0<\/td><td>中心<\/td><\/tr><tr><td>特征值实部全负<\/td><td>渐近稳定<\/td><\/tr><tr><td>有正实部<\/td><td>不稳定<\/td><\/tr><tr><td>实部为零<\/td><td>线性化失效<\/td><\/tr><\/tbody><\/table>\n<h2>数值方法<\/h2>\n<ul><li>\n欧拉：yₙ₊₁=yₙ+h f，整体 O(h)\n<\/li><li>\nRK4：k₁..k₄，yₙ₊₁=yₙ+h(k₁+2k₂+2k₃+k₄)/6，整体 O(h⁴)\n<\/ul>", "kind": "速查表", "title": "速查表"}}, "base_dir": "/home/user/Doubao/chats/38451120534976514/常微分方程点化学习系统/01-王高雄-常微分方程", "nav": [{"label": "学习路径", "href": "#/path"}, {"label": "章节", "children": [{"label": "第 1 章：绪论", "href": "#/chapter/ch01"}, {"label": "第 2 章：一阶方程的初等解法", "href": "#/chapter/ch02"}, {"label": "第 3 章：解的存在唯一性", "href": "#/chapter/ch03"}, {"label": "第 4 章：高阶线性微分方程", "href": "#/chapter/ch04"}, {"label": "第 5 章：线性微分方程组", "href": "#/chapter/ch05"}, {"label": "第 6 章：非线性与稳定性", "href": "#/chapter/ch06"}, {"label": "第 7 章：一阶线性偏微分方程", "href": "#/chapter/ch07"}, {"label": "第 8 章：边值问题", "href": "#/chapter/ch08"}]}, {"label": "概念", "children": [{"label": "通解与初值问题", "href": "#/concept/c01"}, {"label": "积分因子", "href": "#/concept/c02"}, {"label": "皮卡迭代与格朗沃尔引理", "href": "#/concept/c03"}, {"label": "朗斯基行列式", "href": "#/concept/c04"}, {"label": "基解矩阵与矩阵指数", "href": "#/concept/c05"}, {"label": "李雅普诺夫稳定性", "href": "#/concept/c06"}]}, {"label": "测验", "children": [{"label": "综合测验", "href": "#/quiz/all"}, {"label": "测验：第 1 章：绪论", "href": "#/quiz/ch01"}, {"label": "测验：第 2 章：一阶方程的初等解法", "href": "#/quiz/ch02"}, {"label": "测验：第 3 章：解的存在唯一性", "href": "#/quiz/ch03"}, {"label": "测验：第 4 章：高阶线性微分方程", "href": "#/quiz/ch04"}, {"label": "测验：第 5 章：线性微分方程组", "href": "#/quiz/ch05"}, {"label": "测验：第 6 章：非线性与稳定性", "href": "#/quiz/ch06"}, {"label": "测验：第 7 章：一阶线性偏微分方程", "href": "#/quiz/ch07"}, {"label": "测验：第 8 章：边值问题", "href": "#/quiz/ch08"}]}, {"label": "抽认卡", "href": "#/cards"}, {"label": "术语表", "href": "#/glossary"}, {"label": "模式库", "href": "#/patterns"}, {"label": "速查表", "href": "#/cheatsheet"}], "rendered": {"ch01": "<h1>第 1 章：绪论——微分方程到底在解什么<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★☆☆ | <strong>预估学时<\/strong>：3 小时 | <strong>前置<\/strong>：微积分（导数、积分、链式法则）\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n说清微分方程与代数方程的区别：一个求&quot;数&quot;，一个求&quot;函数&quot;；\n<\/li><li>\n给定一个方程，判断它的阶数、是否线性、自变量与未知函数；\n<\/li><li>\n区分通解、特解、隐式解、初值问题，并解释&quot;含 n 个独立任意常数&quot;里的&quot;独立&quot;指什么；\n<\/li><li>\n把一阶方程 y′=f(x,y) 读成一张方向场，说出积分曲线与等斜线的关系；\n<\/li><li>\n把 n 阶方程改写成一阶方程组。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>微分方程不是&quot;求出 y 等于多少&quot;，而是&quot;已知 y 的变化率与 y 自身的关系，反推 y 这个函数&quot;。所以它的解天生带着任意常数，要靠定解条件把常数钉死。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>1.1 从代数方程到微分方程<\/h3>\n<p>中学解 2x+3=7，未知量是一个数。微分方程里未知量是一个函数 y(x)，方程里出现的是它的导数。<\/p>\n<p>为什么需要这种方程？因为现实世界里我们常常只能测到&quot;变化率&quot;。RLC 电路里，基尔霍夫第二定律给出的是各元件电压降的代数和为零，而电感上的电压降是 L·dI/dt，这就把电流 I 的变化率和 I 本身绑在了一个式子里：<\/p>\n<div class=\"eq\">L·dI/dt + R·I = E<\/div>\n<p>这里 E 是电源电压。你不知道 I(t) 长什么样，但你知道它每一刻怎么变。微分方程的任务就是从这个&quot;怎么变&quot;反推&quot;是什么&quot;。<\/p>\n<h3>1.2 五个必须能默写的模型<\/h3>\n<table><thead><tr><th>模型<\/th><th>方程<\/th><th>关键假设<\/th><\/tr><\/thead><tbody><tr><td>RL 电路<\/td><td>L·dI/dt + R·I = E<\/td><td>电阻、电感为常数<\/td><\/tr><tr><td>RLC 电路<\/td><td>L·d²I/dt² + R·dI/dt + I/C = de/dt<\/td><td>电源电压 e(t) 已知<\/td><\/tr><tr><td>数学摆<\/td><td>d²θ/dt² + (g/l)·sin θ = 0<\/td><td>只受重力，绳长 l<\/td><\/tr><tr><td>马尔萨斯人口<\/td><td>dN/dt = r·N<\/td><td>净相对增长率为常数<\/td><\/tr><tr><td>逻辑斯谛人口<\/td><td>dN/dt = r·N·(1 − N/N_m)<\/td><td>环境容量 N_m 有限<\/td><\/tr><tr><td>两种群竞争<\/td><td>dx/dt = x(a − b·y)，dy/dt = y(−c + d·x)<\/td><td>系数正负决定关系类型<\/td><\/tr><tr><td>洛伦茨<\/td><td>dx/dt = σ(y − x)，dy/dt = x(ρ − z) − y，dz/dt = x·y − β·z<\/td><td>σ=10，ρ=28，β=8/3<\/td><\/tr><\/tbody><\/table>\n<p>这些模型的共同点：<strong>状态变量的变化率只依赖当前状态<\/strong>，不依赖历史。这叫&quot;无记忆&quot;，是常微分方程能描述的系统的基本特征。洛伦茨方程是反例里最出名的一个——它对初值极端敏感，初始差 0.001，几十步后轨迹就分道扬镳，这就是混沌。<\/p>\n<blockquote>类比：微分方程像一段&quot;驾驶指令&quot;——它不告诉你车最终停在哪，只告诉你&quot;当前速度 = 当前位置的函数&quot;。给定起点，轨迹就被决定了（大多数情况下）。类比失效的地方：洛伦茨方程说明，起点差一点点，轨迹可以差到完全无关，这时&quot;给定起点决定轨迹&quot;在实用意义上失效。<\/blockquote>\n<h3>1.3 基本概念逐个钉死<\/h3>\n<p><strong>阶数<\/strong>：方程中出现的未知函数最高阶导数的阶数。y′+y=0 是一阶，y″+y=0 是二阶。<\/p>\n<p><strong>线性<\/strong>：把方程整理成 F(x, y, y′, …, y⁽ⁿ⁾)=0 后，左端关于 y 及其各阶导数是一次的整式。y″+x·y′+sin(x)·y = eˣ 是线性；y″+y²=0 不是；y·y′=1 也不是。注意：系数里出现 x 的非线性函数（如 sin x）不影响线性性，因为&quot;线性&quot;只针对未知函数 y。<\/p>\n<p><strong>解<\/strong>：把 y=φ(x) 代进去使方程成为恒等式。若解由 Φ(x,y)=0 隐式确定，叫隐式解（也叫积分）。<\/p>\n<p><strong>通解<\/strong>：n 阶方程含 n 个<strong>独立<\/strong>任意常数的解。独立的意思是：对 φ 及其直到 n−1 阶偏导数关于 c₁,…,cₙ 的雅可比行列式不为零。白话讲，就是这些常数真的各管一件事，不能互相替代。<\/p>\n<p><strong>特解<\/strong>：满足某组初值条件的解。n 阶方程的初值条件是<\/p>\n<div class=\"eq\">y(x₀)=y₀，y′(x₀)=y₀′，…，y⁽ⁿ⁻¹⁾(x₀)=y₀⁽ⁿ⁻¹⁾<\/div>\n<p><strong>初值问题<\/strong>：方程 + 初值条件一起构成的问题，记作 y′=f(x,y), y(x₀)=y₀。<\/p>\n<h3>1.4 几何视角：积分曲线与方向场<\/h3>\n<p>一阶方程 y′=f(x,y) 有一个漂亮的读法：在平面上每一点 (x,y) 画一小段斜率为 f(x,y) 的线段，得到<strong>方向场<\/strong>。解曲线（积分曲线）就是处处与这些线段相切的曲线。<\/p>\n<p>把方向场里斜率相同的点连起来，得到<strong>等斜线<\/strong>：f(x,y)=k。用几条等斜线就能大致勾出积分曲线的走向。<\/p>\n<p>再往前一步：如果方程右端不显含 x，即 y′=f(y)，把 x 轴换成 t 轴、y 轴换成 x 轴，得到 dx/dt=f(x)，这就是<strong>相平面<\/strong>（一维情形叫相直线）。此时的解曲线叫<strong>轨线<\/strong>，它只记录状态怎么变，不记录什么时候变。<\/p>\n<div class=\"eq\">垂直等斜线：f(x,y)=0（轨线切线竖直）；水平等斜线：g(x,y)=0<\/div>\n<p>两者的交点就是奇点，在那里 x 和 y 都不再变化。<\/p>\n<h3>1.5 高阶化一阶：为什么教材偏爱方程组<\/h3>\n<p>n 阶方程 y⁽ⁿ⁾=g(x, y, y′, …, y⁽ⁿ⁻¹⁾) 令<\/p>\n<div class=\"eq\">y₁=y，y₂=y′，…，yₙ=y⁽ⁿ⁻¹⁾<\/div>\n<p>就变成<\/p>\n<div class=\"eq\">dy₁/dx=y₂，dy₂/dx=y₃，…，dyₙ/dx=g(x, y₁, …, yₙ)<\/div>\n<p>写成向量形式 dy/dx=f(x,y)，y∈Rⁿ。这一步的意义是：存在唯一性定理、解的延拓、稳定性理论都只需要对一阶方程组陈述一次，高阶情形自动包含。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[现实系统] --&gt; B[状态变量与变化率]\n    B --&gt; C[常微分方程]\n    C --&gt; D[一阶显式方程 dy/dx=f]\n    C --&gt; E[高阶方程]\n    E --&gt; F[化为一阶方程组]\n    D --&gt; G[方向场与积分曲线]\n    F --&gt; H[存在唯一性理论]\n    G --&gt; I[定性理论与相平面]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：整门课的主线只有两条。左路是&quot;求出来&quot;——初等解法、幂级数解法；右路是&quot;不求也能说清&quot;——存在唯一性、延拓、稳定性、相平面。第一章站在最上面，把两条路的分岔口标出来。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：把 y′=f(x,y) 想成地图上的水流。方向场是每一点的水流箭头，积分曲线是一片叶子随水漂出的轨迹。叶子不能凭空拐弯，它的每一段都必须顺着箭头。<\/p>\n<p><strong>失效边界<\/strong>：水流箭头本身可能随时间变（非自治方程 y′=f(t,y)），这时方向场是动的，&quot;静态地图&quot;的直觉就不成立了。<\/p>\n<p><strong>实例<\/strong>：验证 y=ce^(−x)+x−1 是 y′+y=x 的通解。<\/p>\n<p>代入左端：y′=−ce^(−x)+1，所以 y′+y = (−ce^(−x)+1)+(ce^(−x)+x−1)=x。恒等成立。c 只有一个，方程是一阶，所以这是通解。取 y(0)=2，则 c·1+0−1=2，c=3，特解 y=3e^(−x)+x−1。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为&quot;通解就是所有解&quot;<\/strong>——实际上通解可能漏掉奇解。例如 y′=√(1−y²) 的通解是 y=sin(x+c)，但 y=±1 也是解，它们不含任意常数，不在通解族里。\n<\/li><li>\n<strong>别以为&quot;线性&quot;是指图像是直线&quot;<\/strong>——实际上线性说的是方程关于 y 及其导数是几次的。y″+y=x² 是线性的，它的解曲线完全不是直线。\n<\/li><li>\n<strong>别以为&quot;解一定有任意常数&quot;<\/strong>——实际上初值问题给定了常数，答案是唯一的特解；而奇解可以一个常数都没有。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n判断 y·y″+(y′)²=0 的阶数与线性性。\n<p>（答案：二阶，非线性。解析：含有 y·y″ 这一项，关于 y 和 y″ 是二次的，所以非线性。）<\/p>\n<\/ol>\n<ol><li>\n方程 y′=3y 的通解是什么？满足 y(0)=5 的特解是什么？\n<p>（答案：y=ce^(3x)；特解 y=5e^(3x)。解析：分离变量得 dy/y=3dx，积分得 ln|y|=3x+c₁。）<\/p>\n<\/ol>\n<ol><li>\n一阶方程 y′=f(x,y) 的等斜线 f(x,y)=0 有什么几何意义？\n<p>（答案：在这条线上积分曲线的切线是水平的。解析：斜率为 0 意味着切线平行于 x 轴；同时它也是相平面上的&quot;水平等斜线&quot;的来源。）<\/p>\n<\/ol>\n<ol><li>\n把 y″+3y′+2y=0 化为一阶方程组。\n<p>（答案：令 y₁=y，y₂=y′，则 y₁′=y₂，y₂′=−2y₁−3y₂。解析：从 y″=−3y′−2y 直接读出第二个分量。）<\/p>\n<\/ol>\n<ol><li>\n&quot;n 阶方程的通解含 n 个任意常数&quot;这句话，为什么强调&quot;独立&quot;？\n<p>（答案：因为常数可能相互替代，例如 c₁+c₂ 实质上只是一个常数，那就退化成了 n−1 个自由度，不能覆盖全部解。独立性用雅可比行列式不为零来判定。）<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n微分方程解的是函数，不是数；通解带常数，定解条件钉死常数。\n<\/li><li>\n一阶方程 = 方向场，解 = 顺着箭头走的曲线。\n<\/li><li>\n高阶化一阶，是把整门课的理论统一到 dy/dx=f(x,y)。\n<\/ul>", "ch02": "<h1>第 2 章：一阶微分方程的初等解法<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：8 小时 | <strong>前置<\/strong>：第 1 章、不定积分、换元积分、偏导数\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n认出并解出四类一阶方程：变量分离、齐次型、一阶线性、恰当方程；\n<\/li><li>\n在方程不恰当时，用只依赖 x 或只依赖 y 的积分因子把它救成恰当方程；\n<\/li><li>\n解出隐式方程 y=f(x,y′) 与 x=f(y,y′)，会用参数表示写出通解；\n<\/li><li>\n判断一个&quot;解&quot;是不是奇解，而不是把它当成通解的特例。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>一阶方程的初等解法只有一件事：<strong>把方程改写成&quot;某个函数的全微分等于 0&quot;<\/strong>。分离变量、常数变易、积分因子，都是在凑这个全微分。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>2.1 变量分离：最原始的一招<\/h3>\n<p>形如<\/p>\n<div class=\"eq\">dy/dx = f(x)·g(y)<\/div>\n<p>把含 y 的挪到左边，含 x 的挪到右边：<\/p>\n<div class=\"eq\">dy/g(y) = f(x) dx<\/div>\n<p>两边积分。若 g(y₀)=0，则 y≡y₀ 也是解，这一点必须单独记，否则会丢解。<\/p>\n<p>例：dy/dx = 2xy。分离得 dy/y = 2x dx（y≠0），积分得 ln|y|=x²+c₁，即 y=ce^(x²)。另外 y≡0 也是解。<\/p>\n<p><strong>为什么能这么干？<\/strong> 因为 dy/dx 不是分数，但在一阶情形它可以当作微分之比来操作——严格说法是：若 y=φ(x) 是解，则 dφ = f(x)g(φ)dx，两边除以 g(φ) 后积分，链式法则保证左边恰好是 ∫dy/g(y)。<\/p>\n<h3>2.2 可化为变量分离的两类<\/h3>\n<p><strong>(a) 齐次型<\/strong> dy/dx = φ(y/x)。令 u=y/x，则 y=ux，dy/dx = u + x·du/dx，方程变成<\/p>\n<div class=\"eq\">x·du/dx = φ(u) − u<\/div>\n<p>这是关于 u 的变量分离方程。解完把 u 换回 y/x。<\/p>\n<p><strong>(b) 分式线性型<\/strong><\/p>\n<div class=\"eq\">dy/dx = (a₁x+b₁y+c₁)/(a₂x+b₂y+c₂)<\/div>\n<p>先看行列式 Δ=a₁b₂−a₂b₁。Δ≠0 时，解线性方程组找出交点 (x₀,y₀)，作平移 X=x−x₀，Y=y−y₀，方程化为齐次型。Δ=0 时，两行成比例，令 u=a₂x+b₂y，直接化为变量分离。<\/p>\n<h3>2.3 一阶线性方程与常数变易法<\/h3>\n<p>标准形<\/p>\n<div class=\"eq\">dy/dx + P(x)·y = Q(x)<\/div>\n<p><strong>第一步<\/strong>：先解齐次方程 dy/dx + P(x)y = 0，得 y = c·e^(−∫P dx)。 <strong>第二步（常数变易）<\/strong>：把常数 c 换成待定函数 c(x)，代回原方程，得到<\/p>\n<div class=\"eq\">c′(x)·e^(−∫P dx) = Q(x)<\/div>\n<p>于是 c(x)=∫Q(x)e^(∫P dx)dx + C，通解为<\/p>\n<div class=\"eq\">y = e^(−∫P dx) [ ∫ Q(x) e^(∫P dx) dx + C ]<\/div>\n<p>这个公式建议直接背，但更该记住它的来源：<strong>齐次解是&quot;骨架&quot;，非齐次的解是在骨架上按 x 逐点调整振幅<\/strong>。<\/p>\n<blockquote>类比：齐次解像一条自由衰减的弹簧振动，非齐次项 Q(x) 像外力，常数变易就是让振幅随时间被外力推着改。类比失效处：Q(x) 与 y 同频率共振时振幅会线性增长，弹簧类比只能给出&quot;越来越大&quot;，给不出精确的 t 倍增长。<\/blockquote>\n<h3>2.4 恰当方程与积分因子<\/h3>\n<p>把方程写成<\/p>\n<div class=\"eq\">M(x,y)dx + N(x,y)dy = 0<\/div>\n<p>若存在 u(x,y) 使 du = M dx + N dy，即<\/p>\n<div class=\"eq\">∂u/∂x = M，∂u/∂y = N<\/div>\n<p>则方程叫<strong>恰当方程<\/strong>，解就是 u(x,y)=C。判定条件（单连通区域上）：<\/p>\n<div class=\"eq\">∂M/∂y = ∂N/∂x<\/div>\n<p>不满足时找<strong>积分因子<\/strong> μ，使 μ M dx + μ N dy 恰当，即<\/p>\n<div class=\"eq\">∂(μM)/∂y = ∂(μN)/∂x<\/div>\n<p>两个最常用的特例：<\/p>\n<ul><li>\nμ 只依赖 x：需 (∂M/∂y − ∂N/∂x)/N 只是 x 的函数，则 μ=exp(∫(… )dx)。\n<\/li><li>\nμ 只依赖 y：需 (∂N/∂x − ∂M/∂y)/M 只是 y 的函数，则 μ=exp(∫(… )dy)。\n<\/ul>\n<p>求 u 的方法有两条：凑全微分（把 M dx + N dy 拆成几组已知的全微分），或沿折线积分<\/p>\n<div class=\"eq\">u = ∫[x₀,x] M(t,y₀)dt + ∫[y₀,y] N(x,s)ds<\/div>\n<h3>2.5 隐式方程 y=f(x,y′) 与参数表示<\/h3>\n<p>方程里 y′ 解不出来时，把 y′ 当参数 p。<\/p>\n<p><strong>能解出 y 的类型<\/strong> y=f(x,p)：对 x 求导得 p = ∂f/∂x + ∂f/∂p·dp/dx，这是关于 p 与 x 的一阶方程，解出 p=p(x,C)，再回代得通解。<\/p>\n<p><strong>不显含 y 的类型<\/strong> y=f(x,y′)：同上。 <strong>不显含 x 的类型<\/strong> x=f(y,y′)：令 p=y′，dx=dy/p，得 1/p = ∂f/∂y + ∂f/∂p·dp/dy，解出 p 后回代。<\/p>\n<p><strong>克莱罗方程<\/strong> y = x·p + g(p) 是特例：求导后得 (x+g′(p))·dp/dx = 0，于是要么 p=C 给出一族直线 y=Cx+g(C)，要么 x=−g′(p) 给出<strong>包络<\/strong>——这条包络是奇解，不属于直线族。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[一阶方程] --&gt; B{能否分离]\n    B --&gt;|能| C[变量分离]\n    B --&gt;|否| D{是否齐次型或可平移]\n    D --&gt;|是| E[令 u=y/x 化为分离]\n    D --&gt;|否| F{是否线性]\n    F --&gt;|是| G[常数变易法]\n    F --&gt;|否| H{是否恰当]\n    H --&gt;|是| I[求 u 使 du=0]\n    H --&gt;|否| J[找积分因子再求 u]\n    A --&gt; K{是否隐式 y=f x y-prime}\n    K --&gt;|是| L[引入参数 p 化为低一阶]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：从上往下是一条&quot;降维打击&quot;的判定链：能分离就分离，不能就换元，再不能就找积分因子。走到最底下的隐式分支，说明前四类都不成立，只能靠参数化。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：找积分因子像给方程&quot;配平&quot;。μ 是一个乘数，乘上去不改变解集（只要 μ≠0），却让左边从&quot;两个不相干的偏导&quot;变成&quot;同一个函数的两个偏导&quot;。<\/p>\n<p><strong>失效边界<\/strong>：μ 只在 μ≠0 的区域有效。若 μ 在某条曲线上为零，那里可能丢解；另外积分因子一般难以显式求出，教材只处理 μ 只依赖一个变量的情形。<\/p>\n<p><strong>实例 1<\/strong>：解 dy/dx = (x+y)/(x−y)。 这是齐次型，令 u=y/x，得 x·du/dx = (1+2u−u²)/(1−u)。分离积分后回代，得到隐式解 x²+y²=C·e^(−2arctan(y/x)) 形式的一族曲线（不同教材整理方式略异，验算时把解代回原方程即可核对）。<\/p>\n<p><strong>实例 2<\/strong>：解 (2xy+y²)dx+(x²+2xy)dy=0。 M=2xy+y²，N=x²+2xy。∂M/∂y=2x+2y，∂N/∂x=2x+2y，相等，恰当。取 u=x²y+xy²，解为 x²y+xy²=C。<\/p>\n<p><strong>实例 3<\/strong>：解 y=x·p+p²。 求导得 p=p+(x+2p)dp/dx，即 (x+2p)dp/dx=0。p=C 给 y=Cx+C²；另一支 x=−2p 给 y=−p²，即 y=−x²/4，是前者的包络，属于奇解。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为&quot;分离变量时除以 g(y) 万事大吉&quot;<\/strong>——实际上 g(y)=0 的常数解会因此丢掉。y′=y² 的通解是 y=−1/(x+C)，还有 y≡0。\n<\/li><li>\n<strong>别以为&quot;恰当方程的判定条件对所有区域都成立&quot;<\/strong>——实际上需要区域单连通。挖了洞的区域（如去掉原点的平面）可能 ∂M/∂y=∂N/∂x 却不存在全局的 u。\n<\/li><li>\n<strong>别以为&quot;积分因子唯一&quot;<\/strong>——实际上同一条方程可以有无穷多个积分因子，教材给的两个公式只是最容易算的两种。\n<\/li><li>\n<strong>别以为&quot;包络也是通解的一员&quot;<\/strong>——实际上奇解在每一点都与某条通解曲线相切，但它本身不是任何一条通解曲线。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n解 dy/dx = y·tan x。\n<p>（答案：y=C/cos x，另外需注意 cos x=0 的点。解析：分离得 dy/y=tan x dx，积分得 ln|y|=−ln|cos x|+c。）<\/p>\n<\/ol>\n<ol><li>\n判断 (y+2xy)dx+(x−2y)dy=0 是否恰当；若否，找一个只依赖 y 的积分因子。\n<p>（答案：∂M/∂y=1+2x，∂N/∂x=1，不恰当。(∂N/∂x−∂M/∂y)/M=(−2x)/(y+2xy)=−2/y，只依赖 y，故 μ=e^(∫−2/y dy)=1/y²。解析：判据中的分母必须是 M 且结果只含 y。）<\/p>\n<\/ol>\n<ol><li>\n一阶线性方程 y′+2xy=x 的通解？\n<p>（答案：y=1/2+Ce^(−x²)。解析：∫P dx=x²，y=e^(−x²)[∫x·e^(x²)dx+C]=e^(−x²)[e^(x²)/2+C]。）<\/p>\n<\/ol>\n<ol><li>\n克莱罗方程 y=xp+p³ 的奇解是什么？\n<p>（答案：y=−2x^(3/2)/3 的一方与另一支，严格写为参数式 x=−3p²，y=−2p³。消去 p 得 y=±(2/3)·(−x/3)^(3/2)。解析：x+3p²=0 给 p=±√(−x/3)，代回 y=xp+p³。）<\/p>\n<\/ol>\n<ol><li>\n为什么说&quot;一阶方程初等解法的本质是凑全微分&quot;？\n<p>（答案：分离变量后 ∫f(x)dx−∫dy/g(y)=C 就是 d(F(x)−G(y))=0；常数变易得到的解可写成 d(y·e^(∫P dx))=Q e^(∫P dx)dx；恰当方程直接就是 du=0。三种方法都在构造同一个 u。）<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n分离变量先问一句：除下去的那个因子会不会为零。\n<\/li><li>\n线性方程的通解公式：y=e^(−∫P)[∫Qe^(∫P)+C]。\n<\/li><li>\n恰当看 ∂M/∂y=∂N/∂x；不恰当看两个商式哪个只含一个变量。\n<\/li><li>\n奇解是通解族的包络，不是族里的成员。\n<\/ul>", "ch03": "<h1>第 3 章：解的存在唯一性——为什么&quot;解存在&quot;需要证明<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：10 小时 | <strong>前置<\/strong>：第 2 章、一致收敛、柯西序列、格朗沃尔引理\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n复述并证明皮卡定理：连续 + 李普希茨 → 局部存在唯一；\n<\/li><li>\n用皮卡迭代序列构造解，并写出第 n 次近似的误差估计；\n<\/li><li>\n用格朗沃尔引理证明唯一性，而不是靠&quot;两个解相减&quot;的直觉；\n<\/li><li>\n说清&quot;解能延拓到哪&quot;的判据，以及解对初值是连续可微的；\n<\/li><li>\n判别奇解：p-判别式与 C-判别式的区别；\n<\/li><li>\n写出欧拉法与四阶龙格-库塔公式，并说出误差阶。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>初等解法能解出来的方程只是极少数。整门课真正的底座是：<strong>只要右端足够光滑，解就存在且唯一<\/strong>——存在性靠构造迭代序列，唯一性靠格朗沃尔引理。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>3.1 把微分方程改成积分方程<\/h3>\n<p>考虑初值问题<\/p>\n<div class=\"eq\">dy/dx = f(x, y)，y(x₀) = y₀<\/div>\n<p>它在区间 I 上的解与下面这个积分方程的解完全等价：<\/p>\n<div class=\"eq\">y(x) = y₀ + ∫[x₀→x] f(t, y(t)) dt<\/div>\n<p>这一步是整章的技术起点。为什么等价？如果 y 满足微分方程，两边从 x₀ 积分到 x 就得到积分方程；反过来，积分方程右端可导，求导即得微分方程，且 x=x₀ 时积分项为零。<\/p>\n<p>积分方程的好处是：它把&quot;求导&quot;变成了&quot;积分&quot;，而积分对函数的要求更低，可以拿来做迭代。<\/p>\n<h3>3.2 李普希茨条件<\/h3>\n<p>设 f 在矩形 R：|x−x₀|≤a，|y−y₀|≤b 上连续。若存在常数 L，使对 R 内任意两点 (x,y₁)、(x,y₂)，<\/p>\n<div class=\"eq\">|f(x, y₁) − f(x, y₂)| ≤ L·|y₁ − y₂|<\/div>\n<p>则称 f 关于 y 满足<strong>李普希茨条件<\/strong>，L 叫李普希茨常数。<\/p>\n<p>白话解释：f 对 y 的变化不能太陡，陡峭程度被 L 卡住。若 ∂f/∂y 在 R 上连续且有界，取 L 为其上界即可，这是最常用的验证方式。<\/p>\n<blockquote>类比：李普希茨条件是&quot;坡度上限&quot;。一条山路的坡度有上限，你从任何一点出发，走固定水平距离，海拔变化就不会超过某个值。<\/blockquote>\n<blockquote>失效边界：它允许函数有折角（比如 |y|），所以比&quot;可微&quot;更宽松；但它排除了 y′=√|y| 这类在 0 点附近坡度无界的方程——这种方程解仍然存在，但唯一性会失效。<\/blockquote>\n<h3>3.3 皮卡定理<\/h3>\n<p><strong>定理（皮卡存在唯一性定理）<\/strong>：设 f(x,y) 在矩形 R 上连续，关于 y 满足李普希茨条件，则初值问题在区间<\/p>\n<div class=\"eq\">|x − x₀| ≤ h，h = min(a, b/M)，M = max|f| over R<\/div>\n<p>上存在唯一解。<\/p>\n<p><strong>构造性证明（逐步逼近法）<\/strong>：<\/p>\n<p>第 0 次近似取常数函数 φ₀(x)=y₀。定义<\/p>\n<div class=\"eq\">φₙ₊₁(x) = y₀ + ∫[x₀→x] f(t, φₙ(t)) dt<\/div>\n<p>先证每个 φₙ 都落在矩形内（所以定义有意义）：由 |φₙ₊₁(x)−y₀| ≤ M|x−x₀| ≤ M·h ≤ b，归纳成立。<\/p>\n<p>再证收敛。关键估计：<\/p>\n<div class=\"eq\">|φₙ₊₁(x) − φₙ(x)| ≤ M·Lⁿ·|x−x₀|ⁿ⁺¹/(n+1)!<\/div>\n<p>这个式子靠归纳：n=0 时 |φ₁−φ₀| ≤ M|x−x₀|；若第 n 步成立，则<\/p>\n<div class=\"eq\">|φₙ₊₂ − φₙ₊₁| ≤ L·∫|φₙ₊₁ − φₙ| ≤ M·Lⁿ⁺¹·|x−x₀|ⁿ⁺²/(n+2)!<\/div>\n<p>右边正是阶乘级数的一般项乘以 M，而 Σ|x−x₀|ᵏ/k! 收敛，所以函数项级数 Σ(φₙ₊₁−φₙ) 在 |x−x₀|≤h 上一致收敛。于是 φₙ 一致收敛到一个连续函数 φ，且 φ 满足积分方程。<\/p>\n<p><strong>唯一性<\/strong>：设 φ、ψ 都是解。令 D(x)=|φ(x)−ψ(x)|，则<\/p>\n<div class=\"eq\">D(x) ≤ ∫[x₀→x] L·D(t) dt<\/div>\n<p><strong>格朗沃尔引理<\/strong>：若 D(x) ≤ A + ∫[x₀→x] B·D(t)dt，则 D(x) ≤ A·e^(B|x−x₀|)。取 A=0，得 D≡0，唯一性成立。<\/p>\n<h3>3.4 误差估计<\/h3>\n<p>第 n 次近似与真解的偏差有显式上界：<\/p>\n<div class=\"eq\">|φₙ(x) − φ(x)| ≤ M·Lⁿ·hⁿ⁺¹/(n+1)!·e^(L·h)<\/div>\n<p>这个式子给了&quot;迭代几次就够用&quot;的定量依据：L 越小、h 越短，收敛越快。<\/p>\n<h3>3.5 解的延拓<\/h3>\n<p>皮卡定理只保证局部（|x−x₀|≤h）。<strong>延拓<\/strong>是说：从这点解出发，只要还落在 f 的定义域内部，就可以继续往右（或往左）接下去，得到一个<strong>饱和解<\/strong>，其存在区间的端点必定顶到定义域的边界，或者解本身跑向无穷。<\/p>\n<p>判据：若解在有限点 x₁ 处右端无定义，或解在该处无界，则不能延拓过去。常见情形是解在有限时间内爆破，例如 y′=y²，y(0)=1 的解 y=1/(1−x) 在 x=1 处爆破。<\/p>\n<h3>3.6 解对初值的连续性与可微性<\/h3>\n<p>记解为 y=φ(x, x₀, y₀)。<strong>连续依赖<\/strong>：初值的小扰动只造成解的小扰动，且有定量估计<\/p>\n<div class=\"eq\">|φ(x, x₀, y₀) − φ(x, x₀, y₀′)| ≤ |y₀ − y₀′|·e^(L|x−x₀|)<\/div>\n<p><strong>可微性<\/strong>：∂φ/∂y₀ 存在，且作为 x 的函数满足<strong>变分方程<\/strong><\/p>\n<div class=\"eq\">d/dx(∂φ/∂y₀) = f_y(x, φ)·(∂φ/∂y₀)，初值 ∂φ/∂y₀|_{x=x₀} = 1<\/div>\n<p>这条变分方程是稳定性理论与灵敏度分析的原型：它说的就是&quot;初值扰动如何被线性化地放大&quot;。<\/p>\n<h3>3.7 奇解<\/h3>\n<p>奇解是通解族的包络：它在每一点与某条通解曲线相切，本身却不是通解。两种判别式：<\/p>\n<ul><li>\n<strong>p-判别式<\/strong>：从 F(x,y,p)=0 与 ∂F/∂p=0 消去 p，得到曲线；它可能包含奇解，也可能包含不属于解的曲线（须回代检验）。\n<\/li><li>\n<strong>C-判别式<\/strong>：从通解 Φ(x,y,C)=0 与 ∂Φ/∂C=0 消去 C，得到包络候选。\n<\/ul>\n<p>包络是奇解的充分条件之一：若这条曲线确实是解，且在其上每点与族中某曲线相切，则为奇解。<\/p>\n<h3>3.8 数值解<\/h3>\n<p><strong>欧拉法<\/strong>：yₙ₊₁ = yₙ + h·f(xₙ, yₙ)，局部截断误差 O(h²)，整体 O(h)。<\/p>\n<p><strong>四阶龙格-库塔<\/strong>：<\/p>\n<div class=\"eq\">k₁=f(xₙ,yₙ)；k₂=f(xₙ+h/2, yₙ+h k₁/2)；k₃=f(xₙ+h/2, yₙ+h k₂/2)；k₄=f(xₙ+h, yₙ+h k₃)<\/div>\n<div class=\"eq\">yₙ₊₁ = yₙ + h(k₁+2k₂+2k₃+k₄)/6<\/div>\n<p>整体误差 O(h⁴)。数值方法的稳定性与刚性问题是后续课程的内容，本章只需记住&quot;步长越小越准，但太小会放大舍入误差&quot;。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[初值问题] --&gt; B[积分方程形式]\n    B --&gt; C[构造皮卡迭代序列]\n    C --&gt; D[阶乘级数一致收敛]\n    D --&gt; E[存在性得证]\n    B --&gt; F[假设两个解]\n    F --&gt; G[格朗沃尔引理]\n    G --&gt; H[唯一性得证]\n    E --&gt; I[局部解]\n    H --&gt; I\n    I --&gt; J[延拓到饱和解]\n    I --&gt; K[对初值连续可微]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：这张图把&quot;存在&quot;和&quot;唯一&quot;拆成两条互不依赖的证明线。考试里最常见的错误是把这两步混着写，写成一个循环论证。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：皮卡迭代像&quot;逐次描摹&quot;。先画一条水平线当草稿，再把草稿代进方程，得到一条更贴合真实曲线的折线，反复代下去，草稿越来越像真解。<\/p>\n<p><strong>失效边界<\/strong>：如果方程右端坡度过陡（不满足李普希茨），代进去的草稿可能来回震荡而不收敛，例如 y′=√|y|，y(0)=0 有无穷多个解（y≡0 以及在一段区间后接抛物线）。<\/p>\n<p><strong>实例<\/strong>：用皮卡迭代解 y′=y，y(0)=1，在 |x|≤1 上。 φ₀=1，φ₁=1+x，φ₂=1+x+x²/2，…，φₙ=Σxᵏ/k!，极限为 eˣ。误差估计给出 |φₙ−eˣ| ≤ 1·hⁿ⁺¹/(n+1)!·e，取 h=1 时 n=6 已有 1/5040·e ≈ 0.00054 的量级。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为&quot;f 连续就够了&quot;<\/strong>——实际上连续只保证存在，不保证唯一。y′=√|y| 在 y=0 处连续但不满足李普希茨，解不唯一。\n<\/li><li>\n<strong>别以为&quot;李普希茨条件必须在整个平面上成立&quot;<\/strong>——实际上只要在包含初值的某个矩形内成立即可，皮卡定理是局部的。\n<\/li><li>\n<strong>别以为&quot;解一定能在整个区间上延拓&quot;<\/strong>——实际上有限时间爆破很常见，如 y′=y²。\n<\/li><li>\n<strong>别以为&quot;p-判别式给出的曲线就是奇解&quot;<\/strong>——实际上它可能根本不是解，必须代回原方程检验。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n验证 f(x,y)=x·y² 在矩形 |x|≤1，|y|≤1 上关于 y 满足李普希茨条件，给出一个 L。\n<p>（答案：|f(x,y₁)−f(x,y₂)|=|x||y₁+y₂||y₁−y₂|≤2|y₁−y₂|，取 L=2。解析：|x|≤1，|y₁+y₂|≤2。）<\/p>\n<\/ol>\n<ol><li>\n皮卡迭代中，为什么必须先证明每个 φₙ 都落在矩形 R 内？\n<p>（答案：因为 f 只在 R 上有定义且满足李普希茨；如果迭代跑出 R，下一步的 f(t,φₙ(t)) 可能无意义。解析：|φₙ₊₁−y₀|≤M|x−x₀|≤Mh≤b 正是为此。）<\/p>\n<\/ol>\n<ol><li>\n用格朗沃尔引理证明唯一性时，A 取多少？\n<p>（答案：A=0。解析：两个解之差在 x₀ 处为 0，故 D(x₀)=0，不等式变成 D≤∫L·D，格朗沃尔给出 D≤0。）<\/p>\n<\/ol>\n<ol><li>\n方程 y′=3y^(2/3)，y(0)=0 的解唯一吗？\n<p>（答案：不唯一。y≡0 是一个解；y=x³ 也是解（验证：y′=3x²，3y^(2/3)=3x²）。解析：f=3y^(2/3) 在 y=0 处不满足李普希茨，因为 [f(y)−f(0)]/y = 3y^(−1/3) 无界。）<\/p>\n<\/ol>\n<ol><li>\n四阶龙格-库塔每步需要计算几次 f？\n<p>（答案：4 次。解析：k₁ 到 k₄ 各一次；这也解释了它比欧拉法贵但精度高的原因。）<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n存在靠迭代，唯一靠格朗沃尔。两件事分开写。\n<\/li><li>\n李普希茨 = 坡度有上限；∂f/∂y 有界 ⇒ 李普希茨。\n<\/li><li>\np-判别式给候选，回代检验才算数。\n<\/ul>", "ch04": "<h1>第 4 章：高阶线性微分方程<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：9 小时 | <strong>前置<\/strong>：第 2、3 章、线性代数（行列式、线性相关）\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n证明 n 阶齐次线性方程的解集构成 n 维线性空间；\n<\/li><li>\n用朗斯基行列式判断解组的线性相关性，并用刘维尔公式计算它；\n<\/li><li>\n用常数变易法写出非齐次方程的通解公式；\n<\/li><li>\n用特征方程解常系数齐次方程，处理重根与共轭复根；\n<\/li><li>\n用比较系数法处理两类右端：多项式乘指数、指数乘三角；\n<\/li><li>\n已知一个解时降阶，在常点附近用幂级数求解。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>线性方程的全部结构可以压缩成一句话：<strong>齐次方程的解空间是 n 维的，非齐次方程的通解 = 一个特解 + 齐次通解<\/strong>。剩下的一切（朗斯基、常数变易、特征根）都是在具体计算这个 n 维空间和这个特解。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>4.1 解的结构<\/h3>\n<p>n 阶齐次线性方程<\/p>\n<div class=\"eq\">y⁽ⁿ⁾ + a₁(x)y⁽ⁿ⁻¹⁾ + … + aₙ(x)y = 0<\/div>\n<p><strong>性质一（叠加）<\/strong>：若 y₁、y₂ 是解，则 c₁y₁+c₂y₂ 也是解。原因很直接：求导是线性的，代入后每一项都成对抵消。<\/p>\n<p><strong>性质二（n 维）<\/strong>：解集构成 n 维线性空间。证明的关键是：以任意一组初值 (y₀, y₀′, …, y₀⁽ⁿ⁻¹⁾) 出发的解存在且唯一，所以&quot;初值 → 解&quot;是一个从 Rⁿ 到解空间的线性同构。Rⁿ 是 n 维，解空间就是 n 维。<\/p>\n<p>由此得到：<strong>只要找到 n 个线性无关的解，就找到了全部解<\/strong>。<\/p>\n<p><strong>非齐次<\/strong>：y⁽ⁿ⁾+…+aₙy=f(x) 的任意两个解之差是齐次解，所以通解形如<\/p>\n<div class=\"eq\">y = Y(x) + y*(x)<\/div>\n<p>Y 是齐次通解，y* 是任一特解。<\/p>\n<h3>4.2 朗斯基行列式与刘维尔公式<\/h3>\n<p>n 个解组成的<strong>朗斯基行列式<\/strong><\/p>\n<div class=\"eq\">W(x) = det[ y₁ … yₙ ; y₁′ … yₙ′ ; … ; y₁⁽ⁿ⁻¹⁾ … yₙ⁽ⁿ⁻¹⁾ ]<\/div>\n<ul><li>\nW(x₀)≠0 ⇔ 这 n 个解线性无关 ⇔ 它们构成基本解组。\n<\/li><li>\n若在某点 W=0，则这些解线性相关（这一点对线性方程才成立，对非线性方程不成立）。\n<\/ul>\n<p><strong>刘维尔公式<\/strong>：<\/p>\n<div class=\"eq\">W(x) = W(x₀)·exp( −∫[x₀→x] a₁(t) dt )<\/div>\n<p>它说明：W 要么恒不为零，要么恒为零，不会&quot;有时为零有时不为零&quot;。这解释了为什么只需检查一个点。<\/p>\n<h3>4.3 常数变易法<\/h3>\n<p>设 y₁,…,yₙ 是齐次基本解组，令非齐次解为<\/p>\n<div class=\"eq\">y = c₁(x)y₁ + … + cₙ(x)yₙ<\/div>\n<p>要求这些 cᵢ 满足方程组<\/p>\n<div class=\"eq\">Σ cᵢ′(x)·yᵢ⁽ᵏ⁾ = 0 （k=0,…,n−2），Σ cᵢ′(x)·yᵢ⁽ⁿ⁻¹⁾ = f(x)<\/div>\n<p>解这个线性方程组得到 cᵢ′(x)，积分即可。<\/p>\n<p><strong>为什么这样设？<\/strong> 因为把 n 个待定函数塞进一个表达式，多出了 n−1 个自由度，可以人为加 n−1 个约束，让 y 的各阶导数形式上保持&quot;和齐次情形一样&quot;，把所有复杂度挤到最后一阶方程上。这不是技巧，是自由度计数。<\/p>\n<h3>4.4 常系数齐次方程：特征根法<\/h3>\n<p>方程 y⁽ⁿ⁾+a₁y⁽ⁿ⁻¹⁾+…+aₙy=0（aᵢ 为常数），试解 y=e^(rx)，代入得<strong>特征方程<\/strong><\/p>\n<div class=\"eq\">rⁿ + a₁rⁿ⁻¹ + … + aₙ = 0<\/div>\n<p>三种情形：<\/p>\n<ul><li>\n<strong>单实根 r<\/strong>：贡献 e^(rx)。\n<\/li><li>\n<strong>k 重实根 r<\/strong>：贡献 e^(rx), x e^(rx), …, x^(k−1) e^(rx)。\n<\/li><li>\n<strong>共轭复根 α±iβ（k 重）<\/strong>：贡献 e^(αx)cos βx, e^(αx)sin βx，以及各自乘以 x, …, x^(k−1)。\n<\/ul>\n<p><strong>欧拉方程<\/strong> xⁿy⁽ⁿ⁾+…=0 通过 x=e^t（即 t=ln x）化为常系数。<\/p>\n<h3>4.5 非齐次：比较系数法<\/h3>\n<p><strong>类型一<\/strong>：f(x)=P_m(x)e^(λx)，P_m 是 m 次多项式。若 λ 是特征方程的 k 重根（k=0 表示不是根），则特解形如<\/p>\n<div class=\"eq\">y* = xᵏ·Q_m(x)·e^(λx)，Q_m 为待定 m 次多项式<\/div>\n<p><strong>类型二<\/strong>：f(x)=e^(αx)[P_m(x)cos βx + Q_n(x)sin βx]。若 α±iβ 是 k 重特征根，则<\/p>\n<div class=\"eq\">y* = xᵏ·e^(αx)[R_l(x)cos βx + S_l(x)sin βx]，l=max(m,n)<\/div>\n<p>把 y* 代入，比较同类项系数，解线性方程组。<\/p>\n<p><strong>为什么乘 xᵏ？<\/strong> 因为 λ 已经是特征根时，e^(λx) 本身就在齐次解空间里，直接设 Q_m e^(λx) 代入会被齐次算子打成零，必须乘以 x 把它推出零空间。k 重根就乘 xᵏ。<\/p>\n<h3>4.6 降阶与幂级数解法<\/h3>\n<p><strong>降阶<\/strong>：已知齐次方程的一个非零解 y₁，令 y=u·y₁，代入后 u′ 满足一个 n−1 阶方程；对二阶方程，直接得到<\/p>\n<div class=\"eq\">u′ = C·exp(−∫a₁dx)/y₁²<\/div>\n<p><strong>幂级数解法<\/strong>：在常点 x₀ 附近设 y=Σaₖ(x−x₀)ᵏ，代入方程比较系数，得到递推关系。系数行列式保证在收敛半径内可解。典型例子是勒让德方程<\/p>\n<div class=\"eq\">(1−x²)y″ − 2xy′ + n(n+1)y = 0<\/div>\n<p>在 x=0 附近有两个幂级数解，其一在 |x|&lt;1 收敛，另一在 x=±1 发散（这正是&quot;正则奇点&quot;要单独处理的原因）。<\/p>\n<h3>4.7 一个真实应用：第二宇宙速度<\/h3>\n<p>火箭竖直上升，忽略空气阻力，质量随时间按 m(t) 减少。动量守恒给出<\/p>\n<div class=\"eq\">m·dv/dt = −m·g − u·dm/dt<\/div>\n<p>其中 u 是喷气相对速度。积分得齐奥尔科夫斯基公式<\/p>\n<div class=\"eq\">v = u·ln(m₀/m) − g·t<\/div>\n<p>要脱离地球引力，需 v ≥ √(2gR) ≈ 11.2 km/s。这个数不是拍出来的，是从能量守恒 √(2GM/R) 算出来的。教材把它放在高阶方程一章，是因为整个推导过程是一次&quot;建立方程—积分—代入边界条件&quot;的完整训练。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[齐次方程 n 阶] --&gt; B[找 n 个线性无关解]\n    B --&gt; C[朗斯基行列式判定]\n    C --&gt; D[基本解组]\n    D --&gt; E[齐次通解]\n    E --&gt; F[常数变易]\n    F --&gt; G[非齐次通解]\n    A --&gt; H[常系数情形]\n    H --&gt; I[特征方程]\n    I --&gt; J[单根/重根/复根]\n    J --&gt; K[直接写出基本解组]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：左路是通用理论（任何变系数都成立），右路是常系数时的&quot;作弊通道&quot;。两条路在&quot;基本解组&quot;处汇合——一旦拿到基本解组，非齐次部分的做法完全一样。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：朗斯基行列式像&quot;解组的身份证&quot;。n 个解在某一点的值与各阶导数排成矩阵，行列式不为零说明它们在该点&quot;张成&quot;了整个 n 维空间，任何初值都能被它们组合出来。<\/p>\n<p><strong>失效边界<\/strong>：这个判据只对线性齐次方程成立。对非线性方程，W 在某点为零不代表线性相关。<\/p>\n<p><strong>实例<\/strong>：解 y″−3y′+2y = e^(3x)。 特征方程 r²−3r+2=0，根 r=1,2，齐次通解 Y=C₁eˣ+C₂e^(2x)。 右端 e^(3x)，λ=3 不是特征根，设 y*=Ae^(3x)，代入得 (9−9+2)Ae^(3x)=e^(3x)，A=1/2。 通解 y=C₁eˣ+C₂e^(2x)+e^(3x)/2。<\/p>\n<p><strong>验算<\/strong>：把 y<em> 代回，y<\/em>″−3y<em>′+2y<\/em> = 9Ae^(3x)−9Ae^(3x)+2Ae^(3x)=2Ae^(3x)，令其等于 e^(3x) 得 A=1/2。这一步必须自己算一遍，否则容易把系数算成 1/(9−9+2) 以外的东西。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为&quot;W=0 一定线性相关&quot;对任何方程都成立<\/strong>——实际上只对线性齐次方程成立。\n<\/li><li>\n<strong>别以为&quot;特征根都是实数&quot;<\/strong>——实际上复根成对出现，要转成 cos/sin 实形式。\n<\/li><li>\n<strong>别以为&quot;比较系数法设的特解形式可以随便写&quot;<\/strong>——实际上重根时必须乘 xᵏ，否则代进去恒等于零，解不出系数。\n<\/li><li>\n<strong>别以为&quot;幂级数解法在任何点都行&quot;<\/strong>——实际上只在常点附近保证；奇点（如勒让德方程的 x=±1）需要另作处理。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n验证 y₁=eˣ，y₂=e^(2x) 是 y″−3y′+2y=0 的基本解组，并算它们的朗斯基行列式。\n<p>（答案：W=eˣ·2e^(2x)−eˣ·e^(2x)=e^(3x)≠0，故线性无关。解析：也可用刘维尔公式，a₁=−3，W=W(0)e^(3x)。）<\/p>\n<\/ol>\n<ol><li>\n求 y″+4y′+4y=0 的通解。\n<p>（答案：y=(C₁+C₂x)e^(−2x)。解析：特征方程 (r+2)²=0，二重根 −2。）<\/p>\n<\/ol>\n<ol><li>\n求 y″+y = cos x 的一个特解。\n<p>（答案：y<em>=x·sin x/2。解析：±i 是一重特征根，须乘 x；设 y<\/em>=x(Acos x+Bsin x)，代入得 2Bcos x−2A sin x… 计算后 A=0，B=1/2。）<\/p>\n<\/ol>\n<ol><li>\n已知 y₁=x 是 x²y″−2xy′+2y=0 的解，求另一解。\n<p>（答案：y₂=x²。解析：用降阶公式 u′=C·exp(−∫a₁dx)/y₁²，标准形 a₁=−2/x，得 u′=C/x⁰… 具体为 u′=C·x²/x²=C，故 u=Cx，y₂=x·x=x²。）<\/p>\n<\/ol>\n<ol><li>\n刘维尔公式说明朗斯基行列式的什么性质？\n<p>（答案：W(x)=W(x₀)e^(−∫a₁)，指数因子恒不为零，所以 W 要么恒为零，要么处处不为零。解析：这解释了&quot;只需检验一点&quot;的合法性。）<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n齐次解空间 n 维，非齐次 = 特解 + 齐次通解。\n<\/li><li>\n朗斯基不为零 ⇔ 基本解组；刘维尔公式保证&quot;零则恒零&quot;。\n<\/li><li>\n常系数看特征根：单根、重根乘 x、复根转三角。\n<\/li><li>\n右端撞上特征根，特解必须乘 xᵏ。\n<\/ul>", "ch05": "<h1>第 5 章：线性微分方程组<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：9 小时 | <strong>前置<\/strong>：第 4 章、矩阵运算、特征值与若尔当标准形\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n写出方程组 dx/dt=A(t)x+f(t) 的基解矩阵定义，并验证 Φ′=AΦ、det Φ≠0；\n<\/li><li>\n用常数变易公式 x=Φ(t)[C+∫Φ⁻¹f dt] 解非齐次方程组；\n<\/li><li>\n证明常系数情形下 e^(At) 就是标准基解矩阵，并理解它为什么&quot;自动&quot;满足初值；\n<\/li><li>\n会算 e^(At)：可对角化、若尔当块、待定系数三种路线；\n<\/li><li>\n用拉普拉斯变换解常系数线性方程组。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>第 4 章是&quot;一个未知函数 n 阶方程&quot;，本章是&quot;n 个未知函数一阶方程组&quot;，两者是同一件事的两种写法。运输工具从&quot;标量&quot;换成&quot;矩阵&quot;：解从 n 个数变成 n 维向量，朗斯基行列式变成基解矩阵的行列式，特征根变成特征值。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>5.1 一般理论：基解矩阵<\/h3>\n<p>考虑<\/p>\n<div class=\"eq\">dx/dt = A(t)·x + f(t)，x∈Rⁿ<\/div>\n<p><strong>齐次情形<\/strong> dx/dt=A(t)x。解集同样构成 n 维线性空间。取 n 个线性无关的解作为列，排成矩阵 Φ(t)，称<strong>基解矩阵<\/strong>（标准基本解矩阵）。它满足<\/p>\n<div class=\"eq\">Φ′(t) = A(t)·Φ(t)，det Φ(t) ≠ 0<\/div>\n<p>任一齐次解都能写成 x=Φ(t)·C，C 是常向量。<\/p>\n<p><strong>非齐次（常数变易）<\/strong>：设 x=Φ(t)·C(t)，代入得<\/p>\n<div class=\"eq\">Φ·C′ = f，即 C(t) = C₀ + ∫[t₀→t] Φ⁻¹(s)·f(s) ds<\/div>\n<p>于是<\/p>\n<div class=\"eq\">x(t) = Φ(t)·C₀ + Φ(t)·∫[t₀→t] Φ⁻¹(s)f(s)ds<\/div>\n<p>这个公式和第 4 章的常数变易是同一个东西：自由度计数一样，只是把&quot;n 个函数&quot;换成&quot;n 维向量&quot;。<\/p>\n<p><strong>刘维尔公式的矩阵版<\/strong>：det Φ(t) = det Φ(t₀)·exp(∫tr A dt)。迹（trace）在这里接替了 a₁ 的位置。<\/p>\n<blockquote>类比：Φ(t) 像一个&quot;坐标架&quot;，随时间旋转伸缩。解向量 x 是这个架子里固定的坐标 C；非齐次项 f 则在每一刻把坐标架推一下，累积起来就是那个积分。<\/blockquote>\n<h3>5.2 常系数：e^(At)<\/h3>\n<p>A 为常数矩阵时，定义矩阵指数<\/p>\n<div class=\"eq\">e^(At) = I + At + A²t²/2! + … + Aᵏtᵏ/k! + …<\/div>\n<p>它对所有 t 绝对收敛，且<\/p>\n<div class=\"eq\">d/dt e^(At) = A·e^(At)，e^(A·0) = I<\/div>\n<p>所以 Φ(t)=e^(At) 是满足 Φ(0)=I 的标准基解矩阵。初值问题 dx/dt=Ax，x(0)=x₀ 的解直接是 x=e^(At)x₀——<strong>不需要再解常数<\/strong>，这是它比其他基解矩阵好用的地方。<\/p>\n<h3>5.3 三种算法<\/h3>\n<p><strong>(a) 可对角化<\/strong>：A=P·diag(λ₁,…,λₙ)·P⁻¹，则<\/p>\n<div class=\"eq\">e^(At) = P·diag(e^(λ₁t),…,e^(λₙt))·P⁻¹<\/div>\n<p><strong>(b) 若尔当块<\/strong>：对 k 阶块 J=λI+N（N 为幂零），<\/p>\n<div class=\"eq\">e^(Jt) = e^(λt)·[I + Nt + N²t²/2! + … + N^(k−1)t^(k−1)/(k−1)!]<\/div>\n<p>因为 Nᵏ=0，级数在 k 项后自动截断——这正是重根情形下出现 t, t² 因子的原因。<\/p>\n<p><strong>(c) 待定系数<\/strong>：设 x=e^(λt)(a₀+a₁t+…)，代入比较系数。适合手算小矩阵。<\/p>\n<h3>5.4 拉普拉斯变换法<\/h3>\n<p>对 x′=Ax+f 两边取拉普拉斯变换，利用 L[x′]=sX(s)−x(0)：<\/p>\n<div class=\"eq\">(sI − A)·X(s) = x(0) + F(s)<\/div>\n<p>于是 X(s)=(sI−A)⁻¹(x(0)+F(s))，再取逆变换。矩阵 (sI−A)⁻¹ 就是<strong>预解矩阵<\/strong>，它的拉普拉斯逆变换正是 e^(At)。<\/p>\n<p>这个方法的价值在于：它把微分方程变成代数方程，且自动吸收初值条件。工程上的传递函数、极点分析都从这里长出来。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[线性方程组 dx/dt=Ax+f] --&gt; B[齐次 dx/dt=Ax]\n    B --&gt; C[基解矩阵 Phi]\n    C --&gt; D[det Phi 非零]\n    B --&gt; E[常系数 A]\n    E --&gt; F[矩阵指数 e^At]\n    F --&gt; G[可对角化]\n    F --&gt; H[若尔当块]\n    F --&gt; I[待定系数]\n    A --&gt; J[非齐次]\n    J --&gt; K[常数变易积分]\n    A --&gt; L[拉普拉斯变换]\n    L --&gt; M[预解矩阵 sI-A 逆]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：中间那条 F 是本量的核心——所有算法都在算同一个对象 e^(At)，只是走的路线不同。考试里给你一个 3×3 矩阵，先判能不能对角化，不能再用若尔当块。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：e^(At) 是&quot;时间演化算子&quot;。给它一个初始状态，它把状态推到 t 时刻。就像一台洗衣机：放进去脏衣服（初值），按启动（t 增长），出来的是洗好的（解）。<\/p>\n<p><strong>失效边界<\/strong>：这个类比只对线性自治系统成立。非线性系统的演化算子不是线性的，甚至可能不可逆（洛伦茨系统就是不可逆的）。<\/p>\n<p><strong>实例<\/strong>：解 x′=Ax，A=[[0,1],[−1,0]]。 特征值 ±i，可对角化（复域），e^(At) = [[cos t, sin t],[−sin t, cos t]]。 验证：对第一行求导得 (−sin t, cos t) = 第二行，符合 Φ′=AΦ。物理解释是旋转：这个系统的轨线是圆。<\/p>\n<p><strong>实例 2<\/strong>：A=[[2,1],[0,2]]（若尔当块）。 e^(At)=e^(2t)[[1,t],[0,1]]。验算：求导得 e^(2t)[[2,1+2t],[0,2]]，而 A·e^(At)=e^(2t)[[2,1+2t],[0,2]]，一致。注意 t 因子的来源正是 N 的幂零性。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为&quot;基解矩阵就是任意 n 个解排成矩阵&quot;<\/strong>——实际上必须线性无关，即行列式不为零。\n<\/li><li>\n<strong>别以为&quot;e^(At) 可以逐元素取指数&quot;<\/strong>——实际上矩阵指数是级数定义，不是每个元素 e^(aᵢⱼt)。只有对角矩阵才逐元素成立。\n<\/li><li>\n<strong>别以为&quot;特征值重复就一定不能对角化&quot;<\/strong>——实际上要看几何重数是否等于代数重数；不能时才用若尔当块。\n<\/li><li>\n<strong>别以为&quot;拉普拉斯变换只适用于单个方程&quot;<\/strong>——实际上它对向量方程同样有效，只是把 sI−A 当成矩阵求逆。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n若 Φ(t) 是 dx/dt=A(t)x 的基解矩阵，C 是常向量，x=ΦC 是否一定是解？为什么？\n<p>（答案：是。x′=Φ′C=AΦC=Ax。解析：关键是 Φ′=AΦ 与 C 为常向量。）<\/p>\n<\/ol>\n<ol><li>\n求 A=[[1,1],[1,1]] 的 e^(At)。\n<p>（答案：特征值 2,0；e^(At)=½[[e^(2t)+1, e^(2t)−1],[e^(2t)−1, e^(2t)+1]]。解析：A=P diag(2,0) P⁻¹，P=[[1,1],[1,−1]]。）<\/p>\n<\/ol>\n<ol><li>\n为什么若尔当块的指数级数会截断？\n<p>（答案：因为 N 是幂零矩阵，Nᵏ=0，k 阶块中 N 的幂次到 k−1 为止。解析：这解释了 t, t² 因子的次数上限。）<\/p>\n<\/ol>\n<ol><li>\n用拉普拉斯变换解 x′=x，x(0)=2。\n<p>（答案：X(s)=2/(s−1)，逆变换 x=2eᵗ。解析：sX−2=X ⇒ X=2/(s−1)。）<\/p>\n<\/ol>\n<ol><li>\n矩阵版的刘维尔公式里，什么量取代了标量方程中的 a₁？\n<p>（答案：矩阵 A(t) 的迹 tr A。解析：det Φ=det Φ(t₀)·exp(∫tr A dt)。）<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n基解矩阵：Φ′=AΦ 且 det Φ≠0。\n<\/li><li>\ne^(At) 是 Φ(0)=I 的那个，初值问题直接乘。\n<\/li><li>\n重根 → 若尔当块 → 出现 t 的幂。\n<\/li><li>\n非齐次一律 x=Φ[C+∫Φ⁻¹f]。\n<\/ul>", "ch06": "<h1>第 6 章：非线性微分方程——稳定性、相图与混沌<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：12 小时 | <strong>前置<\/strong>：第 1、3、5 章、线性代数、多元微积分\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n用 ε-δ 语言写出李雅普诺夫稳定与渐近稳定的定义，并区分它们；\n<\/li><li>\n用线性化（第一方法）判断双曲平衡点的稳定性，说明特征值实部的角色；\n<\/li><li>\n构造李雅普诺夫函数（第二方法），并说明它为什么不需要解出方程；\n<\/li><li>\n按迹与行列式给平面线性系统的奇点分类：结点、鞍点、焦点、中心；\n<\/li><li>\n说出庞加莱-本迪克松定理的使用条件，判断极限环是否存在；\n<\/li><li>\n写出哈密顿方程，说明能量守恒如何给出首次积分；\n<\/li><li>\n解释&quot;对初值敏感&quot;与混沌，并复述李-约克定理的结论。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>非线性方程绝大多数解不出来，所以这一章换了问题：<strong>不问解是什么，只问解附近稳不稳、轨线往哪走、有没有闭轨<\/strong>。这是从&quot;求解&quot;到&quot;定性&quot;的转向。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>6.1 稳定性的定义<\/h3>\n<p>考虑自治系统 dx/dt=f(x)，f(0)=0（原点为平衡点）。<\/p>\n<p><strong>稳定（李雅普诺夫意义）<\/strong>：对任意 ε&gt;0，存在 δ&gt;0，使 |x(0)|&lt;δ 时，对一切 t≥0 有 |x(t)|&lt;ε。白话：起点足够近，轨线就永远不跑出给定的圈。<\/p>\n<p><strong>渐近稳定<\/strong>：稳定，且存在 δ₀&gt;0，使 |x(0)|&lt;δ₀ 时 x(t)→0。白话：不但不跑远，最后还回到原点。<\/p>\n<p><strong>不稳定<\/strong>：存在某个 ε，无论 δ 多小，总有起点在 δ 内的轨线跑出 ε 圈。<\/p>\n<blockquote>类比：碗底的小球是渐近稳定；碗壁上的小球是稳定但不渐近（它绕圈不落底）；倒扣碗顶的小球是不稳定。<\/blockquote>\n<blockquote>失效边界：这个类比只对保守的力学系统直观；对高维系统，&quot;绕圈&quot;可能根本不是周期轨道。<\/blockquote>\n<h3>6.2 第一方法：线性化<\/h3>\n<p>设 A=∂f/∂x 在原点处的雅可比矩阵。若 A 的所有特征值实部都不为零（双曲平衡点），则：<\/p>\n<ul><li>\n所有特征值实部 &lt; 0 ⇒ 原点渐近稳定；\n<\/li><li>\n存在特征值实部 &gt; 0 ⇒ 原点不稳定；\n<\/li><li>\n有实部为零的特征值 ⇒ 线性化失效，必须用别的方法（这是&quot;临界情形&quot;）。\n<\/ul>\n<p>这是一条硬结论，有定理保证（哈特曼-格罗布曼定理给出拓扑共轭）。它之所以强，是因为只需求导、算特征值，不用解方程。<\/p>\n<h3>6.3 第二方法：李雅普诺夫函数<\/h3>\n<p>找一标量函数 V(x)，在原点邻域内连续可微、V(0)=0、x≠0 时 V(x)&gt;0（正定），沿轨线求全导数<\/p>\n<div class=\"eq\">dV/dt = ∇V · f(x)<\/div>\n<p>判据：<\/p>\n<ul><li>\ndV/dt ≤ 0 ⇒ 稳定；\n<\/li><li>\ndV/dt &lt; 0（除原点外）⇒ 渐近稳定；\n<\/li><li>\ndV/dt &gt; 0 ⇒ 不稳定。\n<\/ul>\n<p><strong>这个方法的妙处<\/strong>：V 像一个&quot;能量&quot;，你不必知道轨线怎么走，只要知道能量单调下降，轨线就必然被&quot;困&quot;在等能量面上。它把&quot;解方程&quot;换成了&quot;找一个函数&quot;。<\/p>\n<p>典型例子：单摆方程 θ″+sin θ=0 化为一阶系统 (θ, ω)，取<\/p>\n<div class=\"eq\">V = ω²/2 + (1 − cos θ)<\/div>\n<p>求导得 dV/dt=ω·(−sin θ)+sin θ·ω=0，恰好守恒。这就是机械能。说明无阻尼单摆是稳定的（但不渐近）。<\/p>\n<h3>6.4 平面系统的奇点分类<\/h3>\n<p>对线性系统 x′=Ax，A 的特征方程为 λ²−(tr A)λ+det A=0。记 p=tr A，q=det A，判别式 Δ=p²−4q。<\/p>\n<table><thead><tr><th>条件<\/th><th>奇点类型<\/th><th>稳定性<\/th><\/tr><\/thead><tbody><tr><td>q&gt;0，Δ&gt;0，p&lt;0<\/td><td>稳定结点<\/td><td>渐近稳定<\/td><\/tr><tr><td>q&gt;0，Δ&gt;0，p&gt;0<\/td><td>不稳定结点<\/td><td>不稳定<\/td><\/tr><tr><td>q&lt;0<\/td><td>鞍点<\/td><td>不稳定<\/td><\/tr><tr><td>q&gt;0，Δ&lt;0，p&lt;0<\/td><td>稳定焦点<\/td><td>渐近稳定<\/td><\/tr><tr><td>q&gt;0，Δ&lt;0，p&gt;0<\/td><td>不稳定焦点<\/td><td>不稳定<\/td><\/tr><tr><td>q&gt;0，p=0<\/td><td>中心<\/td><td>稳定非渐近<\/td><\/tr><tr><td>q=0<\/td><td>高阶奇点<\/td><td>需单独分析<\/td><\/tr><\/tbody><\/table>\n<p>这一步在相平面上画出来，就是结点、鞍点、焦点、中心四种基本图形。<\/p>\n<h3>6.5 极限环与庞加莱-本迪克松定理<\/h3>\n<p><strong>极限环<\/strong>是孤立的闭轨：附近的轨线不是绕着它转（那是中心），而是螺旋靠近或远离它。<\/p>\n<p><strong>庞加莱-本迪克松定理<\/strong>：若平面系统的轨线被限制在一个有界闭区域内，且该区域内无平衡点，则区域内必存在闭轨。判断&quot;被限制&quot;的常用办法是构造一个环形区域，让轨线在内外边界上都指向内部。<\/p>\n<p>这个定理只对平面成立，三维及以上不成立——这是它与高维混沌现象之间的分水岭。<\/p>\n<h3>6.6 哈密顿方程与首次积分<\/h3>\n<p>若存在哈密顿函数 H(p,q)，使<\/p>\n<div class=\"eq\">dp/dt = −∂H/∂q，dq/dt = ∂H/∂p<\/div>\n<p>则 H 沿轨线守恒：dH/dt=0。这叫<strong>首次积分<\/strong>。它把相空间限制在 H 的等值面上，是降维的利器。完全可积系统有 n 个独立的、对合的首次积分（刘维尔-阿诺尔德定理）。<\/p>\n<h3>6.7 混沌<\/h3>\n<p>洛伦茨方程<\/p>\n<div class=\"eq\">dx/dt=σ(y−x)，dy/dt=x(ρ−z)−y，dz/dt=xy−βz<\/div>\n<p>在 σ=10、ρ=28、β=8/3 时出现奇怪吸引子：轨线被吸引到一个零体积的分形集合上，同时对初值极端敏感（两条初始相距 10⁻⁵ 的轨线，几十个时间单位后距离达到 O(1)）。<\/p>\n<p><strong>李-约克定理<\/strong>（&quot;周期三蕴含混沌&quot;）：若一维映射有周期 3 点，则它有任意周期的周期点，且存在不可数集上的轨线行为混乱。这是&quot;混沌&quot;一词进入数学的标志性结果。<\/p>\n<p>需要说清的一点：混沌不是&quot;随机&quot;。它是确定性的——给定初值，轨线唯一；只是长期预测在实践中不可行。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[非线性自治系统] --&gt; B[求平衡点]\n    B --&gt; C[线性化得雅可比 A]\n    C --&gt; D{特征值实部是否为零}\n    D --&gt;|否| E[第一方法定稳定性]\n    D --&gt;|是| F[第二方法 构造 V]\n    F --&gt; G[V 正定 且 V 导数负定]\n    B --&gt; H[平面情形]\n    H --&gt; I[迹与行列式分类]\n    I --&gt; J[结点/鞍点/焦点/中心]\n    H --&gt; K[庞加莱-本迪克松]\n    K --&gt; L[极限环]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：两条主线都从&quot;平衡点&quot;出发——一条判局部稳定性，一条判全局有无闭轨。前者是代数的（算特征值），后者是几何的（找不变区域）。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：李雅普诺夫函数像&quot;下山的水流&quot;。你不需要知道水具体走哪条沟，只要确认每处地势都在降低，水一定流到谷底。<\/p>\n<p><strong>失效边界<\/strong>：V 函数不一定存在；构造它没有通用算法。很多系统需要试很多次，或者干脆只能靠线性化。<\/p>\n<p><strong>实例 1<\/strong>：判 x′=−x+y，y′=−x−y 的稳定性。 A=[[−1,1],[−1,−1]]，tr=−2，det=2，Δ=4−8&lt;0，p&lt;0 ⇒ 稳定焦点。<\/p>\n<p><strong>实例 2<\/strong>：判 x′=y，y′=−x−y³ 的稳定性。 线性化 A=[[0,1],[−1,0]]，特征值 ±i，实部为零，线性化失效。 构造 V=(x²+y²)/2，则 dV/dt=x·y+y·(−x−y³)=−y⁴≤0，且在除 x 轴外为负。属于稳定（非渐近）——因为 y=0 那条线上的点永远不会离开，但也回不到原点。这个例子说明：<strong>线性化失效时，V 函数是唯一出路<\/strong>。<\/p>\n<p><strong>实例 3<\/strong>：洛伦茨系统的一个平衡点 (0,0,0) 的线性化给出特征值约 −22.8、11.8、−1，有正实部，不稳定；另两个平衡点的稳定性随 ρ 变化，ρ&gt;24.74 时全部不稳定，混沌吸引子出现。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为&quot;稳定就是会回到原点&quot;<\/strong>——实际上是渐近稳定才回到原点；稳定只要求不跑远。\n<\/li><li>\n<strong>别以为&quot;线性化总能判稳定&quot;<\/strong>——实际上实部为零时失效，必须用 V 函数或其它方法。\n<\/li><li>\n<strong>别以为&quot;中心是渐近稳定的&quot;<\/strong>——实际上中心只是稳定，轨线绕圈不趋近。\n<\/li><li>\n<strong>别以为&quot;庞加莱-本迪克松定理对三维也成立&quot;<\/strong>——实际上它只对平面系统成立，三维需要别的工具。\n<\/li><li>\n<strong>别以为&quot;混沌就是随机&quot;<\/strong>——实际上是确定性的、对初值敏感的有界非周期运动。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n写出渐近稳定的完整定义。\n<p>（答案：稳定，且存在 δ₀&gt;0，使 |x(0)|&lt;δ₀ 时 lim_{t→∞}x(t)=0。解析：两个条件缺一不可，&quot;回到原点&quot;前面必须先有&quot;不跑远&quot;。）<\/p>\n<\/ol>\n<ol><li>\n系统 x′=−2x，y′=−3y 的奇点类型？\n<p>（答案：稳定结点。解析：特征值 −2、−3 均为负实根，Δ=1&gt;0，p=−5&lt;0。）<\/p>\n<\/ol>\n<ol><li>\n为什么中心不是渐近稳定的？\n<p>（答案：轨线是闭轨，永远绕圈，|x(t)|不趋于 0，只保持常数。解析：稳定性要求&quot;不跑出圈&quot;，渐近性额外要求&quot;收敛到原点&quot;。）<\/p>\n<\/ol>\n<ol><li>\n构造 V=x²+y² 判断 x′=−x³，y′=−y³ 的稳定性。\n<p>（答案：dV/dt=−2x⁴−2y⁴&lt;0（除原点），故渐近稳定。解析：V 正定且导数负定。）<\/p>\n<\/ol>\n<ol><li>\n洛伦茨系统在 ρ=28 时为什么&quot;确定却不可预测&quot;？\n<p>（答案：轨线由初值唯一确定，但对初值呈指数敏感，初始误差随时间放大到 macroscopic 尺度，长期预测在数值上不可行。解析：这正是&quot;确定性混沌&quot;的定义。）<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n稳定不等于渐近稳定；中心只是稳定。\n<\/li><li>\n双曲平衡点交给线性化；非双曲必须靠 V。\n<\/li><li>\n平面奇点用 tr、det、Δ 三件套分类。\n<\/li><li>\n极限环是孤立的闭轨；庞加莱-本迪克松只管平面。\n<\/ul>", "ch07": "<h1>第 7 章：一阶线性偏微分方程<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：7 小时 | <strong>前置<\/strong>：第 1、2、5 章、多元微积分、隐函数定理\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n说出首次积分的定义，并验证一个给定的函数是不是首次积分；\n<\/li><li>\n把对称形式的常微分方程组写成 dx/X=dy/Y=dz/Z，并求它的两个独立首次积分；\n<\/li><li>\n用特征线法解一阶线性齐次与拟线性偏微分方程；\n<\/li><li>\n判断一条初始曲线是不是特征曲线，并据此说明柯西问题何时无解；\n<\/li><li>\n说清李群对称的作用：把方程的解从一个变成一族。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>一阶偏微分方程不是靠&quot;积分&quot;解出来的，而是靠<strong>沿着特征线把偏微分方程降成常微分方程<\/strong>。整章的技术只有一条：找特征线，沿它积分。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>7.1 首次积分<\/h3>\n<p>考虑对称形式的方程组<\/p>\n<div class=\"eq\">dx/X(x,y,z) = dy/Y(x,y,z) = dz/Z(x,y,z)<\/div>\n<p>一个函数 Φ(x,y,z) 若在方程组的每条积分曲线上都取常数值，就称为<strong>首次积分<\/strong>。等价说法：Φ 沿向量场 (X,Y,Z) 的方向导数为零：<\/p>\n<div class=\"eq\">X·Φ_x + Y·Φ_y + Z·Φ_z = 0<\/div>\n<p>一个 n 维一阶方程组有 n−1 个独立的首次积分。求出它们，就等于把解&quot;隐式地&quot;写出来了。<\/p>\n<blockquote>类比：首次积分像地形图上的等高线。三维空间里的流线沿着最陡方向走，等高线则是流线永远不穿过的面。给两个独立的等高线，流线就被夹在它们的交线上。<\/blockquote>\n<h3>7.2 从常微分方程组到偏微分方程<\/h3>\n<p>设 Φ(x,y,z) 是首次积分，把它改写成 u(x,y)=z 的形式，对隐函数求导可得<\/p>\n<div class=\"eq\">X·u_x + Y·u_y = Z<\/div>\n<p>这就是一阶线性（拟线性）偏微分方程。反过来，解这个偏微分方程就是找它的首次积分。<\/p>\n<p><strong>特征线法<\/strong>：把 PDE<\/p>\n<div class=\"eq\">a(x,y,u)·u_x + b(x,y,u)·u_y = c(x,y,u)<\/div>\n<p>对应的特征方程组是<\/p>\n<div class=\"eq\">dx/ds = a，dy/ds = b，du/ds = c<\/div>\n<p>沿特征线，u 的变化被这个常微分方程组完全决定。<\/p>\n<h3>7.3 齐次线性 PDE<\/h3>\n<p>方程<\/p>\n<div class=\"eq\">a(x,y)·u_x + b(x,y)·u_y = 0<\/div>\n<p>的通解是 u=F(Φ(x,y))，其中 Φ 是特征方程 dy/dx=b/a 的首次积分（即一条积分曲线族），F 是任意一元可微函数。<\/p>\n<p><strong>为什么任意函数都行？<\/strong> 因为在每条特征线上 u 是常数，而不同特征线上的常数可以不同——这个&quot;不同&quot;就是一个只依赖特征线标号的函数。这就是通解里出现任意函数的来源。<\/p>\n<h3>7.4 拟线性与柯西问题<\/h3>\n<p>拟线性方程里 a、b、c 都依赖 u，特征线本身要解出来才知道。给定初始曲线 Γ：x=x₀(τ)，y=y₀(τ)，u=u₀(τ)，过 Γ 上每一点作一条特征线，这些特征线扫出一张曲面，就是解。<\/p>\n<p><strong>非特征条件<\/strong>：若 Γ 与特征线相切，即<\/p>\n<div class=\"eq\">a·dy₀/dτ − b·dx₀/dτ = 0<\/div>\n<p>则在 Γ 上无法确定 u 的法向导数，柯西问题或者无解，或者有无穷多解。这个条件就是隐函数定理里雅可比行列式为零的几何翻译。<\/p>\n<h3>7.5 李群与对称<\/h3>\n<p>单参数变换群 x→x+εξ(x,u)，u→u+εη(x,u) 若把方程的解仍映成解，就叫方程的对称。它的无穷小生成元<\/p>\n<div class=\"eq\">V = ξ·∂/∂x + η·∂/∂u<\/div>\n<p>满足线性化条件（ prolongation 公式）。求出对称之后，可以令 u 只依赖某个不变量，把 PDE 降阶——这就是&quot;相似解&quot;的来源。<\/p>\n<p>对零基础读者，这一节只需建立两个认识：<strong>对称是方程的结构性质，不是解的性质<\/strong>；<strong>有一个对称就能把解降一维<\/strong>。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[一阶 PDE] --&gt; B{是否齐次线性}\n    B --&gt;|是| C[特征方程 dy/dx = b/a]\n    C --&gt; D[求首次积分 Phi]\n    D --&gt; E[通解 u = F of Phi]\n    B --&gt;|否| F[拟线性 特征方程组]\n    F --&gt; G[过初始曲线作特征线]\n    G --&gt; H[特征线扫出解曲面]\n    H --&gt; I{初始曲线是否与特征线相切}\n    I --&gt;|是| J[柯西问题失效]\n    I --&gt;|否| K[局部唯一解]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：判定&quot;是否齐次&quot;决定你走&quot;求一个首次积分&quot;还是&quot;解三个常微分方程&quot;。右下角那个分支是本量最容易忽略的地方：初始曲线与特征线相切时，问题根本没解。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：特征线像织布的经线。PDE 规定了&quot;沿经线怎么变&quot;，你只要把每根经线单独织好，整块布就出来了。初始曲线相当于起针的那一行——如果起针行恰好和经线重合，就织不出布。<\/p>\n<p><strong>实例<\/strong>：解 u_x + u_y = 1，u(x,0)=x。 特征方程 ds 参数化：dx/ds=1，dy/ds=1，du/ds=1。得 x=s+x₀，y=s，u=s+u₀。 从初始曲线 y=0 出发：x₀=τ，y₀=0，u₀=τ。 于是 x=s+τ，y=s，u=s+τ。消去 s、τ：u=x。验证：u_x=1，u_y=0，和为 1；边界上 u(x,0)=x。成立。<\/p>\n<p><strong>实例 2（失效的例子）<\/strong>：解 u_x + u_y = 0，初始曲线取 x=y=τ，u=τ。 特征线方向 (1,1) 与初始曲线方向 (1,1) 相同 ⇒ 相切 ⇒ 非特征条件不成立。这个柯西问题无解：因为沿特征线 u 必须为常数，而初始条件要求 u 在特征线上变化。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为&quot;首次积分就是一个解&quot;<\/strong>——实际上首次积分是沿轨线取常数的函数，它本身不一定是解。\n<\/li><li>\n<strong>别以为&quot;通解里的任意函数可以随便定&quot;<\/strong>——实际上它由初始条件通过特征线反演确定，且需要非特征条件保证可解。\n<\/li><li>\n<strong>别以为&quot;柯西问题总有解&quot;<\/strong>——实际上初始曲线与特征线相切时会失效。\n<\/li><li>\n<strong>别以为&quot;李群对称只是理论装饰&quot;<\/strong>——实际上它是求相似解、降阶的正规手段。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n验证 Φ=x²+y²+z² 是否为 dx/x=dy/y=dz/z 的首次积分。\n<p>（答案：不是。方向导数 x·2x+y·2y+z·2z=2(x²+y²+z²)≠0。解析：正确的首次积分是 y/x 与 z/x，因为沿 (x,y,z) 方向它们不变。）<\/p>\n<\/ol>\n<ol><li>\n求 dy/dx = y/x 的首次积分。\n<p>（答案：Φ=y/x。解析：d(y/x)/dx=(x y′−y)/x²=(xy/x−y)/x²=0。）<\/p>\n<\/ol>\n<ol><li>\n齐次线性 PDE a u_x + b u_y = 0 的通解形式？\n<p>（答案：u=F(Φ)，Φ 是 dy/dx=b/a 的首次积分，F 任意可微。解析：每条特征线上 u 为常数。）<\/p>\n<\/ol>\n<ol><li>\n柯西问题 u_x+2u_y=0，初始曲线 y=2x，u=x 是否有唯一解？\n<p>（答案：没有。特征方向 (1,2) 与初始曲线方向 (1,2) 平行，相切。解析：非特征条件 a·dy₀/dτ−b·dx₀/dτ=0。）<\/p>\n<\/ol>\n<ol><li>\n一个对称能把 PDE 降几维？\n<p>（答案：降一维，即把 n 元方程化为依赖 n−1 个不变量的方程。解析：找不变量是李群方法的标准第一步。）<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n首次积分 = 沿特征方向不变的函数；n 维方程组有 n−1 个。\n<\/li><li>\n齐次 PDE 通解 = 任意函数作用在首次积分上。\n<\/li><li>\n初始曲线与特征线相切 ⇒ 柯西问题失效。\n<\/ul>", "ch08": "<h1>第 8 章：边值问题<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：8 小时 | <strong>前置<\/strong>：第 4、5 章、线性代数（正交性、本征值）、数学物理方程初步\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n写出二阶线性边值问题的标准形式与三类边界条件；\n<\/li><li>\n用弗雷德霍姆二择一定理判断边值问题解的存在唯一性；\n<\/li><li>\n构造格林函数，并用它把非齐次边值问题写成积分形式；\n<\/li><li>\n证明斯特姆-刘维尔问题的特征值都是实数、特征函数互相正交；\n<\/li><li>\n说清&quot;特征值存在&quot;与&quot;边值问题可解性&quot;之间的关系。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>初值问题问&quot;给定起点，轨迹唯一吗&quot;；边值问题问&quot;两端都钉死，中间那条曲线存在吗&quot;。答案是：<strong>存在性取决于对应的齐次问题是否只有零解<\/strong>。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>8.1 边值问题的形式<\/h3>\n<p>二阶线性方程<\/p>\n<div class=\"eq\">y″ + p(x)·y′ + q(x)·y = f(x)，a ≤ x ≤ b<\/div>\n<p>三类边界条件：<\/p>\n<ul><li>\n<strong>第一类（狄利克雷）<\/strong>：y(a)=α，y(b)=β；\n<\/li><li>\n<strong>第二类（诺伊曼）<\/strong>：y′(a)=α，y′(b)=β；\n<\/li><li>\n<strong>第三类（罗宾）<\/strong>：y′(a)−k₁y(a)=α，y′(b)+k₂y(b)=β。\n<\/ul>\n<p>与初值问题最大的不同：初值问题的两个条件都给在同一点，边值问题给在两端。这直接导致解可能不存在，也可能不唯一。<\/p>\n<h3>8.2 弗雷德霍姆二择一<\/h3>\n<p>考虑边值问题 L[y]=f，B₁[y]=α，B₂[y]=β。对应的齐次问题 L[y]=0，B₁[y]=0，B₂[y]=0。<\/p>\n<p><strong>二择一定理<\/strong>：<\/p>\n<ul><li>\n若齐次问题只有零解，则非齐次问题对任意 f、α、β 都有唯一解；\n<\/li><li>\n若齐次问题有非零解，则非齐次问题要么无解，要么有无穷多解（取决于 f 与齐次解的正交性）。\n<\/ul>\n<p><strong>为什么会这样？<\/strong> 因为边值问题可以写成一个线性算子方程，而线性算子要么可逆（对应唯一解），要么有非零核（对应不唯一）。有限维里这是&quot;行列式是否为零&quot;，无限维里换成&quot;齐次问题是否有非零解&quot;。这也是二择一名字的由来。<\/p>\n<blockquote>类比：这就像解线性方程组 Ax=b。A 可逆时任意 b 都有唯一解；A 奇异时要么无解，要么无穷多解。边值问题只是把矩阵换成了微分算子。<\/blockquote>\n<blockquote>失效边界：类比在&quot;正交性条件&quot;处需要补充——奇异时不是随便什么 b 都行，必须满足与零空间正交（这就是可解性条件）。<\/blockquote>\n<h3>8.3 格林函数<\/h3>\n<p>把非齐次边值问题的解写成<\/p>\n<div class=\"eq\">y(x) = ∫[a→b] G(x, ξ)·f(ξ) dξ + 边界项<\/div>\n<p>G 叫<strong>格林函数<\/strong>。它的构造分三步：<\/p>\n<ol><li>\n在 ξ 两侧分别解齐次方程，取满足左端条件的解 y₁（x&lt;ξ）与满足右端条件的解 y₂（x&gt;ξ）；\n<\/li><li>\n在 x=ξ 处令 G 连续，但导数跳变：\n<\/ol>\n<div class=\"eq\">∂G/∂x|_{ξ+} − ∂G/∂x|_{ξ−} = −1/p(ξ)<\/div>\n<ol><li>\n归一化使 G 满足边界条件。\n<\/ol>\n<p>物理意义：G(x,ξ) 是&quot;在 ξ 处放一个单位点源，在 x 处产生的响应&quot;。这就是脉冲响应、点源电势的数学原型。<\/p>\n<h3>8.4 斯特姆-刘维尔特征值问题<\/h3>\n<p>自伴形式<\/p>\n<div class=\"eq\">(p(x)·y′)′ + [λ·ρ(x) − q(x)]·y = 0<\/div>\n<p>配以正则边界条件，构成斯特姆-刘维尔问题。核心结论：<\/p>\n<ul><li>\n特征值 λ 全是实数，可数，且趋于无穷；\n<\/li><li>\n不同特征值对应的特征函数在权 ρ 下正交：\n<\/ul>\n<div class=\"eq\">∫ ρ(x)·yₘ(x)·yₙ(x) dx = 0 （m≠n）<\/div>\n<ul><li>\n特征函数系在 L²(ρ) 中完备，可以展开任意平方可积函数。\n<\/ul>\n<p>这三条正是傅里叶展开、勒让德展开、贝塞尔展开的统一来源。教材把它们放在最后一章，是因为前面所有工具（线性方程、自伴、正交）在这里合流。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[边值问题] --&gt; B[齐次问题]\n    B --&gt; C{是否只有零解}\n    C --&gt;|是| D[非齐次问题唯一解]\n    C --&gt;|否| E[无解或无穷多解]\n    D --&gt; F[构造格林函数]\n    F --&gt; G[解写成积分形式]\n    A --&gt; H[自伴形式]\n    H --&gt; I[斯特姆-刘维尔问题]\n    I --&gt; J[特征值实数可数]\n    I --&gt; K[特征函数正交]\n    K --&gt; L[按特征函数展开]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：左支是&quot;解存不存在&quot;，右支是&quot;解怎么展开&quot;。两支柱在格林函数处会合——格林函数本身就可以用特征函数展开，这是后续课程里谱理论的起点。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：格林函数像&quot;回声&quot;。你在山谷某处喊一声（点源），别处听到的声音（响应）就由地形（方程与边界）决定。整个山谷的地形确定后，回声函数就确定了。<\/p>\n<p><strong>失效边界<\/strong>：如果齐次问题有非零解（比如共振频率），某些&quot;喊声&quot;会得到无穷大的回声——这就是共振，对应格林函数不存在。<\/p>\n<p><strong>实例<\/strong>：解 y″=f(x)，y(0)=0，y(1)=0。 齐次问题 y″=0，y(0)=y(1)=0 只有零解（因为直线两端为零必为零），故唯一解存在。 构造 G：左段 y₁=x 满足左端条件；右段 y₂=x−1 满足右端条件（y₂(1)=0）。 连续性要求 G₁(ξ)=G₂(ξ)，导数跳跃要求 y₂′(ξ)−y₁′(ξ)=1−1=0，但实际需要 −1/p(ξ)=−1，所以右段要乘以常数调整。规范做法得到<\/p>\n<div class=\"eq\">G(x,ξ) = x(ξ−1) 当 x≤ξ；G(x,ξ) = ξ(x−1) 当 x≥ξ<\/div>\n<p>验证：两段在 x=ξ 处都等于 ξ(ξ−1)，连续；导数左为 ξ−1，右为 ξ，差为 1，而需要的是 −1/p=−1，符号由分段方向约定决定，教材中通过定义 G 的导数跳跃方向统一。最终解 y=∫G f dξ，代回可验。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为&quot;边值问题总有解&quot;<\/strong>——实际上齐次问题有非零解时可能无解，典型例子是 y″+y=0，y(0)=0，y(π)=0 有无穷多解。\n<\/li><li>\n<strong>别以为&quot;格林函数一定存在&quot;<\/strong>——实际上它存在的前提正是齐次问题只有零解。\n<\/li><li>\n<strong>别以为&quot;特征值可以是复数&quot;<\/strong>——实际上自伴问题的特征值全为实数，这是自伴性的直接推论。\n<\/li><li>\n<strong>别以为&quot;正交性是可选的技巧&quot;<\/strong>——实际上它是展开定理的基础，没有正交性就无法确定展开系数。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n判断 y″+π²y=0，y(0)=0，y(1)=0 的解是否唯一。\n<p>（答案：不唯一。y=sin(πx) 满足齐次方程和两端为零，故齐次问题有非零解。解析：特征值 π² 恰好对应特征函数 sin πx。）<\/p>\n<\/ol>\n<ol><li>\n格林函数的导数在 x=ξ 处满足什么条件？\n<p>（答案：跳跃量为 −1/p(ξ)。解析：这是把点源&quot;夹&quot;进方程后积分得到的。）<\/p>\n<\/ol>\n<ol><li>\n斯特姆-刘维尔问题的特征值为什么是实数？\n<p>（答案：因为算子是自伴的，用分部积分把 L 转置回自身，特征值满足 λ∫ρ|y|²=λ̄∫ρ|y|²，故 λ=λ̄。解析：权 ρ&gt;0 保证积分不为零。）<\/p>\n<\/ol>\n<ol><li>\n二择一定理中，&quot;另一种选择&quot;具体指什么？\n<p>（答案：齐次问题有非零解时，非齐次问题要么无解，要么无穷多解；有解的条件是 f 与齐次解正交。解析：这就是可解性条件。）<\/p>\n<\/ol>\n<ol><li>\n为什么说特征函数系可以展开任意函数？\n<p>（答案：因为它在带权 L² 空间中完备且正交，构成一组基。解析：完备性是斯特姆-刘维尔理论的深层结论。）<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n边值问题的存在性看齐次问题有没有非零解。\n<\/li><li>\n格林函数 = 点源响应；导数跳跃 −1/p。\n<\/li><li>\n自伴 ⇒ 特征值实、特征函数正交、可展开。\n<\/ul>", "c01": "<h1>通解与初值问题<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：第 1、3、4 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>通解是带 n 个独立任意常数的解族；初值问题是在解族里挑出唯一那条曲线的操作。<\/p>\n<h2>为什么重要<\/h2>\n<p>它是整门课的&quot;记账单位&quot;：所有定理要么在说&quot;解族有多大&quot;，要么在说&quot;给定初值还剩几个解&quot;。皮卡定理回答的是后者。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n    A[方程] --&gt; B[解族 含 n 个常数]\n    B --&gt; C[初值条件]\n    C --&gt; D[唯一特解]\n    B --&gt; E[可能漏掉的奇解]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>以 y′=2xy 为例，通解 y=ce^(x²)。c 取不同值，得到一族互不相交的曲线，铺满整个平面。给 y(0)=3，c=3，曲线被钉死。<\/p>\n<p>&quot;独立&quot;不是&quot;个数够&quot;就行。若写成 c₁+c₂ 的形式，两个常数其实只有一个自由度。判定标准是雅可比行列式不为零。<\/p>\n<p>n 阶方程配 n 个初值条件，这是一一对应的：每积一次分产生一个常数，每给一个初值消耗一个。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为通解覆盖所有解——奇解不在族里。\n<\/li><li>\n别以为初值条件可以随便给在任意点——皮卡定理要求初值点落在 f 的定义域内部。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 1 章<\/td><td>定义通解/特解<\/td><td>含 n 个独立常数<\/td><\/tr><tr><td>第 3 章<\/td><td>存在唯一性<\/td><td>初值确定唯一解<\/td><\/tr><tr><td>第 4 章<\/td><td>线性方程解空间<\/td><td>n 维，通解=基本解组线性组合<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：导数、积分\n<\/li><li>\n后续：皮卡迭代、基本解组\n<\/ul>", "c02": "<h1>积分因子<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 2、4 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>积分因子是一个乘数 μ(x,y)，乘到 M dx+N dy=0 上，把它从&quot;不恰当&quot;变成&quot;恰当&quot;。<\/p>\n<h2>为什么重要<\/h2>\n<p>它是初等解法里唯一的&quot;通用补丁&quot;：分离变量、齐次型都失败时，找 μ 往往还能救。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n    A[M dx + N dy = 0] --&gt; B{My = Nx}\n    B --&gt;|是| C[恰当 直接求 u]\n    B --&gt;|否| D[算两个商式]\n    D --&gt; E[商式只含 x 则 mu 只含 x]\n    D --&gt; F[商式只含 y 则 mu 只含 y]\n    E --&gt; G[乘 mu 后变恰当]\n    F --&gt; G<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>判据推导：要求 ∂(μM)/∂y=∂(μN)/∂x，展开得<\/p>\n<p>μ(∂M/∂y−∂N/∂x) + M·∂μ/∂y − N·∂μ/∂x = 0<\/p>\n<p>这是一个关于 μ 的一阶偏微分方程，一般很难解。所以教材只处理两种退化的情形：假设 μ 只依赖 x，或只依赖 y，此时方程退化成一个常微分方程。<\/p>\n<p>若 μ=μ(x)：∂μ/∂y=0，条件变成 μ·(My−Nx) = −N·μ′(x)，即 μ′/μ=(My−Nx)/N。只有这个商式不含 y 时才能积分。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为积分因子唯一——无穷多个。\n<\/li><li>\n别以为没有只依赖一个变量的 μ 就无解——可能存在依赖 x+y 或 xy 的 μ，需要另设形式。\n<\/li><li>\n别以为乘 μ 不会丢解——μ=0 的地方要单独检查。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 2 章<\/td><td>恰当方程补救<\/td><td>两个商式判据<\/td><\/tr><tr><td>第 4 章<\/td><td>一阶线性方程<\/td><td>e^(∫P dx) 就是一个积分因子<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：全微分、偏导数\n<\/li><li>\n后续：恰当方程、首次积分\n<\/ul>", "c03": "<h1>皮卡迭代与格朗沃尔引理<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：第 3 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>皮卡迭代是用积分方程反复代换逼近解；格朗沃尔引理是把&quot;差被积分控制&quot;变成&quot;差恒为零&quot;的工具。<\/p>\n<h2>为什么重要<\/h2>\n<p>它们是存在唯一性定理的两个引擎：前者造解，后者保证只造出一个。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[初值问题] --&gt; B[积分方程 y = y0 + 积分 f]\n    B --&gt; C[phi0 = y0]\n    C --&gt; D[phi n+1 = y0 + 积分 f of phi n]\n    D --&gt; E[阶乘级数控制误差]\n    E --&gt; F[一致收敛 存在]\n    B --&gt; G[假设两个解]\n    G --&gt; H[D 小于等于 积分 L D]\n    H --&gt; I[格朗沃尔 得 D 恒零]\n    I --&gt; J[唯一]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>迭代为什么收敛？关键是相邻两项之差被 M Lⁿ hⁿ⁺¹/(n+1)! 控制。这个阶乘因子来自逐次积分，每次积分都多一层积分号，也就多一个长度因子，除以新的阶乘。<\/p>\n<p>格朗沃尔引理的标准形式：D(x) ≤ A + ∫B D，则 D(x) ≤ A e^(B|x−x₀|)。证明技巧是把不等式两边乘以积分因子 e^(−B(x−x₀))，凑成一个导数为负的单调函数。<\/p>\n<p>唯一性里 A=0，于是 D≤0。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为&quot;两个解相减就唯一了&quot;——微分方程相减得到的是齐次方程，它的解可以不为零。必须用格朗沃尔把积分界压成零。\n<\/li><li>\n别以为皮卡迭代只在理论上用——数值上的&quot;预测-校正&quot;格式也是同一思路。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 3 章<\/td><td>存在唯一性<\/td><td>h=min(a,b/M)<\/td><\/tr><tr><td>第 3 章<\/td><td>误差估计<\/td><td>M Lⁿ hⁿ⁺¹/(n+1)! e^(Lh)<\/td><\/tr><tr><td>第 6 章<\/td><td>稳定性<\/td><td>初值敏感度的指数放大因子<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：一致收敛、柯西序列\n<\/li><li>\n后续：解的延拓、对初值可微性\n<\/ul>", "c04": "<h1>朗斯基行列式<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 4、5 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>n 个解及其各阶导数排成的行列式，用来判断这组解是否线性无关。<\/p>\n<h2>为什么重要<\/h2>\n<p>线性方程的解空间是 n 维的，但你怎么知道手里的 n 个解&quot;够用&quot;？朗斯基行列式就是那把尺子。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n    A[n 个解] --&gt; B[排成 n 行 n 列]\n    B --&gt; C{W 在某点是否为 0}\n    C --&gt;|不为 0| D[线性无关 基本解组]\n    C --&gt;|等于 0| E[线性相关]\n    D --&gt; F[通解 = 线性组合]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>为什么只查一点就够？因为刘维尔公式<\/p>\n<p>W(x) = W(x₀)·exp(−∫a₁ dt)<\/p>\n<p>指数因子永远不为零，所以 W 的符号性质不变：要么处处为零，要么处处不为零。<\/p>\n<p>一个常见错误是把这条性质套到非线性方程上。非线性方程的解可以&quot;有时 W 为零有时不为零&quot;，判据失效。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 W=0 一定线性相关——这句话对非线性方程不成立。\n<\/li><li>\n别以为 W 需要算所有点——算一点即可，因为刘维尔公式。\n<\/li><li>\n别以为 W≠0 是&quot;解唯一&quot;的条件——它保证的是&quot;这组解构成基&quot;，唯一性来自初值定理。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 4 章<\/td><td>高阶线性方程<\/td><td>基本解组判据<\/td><\/tr><tr><td>第 5 章<\/td><td>方程组<\/td><td>det Φ(t) 是矩阵版<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：行列式、线性相关\n<\/li><li>\n后续：基本解组、常数变易法\n<\/ul>", "c05": "<h1>基解矩阵与矩阵指数<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 5 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>基解矩阵是把 n 个线性无关解按列排成的矩阵 Φ(t)，满足 Φ′=AΦ 且 det Φ≠0；矩阵指数 e^(At) 是其中满足 Φ(0)=I 的那一个。<\/p>\n<h2>为什么重要<\/h2>\n<p>它把&quot;解方程组&quot;变成&quot;算一个矩阵函数&quot;，并且让初值问题一步到位：x(t)=e^(At)x(0)。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[A 常数矩阵] --&gt; B[级数定义 e to At]\n    B --&gt; C{能否对角化}\n    C --&gt;|能| D[P diag e lambda t P 逆]\n    C --&gt;|不能| E[若尔当块 出现 t 的幂]\n    B --&gt; F[拉普拉斯变换 预解矩阵]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>e^(At) 的定义就是把标量指数级数里的 t 换成矩阵 At。收敛性靠 ||Aᵏ||/k! 的收敛性。<\/p>\n<p>若 A=PJP⁻¹，则 e^(At)=P e^(Jt) P⁻¹。若尔当块 J=λI+N，e^(Jt)=e^(λt)(I+Nt+…+N^(k−1)t^(k−1)/(k−1)!)，因为 N 幂零，级数截断。<\/p>\n<p>工程上更常用拉普拉斯变换：X(s)=(sI−A)⁻¹x(0)，逆变换即得解。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 e^(At) 可以逐元素取指数，只有对角情形才对。\n<\/li><li>\n别以为特征值重复就不能对角化，要看几何重数。\n<\/li><li>\n别以为 e^(At) 总是有界，特征值实部为正时会指数增长。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 5 章<\/td><td>常系数方程组<\/td><td>Φ(0)=I 的基解矩阵<\/td><\/tr><tr><td>第 6 章<\/td><td>线性化<\/td><td>特征值实部决定稳定性<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：矩阵、特征值、若尔当标准形\n<\/li><li>\n后续：稳定性、传递函数\n<\/ul>", "c06": "<h1>李雅普诺夫稳定性<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：第 6 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>稳定：起点足够近，轨线就永远不跑出给定的圈。渐近稳定：稳定且最终回到平衡点。<\/p>\n<h2>为什么重要<\/h2>\n<p>它是&quot;解不出来也能判断行为&quot;的核心工具，也是控制理论的入口。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[平衡点] --&gt; B{线性化特征值实部}\n    B --&gt;|全负| C[渐近稳定]\n    B --&gt;|有正| D[不稳定]\n    B --&gt;|有零| E[临界情形 线性化失效]\n    E --&gt; F[构造 V 函数]\n    F --&gt; G[V 正定且导数负定 则渐近稳定]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>两种方法的分工：第一方法是&quot;算&quot;，第二方法是&quot;找&quot;。算得快，但只在双曲情形有效；找得慢，但覆盖临界情形。<\/p>\n<p>V 函数没有通用构造法，常见套路：二次型 xᵀPx（解李雅普诺夫方程 AᵀP+PA=−Q）、能量函数（力学系统）、平方和形式。<\/p>\n<p>第二方法的严格陈述需要 V 正定、连续可微、导数沿轨线负定（或负半定加不变集条件，即拉萨尔不变原理）。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为稳定就是回到原点——那是渐近稳定。\n<\/li><li>\n别以为线性化可以判一切——实部为零时失效。\n<\/li><li>\n别以为 V 必须唯一——可以构造无穷多个，找到一个是本事。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 6 章<\/td><td>稳定性定义<\/td><td>ε-δ 语言<\/td><\/tr><tr><td>第 6 章<\/td><td>第一方法<\/td><td>双曲情形成立<\/td><\/tr><tr><td>第 6 章<\/td><td>第二方法<\/td><td>V 函数判据<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：特征值、正定矩阵\n<\/li><li>\n后续：极限环、分支、控制稳定性\n<\/ul>", "__path__": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：基本概念与模型<\/strong><br>阅读：<a href=\"#/chapter/ch01\">第 1 章：绪论<\/a><br>检查点：做完 ch01 自测 4 题<\/li><li class='path-step' id='path-02'><strong>步骤 02：一阶初等解法<\/strong><br>阅读：<a href=\"#/chapter/ch02\">第 2 章：一阶方程的初等解法<\/a><br>检查点：四类方程各解一题<\/li><li class='path-step' id='path-03'><strong>步骤 03：存在唯一性<\/strong><br>阅读：<a href=\"#/chapter/ch03\">第 3 章：解的存在唯一性<\/a><br>检查点：能独立写出皮卡证明骨架<\/li><li class='path-step' id='path-04'><strong>步骤 04：高阶线性方程<\/strong><br>阅读：<a href=\"#/chapter/ch04\">第 4 章：高阶线性微分方程<\/a><br>检查点：特征根三种情形全对<\/li><li class='path-step' id='path-05'><strong>步骤 05：线性方程组<\/strong><br>阅读：<a href=\"#/chapter/ch05\">第 5 章：线性微分方程组<\/a><br>检查点：手算一个 3×3 的 e^(At)<\/li><li class='path-step' id='path-06'><strong>步骤 06：非线性与稳定性<\/strong><br>阅读：<a href=\"#/chapter/ch06\">第 6 章：非线性与稳定性<\/a><br>检查点：能按迹与行列式分类奇点<\/li><li class='path-step' id='path-07'><strong>步骤 07：一阶线性 PDE<\/strong><br>阅读：<a href=\"#/chapter/ch07\">第 7 章：一阶线性偏微分方程<\/a><br>检查点：用特征线法解一个柯西问题<\/li><li class='path-step' id='path-08'><strong>步骤 08：边值问题<\/strong><br>阅读：<a href=\"#/chapter/ch08\">第 8 章：边值问题<\/a><br>检查点：构造一个格林函数<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "__quiz_all__": "<p>（无综合题）<\/p>", "__quiz_ch01__": "<h1>测验：第 1 章：绪论<\/h1><div class='quiz-item' data-qid='q01' data-type='single'><p class='quiz-q'><b>Q1.<\/b> y·y″+(y′)²=0 的阶数与线性性是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q01' value='0'> 二阶，线性<\/label><label class='quiz-opt'><input type='radio' name='q01' value='1'> 二阶，非线性<\/label><label class='quiz-opt'><input type='radio' name='q01' value='2'> 一阶，非线性<\/label><label class='quiz-opt'><input type='radio' name='q01' value='3'> 三阶，非线性<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q02' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 一阶方程 y′=f(x,y) 的等斜线 f(x,y)=0 处，积分曲线的切线是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q02' value='0'> 竖直的<\/label><label class='quiz-opt'><input type='radio' name='q02' value='1'> 水平的<\/label><label class='quiz-opt'><input type='radio' name='q02' value='2'> 斜率为 1<\/label><label class='quiz-opt'><input type='radio' name='q02' value='3'> 不存在<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q03' data-type='single'><p class='quiz-q'><b>Q3.<\/b> n 阶方程通解中 n 个常数强调“独立”，判据是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q03' value='0'> 常数互不相等<\/label><label class='quiz-opt'><input type='radio' name='q03' value='1'> 对常数的雅可比行列式不为零<\/label><label class='quiz-opt'><input type='radio' name='q03' value='2'> 常数可以取任意值<\/label><label class='quiz-opt'><input type='radio' name='q03' value='3'> 常数个数等于阶数<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch02__": "<h1>测验：第 2 章：一阶方程的初等解法<\/h1><div class='quiz-item' data-qid='q04' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 解 dy/dx=y² 时，除通解 y=−1/(x+C) 外还必须单独记录的解是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q04' value='0'> y=1<\/label><label class='quiz-opt'><input type='radio' name='q04' value='1'> y=0<\/label><label class='quiz-opt'><input type='radio' name='q04' value='2'> y=x<\/label><label class='quiz-opt'><input type='radio' name='q04' value='3'> 没有额外解<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q05' data-type='single'><p class='quiz-q'><b>Q2.<\/b> (2xy+y²)dx+(x²+2xy)dy=0 是恰当方程，其解为？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q05' value='0'> x²y+xy²=C<\/label><label class='quiz-opt'><input type='radio' name='q05' value='1'> x²+y²=C<\/label><label class='quiz-opt'><input type='radio' name='q05' value='2'> xy=C<\/label><label class='quiz-opt'><input type='radio' name='q05' value='3'> x²y²=C<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q06' data-type='single'><p class='quiz-q'><b>Q3.<\/b> 一阶线性方程 y′+P(x)y=Q(x) 的通解公式是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q06' value='0'> y=Ce^(−∫P)<\/label><label class='quiz-opt'><input type='radio' name='q06' value='1'> y=e^(−∫P)[∫Qe^(∫P)dx+C]<\/label><label class='quiz-opt'><input type='radio' name='q06' value='2'> y=e^(∫P)[∫Qe^(−∫P)dx+C]<\/label><label class='quiz-opt'><input type='radio' name='q06' value='3'> y=∫Qdx+C<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch03__": "<h1>测验：第 3 章：解的存在唯一性<\/h1><div class='quiz-item' data-qid='q07' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 皮卡定理中 h=min(a,b/M) 的 M 指？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q07' value='0'> 李普希茨常数<\/label><label class='quiz-opt'><input type='radio' name='q07' value='1'> |f| 在矩形上的最大值<\/label><label class='quiz-opt'><input type='radio' name='q07' value='2'> 矩形的宽<\/label><label class='quiz-opt'><input type='radio' name='q07' value='3'> 初值的模<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q08' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 唯一性证明中格朗沃尔引理的 A 取？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q08' value='0'> A=1<\/label><label class='quiz-opt'><input type='radio' name='q08' value='1'> A=0<\/label><label class='quiz-opt'><input type='radio' name='q08' value='2'> A=M<\/label><label class='quiz-opt'><input type='radio' name='q08' value='3'> A=L<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q09' data-type='single'><p class='quiz-q'><b>Q3.<\/b> 方程 y′=3y^(2/3)，y(0)=0 的解的特点是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q09' value='0'> 唯一<\/label><label class='quiz-opt'><input type='radio' name='q09' value='1'> 不存在<\/label><label class='quiz-opt'><input type='radio' name='q09' value='2'> 不唯一<\/label><label class='quiz-opt'><input type='radio' name='q09' value='3'> 只在正半轴存在<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch04__": "<h1>测验：第 4 章：高阶线性微分方程<\/h1><div class='quiz-item' data-qid='q10' data-type='single'><p class='quiz-q'><b>Q1.<\/b> y″−3y′+2y=0 的基本解组是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q10' value='0'> eˣ, e^(2x)<\/label><label class='quiz-opt'><input type='radio' name='q10' value='1'> e^(−x), e^(−2x)<\/label><label class='quiz-opt'><input type='radio' name='q10' value='2'> 1, x<\/label><label class='quiz-opt'><input type='radio' name='q10' value='3'> cos x, sin x<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q11' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 朗斯基行列式的刘维尔公式说明？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q11' value='0'> W 可能时零时非零<\/label><label class='quiz-opt'><input type='radio' name='q11' value='1'> W 要么恒零要么恒不为零<\/label><label class='quiz-opt'><input type='radio' name='q11' value='2'> W 恒为正<\/label><label class='quiz-opt'><input type='radio' name='q11' value='3'> W 与 a₁ 无关<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q12' data-type='single'><p class='quiz-q'><b>Q3.<\/b> 右端 f=e^(3x)，而 3 恰是一重特征根时，特解应设为？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q12' value='0'> Ae^(3x)<\/label><label class='quiz-opt'><input type='radio' name='q12' value='1'> xAe^(3x)<\/label><label class='quiz-opt'><input type='radio' name='q12' value='2'> x²Ae^(3x)<\/label><label class='quiz-opt'><input type='radio' name='q12' value='3'> Acos3x<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch05__": "<h1>测验：第 5 章：线性微分方程组<\/h1><div class='quiz-item' data-qid='q13' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 基解矩阵 Φ 必须满足？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q13' value='0'> Φ′=AΦ 且 det Φ≠0<\/label><label class='quiz-opt'><input type='radio' name='q13' value='1'> Φ′=AΦ 且 det Φ=0<\/label><label class='quiz-opt'><input type='radio' name='q13' value='2'> Φ=AΦ 且 det Φ≠0<\/label><label class='quiz-opt'><input type='radio' name='q13' value='3'> Φ′=Φ 且 det Φ≠0<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q14' data-type='single'><p class='quiz-q'><b>Q2.<\/b> A 为若尔当块 [[2,1],[0,2]] 时 e^(At)=？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q14' value='0'> e^(2t)I<\/label><label class='quiz-opt'><input type='radio' name='q14' value='1'> e^(2t)[[1,t],[0,1]]<\/label><label class='quiz-opt'><input type='radio' name='q14' value='2'> [[e^(2t),0],[0,e^(2t)]]<\/label><label class='quiz-opt'><input type='radio' name='q14' value='3'> e^(2t)[[1,0],[t,1]]<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q15' data-type='single'><p class='quiz-q'><b>Q3.<\/b> 拉普拉斯变换解 x′=Ax 时，预解矩阵是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q15' value='0'> (sI+A)⁻¹<\/label><label class='quiz-opt'><input type='radio' name='q15' value='1'> (sI−A)⁻¹<\/label><label class='quiz-opt'><input type='radio' name='q15' value='2'> sA⁻¹<\/label><label class='quiz-opt'><input type='radio' name='q15' value='3'> A/s<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch06__": "<h1>测验：第 6 章：非线性与稳定性<\/h1><div class='quiz-item' data-qid='q16' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 系统 tr A=−2，det A=2，Δ&lt;0 时奇点类型是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q16' value='0'> 稳定结点<\/label><label class='quiz-opt'><input type='radio' name='q16' value='1'> 稳定焦点<\/label><label class='quiz-opt'><input type='radio' name='q16' value='2'> 鞍点<\/label><label class='quiz-opt'><input type='radio' name='q16' value='3'> 中心<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q17' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 李雅普诺夫第二方法中 V 需满足？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q17' value='0'> V 正定且沿轨线导数负定<\/label><label class='quiz-opt'><input type='radio' name='q17' value='1'> V 负定且导数正定<\/label><label class='quiz-opt'><input type='radio' name='q17' value='2'> V 任意<\/label><label class='quiz-opt'><input type='radio' name='q17' value='3'> V 必须是二次型<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q18' data-type='single'><p class='quiz-q'><b>Q3.<\/b> 庞加莱-本迪克松定理适用于？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q18' value='0'> 任意维系统<\/label><label class='quiz-opt'><input type='radio' name='q18' value='1'> 仅平面系统<\/label><label class='quiz-opt'><input type='radio' name='q18' value='2'> 仅线性系统<\/label><label class='quiz-opt'><input type='radio' name='q18' value='3'> 仅哈密顿系统<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch07__": "<h1>测验：第 7 章：一阶线性偏微分方程<\/h1><div class='quiz-item' data-qid='q19' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 齐次线性 PDE a u_x+b u_y=0 的通解是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q19' value='0'> u=F(Φ)，Φ 为首次积分<\/label><label class='quiz-opt'><input type='radio' name='q19' value='1'> u=Φ(x,y)<\/label><label class='quiz-opt'><input type='radio' name='q19' value='2'> u=ax+by<\/label><label class='quiz-opt'><input type='radio' name='q19' value='3'> u=常数<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q20' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 柯西问题失效的几何条件是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q20' value='0'> 初始曲线与特征线相切<\/label><label class='quiz-opt'><input type='radio' name='q20' value='1'> 初始曲线是直线<\/label><label class='quiz-opt'><input type='radio' name='q20' value='2'> 初始值不连续<\/label><label class='quiz-opt'><input type='radio' name='q20' value='3'> 方程非线性<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q21' data-type='single'><p class='quiz-q'><b>Q3.<\/b> n 维一阶方程组有几个独立首次积分？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q21' value='0'> n 个<\/label><label class='quiz-opt'><input type='radio' name='q21' value='1'> n−1 个<\/label><label class='quiz-opt'><input type='radio' name='q21' value='2'> 1 个<\/label><label class='quiz-opt'><input type='radio' name='q21' value='3'> 无穷多个<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch08__": "<h1>测验：第 8 章：边值问题<\/h1><div class='quiz-item' data-qid='q22' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 边值问题 y″+π²y=0，y(0)=y(1)=0 的解？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q22' value='0'> 唯一零解<\/label><label class='quiz-opt'><input type='radio' name='q22' value='1'> 不唯一<\/label><label class='quiz-opt'><input type='radio' name='q22' value='2'> 无解<\/label><label class='quiz-opt'><input type='radio' name='q22' value='3'> 唯一非零解<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q23' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 格林函数在 x=ξ 处的导数跳跃量是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q23' value='0'> 0<\/label><label class='quiz-opt'><input type='radio' name='q23' value='1'> 1<\/label><label class='quiz-opt'><input type='radio' name='q23' value='2'> −1/p(ξ)<\/label><label class='quiz-opt'><input type='radio' name='q23' value='3'> p(ξ)<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q24' data-type='single'><p class='quiz-q'><b>Q3.<\/b> 斯特姆-刘维尔问题的特征值？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q24' value='0'> 可能为复数<\/label><label class='quiz-opt'><input type='radio' name='q24' value='1'> 全为实数<\/label><label class='quiz-opt'><input type='radio' name='q24' value='2'> 只有有限个<\/label><label class='quiz-opt'><input type='radio' name='q24' value='3'> 全为正<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz___all__": "<h1>测验：__all<\/h1><div class='quiz-item' data-qid='q25' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 同一个方程 y′=f(x,y)，若 f 连续但不在任何矩形上满足李普希茨，能保证的是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q25' value='0'> 存在且唯一<\/label><label class='quiz-opt'><input type='radio' name='q25' value='1'> 存在但不一定唯一<\/label><label class='quiz-opt'><input type='radio' name='q25' value='2'> 唯一但不一定存在<\/label><label class='quiz-opt'><input type='radio' name='q25' value='3'> 既不保证存在也不保证唯一<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q26' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 线性方程与非线性方程在“解集结构”上的根本差别是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q26' value='0'> 线性方程解集是线性空间<\/label><label class='quiz-opt'><input type='radio' name='q26' value='1'> 线性方程解一定唯一<\/label><label class='quiz-opt'><input type='radio' name='q26' value='2'> 非线性方程解集是线性空间<\/label><label class='quiz-opt'><input type='radio' name='q26' value='3'> 没有差别<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q27' data-type='single'><p class='quiz-q'><b>Q3.<\/b> 边值问题与初值问题最关键的区别是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q27' value='0'> 边值问题条件给在两端，可能无解或不唯一<\/label><la
