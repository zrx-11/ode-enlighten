bel class='quiz-opt'><input type='radio' name='q27' value='1'> 边值问题不需要方程<\/label><label class='quiz-opt'><input type='radio' name='q27' value='2'> 边值问题一定唯一可解<\/label><label class='quiz-opt'><input type='radio' name='q27' value='3'> 初值问题不需要连续性<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q28' data-type='single'><p class='quiz-q'><b>Q4.<\/b> “混沌”在数学上的准确含义是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q28' value='0'> 随机过程<\/label><label class='quiz-opt'><input type='radio' name='q28' value='1'> 确定性系统对初值敏感且有界非周期<\/label><label class='quiz-opt'><input type='radio' name='q28' value='2'> 方程无解<\/label><label class='quiz-opt'><input type='radio' name='q28' value='3'> 数值方法失败<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__cards__": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "__glossary__": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='常微分方程'>常微分方程 — 只含一个自变量、未知函数及其导数的方程 <span class=glossary-ref>（第 1 章：绪论）<\/span><\/li><li data-term='阶'>阶 — 方程中出现过的最高阶导数的阶数 <span class=glossary-ref>（第 1 章：绪论）<\/span><\/li><li data-term='线性方程'>线性方程 — 关于未知函数及其各阶导数都是一次的方程 <span class=glossary-ref>（第 1 章：绪论）<\/span><\/li><li data-term='通解'>通解 — 含 n 个独立任意常数的解族 <span class=glossary-ref>（第 1 章：绪论）<\/span><\/li><li data-term='特解'>特解 — 满足给定初值条件的解 <span class=glossary-ref>（第 1 章：绪论）<\/span><\/li><li data-term='隐式解'>隐式解 — 由 Φ(x,y)=0 确定的解，也叫积分 <span class=glossary-ref>（第 1 章：绪论）<\/span><\/li><li data-term='初值问题'>初值问题 — 方程连同一点处的一组初值条件 <span class=glossary-ref>（第 1 章：绪论）<\/span><\/li><li data-term='积分曲线'>积分曲线 — 解在平面上的图形 <span class=glossary-ref>（第 1 章：绪论）<\/span><\/li><li data-term='方向场'>方向场 — 平面上每点标出斜率的线素集合 <span class=glossary-ref>（第 1 章：绪论）<\/span><\/li><li data-term='等斜线'>等斜线 — 方向场中斜率相同的点的连线 <span class=glossary-ref>（第 1 章：绪论）<\/span><\/li><li data-term='相平面'>相平面 — 以状态变量为坐标的平面，轨线在其上 <span class=glossary-ref>（第 1 章：绪论）<\/span><\/li><li data-term='变量分离'>变量分离 — 把方程改写成 f(y)dy=g(x)dx 的方法 <span class=glossary-ref>（第 2 章：一阶方程的初等解法）<\/span><\/li><li data-term='齐次型方程'>齐次型方程 — 右端只依赖 y/x 的方程 <span class=glossary-ref>（第 2 章：一阶方程的初等解法）<\/span><\/li><li data-term='常数变易法'>常数变易法 — 把齐次解的常数换成函数求非齐次解 <span class=glossary-ref>（第 2 章：一阶方程的初等解法）<\/span><\/li><li data-term='恰当方程'>恰当方程 — 左端恰为某个函数全微分的方程 <span class=glossary-ref>（第 2 章：一阶方程的初等解法）<\/span><\/li><li data-term='积分因子'>积分因子 — 乘上去使方程变恰当的因子 μ <span class=glossary-ref>（第 2 章：一阶方程的初等解法）<\/span><\/li><li data-term='奇解'>奇解 — 不属于通解族、但与族中曲线相切的解 <span class=glossary-ref>（第 2 章：一阶方程的初等解法）<\/span><\/li><li data-term='包络'>包络 — 与一族曲线相切的曲线 <span class=glossary-ref>（第 2 章：一阶方程的初等解法）<\/span><\/li><li data-term='李普希茨条件'>李普希茨条件 — 关于 y 的变化率被常数 L 卡住 <span class=glossary-ref>（第 3 章：解的存在唯一性）<\/span><\/li><li data-term='皮卡迭代'>皮卡迭代 — 用积分方程反复代换逼近解 <span class=glossary-ref>（第 3 章：解的存在唯一性）<\/span><\/li><li data-term='格朗沃尔引理'>格朗沃尔引理 — 积分不等式推出差为零的工具 <span class=glossary-ref>（第 3 章：解的存在唯一性）<\/span><\/li><li data-term='饱和解'>饱和解 — 不能再延拓的解 <span class=glossary-ref>（第 3 章：解的存在唯一性）<\/span><\/li><li data-term='朗斯基行列式'>朗斯基行列式 — n 个解及其导数排成的行列式 <span class=glossary-ref>（第 4 章：高阶线性微分方程）<\/span><\/li><li data-term='基本解组'>基本解组 — n 个线性无关的齐次解 <span class=glossary-ref>（第 4 章：高阶线性微分方程）<\/span><\/li><li data-term='特征方程'>特征方程 — 常系数方程代入 e^(rx) 得到的多项式方程 <span class=glossary-ref>（第 4 章：高阶线性微分方程）<\/span><\/li><li data-term='基解矩阵'>基解矩阵 — 以 n 个线性无关解为列的矩阵 Φ <span class=glossary-ref>（第 5 章：线性微分方程组）<\/span><\/li><li data-term='矩阵指数'>矩阵指数 — e^(At)=ΣAᵏtᵏ/k! <span class=glossary-ref>（第 5 章：线性微分方程组）<\/span><\/li><li data-term='预解矩阵'>预解矩阵 — (sI−A)⁻¹，其逆变换为 e^(At) <span class=glossary-ref>（第 5 章：线性微分方程组）<\/span><\/li><li data-term='平衡点'>平衡点 — 使 f(x)=0 的点 <span class=glossary-ref>（第 6 章：非线性与稳定性）<\/span><\/li><li data-term='渐近稳定'>渐近稳定 — 稳定且轨线趋于平衡点 <span class=glossary-ref>（第 6 章：非线性与稳定性）<\/span><\/li><li data-term='李雅普诺夫函数'>李雅普诺夫函数 — 沿轨线单调下降的正定函数 V <span class=glossary-ref>（第 6 章：非线性与稳定性）<\/span><\/li><li data-term='极限环'>极限环 — 孤立的闭轨 <span class=glossary-ref>（第 6 章：非线性与稳定性）<\/span><\/li><li data-term='哈密顿方程'>哈密顿方程 — dp/dt=−H_q，dq/dt=H_p 形式的系统 <span class=glossary-ref>（第 6 章：非线性与稳定性）<\/span><\/li><li data-term='首次积分'>首次积分 — 沿轨线取常数的函数 <span class=glossary-ref>（第 6 章：非线性与稳定性）<\/span><\/li><li data-term='特征线'>特征线 — 偏微分方程沿之降为常微分方程的曲线 <span class=glossary-ref>（第 7 章：一阶线性偏微分方程）<\/span><\/li><li data-term='柯西问题'>柯西问题 — 偏微分方程加初始曲线的问题 <span class=glossary-ref>（第 7 章：一阶线性偏微分方程）<\/span><\/li><li data-term='格林函数'>格林函数 — 点源在边界条件下产生的响应 <span class=glossary-ref>（第 8 章：边值问题）<\/span><\/li><li data-term='斯特姆-刘维尔问题'>斯特姆-刘维尔问题 — 自伴形式的特征值问题 <span class=glossary-ref>（第 8 章：边值问题）<\/span><\/li><li data-term='弗雷德霍姆二择一'>弗雷德霍姆二择一 — 齐次问题只有零解则非齐次唯一可解 <span class=glossary-ref>（第 8 章：边值问题）<\/span><\/li><\/ul>", "__patterns__": "<h1>模式与框架库<\/h1>\n<h2>框架：一阶方程解法判定链<\/h2>\n<p>拿到一个一阶方程，按顺序问四个问题，能停就停：<\/p>\n<ol><li>\n能不能写成 dy/dx=f(x)g(y)？→ 分离变量。\n<\/li><li>\n右端是不是 φ(y/x)？或者分式线性型能否平移？→ 换元。\n<\/li><li>\n是不是 y′+P(x)y=Q(x)？→ 常数变易公式。\n<\/li><li>\nM dx+N dy 是否满足 M_y=N_x？→ 恰当；否则算两个商式找积分因子。\n<\/ol>\n<p>停不下来的，说明它可能是隐式方程，转参数化路线。<\/p>\n<h2>框架：理论证明的三段式<\/h2>\n<p>凡&quot;存在唯一&quot;类定理，一律按这个骨架写：<\/p>\n<ol><li>\n化成积分方程（把微分变成积分，降低光滑性要求）；\n<\/li><li>\n构造逼近序列并证明一致收敛（存在）；\n<\/li><li>\n假设两个解，用格朗沃尔压成零（唯一）。\n<\/ol>\n<h2>决策规则<\/h2>\n<ul><li>\n线性方程：先判齐次还是非齐次。齐次找基本解组，非齐次先求一个特解。\n<\/li><li>\n常系数：先写特征方程。根重复就乘 x，根是复的就转三角，右端撞根就乘 xᵏ。\n<\/li><li>\n非线性：先算雅可比。双曲就用线性化；非双曲就找 V；平面还想看全局就找不变区域。\n<\/ul>\n<h2>反模式<\/h2>\n<ul><li>\n<strong>不检查除零因子<\/strong>。分离变量时除以 g(y)，忘了 g(y)=0 的常数解，直接丢解。\n<\/li><li>\n<strong>把 W=0 当成线性相关的万能判据<\/strong>。这只对线性齐次方程成立。\n<\/li><li>\n<strong>特征根重复还硬设 Ae^(λx)<\/strong>。代进去恒为零，解不出系数，然后怀疑自己算错。\n<\/li><li>\n<strong>边值问题直接套初值问题的存在唯一性<\/strong>。两者完全不同，边值问题可能无解。\n<\/li><li>\n<strong>用线性化处理临界情形<\/strong>。实部为零时线性化给不出结论，必须换方法。\n<\/ul>", "__cheatsheet__": "<h1>速查表<\/h1>\n<h2>一阶方程<\/h2>\n<table><thead><tr><th>类型<\/th><th>标准形<\/th><th>解法<\/th><th>通解<\/th><\/tr><\/thead><tbody><tr><td>变量分离<\/td><td>y′=f(x)g(y)<\/td><td>分离积分<\/td><td>∫dy/g(y)=∫f(x)dx+C<\/td><\/tr><tr><td>齐次型<\/td><td>y′=φ(y/x)<\/td><td>令 u=y/x<\/td><td>x du/dx=φ(u)−u<\/td><\/tr><tr><td>一阶线性<\/td><td>y′+P(x)y=Q(x)<\/td><td>常数变易<\/td><td>y=e^(−∫P)[∫Qe^(∫P)+C]<\/td><\/tr><tr><td>伯努利<\/td><td>y′+P y=Q yⁿ<\/td><td>令 z=y^(1−n)<\/td><td>化为一阶线性<\/td><\/tr><tr><td>恰当<\/td><td>M dx+N dy=0，M_y=N_x<\/td><td>求 u<\/td><td>u(x,y)=C<\/td><\/tr><tr><td>积分因子 x<\/td><td>(M_y−N_x)/N 只含 x<\/td><td>μ=e^(∫…)<\/td><td>乘后变恰当<\/td><\/tr><tr><td>积分因子 y<\/td><td>(N_x−M_y)/M 只含 y<\/td><td>μ=e^(∫…)<\/td><td>同上<\/td><\/tr><tr><td>隐式<\/td><td>y=f(x,p)<\/td><td>p=y′ 求导<\/td><td>参数式<\/td><\/tr><tr><td>克莱罗<\/td><td>y=xp+g(p)<\/td><td>求导<\/td><td>直线族 + 包络奇解<\/td><\/tr><\/tbody><\/table>\n<h2>线性方程<\/h2>\n<table><thead><tr><th>场景<\/th><th>结论<\/th><\/tr><\/thead><tbody><tr><td>n 阶齐次解空间<\/td><td>n 维<\/td><\/tr><tr><td>非齐次通解<\/td><td>特解 + 齐次通解<\/td><\/tr><tr><td>朗斯基<\/td><td>W(x)=W(x₀)exp(−∫a₁)<\/td><\/tr><tr><td>常数变易<\/td><td>Σcᵢ′yᵢ⁽ᵏ⁾=0，最后一式为 f<\/td><\/tr><tr><td>特征根单实<\/td><td>e^(rx)<\/td><\/tr><tr><td>特征根 k 重<\/td><td>e^(rx), xe^(rx), …, x^(k−1)e^(rx)<\/td><\/tr><tr><td>复根 α±iβ<\/td><td>e^(αx)cos βx, e^(αx)sin βx<\/td><\/tr><tr><td>右端 P_m e^(λx)<\/td><td>特解 xᵏQ_m e^(λx)<\/td><\/tr><tr><td>右端 e^(αx)(P cos+Q sin)<\/td><td>xᵏe^(αx)(R cos+S sin)<\/td><\/tr><\/tbody><\/table>\n<h2>方程组<\/h2>\n<table><thead><tr><th>场景<\/th><th>结论<\/th><\/tr><\/thead><tbody><tr><td>基解矩阵<\/td><td>Φ′=AΦ，det Φ≠0<\/td><\/tr><tr><td>非齐次<\/td><td>x=Φ[C+∫Φ⁻¹f]<\/td><\/tr><tr><td>det Φ<\/td><td>det Φ(t₀)exp(∫tr A)<\/td><\/tr><tr><td>e^(At)<\/td><td>ΣAᵏtᵏ/k!，满足 Φ(0)=I<\/td><\/tr><tr><td>对角化<\/td><td>P diag(e^(λᵢt)) P⁻¹<\/td><\/tr><tr><td>若尔当块<\/td><td>e^(λt)(I+Nt+…+N^(k−1)t^(k−1)/(k−1)!)<\/td><\/tr><tr><td>拉普拉斯<\/td><td>X=(sI−A)⁻¹(x₀+F)<\/td><\/tr><\/tbody><\/table>\n<h2>稳定性与相图<\/h2>\n<table><thead><tr><th>条件<\/th><th>类型<\/th><\/tr><\/thead><tbody><tr><td>tr&lt;0，det&gt;0，Δ&gt;0<\/td><td>稳定结点<\/td><\/tr><tr><td>tr&gt;0，det&gt;0，Δ&gt;0<\/td><td>不稳定结点<\/td><\/tr><tr><td>det&lt;0<\/td><td>鞍点<\/td><\/tr><tr><td>tr&lt;0，det&gt;0，Δ&lt;0<\/td><td>稳定焦点<\/td><\/tr><tr><td>tr&gt;0，det&gt;0，Δ&lt;0<\/td><td>不稳定焦点<\/td><\/tr><tr><td>tr=0，det&gt;0<\/td><td>中心<\/td><\/tr><tr><td>特征值实部全负<\/td><td>渐近稳定<\/td><\/tr><tr><td>有正实部<\/td><td>不稳定<\/td><\/tr><tr><td>实部为零<\/td><td>线性化失效<\/td><\/tr><\/tbody><\/table>\n<h2>数值方法<\/h2>\n<ul><li>\n欧拉：yₙ₊₁=yₙ+h f，整体 O(h)\n<\/li><li>\nRK4：k₁..k₄，yₙ₊₁=yₙ+h(k₁+2k₂+2k₃+k₄)/6，整体 O(h⁴)\n<\/ul>"}};
const pages = DATA.rendered;
const manifest = DATA.manifest;
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const SLUG = manifest.slug || 'book';
const store = {
  get(k){ try{ return JSON.parse(localStorage.getItem(SLUG+':'+k)||'null') }catch(e){ return null } },
  set(k,v){ try{ localStorage.setItem(SLUG+':'+k, JSON.stringify(v)) }catch(e){} }
};
let state = { visited: store.get('visited')||[], quiz: store.get('quiz')||{}, cards: store.get('cards')||{} };

/* ---------- 导航 ---------- */
function renderNav(){
  const nav = $('#nav'); nav.innerHTML='';
  const build = items => items.forEach(it=>{
    if(it.children){
      const sec=document.createElement('div'); sec.className='nav-sec'; sec.textContent=it.label; nav.appendChild(sec);
      it.children.forEach(c=>{
        const a=document.createElement('a'); a.className='nav-item'; a.href=c.href; a.textContent=c.label;
        const id=routeId(c.href);
        if(state.visited.includes(id)) a.innerHTML = esc(c.label)+' <span class="done">✓</span>';
        nav.appendChild(a);
      });
    }else{
      const a=document.createElement('a'); a.className='nav-item'; a.href=it.href; a.textContent=it.label;
      const id=routeId(it.href);
      if(state.visited.includes(id)) a.innerHTML = esc(it.label)+' <span class="done">✓</span>';
      nav.appendChild(a);
    }
  });
  build(DATA.nav);
  updateProgress();
}
function routeId(href){ return href.replace('#/',''); }

/* ---------- 路由 ---------- */
function routeIdFromHash(){
  let h = location.hash.replace(/^#\//,'');
  if(!h) return 'path';
  if(h==='path') return 'path';
  const m = h.match(/^(chapter|concept)\/(.+)$/);
  if(m) return m[1]+'/'+m[2];
  return h; // quiz/all, quiz/ch01, cards, glossary, patterns, cheatsheet
}
function showPage(rid){
  const id = rid==='path' ? '__path__' : rid.startsWith('quiz/') ? '__quiz_'+rid.split('/')[1]+'__' : rid==='cards'?'__cards__':rid==='glossary'?'__glossary__':rid==='patterns'?'__patterns__':rid==='cheatsheet'?'__cheatsheet__':rid.startsWith('chapter/')?rid.split('/')[1]:rid.startsWith('concept/')?rid.split('/')[1]:rid;
  const html = pages[id] || '<div class="empty">页面不存在</div>';
  $('#view').innerHTML = html;
  document.querySelectorAll('.nav-item').forEach(a=>a.classList.toggle('active', routeId(a.getAttribute('href'))===rid));
  if(!state.visited.includes(rid) && (rid.startsWith('chapter/')||rid.startsWith('concept/'))){
    state.visited.push(rid); store.set('visited', state.visited); renderNav();
  }
  window.scrollTo(0,0);
  if(rid==='cards') initCards();
  if(rid==='glossary') initGlossary();
  if(rid.startsWith('quiz')) initQuizzes(rid);
  if(id==='__path__') updatePath();
  renderMermaid();
}

/* ---------- 进度 ---------- */
function updateProgress(){
  const chs = (manifest.chapters||[]).length;
  const done = (manifest.chapters||[]).filter(c=>state.visited.includes('chapter/'+c.id)).length;
  const pct = chs? Math.round(done/chs*100) : 0;
  $('#progress-fill').style.width = pct+'%';
  $('#progress-label').textContent = `进度 ${pct}% · 已学 ${done}/${chs} 章`;
}
function updatePath(){
  document.querySelectorAll('.path-step').forEach(el=>{
    const step = el.id.replace('path-','');
    const s = (manifest.learningPath||[]).find(x=>x.step===step);
    if(s && (s.chapterIds||[]).every(c=>state.visited.includes('chapter/'+c))){
      el.classList.add('passed');
      const lbl = el.querySelector('.checkpoint-ok'); if(!lbl){ const sp=document.createElement('span'); sp.className='done'; sp.textContent=' ✓ 已完成'; el.appendChild(sp); }
    }
  });
}

/* ---------- 测验 ---------- */
function initQuizzes(rid){
  document.querySelectorAll('.quiz-item').forEach(item=>{
    const btn = item.querySelector('.quiz-check');
    if(!btn || item.dataset.inited){ return }
    item.dataset.inited='1';
    btn.addEventListener('click', ()=>{
      const qid = item.dataset.qid; const type = item.dataset.type;
      const q = (manifest.quizzes||[]).find(x=>x.id===qid); if(!q) return;
      let user, correct=false, fb;
      if(type==='single'){
        const sel = item.querySelector('input:checked');
        user = sel? parseInt(sel.value) : null;
        correct = user===q.answer;
        fb = correct?'✓ 正确':'✗ 错误'+(user==null?'（未作答）':'');
      } else if(type==='multi'){
        user = Array.from(item.querySelectorAll('input:checked')).map(i=>parseInt(i.value)).sort();
        const ans = Array.isArray(q.answer)? q.answer.slice().sort(): [q.answer];
        correct = user.length>0 && JSON.stringify(user)===JSON.stringify(ans);
        fb = correct?'✓ 正确':'✗ 错误';
      } else if(type==='blank'){
        const v = (item.querySelector('.quiz-blank').value||'').trim().toLowerCase();
        const a = String(q.answer).trim().toLowerCase();
        correct = v===a;
        fb = correct?'✓ 正确':'✗ 错误'+(v?'':'（未作答）');
      }
      item.querySelectorAll('input:checked').forEach(i=>{
        const val=parseInt(i.value);
        if(Array.isArray(q.answer)? q.answer.includes(val) : val===q.answer) i.parentElement.style.color='var(--ok)';
        else i.parentElement.style.color='var(--bad)';
      });
      const feed = item.querySelector('.quiz-feedback');
      feed.className = 'quiz-feedback '+(correct?'fb-ok':'fb-bad');
      feed.textContent = fb;
      let ex = item.querySelector('.quiz-explain');
      if(!ex){ ex=document.createElement('div'); ex.className='quiz-explain'; item.appendChild(ex); }
      ex.innerHTML = '解析：' + esc(q.explain||'');
      // 记录成绩（按章聚合）
      const ch = q.chapterId||'__all__';
      if(!state.quiz[ch]) state.quiz[ch]={done:0,total:0};
      state.quiz[ch].done = Math.min(state.quiz[ch].total+1, state.quiz[ch].done+1);
      state.quiz[ch].total += 1;
      store.set('quiz', state.quiz);
    });
  });
}

/* ---------- 抽认卡 ---------- */
let cardIdx = 0, cardList = [];
function initCards(){
  const cards = manifest.flashcards||[];
  cardList = cards.slice();
  cardIdx = 0;
  const sel = $('#card-filter');
  sel.innerHTML = '<option value="">全部</option>';
  [...new Set(cards.map(c=>c.chapterId).filter(Boolean))].forEach(c=>{
    const o=document.createElement('option'); o.value=c; o.textContent=manifestChTitle(c); sel.appendChild(o);
  });
  sel.onchange = ()=>{ const v=sel.value; cardList = v? cards.filter(c=>c.chapterId===v): cards.slice(); cardIdx=0; showCard(); };
  $('#flashcard').onclick = ()=>$('#flashcard').classList.toggle('flip');
  $('#card-known-btn').onclick = ()=>{ markCard(true); };
  $('#card-again-btn').onclick = ()=>{ markCard(false); };
  showCard();
}
function showCard(){
  updateCardCounts();
  if(cardIdx>=cardList.length){ $('#card-stage').innerHTML='<div class="empty">本组卡片已全部复习完 🎉</div>'; return; }
  const c = cardList[cardIdx];
  document.querySelector('.fc-front').textContent = c.front;
  document.querySelector('.fc-back').textContent = c.back;
  $('#flashcard').classList.remove('flip');
}
function markCard(known){
  const c = cardList[cardIdx]; if(!c) return;
  state.cards[c.id] = known?'known':'again';
  store.set('cards', state.cards);
  cardIdx++; showCard();
}
function updateCardCounts(){
  const known = Object.values(state.cards).filter(v=>v==='known').length;
  const again = Object.values(state.cards).filter(v=>v==='again').length;
  $('#card-known').textContent = known;
  $('#card-again').textContent = again;
  $('#card-left').textContent = Math.max(0, cardList.length-cardIdx);
}
function manifestChTitle(id){
  const c=(manifest.chapters||[]).find(x=>x.id===id); return c? c.title : id;
}

/* ---------- 术语表 ---------- */
function initGlossary(){
  const input = $('#glossary-filter');
  if(!input || input.dataset.inited) return;
  input.dataset.inited='1';
  input.oninput = ()=>{
    const v = input.value.trim().toLowerCase();
    document.querySelectorAll('#glossary-list li').forEach(li=>{
      li.style.display = (!v || li.dataset.term.includes(v)) ? '' : 'none';
    });
  };
}

/* ---------- 搜索 ---------- */
let searchIndex = null;
function buildSearchIndex(){
  if(searchIndex) return searchIndex;
  searchIndex = [];
  Object.entries(pages).forEach(([id, htmlText])=>{
    if(id.startsWith('__')) return;
    const text = htmlText.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ');
    searchIndex.push({id, text});
  });
  return searchIndex;
}
$('#q').addEventListener('input', e=>{
  const v = e.target.value.trim().toLowerCase();
  if(!v){ showPage(routeIdFromHash()); return; }
  buildSearchIndex();
  const hits = searchIndex.filter(p=>p.text.toLowerCase().includes(v)).slice(0,20);
  const label = id => id.startsWith('chapter/')? ('章节：'+manifestChTitle(id.split('/')[1])) : id.startsWith('concept/')? ('概念：'+id.split('/')[1]) : id;
  $('#view').innerHTML = '<h1>搜索结果：'+esc(v)+'</h1>' +
    (hits.length? hits.map(h=>`<div class="search-hit"><a href="#/${h.id}">${esc(label(h.id))}</a><br><span class="sub">${esc(h.text.slice(0,180))}</span></div>`).join('')
                 : '<div class="empty">未找到相关页面，试试章节名/概念名/术语。</div>');
});

/* ---------- Mermaid 懒加载（联网渲染，离线显示源码） ---------- */
function renderMermaid(){
  if(!document.querySelector('.mermaid')) return;
  const s=document.createElement('script');
  s.src='https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js';
  s.onload=()=>{ try{
    mermaid.initialize({startOnLoad:false, theme: matchMedia('(prefers-color-scheme: dark)').matches?'dark':'default'});
    document.querySelectorAll('.mermaid').forEach(el=>{
      const code=el.textContent;
      mermaid.render('mm'+Math.random().toString(36).slice(2), code)
        .then(({svg})=>{ el.innerHTML=svg; })
        .catch(()=>{ el.textContent=code; });
    });
  }catch(e){} };
  document.head.appendChild(s);
}

/* ---------- 深色模式 ---------- */
const themeBtn=$('#theme-btn');
themeBtn.onclick=()=>{
  const d = document.body.dataset.theme==='dark';
  document.body.dataset.theme = d? '' : 'dark';
  themeBtn.textContent = d? '🌙 深色' : '☀️ 浅色';
};

/* ---------- 启动 ---------- */
renderNav();
window.addEventListener('hashchange', ()=>showPage(routeIdFromHash()));
(function(){
  const sb=document.querySelector('.sidebar'); if(!sb) return;
  const btn=document.createElement('button'); btn.id='nav-toggle'; btn.textContent='目录（点开选择章节）';
  btn.onclick=()=>sb.classList.toggle('open');
  sb.insertBefore(btn, sb.querySelector('#nav'));
  window.addEventListener('hashchange',()=>{ if(window.innerWidth<=760) sb.classList.remove('open'); });
})();
showPage(routeIdFromHash());
</script>
