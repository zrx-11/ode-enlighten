<style>
:root{

[data-theme="dark"]{

*{box-sizing:border-box}
html,body{margin:0;padding:0}

.layout{display:flex;min-height:100vh}

.quiz-explain{margin-top:8px;font-size:13px;color:var(--muted);border-top:1px dashed var(--border);padding-top:6px}

.fc-inner{position:relative;width:100%;height:240px;transform-style:preserve-3d;transition:transform .5s}
.flashcard.flip .fc-inner{transform:rotateY(180deg)}
.fc-front,.fc-back{position:absolute;inset:0;backface-visibility:hidden;display:flex;align-items:center;justify-content:center;
  padding:22px;border-radius:14px;border:1px solid var(--border);background:var(--panel);font-size:16px;text-align:center}
.fc-back{transform:rotateY(180deg);background:var(--accent-soft);color:var(--text)}
.card-controls{display:flex;gap:14px;align-items:center;margin:12px 0;flex-wrap:wrap}
.card-actions{display:flex;gap:12px;justify-content:center}
.card-actions button{padding:8px 22px;border:none;border-radius:8px;cursor:pointer;font-size:14px}
#card-known-btn{background:var(--ok);color:#fff}
#card-again-btn{background:var(--bad);color:#fff}
.card-counts{color:var(--muted);font-size:13px}
.path-step{margin:8px 0;padding:10px 12px;border:1px solid var(--border);border-radius:8px;background:var(--panel)}
.path-step.passed{border-color:var(--ok)}
#glossary-filter{width:100%;max-width:380px;padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);margin-bottom:10px}
#glossary-list li{padding:6px 0;border-bottom:1px dashed var(--border)}
.glossary-ref{color:var(--muted);font-size:12px}
.search-hit{margin:10px 0}
.topbar{position:sticky;top:0;background:var(--bg);padding:8px 0;display:flex;justify-content:flex-end;z-index:10}
#theme-btn{border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:8px;padding:5px 12px;cursor:pointer;white-space:nowrap}
#progress-bar{height:5px;background:var(--border);border-radius:3px;margin:8px 0;overflow:hidden}
#progress-bar>div{height:100%;width:0;background:var(--accent);transition:width .3s}
.empty{color:var(--muted);padding:20px 0}
@media print{.sidebar,.topbar,.quiz-actions,.card-actions,.card-controls{display:none!important}.main{max-width:none;padding:0}}
@media (max-width:760px){.sidebar{width:100%;height:auto;position:static;padding:10px 14px}

  .layout{flex-direction:column}.main{padding:16px}}
</style>

gle", "question": "判断一阶方程解法路线的第一格是？", "options": ["恰当", "可分离", "换元", "隐式"], "answer": 1, "explain": "先看能否分离变量。"}, {"id": "q02", "chapterId": "ch01", "type": "single", "question": "分离变量时 g(y₀)=0 意味着？", "options": ["无解", "y≡y₀ 也是解", "方程退化", "需积分因子"], "answer": 1, "explain": "除法丢解。"}, {"id": "q03", "chapterId": "ch01", "type": "single", "question": "找 μ 后最容易犯的错？", "options": ["忘记积分", "只乘一边", "符号错", "常数错"], "answer": 1, "explain": "整条方程都要乘。"}, {"id": "q04", "chapterId": "ch02", "type": "single", "question": "f=y² 在 |y|≤3 上的李普希茨常数？", "options": ["1", "3", "6", "9"], "answer": 2, "explain": "2·3=6。"}, {"id": "q05", "chapterId": "ch02", "type": "single", "question": "y′=y^(2/3)，y(0)=0 的解？", "options": ["唯一", "两个", "无穷多", "不存在"], "answer": 2, "explain": "指数<1，李普希茨失效。"}, {"id": "q06", "chapterId": "ch03", "type": "single", "question": "右端 e^(2x)，2 是二重根，特解乘几次 x？", "options": ["0", "1", "2", "3"], "answer": 2, "explain": "k 等于重数。"}, {"id": "q07", "chapterId": "ch03", "type": "single", "question": "常数变易中的 W 指？", "options": ["权重", "朗斯基行列式", "若尔当块", "逆矩阵"], "answer": 1, "explain": "基础解系的行列式。"}, {"id": "q08", "chapterId": "ch04", "type": "single", "question": "复特征值的实化解有几个？", "options": ["1", "2", "4", "无穷"], "answer": 1, "explain": "实部虚部各一。"}, {"id": "q09", "chapterId": "ch04", "type": "single", "question": "e^(At) 的拉普拉斯表示？", "options": ["L[(sI−A)]", "L⁻¹[(sI−A)⁻¹]", "L[(sI−A)⁻¹]", "det(sI−A)"], "answer": 1, "explain": "矩阵版本变换。"}, {"id": "q10", "chapterId": "ch05", "type": "single", "question": "稳定性分析第一步？", "options": ["算雅可比", "解 f(x)=0", "找 V", "画相图"], "answer": 1, "explain": "先找平衡点。"}, {"id": "q11", "chapterId": "ch05", "type": "single", "question": "李雅普诺夫方程的形式？", "options": ["AP+PA=−Q", "AᵀP+PA=−Q", "AᵀPA=−Q", "AP=−Q"], "answer": 1, "explain": "二次型求导得到。"}, {"id": "q12", "chapterId": "ch06", "type": "single", "question": "u_x+2u_y=0 的通解？", "options": ["F(x−2y)", "F(x−y/2)", "F(2x−y)", "F(x+y)"], "answer": 1, "explain": "特征线 x−y/2=const。"}, {"id": "q13", "chapterId": "ch06", "type": "single", "question": "格林函数的物理意义？", "options": ["势能", "单位点源响应", "基解", "特征函数"], "answer": 1, "explain": "叠加得一般解。"}, {"id": "q14", "chapterId": "ch07", "type": "single", "question": "只证存在该用哪条定理？", "options": ["皮卡", "皮亚诺", "柯西", "刘维尔"], "answer": 1, "explain": "连续即可，不必李普希茨。"}, {"id": "q15", "chapterId": "ch07", "type": "single", "question": "证明题最常见失分点？", "options": ["算错", "没验条件", "字太丑", "没画图"], "answer": 1, "explain": "引用定理不验条件。"}, {"id": "q16", "chapterId": "ch08", "type": "single", "question": "数值解能替代相图分析吗？", "options": ["能", "不能", "部分能", "视情况"], "answer": 1, "explain": "只给单条轨线。"}, {"id": "q17", "chapterId": "ch08", "type": "single", "question": "四重校验的顺序？", "options": ["手算-符号-数值-画图", "画图-手算-数值", "数值-手算", "符号-数值"], "answer": 0, "explain": "从手算出发逐层验证。"}, {"id": "q18", "chapterId": "__all", "type": "single", "question": "这本辅导书的核心价值是？", "options": ["补充理论", "把定理变成考场动作", "增加例题量", "介绍软件"], "answer": 1, "explain": "每章按解题指导组织。"}, {"id": "q19", "chapterId": "__all", "type": "single", "question": "线性方程组解题的核心对象是？", "options": ["特征值", "基解矩阵", "若尔当形", "行列式"], "answer": 1, "explain": "所有构造都为了它。"}], "flashcards": [{"id": "f01", "chapterId": "ch01", "front": "判断顺序第一格？", "back": "可分离。", "tags": ["流程"]}, {"id": "f02", "chapterId": "ch01", "front": "积分因子 μ 的判据？", "back": "(P_y−Q_x)/Q 只含 x。", "tags": ["公式"]}, {"id": "f03", "chapterId": "ch01", "front": "建模最后一步？", "back": "回代检验量纲与长期行为。", "tags": ["流程"]}, {"id": "f04", "chapterId": "ch02", "front": "李普希茨三手法？", "back": "偏导有界、中值、直接估。", "tags": ["方法"]}, {"id": "f05", "chapterId": "ch02", "front": "非唯一怎么证？", "back": "比值发散 + 构造延迟解。", "tags": ["方法"]}, {"id": "f06", "chapterId": "ch03", "front": "共振乘 x 几次？", "back": "重数。", "tags": ["规则"]}, {"id": "f07", "chapterId": "ch03", "front": "降阶的前提？", "back": "已知一个特解。", "tags": ["方法"]}, {"id": "f08", "chapterId": "ch04", "front": "矩阵指数三条算法？", "back": "特征向量、若尔当、拉普拉斯。", "tags": ["方法"]}, {"id": "f09", "chapterId": "ch04", "front": "非齐次常向量特解？", "back": "−A⁻¹b。", "tags": ["公式"]}, {"id": "f10", "chapterId": "ch05", "front": "稳定性五步？", "back": "平衡点、J、特征值、判符号、临界补 V。", "tags": ["流程"]}, {"id": "f11", "chapterId": "ch05", "front": "李雅普诺夫方程？", "back": "AᵀP+PA=−Q。", "tags": ["公式"]}, {"id": "f12", "chapterId": "ch06", "front": "齐次 PDE 通解？", "back": "u=F(Φ)。", "tags": ["公式"]}, {"id": "f13", "chapterId": "ch06", "front": "边值可解判据？", "back": "弗雷德霍姆二择一。", "tags": ["定理"]}, {"id": "f14", "chapterId": "ch07", "front": "证明四模板？", "back": "存在唯一、稳定、解性质、边值。", "tags": ["方法"]}, {"id": "f15", "chapterId": "ch08", "front": "软件的作用？", "back": "验证与画图，不替代证明。", "tags": ["理解"]}], "companion": "zhusiming-guide学习伴侣.html"}, "pages": {"ch01": {"html": "<h1>第 1 章 一阶方程：要点与解题指导<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：6 小时 | <strong>前置<\/strong>：第 1 章教材内容\n<\/li><li>\n<strong>对应原书<\/strong>：第一章（内容提要 / 学习辅导）\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n在一分钟内判断一道一阶方程该走哪条解法路线；\n<\/li><li>\n熟练使用&quot;凑全微分&quot;处理非标准形式的恰当方程；\n<\/li><li>\n避开分离变量丢解、积分因子漏乘两个高频错误；\n<\/li><li>\n把应用题的建模步骤固定成四步。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>朱思铭这一章的价值不在知识点，而在<strong>判断顺序<\/strong>：先看是否可分离，再看是否恰当，最后才是换元。顺序错了，题就解不出来。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>1.1 判断顺序（这是本章最该背的东西）<\/h3>\n<ol><li>\n能不能写成 y′=f(x)g(y)？能，分离变量。\n<\/li><li>\n写成 P dx+Q dy=0 后 P_y=Q_x？能，恰当。\n<\/li><li>\n不恰当，但 (P_y−Q_x)/Q 只含 x 或 (N_x−M_y)/M 只含 y？能，求积分因子。\n<\/li><li>\n形如 φ(y/x)、f(ax+by+c)？换元。\n<\/li><li>\n形如 y′+P(x)y=Q(x)yⁿ？伯努利，令 z=y^(1−n)。\n<\/ol>\n<p><strong>为什么顺序重要<\/strong>：同一个方程可能有多种处理方式，但只有一条能算到底。比如 (x+y)dx+x dy=0 既是恰当方程，也可当线性方程处理，前者更快。<\/p>\n<h3>1.2 两个高频错误<\/h3>\n<p><strong>丢解<\/strong>：分离变量时除以 g(y)，若 g(y₀)=0，则 y≡y₀ 也是解，必须单独写。<\/p>\n<p><strong>漏乘<\/strong>：找到 μ 后要把整条方程乘 μ，包括右端；常见错误是只乘了 P dx 忘了 Q dy。<\/p>\n<h3>1.3 建模四步<\/h3>\n<ol><li>\n设未知函数（明确它代表什么）。\n<\/li><li>\n写出变化率与现存量、流入流出量的关系。\n<\/li><li>\n定初值（注意单位）。\n<\/li><li>\n解完回代检验量纲与极限行为（t→∞ 是否符合物理直觉）。\n<\/ol>\n<p><strong>第 4 步是朱思铭反复强调的<\/strong>：很多学生解完就走，答案量纲不对也发现不了。<\/p>\n<h3>1.4 典型例题（Malthus 与 Logistic 对比）<\/h3>\n<p>Malthus：N′=rN，解 N=N₀e^(rt)，指数增长，无上界。 Logistic：N′=rN(1−N/K)，解 N=K/(1+(K/N₀−1)e^(−rt))，趋于 K。<\/p>\n<p><strong>比较的意义<\/strong>：同一个建模思路，加一个&quot;拥挤项&quot;就改变了长期行为。这是数学生物学的入门对比。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[一阶方程] --&gt; B{可分离}\n    B --&gt;|是| C[分离变量]\n    B --&gt;|否| D{P_y=Q_x}\n    D --&gt;|是| E[恰当]\n    D --&gt;|否| F{商只含单元}\n    F --&gt;|是| G[积分因子]\n    F --&gt;|否| H[换元/伯努利]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：按箭头顺序走，不要跳步。每一步都是&quot;能算到底&quot;的判据，不是&quot;看起来像&quot;。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：解题像选交通工具——先看有没有直达车（分离变量），没有再考虑换乘（换元）。绕远路也能到，但考试时间不够。<\/p>\n<p><strong>实例<\/strong>：解 y′=y/x + x。这是线性方程 y′−(1/x)y=x。 P=−1/x，∫P dx=−ln|x|，μ=1/|x|。取 μ=1/x（x&gt;0）： (xy)′=x·x=x²，xy=x³/3+C，y=x²/3+C/x。 检验：y′=2x/3−C/x²，而 y/x+x=x/3+C/x²+x。两者相等？2x/3−C/x² 与 x/3+C/x²+x 不等。 重算：(1/x)y′−y/x²=1，即 (y/x)′=1，y/x=x+C，y=x²+Cx。 检验：y′=2x+C，y/x+x=x+C+x=2x+C。正确。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为&quot;看起来像线性就一定线性&quot;<\/strong>——要先化成标准形 y′+P(x)y=Q(x)。\n<\/li><li>\n<strong>别以为&quot;积分因子只乘一边&quot;<\/strong>——整条方程都要乘。\n<\/li><li>\n<strong>别以为&quot;分离变量除掉的因子无所谓&quot;<\/strong>——漏解是考试扣分点。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\ny′=y/x+x 的正确解法？\n<p>（答案：化为 (y/x)′=1，得 y=x²+Cx。解析：看出左边是全微分。）<\/p>\n<\/ol>\n<ol><li>\n伯努利方程 y′+Py=Qyⁿ 的换元？\n<p>（答案：z=y^(1−n)。解析：化为线性方程。）<\/p>\n<\/ol>\n<ol><li>\n分离变量时 g(y₀)=0 意味着什么？\n<p>（答案：y≡y₀ 也是解，必须单独列出。解析：除法丢解。）<\/p>\n<\/ol>\n<ol><li>\n应用题解完为什么回代检验？\n<p>（答案：检查量纲与长期行为是否符合物理。解析：建模可能出错。）<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n判断顺序：分离 → 恰当 → 因子 → 换元。\n<\/li><li>\n两个坑：丢解、漏乘。\n<\/li><li>\n建模四步，最后一步是回代检验。\n<\/ul>", "kind": "chapter", "title": "第 1 章：一阶方程解题指导"}, "ch02": {"html": "<h1>第 2 章 存在唯一性与奇解：解题指导<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：6 小时 | <strong>前置<\/strong>：第 1 章、教材第三章\n<\/li><li>\n<strong>对应原书<\/strong>：第二章（学习辅导 / 补充提高）\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n在具体方程上正确验证李普希茨条件，并给出一个可用的 L；\n<\/li><li>\n判断某点是否唯一，并构造非唯一解族；\n<\/li><li>\n用皮卡迭代写出前三项近似；\n<\/li><li>\n说明奇解与唯一性失效的对应关系。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>辅导书这一章的训练目标很明确：<strong>把&quot;验证条件&quot;练成肌肉记忆<\/strong>。考试里出现的不是抽象定理，而是&quot;这个方程在 (0,0) 处唯一吗&quot;。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>2.1 验证李普希茨的三种手法<\/h3>\n<ol><li>\n<strong>偏导有界<\/strong>：|∂f/∂y|≤L 在矩形上，直接取 L 为上界。这是最常用的。\n<\/li><li>\n<strong>中值定理<\/strong>：|f(x,y₁)−f(x,y₂)|=|f_y(x,ξ)||y₁−y₂|。\n<\/li><li>\n<strong>直接估计<\/strong>：如 f=y² 在 |y|≤b 上，|y₁²−y₂²|≤2b|y₁−y₂|，L=2b。\n<\/ol>\n<p><strong>注意第三种<\/strong>：李普希茨是局部的，只在给定矩形内成立，不要写成全局。<\/p>\n<h3>2.2 判断非唯一<\/h3>\n<p>典型手法：找 f 使 |f(x,y₁)−f(x,y₂)| 与 |y₁−y₂| 的比值在 y→y₀ 时无界。例如 f=√|y| 在 y=0 附近：<\/p>\n<div class=\"eq\">|√y₁−√y₂| = |y₁−y₂|/(√y₁+√y₂) → 发散<\/div>\n<p>于是可以用&quot;延迟出发&quot;构造无穷多解：y≡0 与 y=(x−c)²/4（x≥c）。<\/p>\n<h3>2.3 皮卡迭代的实操<\/h3>\n<p>以 y′=x+y，y(0)=0 为例： φ₀=0 φ₁=x²/2 φ₂=x²/2+x³/6 φ₃=x²/2+x³/6+x⁴/24 规律已现：φₙ=Σ[k=2→n+1] xᵏ/k!，极限 eˣ−1−x。<\/p>\n<p><strong>考试常见要求<\/strong>：写出前两项并估计误差。误差估计用 |φₙ−φ|≤M Lⁿ hⁿ⁺¹/(n+1)!。<\/p>\n<h3>2.4 奇解的检验流程<\/h3>\n<ol><li>\n求通解。\n<\/li><li>\n求 C-判别式。\n<\/li><li>\n回代验证是否为解。\n<\/li><li>\n验证是否与族中曲线相切。\n<\/li><li>\n确认该点李普希茨失效。\n<\/ol>\n<p>五步走完才敢下结论。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[给定 f] --&gt; B{偏导是否有界}\n    B --&gt;|是| C[李普希茨成立 唯一]\n    B --&gt;|否| D{比值是否发散}\n    D --&gt;|是| E[可能非唯一]\n    E --&gt; F[构造延迟解族]\n    D --&gt;|否| G[换方法估计]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：这张图是&quot;判唯一&quot;的判断树。注意最后一步不是&quot;一定非唯一&quot;，而是&quot;可能&quot;，还要实际构造。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：李普希茨条件像&quot;坡度限制&quot;。山坡再陡，只要坡度有上限，你走的路就是唯一的；如果某处坡度无限陡，就可能有多条路。<\/p>\n<p><strong>实例<\/strong>：f(x,y)=y^(2/3)，y(0)=0。|y^(2/3)| 在 0 附近比值发散（因为指数 &lt;1），故非唯一。解族：y=0 与 y=((x−c)/3)³（x≥c）。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为&quot;连续就唯一&quot;<\/strong>——实际上连续只保证存在。\n<\/li><li>\n<strong>别以为&quot;李普希茨必须全局&quot;<\/strong>——实际上局部够用。\n<\/li><li>\n<strong>别以为&quot;判别式算出曲线就是奇解&quot;<\/strong>——必须回代。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\nf(x,y)=y² 在 |y|≤3 上的李普希茨常数可取多少？\n<p>（答案：6。解析：|y₁²−y₂²|≤2·3|y₁−y₂|。）<\/p>\n<\/ol>\n<ol><li>\ny′=y^(2/3)，y(0)=0 唯一吗？\n<p>（答案：不唯一。解析：指数小于 1，李普希茨失效。）<\/p>\n<\/ol>\n<ol><li>\n皮卡迭代第二项怎么算？\n<p>（答案：φ₂=y₀+∫f(t,φ₁)dt。解析：逐次代入。）<\/p>\n<\/ol>\n<ol><li>\n奇解检验的最后一步是什么？\n<p>（答案：确认该点李普希茨失效。解析：否则唯一性禁止奇解。）<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n李普希茨三手法：偏导、中值、直接估。\n<\/li><li>\n非唯一靠&quot;比值发散 + 构造&quot;。\n<\/li><li>\n奇解五步检验。\n<\/ul>", "kind": "chapter", "title": "第 2 章：存在唯一性与奇解"}, "ch03": {"html": "<h1>第 3 章 高阶线性方程：解法体系<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：8 小时 | <strong>前置<\/strong>：第 2 章、教材第四章\n<\/li><li>\n<strong>对应原书<\/strong>：第三章（学习辅导 / 例题选讲）\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n按&quot;齐次 → 非齐次&quot;的顺序组织任何一道线性方程题；\n<\/li><li>\n用特征根法、待定系数法、常数变易法三条路径解常系数方程；\n<\/li><li>\n用降阶法处理已知特解的情形；\n<\/li><li>\n判断共振时特解该乘几次 t。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>高阶线性方程的解题流程是固定的：<strong>先解齐次拿基础解系，再找非齐次的一个特解<\/strong>。所有技巧都服务于这两步。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>3.1 齐次：特征根<\/h3>\n<p>特征方程 → 根 → 基础解系。三种情形（单实根、共轭复根、重根）已在教材讲过，这里只强调<strong>重根的写法<\/strong>：<\/p>\n<p>λ 是 k 重根 ⇒ e^(λx), xe^(λx), …, x^(k−1)e^(λx)。<\/p>\n<h3>3.2 非齐次：待定系数<\/h3>\n<p>右端 f(x) 为 e^(αx)Pₙ(x) 型，设特解 y*=e^(αx)Qₙ(x)x^k，其中 k 是 α 作为特征根的重数（不是根则 k=0）。<\/p>\n<p><strong>共振规则<\/strong>：α 是几重根，就乘几次 x。这一步错，整题错。<\/p>\n<p>右端含 sin/cos 时，把它看成 e^(iωx) 的实部或虚部，转成复指数处理。<\/p>\n<h3>3.3 常数变易<\/h3>\n<p>右端不是上述类型时用：<\/p>\n<div class=\"eq\">y* = Σ yᵢ(x)∫[Wᵢ/W]f dx<\/div>\n<p>W 是朗斯基行列式，Wᵢ 是把第 i 列换成 (0,…,0,1) 的行列式。<\/p>\n<h3>3.4 降阶<\/h3>\n<p>已知一个特解 y₁，令 y=u y₁：<\/p>\n<div class=\"eq\">u″ + (2y₁′/y₁ + p)u′ = f/y₁<\/div>\n<p>这是关于 u′ 的一阶线性方程。<\/p>\n<h3>3.5 欧拉方程<\/h3>\n<p>xⁿy⁽ⁿ⁾+… 型，令 x=eᵗ 化为常系数。注意 t=ln x 只在 x&gt;0 时用。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[线性方程] --&gt; B[齐次 特征根]\n    B --&gt; C[基础解系]\n    A --&gt; D[非齐次]\n    D --&gt; E{右端类型}\n    E --&gt;|指数多项式| F[待定系数 注意共振]\n    E --&gt;|其他| G[常数变易]\n    A --&gt; H[已知特解]\n    H --&gt; I[降阶]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：左边是主干，右边两个分支是&quot;非齐次怎么找特解&quot;。共振规则藏在 F 那一格里。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：齐次解像&quot;自由振动&quot;，非齐次特解像&quot;被迫振动&quot;。当外力频率与固有频率相同（共振），振幅会随时间增长——这就是为什么要乘 x。<\/p>\n<p><strong>实例<\/strong>：y″−3y′+2y=eˣ。 特征根 1、2。α=1 是一重根，故设 y<em>=Axeˣ。 代入：y<\/em>′=Aeˣ(x+1)，y<em>″=Aeˣ(x+2)。 (x+2)−3(x+1)+2x = −1，故 A=−1，y<\/em>=−xeˣ。 通解 y=C₁eˣ+C₂e^(2x)−xeˣ。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为&quot;共振就是乘一次 x&quot;<\/strong>——实际上要看重数。\n<\/li><li>\n<strong>别以为&quot;待定系数对任何右端都行&quot;<\/strong>——只对指数多项式型有效。\n<\/li><li>\n<strong>别以为&quot;降阶不用已知特解&quot;<\/strong>——它是降阶的前提。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n右端 e^(2x)，2 是二重特征根，特解该乘几次 x？\n<p>（答案：两次。解析：k 等于重数。）<\/p>\n<\/ol>\n<ol><li>\n已知 y₁=x 是某方程的特解，如何降阶？\n<p>（答案：令 y=ux，化为 u′ 的一阶方程。解析：刘维尔-达朗贝尔降阶。）<\/p>\n<\/ol>\n<ol><li>\n欧拉方程的标准换元？\n<p>（答案：x=eᵗ。解析：化为常系数。）<\/p>\n<\/ol>\n<ol><li>\n常数变易公式里的 W 是什么？\n<p>（答案：朗斯基行列式。解析：基础解系的行列式。）<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n先齐次后非齐次。\n<\/li><li>\n共振乘 x 的次数 = 重数。\n<\/li><li>\n降阶、欧拉都是化归手段。\n<\/ul>", "kind": "chapter", "title": "第 3 章：高阶线性方程"}, "ch04": {"html": "<h1>第 4 章 线性微分方程组：解法体系<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：8 小时 | <strong>前置<\/strong>：第 3 章\n<\/li><li>\n<strong>对应原书<\/strong>：第四章（学习辅导 / 例题选讲）\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n写出基解矩阵并验证它是解；\n<\/li><li>\n用三种方法求常系数方程组的解（特征向量法、矩阵指数、拉普拉斯变换）；\n<\/li><li>\n处理重特征值与复特征值两种麻烦情形；\n<\/li><li>\n用常数变易解非齐次方程组。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>方程组的解题核心是&quot;求基解矩阵&quot;。常系数时它就是 e^(At)，三种算法任选；变系数时只能靠具体构造。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>4.1 特征向量法<\/h3>\n<p>A 有 n 个线性无关特征向量 ⇒ Φ=[v₁e^(λ₁t),…]。这是最省事的情形。<\/p>\n<h3>4.2 复特征值<\/h3>\n<p>λ=α+iβ，特征向量 v=p+iq。实化解：<\/p>\n<div class=\"eq\">e^(αt)(p cos βt − q sin βt)，e^(αt)(p sin βt + q cos βt)<\/div>\n<p><strong>常见错误<\/strong>：直接把复解当答案，忘记取实部。<\/p>\n<h3>4.3 重特征值<\/h3>\n<p>若几何重数不足，需要广义特征向量。以二重根 λ 为例，若只有一个特征向量 v，则找 w 满足 (A−λI)w=v，解为<\/p>\n<div class=\"eq\">e^(λt)(v + wt)<\/div>\n<h3>4.4 矩阵指数与拉普拉斯<\/h3>\n<p>e^(At) 可用对角化或若尔当形算；也可用拉普拉斯变换：<\/p>\n<div class=\"eq\">e^(At) = L⁻¹[(sI−A)⁻¹]<\/div>\n<p>这条在考试里很好用，因为求逆矩阵是机械操作。<\/p>\n<h3>4.5 非齐次<\/h3>\n<p>x=Φ(t)[C+∫Φ⁻¹(s)b(s)ds]。若 b 是常向量且 A 可逆，特解就是 −A⁻¹b。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[方程组] --&gt; B{常系数}\n    B --&gt;|是| C[特征向量法]\n    B --&gt;|是| D[矩阵指数]\n    B --&gt;|是| E[拉普拉斯]\n    B --&gt;|否| F[构造基解矩阵]\n    C --&gt; G[非齐次 常数变易]\n    D --&gt; G\n    E --&gt; G<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：三条常系数路线等价，选最顺手的；变系数只能老老实实构造。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：基解矩阵像&quot;三根独立弹簧的振动&quot;——每个特征方向各振各的，合成任意初值。<\/p>\n<p><strong>实例<\/strong>：A=[[1,1],[4,1]]。特征值 3、−1，特征向量 (1,2)、(−1,2)。 Φ=[[e^(3t),−e^(−t)],[2e^(3t),2e^(−t)]]。 验证 det Φ=2e^(2t)+2e^(2t)=4e^(2t)≠0，且 tr A=2，刘维尔给 e^(2t)，相差常数 4，一致。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为&quot;复特征值直接写复解就行&quot;<\/strong>——实问题必须取实部。\n<\/li><li>\n<strong>别以为&quot;重根只有一个解&quot;<\/strong>——还有广义特征向量给的第二个。\n<\/li><li>\n<strong>别以为&quot;拉普拉斯只对初值问题有效&quot;<\/strong>——也可处理非齐次，但要注意初值项。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n复特征值 α±iβ 的实化解有几个？\n<p>（答案：两个。解析：实部虚部各一个。）<\/p>\n<\/ol>\n<ol><li>\n二重根 λ，只有一个特征向量时第二个解是什么？\n<p>（答案：e^(λt)(v+wt)，w 为广义特征向量。解析：(A−λI)w=v。）<\/p>\n<\/ol>\n<ol><li>\ne^(At) 的拉普拉斯表示？\n<p>（答案：L⁻¹[(sI−A)⁻¹]。解析：矩阵版本的变换。）<\/p>\n<\/ol>\n<ol><li>\n非齐次常向量 b 的特解？\n<p>（答案：−A⁻¹b（A 可逆时）。解析：设常特解代入。）<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n基解矩阵是核心。\n<\/li><li>\n复根取实部，重根找广义向量。\n<\/li><li>\n三条常系数路线等价。\n<\/ul>", "kind": "chapter", "title": "第 4 章：线性微分方程组"}, "ch05": {"html": "<h1>第 5 章 非线性方程与稳定性：解题指导<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：7 小时 | <strong>前置<\/strong>：第 4 章\n<\/li><li>\n<strong>对应原书<\/strong>：第五章（学习辅导 / 补充提高）\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n按固定流程做稳定性分析（找平衡点 → 线性化 → 判谱 → 必要时找 V）；\n<\/li><li>\n用 V 函数完成一道完整的稳定性证明；\n<\/li><li>\n判断极限环是否存在（平面情形）；\n<\/li><li>\n说明&quot;线性化失效&quot;时该怎么继续。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>稳定性题的流程是标准化的：<strong>平衡点 → 雅可比 → 特征值 → 分类 → 结论<\/strong>。非双曲时才需要额外的 V 函数，而 V 的构造有套路可循。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>5.1 标准流程<\/h3>\n<ol><li>\n解 f(x)=0 找平衡点。\n<\/li><li>\n在每个平衡点算雅可比 J。\n<\/li><li>\n算 J 的特征值。\n<\/li><li>\n实部全负 → 渐近稳定；有正 → 不稳定；有零 → 临界。\n<\/li><li>\n临界时构造 V 或找守恒量。\n<\/ol>\n<p><strong>第 5 步是分水岭<\/strong>：前面的步骤纯代数，第 5 步靠经验。<\/p>\n<h3>5.2 V 函数的构造套路<\/h3>\n<ul><li>\n<strong>二次型<\/strong>：V=ax²+bxy+cy²，用待定系数让 V̇ 负定。\n<\/li><li>\n<strong>能量型<\/strong>：机械系统取动能+势能。\n<\/li><li>\n<strong>平方和<\/strong>：V=Σ(xᵢ−xᵢ*)²，适合对称系统。\n<\/ul>\n<p>以线性系统 ẋ=Ax 为例，取 V=xᵀPx，则 V̇=xᵀ(AᵀP+PA)x。要求负定 ⇔ 解李雅普诺夫方程 AᵀP+PA=−Q（Q 正定）。这是一套可计算的流程，不是碰运气。<\/p>\n<h3>5.3 极限环<\/h3>\n<p>平面系统：构造环形捕获域（外圈向内、内圈向外），域内无平衡点 ⇒ 存在闭轨。<\/p>\n<p>稳定性的判据用庞加莱映射导数，或直接用&quot;轨线是趋近还是远离&quot;的几何判断。<\/p>\n<h3>5.4 常见考试题型<\/h3>\n<ul><li>\n给一个含参数系统，问参数取何值时稳定。答：算特征值，让实部为负，解不等式。\n<\/li><li>\n给一个 V，问能否判稳。答：验证正定性与 V̇ 的符号。\n<\/li><li>\n判断某系统有无闭轨。答：捕获域。\n<\/ul>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[f x = 0] --&gt; B[平衡点]\n    B --&gt; C[雅可比 J]\n    C --&gt; D[特征值]\n    D --&gt; E{实部}\n    E --&gt;|全负| F[渐近稳定]\n    E --&gt;|有正| G[不稳定]\n    E --&gt;|有零| H[临界]\n    H --&gt; I[构造 V 或守恒量]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：前四步是机械的，第五步才开始动脑。考试失分多在第 1 步（漏平衡点）。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：找平衡点像找&quot;地势平坦处&quot;；线性化像&quot;在平坦处测坡度&quot;；V 函数像&quot;找一个高度计&quot;。<\/p>\n<p><strong>实例<\/strong>：ẋ=−x+x³。平衡点 0、±1。 J=−1+3x²。在 0 处 J=−1（稳定）；在 ±1 处 J=2（不稳定）。 结论：0 渐近稳定，±1 不稳定。这是一维的双稳态结构。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为&quot;平衡点只有一个&quot;<\/strong>——实际上可能多个，必须全找。\n<\/li><li>\n<strong>别以为&quot;V 只能靠猜&quot;<\/strong>——线性系统有李雅普诺夫方程可解。\n<\/li><li>\n<strong>别以为&quot;临界就等于不稳定&quot;<\/strong>——可能是稳定非渐近。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\nẋ=−x+x³ 的平衡点与稳定性？\n<p>（答案：0 稳定，±1 不稳定。解析：J=−1+3x²。）<\/p>\n<\/ol>\n<ol><li>\n线性系统 V=xᵀPx 的导数是什么？\n<p>（答案：xᵀ(AᵀP+PA)x。解析：直接求导。）<\/p>\n<\/ol>\n<ol><li>\n李雅普诺夫方程的形式？\n<p>（答案：AᵀP+PA=−Q。解析：Q 正定则 P 正定，可判稳。）<\/p>\n<\/ol>\n<ol><li>\n极限环存在需要什么区域？\n<p>（答案：环形捕获域，且内部无平衡点。解析：庞加莱-本迪克松。）<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n五步流程，第一步别漏。\n<\/li><li>\nV 有套路：二次型、能量、平方和。\n<\/li><li>\n临界不等于不稳定。\n<\/ul>", "kind": "chapter", "title": "第 5 章：非线性与稳定性"}, "ch06": {"html": "<h1>第 6 章 一阶偏微分方程与边值问题：解题指导<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：6 小时 | <strong>前置<\/strong>：第 2、4 章\n<\/li><li>\n<strong>对应原书<\/strong>：第六章、第七章（学习辅导）\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n用首次积分写出齐次 PDE 的通解；\n<\/li><li>\n用特征线法解拟线性方程并验证非特征条件；\n<\/li><li>\n判断边值问题是否有唯一解；\n<\/li><li>\n用格林函数表示非齐次边值问题的解。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>这两类问题共享一个思路：<strong>先找&quot;结构&quot;（首次积分/齐次解），再用结构表示一般解<\/strong>。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>6.1 齐次 PDE<\/h3>\n<p>a u_x+b u_y=0。特征线 dy/dx=b/a，首次积分 Φ。通解 u=F(Φ)。<\/p>\n<p><strong>验证方法<\/strong>：把 u=F(Φ) 代回，用链式法则 u_x=F′Φ_x，u_y=F′Φ_y，于是 aF′Φ_x+bF′Φ_y=F′(aΦ_x+bΦ_y)=0（因为 Φ 是首次积分）。<\/p>\n<h3>6.2 拟线性与柯西问题<\/h3>\n<p>特征方程组 dx/ds=a，dy/ds=b，du/ds=c。以初始曲线参数 τ 为另一参数，解出 (x(s,τ), y(s,τ), u(s,τ))，消去 s、τ 得隐式解。<\/p>\n<p>非特征条件 a y_τ−b x_τ≠0 必须验证，否则解不唯一。<\/p>\n<h3>6.3 边值问题<\/h3>\n<p>先解齐次 Ly=0：<\/p>\n<ul><li>\n只有零解 ⇒ 非齐次对任意 f 唯一可解（用格林函数表示）。\n<\/li><li>\n有非零解 ⇒ 非齐次需满足正交条件，否则无解。\n<\/ul>\n<h3>6.4 格林函数<\/h3>\n<p>对 y″=f，y(0)=y(1)=0，格林函数<\/p>\n<div class=\"eq\">G(x,s)=−s(1−x)（x>s），−x(1−s)（x<s）<\/div>\n<p>解 y=∫G(x,s)f(s)ds。格林函数的物理意义是&quot;单位点源引起的响应&quot;。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[PDE] --&gt; B[特征线]\n    B --&gt; C[首次积分]\n    C --&gt; D[通解 F of Phi]\n    A --&gt; E[柯西问题]\n    E --&gt; F{非特征条件}\n    F --&gt;|满足| G[唯一解]\n    F --&gt;|不满足| H[不唯一或无解]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：左侧是&quot;通解&quot;，右侧是&quot;定解&quot;。两者之间靠参 数化连接。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：格林函数像&quot;在一个点上敲一下，整根弦怎么响应&quot;。任意外力等于无数个点源叠加，所以解就是积分。<\/p>\n<p><strong>实例<\/strong>：u_x+u_y=u，u(x,0)=x。 特征方程：dx/ds=1，dy/ds=1，du/ds=u。 解：x=s+x₀，y=s，u=u₀e^s。初始 y=0 ⇒ s=0，x₀=τ，u₀=τ。 由 y=s 得 s=y，x₀=x−y。故 u=(x−y)e^y。 验证：u_x=e^y，u_y=−e^y+(x−y)e^y，和=(x−y)e^y=u。边界 u(x,0)=x。正确。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为&quot;通解就是所有解&quot;<\/strong>——可能还有奇解。\n<\/li><li>\n<strong>别以为&quot;柯西问题随便给初值都能解&quot;<\/strong>——非特征条件是硬要求。\n<\/li><li>\n<strong>别以为&quot;边值问题一定有解&quot;<\/strong>——见齐次有非零解的情形。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\nu_x+2u_y=0 的通解？\n<p>（答案：u=F(x−y/2)。解析：特征线 x−y/2=const。）<\/p>\n<\/ol>\n<ol><li>\n格林函数的作用？\n<p>（答案：表示单位点源的响应，叠加得一般解。解析：线性叠加原理。）<\/p>\n<\/ol>\n<ol><li>\n非特征条件的式子？\n<p>（答案：a y_τ−b x_τ≠0。解析：初始曲线不能与特征线相切。）<\/p>\n<\/ol>\n<ol><li>\n边值问题何时无解？\n<p>（答案：齐次有非零解且非齐次右端不满足正交条件。解析：弗雷德霍姆二择一。）<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n齐次 PDE：u=F(Φ)。\n<\/li><li>\n拟线性：特征线织曲面 + 非特征条件。\n<\/li><li>\n边值：先齐次，再二择一。\n<\/ul>", "kind": "chapter", "title": "第 6 章：PDE 与边值问题"}, "ch07": {"html": "<h1>第 7 章 期中期末与考研试题选讲<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：8 小时 | <strong>前置<\/strong>：第 1–6 章\n<\/li><li>\n<strong>对应原书<\/strong>：第九章（期中、期末与考研试题）\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n按题型（计算、证明、应用）分配考场时间；\n<\/li><li>\n识别考研真题中&quot;换了个包装&quot;的经典模型；\n<\/li><li>\n用标准套路完成证明题（存在唯一、稳定性、边值）；\n<\/li><li>\n避开&quot;算对一半、写错结论&quot;的高频失分点。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>考试不考&quot;你学过多少&quot;，考&quot;你能在多短时间内认出这是哪类题&quot;。<strong>认题比算题更值钱<\/strong>。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>7.1 题型分布（据历年试题归纳）<\/h3>\n<table><thead><tr><th>题型<\/th><th>占比<\/th><th>常考内容<\/th><\/tr><\/thead><tbody><tr><td>计算<\/td><td>50%<\/td><td>一阶方程、常系数线性、方程组<\/td><\/tr><tr><td>证明<\/td><td>30%<\/td><td>存在唯一、稳定性、解的性质<\/td><\/tr><tr><td>应用<\/td><td>20%<\/td><td>建模、几何解释、参数讨论<\/td><\/tr><\/tbody><\/table>\n<h3>7.2 计算题的&quot;三分钟识别法&quot;<\/h3>\n<ol><li>\n看阶数：一阶走第一章路线；二阶看是否常系数。\n<\/li><li>\n看右端：是不是 e^(αx)Pₙ 型？是则待定系数。\n<\/li><li>\n看是否有参数：有参数多半要讨论取值范围（稳定域）。\n<\/ol>\n<h3>7.3 证明题的四个模板<\/h3>\n<ul><li>\n<strong>存在唯一<\/strong>：验证李普希茨 → 引用定理 → 写出 h。\n<\/li><li>\n<strong>稳定性<\/strong>：算雅可比 → 特征值 → 结论；非双曲补 V。\n<\/li><li>\n<strong>解的性质<\/strong>：作差 → 格朗沃尔 → 得界。\n<\/li><li>\n<strong>边值可解性<\/strong>：齐次 → 二择一。\n<\/ul>\n<h3>7.4 高频失分点<\/h3>\n<ol><li>\n通解漏掉奇解或常数解。\n<\/li><li>\n待定系数忘了共振的 x 因子。\n<\/li><li>\n稳定性题只算了一个平衡点。\n<\/li><li>\n证明题引用了定理却没验证条件。\n<\/li><li>\n应用题解完不检验量纲。\n<\/ol>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[拿到题] --&gt; B{计算还是证明}\n    B --&gt;|计算| C[三分钟识别]\n    C --&gt; D[套标准流程]\n    B --&gt;|证明| E[选模板]\n    E --&gt; F[验证条件]\n    F --&gt; G[写结论]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：分叉点在&quot;计算/证明&quot;。证明题的失分几乎都在&quot;验证条件&quot;这一步。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：考场像&quot;急诊分诊&quot;。先判断这是哪一科（题型），再叫对应科室（模板），不要一上来就埋头算。<\/p>\n<p><strong>实例<\/strong>（考研改编）：设 f 连续且满足 |f(x,y)|≤M，证明 y′=f(x,y)，y(0)=0 的解在 |x|≤b/M 上存在。 答：这题不需要李普希茨（因为只证存在）。用皮亚诺定理：f 连续，矩形内 |f|≤M，故 h=min(a,b/M)。结论成立。<\/p>\n<p><strong>注意<\/strong>：如果题目问&quot;唯一&quot;，就必须补验李普希茨。这是最常见的&quot;条件没验全&quot;。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为&quot;证明题可以只写结论&quot;<\/strong>——必须写出条件验证。\n<\/li><li>\n<strong>别以为&quot;计算题越快越好&quot;<\/strong>——漏解比慢更亏。\n<\/li><li>\n<strong>别以为&quot;应用题不用检验&quot;<\/strong>——量纲和极限行为是送分点。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n证明&quot;存在唯一&quot;必须验证什么？\n<p>（答案：李普希茨条件，并给出 h。解析：缺条件不能引用定理。）<\/p>\n<\/ol>\n<ol><li>\n待定系数法最容易错在哪？\n<p>（答案：共振时忘记乘 x^k。解析：k 为重数。）<\/p>\n<\/ol>\n<ol><li>\n稳定性题漏平衡点会怎样？\n<p>（答案：结论不完整。解析：每个平衡点都要分析。）<\/p>\n<\/ol>\n<ol><li>\n应用题最后一步做什么？\n<p>（答案：回代检验量纲与长期行为。解析：建模可能出错。）<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n先认题，再算题。\n<\/li><li>\n证明四模板。\n<\/li><li>\n五个高频失分点。\n<\/ul>", "kind": "chapter", "title": "第 7 章：期中期末与考研试题"}, "ch08": {"html": "<h1>第 8 章 数学软件与数值实验<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：4 小时 | <strong>前置<\/strong>：第 1–7 章\n<\/li><li>\n<strong>对应原书<\/strong>：第十章（数学软件）\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n用 SymPy/Mathematica 符号求解一阶与线性方程；\n<\/li><li>\n用 MATLAB/SCILAB 做数值积分并画相图；\n<\/li><li>\n说明符号解与数值解各自的边界；\n<\/li><li>\n用软件验证手算结果（这是最实用的用法）。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>软件不是用来&quot;代替手算&quot;的，而是用来<strong>验证手算和画图<\/strong>的。符号解告诉你公式对不对，数值解告诉你轨线长什么样。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>8.1 符号求解<\/h3>\n<p>SymPy：<\/p>\n<pre class=\"lang-python\"><code>from sympy import Function, dsolve, Eq, symbols\nx = symbols(&#x27;x&#x27;); y = Function(&#x27;y&#x27;)\ndsolve(Eq(y(x).diff(x), x + y(x)), y(x))<\/code><\/pre>\n<p>输出含 eˣ 与积分项，可与手算对照。<\/p>\n<p>Mathematica：DSolve[{y&#x27;[x]==x+y[x], y[0]==0}, y[x], x]。 Maple：dsolve({diff(y(x),x)=x+y(x), y(0)=0})。<\/p>\n<h3>8.2 数值求解<\/h3>\n<p>MATLAB：ode45(@(t,y) t+y, [0 5], 0)。 SCILAB：ode(0, t, y0, f)。<\/p>\n<p><strong>注意<\/strong>：数值解只给一个初值对应的一条轨线，不能代替相图分析。<\/p>\n<h3>8.3 画相图<\/h3>\n<p>用 quiver（MATLAB）或 matplotlib 的 streamplot 画向量场。这是理解定性理论最直观的方式。<\/p>\n<h3>8.4 验证流程<\/h3>\n<ol><li>\n手算得解。\n<\/li><li>\n软件符号求解，比对形式。\n<\/li><li>\n数值积分，比对数值。\n<\/li><li>\n画图，检查定性行为（是否闭合、是否收敛）。\n<\/ol>\n<p>四步走完，答案基本可靠。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n    A[手算] --&gt; B[符号求解比对]\n    B --&gt; C[数值积分比对]\n    C --&gt; D[画图检验定性]\n    D --&gt; E[结论]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：这是一条&quot;四重校验&quot;链。任何一环不符，就回头查手算。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：软件像&quot;计算器 + 望远镜&quot;。计算器验算，望远镜看全局形状。两者都不能代替你理解题目。<\/p>\n<p><strong>失效边界<\/strong>：符号求解在无初等解时会返回隐式或未求值形式；数值求解在刚性方程上会失真。<\/p>\n<p><strong>实例<\/strong>：y′=y²，y(0)=1 的手算解是 1/(1−t)，在 t=1 爆破。数值积分到 t=1 附近会出现溢出——这正好验证了&quot;最大区间有限&quot;的结论。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为&quot;软件给的解一定对&quot;<\/strong>——符号解可能漏分支。\n<\/li><li>\n<strong>别以为&quot;数值解能看出稳定性&quot;<\/strong>——单条轨线看不出全局。\n<\/li><li>\n<strong>别以为&quot;软件能替代证明&quot;<\/strong>——它只给计算结果。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\nSymPy 求解析解的函数？\n<p>（答案：dsolve。解析：符号求解入口。）<\/p>\n<\/ol>\n<ol><li>\n数值解能代替相图吗？\n<p>（答案：不能。解析：只给单条轨线。）<\/p>\n<\/ol>\n<ol><li>\n刚性方程数值积分为何失真？\n<p>（答案：显式方法需要极小步长，否则不稳定。解析：刚性导致稳定域限制。）<\/p>\n<\/ol>\n<ol><li>\n软件验证的四步？\n<p>（答案：手算、符号、数值、画图。解析：四重校验。）<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n符号解验公式，数值解验数值，画图验定性。\n<\/li><li>\n软件不能替代证明。\n<\/li><li>\n四重校验流程。\n<\/ul>", "kind": "chapter", "title": "第 8 章：数学软件"}, "c01": {"html": "<h1>积分因子的判别与求法<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 1 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>使 P dx+Q dy 变成全微分的乘子 μ；只有 μ 依赖单个变量时才有通用公式。<\/p>\n<h2>为什么重要<\/h2>\n<p>它是&quot;不恰当方程&quot;唯一的通用补救手段，也是判断顺序里最关键的一格。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[P dx+Q dy=0] --&gt; B{(P_y-Q_x)/Q 只含 x}\n    B --&gt;|是| C[mu = exp of integral]\n    B --&gt;|否| D{(Q_x-P_y)/P 只含 y}\n    D --&gt;|是| E[mu = exp of integral]\n    D --&gt;|否| F[试特殊组合 或放弃]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>μ 的方程本身是一阶 PDE，一般难解；两个商式判据是它退化成 ODE 的条件。<\/p>\n<p>求 μ 后必须整条方程乘上，包括右端。常见错误是只乘一边。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为任何方程都有单变量积分因子。\n<\/li><li>\n别以为求出 μ 就完事（还要积分求 u）。\n<\/li><li>\n别以为 μ 唯一（可乘任意常数，也可能有多种）。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 1 章<\/td><td>解题指导<\/td><td>判断顺序第三格<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：恰当方程\n<\/li><li>\n后续：首次积分\n<\/ul>", "kind": "concept", "title": "积分因子"}, "c02": {"html": "<h1>共振与特解形式<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 3 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>当非齐次项的指数 α 恰好是特征根时，特解要额外乘 x^k（k 为重数）。<\/p>\n<h2>为什么重要<\/h2>\n<p>这是待定系数法唯一容易错的地方，也是&quot;物理共振&quot;的数学根源。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[右端 e^ax P_n] --&gt; B{alpha 是否特征根}\n    B --&gt;|否| C[k=0]\n    B --&gt;|是 m 重| D[k=m]\n    C --&gt; E[特解 e^ax Q_n]\n    D --&gt; E<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>道理在于：不乘 x 时，代入后低阶项相消，方程退化，解不出系数。乘 x^k 恰好补回丢失的阶。<\/p>\n<p>物理上，共振时外力与自由振动同频，能量持续注入，振幅线性（或多项式）增长。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为共振只乘一次 x。\n<\/li><li>\n别以为右端是 sin 就不用管共振（要转成复指数看）。\n<\/li><li>\n别以为 k 与方程阶数有关。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 3 章<\/td><td>待定系数<\/td><td>k = 重数<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：特征根\n<\/li><li>\n后续：受迫振动、参数共振\n<\/ul>", "kind": "concept", "title": "共振与特解形式"}, "c03": {"html": "<h1>李雅普诺夫方程<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：第 5 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>AᵀP+PA=−Q，给定正定 Q 解出 P；P 正定则系统 ẋ=Ax 渐近稳定。<\/p>\n<h2>为什么重要<\/h2>\n<p>它把&quot;构造 V 函数&quot;这件凭经验的事，变成了可计算的线性方程组。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n    A[给定 Q 正定] --&gt; B[解 A^T P + P A = -Q]\n    B --&gt; C{P 是否正定}\n    C --&gt;|是| D[渐近稳定]\n    C --&gt;|否| E[不稳定]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>这是二次型 V=xᵀPx 的直接推论：V̇=xᵀ(AᵀP+PA)x=−xᵀQx&lt;0。<\/p>\n<p>定理（李雅普诺夫）：A 的所有特征值实部为负 ⇔ 对任意正定 Q，方程有唯一正定解 P。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 P 可以随便取（必须解方程）。\n<\/li><li>\n别以为只对一维有效。\n<\/li><li>\n别以为 Q 必须为单位阵（任意正定都行）。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 5 章<\/td><td>V 的构造<\/td><td>可计算流程<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：二次型、正定性\n<\/li><li>\n后续：LQR、Lyapunov 稳定性理论\n<\/ul>", "kind": "concept", "title": "李雅普诺夫方程"}, "__path__": {"html": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：一阶方程解题<\/strong><br>阅读：<a href=\"#/chapter/ch01\">第 1 章：一阶方程解题指导<\/a><br>检查点：一分钟定路线<\/li><li class='path-step' id='path-02'><strong>步骤 02：存在唯一性<\/strong><br>阅读：<a href=\"#/chapter/ch02\">第 2 章：存在唯一性与奇解<\/a><br>检查点：验证李普希茨<\/li><li class='path-step' id='path-03'><strong>步骤 03：高阶线性<\/strong><br>阅读：<a href=\"#/chapter/ch03\">第 3 章：高阶线性方程<\/a><br>检查点：共振规则<\/li><li class='path-step' id='path-04'><strong>步骤 04：方程组<\/strong><br>阅读：<a href=\"#/chapter/ch04\">第 4 章：线性微分方程组<\/a><br>检查点：算基解矩阵<\/li><li class='path-step' id='path-05'><strong>步骤 05：稳定性<\/strong><br>阅读：<a href=\"#/chapter/ch05\">第 5 章：非线性与稳定性<\/a><br>检查点：五步流程<\/li><li class='path-step' id='path-06'><strong>步骤 06：PDE 与边值<\/strong><br>阅读：<a href=\"#/chapter/ch06\">第 6 章：PDE 与边值问题<\/a><br>检查点：特征线法<\/li><li class='path-step' id='path-07'><strong>步骤 07：试题选讲<\/strong><br>阅读：<a href=\"#/chapter/ch07\">第 7 章：期中期末与考研试题<\/a><br>检查点：认题<\/li><li class='path-step' id='path-08'><strong>步骤 08：数学软件<\/strong><br>阅读：<a href=\"#/chapter/ch08\">第 8 章：数学软件<\/a><br>检查点：四重校验<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "kind": "path", "title": "学习路径"}, "__quiz_all__": {"html": "<p>（无综合题）<\/p>", "kind": "quiz", "title": "综合测验"}, "__quiz_ch01__": {"html": "<h1>测验：第 1 章：一阶方程解题指导<\/h1><div class='quiz-item' data-qid='q01' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 判断一阶方程解法路线的第一格是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q01' value='0'> 恰当<\/label><label class='quiz-opt'><input type='radio' name='q01' value='1'> 可分离<\/label><label class='quiz-opt'><input type='radio' name='q01' value='2'> 换元<\/label><label class='quiz-opt'><input type='radio' name='q01' value='3'> 隐式<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q02' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 分离变量时 g(y₀)=0 意味着？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q02' value='0'> 无解<\/label><label class='quiz-opt'><input type='radio' name='q02' value='1'> y≡y₀ 也是解<\/label><label class='quiz-opt'><input type='radio' name='q02' value='2'> 方程退化<\/label><label class='quiz-opt'><input type='radio' name='q02' value='3'> 需积分因子<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q03' data-type='single'><p class='quiz-q'><b>Q3.<\/b> 找 μ 后最容易犯的错？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q03' value='0'> 忘记积分<\/label><label class='quiz-opt'><input type='radio' name='q03' value='1'> 只乘一边<\/label><label class='quiz-opt'><input type='radio' name='q03' value='2'> 符号错<\/label><label class='quiz-opt'><input type='radio' name='q03' value='3'> 常数错<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch02__": {"html": "<h1>测验：第 2 章：存在唯一性与奇解<\/h1><div class='quiz-item' data-qid='q04' data-type='single'><p class='quiz-q'><b>Q1.<\/b> f=y² 在 |y|≤3 上的李普希茨常数？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q04' value='0'> 1<\/label><label class='quiz-opt'><input type='radio' name='q04' value='1'> 3<\/label><label class='quiz-opt'><input type='radio' name='q04' value='2'> 6<\/label><label class='quiz-opt'><input type='radio' name='q04' value='3'> 9<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q05' data-type='single'><p class='quiz-q'><b>Q2.<\/b> y′=y^(2/3)，y(0)=0 的解？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q05' value='0'> 唯一<\/label><label class='quiz-opt'><input type='radio' name='q05' value='1'> 两个<\/label><label class='quiz-opt'><input type='radio' name='q05' value='2'> 无穷多<\/label><label class='quiz-opt'><input type='radio' name='q05' value='3'> 不存在<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch03__": {"html": "<h1>测验：第 3 章：高阶线性方程<\/h1><div class='quiz-item' data-qid='q06' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 右端 e^(2x)，2 是二重根，特解乘几次 x？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q06' value='0'> 0<\/label><label class='quiz-opt'><input type='radio' name='q06' value='1'> 1<\/label><label class='quiz-opt'><input type='radio' name='q06' value='2'> 2<\/label><label class='quiz-opt'><input type='radio' name='q06' value='3'> 3<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q07' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 常数变易中的 W 指？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q07' value='0'> 权重<\/label><label class='quiz-opt'><input type='radio' name='q07' value='1'> 朗斯基行列式<\/label><label class='quiz-opt'><input type='radio' name='q07' value='2'> 若尔当块<\/label><label class='quiz-opt'><input type='radio' name='q07' value='3'> 逆矩阵<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch04__": {"html": "<h1>测验：第 4 章：线性微分方程组<\/h1><div class='quiz-item' data-qid='q08' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 复特征值的实化解有几个？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q08' value='0'> 1<\/label><label class='quiz-opt'><input type='radio' name='q08' value='1'> 2<\/label><label class='quiz-opt'><input type='radio' name='q08' value='2'> 4<\/label><label class='quiz-opt'><input type='radio' name='q08' value='3'> 无穷<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q09' data-type='single'><p class='quiz-q'><b>Q2.<\/b> e^(At) 的拉普拉斯表示？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q09' value='0'> L[(sI−A)]<\/label><label class='quiz-opt'><input type='radio' name='q09' value='1'> L⁻¹[(sI−A)⁻¹]<\/label><label class='quiz-opt'><input type='radio' name='q09' value='2'> L[(sI−A)⁻¹]<\/label><label class='quiz-opt'><input type='radio' name='q09' value='3'> det(sI−A)<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span>
